<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spikiu · Mein</title>
<link rel="stylesheet" href="/fonts/spikiu-fonts.css">
<style>
:root{--pink:#ff4f9a;--sage:#9bd14a;--mustard:#ffd24a;--cyan:#2bb3d4;--terra:#ff6b5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{--bg:#eef7f1;--ink:#15163a;--acc:#1f93b0;--muted:#5f7068;--de:#f1faf5;--ow:2.5px;
 background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column;min-height:100%}
@media (min-width:700px) and (min-height:560px){html{font-size:17px}
 body{background:#15163a;background-image:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1px);background-size:22px 22px;padding:24px;height:100%}
 .frame{width:min(460px,94vw);height:min(880px,90vh);margin:auto;border-radius:28px;box-shadow:9px 11px 0 rgba(0,0,0,.22);border:2.5px solid var(--ink);overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}}
.frame{flex:1;display:flex;flex-direction:column;min-height:0}
.head{flex:0 0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1.1rem .7rem;display:flex;align-items:center;gap:.6rem;border-bottom:var(--ow) solid var(--ink);background:rgba(255,255,255,.72)}
.logo{width:34px;height:34px;border-radius:999px;background:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 var(--ink)}
.logo svg{width:26px;height:26px}
.head h1{font-family:'Archivo Black',sans-serif;font-size:1.15rem}
.body{flex:1;min-height:0;overflow:auto;padding:1.1rem 1.05rem 1.4rem;max-width:560px;width:100%;margin:0 auto}
.card{background:#fff;border:var(--ow) solid var(--ink);border-radius:18px;box-shadow:4px 5px 0 var(--ink);padding:1rem;margin-bottom:1rem}
.usercard{position:relative;padding:1.2rem 1rem}
.usercard .abo-badge{position:absolute;top:.85rem;right:.85rem}
.uc-mono{width:64px;height:64px;border-radius:18px;background:#d3eef6;border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;font:2.3rem 'Archivo Black',sans-serif;color:var(--ink);text-transform:uppercase}
.uc-mail{margin-top:.8rem;font:600 .96rem/1.3 'DM Sans',sans-serif;color:var(--muted);word-break:break-word}
.abo-badge{display:inline-block;font:800 .72rem 'DM Sans',sans-serif;border:2px solid var(--ink);border-radius:999px;padding:.22rem .65rem;box-shadow:2px 2px 0 var(--ink)}
.abo-badge.is-free{background:#eef7f1;color:var(--ink)}
.abo-badge.is-premium{background:var(--mustard);color:var(--ink)}
.sec-lbl{font:500 .62rem/1 'DM Mono',monospace;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin:.2rem .2rem .5rem}
.rowcard{background:#fff;border:var(--ow) solid var(--ink);border-radius:18px;box-shadow:4px 5px 0 var(--ink);padding:.2rem .7rem;margin-bottom:1rem}
.row{display:flex;align-items:center;gap:.8rem;padding:.85rem .3rem;border-bottom:1.5px solid #e6efe8;cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font-family:inherit;color:inherit}
.row:last-child{border-bottom:0}.row:active{background:#f4f9f5;border-radius:10px}
.row .ic{flex:0 0 34px;width:34px;height:34px;border-radius:10px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:1.05rem}
.row .rl{flex:1;display:flex;flex-direction:column;min-width:0}.row .rt{font-weight:700;font-size:.98rem}.row .rs{font-size:.76rem;color:var(--muted);margin-top:.05rem}
.row .chev{color:var(--muted);font-size:1.1rem}
.row .tag{font:800 .6rem 'DM Sans';padding:.2rem .5rem;border-radius:999px;border:2px solid var(--ink);background:var(--mustard);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:6rem;transform:translateX(-50%);z-index:400;background:var(--ink);color:#fff;font-weight:700;font-size:.82rem;padding:.5rem .85rem;border-radius:999px;box-shadow:3px 3px 0 rgba(0,0,0,.3);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* Raum-Regel: Zurueck-Pfeil oben, keine Bottom-Nav (Ebene 2). */
.rnav{display:flex;align-items:center;gap:.7rem;padding:calc(.6rem + env(safe-area-inset-top)) .9rem .6rem;background:#eef7f1;border-bottom:2.5px solid #15163a}
.rnav .back{width:36px;height:36px;flex:0 0 36px;border-radius:999px;border:2.5px solid #15163a;background:#fff;font-size:1.15rem;line-height:1;box-shadow:2px 2px 0 #15163a;display:flex;align-items:center;justify-content:center;cursor:pointer}
.rnav .back:active{transform:translate(1px,1px);box-shadow:0 0 0 #15163a}
.rnav .rtitle{font:800 1.05rem 'DM Sans',sans-serif;color:#15163a}
</style></head>
<body>
<header class="rnav"><button class="back" onclick="location.href='haus.html'" aria-label="zurück" data-ta="back">‹</button><div class="rtitle" data-t="title">Mein</div></header>
<div class="frame">
  
  <div class="body">
    <div class="card usercard">
      <span class="abo-badge" id="aboBadge">Free</span>
      <div class="uc-mono" id="mono">S</div>
      <div class="uc-mail" id="umail">—</div>
    </div>

    <div class="sec-lbl" data-t="lernen">Lernen</div>
    <div class="rowcard">
      <button class="row" data-go="dashboard.html#lernweg"><span class="ic" style="background:var(--sage)">🌱</span><span class="rl"><span class="rt" data-t="weg">Lernweg</span><span class="rs" data-t="wegs">Dein Weg — was als Nächstes wächst</span></span><span class="chev">›</span></button>
    </div>

    <div class="sec-lbl" data-t="konto">Konto</div>
    <div class="rowcard">
      <button class="row" data-go="spikiu-products.html"><span class="ic" style="background:var(--mustard)">✦</span><span class="rl"><span class="rt" data-t="abo">Abonnement</span><span class="rs" data-t="abos">Dein Spikiu-Abo verwalten</span></span><span class="tag" data-t="aktiv">Aktiv</span></button>
      <button class="row" data-soon="Einstellungen kommen bald" data-ts="einstSoon"><span class="ic" style="background:#fff">⚙️</span><span class="rl"><span class="rt" data-t="einst">Einstellungen</span><span class="rs" data-t="einsts">Sprache, Muttersprache, Ton, Datenschutz</span></span><span class="chev">›</span></button>
    </div>

    <div class="sec-lbl" data-t="mehr">Mehr</div>
    <div class="rowcard">
      <button class="row" data-soon="Über Spikiu & Hilfe kommen bald" data-ts="hilfeSoon"><span class="ic" style="background:#fff">🐾</span><span class="rl"><span class="rt" data-t="hilfe">Über Spikiu & Hilfe</span></span><span class="chev">›</span></button>
      <button class="row" id="logout"><span class="ic" style="background:#fff">↩︎</span><span class="rl"><span class="rt" style="color:var(--terra)" data-t="abmelden">Abmelden</span></span></button>
    </div>
  </div>
  
</div>
<div class="toast" id="toast"></div>
<script>
/* ===== Sprache (10.10.2026): Muttersprache des Lerners → spikiu_lang → de ===== */
var ML=(function(){try{var m=(JSON.parse(localStorage.getItem('spikiu_user')||'{}').profile||{}).muttersprache;if(['de','es','en','el'].indexOf(m)>-1)return m;}catch(e){}
 try{var l=localStorage.getItem('spikiu_lang');if(['de','es','en','el'].indexOf(l)>-1)return l;}catch(e){}return 'de';})();
var MT={
 de:{doc:'Spikiu · Mein',title:'Mein',back:'zurück',lernen:'Lernen',weg:'Lernweg',wegs:'Dein Weg — was als Nächstes wächst',konto:'Konto',abo:'Abonnement',abos:'Dein Spikiu-Abo verwalten',aktiv:'Aktiv',
  einst:'Einstellungen',einsts:'Sprache, Muttersprache, Ton, Datenschutz',einstSoon:'Einstellungen kommen bald',mehr:'Mehr',hilfe:'Über Spikiu & Hilfe',hilfeSoon:'Über Spikiu & Hilfe kommen bald',abmelden:'Abmelden',abmeldenSoon:'Abmelden — bald verfügbar',du:'Du'},
 es:{doc:'Spikiu · Perfil',title:'Perfil',back:'atrás',lernen:'Aprender',weg:'Ruta de aprendizaje',wegs:'Tu camino: lo que crece después',konto:'Cuenta',abo:'Suscripción',abos:'Gestiona tu suscripción a Spikiu',aktiv:'Activa',
  einst:'Ajustes',einsts:'Idioma, lengua materna, tono, privacidad',einstSoon:'Los ajustes llegan pronto',mehr:'Más',hilfe:'Sobre Spikiu y ayuda',hilfeSoon:'«Sobre Spikiu y ayuda» llega pronto',abmelden:'Cerrar sesión',abmeldenSoon:'Cerrar sesión: disponible pronto',du:'Tú'},
 en:{doc:'Spikiu · Profile',title:'Profile',back:'back',lernen:'Learning',weg:'Learning path',wegs:'Your path — what grows next',konto:'Account',abo:'Subscription',abos:'Manage your Spikiu subscription',aktiv:'Active',
  einst:'Settings',einsts:'Language, native language, tone, privacy',einstSoon:'Settings coming soon',mehr:'More',hilfe:'About Spikiu & help',hilfeSoon:'About Spikiu & help coming soon',abmelden:'Log out',abmeldenSoon:'Log out — coming soon',du:'You'},
 el:{doc:'Spikiu · Προφίλ',title:'Προφίλ',back:'πίσω',lernen:'Μάθηση',weg:'Η διαδρομή σου',wegs:'Η διαδρομή σου — τι μεγαλώνει μετά',konto:'Λογαριασμός',abo:'Συνδρομή',abos:'Διαχειρίσου τη συνδρομή σου στο Spikiu',aktiv:'Ενεργή',
  einst:'Ρυθμίσεις',einsts:'Γλώσσα, μητρική γλώσσα, ύφος, απόρρητο',einstSoon:'Οι ρυθμίσεις έρχονται σύντομα',mehr:'Περισσότερα',hilfe:'Σχετικά με τον Spikiu & βοήθεια',hilfeSoon:'Το «Σχετικά με τον Spikiu & βοήθεια» έρχεται σύντομα',abmelden:'Αποσύνδεση',abmeldenSoon:'Αποσύνδεση — σύντομα διαθέσιμη',du:'Εσύ'}
}[ML];
document.documentElement.lang=ML; document.title=MT.doc;
document.querySelectorAll('[data-t]').forEach(function(e){ e.textContent=MT[e.getAttribute('data-t')]; });
document.querySelectorAll('[data-ta]').forEach(function(e){ e.setAttribute('aria-label',MT[e.getAttribute('data-ta')]); });
document.querySelectorAll('[data-ts]').forEach(function(e){ e.setAttribute('data-soon',MT[e.getAttribute('data-ts')]); });
var CAPY='<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg"><ellipse cx="40" cy="46" rx="24" ry="20" fill="#c9956a"/><ellipse cx="40" cy="30" rx="17" ry="15" fill="#c9956a"/><ellipse cx="28" cy="17" rx="5" ry="5" fill="#b8845a"/><ellipse cx="52" cy="17" rx="5" ry="5" fill="#b8845a"/><ellipse cx="40" cy="36" rx="9" ry="7" fill="#b8845a"/><ellipse cx="40" cy="34" rx="3.4" ry="2.4" fill="#8b5e3c"/><circle cx="36.3" cy="34.2" r="1.1" fill="#6b4226"/><circle cx="43.7" cy="34.2" r="1.1" fill="#6b4226"/><circle cx="32" cy="27" r="2.7" fill="#3d2b1f"/><circle cx="48" cy="27" r="2.7" fill="#3d2b1f"/><circle cx="33" cy="26.2" r=".9" fill="#fff"/><circle cx="49" cy="26.2" r=".9" fill="#fff"/><path d="M35 40 Q40 43 45 40" stroke="#8b5e3c" stroke-width="1.6" fill="none" stroke-linecap="round"/><ellipse cx="26" cy="64" rx="4.5" ry="3" fill="#b8845a"/><ellipse cx="38" cy="66" rx="4.5" ry="3" fill="#b8845a"/><ellipse cx="50" cy="64" rx="4.5" ry="3" fill="#b8845a"/></svg>';
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('on');},1600);}
(function(){
  var name='', email='', premium=false;
  try{var u=JSON.parse(localStorage.getItem('spikiu_user')||'{}');name=u.name||'';email=u.email||u.mail||'';
    var p=u.profile||{};
    premium=(u.plan==='premium')||(u.abo==='premium')||(u.premium===true)||(p.plan==='premium');
  }catch(e){}
  document.getElementById('mono').textContent=(String(name).trim()[0]||'S');
  document.getElementById('umail').textContent=email||name||MT.du;
  var b=document.getElementById('aboBadge');
  b.textContent=premium?'Premium':'Free';
  b.classList.add(premium?'is-premium':'is-free');
})();
document.querySelectorAll('.row[data-go]').forEach(function(b){ b.onclick=function(){ location.href=b.getAttribute('data-go'); }; });
document.querySelectorAll('.row[data-soon]').forEach(function(b){ b.onclick=function(){ toast(b.getAttribute('data-soon')); }; });
document.getElementById('logout').onclick=function(){ toast(MT.abmeldenSoon); };
</script>
<script type="module">import {speak} from './audio.js'; window.sprich = speak;</script>
</body></html>
