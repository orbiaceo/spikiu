<title>Gespräch im Ohr-Design</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@500;600;700;800&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: wie „Feines Ohr" — eine Spalte über die ganze Höhe: Kopf · Aufgabe · großer gelber Knopf ·
   2×2-Kacheln (füllen den Rest) · Rückmeldezeile · zwei Knöpfe unten. Ein Look (hell), wie die App. */
:root{
  --bg:#eef7f1; --ink:#15163a; --card:#ffffff; --mid:#5f7068; --faint:#dfe6e0;
  --acc:#1f93b0; --yel:#ffd24a; --ok:#c7e89a; --okInk:#2f6b3a; --warn:#c67a1e; --warn2:#fbf0e0; --sky:#d3eef6;
  --f-display:'Archivo Black',Impact,sans-serif; --f-ui:'DM Sans',system-ui,sans-serif;
  --f-z:'Lora',Georgia,serif; --f-mono:'DM Mono',ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.app{height:100%;max-width:30rem;margin:0 auto;display:flex;flex-direction:column}
.proto{flex:0 0 auto;display:flex;gap:6px;justify-content:center;padding:8px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));font:700 .72rem var(--f-ui)}
.proto span{align-self:center;color:var(--mid);font:500 .62rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;margin-right:2px}
.proto button{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:.28rem .7rem;cursor:pointer}
.proto button[aria-pressed="true"]{background:var(--ink);color:#fff}

header{flex:0 0 auto;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:6px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:2.5px solid var(--ink);background:rgba(255,255,255,.55)}
.back{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);background:var(--card);box-shadow:2px 3px 0 var(--ink);font-size:1.2rem;cursor:pointer;display:grid;place-items:center}
.kopf{text-align:center}
.eb{font:500 .7rem/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
.ttl{font-family:var(--f-display);font-size:1.45rem;line-height:1.15;margin-top:4px}

.rail{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:8px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.rail button{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:stretch}
.rail i{display:block;height:5px;border-radius:9px;background:var(--faint)}
.rail b{font:700 .6rem var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:#9aa49f;text-align:center}
.rail .done i{background:var(--acc)} .rail .on i{background:var(--acc)} .rail .on b{color:var(--acc)} .rail .done b{color:var(--ink)}

main{flex:1 1 auto;min-height:0;padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex}
.karte{flex:1;min-height:0;background:var(--card);border:2.5px solid var(--ink);border-radius:22px;box-shadow:4px 5px 0 var(--ink);padding:16px 14px 12px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.task{font:500 1.12rem/1.35 var(--f-z);margin:0;text-wrap:balance;max-width:24rem}
.task small{display:block;font:600 .82rem/1.3 var(--f-ui);color:var(--mid);margin-top:4px}
.spk-zeile{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%}
.spk-zeile .cap{flex:0 0 42px;height:42px}
.spk-zeile .cap svg{width:100%;height:100%}
.blase{flex:1;min-width:0;background:var(--sky);border:2px solid var(--ink);border-radius:4px 16px 16px 16px;padding:8px 11px}
.blase .z{font:600 1.12rem/1.3 var(--f-z)}
.blase .uebs{font:600 .82rem/1.3 var(--f-ui);color:var(--mid);margin-top:3px}
.blase .uebs button{border:0;background:none;padding:0;font:700 .78rem var(--f-ui);color:var(--acc);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.big{flex:0 0 auto;background:var(--yel);border:2.5px solid var(--ink);border-radius:100px;box-shadow:3px 4px 0 var(--ink);padding:.6rem 1.8rem;font:800 1.2rem var(--f-ui);cursor:pointer}
.big:active,.tile:active,.btn:active{transform:translate(2px,2px);box-shadow:1px 2px 0 var(--ink)}
.punkte{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:-4px}
.punkte i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);background:#fff}
.punkte i.h{background:linear-gradient(90deg,var(--okInk) 50%,#fff 50%)} .punkte i.v{background:var(--okInk)}

.grid{flex:1 1 auto;min-height:0;width:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px}
.grid.eins{grid-template-columns:1fr;grid-template-rows:repeat(2,1fr)}
.tile{min-height:0;min-width:0;background:var(--card);border:2.5px solid var(--ink);border-radius:18px;box-shadow:3px 4px 0 var(--ink);padding:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden}
.tile img{max-width:70%;max-height:72%;width:auto;height:auto;flex:0 1 auto;min-height:0}
.tile .tz{font:600 clamp(1rem,4.6vw,1.3rem)/1.25 var(--f-z);text-wrap:balance}
.tile .tn{font:800 clamp(1rem,4.4vw,1.25rem)/1.2 var(--f-ui);text-wrap:balance}
.tile .ts{font:600 .82rem/1.25 var(--f-ui);color:var(--mid)}
.tile .te{font-size:clamp(2rem,10vw,3rem);line-height:1}
.tile.ok{background:var(--ok)}
.tile.no{background:var(--warn2);border-color:var(--warn);opacity:.62;box-shadow:none}
.tile.gew{background:#fff6d6}
.tile[disabled]{cursor:default}
.fb{flex:0 0 auto;min-height:2.6em;display:flex;align-items:center;justify-content:center;font:700 1.02rem/1.3 var(--f-ui);color:var(--okInk);text-wrap:balance}
.fb em{font:600 1.08rem var(--f-z);font-style:normal}
.fb.soft{color:var(--warn)}
.fb .lt{font:500 .78rem var(--f-mono);color:var(--mid);margin-left:6px}

footer{flex:0 0 auto;display:flex;justify-content:space-between;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.btn{border:2.5px solid var(--ink);border-radius:100px;box-shadow:3px 4px 0 var(--ink);padding:.7rem 1.25rem;font:800 1rem var(--f-ui);background:var(--card);cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--acc);color:#fff}
.btn[disabled]{opacity:.38;box-shadow:none;cursor:default}
.btn.mic{background:var(--yel)}
.blase{position:relative}
.mini{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);background:var(--acc);color:#fff;box-shadow:2px 2px 0 var(--ink);cursor:pointer;display:grid;place-items:center;font-size:.95rem;align-self:center}
.big.mic{display:flex;align-items:center;gap:.45rem}
/* Entdecken: Bild antippen → hören + Wort, Umschrift, Bedeutung */
.tile.ent{position:relative}
.tile.ent .neu{display:none;flex-direction:column;align-items:center;gap:2px}
.tile.ent.ges .neu{display:flex}
.tile.ent.ges img{max-height:44%}
.tile.ent.ges{border-color:var(--acc);box-shadow:3px 4px 0 var(--acc)}
.tile.ent.ges::after{content:'✓';position:absolute;top:6px;right:9px;font:800 .9rem var(--f-ui);color:var(--acc)}
.tile .tl{font:500 .74rem var(--f-mono);color:var(--mid)}
.tile .tu{font:700 .9rem/1.2 var(--f-ui);color:var(--okInk)}
.tile.satz .tz{font-size:clamp(1rem,4.4vw,1.2rem)}
.lot{display:flex;gap:6px;justify-content:center;margin-top:-4px}
.lot b{font:700 .62rem var(--f-ui);letter-spacing:.06em;text-transform:uppercase;padding:.2rem .5rem;border-radius:999px;border:1.5px solid var(--faint);color:#9aa49f}
.lot b.on{border-color:var(--acc);color:var(--acc)} .lot b.ok{border-color:var(--okInk);color:var(--okInk)}
@media (max-height:720px){
 .task small{display:none}
 .proto{padding-top:3px;padding-bottom:1px}
 .proto span{display:none}
 .proto button{padding:.16rem .55rem;font-size:.68rem}
 .lot b{padding:.12rem .4rem;font-size:.56rem}
 .tile.ent.ges img{max-height:26%}
 .tile.ent{padding:6px;gap:3px}
 .tile.ent .neu{gap:0}
 .tile.ent.ges .tz{font-size:.98rem;line-height:1.15}
 .tile.satz .tz{font-size:.86rem;line-height:1.15}
 .tile.satz .tu{font-size:.72rem}
 .tile.satz .tl{font-size:.6rem}
 .tile .tl{font-size:.66rem}
 .tile .tu{font-size:.78rem;line-height:1.15}
 .karte{gap:9px;padding:12px 12px 8px}
 .tile .ts{display:none}
 .tile .te{font-size:2rem}
 .tile img{max-height:62%}
 .task{font-size:1.02rem}
 .task small{font-size:.76rem}
 .big{padding:.5rem 1.5rem;font-size:1.08rem}
 .fb{min-height:2.3em;font-size:.95rem}
 .ttl{font-size:1.25rem}
 .blase .z{font-size:1.02rem}
}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .3s ease-out both}@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:none}}}
</style>

/* Hören: einen Satz hören, unter vier Sätzen erkennen. Verpasste kommen am Ende noch einmal. */
var HS=null;
function hoeren(){
 if(!HS)HS={stapel:mischen(HOEREN.map(function(_,i){return i;})),n:0};
 rail(2);kopf('Geführtes Gespräch','Hören');
 if(!HS.stapel.length){HS=null;geheZu(3);return;}
 var i=HS.stapel[0],h=HOEREN[i],k=karte();
 k.appendChild(el('p','task','Welchen Satz hörst du?<small>'+(HS.n+1)+' von '+(HS.n+HS.stapel.length)+'</small>'));
 bigKnopf(k,'Anhören',function(){sprich(h.z);});
 runde({karte:k,auto:h.z,
  kacheln:[{ok:true,html:'<span class="tz">'+esc(h.z)+'</span>'}].concat(h.falsch.map(function(f){return {html:'<span class="tz">'+esc(f)+'</span>',falschText:'Fast — hör auf die kleinen Wörter.'};})),
  richtig:'<span><em>'+esc(h.z)+'</em><br>= '+esc(h.de)+'</span>',
  fertig:function(sauber){HS.stapel.shift();HS.n++;if(!sauber)HS.stapel.push(i);$('b-rechts').disabled=false;}});
 fuss({t:'Genug für heute',go:function(){geheZu(5);}},{t:'weiter ›',pri:true,aus:true,go:hoeren});
}

/* Sprechen: Spikiu (Kellner) sagt seine Zeile — du wählst deine Antwort, hörst sie und sagst sie laut. */

 rail(3);kopf('Geführtes Gespräch','Sprechen');
 if(RS>=ROLLE.length){RS=0;geheZu(4);return;}
 var r=ROLLE[RS],k=karte();
 var z=el('div','spk-zeile','<span class="cap">'+CAPY+'</span><div class="blase"><div class="z" lang="'+Z+'">'+esc(r.sp)+'</div><div class="uebs"><button type="button" id="ueb">Übersetzung</button></div></div>');
 k.appendChild(z);
 z.querySelector('#ueb').onclick=function(){this.parentNode.textContent=r.spDe;};
 bigKnopf(k,'Kellner anhören',function(){sprich(r.sp);});
 runde({karte:k,auto:r.sp,dannSprich:r.z,
  kacheln:[{ok:true,html:'<span class="tz">'+esc(r.z)+'</span>'}].concat(r.falsch.map(function(f){return {html:'<span class="tz">'+esc(f[0])+'</span>',falschText:'„'+esc(f[1])+'" — passt hier noch nicht.'};})),
  richtig:'<span>= '+esc(r.de)+'<br>🗣️ Jetzt sag es laut nach.</span>',
  fertig:function(){$('b-rechts').disabled=false;}});
 fuss({t:'Genug für heute',go:function(){geheZu(5);}},{t:(RS+1<ROLLE.length?'weiter ›':'Lektion ›'),pri:true,aus:true,go:function(){RS++;sprechen();}});
}

  richtig:'<span><em>'+esc(it.hoer)+'</em><br>= '+esc(it.de)+'</span>',

}

/* ── Prototyp-Umschalter ── */
function modus(m){MODUS=m;$('m-gef').setAttribute('aria-pressed',String(m==='gef'));$('m-frei').setAttribute('aria-pressed',String(m==='frei'));
 if(m==='gef')geheZu(SCHRITT===5?0:SCHRITT);else frei();}
$('m-gef').onclick=function(){modus('gef');};
$('m-frei').onclick=function(){modus('frei');};
$('back').onclick=function(){if(MODUS==='gef'&&SCHRITT>0)geheZu(SCHRITT-1);};
function sprache(z){setzeSprache(z);$('z-es').setAttribute('aria-pressed',String(z==='es'));$('z-el').setAttribute('aria-pressed',String(z==='el'));
 WS=null;HS=null;RS=0;LS=0;FZ=0;TISCH_OK=false;if(MODUS==='gef'){SCHRITT=0;thema(false);}else frei();}
$('z-es').onclick=function(){sprache('es');};
$('z-el').onclick=function(){sprache('el');};
setzeSprache('es');
thema(false);
