<style>

.bnav{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-around;padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));background:#fff;border-top:2.5px solid var(--ink)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

var T={

 home:function(w){var j=jetzt();
  var h=sagt('Das ist dein Kurs: eine Lektion nach der anderen. Die markierte ist die nächste.')+'<div class="papier"><h2>Mein Kurs</h2><div class="eb">Erste Stufe · 🌱 Samen</div>';
  LEK.forEach(function(L,i){var st=lekFertig(i)?'ok':(i===j?'jetzt':'zu');h+='<button class="ix '+st+'" data-i="'+i+'"><span class="nr">'+(i+1)+'</span><span class="tx"><span class="tt">'+L.t+'</span><br><span class="es">'+L.es+'</span></span><span class="dots"></span><span class="st">'+(st==='ok'?'✓':(st==='jetzt'?'jetzt':''))+'</span></button>';});
  h+='<div class="ixh">🌿 Stamm · zweite Stufe</div><div class="fussnote">Dieselben zehn Orte, eine Stufe tiefer.</div></div>';

 kopfLektion:function(l){return '<div class="kp"><button class="back" onclick="zeigeHome()">‹</button><div class="t"><div class="eb">Lektion '+(l+1)+'</div><b>'+LEK[l].em+' '+LEK[l].t+'</b></div><span class="sz">'+(l+1)+'</span></div>';},

  ZI.forEach(function(Z,z){var f=zimmerFertig(l,z),st=f?'ok':(z===n&&!fertig?'jetzt':'zu');
   h+='<button class="ix '+st+'" data-z="'+z+'"><span class="nr" style="font-size:.95rem">'+(l+1)+'.'+(z+1)+'</span><span class="tx"><span class="tt"><span class="em">'+Z.em+'</span>'+Z.t+'</span><br><span class="es" style="font-style:normal;font-family:DM Sans;font-size:.78rem;font-weight:600">'+Z.s+'</span></span><span class="dots"></span><span class="st">'+(f?'✓':(st==='jetzt'?'→':''))+'</span></button>';});
  h+='</div><button class="los">'+(fertig?'Noch einmal von vorn':(n===0?'Lektion beginnen: '+(l+1)+'.1 Wörter':'Weiter mit '+(l+1)+'.'+(n+1)+' '+ZI[n].t))+'</button>';
  w.innerHTML=h;w.querySelectorAll('.ix').forEach(function(b){b.onclick=function(){zeigeZimmer(l,+b.dataset.z);};});
  w.querySelector('.los').onclick=function(){zeigeZimmer(l,fertig?0:n);};},
 kopfZimmer:function(l,z){return '<div class="kp"><button class="back" onclick="zeigeLektion('+l+')">‹</button><div class="t"><div class="eb">Lektion '+(l+1)+' · Kapitel '+(l+1)+'.'+(z+1)+'</div><b>'+ZI[z].em+' '+ZI[z].t+'</b></div><span class="sz">'+(l+1)+'.'+(z+1)+'</span></div>';},
 weiterText:function(l,z){return 'Weiter: <span class="nr">'+(l+1)+'.'+(z+1)+'</span> '+ZI[z].t+' ›';},
 endeText:function(l){return 'Lektion '+(l+1)+' abschließen ›';},
 ende:function(w,l){var nx=l+1<LEK.length?l+1:null;
  var h='<div class="papier" style="text-align:left"><div class="eb">Lektion '+(l+1)+'</div><h2>'+LEK[l].t+'</h2><div class="ende-stempel">✓ Gelesen &amp; gesprochen</div>'+sagt('Alle acht Kapitel. Deine Wörter liegen im Buch und kommen in anderen Lektionen wieder.');
  ZI.forEach(function(Z,z){h+='<div class="ix ok" style="cursor:default"><span class="nr" style="font-size:.9rem">'+(l+1)+'.'+(z+1)+'</span><span class="tx"><span class="tt">'+Z.t+'</span></span><span class="dots"></span><span class="st">✓</span></div>';});
  h+='</div>'+(nx!=null?'<button class="los" id="nx">Weiter zu Lektion '+(nx+1)+': '+LEK[nx].t+'</button>':'')+'<button class="los" id="ih" style="background:#fff">Zu meinem Kurs</button>';
  w.innerHTML=h;if(nx!=null)w.querySelector('#nx').onclick=function(){zeigeLektion(nx);};w.querySelector('#ih').onclick=zeigeHome;},
 kopfFrei:function(){return '<div class="kp"><button class="back" onclick="zeigeHome()">‹</button><div class="t"><div class="eb">Anhang</div><b>Alle Zimmer</b></div><span class="sz">A</span></div>';},
 frei:function(w){var h=sagt('Zum freien Üben, quer durch alle Lektionen.')+'<div class="papier"><h2>Anhang</h2><div class="eb" style="margin-bottom:.6rem">Zimmer zum freien Üben</div>';
  FREI.forEach(function(f,i){h+='<button class="ix frei-li" data-i="'+i+'"><span class="nr" style="font-size:.95rem">A'+(i+1)+'</span><span class="tx"><span class="tt"><span class="em">'+f[0]+'</span>'+f[1]+'</span><br><span class="es" style="font-style:normal;font-family:DM Sans;font-size:.78rem;font-weight:600">'+f[2]+'</span></span><span class="dots"></span><span class="st"></span></button>';});
  w.innerHTML=h+'</div>';w.querySelectorAll('.ix').forEach(function(b){b.onclick=function(){toast(FREI[+b.dataset.i][1]+' öffnet sich.');};});}
};

['zeigeHome','zeigeLektion','zeigeZimmer','zeigeEnde'].forEach(function(f){var alt=window[f];window[f]=function(a,b){setzeBereich('kurs');alt(a,b);if(f==='zeigeHome'&&NAV==='mitte')heldKarte();};});

function zeigeRaeume(){AKT={frei:1};setzeBereich('raeume');kopf(einfachKopf('Frei üben','Räume'));var w=leere();
 w.innerHTML=sagt('Hier wählst du frei, quer durch alle Lektionen. Vier Räume, immer an derselben Stelle.');
 var g=mk('div','pk-gitter');KAT.forEach(function(K,i){g.appendChild(kachel(K.g,K.t,K.s,K.bg,function(){zeigeKat(i);}));});w.appendChild(g);capys(w);}
function zeigeKat(i){AKT={frei:1};setzeBereich('raeume');var K=KAT[i];kopf(einfachKopf('Räume',K.t,'zeigeRaeume()'));var w=leere();
 w.innerHTML=sagt(K.s+'. Such dir etwas aus.');
 var g=mk('div','pk-gitter');K.items.forEach(function(it,j){var b=kachel(it[0],it[1],it[2],K.bg,function(){zeigeAkt(i,j);});if(K.items.length%2&&j===K.items.length-1)b.classList.add('breit');g.appendChild(b);});w.appendChild(g);capys(w);}

 h.querySelector('.los').onclick=function(){zeigeZimmer(j,n);};var row=w.querySelector('.row');if(row)row.after(h);else w.prepend(h);}
