<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spikiu · Hilfe</title>
<link rel="stylesheet" href="/fonts/spikiu-fonts.css">
<style>
:root{ --minz:#eef7f1; --ink:#15163a; --muted:#5f7068; --acc:#1f93b0; --ow:1.5px; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--minz);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;cursor:pointer}
.rnav{flex:0 0 auto;display:flex;align-items:center;gap:.7rem;
  padding:calc(.6rem + env(safe-area-inset-top)) .9rem .6rem;
  background:var(--minz);border-bottom:1.5px solid #dcebe1}
.rnav .back{width:36px;height:36px;flex:0 0 36px;border-radius:999px;border:1.5px solid #dcebe1;
  background:#fff;font-size:1.15rem;line-height:1;box-shadow:0 6px 18px rgba(21,22,58,.07);
  display:flex;align-items:center;justify-content:center}
.rnav .back:active{transform:translate(1px,1px);box-shadow:0 0 0 var(--ink)}
.rnav .title{font:800 1.05rem 'Nunito',sans-serif}
.wrap{flex:1;min-height:0;overflow-y:auto;padding:1.2rem 1.1rem 2rem;max-width:620px;margin:0 auto;width:100%}
h2{font:800 1.3rem 'Nunito',sans-serif;margin-bottom:1rem}
details{background:#fff;border:1.5px solid #dcebe1;border-radius:16px;box-shadow:0 6px 18px rgba(21,22,58,.07);
  margin-bottom:.8rem;overflow:hidden}
summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:.6rem;
  padding:.95rem 1.05rem;font:700 .98rem 'Nunito',sans-serif;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .pfeil{transition:transform .2s;flex:0 0 auto}
details[open] summary .pfeil{transform:rotate(90deg)}
.antwort{padding:0 1.05rem 1rem;font:500 .92rem/1.55 'Nunito',sans-serif;color:var(--muted)}
.kontakt{margin-top:1.4rem;text-align:center;font:600 .88rem 'Nunito',sans-serif;color:var(--muted)}
.kontakt a{color:var(--acc);font-weight:800;text-decoration:none}
</style>
<link rel="stylesheet" href="geraet.css"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<header class="rnav">
  <button class="back" id="back" onclick="window.location.href='haus.html'" aria-label="zurück">‹</button>
  <div class="title" id="titel">Hilfe</div>
</header>
<div class="wrap">
  <h2 id="kopf">Häufige Fragen</h2>
  <div id="fragen"></div>
  <div class="kontakt"><span id="kontakt">Noch Fragen? Schreib uns:</span> <a href="mailto:spikiuapp@gmail.com">spikiuapp@gmail.com</a></div>
</div>
<script>
/* ── Dreisprachig nach Muttersprache (Leo, 09.10.2026), seit 15.10.2026 auch Griechisch (el) — gleiche Logik wie
   spikiu-products.html: Profil → spikiu_lang → Browser → Englisch. ── */
(function(){
  var OM='<a href="https://openmoji.org" target="_blank" rel="noopener">OpenMoji</a>';
  var CC='<a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>';
  var ABO='<a href="index.html#plans" style="color:var(--acc);font-weight:700;text-decoration:none">';
  var TX={
    de:{ titel:'Hilfe', kopf:'Häufige Fragen', back:'zurück', seite:'Spikiu · Hilfe', kontakt:'Noch Fragen? Schreib uns:',
      fragen:[
        ['Wie ist Spikiu aufgebaut?','Unter „Mein Kurs“ findest du das Inhaltsverzeichnis: nummerierte Lektionen, die gelbe ist die nächste. Jede Lektion hat dieselben acht Kapitel, immer an derselben Stelle: Wörter, Hören, Geführtes Gespräch, Selbst sprechen, Aussprache, Grammatik, Lesen, Spiel. Unter „Räume“ übst du frei, im „Regal“ liegen dein Wortschatz und deine Lektionen, unter „Mein“ deine Einstellungen.'],
        ['Was ist das Geführte Gespräch?','Kapitel 3 jeder Lektion: Du spielst eine Szene durch und wählst deine Sätze aus. In Kapitel 4 kommt dieselbe Szene noch einmal, jetzt mit deinen eigenen Sätzen.'],
        ['Wie navigiere ich durch die Karten?','Tippe auf „Weiter“ oder wische mit dem Daumen nach links. Nach rechts wischen bringt dich eine Karte zurück. Bei Übungen geht es erst weiter, wenn du geantwortet hast. Mit „Mein Kurs“ kommst du aus jedem Raum zurück ins Inhaltsverzeichnis.'],
        ['Was sammelt „Mein Wortschatz“?','Die Wörter, die du beim Lesen und Üben einsammelst. Sie liegen im „Regal“ und kommen beim Üben als Wiedersehen zurück. Nichts geht verloren.'],
        ['Was ist frei, und was kostet etwas?','<b>Frei, für immer:</b> Nach der Einstufung bekommst du drei ganze Lektionen auf deiner Stufe, ohne Zeitlimit, dazu das PDF deiner ersten Lektion. Immer offen sind die Grammatik zum Lesen, das Spiel des Tages und die Wendung des Tages. <b>Kurs:</b> der ganze Weg mit allen Lektionen, Räumen, Lernromanen und Spielen, dazu nach jeder Lektion dein PDF. <b>Coach</b> (bald): Spikiu antwortet dir persönlich, im freien Gespräch, beim Schreiben und mit Lektionen aus deinen eigenen Sätzen. Während der Beta ist alles frei. '+ABO+'Preise →</a>'],
        ['Warum höre ich Spikiu nicht?','Browser erlauben Ton erst nach einer Berührung: Tippe einmal irgendwo auf die Seite und dann auf 🔊. Prüfe auch die Lautstärke und den Stummschalter am Handy. Ob Spikiu mit Frauen- oder Männerstimme spricht, stellst du unter „Mein“ ein.'],
        ['Woher kommen die Bilder auf den Karten?','Die Icons stammen von '+OM+' – the open-source emoji and icon project. Lizenz: '+CC+'. Sie liegen bei uns selbst auf dem Server, damit sie auf jedem Gerät gleich aussehen und kein fremder Dienst mitliest.']
      ]},
    es:{ titel:'Ayuda', kopf:'Preguntas frecuentes', back:'atrás', seite:'Spikiu · Ayuda', kontakt:'¿Más preguntas? Escríbenos:',
      fragen:[
        ['¿Cómo está organizado Spikiu?','En «Tu curso» está el índice: lecciones numeradas; la amarilla es la siguiente. Cada lección tiene los mismos ocho capítulos, siempre en el mismo sitio: Palabras, Escuchar, Conversación guiada, Habla tú, Pronunciación, Gramática, Leer y Juego. En «Espacios» practicas libremente, en el «Estante» están tu vocabulario y tus lecciones, y en «Perfil», tus ajustes.'],
        ['¿Qué es la Conversación guiada?','Es el capítulo 3 de cada lección: recorres una escena y eliges tus frases. En el capítulo 4 vuelve la misma escena, ahora con tus propias frases.'],
        ['¿Cómo paso de una tarjeta a otra?','Toca «Seguir» o desliza el pulgar hacia la izquierda. Deslizar a la derecha te lleva a la tarjeta anterior. En los ejercicios solo avanzas cuando has respondido. Con «Tu curso» vuelves al índice desde cualquier espacio.'],
        ['¿Qué guarda «Mi vocabulario»?','Las palabras que vas reuniendo al leer y practicar. Están en el «Estante» y vuelven al practicar, como un reencuentro. Nada se pierde.'],
        ['¿Qué es libre y qué cuesta algo?','<b>Libre, para siempre:</b> después de la prueba de nivel recibes tres lecciones completas de tu nivel, sin límite de tiempo, y el PDF de tu primera lección. Siempre están abiertos la gramática para leer, el juego del día y el giro del día. <b>Curso:</b> todo el camino, con todas las lecciones, espacios, novelas y juegos, y tu PDF después de cada lección. <b>Coach</b> (pronto): Spikiu te responde personalmente, en la conversación libre, al escribir y con lecciones hechas con tus propias frases. Durante la beta todo es libre. '+ABO+'Precios →</a>'],
        ['¿Por qué no oigo a Spikiu?','Los navegadores solo permiten sonido después de un toque: toca una vez cualquier parte de la pantalla y luego 🔊. Comprueba también el volumen y el modo silencio del móvil. En «Perfil» eliges si Spikiu habla con voz de mujer o de hombre.'],
        ['¿De dónde vienen las imágenes de las tarjetas?','Los iconos son de '+OM+', un proyecto libre de emojis e iconos. Licencia: '+CC+'. Están en nuestro propio servidor, para que se vean igual en cualquier dispositivo y ningún servicio ajeno se entere de nada.']
      ]},
    en:{ titel:'Help', kopf:'Frequently asked questions', back:'back', seite:'Spikiu · Help', kontakt:'More questions? Write to us:',
      fragen:[
        ['How is Spikiu organised?','Under “Your course” you find the table of contents: numbered lessons, and the yellow one is next. Every lesson has the same eight chapters, always in the same place: Words, Listen, Guided conversation, Speak yourself, Pronunciation, Grammar, Read and Game. Under “Rooms” you practise freely, the “Shelf” holds your vocabulary and your lessons, and “Profile” has your settings.'],
        ['What is the guided conversation?','Chapter 3 of every lesson: you play through a scene and choose your sentences. In chapter 4 the same scene comes back, now with your own sentences.'],
        ['How do I move through the cards?','Tap “Next” or swipe left with your thumb. Swiping right takes you back one card. In exercises you only move on once you have answered. “Your course” takes you back to the table of contents from any room.'],
        ['What does “My vocabulary” collect?','The words you gather while reading and practising. They sit on the “Shelf” and come back as you practise, like a reunion. Nothing gets lost.'],
        ['What is free, and what costs something?','<b>Free, forever:</b> after the placement you get three complete lessons at your level, with no time limit, plus the PDF of your first lesson. Always open: the grammar to read, the game of the day and the expression of the day. <b>Course:</b> the whole way, with all lessons, rooms, learning novels and games, plus your PDF after every lesson. <b>Coach</b> (soon): Spikiu answers you personally, in free conversation, in your writing and with lessons made from your own sentences. During the beta everything is free. '+ABO+'Prices →</a>'],
        ['Why can’t I hear Spikiu?','Browsers only allow sound after a touch: tap anywhere on the page once, then 🔊. Also check the volume and the silent switch on your phone. Under “Profile” you choose whether Spikiu speaks with a female or a male voice.'],
        ['Where do the card images come from?','The icons come from '+OM+' – the open-source emoji and icon project. Licence: '+CC+'. We host them on our own server, so they look the same on every device and no outside service is listening in.']
      ]},
    el:{ titel:'Βοήθεια', kopf:'Συχνές ερωτήσεις', back:'πίσω', seite:'Spikiu · Βοήθεια', kontakt:'Έχεις κι άλλες ερωτήσεις; Γράψε μας:',
      fragen:[
        ['Πώς είναι οργανωμένος ο Spikiu;','Στο «Το μάθημά μου» βρίσκεις τα περιεχόμενα: αριθμημένα μαθήματα, το κίτρινο είναι το επόμενο. Κάθε μάθημα έχει τα ίδια οκτώ κεφάλαια, πάντα στην ίδια θέση: Λέξεις, Άκου, Καθοδηγούμενη συζήτηση, Μίλα εσύ, Προφορά, Γραμματική, Διάβασε, Παιχνίδι. Στους «Χώρους» εξασκείσαι ελεύθερα, στο «Ράφι» είναι το λεξιλόγιο και τα μαθήματά σου, και στο «Προφίλ» οι ρυθμίσεις σου.'],
        ['Τι είναι η Καθοδηγούμενη συζήτηση;','Είναι το κεφάλαιο 3 κάθε μαθήματος: περνάς μια σκηνή και διαλέγεις τις φράσεις σου. Στο κεφάλαιο 4 έρχεται ξανά η ίδια σκηνή, τώρα με τις δικές σου φράσεις.'],
        ['Πώς περνάω από κάρτα σε κάρτα;','Πάτα «Συνέχεια» ή σύρε τον αντίχειρα προς τα αριστερά. Αν σύρεις προς τα δεξιά, γυρνάς μία κάρτα πίσω. Στις ασκήσεις προχωράς μόνο όταν έχεις απαντήσει. Με το «Το μάθημά μου» γυρνάς στα περιεχόμενα από κάθε χώρο.'],
        ['Τι μαζεύει «Το λεξιλόγιό μου»;','Τις λέξεις που μαζεύεις όταν διαβάζεις και εξασκείσαι. Βρίσκονται στο «Ράφι» και επιστρέφουν όταν εξασκείσαι, σαν ξανασυνάντηση. Τίποτα δεν χάνεται.'],
        ['Τι είναι δωρεάν και τι κοστίζει;','<b>Δωρεάν, για πάντα:</b> μετά την κατάταξη παίρνεις τρία ολόκληρα μαθήματα στο στάδιό σου, χωρίς χρονικό όριο, και το PDF του πρώτου σου μαθήματος. Πάντα ανοιχτά είναι η γραμματική για διάβασμα, το παιχνίδι της ημέρας και η έκφραση της ημέρας. <b>Μάθημα:</b> όλος ο δρόμος, με όλα τα μαθήματα, τους χώρους, τα μυθιστορήματα και τα παιχνίδια, και το PDF σου μετά από κάθε μάθημα. <b>Coach</b> (σύντομα): ο Spikiu σου απαντά προσωπικά, στην ελεύθερη συζήτηση, όταν γράφεις και με μαθήματα από τις δικές σου φράσεις. Όσο διαρκεί η beta, όλα είναι δωρεάν. '+ABO+'Τιμές →</a>'],
        ['Γιατί δεν ακούω τον Spikiu;','Οι φυλλομετρητές επιτρέπουν ήχο μόνο μετά από ένα άγγιγμα: πάτα μία φορά οπουδήποτε στη σελίδα και μετά το 🔊. Έλεγξε επίσης την ένταση και τη σίγαση του κινητού. Στο «Προφίλ» διαλέγεις αν ο Spikiu μιλά με γυναικεία ή ανδρική φωνή.'],
        ['Από πού είναι οι εικόνες στις κάρτες;','Τα εικονίδια προέρχονται από το '+OM+' – the open-source emoji and icon project. Άδεια: '+CC+'. Τα φιλοξενούμε στον δικό μας διακομιστή, ώστε να φαίνονται ίδια σε κάθε συσκευή και να μην «κρυφακούει» καμία ξένη υπηρεσία.']
      ]}
  };
  function kurz(v){
    v=String(v||'').toLowerCase();
    if(v.indexOf('es')===0||v.indexOf('span')>-1) return 'es';
    if(v.indexOf('de')===0||v.indexOf('deut')>-1||v.indexOf('germ')>-1) return 'de';
    if(v.indexOf('en')===0||v.indexOf('engl')>-1) return 'en';
    if(v.indexOf('el')===0||v.indexOf('griech')>-1||v.indexOf('greek')>-1||v.indexOf('ελλην')>-1) return 'el';
    return '';
  }
  function sprache(){
    try{
      var u=JSON.parse(localStorage.getItem('spikiu_user')||'{}')||{};
      var p=u.profile||{};
      var m=kurz(p.muttersprache)||kurz(u.nativeLang)||kurz(p.nativeLang);
      if(m) return m;
      var s=kurz(localStorage.getItem('spikiu_lang'));
      if(s) return s;
    }catch(e){}
    return kurz(navigator.language)||'en';
  }
  var L=sprache(), T=TX[L];
  document.documentElement.lang=L;
  document.title=T.seite;
  document.getElementById('titel').textContent=T.titel;
  document.getElementById('kopf').textContent=T.kopf;
  document.getElementById('kontakt').textContent=T.kontakt;
  document.getElementById('back').setAttribute('aria-label',T.back);
  var h='';
  for(var i=0;i<T.fragen.length;i++){
    h+='<details><summary>'+T.fragen[i][0]+' <span class="pfeil">›</span></summary><div class="antwort">'+T.fragen[i][1]+'</div></details>';
  }
  document.getElementById('fragen').innerHTML=h;
})();
</script>
<script type="module">import {speak} from './audio.js'; window.sprich = speak;</script>
<script src="/feedback-spikiu.js" defer></script>
</body>
</html>
