<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spikiu · Lesewerkstatt</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Lora:ital,wght@0,400;0,500;0,600;1,500&family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff4f9a;--sage:#9bd14a;--gold:#a87b2e;--red:#e05252;--green:#1f93b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{--bg:#eef7f1;--ink:#15163a;--acc:#1f93b0;--muted:#6b6154;--read:#2b2621;--de:#fbf8f0;--ow:2.5px;
 background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;line-height:1.5;
 display:flex;align-items:center;justify-content:center;min-height:100dvh}
.app{position:relative;display:flex;flex-direction:column;height:100dvh;width:100%;background:var(--bg);overflow:hidden}
@media (min-width:700px) and (min-height:560px){
 html{font-size:17px}
 body{background:#15163a;background-image:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1px);background-size:22px 22px;padding:24px}
 .app{width:min(460px,94vw);height:min(880px,90vh);border-radius:28px;box-shadow:9px 11px 0 rgba(0,0,0,.22);border:2.5px solid var(--ink)}
}
button{font-family:inherit}
.top{flex:0 0 auto;background:rgba(255,255,255,.72);border-bottom:var(--ow) solid var(--ink);padding:calc(.6rem + env(safe-area-inset-top)) .9rem .65rem;display:flex;align-items:center;gap:.6rem}
.back{width:36px;height:36px;flex:0 0 auto;border-radius:999px;border:var(--ow) solid var(--ink);background:#fff;font-size:1.2rem;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.back:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.tt-wrap{flex:1;text-align:center}
.tt-wrap .k{font:500 .58rem/1 'DM Mono',monospace;letter-spacing:.2em;color:var(--acc);text-transform:uppercase}
.tt-wrap h1{font-family:'Archivo Black',sans-serif;font-size:1.12rem;margin:.1rem 0 0}
.dev{flex:0 0 auto;display:none;flex-direction:column;gap:.3rem}
.dev.on{display:flex}
.dev select{font:600 .7rem/1 'DM Sans';border:2px solid var(--ink);border-radius:8px;padding:.2rem .3rem;background:#fff}
.body{flex:1;min-height:0;overflow:auto;padding:1.2rem 1.05rem 1rem}
.rahmen{font-family:'Lora',serif;font-style:italic;color:var(--muted);font-size:1.05rem;margin-bottom:.6rem}
.texto{background:#fff;border:var(--ow) solid var(--ink);border-radius:16px;box-shadow:3px 4px 0 var(--ink);padding:1rem 1.05rem;position:relative}
.texto .t{font-family:'Lora',serif;font-size:1.32rem;line-height:1.6;color:var(--read)}
.texto .lau{margin-top:.5rem;font-family:'DM Mono',monospace;font-size:.86rem;color:var(--muted)}
.read-row{display:flex;justify-content:flex-end;margin-top:.7rem;padding-top:.55rem;border-top:2px dashed #e6dec9}
.say{display:inline-flex;align-items:center;gap:.35rem;font:700 .8rem 'DM Sans',sans-serif;color:#fff;background:var(--pink);border:2px solid var(--ink);border-radius:999px;padding:.35rem .75rem;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.say:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.wjhint{display:flex;gap:.55rem;align-items:center;background:var(--de);border:2px dashed var(--acc);border-radius:14px;padding:.55rem .7rem;margin-bottom:.85rem}
.wjhint[hidden]{display:none}
.wjh-cap{flex:0 0 32px;width:32px;height:32px;border-radius:999px;background:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 var(--ink)}
.wjh-cap svg{width:24px;height:24px}
.wjh-tx{font-size:.88rem;line-height:1.35;color:var(--ink)}
.bruecke{margin-top:.8rem;display:flex;flex-wrap:wrap;gap:.4rem}
.bruecke .bw{font:600 .82rem/1 'DM Sans';background:var(--de);border:2px dashed var(--muted);border-radius:999px;padding:.3rem .55rem;color:var(--muted)}
.bruecke .bw b{color:var(--ink);font-family:'Lora',serif;font-size:1rem}
.task{background:#fff;border:var(--ow) solid var(--ink);border-radius:16px;box-shadow:3px 4px 0 var(--ink);padding:.9rem 1rem;margin-top:1rem}
.task .q{font-weight:700;font-size:1.02rem;margin-bottom:.6rem}
.opt{display:block;width:100%;text-align:left;font-family:'Lora',serif;font-size:1.15rem;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:.55rem .75rem;margin:.4rem 0;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.opt:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.opt.right{background:var(--sage);border-color:var(--green)}
.opt.wrong{background:#f7d5d5;border-color:var(--red)}
.opt:disabled{cursor:default}
.expl{margin-top:.5rem;font-size:.9rem;color:var(--muted);font-style:italic}
.orden .pool,.orden .ans{display:flex;flex-wrap:wrap;gap:.45rem;margin:.5rem 0;min-height:2.4rem}
.orden .ans{background:var(--de);border:2px dashed var(--muted);border-radius:12px;padding:.4rem;align-content:flex-start}
.part{font-family:'Lora',serif;font-size:1.1rem;background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:.35rem .6rem;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.part:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.orden .done{margin-top:.5rem;font-family:'Lora',serif;font-size:1.15rem;padding:.5rem .7rem;border-radius:10px}
.orden .done.right{background:var(--sage)}
.orden .done.wrong{background:#f7d5d5}
.orden .done .corr{display:block;margin-top:.3rem;color:var(--green);font-weight:600}
.prem{background:var(--de);border:2.5px dashed var(--gold);border-radius:16px;padding:.9rem 1rem;margin-top:1rem;text-align:center}
.prem .lock{font-size:1.3rem}
.prem .pt{font-family:'Lora',serif;font-size:1.15rem;color:var(--ink);margin:.3rem 0}
.prem .pq{color:var(--muted);font-size:.9rem}
.prem .tag{display:inline-block;margin-top:.5rem;font:800 .72rem/1 'DM Sans';color:#fff;background:var(--gold);border:2px solid var(--ink);border-radius:999px;padding:.35rem .7rem;box-shadow:2px 2px 0 var(--ink)}
.schluss{margin-top:1.3rem;font-family:'Lora',serif;font-style:italic;color:var(--muted);text-align:center;font-size:1.1rem}
.empty{margin:3rem auto;text-align:center;color:var(--muted);font-family:'Lora',serif;font-size:1.2rem;max-width:24ch}
.foot{flex:0 0 auto;display:flex;gap:.6rem;padding:.7rem .9rem calc(.9rem + env(safe-area-inset-bottom));border-top:var(--ow) solid var(--ink);background:rgba(255,255,255,.7)}
.foot button{flex:1;font:800 .9rem/1 'DM Sans';border:var(--ow) solid var(--ink);border-radius:12px;padding:.7rem;cursor:pointer;box-shadow:3px 3px 0 var(--ink);background:#fff}
.foot .prim{background:var(--acc);color:#fff}
.foot button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<div class="app">
  <div class="top">
    <button class="back" id="back" aria-label="zurück">‹</button>
    <div class="tt-wrap"><h1 id="kRoom">Lesewerkstatt</h1></div>
    <div class="dev" id="dev">
      <select id="selLang"><option value="es">es</option><option value="de">de</option><option value="en">en</option><option value="el">el</option></select>
      <select id="selKoennen"><option value="anfang">anfang</option><option value="mittel">mittel</option><option value="fortgeschritten">fortgeschritten</option></select>
    </div>
  </div>
  <div class="body" id="body"></div>
  <div class="foot" id="foot"></div>
</div>
<script src="taller-daten.js"></script>
<script src="wortjag.js"></script>
<script>
(function(){
 function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
 function say(t,lang){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang=({es:'es-ES',de:'de-DE',en:'en-US',el:'el-GR'})[lang]||'es-ES';u.rate=.95;speechSynthesis.speak(u);}catch(e){}}

 // ── Profil defensiv (1:1 wie echte taller.html) ──
 var userObj={},stored={};
 try{userObj=JSON.parse(localStorage.getItem('spikiu_user')||'{}');}catch(e){}
 stored=userObj.profile||{};
 function langCode(v){if(!v)return null;v=(''+v).toLowerCase();
  if(/^(de|es|en|el)$/.test(v))return v;
  if(v.indexOf('deutsch')>-1||v.indexOf('german')>-1)return 'de';
  if(v.indexOf('span')>-1||v.indexOf('español')>-1)return 'es';
  if(v.indexOf('engl')>-1)return 'en';
  if(v.indexOf('griech')>-1||v.indexOf('greek')>-1)return 'el';return null;}
 function koennenFrom(v){if(!v)return null;v=(''+v).toLowerCase();
  if(['anfang','mittel','fortgeschritten'].indexOf(v)>-1)return v;
  if(/a[12]/.test(v))return 'anfang';if(/b[12]/.test(v))return 'mittel';if(/c[12]/.test(v))return 'fortgeschritten';return null;}

 var DEV=/[?&]dev=1/.test(location.search);
 var selLang=document.getElementById('selLang'),selKoennen=document.getElementById('selKoennen');
 selLang.value=stored.zielsprache||langCode(stored.targetLang)||'es';
 selKoennen.value=stored.koennen||koennenFrom(stored.level)||'anfang';
 if(DEV)document.getElementById('dev').classList.add('on');

 function zielsprache(){return DEV?selLang.value:(stored.zielsprache||langCode(stored.targetLang)||'es');}
 function koennen(){return DEV?selKoennen.value:(stored.koennen||koennenFrom(stored.level)||'anfang');}
 function muttersprache(){var m=stored.muttersprache||langCode(stored.nativeLang)||'de';return ['de','es','en'].indexOf(m)>-1?m:'de';}

 // ── i18n Chrome (UI = Muttersprache; el nie UI) ──
 var TXT={
  de:{k:'Übung',room:'Lesewerkstatt',again:'Noch ein Text',enough:'Genug für heute',prem:'Premium',premHint:'Schreib frei — Spikiu liest deinen Satz.',corr:'Richtig: ',empty:'Bald mehr Texte hier.'},
  es:{k:'Práctica',room:'Taller de lectura',again:'Otro texto',enough:'Basta por hoy',prem:'Premium',premHint:'Escribe libremente — Spikiu lee tu frase.',corr:'Correcto: ',empty:'Pronto más textos aquí.'},
  en:{k:'Practice',room:'Reading workshop',again:'Another text',enough:'Enough for today',prem:'Premium',premHint:'Write freely — Spikiu reads your sentence.',corr:'Correct: ',empty:'More texts here soon.'}
 };
 var T=TXT[muttersprache()];
 document.getElementById('kRoom').textContent=T.room;
 document.getElementById('back').onclick=function(){location.href='haus.html';};

 // ── gesehene Texte (Rotation) ──
 function seen(){try{return JSON.parse(localStorage.getItem('spikiu_taller_seen')||'[]');}catch(e){return [];}}
 function markSeen(id){try{var a=seen();if(a.indexOf(id)<0){a.push(id);if(a.length>40)a=a.slice(-40);localStorage.setItem('spikiu_taller_seen',JSON.stringify(a));}}catch(e){}}

 var B=document.getElementById('body'),F=document.getElementById('foot');

 function mcHTML(a,i){var h='<div class="task mc" data-i="'+i+'"><div class="q">'+esc(a.frage)+'</div>';
  a.optionen.forEach(function(o,k){h+='<button class="opt" data-k="'+k+'">'+esc(o)+'</button>';});
  return h+'<div class="expl" style="display:none"></div></div>';}
 function ordenHTML(a,i){var h='<div class="task orden" data-i="'+i+'"><div class="q">'+esc(a.frage)+'</div>';
  h+='<div class="ans" data-ans></div><div class="pool" data-pool>';
  a.teile.forEach(function(p,k){h+='<button class="part" data-k="'+k+'">'+esc(p)+'</button>';});
  return h+'</div><div class="done" style="display:none"></div></div>';}
 function freiHTML(a){return '<div class="prem"><div class="lock">🔒</div><div class="pt">'+esc(a.frage)+'</div>'+
  '<div class="pq">'+esc(T.premHint)+'</div><div class="tag">✨ '+esc(T.prem)+'</div></div>';}

 var CAPY_SMALL='<svg width="20" height="20" viewBox="0 0 80 80" fill="none">'
  + '<ellipse cx="40" cy="50" rx="28" ry="20" fill="#c9956a"/><ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/>'
  + '<ellipse cx="40" cy="36" rx="10" ry="7" fill="#b8845a"/><ellipse cx="40" cy="33" rx="4" ry="2.5" fill="#8b5e3c"/>'
  + '<circle cx="38" cy="33" r="1" fill="#6b4226"/><circle cx="42" cy="33" r="1" fill="#6b4226"/>'
  + '<circle cx="33" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="47" cy="24" r="3.5" fill="#3d2b1f"/>'
  + '<circle cx="34" cy="23" r="1.2" fill="white"/><circle cx="48" cy="23" r="1.2" fill="white"/>'
  + '<ellipse cx="26" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="54" cy="17" rx="6" ry="5" fill="#b8845a"/>'
  + '<ellipse cx="22" cy="66" rx="7" ry="5" fill="#b8845a"/><ellipse cx="34" cy="68" rx="7" ry="5" fill="#b8845a"/>'
  + '<ellipse cx="46" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="58" cy="66" rx="7" ry="5" fill="#b8845a"/>'
  + '<path d="M36 38 Q40 41 44 38" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>';
 var JAGD={de:'Tipp ein Wort an, um es in dein Buch zu nehmen.',es:'Toca una palabra para llevarla a tu libro.',en:'Tap a word to take it to your book.'};
 var VORLESEN={de:'Vorlesen',es:'Escuchar',en:'Read aloud'};
 var CUR=null;
 function render(entry){
  CUR=entry;var ziel=zielsprache();
  var h='<div class="rahmen">'+esc(entry.rahmen)+'</div>';
  h+='<div class="wjhint" id="wjhint" hidden><div class="wjh-cap">'+CAPY_SMALL+'</div><div class="wjh-tx">'+(JAGD[muttersprache()]||JAGD.de)+'</div></div>';
  h+='<div class="texto"><div class="t">'+esc(entry.texto)+'</div>';
  if(entry.lautschrift)h+='<div class="lau">'+esc(entry.lautschrift)+'</div>';
  if(entry.bruecke){h+='<div class="bruecke">';entry.bruecke.forEach(function(x){h+='<span class="bw"><b>'+esc(x.w)+'</b> · '+esc(x.t)+'</span>';});h+='</div>';}
  h+='<div class="read-row"><button class="say" id="sayT" aria-label="Vorlesen">🔊 '+(VORLESEN[muttersprache()]||VORLESEN.de)+'</button></div>';
  h+='</div>';
  entry.aufgaben.forEach(function(a,i){if(a.typ==='mc')h+=mcHTML(a,i);else if(a.typ==='orden')h+=ordenHTML(a,i);else if(a.typ==='frei')h+=freiHTML(a);});
  h+='<div class="schluss">'+esc(entry.schluss)+'</div>';
  B.innerHTML=h;B.scrollTop=0;
  document.getElementById('sayT').onclick=function(){say(entry.texto,ziel);};
  var textoEl=B.querySelector('.texto .t');
  if(textoEl && window.spikiuWortjag){var dict={};if(entry.glossar)Object.keys(entry.glossar).forEach(function(k){dict[k.toLowerCase()]=entry.glossar[k];});if(entry.bruecke)entry.bruecke.forEach(function(x){dict[String(x.w).toLowerCase()]=x.t;});if(!window.spikiuWortjag.gestartet()){var hh=document.getElementById('wjhint');if(hh)hh.hidden=false;}window.spikiuWortjag.aktivieren(textoEl,{quelle:'lesewerkstatt',dict:dict,onCollect:function(){var hh=document.getElementById('wjhint');if(hh)hh.hidden=true;}});}
  wireMC();wireOrden();
  F.innerHTML='<button class="prim" id="again">'+esc(T.again)+'</button><button id="enough">'+esc(T.enough)+'</button>';
  document.getElementById('again').onclick=load;
  document.getElementById('enough').onclick=function(){location.href='haus.html';};
 }
 function renderEmpty(){B.innerHTML='<div class="empty">'+esc(T.empty)+'</div>';
  F.innerHTML='<button id="enough">'+esc(T.enough)+'</button>';
  document.getElementById('enough').onclick=function(){location.href='haus.html';};}

 function wireMC(){[].forEach.call(B.querySelectorAll('.task.mc'),function(t){
  var a=CUR.aufgaben[+t.dataset.i];var opts=t.querySelectorAll('.opt');
  [].forEach.call(opts,function(o){o.onclick=function(){
   if(t.dataset.done)return;t.dataset.done=1;var k=+o.dataset.k;
   if(k===a.loesung){o.classList.add('right');}else{o.classList.add('wrong');opts[a.loesung].classList.add('right');}
   [].forEach.call(opts,function(x){x.disabled=true;});
   var e=t.querySelector('.expl');e.textContent=a.erklaerung||'';e.style.display='block';
  };});});}
 function wireOrden(){[].forEach.call(B.querySelectorAll('.task.orden'),function(t){
  var a=CUR.aufgaben[+t.dataset.i];var ans=t.querySelector('[data-ans]');var pool=t.querySelector('[data-pool]');var built=[];
  [].forEach.call(pool.querySelectorAll('.part'),function(p){p.onclick=function(){
   if(t.dataset.done)return;built.push(+p.dataset.k);p.remove();
   var c=p.cloneNode(true);c.onclick=null;ans.appendChild(c);
   if(built.length===a.teile.length){t.dataset.done=1;
    var ok=built.every(function(v,idx){return v===a.loesung[idx];});
    var done=t.querySelector('.done');done.style.display='block';done.className='done '+(ok?'right':'wrong');
    done.textContent=built.map(function(v){return a.teile[v];}).join(' ');
    if(!ok){var corr=document.createElement('span');corr.className='corr';corr.textContent=T.corr+a.loesung.map(function(v){return a.teile[v];}).join(' ');done.appendChild(corr);}
   }
  };});});}

 function load(){
  var TAL=window.spikiuTaller;
  if(!TAL){renderEmpty();return;}
  var entry=TAL.pick(zielsprache(),koennen(),seen());
  if(!entry){renderEmpty();return;}
  markSeen(entry.id);render(entry);
 }
 if(DEV){selLang.onchange=load;selKoennen.onchange=load;}
 load();
})();
</script>
</body></html>
