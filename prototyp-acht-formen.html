<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spikiu · Acht Formen für die Lektionen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<!--
  PROTOTYP „Acht Formen“ (Leo, 21.11.2026, 22:48: „Bau alle acht.“)
  Entscheidung aus dem Gespräch (Sprache, 21.11.): Lektionen = Hauptachse (Lernstationen), innen immer
  dieselben Zimmer in derselben Reihenfolge. Geführtes Gespräch + Szene (selbst sprechen) gehören in die
  Lektion; Rückmeldung deterministisch, null Token. KI-Konversation = später, eigenes Premium-Produkt.
  Diese Seite vergleicht nur die AUSSENFORM. Innen ist die Lektion überall gleich.
  1 Inhaltsverzeichnis · 2 U-Bahn-Linie · 3 Stadtplan · 4 Reisepass · 5 Puppenhaus · 6 Bücherregal · 7 Wochenplan · 8 Rucksackreise
  Nur Prototyp, Live-System unberührt. Kein Netz außer Schriften, keine KI.
-->
<style>
:root{--ink:#15163a;--bg:#eef7f1;--acc:#ff6b5a;--mustard:#ffd24a;--sage:#c7e89a;--sky:#d3eef6;--plum:#cdbdf2;--pink:#f7bcd8;--peach:#ffd0b0;--sun:#ffe08a;--teal:#1f93b0;--muted:#5f7068;--ow:2.5px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden}
button{font-family:inherit;color:var(--ink)}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative}
/* Umschalter */
.vw{flex:0 0 auto;background:var(--ink);padding:calc(.5rem + env(safe-area-inset-top)) .5rem .5rem;display:flex;gap:.4rem;align-items:center}
.vw .chips{flex:1;display:flex;gap:.35rem;overflow-x:auto;scrollbar-width:none}
.vw .chips::-webkit-scrollbar{display:none}
.vw .c{flex:0 0 auto;border:2px solid #fff;background:transparent;color:#fff;border-radius:999px;padding:.42rem .7rem;font:800 .74rem/1 'DM Sans';cursor:pointer;white-space:nowrap}
.vw .c.on{background:#fff;color:var(--ink)}
.vw .q{flex:0 0 32px;height:32px;border-radius:999px;border:2px solid #fff;background:var(--mustard);font:800 .95rem 'DM Sans';cursor:pointer}
.screen{flex:1;min-height:0;display:none;flex-direction:column}
.screen.on{display:flex}
.stage{flex:1;min-height:0;overflow:auto;padding:1rem 1.1rem 1.6rem}
.fade{animation:fd .35s ease both}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.row{display:flex;gap:.6rem;align-items:flex-start;margin:0 0 1rem}
.av{flex:0 0 40px;height:40px}
.says{flex:1;background:#fff;border:var(--ow) solid var(--ink);border-radius:18px;box-shadow:3px 4px 0 var(--ink);padding:.6rem .85rem;font:500 .98rem/1.35 'DM Sans'}
.eb{font:700 .62rem/1.2 'DM Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.es{font:italic 500 .92rem/1.25 'Lora',serif;color:rgba(21,22,58,.72)}
.pulse{animation:pl 1.8s ease-in-out infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(255,107,90,.55)}50%{box-shadow:0 0 0 9px rgba(255,107,90,0)}}

/* ---------- Lektion (gemeinsam) ---------- */
.lk{flex:0 0 auto;display:flex;gap:.7rem;align-items:center;padding:.65rem .9rem .7rem;background:rgba(255,255,255,.92);border-bottom:var(--ow) solid var(--ink)}
.back{flex:0 0 38px;height:38px;border-radius:999px;border:var(--ow) solid var(--ink);background:#fff;font:800 1.2rem 'DM Sans';cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.lk .t b{display:block;font:900 1.15rem/1.15 'Archivo Black',sans-serif}
.zimmer{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.zi{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;min-height:7.4rem;border:var(--ow) solid var(--ink);border-radius:18px;box-shadow:3px 4px 0 var(--ink);cursor:pointer;padding:.6rem .4rem;text-align:center}
.zi:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.zi .n{position:absolute;top:.45rem;left:.6rem;font:700 .7rem 'DM Mono',monospace}
.zi .ok{position:absolute;top:.35rem;right:.55rem;font:800 .85rem 'DM Sans'}
.zi .em{font-size:1.9rem;line-height:1}
.zi .tt{font:800 .9rem/1.15 'DM Sans'}
.zi .ss{font:600 .7rem/1.2 'DM Sans';color:rgba(21,22,58,.7)}
.zi.next{outline:3px dashed var(--acc);outline-offset:3px}
.zi.done{opacity:.72}
.hinweis{font:600 .8rem/1.35 'DM Sans';color:var(--muted);text-align:center;margin:1rem .3rem 0}

/* ---------- 1 Inhaltsverzeichnis ---------- */
.papier{background:#fffdf7;border:var(--ow) solid var(--ink);border-radius:6px 18px 18px 6px;box-shadow:4px 5px 0 var(--ink);padding:1.2rem 1.1rem 1rem;position:relative}
.papier:before{content:'';position:absolute;left:10px;top:0;bottom:0;border-left:2px solid #f3c1b9}
.papier h2{font:900 1.6rem/1 'Archivo Black',sans-serif;margin:0 0 .2rem 1rem}
.papier .eb{margin-left:1rem;margin-bottom:.9rem}
.ixh{font:800 .72rem/1 'DM Mono',monospace;letter-spacing:.16em;text-transform:uppercase;margin:1rem 0 .4rem 1rem;color:var(--teal)}
.ix{display:flex;align-items:baseline;gap:.6rem;width:100%;background:none;border:none;text-align:left;cursor:pointer;padding:.45rem .2rem .45rem 1rem;border-radius:8px}
.ix:active{background:rgba(255,210,74,.35)}
.ix .nr{flex:0 0 1.8rem;font:900 1.3rem/1 'Archivo Black',sans-serif}
.ix .tx{flex:1;min-width:0}
.ix .tt{font:800 1rem/1.2 'DM Sans'}
.ix .dots{flex:1;border-bottom:2px dotted rgba(21,22,58,.35);transform:translateY(-4px);min-width:12px}
.ix .st{flex:0 0 auto;font:700 .74rem 'DM Mono',monospace}
.ix.jetzt{background:rgba(255,210,74,.55)}
.ix.zu .tt,.ix.zu .nr{opacity:.55}

/* ---------- 2 U-Bahn ---------- */
.ubahn{position:relative;padding:.4rem 0 .4rem 0}
.linie-kopf{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem}
.linie-kopf .lb{background:#2f9e44;color:#fff;font:900 .95rem 'Archivo Black';border:var(--ow) solid var(--ink);border-radius:8px;padding:.15rem .55rem}
.halt{display:flex;align-items:center;gap:.9rem;position:relative;padding:.55rem 0;width:100%;background:none;border:none;text-align:left;cursor:pointer}
.halt:before{content:'';position:absolute;left:15px;top:0;bottom:0;width:10px;background:#2f9e44;border-left:2px solid var(--ink);border-right:2px solid var(--ink)}
.halt:first-of-type:before{top:50%}
.halt.ende:before{bottom:50%}
.halt .pt{position:relative;z-index:1;flex:0 0 40px;height:40px;border-radius:999px;background:#fff;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.halt.ok .pt{background:var(--sage)}
.halt.jetzt .pt{background:var(--mustard);transform:scale(1.12)}
.halt .tt{font:800 1rem/1.2 'DM Sans'}
.halt.zu .tt{opacity:.6}
.halt .hier{display:inline-block;margin-left:.4rem;font:800 .6rem 'DM Sans';background:var(--acc);color:#fff;border-radius:999px;padding:.12rem .45rem;vertical-align:2px}
.umst{margin:.6rem 0 0 0;display:flex;align-items:center;gap:.5rem;font:700 .85rem 'DM Sans'}
.umst .lb{background:#1c7ed6;color:#fff;font:900 .8rem 'Archivo Black';border:2px solid var(--ink);border-radius:8px;padding:.1rem .45rem}

/* ---------- 3 Stadtplan ---------- */
.stadt{background:#f4efe2;border:var(--ow) solid var(--ink);border-radius:18px;box-shadow:4px 5px 0 var(--ink);overflow:hidden}
.stadt svg{display:block;width:100%;height:auto}
.stadt .mk{cursor:pointer}
.stadt text{font:800 9.5px 'DM Sans';fill:#15163a}

/* ---------- 4 Reisepass ---------- */
.pass{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.seite{background:#fbf6ea;border:var(--ow) solid var(--ink);border-radius:12px;box-shadow:3px 4px 0 var(--ink);padding:.6rem .55rem .7rem;cursor:pointer;text-align:left;position:relative}
.seite.jetzt{background:#fff3c9;transform:rotate(-1.2deg)}
.seite .kopf{display:flex;gap:.35rem;align-items:baseline}
.seite .kopf b{font:900 1rem 'Archivo Black'}
.seite .kopf span{font:800 .8rem/1.15 'DM Sans'}
.stempel{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem;margin-top:.55rem}
.stempel i{aspect-ratio:1;border:2px dashed rgba(21,22,58,.35);border-radius:999px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.95rem}
.stempel i.voll{border:2px solid #c2410c;background:rgba(255,107,90,.12);transform:rotate(-12deg)}

/* ---------- 5 Puppenhaus ---------- */
.haus{margin:0 auto;max-width:360px}
.dach{height:0;border-left:180px solid transparent;border-right:180px solid transparent;border-bottom:70px solid var(--acc);position:relative;margin:0 auto;width:0}
.dachname{text-align:center;font:900 .85rem 'Archivo Black';margin:-2.2rem 0 1.2rem;color:#fff;position:relative}
.stock{display:flex;align-items:center;gap:.5rem;background:#fffaf0;border:var(--ow) solid var(--ink);border-top-width:0;padding:.45rem .55rem;cursor:pointer;width:100%;text-align:left}
.stock:first-of-type{border-top-width:var(--ow)}
.stock .nr{flex:0 0 1.6rem;font:900 1rem 'Archivo Black'}
.stock .nm{flex:0 0 7.2rem;font:800 .78rem/1.15 'DM Sans'}
.stock .fenster{flex:1;display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.stock .fenster i{height:20px;border:2px solid var(--ink);border-radius:3px;background:#dfe4ea}
.stock .fenster i.an{background:#ffe08a}
.stock.jetzt{background:#fff3c9}
.stock .cap{flex:0 0 26px;height:26px}
.stock.zu{opacity:.7}
.boden{height:14px;background:#7a5a3a;border:var(--ow) solid var(--ink);border-top:0;border-radius:0 0 6px 6px}

/* ---------- 6 Bücherregal ---------- */
.regal{background:#e9dcc6;border:var(--ow) solid var(--ink);border-radius:14px;box-shadow:4px 5px 0 var(--ink);padding:.9rem .7rem .4rem}
.brett{display:flex;align-items:flex-end;gap:5px;min-height:190px;padding:0 .2rem;border-bottom:12px solid #8a6440;margin-bottom:1rem;position:relative}
.buch{flex:1;border:var(--ow) solid var(--ink);border-radius:5px 5px 2px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:.4rem 0 .5rem;transition:transform .25s}
.buch .bn{font:900 .85rem 'Archivo Black'}
.buch .bt{writing-mode:vertical-rl;transform:rotate(180deg);font:800 .78rem/1 'DM Sans';margin-top:.4rem;white-space:nowrap;overflow:hidden;max-height:120px}
.buch .bk{margin-top:auto;font-size:.75rem}
.buch.jetzt{transform:translateY(-14px);box-shadow:0 8px 0 rgba(0,0,0,.15)}
.buch.zu{filter:saturate(.55)}
.buch.raus{transform:translateY(-60px) scale(1.06)}

/* ---------- 7 Wochenplan ---------- */
.wochen{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.4rem;margin-bottom:.8rem;scrollbar-width:none}
.wochen button{flex:0 0 auto;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:.4rem .55rem;font:800 .75rem/1.15 'DM Sans';cursor:pointer;text-align:center}
.wochen button.ok{background:var(--sage)}
.wochen button.on{background:var(--mustard);box-shadow:2px 2px 0 var(--ink)}
.plan{background:#fff;border:var(--ow) solid var(--ink);border-radius:18px;box-shadow:4px 5px 0 var(--ink);overflow:hidden}
.plan .kopf{padding:.7rem .9rem;border-bottom:2px solid var(--ink);background:var(--sky)}
.plan .kopf b{font:900 1.1rem 'Archivo Black'}
.tag{display:flex;align-items:center;gap:.7rem;padding:.55rem .9rem;border-bottom:1.5px solid rgba(21,22,58,.15);width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left;cursor:pointer}
.tag:last-child{border-bottom:none}
.tag .wd{flex:0 0 2.2rem;font:700 .78rem 'DM Mono',monospace}
.tag .em{font-size:1.2rem}
.tag .tt{flex:1;font:800 .92rem 'DM Sans'}
.tag .ok{font:800 .85rem 'DM Sans'}
.tag.heute{background:#fff3c9}
.tag.heute .wd:after{content:' ●';color:var(--acc)}

/* ---------- 8 Rucksackreise ---------- */
.karte{background:#d7ecf6;border:var(--ow) solid var(--ink);border-radius:18px;box-shadow:4px 5px 0 var(--ink);overflow:hidden}
.karte svg{display:block;width:100%;height:auto}
.karte text{font:800 9px 'DM Sans';fill:#15163a}
.rucksack{margin-top:1rem;background:#fff;border:var(--ow) solid var(--ink);border-radius:18px;box-shadow:3px 4px 0 var(--ink);padding:.8rem .9rem}
.rucksack .ding{display:inline-block;margin:.25rem .3rem 0 0;background:var(--sun);border:2px solid var(--ink);border-radius:999px;padding:.15rem .55rem;font:600 .85rem 'Lora',serif}

/* Leiste unten */
.bnav{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-around;padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));background:#fff;border-top:2.5px solid var(--ink)}
.tab{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.12rem;color:#5f7068;font:700 .68rem 'DM Sans'}
.tab .tic{font-size:1.25rem;height:26px;display:flex;align-items:center}
.tab.center{flex:0 0 auto}
.tab.center .ball{width:58px;height:58px;border-radius:999px;background:#fff;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:3px 4px 0 var(--ink);transform:translateY(-12px)}
.tab.center .ball svg{width:44px;height:44px}
.tab.center .lbl{transform:translateY(-10px);color:var(--ink)}

.pop{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;font:600 .88rem/1.35 'DM Sans';padding:.55rem .9rem;border-radius:12px;display:none;max-width:86%;text-align:center}
.pop.on{display:block}
.sheetbg{position:fixed;inset:0;background:rgba(21,22,58,.45);z-index:95;display:none;align-items:flex-end;justify-content:center}
.sheetbg.on{display:flex}
.sheet{width:100%;max-width:560px;max-height:86%;overflow:auto;background:#fff;border:var(--ow) solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0;padding:1.1rem 1.2rem calc(1.3rem + env(safe-area-inset-bottom))}
.sheet h3{font:900 1.2rem/1.2 'Archivo Black';margin-bottom:.6rem}
.sheet h4{font:800 .9rem 'DM Sans';margin:.8rem 0 .2rem}
.sheet p{font:500 .92rem/1.42 'DM Sans';margin:.15rem 0}
.zu-btn{display:block;margin:1rem auto 0;border:var(--ow) solid var(--ink);border-radius:999px;background:#fff;padding:.6rem 1.2rem;font:800 .95rem 'DM Sans';cursor:pointer;box-shadow:2px 3px 0 var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
 <div class="vw"><div class="chips" id="chips"></div><button class="q" onclick="idee()" aria-label="Was ist die Idee?">?</button></div>
 <section class="screen on" id="s-home"><div class="stage" id="home"></div></section>
 <section class="screen" id="s-lek">
  <div class="lk"><button class="back" onclick="zurueck()">‹</button><div class="t"><div class="eb" id="lk-eb"></div><b id="lk-t"></b><div class="es" id="lk-es"></div></div></div>
  <div class="stage" id="lek"></div>
 </section>
 <nav class="bnav">
  <button class="tab" onclick="zimmer()"><span class="tic">🚪</span><span>Alle Zimmer</span></button>
  <button class="tab center" onclick="zurueck()"><span class="ball" data-capy></span><span class="lbl">Spikiu</span></button>
  <button class="tab" onclick="toast('Mein bleibt wie bisher.')"><span class="tic">👤</span><span>Mein</span></button>
 </nav>
</div>
<div class="pop" id="pop"></div>
<div class="sheetbg" id="sheetbg" onclick="if(event.target===this)zu()"><div class="sheet" id="sheet"></div></div>

<script>
var CAPY='<svg viewBox="0 0 80 80" fill="none" width="100%" height="100%"><ellipse cx="40" cy="50" rx="28" ry="20" fill="#c9956a"/><ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/><ellipse cx="40" cy="36" rx="10" ry="7" fill="#b8845a"/><ellipse cx="40" cy="33" rx="4" ry="2.5" fill="#8b5e3c"/><circle cx="38" cy="33" r="1" fill="#6b4226"/><circle cx="42" cy="33" r="1" fill="#6b4226"/><circle cx="33" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="47" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="34" cy="23" r="1.2" fill="white"/><circle cx="48" cy="23" r="1.2" fill="white"/><ellipse cx="26" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="54" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="22" cy="66" rx="7" ry="5" fill="#b8845a"/><ellipse cx="34" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="46" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="58" cy="66" rx="7" ry="5" fill="#b8845a"/><path d="M36 38 Q40 41 44 38" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>';
function capys(r){(r||document).querySelectorAll('[data-capy]').forEach(function(e){if(!e.innerHTML)e.innerHTML=CAPY;});}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* Die zehn Lernstationen der ersten Stufe (aus lernpfad-daten.js) */
var LEK=[
 {em:'☕',t:'Im Café',es:'En la cafetería',wort:'un café con leche'},
 {em:'🍽️',t:'Im Restaurant',es:'En el restaurante',wort:'la cuenta'},
 {em:'🛒',t:'Einkaufen',es:'De compras',wort:'¿Cuánto cuesta?'},
 {em:'🧭',t:'Nach dem Weg fragen',es:'Preguntar el camino',wort:'a la derecha'},
 {em:'🚕',t:'Im Taxi',es:'En el taxi',wort:'a la estación, por favor'},
 {em:'👪',t:'Über die Familie',es:'La familia',wort:'mi hermana'},
 {em:'🏨',t:'Im Hotel',es:'En el hotel',wort:'una habitación doble'},
 {em:'🚉',t:'Am Bahnhof',es:'En la estación',wort:'un billete de ida'},
 {em:'🩺',t:'Beim Arzt',es:'En el médico',wort:'me duele la cabeza'},
 {em:'🌤️',t:'Über das Wetter',es:'El tiempo',wort:'hace sol'}
];
/* Die Zimmer jeder Lektion — immer dieselben, immer in derselben Reihenfolge */
var ZI=[
 {em:'🃏',t:'Wörter',s:'Die neuen Wörter',bg:'#ffd0b0'},
 {em:'🎧',t:'Hören',s:'Die Szene anhören',bg:'#d3eef6'},
 {em:'🎭',t:'Geführtes Gespräch',s:'Sätze zur Auswahl',bg:'#ffd24a'},
 {em:'🗣️',t:'Selbst sprechen',s:'Dieselbe Szene, deine Sätze',bg:'#c7e89a'},
 {em:'🥁',t:'Aussprache',s:'Wo liegt der Schlag?',bg:'#ffe08a'},
 {em:'📘',t:'Grammatik',s:'Eine Regel, kurz',bg:'#cdbdf2'},
 {em:'📖',t:'Lesen',s:'Ein Stück Geschichte',bg:'#f7bcd8'},
 {em:'🪅',t:'Spiel',s:'Zum Abschluss',bg:'#ffb27a'}
];
/* Beispiel-Fortschritt: Lektion 1–2 fertig, in Lektion 3 die ersten drei Zimmer */
var JETZT=2,IN_JETZT=3;
function status(i){return i<JETZT?'ok':(i===JETZT?'jetzt':'zu');}
function zimmerFertig(i,z){return i<JETZT||(i===JETZT&&z<IN_JETZT);}

var VAR=0,LETZTE=null;
var NAMEN=['1 Inhalt','2 U-Bahn','3 Stadtplan','4 Reisepass','5 Puppenhaus','6 Bücherregal','7 Wochenplan','8 Rucksack'];
var chips=document.getElementById('chips');
NAMEN.forEach(function(n,i){var b=document.createElement('button');b.className='c'+(i===0?' on':'');b.textContent=n;
 b.onclick=function(){VAR=i;chips.querySelectorAll('.c').forEach(function(x,k){x.classList.toggle('on',k===i);});zeigeHome();};chips.appendChild(b);});

function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function home(){return document.getElementById('home');}
function sagt(t){return '<div class="row"><div class="av" data-capy></div><div class="says">'+t+'</div></div>';}
function zeigeHome(){document.getElementById('s-home').classList.add('on');document.getElementById('s-lek').classList.remove('on');
 var h=home();h.innerHTML='';h.scrollTop=0;var w=document.createElement('div');w.className='fade';h.appendChild(w);FORM[VAR](w);capys(w);}
function zurueck(){zeigeHome();}
var tt;function toast(t){var p=document.getElementById('pop');p.textContent=t;p.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){p.classList.remove('on');},2400);}
function blatt(h){var s=document.getElementById('sheet');s.innerHTML=h+'<button class="zu-btn" onclick="zu()">Schließen</button>';document.getElementById('sheetbg').classList.add('on');}
function zu(){document.getElementById('sheetbg').classList.remove('on');}

/* ---------- Die Lektion von innen (für alle acht gleich) ---------- */
function oeffne(i){LETZTE=i;var L=LEK[i];
 document.getElementById('lk-eb').textContent='Lektion '+(i+1);document.getElementById('lk-t').textContent=L.em+' '+L.t;document.getElementById('lk-es').textContent=L.es;
 var s=document.getElementById('lek');s.innerHTML='';s.scrollTop=0;var w=document.createElement('div');w.className='fade';
 var naechstes=-1;for(var z=0;z<ZI.length;z++){if(!zimmerFertig(i,z)){naechstes=z;break;}}
 w.innerHTML=sagt(i<JETZT?'Diese Lektion hast du schon gemacht. Du kannst jedes Zimmer wieder betreten.':(i===JETZT?'Hier warst du zuletzt. Das nächste Zimmer ist markiert.':'Jede Lektion hat dieselben Zimmer, in derselben Reihenfolge.'));
 var g=document.createElement('div');g.className='zimmer';
 ZI.forEach(function(Z,z){var f=zimmerFertig(i,z);var b=document.createElement('button');b.className='zi'+(f?' done':'')+(z===naechstes&&i<=JETZT?' next':'');b.style.background=Z.bg;
  b.innerHTML='<span class="n">'+(z+1)+'</span>'+(f?'<span class="ok">✓</span>':'')+'<span class="em">'+Z.em+'</span><span class="tt">'+Z.t+'</span><span class="ss">'+Z.s+'</span>';
  b.onclick=function(){toast(Z.t+' · Lektion '+(i+1)+' öffnet sich.');};g.appendChild(b);});
 w.appendChild(g);
 w.appendChild(el('<div class="hinweis">Gesprächsrückmeldung ohne KI, null Token. Das freie Gespräch mit KI kommt später als eigenes Zimmer.</div>'));
 s.appendChild(w);capys(w);
 document.getElementById('s-home').classList.remove('on');document.getElementById('s-lek').classList.add('on');}

/* ---------- Alle Zimmer zum freien Üben ---------- */
function zimmer(){blatt('<h3>Alle Zimmer</h3><p>Zum freien Üben, quer durch alle Lektionen. Immer an derselben Stelle.</p>'+
 '<div class="zimmer" style="margin-top:.8rem">'+[
  ['🃏','Wortschatz','Feines Ohr · Korb · Regionalismen · Wendungen','#ffd0b0'],
  ['🥁','Aussprache','Der Schlag, später mehr','#ffe08a'],
  ['📖','Lesen','Lernroman · Grammatik','#f7bcd8'],
  ['💬','Konversation','Mit KI · später · Premium','#c7e89a'],
  ['✍️','Werkstatt','Leseverstehen · Schreiben','#cdbdf2'],
  ['🪅','Spiele','Piñata · Luftballons · Wortkette · Memory','#ffe08a']
 ].map(function(z){return '<button class="zi" style="background:'+z[3]+'" onclick="toast(\''+z[1]+' öffnet sich.\')"><span class="em">'+z[0]+'</span><span class="tt">'+z[1]+'</span><span class="ss">'+z[2]+'</span></button>';}).join('')+'</div>');}

/* =============== Die acht Außenformen =============== */
var FORM=[];

/* 1 Inhaltsverzeichnis */
FORM[0]=function(w){

 LEK.forEach(function(L,i){var st=status(i);h+='<button class="ix '+st+'" data-i="'+i+'"><span class="nr">'+(i+1)+'</span><span class="tx"><span class="tt">'+L.t+'</span><br><span class="es">'+L.es+'</span></span><span class="st">'+(st==='ok'?'✓':(st==='jetzt'?'jetzt':''))+'</span></button>';});
 h+='<div class="ixh">🌿 Stamm</div><div style="margin-left:1rem;font:600 .85rem DM Sans;color:#5f7068">Dieselben zehn Orte, eine Stufe tiefer.</div></div>';
 w.innerHTML=h;w.querySelectorAll('.ix').forEach(function(b){b.onclick=function(){oeffne(+b.dataset.i);};});};

/* 2 U-Bahn-Linie */
FORM[1]=function(w){

 LEK.forEach(function(L,i){var st=status(i);h+='<button class="halt '+st+(i===LEK.length-1?' ende':'')+'" data-i="'+i+'"><span class="pt'+(st==='jetzt'?' pulse':'')+'">'+(st==='ok'?'✓':L.em)+'</span><span><span class="tt">'+L.t+(st==='jetzt'?'<span class="hier">Du bist hier</span>':'')+'</span><br><span class="es">'+L.es+'</span></span></button>';});
 h+='</div><div class="umst"><span class="lb">St</span>Umsteigen zur Stamm-Linie an der Endstation</div>';
 w.innerHTML=h;w.querySelectorAll('.halt').forEach(function(b){b.onclick=function(){oeffne(+b.dataset.i);};});};

 s+='</svg>';
 w.innerHTML=sagt('Das ist deine Stadt. Jede Lektion ist ein Ort. Ich stehe am Markt.')+'<div class="stadt">'+s+'</div>';
 w.querySelectorAll('.mk').forEach(function(g){g.addEventListener('click',function(){oeffne(+g.getAttribute('data-i'));});});};

/* 4 Reisepass / Sammelheft */
FORM[3]=function(w){
 var h=sagt('Dein Reisepass. Für jedes Zimmer gibt es einen Stempel — kein Zähler, nur Erinnerung.')+'<div class="pass">';
 LEK.forEach(function(L,i){var st=status(i);h+='<button class="seite '+st+'" data-i="'+i+'"><div class="kopf"><b>'+(i+1)+'</b><span>'+L.em+' '+L.t+'</span></div><div class="stempel">'+

 w.innerHTML=h+'</div>';w.querySelectorAll('.seite').forEach(function(b){b.onclick=function(){oeffne(+b.dataset.i);};});};

/* 5 Puppenhaus */
FORM[4]=function(w){
 var h=sagt('Unser Haus hat zehn Stockwerke. Jedes ist eine Lektion, mit denselben acht Zimmern.')+'<div class="haus"><div class="dach"></div><div class="dachname">Spikiu-Haus</div>';
 for(var i=LEK.length-1;i>=0;i--){var L=LEK[i],st=status(i);
  h+='<button class="stock '+st+'" data-i="'+i+'"><span class="nr">'+(i+1)+'</span><span class="nm">'+L.em+' '+L.t+'</span><span class="fenster">'+ZI.map(function(Z,z){return '<i class="'+(zimmerFertig(i,z)?'an':'')+'"></i>';}).join('')+'</span>'+(st==='jetzt'?'<span class="cap" data-capy></span>':'')+'</button>';}
 h+='<div class="boden"></div></div><div class="hinweis">Erleuchtete Fenster = Zimmer, in denen du schon warst.</div>';
 w.innerHTML=h;w.querySelectorAll('.stock').forEach(function(b){b.onclick=function(){oeffne(+b.dataset.i);};});
 setTimeout(function(){var j=w.querySelector('.stock.jetzt');if(j)j.scrollIntoView({block:'center'});},50);};

var FARBEN=['#ff6b5a','#ffd24a','#1f93b0','#9bd14a','#cdbdf2','#f7bcd8','#ffb27a','#2f9e44','#d3eef6','#ffe08a'];
FORM[5]=function(w){
 var h=sagt('Zehn Bücher, eins pro Lektion. Zieh eins heraus.')+'<div class="regal">';
 [[0,5],[5,10]].forEach(function(r){h+='<div class="brett">';for(var i=r[0];i<r[1];i++){var L=LEK[i],st=status(i);
  h+='<button class="buch '+st+'" data-i="'+i+'" style="background:'+FARBEN[i]+';height:'+(150+((i*37)%35))+'px"><span class="bn">'+(i+1)+'</span><span class="bt">'+L.t+'</span><span class="bk">'+(st==='ok'?'✓':L.em)+'</span></button>';}
  h+='</div>';});
 w.innerHTML=h+'</div>';
 w.querySelectorAll('.buch').forEach(function(b){b.onclick=function(){b.classList.add('raus');setTimeout(function(){oeffne(+b.dataset.i);},280);};});};

/* 7 Wochenplan */
var TAGE=['Mo','Di','Mi','Do','Fr','Sa','So'];
var PLAN=[[0],[1],[2],[3],[4,5],[6],[7]];
FORM[6]=function(w,woche){woche=woche==null?JETZT:woche;
 var heute=(new Date().getDay()+6)%7;
 var h=sagt('Eine Lektion pro Woche, jeden Tag ein Zimmer. Vorspringen darfst du immer.')+'<div class="wochen">';
 LEK.forEach(function(L,i){var st=status(i);h+='<button class="'+(st==='ok'?'ok':'')+(i===woche?' on':'')+'" data-w="'+i+'">W'+(i+1)+'<br>'+L.em+'</button>';});
 var L=LEK[woche];
 h+='</div><div class="plan"><div class="kopf"><div class="eb">Woche '+(woche+1)+'</div><b>'+L.em+' '+L.t+'</b><div class="es">'+L.es+'</div></div>';
 PLAN.forEach(function(p,t){var fertig=p.every(function(z){return zimmerFertig(woche,z);});
  h+='<button class="tag'+(woche===JETZT&&t===heute?' heute':'')+'"><span class="wd">'+TAGE[t]+'</span><span class="em">'+p.map(function(z){return ZI[z].em;}).join(' ')+'</span><span class="tt">'+p.map(function(z){return ZI[z].t;}).join(' + ')+'</span><span class="ok">'+(fertig?'✓':'')+'</span></button>';});
 w.innerHTML=h+'</div>';
 w.querySelectorAll('.wochen button').forEach(function(b){b.onclick=function(){w.innerHTML='';FORM[6](w,+b.dataset.w);capys(w);};});
 w.querySelectorAll('.tag').forEach(function(b){b.onclick=function(){oeffne(woche);};});
 setTimeout(function(){var o=w.querySelector('.wochen .on');if(o)o.scrollIntoView({inline:'center',block:'nearest'});},30);};
