<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spielkiste Zwei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=DM+Mono:wght@500&family=Lora:wght@500;600&display=swap">
<style>
/* Layout: eine Handy-Säule. Hub = fünf Türen, jedes Spiel = eine Bühne im Spikiu-Kartenstil. Prototyp: Spanisch lernen, Bedienung Deutsch. */
:root{
  --bg:#eef7f1; --card:#ffffff; --ink:#15163a; --mid:#5f7068; --faint:#dfe6e0;
  --accent:#1f93b0; --accent-soft:#e3f3f8; --you:#ffd24a; --you-soft:#fff3c4;
  --ok:#c7e89a; --ok2:#9bd14a; --warn:#c67a1e; --warn-bg:#fbf0e0;
  --f-ui:'DM Sans',system-ui,sans-serif; --f-word:'Lora',Georgia,serif; --f-label:'DM Mono',ui-monospace,monospace;
  --ow:2.5px; --sh:4px 5px 0 var(--ink);
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased}
body{padding-inline:16px;padding-block:0 36px}
.wrap{max-width:540px;margin:0 auto}
button,input{font-family:inherit;-webkit-tap-highlight-color:transparent;color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px;border-bottom:3px solid var(--ink);margin-bottom:18px}
.back{width:44px;height:44px;flex:none;border-radius:50%;border:var(--ow) solid var(--ink);background:var(--card);box-shadow:2px 3px 0 var(--ink);font:800 1.2rem var(--f-ui);cursor:pointer}
h1{font:800 1.35rem/1.1 var(--f-ui);margin:0}
.eyebrow{font:500 .7rem var(--f-label);letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin:0}
.spk{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.spk svg{width:52px;height:52px;flex:none;animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bubble{background:var(--card);border:var(--ow) solid var(--ink);border-radius:.3rem 1.2rem 1.2rem 1.2rem;box-shadow:3px 4px 0 var(--ink);padding:.6rem .85rem;font-size:.95rem;line-height:1.45;min-width:0}
.bubble em,.fb em{font-family:var(--f-word);font-style:normal;font-weight:600}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.door{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--card);border:var(--ow) solid var(--ink);border-radius:18px;box-shadow:var(--sh);padding:14px;cursor:pointer;min-width:0}
.door:active{transform:translate(3px,4px);box-shadow:1px 1px 0 var(--ink)}
.door .ic{font-size:1.7rem;line-height:1}
.door b{font-size:1rem}
.door span{font-size:.8rem;color:var(--mid);line-height:1.35}
.door.wide{grid-column:1/-1}
.note{font-size:.78rem;color:var(--mid);line-height:1.5;margin-top:18px;border-top:1.5px dashed var(--faint);padding-top:10px}
.stage{background:var(--card);border:var(--ow) solid var(--ink);border-radius:24px;box-shadow:var(--sh);padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.task{font:500 1.15rem/1.35 var(--f-word);margin:0;text-wrap:balance}
.fb{min-height:1.4em;font-weight:700;font-size:1rem;color:#2f6b3a;line-height:1.4}
.fb.soft{color:var(--warn)}
.btn{background:var(--accent);color:#fff;border:var(--ow) solid var(--ink);border-radius:100px;box-shadow:3px 4px 0 var(--ink);padding:.55rem 1.15rem;font-weight:800;font-size:.95rem;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.sun{background:var(--you);color:#15163a}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.wob{animation:wob .4s}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.pop{animation:pop .3s ease-out both}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
/* Encadenado */
.kette{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.glied{border:2.5px solid var(--ink);border-radius:14px;padding:.3rem .7rem;font:600 1.1rem/1.2 var(--f-word);display:inline-flex;flex-direction:column;align-items:center;box-shadow:2px 3px 0 var(--ink)}
.glied small{font:500 .7rem var(--f-ui);color:var(--mid)}
.glied.spikiu{background:var(--accent-soft)}
.glied.du{background:var(--you-soft)}
.glied b.L{color:var(--accent)}
.link{color:var(--mid);font-weight:800}
.inrow{display:flex;gap:8px;width:100%;flex-wrap:wrap}
.inrow input{flex:1 1 10rem;min-width:0;border:2px solid var(--ink);border-radius:100px;padding:.55rem 1rem;font:500 1.1rem var(--f-word);background:#fff}
.hint{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:#fff;padding:0;display:grid;place-items:center;cursor:pointer;flex:none}
.hint svg{width:30px;height:30px}
.pattern{font:500 .95rem var(--f-label);color:var(--mid);min-height:1.3em;letter-spacing:.08em}
/* Oído fino + Memoria */
.bilder{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.bild{background:#fff;border:var(--ow) solid var(--ink);border-radius:18px;box-shadow:3px 4px 0 var(--ink);padding:10px;cursor:pointer;aspect-ratio:1/1;display:grid;place-items:center;max-width:100%}
.bild img{width:72%;height:auto}
.bild.ok{background:var(--ok)}
.bild.no{background:var(--warn-bg);border-color:var(--warn);opacity:.6}
.big{font-size:1.1rem}
/* El golpe */
.silben{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.silbe{min-width:64px;padding:.7rem .8rem;border:var(--ow) solid var(--ink);border-radius:16px;background:#fff;box-shadow:3px 4px 0 var(--ink);font:600 1.5rem var(--f-word);cursor:pointer}
.silbe.ok{background:var(--you);transform:translateY(-4px)}
.silbe.no{background:var(--warn-bg);border-color:var(--warn)}
.silbe.klopf{background:var(--accent-soft)}
.loesung{font:600 1.6rem var(--f-word)}
.loesung b{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:.2em}
/* Al mercado */
.ware{font:600 1.9rem var(--f-word);border:var(--ow) solid var(--ink);border-radius:18px;padding:.7rem 1.2rem;background:var(--you-soft);box-shadow:3px 4px 0 var(--ink)}
.koerbe{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.korb{background:#fff;border:var(--ow) solid var(--ink);border-radius:14px 14px 28px 28px;box-shadow:3px 4px 0 var(--ink);padding:10px 8px;cursor:pointer;min-height:130px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.korb b{font-size:.95rem}
.korb .inhalt{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.korb .inhalt span{font:500 .8rem var(--f-word);background:var(--ok);border-radius:8px;padding:1px 6px}
.korb.no{border-color:var(--warn);background:var(--warn-bg)}
/* Memoria */
.memo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.mk{aspect-ratio:3/4;border:var(--ow) solid var(--ink);border-radius:12px;box-shadow:2px 3px 0 var(--ink);background:var(--accent);cursor:pointer;display:grid;place-items:center;padding:4px;font:600 .9rem/1.15 var(--f-word);color:var(--ink);max-width:100%;overflow:hidden;overflow-wrap:anywhere}
.mk .rueck{color:#fff;font:800 1.4rem var(--f-ui)}
.mk.auf{background:#fff}
.mk.paar{background:var(--ok);cursor:default}
.mk img{width:80%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head><body>
<div class="wrap">
  <header class="bar">
    <button class="back" id="back" hidden aria-label="Zurück">‹</button>
    <div><p class="eyebrow">Spikiu · Spielkiste</p><h1 id="title">Neue Spiele</h1></div>
  </header>
  <main id="app"></main>
</div>

function mercado(){
 var st=buehne(),moll=mollRunde();
 var ess=mezcla(FELD.filter(function(x){return x.stufe<=1&&x.nackt.indexOf(' ')<0;})).slice(0,3).map(function(x){return{x:x,k:0};});
 var weg=mezcla(UNTERWEGS.filter(function(x){return x[2]<=1&&x[0].indexOf(' ',x[0].indexOf(' ')+1)<0;})).slice(0,3).map(function(x){return{x:{z:x[0],tr:x[1],nackt:nackt(x[0])},k:1};});
 var liste=mezcla(ess.concat(weg)),n=0;
 st.appendChild(el('p','task','In welchen Korb gehört das Wort?'));
 var ware=el('div','ware');st.appendChild(ware);var tr=el('div','fb');st.appendChild(tr);
 var kb=el('div','koerbe');st.appendChild(kb);var fb=el('div','fb');st.appendChild(fb);
 var K=[['🥘','Comer y beber'],['🧳','Unterwegs']].map(function(x,i){var b=el('button','korb');b.innerHTML='<span style="font-size:1.6rem">'+x[0]+'</span><b>'+x[1]+'</b><div class="inhalt"></div>';kb.appendChild(b);b.onclick=function(){waehle(i,b);};return b;});
 function zeige(){if(n>=liste.length){ware.textContent='¡Listo!';tr.textContent='';klang('dur');fb.className='fb';fb.textContent='Alle Wörter liegen im richtigen Korb.';nochmal(st,mercado);return;}var x=liste[n].x;ware.textContent=x.nackt;ware.classList.remove('pop');void ware.offsetWidth;ware.classList.add('pop');tr.textContent='';sprich(x.z);}
 function waehle(i,b){if(n>=liste.length)return;var it=liste[n];
  if(it.k===i){var sp=el('span',null,it.x.nackt);b.querySelector('.inhalt').appendChild(sp);fb.className='fb';fb.innerHTML='<em>'+esc(it.x.nackt)+'</em> = '+esc(it.x.tr);n++;setTimeout(zeige,600);}
  else{moll();b.classList.add('no');wob(b);setTimeout(function(){b.classList.remove('no');},500);fb.className='fb soft';fb.innerHTML='<em>'+esc(it.x.nackt)+'</em> gehört in den anderen Korb.';}}
 zeige();
}

/* ═══ 5. MEMORIA ═══ */
function memoria(){
 var st=buehne(),wahl=mezcla(BILD).slice(0,4),karten=[];
 wahl.forEach(function(w){var f=imFeld(w);karten.push({id:w,typ:'bild'});karten.push({id:w,typ:'wort',txt:f?f.nackt:w,tr:f?f.tr:''});});
 karten=mezcla(karten);
 st.appendChild(el('p','task','Deck zwei Karten auf: Wort und Bild gehören zusammen.'));
 var g=el('div','memo');st.appendChild(g);var fb=el('div','fb');st.appendChild(fb);
 var offen=[],paare=0,sperre=false;
 karten.forEach(function(k){var b=el('button','mk');b.innerHTML='<span class="rueck">?</span>';g.appendChild(b);k.b=b;
  b.onclick=function(){if(sperre||k.auf||k.paar)return;k.auf=true;b.classList.add('auf');b.innerHTML=k.typ==='bild'?'<img alt="" src="'+ASSETS[k.id]+'">':esc(k.txt);if(k.typ==='wort')sprich(k.txt);offen.push(k);
   if(offen.length===2){var a=offen[0],c=offen[1];offen=[];
    if(a.id===c.id&&a.typ!==c.typ){a.paar=c.paar=true;a.b.classList.add('paar');c.b.classList.add('paar');var w=a.typ==='wort'?a:c;fb.className='fb';fb.innerHTML='<em>'+esc(w.txt)+'</em> = '+esc(w.tr);
     if(++paare===4){klang('dur');fb.textContent='Alle Paare gefunden.';nochmal(st,memoria);}}
    else{sperre=true;setTimeout(function(){[a,c].forEach(function(x){x.auf=false;x.b.classList.remove('auf');x.b.innerHTML='<span class="rueck">?</span>';});sperre=false;},900);}}};});
}

router();
</script>
