<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spikiu · Lernweg</title>
<link rel="stylesheet" href="/fonts/spikiu-fonts.css">
<style>
/* ═══ Lernweg — still, minimal. Der Baum trägt. Keine Zahlen, kein Druck. ═══ */
:root{ --minz:#eef7f1; --ink:#15163a; --muted:#5f7068; --acc:#2d6a4f; --ow:2.5px; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--minz);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;cursor:pointer}
.rnav{flex:0 0 auto;display:flex;align-items:center;gap:.7rem;
  padding:calc(.6rem + env(safe-area-inset-top)) .9rem .6rem;
  background:var(--minz);border-bottom:var(--ow) solid var(--ink)}
.rnav .back{width:36px;height:36px;flex:0 0 36px;border-radius:999px;border:2.5px solid var(--ink);
  background:#fff;font-size:1.15rem;line-height:1;box-shadow:2px 2px 0 var(--ink);
  display:flex;align-items:center;justify-content:center}
.rnav .back:active{transform:translate(1px,1px);box-shadow:0 0 0 var(--ink)}
.rnav .rtitle{font:800 1.05rem 'DM Sans',sans-serif}
.wrap{flex:1;min-height:0;overflow-y:auto;padding:1.1rem 1.05rem 2rem;max-width:560px;width:100%;margin:0 auto}
.card{background:#fff;border:var(--ow) solid var(--ink);border-radius:20px;box-shadow:4px 5px 0 var(--ink);
  padding:1.15rem 1.15rem 1.25rem;margin-bottom:1rem}
.lbl{font:800 .68rem 'DM Sans',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--acc);margin-bottom:.55rem}
/* Baum */
.baum-card{text-align:center}
.etappe-pill{display:inline-block;font:800 .8rem 'DM Sans',sans-serif;border:2px solid var(--ink);
  border-radius:100px;padding:.28rem .85rem;background:var(--minz);box-shadow:2px 2px 0 var(--ink);margin-bottom:.7rem}
#baumWrap{display:flex;justify-content:center}
#baumWrap svg{max-width:230px;height:auto}
.leafline{font:600 .85rem 'DM Sans',sans-serif;color:var(--muted);margin-top:.6rem}
/* Versprechen */
.versprechen{font-family:'Lora',serif;font-size:1.15rem;line-height:1.5;color:var(--ink)}
/* Weg */
.weg-step{display:flex;gap:.7rem;align-items:flex-start;padding:.5rem 0}
.weg-step + .weg-step{border-top:1.5px solid #e6efe8}
.weg-dot{flex:0 0 26px;width:26px;height:26px;border-radius:999px;border:2px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font:800 .78rem 'DM Sans',sans-serif;background:#fff;margin-top:.1rem}
.weg-step.jetzt .weg-dot{background:var(--acc);color:#fff}
.weg-name{font:700 .95rem 'DM Sans',sans-serif}
.weg-sub{font:500 .82rem/1.4 'DM Sans',sans-serif;color:var(--muted)}
/* Szenen */
.szenen-chips{display:flex;flex-wrap:wrap;gap:.5rem}
.szene-chip{font:700 .88rem 'DM Sans',sans-serif;background:#e8f5ee;border:2px solid var(--ink);
  border-radius:100px;padding:.4rem .85rem;box-shadow:2px 2px 0 var(--ink)}
.leer{font:600 .9rem/1.5 'DM Sans',sans-serif;color:var(--muted)}
.leer a{color:var(--acc);font-weight:800;text-decoration:none}
</style>
</head>
<body>
<header class="rnav">
  <button class="back" onclick="history.length>1?history.back():location.href='haus.html'" aria-label="zurück">‹</button>
  <div class="rtitle" id="pageTitle">Lernweg</div>
</header>
<div class="wrap">

  <div class="card baum-card">
    <div class="etappe-pill" id="etappePill">🌱</div>
    <div id="baumWrap"></div>
    <div class="leafline" id="leafline"></div>
  </div>

  <div class="card" id="verspCard" style="display:none">
    <div class="lbl" id="verspLbl">Mein Versprechen</div>
    <div class="versprechen" id="verspText"></div>
  </div>

  <div class="card" id="wegCard" style="display:none">
    <div class="lbl" id="wegLbl">Mein Weg</div>
    <div id="wegList"></div>
  </div>

  <div class="card">
    <div class="lbl" id="szenenLbl">Geübte Szenen</div>
    <div class="szenen-chips" id="szenenChips" style="display:none"></div>
    <div class="leer" id="szenenLeer" style="display:none"></div>
  </div>

</div>
<script src="baum.js"></script>
<script src="szenen.js"></script>
<script>
/* Lernweg — liest NUR, zeigt still. Keine Zahlen, kein Fortschritts-Prozent. */
(function () {
  'use strict';

  // Alte Links (chat.html → dashboard.html#lektionen / #lesson=…) weiterleiten.
  if (/^#(lektionen|lesson)/.test(location.hash)) { location.replace('lektionen.html'); return; }

  var u = {};
  try { u = JSON.parse(localStorage.getItem('spikiu_user') || '{}'); } catch (e) { u = {}; }
  var P = u.profile || {};
  var MUT = (['de','es','en'].indexOf(P.muttersprache) > -1) ? P.muttersprache
          : ({ 'Deutsch':'de', 'Español':'es', 'English':'en' }[u.nativeLang] || 'de');

  var T = {
    de: { titel:'Lernweg', etappen:{ samen:'🌱 Samen', stamm:'🌿 Stamm', krone:'🌳 Krone' },
          leaf:'Jede Szene lässt ein Blatt wachsen.', versp:'Mein Versprechen', weg:'Mein Weg',
          szenen:'Geübte Szenen',
          leer:'Noch keine Szene geübt. Beginne im <a href="gefuehrt.html">Geführten Gespräch</a> — dann wächst hier dein Weg.' },
    es: { titel:'Camino', etappen:{ samen:'🌱 Semilla', stamm:'🌿 Tronco', krone:'🌳 Copa' },
          leaf:'Cada escena hace crecer una hoja.', versp:'Mi promesa', weg:'Mi camino',
          szenen:'Escenas practicadas',
          leer:'Aún no has practicado ninguna escena. Empieza en la <a href="gefuehrt.html">Conversación guiada</a>.' },
    en: { titel:'Path', etappen:{ samen:'🌱 Seed', stamm:'🌿 Trunk', krone:'🌳 Crown' },
          leaf:'Every scene grows a new leaf.', versp:'My promise', weg:'My path',
          szenen:'Practiced scenes',
          leer:'No scene practiced yet. Start in the <a href="gefuehrt.html">Guided conversation</a>.' }
  };
  var L = T[MUT] || T.de;

  document.getElementById('pageTitle').textContent = L.titel;
  document.getElementById('verspLbl').textContent = L.versp;
  document.getElementById('wegLbl').textContent = L.weg;
  document.getElementById('szenenLbl').textContent = L.szenen;
  document.getElementById('leafline').textContent = L.leaf;

  // ── Baum ──
  var etappe = P.etappe || 'samen';
  if (!L.etappen[etappe]) etappe = 'samen';
  document.getElementById('etappePill').textContent = L.etappen[etappe];
  try {
    if (window.spkBaum) window.spkBaum(document.getElementById('baumWrap'), { etappe: etappe, blaetter: u.blaetter || 0 });
  } catch (e) {}

  // ── Versprechen (aus dem Lernweg-Dokument, wenn vorhanden) ──
  function textAus(x) {
    if (!x) return '';
    if (typeof x === 'string') return x;
    if (typeof x === 'object') {
      var keys = ['text', 'satz', 'versprechen', 'goal', 'ziel'];
      for (var i = 0; i < keys.length; i++) if (typeof x[keys[i]] === 'string' && x[keys[i]]) return x[keys[i]];
      var vals = Object.keys(x).map(function (k) { return x[k]; }).filter(function (v) { return typeof v === 'string' && v.length > 3; });
      if (vals.length) return vals[0];
    }
    return '';
  }
  var versp = '';
  if (u.roadmap && u.roadmap.page1) versp = textAus(u.roadmap.page1.versprechen) || textAus(u.roadmap.page1.ziel);
  if (versp) {
    document.getElementById('verspText').textContent = versp;
    document.getElementById('verspCard').style.display = 'block';
  }

  // ── Mein Weg (kompakt: Etappen-Titel, aktuelle markiert) ──
  var etappen = (u.roadmap && u.roadmap.page2 && Array.isArray(u.roadmap.page2.etappen)) ? u.roadmap.page2.etappen : [];
  if (etappen.length) {
    var jetztIdx = { samen: 0, stamm: 1, krone: 2 }[etappe] || 0;
    var list = document.getElementById('wegList');
    etappen.forEach(function (e, i) {
      var name = textAus(e && (e.titel || e.name || e.title)) || textAus(e) || ('Etappe ' + (i + 1));
      var sub = textAus(e && (e.inhalt || e.fokus || e.desc || e.ziel));
      var row = document.createElement('div');
      row.className = 'weg-step' + (i === jetztIdx ? ' jetzt' : '');
      row.innerHTML = '<div class="weg-dot">' + (i < jetztIdx ? '✓' : (i + 1)) + '</div>'
        + '<div><div class="weg-name"></div>' + (sub ? '<div class="weg-sub"></div>' : '') + '</div>';
      row.querySelector('.weg-name').textContent = name;
      if (sub) row.querySelector('.weg-sub').textContent = sub;
      list.appendChild(row);
    });
    document.getElementById('wegCard').style.display = 'block';
  }

  // ── Geübte Szenen ──
  var done = u.szenen || {};
  var ids = Object.keys(done).filter(function (k) { return done[k] && done[k].done; });
  var chips = document.getElementById('szenenChips');
  var leer = document.getElementById('szenenLeer');
  if (ids.length) {
    ids.sort(function (a, b) { return (done[b].last || 0) - (done[a].last || 0); });
    ids.forEach(function (id) {
      var s = (window.spikiuSzenen || []).filter(function (x) { return x.id === id; })[0];
      var chip = document.createElement('span');
      chip.className = 'szene-chip';
      chip.textContent = (s ? (s.emoji + ' ' + (s[MUT] || s.de)) : id) + ' ✓';
      chips.appendChild(chip);
    });
    chips.style.display = 'flex';
  } else {
    leer.innerHTML = L.leer;
    leer.style.display = 'block';
  }
})();
</script>
</body>
</html>
