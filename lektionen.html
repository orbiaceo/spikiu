<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spikiu · Lektionen</title>
<link rel="stylesheet" href="/fonts/spikiu-fonts.css">
<style>
  :root{
    --white:#ffffff; --bg:#eef7f1; --bg2:#e2efe8; --ink:#15163a; --mid:#6b6154; --ow:2.5px;
    --faint:#e7e5e4; --warm:#d6cfc8; --accent:#1f93b0; --accent2:#e8f5ee; --accent3:#1f93b0; --gold:#a07830;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'DM Sans',system-ui,sans-serif;
    padding-bottom:calc(var(--spk-navh,0px) + env(safe-area-inset-bottom)); -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:680px; margin:0 auto; padding:1.1rem 1.25rem 2rem; }
  .rnav{ position:sticky; top:0; z-index:50; display:flex; align-items:center; padding:calc(.6rem + env(safe-area-inset-top)) .9rem .55rem; background:rgba(238,247,241,.92); border-bottom:var(--ow) solid var(--ink); }
  .rnav .back{ width:36px; height:36px; border-radius:999px; border:2.5px solid var(--ink); background:#fff; font-size:1.2rem; line-height:1; box-shadow:2px 2px 0 var(--ink); cursor:pointer; }
  .rnav .back:active{ transform:translate(1px,1px); box-shadow:1px 1px 0 var(--ink); }

  .lk-head{ display:flex; flex-direction:column; gap:0.9rem; margin-bottom:1.2rem; }
  .lk-title{ font-family:'Lora',serif; font-size:1.5rem; font-weight:700; display:flex; align-items:baseline; gap:0.7rem; }
  .lk-count{ font-family:'DM Sans',sans-serif; font-size:0.8rem; font-weight:800; color:var(--ink); background:#e8f5ee; border:2px solid var(--ink); box-shadow:2px 2px 0 var(--ink); padding:0.15rem 0.6rem; border-radius:100px; }
  .lk-toggle{ display:inline-flex; background:var(--bg2); border-radius:100px; padding:0.25rem; align-self:flex-start; }
  .lk-toggle button{ border:none; background:none; padding:0.45rem 1rem; border-radius:100px; font-family:'DM Sans',sans-serif; font-size:0.86rem; font-weight:600; color:var(--mid); cursor:pointer; transition:0.16s; -webkit-tap-highlight-color:transparent; }
  .lk-toggle button.active{ background:var(--white); color:var(--accent); box-shadow:0 1px 4px rgba(0,0,0,0.08); }

  .lk-group-title{ font-size:0.72rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold); margin:1.2rem 0 0.6rem; }
  .lk-list{ display:flex; flex-direction:column; gap:0.6rem; }
  .lk-card{ background:var(--white); border:var(--ow) solid var(--ink); border-radius:16px; box-shadow:3px 4px 0 var(--ink); padding:0.9rem 1.05rem; cursor:pointer; transition:transform .1s,box-shadow .1s; -webkit-tap-highlight-color:transparent; }
  .lk-card:active{ transform:translate(2px,2px); box-shadow:1px 2px 0 var(--ink); }
  .lk-card-title{ font-family:'Lora',serif; font-weight:600; font-size:1.05rem; line-height:1.3; color:var(--ink); }
  .lk-card-meta{ font-size:0.8rem; color:var(--mid); margin-top:0.3rem; display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center; }
  .lk-chip{ background:var(--bg2); border-radius:100px; padding:0.1rem 0.55rem; font-size:0.74rem; color:var(--accent3); }
  .lk-dot{ color:var(--warm); }
  .lk-empty{ text-align:center; color:var(--mid); font-style:italic; padding:2.5rem 1rem; }

  /* Detail-Modal */
  .lk-modal{ position:fixed; inset:0; z-index:200; background:rgba(28,25,23,0.45); display:flex; align-items:flex-end; justify-content:center; padding:0; }
  .lk-modal[hidden]{ display:none; }
  .lk-sheet{ background:var(--white); width:100%; max-width:680px; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:1.4rem 1.4rem calc(1.6rem + env(safe-area-inset-bottom)); animation:lkUp .28s ease; }
  @keyframes lkUp{ from{ transform:translateY(30px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .lk-close{ float:right; border:none; background:var(--bg2); color:var(--mid); width:34px; height:34px; border-radius:50%; font-size:1.1rem; cursor:pointer; line-height:1; }
  .lk-m-eyebrow{ font-size:0.72rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold); }
  .lk-m-title{ font-family:'Lora',serif; font-size:1.35rem; font-weight:700; line-height:1.3; margin:0.2rem 0 0.3rem; }
  .lk-m-meta{ font-size:0.82rem; color:var(--mid); margin-bottom:1rem; }
  .lk-m-note{ background:var(--accent2); border-radius:10px; padding:0.7rem 0.9rem; font-size:0.9rem; line-height:1.5; color:var(--accent3); margin-bottom:1rem; }
  .lk-m-section-label{ font-size:0.7rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--mid); margin:1rem 0 0.5rem; }
  .lk-vocab{ display:flex; flex-direction:column; gap:0.4rem; }
  .lk-vrow{ display:flex; align-items:center; gap:0.55rem; border:1px solid var(--faint); border-radius:10px; padding:0.55rem 0.7rem; }
  .lk-vword{ font-family:'Lora',serif; font-weight:600; color:var(--ink); flex:0 0 auto; }
  .lk-vtrans{ color:var(--mid); font-size:0.9rem; flex:1; }
  .lk-vspeak{ flex:0 0 auto; width:28px; height:28px; border:none; border-radius:50%; background:var(--accent2); color:var(--accent); cursor:pointer; display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; }
  .lk-vspeak svg{ width:14px; height:14px; }
  .lk-vspeak.playing{ animation:lkPulse 1s ease infinite; }
  @keyframes lkPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.12);} }

  /* ── Lektion-Overlay IN-PLACE über dem Archiv (Teil 57) ── */
  .lk-veil{ position:fixed; left:0; right:0; top:0; bottom:var(--spk-navh,0px); background:rgba(250,249,247,.55); backdrop-filter:blur(2px); z-index:84; opacity:0; pointer-events:none; transition:opacity .3s; }
  .lk-veil.open{ opacity:1; pointer-events:auto; }
  .lk-lesson{ position:fixed; left:0; right:0; top:0; bottom:var(--spk-navh,0px); z-index:85; overflow-y:auto; padding:1rem 1rem 2rem; transform:translateY(100%); transition:transform .34s cubic-bezier(.4,0,.2,1); -webkit-overflow-scrolling:touch; }
  .lk-lesson.open{ transform:translateY(0); }
  .lk-lesson[hidden]{ display:none; }
  .lk-bar{ display:flex; justify-content:space-between; align-items:center; gap:.5rem; max-width:720px; margin:0 auto .8rem; }
  .lk-back{ background:var(--white); border:var(--ow) solid var(--ink); color:var(--ink); border-radius:100px; padding:.5rem 1.1rem; font-family:'DM Sans',sans-serif; font-weight:700; font-size:.86rem; box-shadow:3px 3px 0 var(--ink); cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .lk-pdf{ background:var(--accent); border:var(--ow) solid var(--ink); color:#fff; border-radius:100px; padding:.5rem 1.1rem; font-family:'DM Sans',sans-serif; font-weight:700; font-size:.86rem; box-shadow:3px 3px 0 var(--ink); cursor:pointer; -webkit-tap-highlight-color:transparent; }

.lp-lesson { max-width:720px; margin:0 auto; background:#f6fbf8; border-radius:12px; padding:40px 48px; box-shadow:0 8px 40px rgba(0,0,0,0.12); font-family:'DM Sans',sans-serif; color:#1a1816; }
.lp-header { display:flex; align-items:flex-start; justify-content:space-between; padding-bottom:18px; border-bottom:2px solid #1a1816; margin-bottom:26px; }
.lp-brand { display:flex; align-items:center; gap:0.5rem; }
.lp-brand-name { font-family:'Lora',serif; font-size:1.3rem; font-weight:700; letter-spacing:-0.02em; }
.lp-brand-name em { color:#1f93b0; font-style:italic; }
.lp-meta { text-align:right; font-size:0.72rem; color:#6b6560; line-height:1.5; }
.lp-meta strong { color:#1a1816; }
.lp-level { display:inline-block; background:#e8f2ed; color:#1f93b0; padding:0.2rem 0.6rem; border-radius:100px; font-size:0.7rem; font-weight:700; letter-spacing:0.06em; margin-top:0.4rem; }
.lp-title-block { margin-bottom:28px; }
.lp-eyebrow { font-size:0.66rem; font-weight:700; letter-spacing:0.22em; text-transform:uppercase; color:#a07830; margin-bottom:0.5rem; }
.lp-title { font-family:'Lora',serif; font-size:2rem; font-weight:700; letter-spacing:-0.02em; line-height:1.15; margin-bottom:0.5rem; }
.lp-title em { color:#1f93b0; font-style:italic; }
.lp-subtitle { font-family:'Lora',serif; font-style:italic; font-size:1rem; color:#6b6560; }
.lp-goal { background:#e8f2ed; border-left:3px solid #1f93b0; border-radius:0 8px 8px 0; padding:14px 18px; margin-bottom:28px; }
.lp-goal-label { font-size:0.65rem; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:#1f93b0; margin-bottom:0.5rem; }
.lp-goal-text { font-size:0.92rem; line-height:1.55; }
.lp-section { margin-bottom:28px; }
.lp-section-label { font-size:0.65rem; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:#a07830; margin-bottom:0.8rem; display:flex; align-items:center; gap:0.5rem; }
.lp-section-label::after { content:""; flex:1; height:1px; background:#e8e4df; }
.lp-vocab-list { list-style:none; display:flex; flex-direction:column; gap:8px; padding:0; }
.lp-vocab-item { background:white; border:1px solid #e8e4df; border-radius:10px; padding:12px 16px; display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; }
.lp-vocab-word { font-family:'Lora',serif; font-weight:700; font-size:1.02rem; }
.lp-vocab-trans { font-size:0.88rem; color:#6b6560; }
.lp-vocab-example { grid-column:1 / -1; font-size:0.84rem; font-style:italic; padding-top:4px; border-top:1px dashed #e8e4df; }
.lp-vocab-example em { font-style:normal; color:#1f93b0; font-weight:600; }
.lp-grammar-card { background:white; border:1px solid #e8e4df; border-radius:10px; padding:16px 18px; }
.lp-grammar-card h4 { font-family:'Lora',serif; font-size:1rem; font-weight:700; margin-bottom:0.5rem; }
.lp-grammar-card p { font-size:0.88rem; line-height:1.65; margin-bottom:0.6rem; }
.lp-grammar-card .lp-example { background:#f6fbf8; padding:0.6rem 0.9rem; border-radius:6px; font-size:0.86rem; font-style:italic; color:#1f93b0; border-left:2px solid #1f93b0; margin-top:0.6rem; }
.lp-dialogue { background:white; border:1px solid #e8e4df; border-radius:10px; padding:16px 18px; }
.lp-dialogue-line { display:flex; gap:0.7rem; margin-bottom:0.7rem; }
.lp-dialogue-line:last-child { margin-bottom:0; }
.lp-dialogue-speaker { font-weight:700; font-size:0.82rem; color:#1f93b0; min-width:50px; flex-shrink:0; }
.lp-dialogue-text { font-size:0.92rem; line-height:1.55; }
.lp-dialogue-text .lp-trans { display:block; font-size:0.78rem; color:#6b6560; font-style:italic; margin-top:2px; }
/* 🔊 im Poster (Teil 32): nur auf Zielsprache — Wortschatz-Wort + Dialog-Zeile. Spricht über audio.js. */
.lp-speak { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; margin-left:0.4rem; vertical-align:-0.28rem; border:none; cursor:pointer; background:#e8f2ed; color:#1f93b0; border-radius:50%; transition:background 0.16s, color 0.16s; -webkit-tap-highlight-color:transparent; }
.lp-speak:hover { background:#1f93b0; color:#fff; }
.lp-speak svg { width:12px; height:12px; }
.lp-speak.playing { animation:lpSpkPulse 1s ease infinite; }
@keyframes lpSpkPulse { 0%,100%{ box-shadow:0 0 0 0 rgba(45,106,79,0.4);} 50%{ box-shadow:0 0 0 6px rgba(45,106,79,0);} }
.lp-quiz-item { background:white; border:1px solid #e8e4df; border-radius:10px; padding:14px 16px; margin-bottom:10px; }
.lp-quiz-question { font-weight:600; font-size:0.92rem; margin-bottom:0.7rem; }
.lp-quiz-question .lp-num { color:#1f93b0; font-weight:700; margin-right:0.4rem; }
.lp-quiz-options { list-style:none; display:flex; flex-direction:column; gap:6px; padding:0; margin:0; }
.lp-quiz-opt {
  display:flex; align-items:center; gap:0.5rem;
  padding:9px 12px; background:#f6fbf8;
  border:1.5px solid transparent; border-radius:8px;
  font-size:0.88rem; cursor:pointer;
  font-family:inherit; text-align:left; width:100%;
  color:#1a1816; transition: background 0.18s, border-color 0.18s, color 0.18s;
}
.lp-quiz-opt:hover:not(:disabled) { background:#f0ede5; border-color:#d6d0c4; }
.lp-quiz-opt:disabled { cursor:default; }
.lp-quiz-opt .lp-quiz-mark {
  margin-left:auto; font-weight:700; font-size:1rem; opacity:0;
  transition: opacity 0.2s;
}
.lp-quiz-opt.correct {
  background:#e8f5ee; border-color:#1f93b0; color:#1f93b0; font-weight:600;
}
.lp-quiz-opt.correct .lp-quiz-mark { color:#1f93b0; opacity:1; }
.lp-quiz-opt.wrong {
  background:#fdebe9; border-color:#c0392b; color:#a02e22;
}
.lp-quiz-opt.wrong .lp-quiz-mark { color:#c0392b; opacity:1; }
.lp-quiz-answer {
  margin-top:12px; padding:10px 12px;
  background:#f6fbf8; border-left:3px solid #1f93b0; border-radius:0 8px 8px 0;
  font-size:0.85rem; color:#1a1816; line-height:1.5;
  display:none; animation: lpFadeIn 0.25s ease;
}
.lp-quiz-answer.visible { display:block; }
.lp-quiz-answer strong { color:#1f93b0; }
@keyframes lpFadeIn {
  from { opacity:0; transform: translateY(-4px); }
  to   { opacity:1; transform: translateY(0); }
}

/* ── LESSON GENERATION BUTTON STATES ───────────────── */
.btn-spinner {
  display: inline-block;
  width: 12px;
  height: 12px;
  border: 2px solid currentColor;
  border-top-color: transparent;
  border-radius: 50%;
  vertical-align: -2px;
  margin-right: 0.45rem;
  animation: btnSpin 0.8s linear infinite;
}
@keyframes btnSpin {
  to { transform: rotate(360deg); }
}
.btn-loading {
  opacity: 0.7;
  cursor: wait !important;
  pointer-events: none;
}
.lp-footer { margin-top:32px; padding-top:16px; border-top:1px solid #e8e4df; display:flex; justify-content:space-between; align-items:center; font-size:0.72rem; color:#6b6560; }
.lp-footer-cap { font-family:'Lora',serif; font-style:italic; color:#1f93b0; }
@media (max-width:600px) {
  .lp-lesson { padding:24px 22px; }
  .lp-title { font-size:1.5rem; }
  .lp-vocab-item { grid-template-columns:1fr; }
}

  /* ── PDF/Druck: nur die Lektion (Teil 57) ── */
  @media print {
    @page { size:A4 portrait; margin:12mm; }
    body.printing-lesson { background:#fff !important; padding:0 !important; }
    body.printing-lesson .wrap,
    body.printing-lesson .lk-veil,
    body.printing-lesson .lk-bar,
    body.printing-lesson .spk-bottomnav,
    body.printing-lesson .spk-topbar { display:none !important; }
    body.printing-lesson .lk-lesson{ position:static !important; inset:auto !important; transform:none !important; overflow:visible !important; padding:0 !important; height:auto !important; }
    body.printing-lesson .lp-lesson{ box-shadow:none !important; max-width:100% !important; padding:0 !important; border-radius:0 !important; }
    body.printing-lesson .lp-speak{ display:none !important; }
  }

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<header class="rnav"><button class="back" onclick="location.href='haus.html'" aria-label="zurück">‹</button></header>

<div class="wrap">
  <div class="lk-head">
    <div class="lk-title"><span id="lkTitle">Lektionen</span> <span class="lk-count" id="lkCount">0 / 14</span></div>
    <div class="lk-toggle">
      <button type="button" data-mode="thema" id="tgThema" class="active">Nach Thema</button>
      <button type="button" data-mode="datum" id="tgDatum">Nach Datum</button>
    </div>
  </div>
  <div class="lk-list" id="lkList"></div>
</div>

<div class="lk-veil" id="lkVeil"></div>
<div class="lk-lesson" id="lkLesson" hidden>
  <div class="lk-bar">
    <button type="button" class="lk-back" id="lkBack">← Zurück</button>
    <button type="button" class="lk-pdf" id="lkPdf">📄 Als PDF herunterladen</button>
  </div>
  <div id="lkPoster"></div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════
//  SPIKIU · LEKTIONEN-ARCHIV (Teil 53) — liest spikiu_user.lessons (bis 14).
//  Umschalter Nach Thema / Nach Datum · Detail-Modal · X / 14. KEIN erfundener Inhalt.
// ════════════════════════════════════════════════════════════════════
var MAX = 14;
var stored = {}, USER = {};
try { USER = JSON.parse(localStorage.getItem('spikiu_user')||'{}') || {}; } catch(e){ USER = {}; }
try { stored = USER.profile || {}; } catch(e){}
function langCode(v){
  if(!v) return null; v=(''+v).toLowerCase();
  if(/^(de|es|en|el)$/.test(v)) return v;
  if(v.indexOf('deutsch')>-1||v.indexOf('german')>-1) return 'de';
  if(v.indexOf('span')>-1||v.indexOf('español')>-1) return 'es';
  if(v.indexOf('engl')>-1) return 'en';
  if(v.indexOf('griech')>-1||v.indexOf('greek')>-1) return 'el';
  return null;
}
var ZIEL = stored.zielsprache || langCode(stored.targetLang) || 'es';
var MUTTER = stored.muttersprache || langCode(USER.nativeLang) || langCode(stored.nativeLang) || 'de';
function uiLang(){ return (['de','es','en'].indexOf(MUTTER) > -1) ? MUTTER : 'de'; }

var T = {
  de:{ title:'Lektionen', byTopic:'Nach Thema', byDate:'Nach Datum', other:'Sonstige', empty:'Noch keine Lektionen.', words:'Wörter', vocab:'Wortschatz', note:'Notiz', back:'← Zurück', pdf:'📄 Als PDF herunterladen' },
  es:{ title:'Lecciones', byTopic:'Por tema', byDate:'Por fecha', other:'Otros', empty:'Aún no hay lecciones.', words:'palabras', vocab:'Vocabulario', note:'Nota', back:'← Volver', pdf:'📄 Descargar como PDF' },
  en:{ title:'Lessons', byTopic:'By topic', byDate:'By date', other:'Other', empty:'No lessons yet.', words:'words', vocab:'Vocabulary', note:'Note', back:'← Back', pdf:'📄 Download as PDF' }
};
function t(){ return T[uiLang()] || T.de; }
var LOCALE = { de:'de-DE', es:'es-ES', en:'en-US' }[uiLang()] || 'de-DE';

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(iso){ try { var d = new Date(iso); if (isNaN(d.getTime())) return ''; return d.toLocaleDateString(LOCALE, { day:'numeric', month:'short', year:'numeric' }); } catch(e){ return ''; } }
var SPK_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4.03v8.06A4.5 4.5 0 0016.5 12z"/></svg>';

// ── Audio (🔊) ──
var voiceReady = false;
function speakText(text){
  if (window.spkSpeak){ try { return window.spkSpeak(text, ZIEL); } catch(e){} }
  try { var s = window.speechSynthesis;
    if (s && typeof SpeechSynthesisUtterance !== 'undefined'){
      var bcp = { de:'de-DE', es:'es-ES', en:'en-US', el:'el-GR' }[ZIEL] || 'en-US';
      var u = new SpeechSynthesisUtterance(String(text)); u.lang = bcp; s.cancel(); s.speak(u);
    } } catch(e){}
}
function playFrom(btn, text){
  if (btn) btn.classList.add('playing');
  var fin = function(){ if (btn) btn.classList.remove('playing'); };
  var p = speakText(text); if (p && p.then){ p.then(fin, fin); } else { setTimeout(fin, 1400); }
}

// ── Daten ──

// ── Voller Lektions-Poster IN-PLACE (portiert aus dashboard.html, Teil 57) ──
var CAPY_LOGO = "";
const LP_SPK_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4.03v8.06A4.5 4.5 0 0016.5 12z"/></svg>';
function lpPlain(s){ return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim(); }
function lpAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function lpSpeakBtn(zieltext){
  var t = lpPlain(zieltext);
  if (!t) return '';
  return '<button type="button" class="lp-speak" data-speak="' + lpAttr(t) + '" aria-label="Vorlesen">' + LP_SPK_ICON + '</button>';
}
function dashSpeak(text, ziel){
  if (window.spkSpeak){ try { return window.spkSpeak(text, ziel); } catch(e){} }
  try {
    var synth = window.speechSynthesis;
    if (synth && typeof SpeechSynthesisUtterance !== 'undefined'){
      var bcp = { de:'de-DE', es:'es-ES', en:'en-US', el:'el-GR' }[ziel] || 'en-US';
      var u = new SpeechSynthesisUtterance(String(text)); u.lang = bcp;
      synth.cancel(); synth.speak(u);
    }
  } catch(e){}
}
function dashWarm(ziel){ if (window.spkWarm){ try { window.spkWarm(ziel); } catch(e){} } }
function renderLessonPoster(l) {
  if (!l) return '<p style="color:white;text-align:center;padding:2rem;">Lesson not found.</p>';

  const vocabHtml = (l.vocab || []).map(v => `
    <li class="lp-vocab-item">
      <span class="lp-vocab-word">${v.word || ''}${lpSpeakBtn(v.word)}</span>
      <span class="lp-vocab-trans">${v.translation || ''}</span>
      ${v.example ? `<div class="lp-vocab-example">"${v.example}"</div>` : ''}
    </li>
  `).join('');

  const grammarExamples = (l.grammar && l.grammar.examples || []).map(ex =>
    `<div class="lp-example">${ex}</div>`
  ).join('');

  const dialogueHtml = (l.dialogue || []).map(d => `
    <div class="lp-dialogue-line">
      <span class="lp-dialogue-speaker">${d.speaker || ''}</span>
      <div class="lp-dialogue-text">
        ${d.text || ''}${lpSpeakBtn(d.text)}
        ${d.translation ? `<span class="lp-trans">${d.translation}</span>` : ''}
      </div>
    </div>
  `).join('');

  // ── INTERACTIVE QUIZ ──────────────────────────────────
  // Parse the "answer" field to detect which option is correct.
  // Expected formats from generate-lesson.js (all supported):
  //   "b) ..."     → letter b is correct
  //   "b"          → letter b is correct
  //   "Option B — ..."  → letter B is correct
  // Then each option (a, b, c, ...) becomes a clickable button.
  // On click: wrong → red, correct option auto-highlighted green,
  // explanation revealed, all buttons disabled.
  function correctLetterFromAnswer(answerText, optionsLen) {
    if (!answerText) return null;
    const m = String(answerText).trim().match(/^[^a-z]*([a-z])\b/i);
    if (!m) return null;
    const letter = m[1].toLowerCase();
    const idx = letter.charCodeAt(0) - 97; // a=0, b=1, c=2
    return (idx >= 0 && idx < optionsLen) ? letter : null;
  }
  const quizHtml = (l.quiz || []).map((q, qIdx) => {
    const opts = q.options || [];
    const correct = correctLetterFromAnswer(q.answer, opts.length);
    const optionsButtons = opts.map((o, oIdx) => {
      const letter = String.fromCharCode(97 + oIdx); // a, b, c
      const isCorrect = (letter === correct);
      const safeText = String(o).replace(/"/g, '&quot;');
      return `<li><button type="button" class="lp-quiz-opt"
        data-correct="${isCorrect ? '1' : '0'}"
        data-q="${qIdx}"
        onclick="lpQuizClick(this, ${qIdx})">
        <span class="lp-quiz-label">${safeText}</span>
        <span class="lp-quiz-mark"></span>
      </button></li>`;
    }).join('');
    return `
    <div class="lp-quiz-item" data-quiz-idx="${qIdx}">
      <div class="lp-quiz-question"><span class="lp-num">${qIdx+1}.</span>${q.question || ''}</div>
      <ul class="lp-quiz-options">${optionsButtons}</ul>
      <div class="lp-quiz-answer" id="lp-answer-${qIdx}"><strong>Answer:</strong> ${q.answer || ''}</div>
    </div>`;
  }).join('');

  return `
    <div class="lp-lesson">
      <div class="lp-header">
        <div class="lp-brand">
          ${CAPY_LOGO}
          <span class="lp-brand-name">Spi<em>k</em>iu</span>
        </div>
        <div class="lp-meta">
          <strong>Lesson ${l.lessonNumber || 1} of ${l.lessonOf || 3}</strong><br>
          ${l.date || ''}
          <div class="lp-level">${l.level || ''}</div>
        </div>
      </div>
      <div class="lp-title-block">
        <div class="lp-eyebrow">${l.eyebrow || ''}</div>
        <h1 class="lp-title">${l.title || ''}</h1>
        <p class="lp-subtitle">${l.subtitle || ''}</p>
      </div>
      <div class="lp-goal">
        <div class="lp-goal-label">🎯 ${l.goalLabel || 'Goal'}</div>
        <p class="lp-goal-text">${l.goal || ''}</p>
      </div>
      ${l.vocab && l.vocab.length ? `
        <div class="lp-section">
          <div class="lp-section-label">📖 ${l.vocabLabel || 'Vocabulary'}</div>
          <ul class="lp-vocab-list">${vocabHtml}</ul>
        </div>` : ''}
      ${l.grammar ? `
        <div class="lp-section">
          <div class="lp-section-label">⚙ ${l.grammarLabel || 'Grammar'}</div>
          <div class="lp-grammar-card">
            <h4>${l.grammar.title || ''}</h4>
            <p>${l.grammar.explanation || ''}</p>
            ${grammarExamples}
          </div>
        </div>` : ''}
      ${l.dialogue && l.dialogue.length ? `
        <div class="lp-section">
          <div class="lp-section-label">💬 ${l.dialogueLabel || 'Dialogue'}</div>
          <div class="lp-dialogue">${dialogueHtml}</div>
        </div>` : ''}
      ${l.quiz && l.quiz.length ? `
        <div class="lp-section">
          <div class="lp-section-label">✓ ${l.quizLabel || 'Quiz'}</div>
          ${quizHtml}
        </div>` : ''}
      <div class="lp-footer">
        <span>spikiu.com · ${l.footerLeft || ''}</span>
        <span class="lp-footer-cap">🐾 ${l.footerRight || ''}</span>
      </div>
    </div>
  `;
}
window.lpQuizClick = function(btn, qIdx) {
  const item = btn.closest('.lp-quiz-item');
  if (!item || item.dataset.answered === '1') return;
  item.dataset.answered = '1';

  const isCorrect = btn.dataset.correct === '1';
  const allBtns = item.querySelectorAll('.lp-quiz-opt');

  // Mark the clicked one + always highlight the correct one
  allBtns.forEach(b => {
    b.disabled = true;
    const mark = b.querySelector('.lp-quiz-mark');
    if (b.dataset.correct === '1') {
      b.classList.add('correct');
      if (mark) mark.textContent = '✓';
    }
    if (b === btn && !isCorrect) {
      b.classList.add('wrong');
      if (mark) mark.textContent = '✗';
    }
  });

  // Reveal the explanation
  const ans = item.querySelector('.lp-quiz-answer');
  if (ans) ans.classList.add('visible');
};
// ── Echter Lektions-PDF (jsPDF) — baut das ganze Dokument aus den Daten, Teil 58 ──
// buildLessonPdf(L, fileName, JsPDF) — erzeugt einen sauberen, mehrseitigen Lektions-PDF
// aus den Lektionsdaten (nicht aus dem Screen). JsPDF = Konstruktor (window.jspdf.jsPDF).
function buildLessonPdf(L, fileName, JsPDF){
  var doc = new JsPDF({ unit:'pt', format:'a4' });
  var M = 48, W = 595.28, Hh = 841.89, maxW = W - 2*M, y = M;
  var INK=[26,24,22], MID=[107,101,96], GREEN=[45,106,79], GOLD=[160,120,48];

  function strip(s){
    return String(s==null?'':s)
      .replace(/<[^>]*>/g,'')
      .replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#0?39;/g,"'")
      .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ')
      .replace(/\s+/g,' ').trim();
  }
  function ensure(h){ if (y + h > Hh - M){ doc.addPage(); y = M; } }
  function setColor(c){ doc.setTextColor(c[0],c[1],c[2]); }
  function para(text, size, opt){
    opt = opt || {};
    var t = strip(text); if (!t) return;
    doc.setFont(opt.font||'helvetica', opt.style||'normal');
    doc.setFontSize(size); setColor(opt.color||INK);
    var x = opt.x||M, w = opt.w||maxW;
    var lines = doc.splitTextToSize(t, w);
    for (var i=0;i<lines.length;i++){ ensure(size*1.4); doc.text(lines[i], x, y); y += size*1.4; }
  }
  function gap(h){ y += h; }
  function label(txt){
    ensure(20); doc.setFont('helvetica','bold'); doc.setFontSize(8); setColor(GOLD);
    doc.text(strip(txt).toUpperCase(), M, y); y += 15;
  }

  // ── Kopf ──
  doc.setFont('times','bold'); doc.setFontSize(20); setColor(INK);
  doc.text('Spikiu', M, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); setColor(MID);
  doc.text('Lektion ' + (L.lessonNumber||1) + ' von ' + (L.lessonOf||1), W-M, y-9, { align:'right' });
  var sub = strip(L.date||''); var lvl = strip(L.level||''); if (lvl) sub += (sub?'   ':'') + lvl;
  if (sub) doc.text(sub, W-M, y+3, { align:'right' });
  y += 12; doc.setDrawColor(INK[0],INK[1],INK[2]); doc.setLineWidth(1.2); doc.line(M, y, W-M, y); y += 24;

  // ── Titelblock ──
  if (L.eyebrow){ para(L.eyebrow, 8.5, { color:GOLD, style:'bold' }); gap(2); }
  para(L.title||'Lektion', 19, { font:'times', style:'bold' }); gap(3);
  if (L.subtitle) para(L.subtitle, 11, { font:'times', style:'italic', color:MID });
  gap(16);

  // ── Ziel ──
  if (L.goal){
    if (L.goalLabel) para(L.goalLabel, 9, { color:GREEN, style:'bold' });
    para(L.goal, 10.5); gap(14);
  }

  // ── Wortschatz ──
  if (L.vocab && L.vocab.length){
    label(L.vocabLabel || 'Wortschatz');
    L.vocab.forEach(function(v){
      ensure(20);
      doc.setFont('times','bold'); doc.setFontSize(11.5); setColor(INK);
      doc.text(strip(v.word||''), M, y);
      doc.setFont('helvetica','normal'); doc.setFontSize(10); setColor(MID);
      var tr = strip(v.translation||'');
      var trLines = doc.splitTextToSize(tr, maxW - 215);
      doc.text(trLines, M + 215, y);
      y += Math.max(15, trLines.length * 13);
      if (v.example) para('\u201E' + strip(v.example) + '\u201C', 9.5, { style:'italic', color:GREEN });
      gap(7);
    });
    gap(8);
  }

  // ── Grammatik ──
  if (L.grammar && (L.grammar.title || L.grammar.explanation)){
    label(L.grammarLabel || 'Grammatik');
    if (L.grammar.title) para(L.grammar.title, 11, { style:'bold' });
    if (L.grammar.explanation) para(L.grammar.explanation, 10.5);
    (L.grammar.examples || []).forEach(function(ex){ para('\u2022 ' + strip(ex), 9.5, { style:'italic', color:GREEN }); });
    gap(12);
  }

  // ── Dialog ──
  if (L.dialogue && L.dialogue.length){
    label(L.dialogueLabel || 'Dialog');
    L.dialogue.forEach(function(d){
      para((d.speaker?strip(d.speaker)+': ':'') + strip(d.text||''), 10.5);
      if (d.translation) para('   ' + strip(d.translation), 9, { style:'italic', color:MID });
      gap(4);
    });
    gap(12);
  }

  // ── Quiz ──
  if (L.quiz && L.quiz.length){
    label(L.quizLabel || 'Quiz');
    L.quiz.forEach(function(q, i){
      para((i+1) + '. ' + strip(q.question||''), 10.5, { style:'bold' });
      (q.options || []).forEach(function(o, oi){ para('   ' + String.fromCharCode(97+oi) + ') ' + strip(o), 9.5); });
      if (q.answer) para('   \u2192 ' + strip(q.answer), 9.5, { color:GREEN, style:'bold' });
      gap(8);
    });
  }

  // ── Fuß ──
  ensure(24); gap(6);
  doc.setDrawColor(225,225,221); doc.setLineWidth(0.6); doc.line(M, y, W-M, y); y += 13;
  doc.setFont('helvetica','normal'); doc.setFontSize(8); setColor(MID);
  doc.text('spikiu.com', M, y);

  doc.save(fileName);
  return doc;
}

var CURRENT_LESSON = null;
function lessonToPdf(){
  var L = CURRENT_LESSON && CURRENT_LESSON.lesson;
  if (!L) return;
  var nm = 'Spikiu-Lektion-' + String(L.title||'lektion').replace(/<[^>]*>/g,'').replace(/[^\w\u00C0-\u024F -]+/g,'').replace(/\s+/g,'-').slice(0,50) + '.pdf';
  if (window.jspdf && window.jspdf.jsPDF){
    try { buildLessonPdf(L, nm, window.jspdf.jsPDF); return; } catch(e){ /* Fallback unten */ }
  }
  // Fallback: Druckdialog, falls jsPDF nicht geladen
  document.body.classList.add('printing-lesson');
  var done = function(){ document.body.classList.remove('printing-lesson'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done); setTimeout(done, 2000);
  try { window.print(); } catch(e){ done(); }
}

function lessons(){
  var a = Array.isArray(USER.lessons) ? USER.lessons.slice() : [];
  a.sort(function(x,y){ return (y.createdAt||'').localeCompare(x.createdAt||''); });
  return a.slice(0, MAX);
}
function titleOf(l){ return (l.lesson && l.lesson.title) || l.topic || 'Lektion'; }
function vocabOf(l){ return (l.lesson && Array.isArray(l.lesson.vocab)) ? l.lesson.vocab : []; }
function themaOf(l){ return (l.thema && String(l.thema).trim()) || ''; }

function cardHtml(l){
  var vc = vocabOf(l).length;
  var meta = [];
  var th = themaOf(l); if (th) meta.push('<span class="lk-chip">' + esc(th) + '</span>');
  var dt = fmtDate(l.createdAt); if (dt) meta.push('<span>' + esc(dt) + '</span>');
  if (vc) meta.push('<span>' + vc + ' ' + esc(t().words) + '</span>');
  return '<div class="lk-card" data-id="' + esc(l.id) + '">'
    + '<div class="lk-card-title">' + esc(titleOf(l)) + '</div>'
    + '<div class="lk-card-meta">' + meta.join('<span class="lk-dot">·</span>') + '</div></div>';
}

function renderDatum(list){
  if (!list.length) return '<div class="lk-empty">' + esc(t().empty) + '</div>';
  return list.map(cardHtml).join('');
}
function renderThema(list){
  if (!list.length) return '<div class="lk-empty">' + esc(t().empty) + '</div>';
  var groups = {}, order = [];
  list.forEach(function(l){
    var key = themaOf(l) || t().other;
    if (!groups[key]){ groups[key] = []; order.push(key); }   // Reihenfolge = erstes (jüngstes) Auftreten
    groups[key].push(l);
  });
  return order.map(function(key){
    return '<div class="lk-group-title">' + esc(key) + '</div>' + groups[key].map(cardHtml).join('');
  }).join('');
}

var MODE = 'thema';
function render(){
  var list = lessons();
  document.getElementById('lkCount').textContent = list.length + ' / ' + MAX;
  document.getElementById('lkList').innerHTML = (MODE === 'datum') ? renderDatum(list) : renderThema(list);
  document.querySelectorAll('#lkList .lk-card').forEach(function(c){
    c.onclick = function(){ openLesson(c.getAttribute('data-id')); };
  });
}

// ── Lektion öffnen: VOLLSTÄNDIG im Dashboard (eine Quelle, mit Quiz) ──
// Teil 55-Fix: nicht mehr eine reduzierte Archiv-Kopie zeigen, sondern dieselbe
// brauchbare Lektion wie das Dashboard (renderLessonPoster) öffnen.
function openLesson(id){
  if (!id) return;
  var list = lessons(), entry = null;
  for (var i=0;i<list.length;i++){ if (list[i].id === id){ entry = list[i]; break; } }
  if (!entry) return;
  CURRENT_LESSON = entry;
  var ziel = entry.zielsprache || ZIEL || 'es';
  var poster = document.getElementById('lkPoster');
  poster.innerHTML = renderLessonPoster(entry.lesson);
  poster.querySelectorAll('.lp-speak').forEach(function(btn){ btn.onclick = function(){ dashSpeak(btn.dataset.speak, ziel); }; });
  dashWarm(ziel);
  var box = document.getElementById('lkLesson');
  box.hidden = false; box.scrollTop = 0;
  document.getElementById('lkVeil').classList.add('open');
  requestAnimationFrame(function(){ box.classList.add('open'); });
  document.body.style.overflow = 'hidden';
}
function closeLesson(){
  var box = document.getElementById('lkLesson');
  box.classList.remove('open');
  document.getElementById('lkVeil').classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(function(){ box.hidden = true; }, 340);
}
document.getElementById('lkBack').onclick = closeLesson;
document.getElementById('lkVeil').onclick = closeLesson;
document.getElementById('lkPdf').onclick = lessonToPdf;
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeLesson(); });

// ── Umschalter ──
function setMode(m){
  MODE = m;
  document.getElementById('tgThema').classList.toggle('active', m==='thema');
  document.getElementById('tgDatum').classList.toggle('active', m==='datum');
  render();
}
document.getElementById('tgThema').onclick = function(){ setMode('thema'); };
document.getElementById('tgDatum').onclick = function(){ setMode('datum'); };

// ── Start ──
window.addEventListener('load', function(){
  // Teil 55: „Deine letzte Lektion" (#last) → direkt die neueste Lektion VOLLSTÄNDIG
  // im Dashboard öffnen (mit Quiz), ohne das Archiv kurz aufblitzen zu lassen.
  var ui = t();
  document.getElementById('lkTitle').textContent = ui.title;
  document.getElementById('tgThema').textContent = ui.byTopic;
  document.getElementById('tgDatum').textContent = ui.byDate;
  document.title = 'Spikiu · ' + ui.title;
  document.getElementById('lkBack').textContent = ui.back;
  document.getElementById('lkPdf').textContent = ui.pdf;
  render();
  if (location.hash === '#last'){ var ll = lessons(); if (ll.length) openLesson(ll[0].id); }
});
</script>
