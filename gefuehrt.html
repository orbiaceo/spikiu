<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spikiu · Geführtes Gespräch</title>
<meta name="description" content="Geführtes Gespräch — Szenen üben, Schritt für Schritt.">
<link rel="stylesheet" href="/fonts/spikiu-fonts.css">
<style>
/* ═══ Seiten-Gerüst. Karten-Layout kommt KOMPLETT aus karten-engine.js. ═══ */
:root{
  --minz:#eef7f1; --ink:#15163a; --muted:#5f7068; --acc:#1f93b0;
  --ow:2.5px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--minz);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer}

.app{display:flex;flex-direction:column;height:100dvh;max-width:680px;margin:0 auto;background:var(--minz)}

.rnav{flex:0 0 auto;display:flex;align-items:center;gap:.7rem;
  padding:calc(.6rem + env(safe-area-inset-top)) .9rem .6rem;
  background:var(--minz);border-bottom:var(--ow) solid var(--ink)}
.rnav .back{width:36px;height:36px;flex:0 0 36px;border-radius:999px;border:2.5px solid var(--ink);
  background:#fff;font-size:1.15rem;line-height:1;box-shadow:2px 2px 0 var(--ink);
  display:flex;align-items:center;justify-content:center}
.rnav .back:active{transform:translate(1px,1px);box-shadow:0 0 0 var(--ink)}
.rnav .title{font:800 1.05rem 'DM Sans',sans-serif;color:var(--ink)}

.rail{flex:0 0 auto;display:flex;gap:.3rem;padding:.55rem 1.1rem;background:#fff;border-bottom:var(--ow) solid var(--ink)}
.rail .step{flex:1;text-align:center;font:800 .6rem/1.4 'DM Sans',sans-serif;letter-spacing:.03em;
  text-transform:uppercase;color:var(--ink);opacity:.45}
.rail .step .dot{display:block;width:100%;height:4px;border-radius:3px;background:var(--ink);opacity:.25;margin-bottom:.3rem}
.rail .step.done{opacity:1}.rail .step.done .dot{background:var(--acc);opacity:1}
.rail .step.on{opacity:1;color:var(--acc)}.rail .step.on .dot{background:var(--acc);opacity:1}

.stage{flex:1;min-height:0;position:relative;background:var(--minz)}

/* Themen-Palette (kein Karten-Inhalt → gehört zur Seite, nicht zur Engine) */
.palette{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1.1rem;padding:1.2rem 1.1rem;text-align:center}
.palette .cap{width:60px;height:60px;border-radius:999px;background:#fff;border:2.5px solid var(--ink);
  display:flex;align-items:center;justify-content:center;box-shadow:3px 3px 0 var(--ink)}
.palette .cap svg{width:46px;height:46px}
.palette h2{font:800 1.25rem 'DM Sans',sans-serif;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;max-width:360px}
.chips .chip{font:700 .95rem 'DM Sans',sans-serif;color:var(--ink);background:#fff;
  border:2px solid var(--ink);border-radius:100px;padding:.6rem 1.05rem;box-shadow:2px 2px 0 var(--ink)}
.chips .chip:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.pal-note{font:600 .82rem 'DM Sans',sans-serif;color:var(--muted);max-width:28ch}
</style>
</head>
<body>
<div class="app">
  <header class="rnav">
    <button class="back" onclick="location.href='haus.html'" aria-label="zurück">‹</button>
    <div class="title" id="pageTitle">Geführtes Gespräch</div>
  </header>
  <div class="rail" id="rail"></div>
  <div class="stage" id="stage"></div>
</div>

<script src="sitzung.js"></script>
<script src="haeppchen-db.js"></script>
<script src="szenen.js"></script>
<script src="szenen-dialog.js"></script>
<script src="karten-engine.js"></script>
<script src="lernpfad-daten.js"></script>
<script src="lernpfad.js"></script>
<script type="module">
  import { speak, warm } from './audio.js';
  window.sprich = speak;
  if (typeof warm === 'function') try { warm(); } catch (e) {}
</script>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   gefuehrt.html — NUR Ablauf + Daten. KEIN Karten-Layout hier.
   Fluss: Thema → Wörter → Hören → Sprechen (Drill + Rollenspiel) → Lektion.
   Alles 0 Token: haeppchen-db.js + szenen.js + szenen-dialog.js, Engine rendert.
   ═══════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  /* ── Profil ── */
  var USER = {};
  try { USER = JSON.parse(localStorage.getItem('spikiu_user') || '{}'); } catch (e) { USER = {}; }
  var P = USER.profile || {};
  var ZIEL = (['de','es','en','el'].indexOf(P.zielsprache) > -1) ? P.zielsprache : 'es';
  var MUT  = (['de','es','en'].indexOf(P.muttersprache) > -1) ? P.muttersprache : 'de';

  /* ── UI-Texte (Muttersprache) ── */
  var T = {
    de: { titel:'Geführtes Gespräch', waehle:'Wähle ein Thema', neu:'neu', wieder:'wiederholen',
          rail:['Thema','Wörter','Hören','Sprechen','Lektion'],
          wortEyebrow:'Wortschatz mit Audio', flipHint:'tippen zum Umdrehen',
          drillEyebrow:'Sprechen üben', drillSag:'Sag es auf der Zielsprache — dann tippe zum Prüfen:',
          rolle:{ Kellner:'Kellner', Rezeption:'Rezeption', Fahrer:'Fahrer' },
          lessonSubtitle:'Deine geführte Szene', goalLabel:'Ziel',
          goal:function(t){ return 'Du hast das Thema „' + t + '" geübt: Wörter, Aussprache und ein kurzes Rollenspiel.'; },
          vocabLabel:'Wortschatz', dialogueLabel:'Rollenspiel', quizLabel:'Quiz', you:'Du',
          quizQ:function(w){ return 'Was bedeutet „' + w + '"?'; },
          done:'Geschafft!', doneSub:'Du hast die ganze Szene gesprochen.',
          viewLesson:'Lektion ansehen', enough:'Genug für heute',
          weiter:'Weiter', pruefen:'Prüfen', richtig:'Richtig!', fast:'Fast — schau dir die richtige Antwort an.' },
    es: { titel:'Conversación guiada', waehle:'Elige un tema', neu:'nuevo', wieder:'repasar',
          rail:['Tema','Palabras','Escuchar','Hablar','Lección'],
          wortEyebrow:'Vocabulario con audio', flipHint:'toca para girar',
          drillEyebrow:'Practicar habla', drillSag:'Dilo en el idioma meta — luego toca para comprobar:',
          rolle:{ Kellner:'Camarero', Rezeption:'Recepción', Fahrer:'Conductor' },
          lessonSubtitle:'Tu escena guiada', goalLabel:'Objetivo',
          goal:function(t){ return 'Practicaste el tema «' + t + '»: vocabulario, pronunciación y un breve juego de roles.'; },
          vocabLabel:'Vocabulario', dialogueLabel:'Juego de roles', quizLabel:'Quiz', you:'Tú',
          quizQ:function(w){ return '¿Qué significa «' + w + '»?'; },
          done:'¡Listo!', doneSub:'Has hablado toda la escena.',
          viewLesson:'Ver la lección', enough:'Suficiente por hoy',
          weiter:'Seguir', pruefen:'Comprobar', richtig:'¡Correcto!', fast:'Casi — mira la respuesta correcta.' },
    en: { titel:'Guided conversation', waehle:'Choose a topic', neu:'new', wieder:'review',
          rail:['Topic','Words','Listen','Speak','Lesson'],
          wortEyebrow:'Vocabulary with audio', flipHint:'tap to flip',
          drillEyebrow:'Speaking practice', drillSag:'Say it in the target language — then tap to check:',
          rolle:{ Kellner:'Waiter', Rezeption:'Reception', Fahrer:'Driver' },
          lessonSubtitle:'Your guided scene', goalLabel:'Goal',
          goal:function(t){ return 'You practiced the topic "' + t + '": vocabulary, pronunciation and a short roleplay.'; },
          vocabLabel:'Vocabulary', dialogueLabel:'Roleplay', quizLabel:'Quiz', you:'You',
          quizQ:function(w){ return 'What does "' + w + '" mean?'; },
          done:'Done!', doneSub:'You spoke the whole scene.',
          viewLesson:'View lesson', enough:'Enough for today',
          weiter:'Next', pruefen:'Check', richtig:'Correct!', fast:'Almost — look at the right answer.' }
  };
  var U = T[MUT] || T.de;

  var CAPY = '<svg width="20" height="20" viewBox="0 0 80 80" fill="none">'
  + '<ellipse cx="40" cy="50" rx="28" ry="20" fill="#c9956a"/><ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/>'
  + '<ellipse cx="40" cy="36" rx="10" ry="7" fill="#b8845a"/><ellipse cx="40" cy="33" rx="4" ry="2.5" fill="#8b5e3c"/>'
  + '<circle cx="38" cy="33" r="1" fill="#6b4226"/><circle cx="42" cy="33" r="1" fill="#6b4226"/>'
  + '<circle cx="33" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="47" cy="24" r="3.5" fill="#3d2b1f"/>'
  + '<circle cx="34" cy="23" r="1.2" fill="white"/><circle cx="48" cy="23" r="1.2" fill="white"/>'
  + '<ellipse cx="26" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="54" cy="17" rx="6" ry="5" fill="#b8845a"/>'
  + '<ellipse cx="22" cy="66" rx="7" ry="5" fill="#b8845a"/><ellipse cx="34" cy="68" rx="7" ry="5" fill="#b8845a"/>'
  + '<ellipse cx="46" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="58" cy="66" rx="7" ry="5" fill="#b8845a"/>'
  + '<path d="M36 38 Q40 41 44 38" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>';

  /* ── Rail ── */
  var railEl = document.getElementById('rail');
  railEl.innerHTML = U.rail.map(function (s, i) { return '<div class="step" data-i="' + i + '"><span class="dot"></span>' + s + '</div>'; }).join('');
  function setRail(idx) {
    railEl.querySelectorAll('.step').forEach(function (s, i) {
      s.classList.toggle('done', i < idx); s.classList.toggle('on', i === idx);
    });
  }
  document.getElementById('pageTitle').textContent = U.titel;

  /* ── Engine einrichten ── */
  var stage = document.getElementById('stage');
  SpikiuKarten.setup({ stage: stage, zielsprache: ZIEL });

  var TOPIC_ID = null, TOPIC_LABEL = '', HAP = null, RP = null;

  /* ── Eine Quelle fuer den Stoff dieses Raums ──────────────────────────
     Liegt fuer dieses Thema eine Lernpfad-Station bereit, kommen die
     WOERTER von dort — dann zaehlen sie im Gym auf den Ring der Station
     ein (siehe woerter.js). Sonst bleibt der bisherige Haeppchen-Satz.

     Das HOERVERSTEHEN kommt IMMER aus haeppchen-db.js: die Stationen haben
     keins, und es hier zu erfinden waere geraten statt gebaut.

     Andere Zielsprachen als Spanisch laufen unveraendert weiter, weil es
     dort noch keine Stationen gibt. Kein Bruch, nur ein Aufwerten. */
  function ladeStoff() {
    var h = window.spikiuHaeppchen(TOPIC_ID, ZIEL, MUT);
    if (!h) return null;
    try {
      var P = window.SpikiuPfad, D = window.SpikiuLernpfad;
      if (P && D && P.existiert() && D.zielsprache === ZIEL) {
        var st = P.stufe();
        var S = D.station(st, TOPIC_ID);
        if (S && S.wortschatz && S.wortschatz.length) {
          h.wortschatz = S.wortschatz.map(function (w) {
            return { ziel: w.z, lautschrift: w.tr || null, uebersetzung: (w.na && (w.na[MUT] || w.na.de)) || '' };
          });
          h.station = st + '.' + TOPIC_ID;
          h.stufe = st;
        }
      }
    } catch (e) { /* Stoff darf nie am Lernpfad scheitern */ }
    return h;
  }

  /* Betreten heisst beruehren — mehr wird nicht behauptet. Eine gesetzte
     Station faellt dadurch nicht zurueck (siehe lernpfad.js). */
  function markiereBesuch() {
    try {
      var P = window.SpikiuPfad;
      if (P && P.existiert() && HAP && HAP.stufe) P.beruehre(TOPIC_ID, HAP.stufe);
    } catch (e) {}
  }

  /* ── Sitzungs-Persistenz: keine Arbeit geht durch einen Fehl-Tipp verloren.
        Gespeichert wird Thema + Phase + Karten-Index (entprellt).
        Raum-Schlüssel 'gefuehrt'. Kein Zombie-Resume: Abschluss räumt auf. ── */
  var SITZ_PHASE = null, SITZ_INDEX = 0, sitzTimer = null;
  function sitzSpeichern() {
    if (!TOPIC_ID || !SITZ_PHASE) return;
    clearTimeout(sitzTimer);
    sitzTimer = setTimeout(function () {
      try {
        if (window.spikiuSitzung && window.spikiuSitzung.speichere) {
          window.spikiuSitzung.speichere('gefuehrt', {
            topicId: TOPIC_ID, topicLabel: TOPIC_LABEL, phase: SITZ_PHASE, index: SITZ_INDEX
          });
        }
      } catch (e) {}
    }, 350);
  }
  function sitzSetze(phase, index) { SITZ_PHASE = phase; SITZ_INDEX = index || 0; sitzSpeichern(); }
  function sitzRaeumen() {
    clearTimeout(sitzTimer); SITZ_PHASE = null; SITZ_INDEX = 0;
    try { if (window.spikiuSitzung && window.spikiuSitzung.raeume) window.spikiuSitzung.raeume('gefuehrt'); } catch (e) {}
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  /* ── THEMA: Palette = 3 neu + 2 fällig, gefiltert auf 0-Token-Themen (DB) ── */
  function showPalette() {
    setRail(0);
    var wrap = document.createElement('div'); wrap.className = 'palette';
    wrap.innerHTML = '<span class="cap" role="button" aria-label="Spikiu" style="cursor:pointer">' + CAPY + '</span><h2>' + esc(U.waehle) + '</h2>';
    stage.innerHTML = ''; stage.appendChild(wrap);

    var SAG = { es:'¡Elige un tema!', de:'Wähl ein Thema!', en:'Choose a topic!', el:'Διάλεξε ένα θέμα!' };
    wrap.querySelector('.cap').onclick = function () {
      var txt = SAG[ZIEL] || SAG.es;
      try {
        if (window.sprich) { window.sprich(txt, ZIEL); }
        else if (window.speechSynthesis && window.SpeechSynthesisUtterance) {
          var uo = new SpeechSynthesisUtterance(txt); speechSynthesis.cancel(); speechSynthesis.speak(uo);
        }
      } catch (e) {}
    };

    function betrete(id, label) {
      TOPIC_ID = id; TOPIC_LABEL = label;
      HAP = ladeStoff();
      if (!HAP) { showPalette(); return; }
      markiereBesuch();
      startWoerter();
    }

    // Die Kachelwahl kommt aus lernpfad.js — dieselbe wie im Chat.
    // Zwei Oberflächen für dieselbe Sache wären zwei Wahrheiten.
    var P = window.SpikiuPfad, D = window.SpikiuLernpfad;
    if (P && D && P.existiert() && D.zielsprache === ZIEL && P.kategorien().length) {
      var host = document.createElement('div');
      wrap.appendChild(host);
      P.waehler(host, {
        ui: MUT,
        zurueck: U.waehle,
        onWahl: function (id, stufe, x) { betrete(id, x.na[MUT] || x.na.de); }
      });
      return;
    }

    // Ohne Lernpfad (Deutsch, Englisch, Griechisch): bisherige Palette.
    var db = (window.spikiuHaeppchen && window.spikiuHaeppchen.themen) || [];
    var alle = (window.spikiuSzenenPalette ? window.spikiuSzenenPalette() : []).filter(function (s) { return db.indexOf(s.id) > -1; });
    if (!alle.length) {
      alle = (window.spikiuSzenen || []).filter(function (s) { return db.indexOf(s.id) > -1; }).slice(0, 5);
    }
    var done = {};
    try { done = (JSON.parse(localStorage.getItem('spikiu_user') || '{}').szenen) || {}; } catch (e) {}
    var chips = document.createElement('div'); chips.className = 'chips';
    chips.innerHTML = alle.map(function (s, i) {
      var wieder = done[s.id] && done[s.id].done;
      return '<button class="chip" data-i="' + i + '">' + s.emoji + ' ' + esc(s[MUT] || s.de)
        + (wieder ? ' ↻' : '') + '</button>';
    }).join('');
    wrap.appendChild(chips);
    chips.querySelectorAll('.chip').forEach(function (b) {
      b.onclick = function () {
        var s = alle[+b.getAttribute('data-i')];
        betrete(s.id, s[MUT] || s.de);
      };
    });
  }

  /* ── WÖRTER: Erkennungs-Flips (Ziel vorne + Audio, Übersetzung hinten) ── */
  function startWoerter(startIdx) {
    setRail(1);
    var items = HAP.wortschatz.map(function (h, i) {
      return {
        typ: 'flip',
        eyebrow: '📖 ' + U.wortEyebrow + ' · ' + (i + 1) + ' / ' + HAP.wortschatz.length,
        front: { text: h.ziel, ziel: true, audio: true, hint: U.flipHint },
        back:  { text: h.uebersetzung, ziel: false, sub: h.lautschrift || null, hint: U.flipHint },
        weiter: U.weiter
      };
    });
    SpikiuKarten.sequence(items, startHoeren,
      { start: startIdx || 0, onStep: function (i) { sitzSetze('woerter', i); } });
  }

  /* ── HÖREN: aus hoerverstehen (minimalpaar → single, woerter → multi) ── */
  function startHoeren(startIdx) {
    setRail(2);
    var hv = HAP.hoerverstehen || [];
    if (!hv.length) { startDrill(); return; }
    var items = hv.map(function (h, i) {
      var eyebrow = 'Hörverständnis · ' + (i + 1) + ' / ' + hv.length;
      if (h.typ === 'woerter') {
        return { typ: 'choice', eyebrow: eyebrow, audio: h.audio, instr: h.frage, multi: true, optsZiel: true,
          options: h.woerter.map(function (x) { return { text: x.text, ok: !!x.gehoert }; }),
          pruefen: U.pruefen, weiter: U.weiter, richtig: U.richtig, fast: U.fast };
      }
      return { typ: 'choice', eyebrow: eyebrow, audio: h.audio, instr: h.frage, multi: false, optsZiel: true,
        options: h.optionen.map(function (x) { return { text: x.text, ok: !!x.richtig }; }),
        pruefen: U.pruefen, weiter: U.weiter, richtig: U.richtig, fast: U.fast };
    });
    SpikiuKarten.sequence(items, startDrill,
      { start: startIdx || 0, onStep: function (i) { sitzSetze('hoeren', i); } });
  }

  /* ── SPRECHEN A: Produktions-Drill (Cue Muttersprache → Ziel + Audio) ── */
  function startDrill(startIdx) {
    setRail(3);
    var items = HAP.wortschatz.map(function (h, i) {
      return {
        typ: 'flip',
        eyebrow: '🗣️ ' + U.drillEyebrow + ' · ' + (i + 1) + ' / ' + HAP.wortschatz.length,
        front: { text: h.uebersetzung, ziel: false, hint: U.drillSag },
        back:  { text: h.ziel, ziel: true, audio: true, sub: h.lautschrift || null, hint: U.flipHint },
        weiter: U.weiter
      };
    });
    SpikiuKarten.sequence(items, startRollenspiel,
      { start: startIdx || 0, onStep: function (i) { sitzSetze('drill', i); } });
  }

  /* ── SPRECHEN B: Skript-Rollenspiel (szenen-dialog.js) ── */
  function startRollenspiel(startIdx) {
    RP = (window.spikiuSzenenDialog) ? window.spikiuSzenenDialog(TOPIC_ID, ZIEL) : null;
    if (!RP || !RP.schritte || !RP.schritte.length) { finishScene(); return; }
    var rolle = (U.rolle && U.rolle[RP.rolle]) || RP.rolle;
    var items = RP.schritte.map(function (st, i) {
      return {
        typ: 'roleplay',
        eyebrow: 'Rollenspiel · ' + rolle + ' · ' + (i + 1) + ' / ' + RP.schritte.length,
        ziel: st.spikiu.ziel, trans: st.spikiu.trans, tip: st.tip || null,
        options: st.opts.map(function (o) { return { text: o.text, ok: !!o.ok }; }),
        weiter: U.weiter
      };
    });
    SpikiuKarten.sequence(items, finishScene,
      { start: startIdx || 0, onStep: function (i) { sitzSetze('rollenspiel', i); } });
  }

  /* ── LEKTION: statisch bauen, speichern, zeigen; Szene für FSRS markieren ── */
  function buildLesson() {
    var vocab = HAP.wortschatz.map(function (h) { return { word: h.ziel, translation: h.uebersetzung || '' }; });
    var dialogue = [];
    if (RP && RP.schritte) {
      var rolle = (U.rolle && U.rolle[RP.rolle]) || RP.rolle;
      RP.schritte.forEach(function (st) {
        dialogue.push({ speaker: rolle, text: st.spikiu.ziel, translation: st.spikiu.trans });
        var ok = null; st.opts.forEach(function (o) { if (o.ok && !ok) ok = o; });
        if (ok) dialogue.push({ speaker: U.you, text: ok.text, translation: '' });
      });
    }
    var quiz = [];
    vocab.forEach(function (v, i) {
      if (!v.translation) return;
      var distract = [];
      vocab.forEach(function (x, j) { if (j !== i && x.translation && distract.indexOf(x.translation) === -1) distract.push(x.translation); });
      quiz.push({ question: U.quizQ(v.word), options: shuffle([v.translation].concat(shuffle(distract).slice(0, 2))), answer: v.translation });
    });
    return {
      title: TOPIC_LABEL, subtitle: U.lessonSubtitle,
      goalLabel: U.goalLabel, goal: U.goal(TOPIC_LABEL),
      vocabLabel: U.vocabLabel, vocab: vocab,
      dialogueLabel: U.dialogueLabel, dialogue: dialogue,
      quizLabel: U.quizLabel, quiz: quiz
    };
  }

  function finishScene() {
    setRail(4);
    sitzRaeumen();
    var lesson = buildLesson();
    try {
      var u = JSON.parse(localStorage.getItem('spikiu_user') || '{}');
      u.szenen = u.szenen || {};
      var prev = u.szenen[TOPIC_ID] || {};
      u.szenen[TOPIC_ID] = { done: true, last: Date.now(), stab: (prev.stab || 0) + 1 };
      var entry = {
        id: 'lesson_' + Date.now(), topic: lesson.title || 'Lektion', thema: TOPIC_LABEL,
        fromConversation: false, lesson: lesson,
        createdAt: new Date().toISOString(), zielsprache: ZIEL
      };
      var arr = Array.isArray(u.lessons) ? u.lessons.slice() : [];
      arr.push(entry);
      arr.sort(function (a, b) { return (b.createdAt || '').localeCompare(a.createdAt || ''); });
      u.lessons = arr.slice(0, 14);
      u.blaetter = (u.blaetter || 0) + 1;
      localStorage.setItem('spikiu_user', JSON.stringify(u));
    } catch (e) {}
    var lessonItem = lesson; lessonItem.typ = 'lesson'; lessonItem.weiter = U.weiter;
    SpikiuKarten.render(lessonItem, function () {
      SpikiuKarten.render({
        typ: 'note', emoji: '🎉', title: U.done, sub: U.doneSub,
        buttons: [
          { label: U.viewLesson, ghost: true, go: function () { location.href = 'lektionen.html'; } },
          { label: U.enough, go: function () { location.href = 'haus.html'; } }
        ]
      }, function () {});
    });
  }

  /* ── Eintritt: nur bei einer WIRKLICH angefangenen, unfertigen Sitzung fragen ── */
  function sitzWiederherstellen(sv) {
    var db = (window.spikiuHaeppchen && window.spikiuHaeppchen.themen) || [];
    if (db.indexOf(sv.topicId) === -1) { showPalette(); return; }
    TOPIC_ID = sv.topicId;
    var sz = (window.spikiuSzenen || []).filter(function (x) { return x.id === sv.topicId; })[0];
    TOPIC_LABEL = sv.topicLabel || (sz ? (sz[MUT] || sz.de) : sv.topicId);
    HAP = ladeStoff();
    if (!HAP) { showPalette(); return; }
    var i = sv.index || 0;
    if (sv.phase === 'hoeren')          { setRail(2); startHoeren(i); }
    else if (sv.phase === 'drill')      { setRail(3); startDrill(i); }
    else if (sv.phase === 'rollenspiel'){ setRail(3); startRollenspiel(i); }
    else                                { setRail(1); startWoerter(i); }
  }
  function eintritt() {
    var sv = null;
    try { sv = (window.spikiuSitzung && window.spikiuSitzung.lade) ? window.spikiuSitzung.lade('gefuehrt') : null; } catch (e) { sv = null; }
    var angefangen = sv && sv.topicId && sv.phase && !(sv.phase === 'woerter' && !sv.index);
    if (angefangen && window.spikiuSitzung && window.spikiuSitzung.frageWiederkommen) {
      window.spikiuSitzung.frageWiederkommen({
        raum: 'gefuehrt', ts: sv.ts, wo: sv.topicLabel || '',
        beimWeiter: function () { sitzWiederherstellen(sv); },
        beimNeu: function () { sitzRaeumen(); showPalette(); }
      });
      return;
    }
    showPalette();
  }
  eintritt();
})();
</script>
