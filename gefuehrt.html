<html lang="de">

<link rel="stylesheet" href="/fonts/spikiu-fonts.css">
<style>
/* ═══ Geführtes Gespräch im „Feines Ohr"-Design (Leo, 19.10.2026: „Lasst uns geführt und freies
   Gespräch nach diesem Prototyp reformieren"). Vorlage: prototyp-gespraech-ohr.html.
   Karten-Bausteine: ohr-karten.js. Nur die Lektion rendert weiter karten-engine.js. ═══ */
:root{ --minz:#eef7f1; --ink:#15163a; --muted:#5f7068; --acc:#1f93b0; --faint:#dfe6e0; --ow:2.5px; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--minz);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer}
.app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;background:var(--minz)}

.kopf{flex:0 0 auto;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:6px;
  padding:calc(.55rem + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) .55rem max(14px,env(safe-area-inset-left));
  border-bottom:var(--ow) solid var(--ink);background:rgba(255,255,255,.55)}
.kopf .back{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;box-shadow:2px 3px 0 var(--ink);
  font-size:1.15rem;display:grid;place-items:center}
.kopf .back:active{transform:translate(1px,1px);box-shadow:0 0 0 var(--ink)}
.kopf .mitte{text-align:center;min-width:0}
.kopf .eb{font:600 .64rem/1 'DM Mono',ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
.kopf .ttl{font:900 1.3rem/1.15 'Archivo Black','DM Sans',sans-serif;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.rail{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:8px max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}
.rail .step{display:flex;flex-direction:column;gap:4px}
.rail .step i{display:block;height:5px;border-radius:9px;background:var(--faint)}
.rail .step b{font:700 .58rem/1 'DM Sans',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#9aa49f;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail .step.done i,.rail .step.on i{background:var(--acc)}
.rail .step.on b{color:var(--acc)} .rail .step.done b{color:var(--ink)}

main.stage{flex:1 1 auto;min-height:0;position:relative;display:flex;flex-direction:column;
  padding:12px max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}
#fuss{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
.lstage{position:relative;flex:1;min-height:0}

/* Spiel zum Schluss (01.10.): eigenes Blatt über der Bühne, scrollt. */
.spiel-ende{position:absolute;inset:0;z-index:5;overflow-y:auto;background:var(--minz);padding:1rem 1rem calc(1.4rem + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:1rem}
.spiel-ende .karte{background:#fff;border:2.5px solid var(--ink);border-radius:22px;box-shadow:5px 6px 0 var(--ink);padding:1rem .9rem;max-width:30rem;width:100%;margin:0 auto}
.spiel-ende .ends{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:space-between;max-width:30rem;width:100%;margin:0 auto}
.spiel-ende .end{background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;padding:.6rem 1rem;font:800 .9rem/1 'DM Sans',sans-serif;box-shadow:3px 3px 0 var(--ink)}
.spiel-ende .end.primary{background:var(--acc);color:#fff}
@media (max-height:720px){.kopf .ttl{font-size:1.12rem}.kopf .back{width:36px;height:36px}}
</style>

</div>

    kopf(U.sprTitel, 3);
    var s = RP.schritte[i], k = O.karte(stage);
    O.blase(k, { capy: CAPY, z: s.spikiu.ziel, lang: ZIEL, lt: s.spikiu.lt, tr: s.spikiu.tr, trLabel: U.ueb });
    O.task(k, s.tip || U.sprTask, RP.rolleText ? RP.rolleText + ' · ' + U.vonN(i + 1, RP.schritte.length) : U.vonN(i + 1, RP.schritte.length));
    O.big(k, U.anhoeren, function () { sprich(s.spikiu.ziel); });
    O.runde(k, { sprich: sprich, auto: s.spikiu.ziel, dannSprich: s.ok.z, liste: true,
      kacheln: [{ ok: true, html: '<span class="oh-tz" lang="' + ZIEL + '">' + esc(s.ok.z) + '</span>' }].concat(s.falsch.map(function (f) { return { html: '<span class="oh-tz" lang="' + ZIEL + '">' + esc(f.z) + '</span>', falsch: esc(U.sprFalsch(f.tr || f.z)) }; })),
      richtig: '<span>' + (s.ok.tr ? '= ' + esc(s.ok.tr) + '<br>' : '') + esc(U.sprLaut) + '</span>',
      fertig: function () { ERG.sprechen++; sitzSpeichern(); document.getElementById('oh-rechts').disabled = false; } });
    O.fuss(fussEl, { t: U.genug, go: genug }, { t: i + 1 < RP.schritte.length ? U.weiter : U.lektion, pri: true, aus: true, go: function () { sprechen(i + 1); } });
  }

  /* ═══ 4 · LEKTION (gespeichert in „Deine Lektionen", gerendert von karten-engine) ═══ */
  function buildLesson() {
    var vocab = STOFF.bild.concat(STOFF.saetze.length ? [] : []).map(function (x) { return { word: x.z, translation: x.tr || '' }; });
    if (HAP.S) HAP.S.wortschatz.forEach(function (w) { if (!vocab.some(function (v) { return v.word === w.z; })) vocab.push({ word: w.z, translation: na(w) }); });
    var dialogue = [];
    if (RP && RP.schritte) {
      var rolle = RP.rolleText || RP.rolle || '';
      RP.schritte.forEach(function (st) {
        dialogue.push({ speaker: rolle, text: st.spikiu.ziel, translation: st.spikiu.trans || st.spikiu.tr || '' });
        var ok = st.ok ? { text: st.ok.z, tr: st.ok.tr } : null;
        if (!ok) st.opts.forEach(function (o) { if (o.ok && !ok) ok = { text: o.text, tr: '' }; });
        if (ok) dialogue.push({ speaker: U.you, text: ok.text, translation: ok.tr || '' });
      });
    }
    var quiz = [];
    vocab.slice(0, 8).forEach(function (v, i) {
      if (!v.translation) return;
      var distract = []; vocab.forEach(function (x, j) { if (j !== i && x.translation && distract.indexOf(x.translation) === -1) distract.push(x.translation); });
      quiz.push({ question: U.quizQ(v.word), options: mischen([v.translation].concat(mischen(distract).slice(0, 2))), answer: v.translation });
    });
    return {
      title: TOPIC_LABEL, subtitle: U.lessonSubtitle, goalLabel: U.goalLabel, goal: U.goal(TOPIC_LABEL),
      kulturLabel: U.kulturLabel, kultur: (function () { try { var D = window.SpikiuLernpfad; return (D && D.kulturVon && HAP.stufe && D.zielsprache === ZIEL) ? D.kulturVon(HAP.stufe, TOPIC_ID, MUT) : ''; } catch (e) { return ''; } })(),
      vocabLabel: U.vocabLabel, vocab: vocab, dialogueLabel: U.dialogueLabel, dialogue: dialogue, quizLabel: U.quizLabel, quiz: quiz
    };
  }
  function lektion() {
    kopf(U.lekTitel, 4);
    sitzRaeumen();
    var lesson = buildLesson();
    try {
      var u = JSON.parse(localStorage.getItem('spikiu_user') || '{}');
      u.szenen = u.szenen || {}; var prev = u.szenen[TOPIC_ID] || {};
      u.szenen[TOPIC_ID] = { done: true, last: Date.now(), stab: (prev.stab || 0) + 1 };
      var arr = Array.isArray(u.lessons) ? u.lessons.slice() : [];
      arr.push({ id: 'lesson_' + Date.now(), topic: lesson.title || 'Lektion', thema: TOPIC_LABEL, fromConversation: false, lesson: lesson, createdAt: new Date().toISOString(), zielsprache: ZIEL });
      arr.sort(function (a, b) { return (b.createdAt || '').localeCompare(a.createdAt || ''); });
      u.lessons = arr.slice(0, 14); u.blaetter = (u.blaetter || 0) + 1;
      localStorage.setItem('spikiu_user', JSON.stringify(u));
    } catch (e) {}
    stage.innerHTML = ''; fussEl.innerHTML = '';
    var ls = O.el('div', 'lstage'); stage.appendChild(ls);
    SpikiuKarten.setup({ stage: ls, zielsprache: ZIEL });
    var item = lesson; item.typ = 'lesson'; item.weiter = U.weiter.replace(' ›', '');
    SpikiuKarten.render(item, ende);
  }

  /* ═══ 5 · ABSCHLUSS ═══ */
  function ende() {
    kopf(U.fertigTitel, 5);
    var k = O.karte(stage);
    O.blase(k, { capy: CAPY, z: ENDE_SP[ZIEL], lang: ZIEL, tr: ENDE_TR[MUT], trOffen: true });
    var g = O.raster(k, 'bilder');
    var erkannt = WS ? WS.treffer.filter(function (n) { return n >= 1; }).length : 0;
    [['📖', U.woerter, STOFF.bild.length ? U.endWoerter(erkannt, STOFF.bild.length) : ''], ['🎧', U.hoerenK, U.endHoeren(ERG.hoeren)], ['🗣️', U.sprechenK, U.endSprechen(ERG.sprechen)], ['✏️', U.lektionK, U.endLektion]].forEach(function (x) {
      g.appendChild(O.el('div', 'oh-tile', '<span class="oh-te">' + x[0] + '</span><span class="oh-tn">' + esc(x[1]) + '</span><span class="oh-ts">' + esc(x[2]) + '</span>'));
    });
    O.fb(k, esc(U.endFb));
    setTimeout(function () { sprich(ENDE_SP[ZIEL]); }, 300);
    var spiel = spielZumSchluss();
    O.fuss(fussEl, { t: U.genug, go: function () { location.href = 'haus.html'; } },
      spiel ? { t: spiel.label + ' ›', pri: true, go: spiel.start } : { t: U.viewLesson + ' ›', pri: true, go: function () { location.href = 'lektionen.html'; } });
  }
  function genug() { sitzSpeichern(); location.href = 'haus.html'; }

  /* ── SPIEL ZUM SCHLUSS (Leo, 01.10.): angeboten, nie verordnet. ── */
  function spielZumSchluss() {
    var J = window.spikiuJuegos; if (!J) return null;
    var saetze = [], mitTr = [];
    if (RP && RP.schritte) RP.schritte.forEach(function (st) {
      if (st.spikiu && st.spikiu.ziel) { saetze.push(st.spikiu.ziel); if (st.spikiu.tr) mitTr.push({ satz: st.spikiu.ziel, tr: st.spikiu.tr }); }
      if (st.ok) saetze.push(st.ok.z);
    });
    var passend = mitTr.filter(function (x) { var n = J.woerterAus(x.satz).length; return n >= 3 && n <= 8; });
    var woerterL = STOFF.bild.concat(STOFF.saetze).filter(function (h) { return h.z && h.tr; });
    var pool = saetze.concat(woerterL.map(function (h) { return h.z; }));
    var pinata = null;
    J.mezcla(passend).some(function (x) { var ein = J.eindringling(x.satz, pool, ZIEL); if (ein) pinata = { satz: x.satz, tr: x.tr, intruso: ein.wort, intrusoDe: ein.aus }; return !!pinata; });
    var nurW = STOFF.bild.filter(function (h) { return h.z && h.tr; });
    var gemelos = nurW.length >= 4 ? J.mezcla(nurW).slice(0, 4).map(function (h) { return { z: h.z, na: h.tr }; }) : null;
    var feldW = (window.spikiuWortfelder && TOPIC_ID) ? window.spikiuWortfelder.feld(ZIEL, TOPIC_ID, MUT) : [];
    var gw = feldW.filter(function (x) { var r = J.silbenTon(x.z, ZIEL); return r && r.s.length >= 2 && r.s.length <= 4; });
    var golpe = gw.length >= 3 ? { woerter: gw } : null;
    var zaehler = 0; try { zaehler = (JSON.parse(localStorage.getItem('spikiu_user') || '{}').blaetter) || 0; } catch (e) {}
    var daten = { gemelos: gemelos, pinata: pinata, golpe: golpe };
    var reihe = ['gemelos', 'pinata', 'golpe'].filter(function (a) { return !!daten[a]; });
    if (!reihe.length) return null;
    var art = reihe[zaehler % reihe.length];
    var LABEL = { pinata: U.spielPinata, gemelos: U.spielGemelos, golpe: U.spielGolpe };
    return { label: LABEL[art], start: function () { zeigeSpiel(art, daten[art]); } };
  }
  function zeigeSpiel(art, daten) {
    var J = window.spikiuJuegos;
    var opts = { nativeLang: MUT, zielLang: ZIEL, sprich: function (t) { sprich(t); } };
    var blatt = document.createElement('div'); blatt.className = 'spiel-ende';
    var karte = document.createElement('div'); karte.className = 'karte';
    if (art === 'gemelos') opts.klang = true;
    var spiel = (art === 'pinata') ? J.pinata(daten, opts) : (art === 'golpe') ? J.golpe(daten, opts) : J.gemelos(daten, opts);
    karte.appendChild(spiel); blatt.appendChild(karte); stage.appendChild(blatt);
    var fertig = false;
    spiel.addEventListener('jg-done', function () {
      if (fertig) return; fertig = true;
      var e = document.createElement('div'); e.className = 'ends';
      var a = document.createElement('button'); a.className = 'end'; a.type = 'button'; a.textContent = U.viewLesson; a.onclick = function () { spiel.stop(); location.href = 'lektionen.html'; };
      var b = document.createElement('button'); b.className = 'end primary'; b.type = 'button'; b.textContent = U.enough; b.onclick = function () { spiel.stop(); location.href = 'haus.html'; };
      e.appendChild(a); e.appendChild(b); blatt.appendChild(e);
      setTimeout(function () { try { e.scrollIntoView({ behavior: 'smooth', block: 'end' }); } catch (x) {} }, 900);
    });
  }

  /* ── Eintritt: Direktweg ?thema=, Wiederkommen, sonst Themenwahl ── */
  function sitzWiederherstellen(sv) {
    var lab = sv.topicLabel || sv.topicId;
    betrete(sv.topicId, lab, function () {
      ERG = sv.erg || { hoeren: 0, sprechen: 0 };
      var ws = sv.ws;
      if (ws && STOFF.bild.length && ws.treffer && ws.treffer.length === STOFF.bild.length) WS = ws; else WS = null;
      if (sv.phase === 'hoeren') { HS = null; hoeren(); }
      else if (sv.phase === 'sprechen') sprechen(sv.index || 0);
      else woerter();
    });
  }
  function direktThema() {
    var such = window.location.search || '';
    if (/[?&]von=learnroman\b/.test(such)) ZURUECK = 'learnroman.html';
    var m = such.match(/[?&]thema=([a-z]+)/);
    if (!m) return false;
    var id = m[1], D = window.SpikiuLernpfad, t = D && D.themen ? D.themen.filter(function (x) { return x.id === id; })[0] : null;
    var sz = (window.spikiuSzenen || []).filter(function (x) { return x.id === id; })[0];
    var lab = t ? (t.na[MUT] || t.na.en || t.na.de) : (sz ? (sz[MUT] || sz.de) : id);
    TOPIC_ID = id; HAP = ladeStoff(); if (!HAP) { TOPIC_ID = null; return false; }
    sitzRaeumen();
    betrete(id, lab);
    return true;
  }
  function eintritt() {
    if (direktThema()) return;
    var sv = null;
    try { sv = (window.spikiuSitzung && window.spikiuSitzung.lade) ? window.spikiuSitzung.lade('gefuehrt') : null; } catch (e) { sv = null; }
    var angefangen = sv && sv.topicId && sv.phase;
    if (angefangen && window.spikiuSitzung && window.spikiuSitzung.frageWiederkommen) {
      window.spikiuSitzung.frageWiederkommen({ raum: 'gefuehrt', ts: sv.ts, wo: sv.topicLabel || '',
        beimWeiter: function () { sitzWiederherstellen(sv); }, beimNeu: function () { sitzRaeumen(); showPalette(); } });
      return;
    }
    showPalette();
  }
  eintritt();
})();
