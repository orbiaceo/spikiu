<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spikiu · Lernroman</title>
<meta name="description" content="Der Lernroman — ein Buch, das dich in die Sprache hineinzieht.">

<!-- Schriften SELBST GEHOSTET (kein Google-Fonts-CDN).
     DM Sans = Oberfläche + Muttersprache · Lora = Zielsprache (Schrift = Sprache). -->
<link rel="stylesheet" href="/fonts/spikiu-fonts.css">

<style>
/* ══════════════════════════════════════════════════════════════════════════
   LERNROMAN · Layout im Haus-Stil (15.10.2026, Leo: „gleiches Design wie haus.html")
   Kopf wie gefuehrt.html (runder Zurück-Knopf + Titel in DM Sans 800),
   Karten mit dicker Tinte-Kontur und versetztem Schatten, Emoji-Kacheln in
   ruhigen Farben, Minz-Grund. Kein Archivo Black, kein DM Mono mehr.
   Schrift = Sprache bleibt: Lora trägt die Zielsprache, DM Sans alles andere.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --minz:#eef7f1; --ink:#15163a; --muted:#5f7068; --acc:#1f93b0; --coral:#ff6b5a;
  --sky:#d3eef6; --mustard:#ffd24a; --sage:#9bd14a; --read:#23243f; --gloss:#5f6a66;
  --ow:2.5px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{height:100%}
body{background:var(--minz);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}

.app{position:relative;display:flex;flex-direction:column;height:100dvh;max-width:680px;margin:0 auto;background:var(--minz);overflow:hidden}

/* ── Kopf (wie gefuehrt.html) ── */
.rnav{flex:0 0 auto;display:flex;align-items:center;gap:.7rem;
  padding:calc(.6rem + env(safe-area-inset-top)) .9rem .6rem;
  background:var(--minz);border-bottom:var(--ow) solid var(--ink)}
.back{width:36px;height:36px;flex:0 0 36px;border-radius:999px;border:2.5px solid var(--ink) !important;
  background:#fff !important;font-size:1.15rem;line-height:1;box-shadow:2px 2px 0 var(--ink);
  display:flex;align-items:center;justify-content:center}
.back:active{transform:translate(1px,1px);box-shadow:0 0 0 var(--ink)}
.rnav .title{font:800 1.05rem/1.2 'DM Sans',sans-serif;color:var(--ink)}
.rnav .rk{font:700 .72rem/1.2 'DM Sans',sans-serif;color:var(--muted)}
.rnav .rt{font:600 1.08rem/1.2 'Lora',serif;color:var(--ink)}
.rnav .htx{min-width:0}

/* ── Liste ── */
.list{flex:1;min-height:0;overflow-y:auto;padding:1.1rem 1rem calc(2.4rem + env(safe-area-inset-bottom))}

.cover{display:flex;gap:.9rem;align-items:center;background:var(--sky);border:var(--ow) solid var(--ink);
  border-radius:22px;box-shadow:4px 5px 0 var(--ink);padding:1rem 1rem 1.05rem;margin-bottom:1.5rem}
.cover .cv-ic{flex:0 0 58px;height:58px;border-radius:16px;background:#fff;border:2.5px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:1.9rem;box-shadow:2px 2px 0 var(--ink)}
.cover .cv-t{font:600 1.4rem/1.15 'Lora',serif;color:var(--ink)}
.cover .cv-s{font:600 .86rem/1.35 'DM Sans',sans-serif;color:rgba(21,22,58,.72);margin-top:.25rem}

.band{margin-bottom:1.6rem}
.bandhead{display:flex;align-items:center;gap:.55rem;margin:0 .1rem .2rem}
.bandhead .nm{font:800 1.02rem/1.2 'DM Sans',sans-serif}
.pill{font:800 .6rem/1 'DM Sans',sans-serif;border:2px solid var(--ink);border-radius:999px;padding:.2rem .5rem;letter-spacing:.02em}
.pill.open{background:var(--sage)}
.pill.closed{background:#fff;color:var(--muted);border-color:rgba(21,22,58,.35)}
.teil{font:500 .95rem/1.3 'Lora',serif;font-style:italic;color:var(--muted);margin:0 .1rem .7rem}

.st{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;background:#fff;
  border:var(--ow) solid var(--ink) !important;border-radius:18px;box-shadow:3px 4px 0 var(--ink);
  padding:.75rem .8rem;margin-bottom:.7rem;transition:transform .1s,box-shadow .1s}
.st:active{transform:translate(2px,2px);box-shadow:1px 2px 0 var(--ink)}
.st.zuletzt{border-color:var(--acc) !important;box-shadow:3px 4px 0 var(--acc)}
.st-ic{flex:0 0 48px;height:48px;border-radius:14px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:1.5rem;line-height:1}
.st-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:.1rem}
.st-k{font:700 .7rem/1.2 'DM Sans',sans-serif;color:var(--muted)}
.st-t{font:600 1.08rem/1.25 'Lora',serif;color:var(--ink)}
.st-s{font:500 .84rem/1.35 'DM Sans',sans-serif;color:var(--muted);margin-top:.1rem}
.st-chev{flex:0 0 auto;font-size:1.4rem;color:var(--ink);line-height:1}
.st.locked{background:transparent;border-style:dashed !important;border-color:rgba(21,22,58,.4) !important;box-shadow:none;cursor:default}
.st.locked .st-ic{opacity:.45;border-color:rgba(21,22,58,.4)}
.st.locked .st-t{color:var(--muted)}
.st.locked:active{transform:none}

/* Leerer Zustand (Sprachpaar ohne Buch) */
.leer{text-align:center;padding:2.4rem 1rem}
.leer .capy{width:104px;height:104px;margin:0 auto .9rem;display:block}
.leer h2{font:800 1.15rem/1.3 'DM Sans',sans-serif;margin:0 0 .5rem}
.leer p{font-size:.95rem;color:var(--muted);max-width:24rem;margin:0 auto 1.1rem;line-height:1.6}
.knopf{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font:800 .92rem/1 'DM Sans',sans-serif;
  color:var(--ink);background:#fff;border:2.5px solid var(--ink) !important;border-radius:999px;padding:.72rem 1.1rem;
  box-shadow:3px 3px 0 var(--ink);text-decoration:none}
.knopf:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.knopf.primary{background:var(--acc);color:#fff}

/* Etappen-Schalter — nur mit ?dev=1 */
.dev{background:#fff;border:2px dashed var(--ink);border-radius:14px;padding:.6rem;margin-bottom:1.2rem}
.dev .dn{font:700 .7rem/1.2 'DM Sans';color:var(--muted);text-align:center;margin-bottom:.45rem}
.dev .dr{display:flex;gap:.4rem}
.dev .et{flex:1;font:800 .74rem/1.1 'DM Sans';background:#fff;border:2px solid var(--ink) !important;border-radius:12px;padding:.5rem .3rem;box-shadow:2px 2px 0 var(--ink)}
.dev .et.on{background:var(--acc);color:#fff}

/* ── Lese-Ansicht ── */
.reader{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;background:var(--minz)}
.reader.open{display:flex}
.rbody{flex:1;min-height:0;overflow-y:auto;padding:1.3rem 1.1rem calc(2.6rem + env(safe-area-inset-bottom))}

.hinweis{display:flex;gap:.6rem;align-items:center;background:#fff;border:2px dashed var(--acc);border-radius:14px;
  padding:.55rem .7rem;margin:0 0 1.2rem;font:600 .86rem/1.35 'DM Sans',sans-serif;color:var(--ink)}
.hinweis .h-cap{flex:0 0 34px;width:34px;height:34px;border-radius:999px;background:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center}
.hinweis .h-cap svg{width:26px;height:26px}

/* Schrift = Sprache: DM Sans trägt die Muttersprache, Lora die Zielsprache. */
.narr{font:400 1.02rem/1.68 'DM Sans',sans-serif;color:var(--read);margin:0 0 1rem}
.zl{margin:0 0 1rem}
.zrow{display:flex;align-items:flex-start;gap:.55rem}
.zt{flex:1;min-width:0;font:500 1.2rem/1.5 'Lora',serif;color:var(--read)}
.zl.erz .zt{font-weight:400}
/* Gesprochene Sätze (beginnen mit —) stehen in einer Sprechblase wie im Haus. */
.zl.dlg{background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:2px 3px 0 var(--ink);padding:.65rem .75rem .7rem .9rem}
.zbtns{flex:0 0 auto;display:flex;gap:.35rem;margin-top:.05rem}
.spk{width:32px;height:32px;border-radius:999px;border:2px solid var(--ink) !important;background:var(--acc) !important;
  color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 var(--ink)}
.spk svg{width:15px;height:15px;display:block}
.spk:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.spk.busy{animation:spkPuls 1s ease-in-out infinite}
@keyframes spkPuls{0%,100%{opacity:1}50%{opacity:.45}}
.trk{min-width:32px;height:32px;padding:0 .35rem;border-radius:999px;border:2px solid var(--ink) !important;background:#fff !important;
  font:800 .66rem/1 'DM Sans',sans-serif;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 var(--ink)}
.trk.on{background:var(--mustard) !important}
.trk:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.gloss{font:italic 400 .9rem/1.45 'DM Sans',sans-serif;color:var(--gloss);margin-top:.3rem}
.zl.dlg .gloss{border-top:1.5px dashed rgba(21,22,58,.18);padding-top:.35rem}
.gloss.hid{display:none}
.prose{margin:0 0 1.2rem}
.prose .zt{font:400 1.16rem/1.78 'Lora',serif;letter-spacing:.005em}

/* Ende der Station */
.fin{margin-top:1.6rem;display:flex;flex-direction:column;gap:1rem}
.fin .ende{text-align:center;font:italic 500 1rem/1.3 'Lora',serif;color:var(--muted)}
.szene{display:flex;gap:.85rem;align-items:center;background:#fff;border:var(--ow) solid var(--ink);border-radius:20px;
  box-shadow:4px 5px 0 var(--ink);padding:.9rem .9rem .95rem}
.szene .sz-tx{flex:1;min-width:0}
.szene .sz-k{font:800 .95rem/1.3 'DM Sans',sans-serif;color:var(--ink)}
.szene .sz-s{font:500 .84rem/1.35 'DM Sans',sans-serif;color:var(--muted);margin:.15rem 0 .6rem}
.fin .weiter{align-self:stretch;justify-content:space-between;padding:.85rem 1.1rem;font-size:.95rem}
.fin .weiter .wt{font:600 1rem/1.2 'Lora',serif}
.fin .lockline{text-align:center;font:600 .85rem/1.35 'DM Sans',sans-serif;color:var(--muted)}

@media (min-width:700px){ html{font-size:17px} }
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<div class="app">
  <header class="rnav">
    <button class="back" type="button" id="hausZurueck" aria-label="zurück">‹</button>
    <div class="title" id="pageTitle">Lernroman</div>
  </header>

  <main class="list" id="list"></main>

  <section class="reader" id="reader" aria-hidden="true">
    <header class="rnav">
      <button class="back" type="button" id="rback" aria-label="zurück">‹</button>
      <div class="htx"><div class="rk" id="rk"></div><div class="rt" id="rt"></div></div>
    </header>
    <div class="rbody" id="rbody"></div>
  </section>
</div>

<!-- Fester Inhalt: Root-Helfer, SYNCHRON vor dem Haupt-Script. KEIN API-Call. -->
<script src="learnroman-lukas.js"></script>
<script src="learnroman-daten.js"></script>
<script src="szenen.js"></script>
<script src="sitzung.js"></script>
<script src="woerterbuch.js"></script>
<script src="wortjag.js"></script>
<script src="capy-vivo.js" defer></script>

<script>
// ════════════════════════════════════════════════════════════════════
//  SPIKIU · RAUM: LERNROMAN (der Immersions-Leseraum in der Bibliothek)
//
//  Statisch: der Text steht in learnroman-*.js → 0 Netzwerk-Call, 0 Tokens.
//  Anti-Gamification: kein Score, kein Streak, kein Prozent, keine Zählung
//  gelesener Stationen. Nur „zuletzt gelesen" als ruhige Markierung.
//  Jede Station führt am Ende zur passenden Szene im Geführten Gespräch
//  (gefuehrt.html?thema=<id>) — Lesen und Sprechen sind ein Weg.
//  Sitzungs-Persistenz über sitzung.js (Raum 'learnroman'): Station + Scroll.
// ════════════════════════════════════════════════════════════════════

// ── Profil defensiv lesen (Codes de/es/en/el — 1:1 wie chat.html/gym.html) ──
var gespeichert = {};
try { gespeichert = (JSON.parse(localStorage.getItem('spikiu_user')||'{}').profile) || {}; } catch(e){}
function langCode(v){
  if(!v) return null; v=(''+v).toLowerCase();
  if(/^(de|es|en|el)$/.test(v)) return v;
  if(v.indexOf('deutsch')>-1||v.indexOf('german')>-1) return 'de';
  if(v.indexOf('span')>-1||v.indexOf('español')>-1) return 'es';
  if(v.indexOf('engl')>-1) return 'en';
  if(v.indexOf('griech')>-1||v.indexOf('greek')>-1) return 'el';
  return null;
}
function koennenFrom(v){
  if(!v) return null; v=(''+v).toLowerCase();
  if(['anfang','mittel','fortgeschritten'].indexOf(v)>-1) return v;
  if(/a[12]/.test(v)) return 'anfang';
  if(/b[12]/.test(v)) return 'mittel';
  if(/c[12]/.test(v)) return 'fortgeschritten';
  return null;
}
var PROFIL = {
  zielsprache:   gespeichert.zielsprache   || langCode(gespeichert.targetLang) || 'es',
  muttersprache: gespeichert.muttersprache || langCode(gespeichert.nativeLang) || 'de',
  koennen:       gespeichert.koennen       || koennenFrom(gespeichert.level)   || 'anfang'
};

// ── Dev-Schloss: ?dev=1 öffnet alle Etappen und zeigt den Etappen-Schalter. ──
var DEV = /[?&]dev=1\b/.test(window.location.search);

// ── UI-Texte in der MUTTERSPRACHE des Lerners ──
var UI = {
  de:{ titel:'Lernroman', station:'Station', epilog:'Epilog', kapitel:'Kapitel', teil:'Teil', offen:'offen', zu:'öffnet sich später',
       lock:function(nm){ return '✦ öffnet sich in der Etappe ' + nm; },
       hinweisZu:'Tipp auf DE, wenn du die Übersetzung brauchst.', jagd:'Tipp ein Wort an, um es in dein Buch zu nehmen.',
       ende:'— Ende der Station —', endeK:'— Ende des Kapitels —', buchEnde:'— Ende des Buches —',
       szeneK:function(t){ return 'Diese Station ist die Szene »' + t + '«'; },
       szeneS:'Spiel sie selbst — im Geführten Gespräch.', szeneGo:'Szene spielen ›',
       naechste:'Weiter', back:'zurück', hoeren:'Vorlesen', tr:'Übersetzung',
       devnote:'Deine Etappe · zum Testen umschaltbar',
       leerH:'Dieses Buch entsteht noch.',
       leerP:'Der Lernroman für diese Sprache ist noch nicht geschrieben. Spikiu schreibt ihn lieber gut als schnell.',
       leerZ:'Zurück ins Haus' },
  es:{ titel:'Novela para aprender', station:'Estación', epilog:'Epílogo', kapitel:'Capítulo', teil:'Parte', offen:'abierto', zu:'se abre más adelante',
       lock:function(nm){ return '✦ se abre en la etapa ' + nm; },
       hinweisZu:'Toca ES si necesitas la traducción.', jagd:'Toca una palabra para llevarla a tu libro.',
       ende:'— Fin de la estación —', endeK:'— Fin del capítulo —', buchEnde:'— Fin del libro —',
       szeneK:function(t){ return 'Esta estación es la escena «' + t + '»'; },
       szeneS:'Juégala tú — en la conversación guiada.', szeneGo:'Jugar la escena ›',
       naechste:'Seguir', back:'atrás', hoeren:'Escuchar', tr:'Traducción',
       devnote:'Tu etapa · conmutable para probar',
       leerH:'Este libro todavía se está escribiendo.',
       leerP:'La novela para aprender de este idioma aún no existe. Spikiu prefiere escribirla bien antes que rápido.',
       leerZ:'Volver a casa' },
  en:{ titel:'Learning Novel', station:'Stop', epilog:'Epilogue', kapitel:'Chapter', teil:'Part', offen:'open', zu:'opens later',
       lock:function(nm){ return '✦ opens in the ' + nm + ' stage'; },
       hinweisZu:'Tap EN when you need the translation.', jagd:'Tap a word to take it to your book.',
       ende:'— End of the stop —', endeK:'— End of the chapter —', buchEnde:'— The end —',
       szeneK:function(t){ return 'This stop is the scene “' + t + '”'; },
       szeneS:'Play it yourself — in Guided Conversation.', szeneGo:'Play the scene ›',
       naechste:'Next', back:'back', hoeren:'Read aloud', tr:'Translation',
       devnote:'Your stage · switchable for testing',
       leerH:'This book is still being written.',
       leerP:'The Learning Novel for this language does not exist yet. Spikiu would rather write it well than fast.',
       leerZ:'Back to the house' }
};
function uiLang(){ return UI[PROFIL.muttersprache] ? PROFIL.muttersprache : 'de'; }
var T = UI[uiLang()];

// ── Themen des Geführten Gesprächs: Emoji + Name aus szenen.js, Farbe hier ──
var THEMA_FARBE = {
  taxi:'#ffd24a', cafe:'#e9dcc0', einkaufen:'#c8e6a0', wegbeschreibung:'#d3eef6', bahnhof:'#b7c9f2',
  restaurant:'#ffd3c9', wetter:'#fff1a8', arzt:'#ffd3e4', hotel:'#e2d8ff', familie:'#cdeee2'
};
function themaInfo(id){
  var s = (window.spikiuSzenen || []).filter(function(x){ return x.id === id; })[0];
  if (!s) return null;
  return { id:id, emoji:s.emoji, name:(s[uiLang()] || s.de), farbe:THEMA_FARBE[id] || '#fff' };
}

// Spikiu IMMER komplett: Ohren + 4 Füße. Augen-Gruppe + Mund für capy-vivo.js.
var CAPY_SVG = '<svg class="capy" viewBox="0 0 80 80" fill="none">'
  + '<ellipse cx="40" cy="50" rx="28" ry="20" fill="#c9956a"/><ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/>'
  + '<ellipse cx="40" cy="36" rx="10" ry="7" fill="#b8845a"/><ellipse cx="40" cy="33" rx="4" ry="2.5" fill="#8b5e3c"/>'
  + '<circle cx="38" cy="33" r="1" fill="#6b4226"/><circle cx="42" cy="33" r="1" fill="#6b4226"/>'
  + '<g class="spk-capy-eyes"><circle cx="33" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="47" cy="24" r="3.5" fill="#3d2b1f"/>'
  + '<circle cx="34" cy="23" r="1.2" fill="white"/><circle cx="48" cy="23" r="1.2" fill="white"/></g>'
  + '<ellipse cx="26" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="54" cy="17" rx="6" ry="5" fill="#b8845a"/>'
  + '<ellipse cx="22" cy="66" rx="7" ry="5" fill="#b8845a"/><ellipse cx="34" cy="68" rx="7" ry="5" fill="#b8845a"/>'
  + '<ellipse cx="46" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="58" cy="66" rx="7" ry="5" fill="#b8845a"/>'
  + '<path class="spk-capy-mouth" d="M36 38 Q40 41 44 38" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>';
var LAUT_SVG = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#fff"/>'
  + '<path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>';

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

// ── Das Buch zum Sprachpaar (oder keins) ──
var BUCH = (typeof window.spikiuLearnroman === 'function')
  ? window.spikiuLearnroman(PROFIL.zielsprache, PROFIL.muttersprache) : null;
var ETAPPEN = BUCH ? BUCH.etappen : [];
var IST_STATION = !!(BUCH && BUCH.einheit === 'station');
function etIdx(id){
  for (var i=0;i<ETAPPEN.length;i++){ if (ETAPPEN[i].id === id) return i; }
  return -1;
}
function einheitWort(){ return IST_STATION ? T.station : T.kapitel; }

// ── Freischaltung: eigene Etappe UND alles darunter. Kein Schloss, kein Grind. ──
var KOENNEN_ETAPPE = { anfang:'fundament', mittel:'aufbau', fortgeschritten:'anwendung' };
var offenBis = Math.max(0, etIdx(KOENNEN_ETAPPE[PROFIL.koennen] || 'fundament'));
if (DEV) offenBis = ETAPPEN.length - 1;
function istOffen(c){ return etIdx(c.level) <= offenBis; }

// ── Audio (🔊): audio.js ist die EINZIGE Schnittstelle (Modul unten). ──
function warmVoice(){
  if (!BUCH || !window.spkWarm) return;
  try { window.spkWarm(BUCH.zielsprache); } catch(e){}
}
window.warmVoice = warmVoice;
function sprich(text){
  if (window.spkSpeak){ try { return window.spkSpeak(text, BUCH.zielsprache); } catch(e){} }
  try {
    var s = window.speechSynthesis;
    if (s && typeof SpeechSynthesisUtterance !== 'undefined'){
      var bcp = { de:'de-DE', es:'es-ES', en:'en-US', el:'el-GR' }[BUCH.zielsprache] || 'en-US';
      var u = new SpeechSynthesisUtterance(String(text)); u.lang = bcp; s.cancel(); s.speak(u);
    }
  } catch(e){}
}
function sprichAus(btn, text){
  // Der Gedankenstrich der spanischen Dialogform wird nicht mitgesprochen.
  var rein = String(text).replace(/^\s*—\s*/, '').replace(/\s—\s?/g, ', ');
  if (btn) btn.classList.add('busy');
  var fertig = function(){ if (btn) btn.classList.remove('busy'); };
  var p = sprich(rein);
  if (p && p.then) { p.then(fertig, fertig); } else { setTimeout(fertig, 1200); }
}

// ── Sitzungs-Persistenz (sitzung.js, Raum 'learnroman') ───────────────
var RAUM = 'learnroman';
var sitzTimer = null, offenIdx = -1;
function sitzSpeichern(){
  if (offenIdx < 0 || !BUCH) return;
  clearTimeout(sitzTimer);
  var y = document.getElementById('rbody').scrollTop;
  sitzTimer = setTimeout(function(){
    try { if (window.spikiuSitzung) window.spikiuSitzung.speichere(RAUM, { buch:BUCH.buch, i:offenIdx, y:Math.round(y) }); } catch(e){}
  }, 350);
}
function sitzRaeumen(){
  clearTimeout(sitzTimer);
  try { if (window.spikiuSitzung) window.spikiuSitzung.raeume(RAUM); } catch(e){}
}
function sitzLaden(){
  try { return window.spikiuSitzung ? window.spikiuSitzung.lade(RAUM) : null; } catch(e){ return null; }
}
// „Zuletzt gelesen" (ruhige Markierung, kein Zähler) — eigener kleiner Schlüssel.
var ZULETZT_KEY = 'spikiu_learnroman_zuletzt';
function zuletztLesen(){ try { var z = JSON.parse(localStorage.getItem(ZULETZT_KEY) || 'null'); return (z && BUCH && z.buch === BUCH.buch) ? z.i : -1; } catch(e){ return -1; } }
function zuletztMerken(i){ try { localStorage.setItem(ZULETZT_KEY, JSON.stringify({ buch:BUCH.buch, i:i })); } catch(e){} }

// ── Liste ─────────────────────────────────────────────────────────────
var listEl = document.getElementById('list');
var readerEl = document.getElementById('reader');
var ROEMISCH = ['I','II','III','IV','V'];

function renderList(){
  if (!BUCH){ renderLeer(); return; }
  var h = '';
  h += '<div class="cover"><div class="cv-ic">📖</div><div>'
     + '<div class="cv-t" lang="' + esc(BUCH.zielsprache) + '">' + esc(BUCH.titel) + '</div>'
     + (BUCH.untertitel ? '<div class="cv-s">' + esc(BUCH.untertitel) + '</div>' : '')
     + '</div></div>';
  if (DEV) h += '<div class="dev"><div class="dn">' + esc(T.devnote) + '</div><div class="dr" id="etrow"></div></div>';

  var zuletzt = zuletztLesen();
  ETAPPEN.forEach(function(e, ei){
    var kap = BUCH.kapitel.filter(function(c){ return c.level === e.id; });
    if (!kap.length) return;
    var offen = ei <= offenBis;
    h += '<section class="band"><div class="bandhead"><span class="nm">' + esc(e.nm) + '</span>'
       + '<span class="pill ' + (offen ? 'open' : 'closed') + '">' + esc(offen ? T.offen : T.zu) + '</span></div>';
    var teil = BUCH.teile && BUCH.teile[e.id];
    if (teil) h += '<div class="teil">' + esc(T.teil + ' ' + (ROEMISCH[ei] || (ei+1))) + ' · <span lang="' + esc(BUCH.zielsprache) + '">' + esc(teil) + '</span></div>';
    BUCH.kapitel.forEach(function(c, idx){
      if (c.level !== e.id) return;
      var th = c.thema ? themaInfo(c.thema) : null;
      var ic = th ? th.emoji : (IST_STATION ? '✈️' : '📖');
      var farbe = th ? th.farbe : '#fff';
      var kopf = esc(einheitWort() + ' ' + c.n) + (th ? ' · ' + esc(th.name) : (IST_STATION && c.level === 'anwendung' ? ' · ' + esc(T.epilog) : ''));
      var inner = '<span class="st-ic" style="background:' + farbe + '">' + ic + '</span>'
        + '<span class="st-tx"><span class="st-k">' + kopf + '</span>'
        + '<span class="st-t" lang="' + esc(BUCH.zielsprache) + '">' + esc(c.title) + '</span>';
      if (offen){
        h += '<button type="button" class="st' + (idx === zuletzt ? ' zuletzt' : '') + '" data-i="' + idx + '">' + inner
           + '<span class="st-s">' + esc(c.teaser) + '</span></span><span class="st-chev">›</span></button>';
      } else {
        h += '<div class="st locked">' + inner + '<span class="st-s">' + esc(T.lock(e.nm)) + '</span></span></div>';
      }
    });
    h += '</section>';
  });
  listEl.innerHTML = h;
  [].forEach.call(listEl.querySelectorAll('.st[data-i]'), function(b){
    b.onclick = function(){ oeffne(+b.getAttribute('data-i'), 0); };
  });
  if (DEV) renderEtSchalter();
}

function renderEtSchalter(){
  var row = document.getElementById('etrow'); if (!row) return;
  row.innerHTML = '';
  ETAPPEN.forEach(function(e, i){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'et' + (i === offenBis ? ' on' : ''); b.textContent = e.nm;
    b.onclick = function(){ offenBis = i; renderList(); };
    row.appendChild(b);
  });
}

// Leerer Zustand: es gibt (noch) kein Buch für dieses Sprachpaar.
function renderLeer(){
  listEl.innerHTML = '<div class="leer">' + CAPY_SVG +
    '<h2>' + esc(T.leerH) + '</h2><p>' + esc(T.leerP) + '</p>' +
    '<a class="knopf" href="haus.html">' + esc(T.leerZ) + '</a></div>';
  var svg = listEl.querySelector('svg.capy');
  if (svg && typeof window.spkCapyAlive === 'function') { try { window.spkCapyAlive(svg); } catch(e){} }
}

// ── Ein Block wird HTML ────────────────────────────────────────────────
//  na = Muttersprache (DM Sans, kein Audio)
//  z  = Zielsprache (Lora, 🔊) — beginnt sie mit „—", ist es gesprochene Rede → Sprechblase
//  p  = Zielsprach-Prosa (Lora, 🔊), nur Anwendung
//  Der Zieltext steht allein in .zt (keine Kinder) → wortjag.js kann ihn umhüllen.
function lautKnopf(){ return '<button type="button" class="spk" aria-label="' + esc(T.hoeren) + '">' + LAUT_SVG + '</button>'; }
function blockHTML(bl, bruecheZu){
  var zs = esc(BUCH.zielsprache);
  if (bl.na) return '<p class="narr">' + esc(bl.na) + '</p>';
  if (bl.z){
    var dlg = /^\s*—/.test(bl.z);
    var trKnopf = (bl.tr && bruecheZu)
      ? '<button type="button" class="trk" aria-label="' + esc(T.tr) + '" aria-pressed="false">' + esc(uiLang()) + '</button>' : '';
    var gloss = bl.tr ? '<div class="gloss' + (bruecheZu ? ' hid' : '') + '">' + esc(bl.tr) + '</div>' : '';
    // In der Sprechblase ist der einleitende Gedankenstrich doppelt — die Blase zeigt die Rede schon.
    var text = dlg ? bl.z.replace(/^\s*—\s*/, '') : bl.z;
    return '<div class="zl ' + (dlg ? 'dlg' : 'erz') + '"><div class="zrow"><span class="zt" lang="' + zs + '">' + esc(text) + '</span>'
      + '<span class="zbtns">' + trKnopf + lautKnopf() + '</span></div>' + gloss + '</div>';
  }
  if (bl.p) return '<div class="prose"><div class="zrow"><span class="zt" lang="' + zs + '">' + esc(bl.p) + '</span>'
      + '<span class="zbtns">' + lautKnopf() + '</span></div></div>';
  return '';
}

// Wörterbuch für die Wortjagd: gesammelte Wörter bekommen ihre Übersetzung mit.
function jagdDict(){
  var wb = window.spikiuWoerterbuch;
  if (!wb || typeof wb.tr !== 'function' || typeof Proxy === 'undefined') return null;
  return new Proxy({}, { get: function(_, k){ try { return typeof k === 'string' ? (wb.tr(k, BUCH.zielsprache, PROFIL.muttersprache) || '') : ''; } catch(e){ return ''; } } });
}

// ── Lese-Ansicht ───────────────────────────────────────────────────────
function naechsterIdx(i){ return (i + 1 < BUCH.kapitel.length) ? i + 1 : -1; }

function oeffne(i, y){
  var c = BUCH.kapitel[i];
  if (!c || !istOffen(c)) return;
  offenIdx = i;
  zuletztMerken(i);
  var th = c.thema ? themaInfo(c.thema) : null;
  document.getElementById('rk').textContent = einheitWort() + ' ' + c.n + (th ? ' · ' + th.name : (IST_STATION && c.level === 'anwendung' ? ' · ' + T.epilog : ''));
  var rt = document.getElementById('rt'); rt.textContent = c.title; rt.setAttribute('lang', BUCH.zielsprache);

  // Brücke: im Fundament offen; ab Aufbau eingeklappt — ein Tipp auf den
  // Sprach-Knopf (DE/EN/ES) holt sie. So steigt der sichtbare Zielanteil, ohne
  // dass ein Anfänger im Regen steht.
  var zu = (c.level !== 'fundament');
  var hatBruecke = c.body.some(function(bl){ return !!bl.tr; });
  var h = '';
  if (zu && hatBruecke) h += '<div class="hinweis"><div class="h-cap">' + CAPY_SVG + '</div><div>' + esc(T.hinweisZu) + '</div></div>';
  c.body.forEach(function(bl){ h += blockHTML(bl, zu); });
  h += finHTML(i, th);

  var rb = document.getElementById('rbody');
  rb.innerHTML = h;

  [].forEach.call(rb.querySelectorAll('.spk'), function(btn){
    btn.onclick = function(ev){
      ev.stopPropagation();
      var zt = btn.closest('.zrow').querySelector('.zt');
      if (zt) sprichAus(btn, zt.textContent);
    };
  });
  [].forEach.call(rb.querySelectorAll('.trk'), function(btn){
    btn.onclick = function(ev){
      ev.stopPropagation();
      var g = btn.closest('.zl').querySelector('.gloss');
      if (!g) return;
      var an = g.classList.toggle('hid') === false;
      btn.classList.toggle('on', an);
      btn.setAttribute('aria-pressed', an ? 'true' : 'false');
    };
  });
  var wb = rb.querySelector('.fin .weiter[data-i]');
  if (wb) wb.onclick = function(){ oeffne(+wb.getAttribute('data-i'), 0); };

  // Wortjagd: jedes Zielsprachen-Wort antippbar → in „Mein Buch".
  if (window.spikiuWortjag) {
    var zts = [].slice.call(rb.querySelectorAll('.zt'));
    var hint = null;
    if (zts.length && !window.spikiuWortjag.gestartet()) {
      hint = document.createElement('div'); hint.className = 'hinweis';
      hint.innerHTML = '<div class="h-cap">' + CAPY_SVG + '</div><div>' + esc(T.jagd) + '</div>';
      rb.insertBefore(hint, rb.firstChild);
    }
    var dict = jagdDict();
    zts.forEach(function (zt) {
      var o = { quelle:'learnroman', onCollect:function(){ if (hint) { hint.remove(); hint = null; } } };
      if (dict) o.dict = dict;
      window.spikiuWortjag.aktivieren(zt, o);
    });
  }
  [].forEach.call(rb.querySelectorAll('svg.capy'), function(svg){
    if (typeof window.spkCapyAlive === 'function') { try { window.spkCapyAlive(svg); } catch(e){} }
  });

  readerEl.classList.add('open');
  readerEl.setAttribute('aria-hidden', 'false');
  rb.scrollTop = y || 0;
  sitzSpeichern();
}

function finHTML(i, th){
  var c = BUCH.kapitel[i];
  var h = '<div class="fin">';
  var n = naechsterIdx(i);
  h += '<div class="ende">' + esc(n < 0 ? T.buchEnde : (IST_STATION ? T.ende : T.endeK)) + '</div>';
  if (th){
    h += '<div class="szene"><span class="st-ic" style="background:' + th.farbe + '">' + th.emoji + '</span><div class="sz-tx">'
       + '<div class="sz-k">' + esc(T.szeneK(th.name)) + '</div><div class="sz-s">' + esc(T.szeneS) + '</div>'
       + '<a class="knopf" href="gefuehrt.html?thema=' + encodeURIComponent(th.id) + '&amp;von=learnroman">' + esc(T.szeneGo) + '</a>'
       + '</div></div>';
  }
  if (n >= 0){
    var nc = BUCH.kapitel[n];
    if (istOffen(nc)){
      h += '<button type="button" class="knopf primary weiter" data-i="' + n + '"><span>' + esc(T.naechste + ' · ' + einheitWort() + ' ' + nc.n) + '</span>'
         + '<span class="wt" lang="' + esc(BUCH.zielsprache) + '">' + esc(nc.title) + ' ›</span></button>';
    } else {
      var e = ETAPPEN[etIdx(nc.level)] || { nm:'' };
      h += '<div class="lockline">' + esc(einheitWort() + ' ' + nc.n + ' · ' + T.lock(e.nm)) + '</div>';
    }
  }
  return h + '</div>';
}

function schliesse(){
  readerEl.classList.remove('open');
  readerEl.setAttribute('aria-hidden', 'true');
  offenIdx = -1;
  renderList();
}

// Ende erreicht = Station fertig → Sitzung räumen (kein Zombie-Resume).
function amEnde(rb){ return rb.scrollTop + rb.clientHeight >= rb.scrollHeight - 60; }

// ── Start ──────────────────────────────────────────────────────────────
function start(){
  document.documentElement.lang = uiLang();
  document.getElementById('pageTitle').textContent = T.titel;
  document.title = 'Spikiu · ' + T.titel;
  document.getElementById('hausZurueck').onclick = function(){ window.location.href = 'haus.html'; };
  var zurueck = document.getElementById('rback');
  zurueck.setAttribute('aria-label', T.back);
  zurueck.onclick = schliesse;
  document.addEventListener('keydown', function(ev){
    if (ev.key === 'Escape' && readerEl.classList.contains('open')) schliesse();
  });
  var rb = document.getElementById('rbody');
  rb.addEventListener('scroll', function(){
    if (offenIdx < 0) return;
    if (amEnde(rb)) { sitzRaeumen(); return; }
    sitzSpeichern();
  }, { passive:true });

  renderList();
  warmVoice();

  // Wiederkommen: nur bei einer wirklich angefangenen, unfertigen Station.
  var sv = sitzLaden();
  if (BUCH && sv && sv.buch === BUCH.buch && BUCH.kapitel[sv.i] && istOffen(BUCH.kapitel[sv.i]) && (sv.y || 0) > 120
      && window.spikiuSitzung && window.spikiuSitzung.frageWiederkommen) {
    var c = BUCH.kapitel[sv.i];
    window.spikiuSitzung.frageWiederkommen({
      raum: RAUM, ts: sv.ts, wo: einheitWort() + ' ' + c.n + ' · ' + c.title,
      beimWeiter: function(){ oeffne(sv.i, sv.y); },
      beimNeu: function(){ sitzRaeumen(); }
    });
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
else start();
</script>
