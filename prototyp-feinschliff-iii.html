<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spikiu — Feinschliff III (Prototyp)</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,700;1,400;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --white:#fff;--off:#faf9f7;--ink:#1a1816;--mid:#6b6560;--faint:#e8e4df;--warm:#d4cdc6;
  --accent:#2d6a4f;--accent2:#e8f2ed;--accent3:#1a4a38;--gold:#a07830;--capy:#c9956a;
  --trans-bg:#f1eee8;--trans-ink:#857f78;--trans-border:#e3ded5;
  --said-bg:#f6efe2;--said-ink:#8a6d2e;--said-border:#e6d8bb;
  --wrong:#c0392b;--wrong-bg:#fdebe9;
}
body{background:#efece6;color:var(--ink);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:62px 0 0}
.proto-banner{position:fixed;top:0;left:0;right:0;z-index:9999;background:#1a4a38;color:#fff;
  padding:.45rem 1rem;text-align:center;font-size:.68rem;line-height:1.45;border-bottom:2px solid #2d6a4f}
.proto-banner strong{color:#a8d5be}.proto-banner em{color:#c9956a;font-style:normal;font-weight:600}

.phone{width:100%;max-width:400px;height:calc(100vh - 86px);max-height:840px;margin:14px auto;
  background:var(--off);border-radius:30px;box-shadow:0 24px 60px rgba(0,0,0,.22),0 0 0 1px rgba(0,0,0,.05);
  display:flex;flex-direction:column;overflow:hidden}

.bar{display:flex;align-items:center;gap:.6rem;padding:.8rem 1rem .65rem;border-bottom:1px solid var(--faint);background:var(--white)}
.bar-capy{width:32px;height:32px;flex-shrink:0;animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.bar-name{font-family:'Lora',serif;font-weight:700;font-size:1rem}.bar-name em{color:var(--accent);font-style:italic}
.bar-sub{font-size:.6rem;color:var(--mid);margin-left:auto;text-align:right;line-height:1.3}

.rail{display:flex;gap:.3rem;padding:.5rem 1rem;background:var(--white);border-bottom:1px solid var(--faint)}
.rail-step{flex:1;text-align:center;font-size:.5rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--warm);transition:.3s}
.rail-step .dot{display:block;height:3px;border-radius:100px;background:var(--faint);margin-bottom:.25rem;transition:.4s}
.rail-step.active{color:var(--accent)}.rail-step.active .dot{background:var(--accent)}
.rail-step.done{color:var(--gold)}.rail-step.done .dot{background:var(--gold)}

.chat{flex:1;overflow-y:auto;padding:1rem .9rem 1.3rem;display:flex;flex-direction:column;gap:.62rem;scroll-behavior:smooth}
.chat::-webkit-scrollbar{width:0}

.turn{display:flex;flex-direction:column;gap:.26rem;max-width:90%}
.turn.spikiu{align-self:flex-start}.turn.user{align-self:flex-end;align-items:flex-end}
.bubble{position:relative;background:var(--white);border:1px solid var(--faint);border-radius:16px 16px 16px 4px;
  padding:.6rem .85rem;padding-right:2.3rem;font-family:'Lora',serif;font-style:normal;font-size:.95rem;line-height:1.45;color:var(--ink)}
.turn.user .bubble{background:var(--accent);color:#fff;border:none;font-family:'DM Sans',sans-serif;font-size:.9rem;border-radius:16px 16px 4px 16px;padding-right:.85rem}
.speak-btn{position:absolute;top:.5rem;right:.5rem;width:25px;height:25px;border:none;cursor:pointer;
  background:var(--accent2);color:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:.16s}
.speak-btn:hover{background:var(--accent);color:#fff}
.speak-btn.playing{animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(45,106,79,.35)}50%{box-shadow:0 0 0 6px rgba(45,106,79,0)}}
.speak-btn svg{width:12px;height:12px}
.trans{align-self:flex-start;background:var(--trans-bg);border:1px solid var(--trans-border);border-radius:8px;
  padding:.3rem .6rem;font-size:.74rem;line-height:1.35;color:var(--trans-ink);font-style:italic;max-width:96%}

.widget{align-self:stretch;background:var(--white);border:1px solid var(--faint);border-radius:16px;padding:.85rem .8rem;box-shadow:0 6px 18px rgba(0,0,0,.05)}
.w-eyebrow{font-size:.58rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:.6rem;text-align:center}

.hap-card{display:flex;align-items:center;gap:.6rem;border:1.5px solid var(--faint);border-radius:11px;padding:.5rem .65rem;margin-bottom:.38rem}
.hap-card:last-child{margin-bottom:0}
.hap-play{width:28px;height:28px;flex-shrink:0;border:none;cursor:pointer;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center}
.hap-play svg{width:12px;height:12px}
.hap-de{font-family:'Lora',serif;font-weight:700;font-size:.88rem}
.hap-trans{font-size:.72rem;color:var(--mid);font-style:italic}

.hv-speaker{display:block;margin:.1rem auto .6rem;width:52px;height:52px;background:var(--accent);border:none;border-radius:50%;cursor:pointer;color:#fff;box-shadow:0 6px 16px rgba(45,106,79,.3)}
.hv-speaker svg{width:22px;height:22px}
.hv-speaker.playing{animation:pulse 1.1s ease infinite}
.hv-q{text-align:center;font-family:'Lora',serif;font-style:italic;font-size:.86rem;margin-bottom:.6rem}

.hv-opt{display:flex;align-items:center;gap:.5rem;width:100%;background:var(--white);border:1.5px solid var(--faint);cursor:pointer;
  padding:.55rem .65rem;border-radius:11px;margin-bottom:.38rem;font-family:inherit;font-size:.84rem;text-align:left;color:var(--ink)}
.hv-opt:last-of-type{margin-bottom:0}
.hv-opt:hover:not(:disabled){border-color:var(--accent)}
.hv-opt:disabled{cursor:default}
.hv-key{width:20px;height:20px;flex-shrink:0;border-radius:50%;background:var(--off);color:var(--mid);font-weight:700;font-size:.66rem;display:flex;align-items:center;justify-content:center}
.hv-opt-text{flex:1}.hv-mark{font-weight:700;opacity:0}
.hv-opt.correct{background:var(--accent2);border-color:var(--accent);color:var(--accent3);font-weight:600}
.hv-opt.correct .hv-key{background:var(--accent);color:#fff}.hv-opt.correct .hv-mark{opacity:1;color:var(--accent)}
.hv-opt.wrong{background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong)}
.hv-opt.wrong .hv-key{background:var(--wrong);color:#fff}.hv-opt.wrong .hv-mark{opacity:1;color:var(--wrong)}

/* Word-spotting */
.ws-words{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-bottom:.6rem}
.ws-word{background:var(--white);border:1.5px solid var(--faint);border-radius:100px;padding:.42rem .8rem;font-size:.82rem;
  font-weight:600;cursor:pointer;font-family:'Lora',serif;transition:.14s;color:var(--ink)}
.ws-word.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.ws-word.ok{background:var(--accent2);border-color:var(--accent);color:var(--accent3)}
.ws-word.bad{background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong);text-decoration:line-through}
.ws-word.missed{border-color:var(--accent);border-style:dashed;color:var(--accent)}
.hv-feedback{text-align:center;font-size:.74rem;margin-top:.5rem;min-height:1em;font-weight:600}

/* Korrektur-Karte */
.kk{align-self:stretch;background:var(--white);border:1px solid var(--faint);border-radius:16px;padding:.8rem;box-shadow:0 6px 18px rgba(0,0,0,.05)}
.kk-eyebrow{font-size:.58rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:.55rem;text-align:center}
.kk-row{display:grid;grid-template-columns:1fr 1fr;gap:.42rem;margin-bottom:.42rem}.kk-row:last-child{margin-bottom:0}
.kk-head>div{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;text-align:center}
.kk-head .h-said{color:var(--said-ink)}.kk-head .h-better{color:var(--accent)}
.kk-cell{border-radius:9px;padding:.45rem .55rem;font-family:'Lora',serif;font-size:.84rem;line-height:1.3}
.kk-said{background:var(--said-bg);border:1px solid var(--said-border);color:var(--said-ink)}
.kk-better{background:var(--accent2);border:1px solid var(--accent);color:var(--accent3);font-weight:600;position:relative;padding-right:1.8rem}
.kk-better .speak-btn{background:#fff}

.divider{align-self:center;width:36%;height:1px;background:var(--faint);margin:.1rem 0}

.composer{border-top:1px solid var(--faint);background:var(--white);padding:.65rem .8rem;display:flex;flex-direction:column;gap:.42rem}
.comp-label{font-size:.64rem;color:var(--mid);font-weight:600;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:.38rem;justify-content:center}
.chip{background:var(--white);border:1.5px solid var(--accent);color:var(--accent);padding:.42rem .72rem;border-radius:100px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit;transition:.16s}
.chip:hover{background:var(--accent);color:#fff}
.chip.full{flex-basis:100%;text-align:center}
.btn{background:var(--accent);color:#fff;border:none;cursor:pointer;padding:.62rem;border-radius:100px;font-family:inherit;font-size:.85rem;font-weight:600;transition:.16s;width:100%}
.btn:hover{background:var(--accent3)}
.comp-input{display:flex;gap:.4rem}
.comp-input input{flex:1;border:1.5px solid var(--faint);border-radius:100px;padding:.55rem .85rem;font-family:inherit;font-size:.85rem;outline:none}
.comp-input input:focus{border-color:var(--accent)}
.send{width:40px;flex-shrink:0;border:none;background:var(--accent);color:#fff;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.send svg{width:16px;height:16px}
.row2{display:flex;gap:.38rem}.row2 .chip{flex:1;text-align:center}

@media(max-width:430px){body{padding-top:70px}.phone{max-width:100%;height:calc(100vh - 80px);border-radius:0;margin:0;box-shadow:none}}
</style>
</head>
<body>

<div class="proto-banner">
  <strong>🐾 PROTOTYP III — vier Verbesserungen:</strong>
  ① Hörübung variiert (Position zufällig · <em>Wörter-Tippen</em>) ② Rollenspiel am gelernten Wortschatz verankert
  ③ Abschluss = Menü, <em>kein Lob-Gerede</em> ④ max. 2 Blasen, meist 1.
</div>

<div class="phone">
  <div class="bar">
    <svg class="bar-capy" viewBox="0 0 80 80" fill="none">
      <ellipse cx="40" cy="50" rx="28" ry="20" fill="#c9956a"/><ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/>
      <ellipse cx="40" cy="36" rx="10" ry="7" fill="#b8845a"/><ellipse cx="40" cy="33" rx="4" ry="2.5" fill="#8b5e3c"/>
      <circle cx="38" cy="33" r="1" fill="#6b4226"/><circle cx="42" cy="33" r="1" fill="#6b4226"/>
      <circle cx="33" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="47" cy="24" r="3.5" fill="#3d2b1f"/>
      <circle cx="34" cy="23" r="1.2" fill="white"/><circle cx="48" cy="23" r="1.2" fill="white"/>
      <ellipse cx="26" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="54" cy="17" rx="6" ry="5" fill="#b8845a"/>
      <ellipse cx="22" cy="66" rx="7" ry="5" fill="#b8845a"/><ellipse cx="34" cy="68" rx="7" ry="5" fill="#b8845a"/>
      <ellipse cx="46" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="58" cy="66" rx="7" ry="5" fill="#b8845a"/>
      <path d="M36 38 Q40 41 44 38" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </svg>
    <div class="bar-name">Spi<em>k</em>iu</div>
    <div class="bar-sub">Deutsch → Español<br>Anfänger</div>
  </div>
  <div class="rail" id="rail">
    <div class="rail-step" data-s="thema"><span class="dot"></span>Thema</div>
    <div class="rail-step" data-s="woerter"><span class="dot"></span>Wörter</div>
    <div class="rail-step" data-s="hoeren"><span class="dot"></span>Hören</div>
    <div class="rail-step" data-s="sprechen"><span class="dot"></span>Sprechen</div>
    <div class="rail-step" data-s="lektion"><span class="dot"></span>Lektion</div>
  </div>
  <div class="chat" id="chat"></div>
  <div class="composer" id="composer"></div>
</div>

<script>
var SPK='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4.03v8.06A4.5 4.5 0 0016.5 12z"/></svg>';
var PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>';
var SEND='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';
var chat=document.getElementById('chat'),composer=document.getElementById('composer');

function speak(t,btn){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.95;
  var v=(window.speechSynthesis.getVoices()||[]).find(function(x){return x.lang&&x.lang.indexOf('es')===0});if(v)u.voice=v;
  if(btn){btn.classList.add('playing');u.onend=function(){btn.classList.remove('playing')}}window.speechSynthesis.speak(u);}catch(e){}}
function down(){requestAnimationFrame(function(){chat.scrollTop=chat.scrollHeight})}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function setComposer(h){composer.innerHTML=h}function clearC(){composer.innerHTML=''}
function stage(s){var o=['thema','woerter','hoeren','sprechen','lektion'],i=o.indexOf(s);
  document.querySelectorAll('.rail-step').forEach(function(e){var k=o.indexOf(e.dataset.s);e.classList.remove('active','done');
    if(k<i)e.classList.add('done');else if(k===i)e.classList.add('active')})}

// EINE Blase = ein Gedanke (max 2). ziel aufrecht + 🔊 ; trans kursiv
function spikiu(ziel,trans){var t=document.createElement('div');t.className='turn spikiu';
  var b=document.createElement('div');b.className='bubble';b.appendChild(document.createTextNode(ziel));
  var btn=document.createElement('button');btn.className='speak-btn';btn.innerHTML=SPK;btn.onclick=function(){speak(ziel,btn)};
  b.appendChild(btn);t.appendChild(b);
  if(trans){var tr=document.createElement('div');tr.className='trans';tr.textContent=trans;t.appendChild(tr)}
  chat.appendChild(t);down()}
function user(x){var t=document.createElement('div');t.className='turn user';var b=document.createElement('div');b.className='bubble';b.textContent=x;t.appendChild(b);chat.appendChild(t);down()}
function note(x){var n=document.createElement('div');n.className='turn spikiu';n.style.alignSelf='center';n.style.maxWidth='92%';
  n.innerHTML='<div style="text-align:center;font-family:Lora,serif;font-style:italic;font-size:.78rem;color:#6b6560;background:rgba(0,0,0,.03);padding:.45rem .8rem;border-radius:10px">'+x+'</div>';chat.appendChild(n);down()}
function divider(){var d=document.createElement('div');d.className='divider';chat.appendChild(d)}

// ====== START: Themenwahl ======
function start(){chat.innerHTML='';stage('thema');
  spikiu('¡Hola! ¿Qué quieres practicar?','Hallo! Was möchtest du üben?');
  themenMenu();}
function themenMenu(){
  setComposer('<div class="comp-label">Wähl ein Thema</div><div class="chips">'+
    '<button class="chip" onclick="pickThema(\'Taxi\')">🚕 Taxi</button>'+
    '<button class="chip" onclick="pickThema(\'Hotel\')">🏨 Hotel</button>'+
    '<button class="chip" onclick="pickThema(\'Café\')">☕ Café</button>'+
    '<button class="chip" onclick="pickThema(\'Restaurant\')">🍽️ Restaurant</button>'+
  '</div>');
}
function pickThema(th){user(th);stage('woerter');
  spikiu('Muy bien. Vamos a practicar el taxi.','Sehr gut. Üben wir das Taxi.'); // 1 Blase
  setTimeout(haeppchen,450);}

// ====== Wortschatz ======
var WORT=[
  {es:'el taxi',t:'das Taxi'},
  {es:'¿Está libre?',t:'Sind Sie frei?'},
  {es:'al aeropuerto',t:'zum Flughafen'},
  {es:'la maleta',t:'der Koffer'},
  {es:'¿Cuánto es?',t:'Wie viel ist es?'}
];
function haeppchen(){
  var rows=WORT.map(function(w){return '<div class="hap-card"><button class="hap-play" onclick="speak('+JSON.stringify(w.es).replace(/"/g,'&quot;')+',this)">'+PLAY+'</button><div><div class="hap-de">'+w.es+'</div><div class="hap-trans">'+w.t+'</div></div></div>'}).join('');
  var w=document.createElement('div');w.className='widget';w.innerHTML='<div class="w-eyebrow">🎧 Wortschatz mit Audio</div>'+rows;chat.appendChild(w);down();
  setComposer('<button class="btn" onclick="startHoeren()">Verstanden — weiter</button>');
}

// ====== Hörverständnis: TYP A (Position zufällig) + TYP B (Wörter tippen) ======
function startHoeren(){clearC();stage('hoeren');hvA();}

// TYP A — A/B, richtige Option ZUFÄLLIG platziert
function hvA(){
  var opts=shuffle([
    {t:'¿Está libre?',ok:true},
    {t:'¿Está lleno?',ok:false}   // Minimalpaar-Kontrast
  ]);
  var html=opts.map(function(o,i){var k=String.fromCharCode(65+i);
    return '<button class="hv-opt" data-ok="'+o.ok+'" onclick="answerA(this)"><span class="hv-key">'+k+'</span><span class="hv-opt-text">'+o.t+'</span><span class="hv-mark">'+(o.ok?'✓':'✗')+'</span></button>'}).join('');
  var w=document.createElement('div');w.className='widget';w.id='hvA';
  w.innerHTML='<div class="w-eyebrow">🎧 Hören · 1 / 2 · welcher Satz?</div>'+
    '<button class="hv-speaker" onclick="speak(\'¿Está libre?\',this)">'+SPK+'</button>'+
    '<div class="hv-q">Was hörst du?</div>'+html+'<div class="hv-feedback" id="fbA"></div>';
  chat.appendChild(w);down();setTimeout(function(){speak('¿Está libre?',w.querySelector('.hv-speaker'))},350);
}
function answerA(btn){var w=document.getElementById('hvA');
  w.querySelectorAll('.hv-opt').forEach(function(b){b.disabled=true;if(b.dataset.ok==='true')b.classList.add('correct')});
  var fb=document.getElementById('fbA');
  if(btn.dataset.ok==='true'){fb.textContent='¡Muy bien!';fb.style.color='var(--accent)';}
  else{btn.classList.add('wrong');fb.textContent='Fast — die grüne war es.';fb.style.color='var(--wrong)';}
  setComposer('<button class="btn" onclick="hvB()">Weiter</button>');
}

// TYP B — Wörter-Tippen: markiere die Wörter, die du HÖRST (mit Distraktoren)
var WS_AUDIO='Al aeropuerto, por favor.';
var WS_WORDS=[
  {w:'al aeropuerto',ok:true},{w:'por favor',ok:true},
  {w:'a la estación',ok:false},{w:'la maleta',ok:false},{w:'gracias',ok:false}
];
function hvB(){clearC();
  var chips=shuffle(WS_WORDS.slice()).map(function(o,i){
    return '<button class="ws-word" data-ok="'+o.ok+'" id="ws'+i+'" onclick="this.classList.toggle(\'sel\')">'+o.w+'</button>'}).join('');
  var w=document.createElement('div');w.className='widget';w.id='hvB';
  w.innerHTML='<div class="w-eyebrow">🎧 Hören · 2 / 2 · Wörter tippen</div>'+
    '<button class="hv-speaker" onclick="speak('+JSON.stringify(WS_AUDIO).replace(/"/g,'&quot;')+',this)">'+SPK+'</button>'+
    '<div class="hv-q">Welche Wörter hörst du? Tippe sie an.</div>'+
    '<div class="ws-words">'+chips+'</div><div class="hv-feedback" id="fbB"></div>';
  chat.appendChild(w);down();setTimeout(function(){speak(WS_AUDIO,w.querySelector('.hv-speaker'))},350);
  setComposer('<button class="btn" onclick="checkB()">Prüfen</button>');
}
function checkB(){var w=document.getElementById('hvB');var allOk=true;
  w.querySelectorAll('.ws-word').forEach(function(b){var ok=b.dataset.ok==='true',sel=b.classList.contains('sel');
    b.classList.remove('sel');b.style.pointerEvents='none';
    if(ok&&sel)b.classList.add('ok');
    else if(!ok&&sel){b.classList.add('bad');allOk=false}
    else if(ok&&!sel){b.classList.add('missed');allOk=false}});
  var fb=document.getElementById('fbB');
  fb.textContent=allOk?'¡Perfecto, buen oído!':'Casi — grün = richtig, gestrichelt = verpasst.';
  fb.style.color=allOk?'var(--accent)':'var(--gold)';
  setComposer('<button class="btn" onclick="startRoleplay()">Weiter zum Gespräch</button>');
}

// ====== Rollenspiel: am Wortschatz VERANKERT, max 1–2 Blasen ======
var RP=[
  {ziel:'¿Está libre?',trans:'Sind Sie frei?',tips:['Sí, ¿adónde va?','Al aeropuerto, por favor.']},
  {ziel:'¿Al aeropuerto? Muy bien. ¿Tiene maleta?',trans:'Zum Flughafen? Sehr gut. Haben Sie einen Koffer?',tips:['Sí, una maleta.','No, gracias.']},
  {ziel:'Perfecto. Ya llegamos. Son veinte euros.',trans:'Perfekt. Wir sind da. Das macht zwanzig Euro.',tips:['¿Cuánto es?','Aquí tiene. Gracias.']}
];
var rpi=0;
function startRoleplay(){clearC();stage('sprechen');
  // ZWEI Blasen nur hier: Rahmung + erste Replik
  spikiu('Vamos a practicar. Yo soy el taxista, tú el cliente.','Üben wir. Ich bin der Taxifahrer, du der Fahrgast.');
  rpi=0;setTimeout(rpTurn,500);
}
function rpTurn(){var turn=RP[rpi];
  spikiu(turn.ziel,turn.trans); // EINE Blase pro Replik
  var tips=turn.tips.map(function(x){return '<button class="chip" onclick="rpReply('+JSON.stringify(x).replace(/"/g,'&quot;')+')">'+x+'</button>'}).join('');
  setComposer('<div class="comp-label">Antworte mit dem gelernten Wortschatz</div><div class="row2">'+tips+'</div>'+
    '<div class="comp-input"><input id="rf" placeholder="…" onkeydown="if(event.key===\'Enter\')rpSub()"><button class="send" onclick="rpSub()">'+SEND+'</button></div>');
}
function rpSub(){var f=document.getElementById('rf');var t=(f&&f.value.trim())||'';if(!t)return;rpReply(t)}
function rpReply(x){user(x);clearC();rpi++;if(rpi<RP.length){setTimeout(rpTurn,550)}else{setTimeout(endeMenu,500)}}

// ====== Abschluss: KEIN Lob — Korrektur-Karte (knapp) + MENÜ mit 3 Optionen ======
function endeMenu(){stage('lektion');divider();
  // Korrektur-Karte (knapp, nur kommunikativ, ohne Erklärung)
  var kk=document.createElement('div');kk.className='kk';
  kk.innerHTML='<div class="kk-eyebrow">Für nächstes Mal</div><div class="kk-row kk-head"><div class="h-said">Du hast gesagt</div><div class="h-better">Besser</div></div>';
  [['¿Cuánto cuesta?','¿Cuánto es?']].forEach(function(p){
    var r=document.createElement('div');r.className='kk-row';
    var s=document.createElement('div');s.className='kk-cell kk-said';s.textContent=p[0];
    var be=document.createElement('div');be.className='kk-cell kk-better';be.appendChild(document.createTextNode(p[1]));
    var btn=document.createElement('button');btn.className='speak-btn';btn.innerHTML=SPK;btn.onclick=(function(tx){return function(){speak(tx,btn)}})(p[1]);be.appendChild(btn);
    r.appendChild(s);r.appendChild(be);kk.appendChild(r)});
  chat.appendChild(kk);down();
  // KEIN „super gemacht" — nur eine sachliche Frage + Menü
  spikiu('¿Quieres seguir con este tema, otro tema, o terminar?','Weiter mit diesem Thema, ein anderes, oder beenden?');
  setComposer(
    '<button class="chip full" onclick="again()">🔁 Mismo tema — weiter üben</button>'+
    '<button class="chip full" onclick="start()">🔀 Otro tema — neu auswählen</button>'+
    '<button class="chip full" style="background:var(--accent);color:#fff" onclick="zurLektion()">✓ Terminar → Lektion</button>'
  );
}
function again(){user('Mismo tema');rpi=0;clearC();note('Neue Runde, gleicher Wortschatz.');setTimeout(rpTurn,500)}
function zurLektion(){user('Terminar');
  spikiu('Listo. Tu lección está en el panel.','Fertig. Deine Lektion ist im Dashboard.');
  var l=document.createElement('div');l.className='kk';l.style.borderColor='var(--accent)';
  l.innerHTML='<div style="display:flex;align-items:center;gap:.6rem"><div style="font-size:1.5rem">📖</div><div><div style="font-family:Lora,serif;font-weight:700">Im Taxi — el taxi</div><div style="font-size:.72rem;color:var(--accent);font-weight:600">✓ Lektion gespeichert · erklärt das Warum</div></div></div>';
  chat.appendChild(l);down();
  setComposer('<button class="btn" onclick="alert(\'🐾 echt: → dashboard.html#lektionen\')">Zum Dashboard →</button><button class="chip full" style="margin-top:.4rem" onclick="start()">↺ Von vorne</button>');
}
if(window.speechSynthesis){window.speechSynthesis.onvoiceschanged=function(){}}
start();
</script>
</body>
</html>
