<!--
  PROTOTYP „Inhaltsverzeichnis“ (Leo, 21.11.2026, 23:33: „Bau die 2 Prototypen“ — Design des Inhaltsverzeichnisses auf alle Unterräume). Ganzer Ablauf: Inhalt → Lektion → 8 Zimmer → Ende → zurück.
  Grundlage: Ledger 21.11. — Lektionen = Hauptachse, innen 8 feste Zimmer; Rückmeldung deterministisch, null Token.
  Beispielinhalt Lektion 3 „Einkaufen“. Nur Prototyp, Live-System unberührt. Kein Netz außer Schriften, keine KI.

<style>
:root{--ink:#15163a;--bg:#eef7f1;--acc:#ff6b5a;--mustard:#ffd24a;--sage:#c7e89a;--sky:#d3eef6;--muted:#5f7068;--teal:#1f93b0;--ow:2.5px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden}
button{font-family:inherit;color:var(--ink)}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative}
#kopf{flex:0 0 auto}
.stage{flex:1;min-height:0;overflow:auto;padding:1rem 1.1rem 1.8rem}
.fade{animation:fd .35s ease both}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eb{font:700 .62rem/1.25 'DM Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.es{font:italic 500 .92rem/1.25 'Lora',serif;color:rgba(21,22,58,.72)}
.back{flex:0 0 38px;height:38px;border-radius:999px;border:var(--ow) solid var(--ink);background:#fff;font:800 1.2rem 'DM Sans';cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.pulse{animation:pl 1.8s ease-in-out infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(255,107,90,.55)}50%{box-shadow:0 0 0 9px rgba(255,107,90,0)}}
/* Spikiu spricht */
.row{display:flex;gap:.6rem;align-items:flex-start;margin:.2rem 0 .9rem}
.av{flex:0 0 38px;height:38px}
.says{flex:1;min-width:0;background:#fff;border:var(--ow) solid var(--ink);border-radius:18px;box-shadow:3px 4px 0 var(--ink);padding:.6rem .85rem}
.says .z{display:block;font:600 1.22rem/1.25 'Lora',serif}
.says .na{display:block;font:600 .9rem/1.35 'DM Sans'}
.says .z+.na{color:var(--muted);font-size:.82rem;margin-top:.15rem}
.you{display:flex;justify-content:flex-end;margin:.1rem 0 .9rem}
.you span{max-width:86%;background:var(--mustard);border:var(--ow) solid var(--ink);border-radius:18px;box-shadow:3px 4px 0 var(--ink);padding:.5rem .85rem;font:600 1.1rem/1.25 'Lora',serif}
.hinweis-l{font:600 .84rem/1.35 'DM Sans';color:var(--muted);margin:0 0 .9rem}
.beispiel{font:700 .6rem/1.3 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:.7rem}
.sanft{font:600 .86rem/1.35 'DM Sans';min-height:1.2em;margin-top:.5rem;text-align:center}
.buch{font:700 .88rem 'DM Sans';text-align:center;margin:.8rem 0 0}

.wkarten{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.wk{min-height:118px;border:var(--ow) solid var(--ink);border-radius:16px;background:#fff;box-shadow:3px 4px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;padding:.5rem;text-align:center}
.wk .em{font-size:1.8rem}
.wk .z{font:600 1.1rem/1.2 'Lora',serif}
.wk .na{font:700 .85rem 'DM Sans';color:var(--teal);display:none}
.wk.f{background:#f3fbe9}
.wk.f .na{display:block}
/* Hören */
.dialog{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.8rem}
.zeile{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:.5rem .75rem;max-width:88%}
.zeile.du{align-self:flex-end;background:#fff7dc}
.zeile .wer{display:block;font:700 .58rem/1 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:.2rem}
.zeile .z{display:block;font:600 1.05rem/1.25 'Lora',serif}
.zeile .na{display:block;font:600 .78rem 'DM Sans';color:var(--muted)}
.play{display:block;margin:.2rem auto 0;border:var(--ow) solid var(--ink);border-radius:999px;background:#fff;padding:.6rem 1.1rem;font:800 .95rem 'DM Sans';cursor:pointer;box-shadow:3px 3px 0 var(--ink)}

.frage{margin-top:.6rem;display:flex;flex-direction:column;gap:.5rem}
.frage .q{font:800 1rem/1.3 'DM Sans';margin-bottom:.2rem}

.opt{border:var(--ow) solid var(--ink);border-radius:14px;background:#fff;padding:.65rem .9rem;font:700 1rem/1.25 'DM Sans';text-align:left;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.opt.ok{background:var(--sage)}
.opt.no{background:#ffb27a;opacity:.6}
.chips{display:flex;flex-direction:column;gap:.5rem;align-items:flex-end;margin:.2rem 0 .9rem}
.chip{max-width:90%;text-align:right;background:#fff;border:var(--ow) solid var(--ink);border-radius:16px;padding:.5rem .8rem;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.chip .z{display:block;font:600 1.05rem/1.25 'Lora',serif}
.chip .na{display:block;font:600 .74rem/1.2 'DM Sans';color:var(--muted)}
/* Selbst sprechen */
.eingabe{margin:0 0 1rem}
.eingabe .auf{font:700 .9rem/1.35 'DM Sans';margin-bottom:.5rem}
.eingabe input{width:100%;border:var(--ow) solid var(--ink);border-radius:14px;padding:.7rem .85rem;font:600 1.1rem 'Lora',serif;background:#fff;color:var(--ink)}

.spiegel{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:.6rem .8rem}

.spiegel .gut{font:700 .85rem 'DM Sans';margin-top:.3rem;color:var(--teal)}
/* Aussprache */
.silben-box{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:.7rem;margin-bottom:.8rem;text-align:center}

.silben{display:flex;justify-content:center;gap:.4rem}

.silbe.no{background:#ffb27a;opacity:.6}

.regel{background:#fff;border:var(--ow) solid var(--ink);border-radius:16px;box-shadow:3px 4px 0 var(--ink);padding:.8rem .9rem;margin-bottom:.6rem}
.regel .eb{color:var(--acc);margin-bottom:.4rem}
.regel p{font:500 .95rem/1.4 'DM Sans';margin-bottom:.4rem}
.regel table{border-collapse:collapse;width:100%}
.regel td{padding:.25rem .2rem;font:600 1rem 'Lora',serif;border-top:1px solid rgba(21,22,58,.12)}

.lesetext{background:#fff;border:var(--ow) solid var(--ink);border-radius:16px;box-shadow:3px 4px 0 var(--ink);padding:.9rem 1rem;font:500 1.2rem/1.6 'Lora',serif}

.gm button.ok{background:var(--sage);box-shadow:none;transform:translate(2px,3px)}
.gm button.no{background:#ffb27a}

.weiter:active,.opt:active,.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

.bnav{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-around;padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));background:#fff;border-top:2.5px solid var(--ink)}
.tab{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.12rem;color:#5f7068;font:700 .68rem 'DM Sans'}

.tab.center .ball svg{width:44px;height:44px}
.tab.center .lbl{transform:translateY(-10px);color:var(--ink)}
.pop{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;font:600 .88rem/1.35 'DM Sans';padding:.55rem .9rem;border-radius:12px;display:none;max-width:86%;text-align:center}
.pop.on{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


body{background:#efe9dc}
.papier{background:#fffdf7;border:var(--ow) solid var(--ink);border-radius:6px 18px 18px 6px;box-shadow:4px 5px 0 var(--ink);padding:1.1rem 1rem 1rem 1.6rem;position:relative}
.papier:before{content:'';position:absolute;left:12px;top:0;bottom:0;border-left:2px solid #f3c1b9}

.ix{display:flex;align-items:baseline;gap:.55rem;width:100%;background:none;border:none;text-align:left;cursor:pointer;padding:.45rem .3rem;border-radius:8px}
.ix:active{background:rgba(255,210,74,.35)}
.ix .nr{flex:0 0 auto;min-width:1.7rem;font:900 1.2rem/1 'Archivo Black',sans-serif}
.ix .tx{flex:0 1 auto;min-width:0}
.ix .tt{font:800 1rem/1.2 'DM Sans'}

.ix .em{font-size:1rem;margin-right:.2rem}
.kp{display:flex;align-items:center;gap:.7rem;padding:calc(.6rem + env(safe-area-inset-top)) .9rem .6rem;background:#fffdf7;border-bottom:var(--ow) solid var(--ink)}
.kp .t{flex:1;min-width:0}

.zimmer-box:before{content:'';position:absolute;left:11px;top:0;bottom:0;border-left:2px solid #f3c1b9}
.weiter{background:var(--mustard);color:var(--ink)}
.weiter .nr{font:900 .95rem 'Archivo Black'}
.los{display:block;width:100%;margin:.9rem 0 .2rem;border:var(--ow) solid var(--ink);border-radius:999px;background:var(--mustard);padding:.75rem 1rem;font:800 1rem 'DM Sans';cursor:pointer;box-shadow:3px 4px 0 var(--ink)}

.frei-li .tt{font-weight:800}
.fussnote{font:600 .8rem/1.35 'DM Sans';color:var(--muted);margin-top:.8rem}

</style>

function leere(){var s=stage();s.innerHTML='';s.scrollTop=0;var w=mk('div','fade');s.appendChild(w);return w;}
function unten(){var s=stage();setTimeout(function(){s.scrollTo({top:s.scrollHeight,behavior:RED?'auto':'smooth'});},40);}
function kopf(html){document.getElementById('kopf').innerHTML=html;capys(document.getElementById('kopf'));}

function zeigeHome(){AKT=null;kopf(T.kopfHome());var w=leere();T.home(w);capys(w);}
function zeigeLektion(l){AKT={l:l};kopf(T.kopfLektion(l));var w=leere();T.lektion(w,l);capys(w);}
function zeigeZimmer(l,z){AKT={l:l,z:z};kopf(T.kopfZimmer(l,z));var w=leere();
 var box=mk('div','zimmer-box');w.appendChild(box);
 if(l!==2)box.appendChild(mk('div','beispiel','Beispielinhalt aus Lektion 3 · Einkaufen'));
 var fuss=mk('div','fuss');w.appendChild(fuss);
 function fertig(){markiere(l,z);fuss.innerHTML='';
  var b=mk('button','weiter');
  if(z<ZI.length-1){b.innerHTML=T.weiterText(l,z+1);b.onclick=function(){zeigeZimmer(l,z+1);};}
  else{b.innerHTML=T.endeText(l);b.onclick=function(){zeigeEnde(l);};}
  fuss.appendChild(b);capys(fuss);unten();}
 RAUM[ZI[z].k](box,fertig);capys(w);}
function zeigeEnde(l){AKT={l:l};kopf(T.kopfLektion(l));var w=leere();T.ende(w,l);capys(w);}
function zurueck(){if(AKT&&AKT.z!=null)zeigeLektion(AKT.l);else zeigeHome();}

 var g=mk('div','wkarten');b.appendChild(g);
 C.woerter.forEach(function(w){var k=mk('button','wk','<span class="em">'+w.em+'</span><span class="z">'+w.z+'</span><span class="na">'+w.na+'</span>');

 zug();};
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[¿?¡!.,]/g,' ').split(/\s+/).filter(Boolean);}
RAUM.selbst=function(b,fertig){var i=0;b.insertAdjacentHTML('beforeend','<div class="hinweis-l">Dieselbe Szene — jetzt sagst du es selbst. Spikiu vergleicht ohne KI mit den Mustersätzen.</div>');
 function zug(){var A=C.selbst[i];b.insertAdjacentHTML('beforeend',sagt('',A.sp));capys(b);
  var f=mk('div','eingabe','<div class="auf">✍️ '+A.auf+'</div><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Schreib deinen Satz …"><button class="pruef">Sagen</button>');b.appendChild(f);unten();
  var inp=f.querySelector('input');
  f.querySelector('.pruef').onclick=function(){var v=inp.value.trim();if(!v){inp.focus();return;}
   var ich=norm(v),best=null;A.soll.forEach(function(s){var w=norm(s),tr=w.filter(function(x){return ich.indexOf(x)>-1;}).length/w.length;if(!best||tr>best.tr)best={s:s,w:w,tr:tr};});
   var spiegel=best.w.map(function(x){return '<span class="'+(ich.indexOf(x)>-1?'da':'fehlt')+'">'+x+'</span>';}).join(' ');
   f.innerHTML='<div class="auf">✍️ '+A.auf+'</div><div class="you"><span>'+esc(v)+'</span></div><div class="spiegel"><div class="eb">Spiegel</div><div class="wort">'+spiegel+'</div><div class="muster">Mustersatz: <b>'+best.s+'</b></div>'+(best.tr===1?'<div class="gut">Alles drin. ¡Muy bien!</div>':'<div class="gut">Grün ist schon da. Der Mustersatz zeigt den Rest.</div>')+'</div>';
   i++;unten();setTimeout(function(){if(i<C.selbst.length)zug();else fertig();},RED?0:700);};
  inp.onkeydown=function(e){if(e.key==='Enter')f.querySelector('.pruef').click();};}
 zug();};
RAUM.aussprache=function(b,fertig){var i=0;b.insertAdjacentHTML('beforeend',sagt('Jedes Wort hat eine starke Silbe. Tipp sie an.'));
 function wort(){var W=C.aussprache[i];var f=mk('div','silben-box','<div class="na">'+W.na+'</div><div class="silben"></div><div class="sanft"></div>');b.appendChild(f);
  W.w.forEach(function(sl,k){var x=mk('button','silbe',sl);x.onclick=function(){if(f.dataset.ok)return;
   if(k===W.s){x.classList.add('ok');f.dataset.ok=1;f.querySelector('.sanft').textContent='¡Eso es! '+W.w.map(function(q,j){return j===W.s?q.toUpperCase():q;}).join('-');i++;setTimeout(function(){if(i<C.aussprache.length)wort();else fertig();},RED?0:700);}
   else{x.classList.add('no');f.querySelector('.sanft').textContent='Hör noch einmal hin …';}};f.querySelector('.silben').appendChild(x);});unten();}
 wort();};

 b.insertAdjacentHTML('beforeend','<div class="regel"><div class="eb">'+G.eb+'</div><p>'+G.regel+'</p><table>'+G.tab.map(function(r){return '<tr><td>'+r[0]+'</td><td>→</td><td><b>'+r[1]+'</b></td></tr>';}).join('')+'</table></div>');
 var i=0;function ueb(){var U=G.ueb[i];var f=mk('div','frage','<div class="q z">'+U.q+'</div>');b.appendChild(f);var s=mk('div','sanft');

 ueb();};
RAUM.lesen=function(b,fertig){var L=C.lesen;b.insertAdjacentHTML('beforeend',sagt('Ein kurzes Stück. Tipp unterstrichene Wörter an, wenn du magst.'));
 var t=mk('div','lesetext');L.t.forEach(function(p){if(p[1]){var w=mk('span','w',p[0]);w.onclick=function(){w.classList.add('gesammelt');toast(p[0]+' = '+p[1]+' · liegt in deinem Buch');};t.appendChild(w);}else t.appendChild(document.createTextNode(p[0]));});b.appendChild(t);

RAUM.spiel=function(b,fertig){var W=C.woerter;b.insertAdjacentHTML('beforeend',sagt('Gemelos: Finde die Paare. Links Spanisch, rechts Deutsch.'));
 var g=mk('div','gm');b.appendChild(g);var R=mische(W.map(function(w,i){return{i:i,t:w.na};})),sl=null,sr=null,n=0;
 function knopf(o,seite){var x=mk('button',seite==='l'?'z':'',o.t);x.onclick=function(){if(x.classList.contains('ok'))return;
  if(seite==='l'){if(sl)sl.x.classList.remove('sel');sl={o:o,x:x};}else{if(sr)sr.x.classList.remove('sel');sr={o:o,x:x};}x.classList.add('sel');
  if(sl&&sr){var a=sl,c=sr;sl=sr=null;if(a.o.i===c.o.i){a.x.classList.add('ok');c.x.classList.add('ok');a.x.classList.remove('sel');c.x.classList.remove('sel');n++;if(n===W.length)fertig();}
   else{a.x.classList.add('no');c.x.classList.add('no');setTimeout(function(){a.x.classList.remove('no','sel');c.x.classList.remove('no','sel');},450);}}};return x;}
 for(var i=0;i<W.length;i++){g.appendChild(knopf({i:i,t:W[i].z},'l'));g.appendChild(knopf(R[i],'r'));}};


var T={
 kopfHome:function(){return '<div class="kp"><div class="t"><div class="eb">Spikiu · Spanisch</div><b>Inhalt</b></div><span class="sz">§</span></div>';},
 home:function(w){var j=jetzt();
  var h=sagt('Hier ist dein Inhaltsverzeichnis. Die markierte Lektion ist die nächste.')+'<div class="papier"><h2>Inhalt</h2><div class="eb">Erste Stufe · 🌱 Samen</div>';
  LEK.forEach(function(L,i){var st=lekFertig(i)?'ok':(i===j?'jetzt':'zu');h+='<button class="ix '+st+'" data-i="'+i+'"><span class="nr">'+(i+1)+'</span><span class="tx"><span class="tt">'+L.t+'</span><br><span class="es">'+L.es+'</span></span><span class="dots"></span><span class="st">'+(st==='ok'?'✓':(st==='jetzt'?'jetzt':''))+'</span></button>';});
  h+='<div class="ixh">🌿 Stamm · zweite Stufe</div><div class="fussnote">Dieselben zehn Orte, eine Stufe tiefer.</div></div>';
  w.innerHTML=h;w.querySelectorAll('.ix').forEach(function(b){b.onclick=function(){zeigeLektion(+b.dataset.i);};});},
 kopfLektion:function(l){return '<div class="kp"><button class="back" onclick="zeigeHome()">‹</button><div class="t"><div class="eb">Lektion '+(l+1)+'</div><b>'+LEK[l].em+' '+LEK[l].t+'</b></div><span class="sz">'+(l+1)+'</span></div>';},
 lektion:function(w,l){var n=naechstesZimmer(l),fertig=lekFertig(l);
  var h=sagt(fertig?'Diese Lektion hast du schon gemacht. Jedes Kapitel bleibt offen.':'Jede Lektion hat dieselben acht Kapitel, in derselben Reihenfolge.')+'<div class="papier"><h2>'+LEK[l].t+'</h2><div class="es" style="margin-bottom:.8rem">'+LEK[l].es+'</div>';
  ZI.forEach(function(Z,z){var f=zimmerFertig(l,z),st=f?'ok':(z===n&&!fertig?'jetzt':'zu');
   h+='<button class="ix '+st+'" data-z="'+z+'"><span class="nr" style="font-size:.95rem">'+(l+1)+'.'+(z+1)+'</span><span class="tx"><span class="tt"><span class="em">'+Z.em+'</span>'+Z.t+'</span><br><span class="es" style="font-style:normal;font-family:DM Sans;font-size:.78rem;font-weight:600">'+Z.s+'</span></span><span class="dots"></span><span class="st">'+(f?'✓':(st==='jetzt'?'→':''))+'</span></button>';});
  h+='</div><button class="los">'+(fertig?'Noch einmal von vorn':(n===0?'Lektion beginnen: '+(l+1)+'.1 Wörter':'Weiter mit '+(l+1)+'.'+(n+1)+' '+ZI[n].t))+'</button>';

  w.querySelector('.los').onclick=function(){zeigeZimmer(l,fertig?0:n);};},
 kopfZimmer:function(l,z){return '<div class="kp"><button class="back" onclick="zeigeLektion('+l+')">‹</button><div class="t"><div class="eb">Lektion '+(l+1)+' · Kapitel '+(l+1)+'.'+(z+1)+'</div><b>'+ZI[z].em+' '+ZI[z].t+'</b></div><span class="sz">'+(l+1)+'.'+(z+1)+'</span></div>';},

 endeText:function(l){return 'Lektion '+(l+1)+' abschließen ›';},
 ende:function(w,l){var nx=l+1<LEK.length?l+1:null;
