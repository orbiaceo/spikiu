*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:#eef7f1;color:#15163a;font-family:'DM Sans',system-ui,sans-serif;min-height:100dvh;padding:1rem .8rem 2rem}
.wrap{max-width:1500px;margin:0 auto}

.sub{text-align:center;color:#5f7068;font-weight:600;font-size:.9rem;margin:0 0 .9rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center;margin-bottom:.9rem}
.chip{font:800 .88rem/1 'DM Sans';padding:.6rem .85rem;border-radius:999px;border:2.5px solid #15163a;background:#fff;color:#15163a;cursor:pointer;box-shadow:2px 3px 0 #15163a}
.chip.on{background:#ff6b5a;color:#fff}
.chip.alt{background:#fff;border-style:dashed}
.chip.alt.on{background:#15163a;color:#fff;border-style:solid}
.chip:active{transform:translate(2px,2px);box-shadow:0 1px 0 #15163a}
.stagebox{display:flex;justify-content:center;align-items:flex-start;min-height:200px}
.frame{position:relative;border:2.5px solid #15163a;border-radius:18px;background:#15163a;box-shadow:5px 6px 0 rgba(21,22,58,.25);overflow:hidden;flex:0 0 auto}
.frame iframe{border:0;transform-origin:0 0;display:block;background:#fff}
.dim{text-align:center;font:500 .72rem/1 'DM Mono',monospace;letter-spacing:.08em;color:#5f7068;margin:.55rem 0 .2rem}
.note{max-width:620px;margin:.8rem auto 0;background:#fff;border:2.5px solid #15163a;border-radius:18px;box-shadow:3px 4px 0 #15163a;padding:.9rem 1rem}
.note .eb{font:700 .62rem/1 'DM Mono',monospace;letter-spacing:.2em;color:#ff6b5a;text-transform:uppercase;margin-bottom:.45rem}
.note h2{font:800 1.08rem/1.25 'DM Sans';margin:0 0 .35rem}
.note p{margin:.25rem 0;font-size:.95rem;line-height:1.45}
.note ul{margin:.4rem 0 0;padding-left:1.1rem;font-size:.92rem;line-height:1.45}
.live-hint{display:none;text-align:center;font-size:.85rem;color:#5f7068;font-weight:600;margin:-.4rem 0 .6rem}
