  <circle cx="28" cy="23.5" r="3.2" fill="#EA5A47" stroke="#000" stroke-width="1.5"/>
  <path fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" d="M33 21l4-9M36 11l2 1"/>
