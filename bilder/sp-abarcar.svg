<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <!-- Spikiu-eigenes Bild im OpenMoji-Stil: „Quien mucho abarca, poco aprieta" —
       jemand umarmt einen zu hohen Kistenstapel, die oberen Kisten kippen schon (Leo, 28.09.) -->
  <g stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- Beine -->
    <path fill="#3F3F3F" d="M20 56l-4 12h6l4-10zM30 56l2 12h6l-2-12z"/>
    <!-- Körper -->
    <path fill="#61B2E4" d="M17 40c0-5 4-8 10-8s10 3 10 8v17H17z"/>
    <!-- Kistenstapel (unten gerade) -->
    <path fill="#D8B27A" d="M30 50h24v14H30z"/>
    <path fill="#C99A5B" d="M31 37h22v13H31z"/>
    <!-- obere Kisten, kippend -->
    <path fill="#D8B27A" d="M34 24l19-3 2 13-19 3z"/>
    <path fill="#C99A5B" d="M43 9l15 4-3 12-15-4z"/>
    <!-- Klebeband -->
    <path fill="none" d="M42 50v14M42 37v13M44.5 22.5l2 13M51 11l-3 12"/>
    <!-- Kopf -->
    <circle cx="25" cy="23" r="8" fill="#FCEA2B"/>
    <path fill="#6A462F" d="M17.5 21c0-6 4-9 8-9s7 2 7.5 6c-3-1-5 0-7 2-2-1-5-1-8.5 1z"/>
    <!-- Arme um den Stapel -->
    <path fill="none" stroke-width="4.5" stroke="#000" d="M22 38c6 1 12 1 18-1M22 46c8 1 16 2 24 1"/>
    <path fill="none" stroke-width="2.6" stroke="#61B2E4" d="M22 38c6 1 12 1 18-1M22 46c8 1 16 2 24 1"/>
    <!-- Hände -->
    <circle cx="41" cy="37" r="2.4" fill="#FCEA2B"/>
    <circle cx="47" cy="47" r="2.4" fill="#FCEA2B"/>
  </g>
  <!-- Gesicht: angestrengt -->
  <g fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round">
    <path d="M26 22l3 1.5M29 26.5c-1.5-1-3-1-4.5 0"/>
  </g>
  <!-- Schweißtropfen + Wackelstriche -->
  <path fill="#92D3F5" stroke="#000" stroke-width="1.4" stroke-linejoin="round" d="M15 15c-2 3-2.5 4-2.5 5a2.5 2.5 0 0 0 5 0c0-1-.5-2-2.5-5z"/>
  <g fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round">
    <path d="M61 18l4-2M62 24l4 0M60 8l3-3"/>
  </g>
</svg>
