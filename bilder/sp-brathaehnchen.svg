<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <!-- Spikiu-eigenes Icon im OpenMoji-Stil: ganzes Brathähnchen auf dem Teller, damit „el pollo" nicht mit „la carne" verwechselt wird (Leo, 14.11.) -->
  <g stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- Teller -->
    <ellipse cx="36" cy="57" rx="31" ry="6" fill="#fff"/>
    <!-- hinterer Schenkel -->
    <g transform="translate(46 33) rotate(20)">
      <path fill="#fff" d="M-1.5-9v-6"/>
      <path fill="#fff" d="M-1.5-15h3"/>
      <circle cx="-2.2" cy="-16.5" r="2.3" fill="#fff"/><circle cx="2.2" cy="-16.5" r="2.3" fill="#fff"/>
      <path fill="#fff" d="M-1.6-15.5h3.2v7h-3.2z"/>
      <ellipse cx="0" cy="0" rx="6.5" ry="9.5" fill="#D9822B"/>
    </g>
    <!-- Rumpf -->
    <path fill="#E8A045" d="M8 47c0-11 9-19 22-19c12 0 24 5 26 14c1.6 7-4 13-14 13H18c-6 0-10-3-10-8z"/>
    <!-- vorderer Schenkel -->
    <g transform="translate(53 39) rotate(48)">
      <circle cx="-2.2" cy="-17" r="2.3" fill="#fff"/><circle cx="2.2" cy="-17" r="2.3" fill="#fff"/>
      <path fill="#fff" d="M-1.6-16h3.2v7h-3.2z"/>
      <ellipse cx="0" cy="0" rx="7" ry="10" fill="#D9822B"/>
    </g>
  </g>
  <!-- Bräune: Glanzlinien auf der Haut -->
  <g fill="none" stroke="#000" stroke-width="1.3" stroke-linecap="round">
    <path d="M15 42c3-4 8-7 13-8M22 48c4-3 9-4 14-4"/>
  </g>
  <path fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".7" d="M14 38c3-3 7-5 11-6"/>
</svg>
