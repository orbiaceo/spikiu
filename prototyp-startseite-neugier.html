<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spikiu · Startseite</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: ruhig, warm, wenig Worte — Spikiu flüstert statt zu werben
   IDEA: die Startseite ist schon das Café — man bestellt, bevor man liest
   PICTURE: Café-Szene aus Lektion 1 mit Spikiu als Kellner, live antippbar
   COLOUR and TYPE: Pastell Minze (Minzgrund, Himmel, Salbei, Senf), Nunito
   LAYOUT: eine Spalte; Szene im ersten Bildschirm, Preise darunter, aufklappbar */
:root{--minz:#eef7f1;--ink:#15163a;--muted:#5f7068;--sky:#e1f3f8;--sage:#d6efc0;--mustard:#ffe7a3;--cyan:#1f93b0;--line:#dcebe1;--ok:#c7e89a;--shadow:0 6px 18px rgba(21,22,58,.07)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--minz);color:var(--ink);font:16px/1.5 'Nunito',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
.wrap{max-width:460px;margin:0 auto;padding:0 18px 40px}
nav{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.logo{font-weight:900;font-size:1.15rem;letter-spacing:-.01em}.logo em{color:var(--cyan)}
.langs{display:flex;gap:5px}
.langs button{font:800 .72rem 'Nunito',system-ui,sans-serif;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 9px;min-height:32px;cursor:pointer}
.langs button.on{background:var(--sky)}
/* Der Lärm leise, die Ruhe groß (Leo, 25.11.: „más estético“) */
.pre{margin:26px 0 2px;font-weight:600;font-size:1.05rem;color:var(--muted);letter-spacing:.005em}
h1{font-size:clamp(1.85rem,8.4vw,2.35rem);line-height:1.08;font-weight:800;letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
h1 em{font-style:normal;color:var(--cyan)}
.lead{color:var(--muted);font-weight:600;margin:0 0 20px;font-size:.98rem;text-wrap:balance;max-width:30ch}
/* Szene */
.scene{background:#fff;border:1.5px solid var(--line);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}
.pic{position:relative;background:#fbf6ee;aspect-ratio:16/9;overflow:hidden}
.pic img{position:absolute;inset:-12% 0 auto;width:100%;height:auto}
.tag{position:absolute;left:12px;top:12px;background:#fff;border:1.5px solid var(--line);border-radius:999px;font:800 .7rem 'Nunito',system-ui,sans-serif;padding:4px 10px}
.talk{padding:14px 14px 16px}
.row{display:flex;gap:10px;align-items:flex-end;margin-bottom:10px}
.capy{width:46px;height:46px;flex:none;border-radius:50%;background:var(--mustard);border:1.5px solid var(--line);display:grid;place-items:center}
.capy svg{width:40px;height:40px}
.bub{background:var(--sky);border-radius:18px 18px 18px 6px;padding:9px 13px;font-weight:800;font-size:1.08rem;position:relative}
.bub small{display:block;font-weight:600;font-size:.8rem;color:var(--muted)}
.say{border:0;background:transparent;font-size:1rem;cursor:pointer;padding:0 0 0 6px;vertical-align:middle}
.me{display:flex;justify-content:flex-end;margin:0 0 10px}
.me span{background:var(--ok);border-radius:18px 18px 6px 18px;padding:9px 13px;font-weight:800}
.opts{display:grid;gap:8px}
.opts button{font:800 1rem 'Nunito',system-ui,sans-serif;text-align:left;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;min-height:48px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s}
.opts button:active{transform:translate(1px,1px)}
.opts button.no{opacity:.4}
.hint{font-size:.85rem;color:var(--muted);font-weight:700;margin:8px 2px 0;min-height:1.2em}
.done{display:none;text-align:center;padding:4px 4px 2px}
.done b{display:block;font-size:1.15rem;font-weight:900;margin-bottom:2px}
.done p{margin:0 0 12px;color:var(--muted);font-weight:600}
.btn{display:block;text-align:center;text-decoration:none;font:800 1.02rem 'Nunito',system-ui,sans-serif;color:var(--ink);background:#c9ecd9;border:1.5px solid var(--line);border-radius:999px;padding:14px 18px;box-shadow:var(--shadow)}
.skip{display:block;text-align:center;margin:12px 0 0;font-weight:700;font-size:.9rem;color:var(--cyan);text-decoration:none}
/* Blick in eine Lektion */
.peek{margin:26px 0 0}
.peek h2,.plans h2{font-size:1.2rem;font-weight:900;margin:0 0 4px;letter-spacing:-.01em}
.peek p{margin:0 0 12px;color:var(--muted);font-weight:600;font-size:.95rem}
.kaps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kap{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:10px 4px 8px;text-align:center;box-shadow:var(--shadow)}
.kap i{display:grid;place-items:center;width:38px;height:38px;margin:0 auto 4px;border-radius:12px;font-style:normal;font-size:1.25rem}
.kap span{font-size:.72rem;font-weight:800;line-height:1.15;display:block}
.myth{margin:24px 0 0;background:var(--mustard);border-radius:22px;padding:16px 18px;font-weight:700}
.myth b{font-weight:900}
/* Preise */
.plans{margin:28px 0 0}
.plan{background:#fff;border:1.5px solid var(--line);border-radius:22px;box-shadow:var(--shadow);margin:0 0 10px;overflow:hidden}
.plan summary{list-style:none;display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:14px 16px;cursor:pointer}
.plan summary::-webkit-details-marker{display:none}
.plan .nm{font-weight:900;font-size:1.05rem}
.plan .pr{font-weight:900;font-size:1.05rem;text-align:right;white-space:nowrap}
.plan .ln{color:var(--muted);font-weight:600;font-size:.88rem}
.plan .per{color:var(--muted);font-weight:700;font-size:.78rem;text-align:right;white-space:nowrap}
.plan ul{margin:0;padding:0 16px 14px 34px;font-weight:600;font-size:.92rem}
.plan li{margin:3px 0}.plan li b{font-weight:900}
.plan .more{grid-column:1/-1;font-size:.8rem;font-weight:800;color:var(--cyan)}
.plan[open] .more{display:none}
.p0{border-left:6px solid var(--sky)}.p1{border-left:6px solid var(--sage)}.p2{border-left:6px solid var(--mustard)}
.soon{display:inline-block;font:800 .65rem 'Nunito',system-ui,sans-serif;background:var(--mustard);border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:middle}
.final{margin:30px 0 0;text-align:center}
.final h2{font-size:1.5rem;font-weight:900;line-height:1.15;margin:0 0 4px}
.final p{color:var(--muted);font-weight:700;margin:0 0 14px;font-size:.92rem}
footer{text-align:center;color:var(--muted);font-size:.8rem;font-weight:700;margin-top:28px}
.note{font-size:.75rem;color:var(--muted);text-align:center;margin:6px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav><div class="logo">Spi<em>k</em>iu</div><div class="langs" id="langs"></div></nav>

  <p class="pre" id="pre"></p>
  <h1 id="h1"></h1>
  <p class="lead" id="lead"></p>

  <section class="scene" aria-live="polite">
    <div class="pic"><img src="bilder/spikiu-szene-cafe.webp" alt=""><span class="tag" id="tag"></span></div>

      <div id="chat"></div>
      <div class="opts" id="opts"></div>
      <div class="hint" id="hint"></div>

  <a class="skip" href="#plans" id="skip"></a>

  <section class="peek">

    <p id="peekP"></p>

  <div class="myth" id="myth"></div>

    <h2 id="finH"></h2>
    <p id="finP"></p>

  </section>
  <footer>© 2026 Spikiu · spikiu.com</footer>
</div>

{

const KAP_EM=['🃏','🎧','🎭','🗣️','🥁','📘','📖','🪅'],KAP_BG=['#ffd0b0','#d3eef6','#ffe7a3','#c7e89a','#ffe08a','#cdbdf2','#f7bcd8','#ffb27a'];

 note:'Ακύρωση οποτεδήποτε · χωρίς κάρτα για το «Δωρεάν»',

};
const LANGS=[['de','DE'],['es','ES'],['en','EN'],['el','ΕΛ']];
const $=id=>document.getElementById(id);
let L;try{L=localStorage.getItem('spikiu_lang')}catch(e){}
if(!T[L]){const n=(navigator.language||'de').slice(0,2);L=T[n]?n:'de'}
let step=0,touched=false;

function speak(txt){
  if(!touched||!window.speechSynthesis)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=sz().voice;u.rate=.92;speechSynthesis.speak(u)}catch(e){}
}
const sz=()=>L==='es'?SZENE.de:SZENE.es;
function bubble(txt,i){
  const g=L==='es'?GLOSS.es:GLOSS[L];
  return '<div class="row"><div class="capy">'+CAPY+'</div><div class="bub">'+txt+'<button class="say" data-t="'+txt+'" aria-label="🔊">🔊</button><small>'+g[i]+'</small></div></div>';
}
function render(){
  const t=T[L];document.documentElement.lang=L;
  $('langs').innerHTML=LANGS.map(([k,v])=>'<button data-l="'+k+'" class="'+(k===L?'on':'')+'">'+v+'</button>').join('');
  for(const k of ['pre','h1','tag','go','skip','peekH','peekP','myth','planH','note','finH','finP','finB','doneT','doneP'])$(k).innerHTML=t[k];
  $('lead').textContent=t.lead;
  $('kaps').innerHTML=t.kap.map((k,i)=>'<div class="kap"><i style="background:'+KAP_BG[i]+'">'+KAP_EM[i]+'</i><span>'+(i+1)+' · '+k+'</span></div>').join('');
  $('planList').innerHTML=t.plans.map((p,i)=>'<details class="plan '+p.c+'"><summary><span class="nm">'+p.nm+(i===2?'<span class="soon">'+t.soon+'</span>':'')+'</span><span class="pr">'+p.pr+'</span><span class="ln">'+p.ln+'</span><span class="per">'+(p.per||t.per)+'</span><span class="more">'+t.more+'</span></summary><ul>'+p.li.map(x=>'<li>'+x+'</li>').join('')+'</ul></details>').join('');
  restart();
}
function restart(){step=0;$('chat').innerHTML='';$('done').style.display='none';$('opts').style.display='grid';showStep()}
function showStep(){
  const s=sz().steps[step];
  $('chat').insertAdjacentHTML('beforeend',bubble(s.sp,step));
  const pair=Math.random()<.5?[s.ok,s.no]:[s.no,s.ok];
  $('opts').innerHTML=pair.map(x=>'<button data-a="'+(x===s.ok?1:0)+'">'+x+'</button>').join('');
  $('hint').textContent=T[L].tip;
  speak(s.sp);
}
function answer(btn){
  touched=true;
  const s=sz().steps[step];
  if(btn.dataset.a!=='1'){btn.classList.add('no');$('hint').textContent=T[L].nope;return}
  $('chat').insertAdjacentHTML('beforeend','<div class="me"><span>'+s.ok+'</span></div>');
  step++;
  if(step<sz().steps.length){showStep();return}
  $('opts').style.display='none';$('hint').textContent='';
  $('chat').insertAdjacentHTML('beforeend',bubble(sz().end,2));
  speak(sz().end);
  $('done').style.display='block';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.l){L=b.dataset.l;try{localStorage.setItem('spikiu_lang',L)}catch(x){}render();return}
  if(b.dataset.t){touched=true;speak(b.dataset.t);return}
  if(b.dataset.a!==undefined)answer(b);
});
render();
}
</script>
