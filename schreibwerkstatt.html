<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spikiu — Schreibwerkstatt</title>
<link rel="stylesheet" href="/fonts/spikiu-fonts.css">
<style>
  :root{--paper:#eef7f1;--page:#fff;--ink:#15163a;--read:#2b2621;--muted:#6b6154;--green:#1f93b0;--gold:#a87b2e;--red:#e05252;--sage:#9bd14a;--de:#fbf8f0;--line:#e6dec9;--ow:2.5px;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100%}
  @media (min-width:700px){body{background:#15163a;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1px);background-size:22px 22px}}
  .bar{flex:0 0 auto;display:flex;align-items:center;gap:.7rem;padding:calc(.7rem + env(safe-area-inset-top)) 1.1rem .7rem;border-bottom:var(--ow) solid var(--ink);background:rgba(255,255,255,.92)}
  .back{width:36px;height:36px;flex:0 0 auto;border-radius:999px;border:var(--ow) solid var(--ink);background:#fff;font-size:1.2rem;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
  .back:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
  .room{flex:1;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
  .room-name{font-family:'Archivo Black',sans-serif;font-size:1.05rem;color:var(--ink)}
  .controls{display:flex;align-items:center;gap:.6rem;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
  .controls label{display:flex;align-items:center;gap:.35rem}
  select{font-family:inherit;font-size:.8rem;font-weight:600;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:10px;padding:.28rem .55rem;cursor:pointer}
  select:focus{outline:none;border-color:var(--green)}
  .dev-tag{font:700 .58rem/1 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:#ffd24a;border:2px solid var(--ink);border-radius:999px;padding:.14rem .5rem}
  .bench{flex:1;width:100%;max-width:980px;margin:0 auto;padding:1.8rem 1.2rem 1.6rem;display:flex;flex-direction:column;background:var(--paper)}
  @media (min-width:700px){.bench{margin:1.2rem auto;border:var(--ow) solid var(--ink);border-radius:22px;box-shadow:7px 8px 0 rgba(0,0,0,.25);max-width:940px}}
  .aufgabe-label{font:700 .66rem/1 'DM Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted,#5f7068);margin-bottom:.4rem}
  .aufgabe-input{display:block;width:100%;font-family:'Lora',serif;font-size:1.08rem;font-style:italic;color:var(--muted);line-height:1.4;border-bottom:2px dashed var(--line);padding:0 0 .5rem;margin-bottom:1.6rem}
  .aufgabe-input:focus{outline:none;border-bottom-color:var(--green);color:var(--ink)}
  .stage{display:grid;grid-template-columns:1fr;gap:1.1rem;align-items:start}
  @media(min-width:760px){.stage{grid-template-columns:1.35fr 1fr;gap:1.5rem}}
  .werkstueck{background:#fff;border:var(--ow) solid var(--ink);border-radius:16px;box-shadow:3px 4px 0 var(--ink);padding:1.5rem 1.6rem;min-height:170px;font-family:'Lora',serif;font-size:1.4rem;line-height:1.6;color:var(--read);white-space:pre-wrap;transition:box-shadow .3s}
  .werkstueck.empty{color:#bcae93;font-style:italic}
  .werkstueck.fertig{box-shadow:3px 4px 0 var(--green);border-color:var(--green)}
  .spot{background:linear-gradient(var(--ink) 0 0) bottom left/0% 3px no-repeat;padding-bottom:2px;transition:background-size .5s ease}
  .spot.lit{background-size:100% 3px}
  .lektor{background:var(--de);border:2.5px solid var(--ink);border-left:6px solid var(--ink);border-radius:14px;padding:.9rem 1rem;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s;box-shadow:3px 4px 0 var(--ink)}
  .lektor.show{opacity:1;transform:none}
  .lektor.treffer{border-left-color:var(--green)}
  .lek-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem}
  .lek-head svg{display:block}
  .lek-name{font:700 .66rem/1 'DM Mono',monospace;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
  .lek-sinn{font-size:1.02rem;line-height:1.5;color:var(--ink);margin-bottom:.7rem}
  .lek-sache{font-size:.96rem;line-height:1.55;color:var(--muted)}
  .lek-sache b{color:var(--ink);font-weight:700}
  .lek-form{font-family:'Lora',serif;font-size:1.3rem;color:var(--green);margin:.7rem 0 .1rem}
  .lek-laut{font-size:.86rem;color:var(--muted);font-style:italic;margin-bottom:.2rem}
  .lek-status{font-weight:700}.lek-status.t{color:var(--green)}.lek-status.b{color:var(--muted,#5f7068)}
  .uebernehmen{margin-top:.7rem;font:800 .82rem 'DM Sans';color:#fff;background:var(--green);border:var(--ow) solid var(--ink);border-radius:999px;padding:.5rem 1rem;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
  .uebernehmen:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
  .lesson-btn{margin-top:.9rem;font:800 .9rem 'DM Sans';color:var(--ink);background:var(--sage);border:var(--ow) solid var(--ink);border-radius:999px;padding:.6rem 1.1rem;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
  .lesson-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .lek-error{font-size:.95rem;color:var(--muted,#5f7068);line-height:1.5}
  .retry{margin-top:.6rem;font:700 .82rem 'DM Sans';color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:999px;padding:.35rem .8rem;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
  .hands{margin-top:1.6rem}
  .hands-label{font:700 .68rem/1 'DM Mono',monospace;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
  textarea{width:100%;font-family:'Lora',serif;font-size:1.3rem;line-height:1.5;color:var(--read);background:#fff;border:var(--ow) solid var(--ink);border-radius:14px;padding:1rem 1.1rem;resize:vertical;min-height:90px;box-shadow:3px 3px 0 var(--ink)}
  textarea:focus{outline:none;border-color:var(--green)}
  .hands-row{display:flex;align-items:center;gap:.9rem;margin-top:.9rem;flex-wrap:wrap}
  .primary{font:800 .95rem 'DM Sans';color:#fff;background:var(--green);border:var(--ow) solid var(--ink);border-radius:999px;padding:.65rem 1.4rem;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
  .primary:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .primary:disabled{opacity:.45;cursor:default;box-shadow:none}
  .restart{font:600 .82rem 'DM Sans';color:var(--muted);background:transparent;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .hint{font-size:.78rem;color:var(--muted);margin-top:.6rem;font-style:italic}
  /* Abschluss + Lektion (02.10.2026): Hände klappen weg, die Lektor-Karte führt. */
  .werk-label{font:700 .66rem/1 'DM Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
  .werk-label .ok{color:var(--green)}
  .stage > *{min-width:0}
  .hands{display:grid;grid-template-rows:1fr;transition:grid-template-rows .45s ease,opacity .35s ease,margin .45s ease}
  .hands > div{overflow:hidden;min-height:0}
  .hands.zu{grid-template-rows:0fr;opacity:0;margin-top:0}
  .lektor.bereit{background:#fff;border-color:var(--green);border-left-color:var(--green);box-shadow:3px 4px 0 var(--green)}
  .lek-leise{font-size:.88rem;line-height:1.5;color:var(--muted);margin-top:.55rem}
  .lek-status.e{color:#b94a3a}
  .lek-titel{font-family:'Archivo Black',sans-serif;font-size:1.2rem;line-height:1.2;text-wrap:balance}
  .lek-ziel{font-family:'Lora',serif;font-size:1rem;line-height:1.5;color:var(--read);margin-top:.45rem}
  .lek-ort{margin-top:.8rem;font-size:.85rem;color:var(--muted)}
  .lek-ort b{color:var(--ink)}
  .lek-aktionen{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem;margin-top:1rem}
  .lek-aktionen .lesson-btn{margin-top:0}
  .lesson-btn.blau{background:var(--green);color:#fff}
  .btn-leise{font:700 .88rem 'DM Sans';color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:999px;padding:.5rem .95rem;cursor:pointer}
  .lesson-btn:focus-visible,.btn-leise:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .punkte{display:inline-flex;gap:.3rem;margin-left:.2rem;vertical-align:middle}
  .punkte i{width:7px;height:7px;border-radius:50%;background:var(--green);opacity:.25;animation:atmen 1.2s ease-in-out infinite}
  .punkte i:nth-child(2){animation-delay:.2s}.punkte i:nth-child(3){animation-delay:.4s}
  @keyframes atmen{50%{opacity:1}}
  [hidden]{display:none !important}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<header class="bar">
  <button class="back" id="btnHaus" aria-label="zurück">‹</button>
  <div class="room">
    <span class="room-name" id="roomName">Schreibwerkstatt</span>
    <!-- Dev-Schloss: nur mit ?dev=1 sichtbar. Im Produkt kommt die Sprache aus profile.zielsprache, Können aus profile.koennen. -->
    <div class="controls" id="devControls" hidden>
      <span class="dev-tag">dev</span>
      <label><span id="lblSprache">Sprache</span>
        <select id="selLang">
          <option value="es" id="optEs">Spanisch</option>
          <option value="de" id="optDe">Deutsch</option>
          <option value="en" id="optEn">Englisch</option>
          <option value="el" id="optEl">Griechisch</option>
        </select>
      </label>
      <label><span id="lblKoennen">Können</span>
        <select id="selKoennen">
          <option value="anfang" id="optAnfang">Anfang</option>
          <option value="mittel" id="optMittel">Mittel</option>
          <option value="fortgeschritten" id="optFort">Fortgeschritten</option>
        </select>
      </label>
    </div>
  </div>
</header>

<main class="bench">
  <p class="aufgabe-label" id="aufgabeLabel">Deine Aufgabe</p>
  <div class="aufgabe-input" id="aufgabe">Schreib eine kurze Nachricht: sag jemandem, dass du dich verspätest.</div>

  <div class="stage">
    <div>
      <p class="werk-label" id="werkLabel" hidden><span id="werkLabelTx">Dein Text</span> <span class="ok" id="werkFertig">✓ fertig</span></p>
      <article class="werkstueck empty" id="werk">Hier steht dein Text.</article>
    </div>
    <aside class="lektor" id="lektor" hidden>
      <div class="lek-head">
        <svg width="22" height="22" viewBox="0 0 80 80" fill="none"><ellipse cx="40" cy="50" rx="28" ry="20" fill="#c9956a"/><ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/><ellipse cx="40" cy="36" rx="10" ry="7" fill="#b8845a"/><ellipse cx="40" cy="33" rx="4" ry="2.5" fill="#8b5e3c"/><circle cx="38" cy="33" r="1" fill="#6b4226"/><circle cx="42" cy="33" r="1" fill="#6b4226"/><circle cx="33" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="47" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="34" cy="23" r="1.2" fill="white"/><circle cx="48" cy="23" r="1.2" fill="white"/><ellipse cx="26" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="54" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="22" cy="66" rx="7" ry="5" fill="#b8845a"/><ellipse cx="34" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="46" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="58" cy="66" rx="7" ry="5" fill="#b8845a"/><path d="M36 38 Q40 41 44 38" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
        <span class="lek-name" id="lekName">Spikiu liest</span>
      </div>
      <div id="lekBody"></div>
    </aside>
  </div>

  <div class="hands" id="hands"><div>
    <p class="hands-label" id="handsLabel">In deinen Händen</p>
    <textarea id="ta" spellcheck="false" placeholder="Schreib hier…"></textarea>
    <div class="hands-row">
      <button class="primary" id="primary">Hinlegen</button>
      <button class="restart" id="restart" hidden>Neu starten</button>
    </div>
    <p class="hint" id="hint">Schreib deinen ersten Versuch und leg ihn hin.</p>
  </div></div>
</main>

<script>
(function(){
  var ENDPOINT = '/api/lektor';
  var werk=document.getElementById('werk'), lektor=document.getElementById('lektor'),
      lekBody=document.getElementById('lekBody'), ta=document.getElementById('ta'),
      primary=document.getElementById('primary'), restart=document.getElementById('restart'),
      hint=document.getElementById('hint'), aufgabeEl=document.getElementById('aufgabe'),
      selLang=document.getElementById('selLang'), selKoennen=document.getElementById('selKoennen');

  // ── Profil defensiv lesen (Assessment-Paket noch offen) ──────────
  var stored = {};
  try { stored = (JSON.parse(localStorage.getItem('spikiu_user')||'{}').profile) || {}; } catch(e){}
  function langCode(v){
    if(!v) return null; v=(''+v).toLowerCase();
    if(/^(de|es|en|el)$/.test(v)) return v;
    if(v.indexOf('deutsch')>-1||v.indexOf('german')>-1) return 'de';
    if(v.indexOf('span')>-1||v.indexOf('español')>-1) return 'es';
    if(v.indexOf('engl')>-1) return 'en';
    if(v.indexOf('griech')>-1||v.indexOf('greek')>-1) return 'el';
    return null;
  }
  function koennenFrom(v){
    if(!v) return null; v=(''+v).toLowerCase();
    if(['anfang','mittel','fortgeschritten'].indexOf(v)>-1) return v;
    if(/a[12]/.test(v)) return 'anfang';
    if(/b[12]/.test(v)) return 'mittel';
    if(/c[12]/.test(v)) return 'fortgeschritten';
    return null;
  }
  // ── UI-Sprache = Muttersprache (de/es/en/el) — Lerninhalt bleibt in der Zielsprache ──
  var UI={
    de:{room:'Schreibwerkstatt',zurueck:'zurück',sprache:'Sprache',koennen:'Können',
        lEs:'Spanisch',lDe:'Deutsch',lEn:'Englisch',lEl:'Griechisch',anfang:'Anfang',mittel:'Mittel',fort:'Fortgeschritten',
        aufgabeLabel:'Deine Aufgabe',aufgabe:'Schreib eine kurze Nachricht: sag jemandem, dass du dich verspätest.',
        deinText:'Dein Text',fertig:'✓ fertig',leer:'Hier steht dein Text.',liest:'Spikiu liest',haende:'In deinen Händen',
        ph:'Schreib hier…',hinlegen:'Hinlegen',weiter:'Weiter',neuStart:'Neu starten',
        hint1:'Schreib deinen ersten Versuch und leg ihn hin.',hint2:'Überarbeite die markierte Stelle und leg sie zurück.',
        treffer:'Treffer.',geschafft:'Geschafft.',zielSinn:'Der Text tut, was er soll.',mkLesson:'Lektion daraus machen',
        neuText:'Neuer Text',fast:'Fast.',take:'In meine Hände legen',baut:'Spikiu baut deine Lektion',
        gehen:'Du kannst auch gehen. Die Lektion landet trotzdem in der Bibliothek.',
        lekFail:'Die Lektion ist gerade nicht entstanden.',lekFail2:'Dein Text ist sicher. Versuch es gleich noch einmal.',
        nochmal:'Nochmal',lektion:'Lektion',neueLektion:'Neue Lektion',deineLektion:'Deine Lektion',
        ort:'📓 Liegt in der <b>Bibliothek</b> unter <b>Lektionen</b>.',oeffnen:'Lektion öffnen',
        fehler:'Der Lektor ist gerade nicht erreichbar. Leg deinen Text gleich nochmal hin.'},
    es:{room:'Escritura',zurueck:'atrás',sprache:'Idioma',koennen:'Soltura',
        lEs:'Español',lDe:'Alemán',lEn:'Inglés',lEl:'Griego',anfang:'Inicio',mittel:'Medio',fort:'Avanzado',
        aufgabeLabel:'Tu tarea',aufgabe:'Escribe un mensaje corto: dile a alguien que vas a llegar tarde.',
        deinText:'Tu texto',fertig:'✓ listo',leer:'Aquí aparecerá tu texto.',liest:'Spikiu está leyendo',haende:'En tus manos',
        ph:'Escribe aquí…',hinlegen:'Entregar',weiter:'Seguir',neuStart:'Empezar de nuevo',
        hint1:'Escribe tu primer intento y entrégalo.',hint2:'Revisa la parte marcada y vuelve a entregarla.',
        treffer:'¡Acertado!',geschafft:'¡Conseguido!',zielSinn:'El texto cumple su función.',mkLesson:'Hacer una lección con esto',
        neuText:'Texto nuevo',fast:'Casi.',take:'Pasarlo a mis manos',baut:'Spikiu está preparando tu lección',
        gehen:'Puedes irte si quieres. La lección llegará igualmente a la Biblioteca.',
        lekFail:'La lección no ha salido esta vez.',lekFail2:'Tu texto está a salvo. Inténtalo de nuevo en un momento.',
        nochmal:'Otra vez',lektion:'Lección',neueLektion:'Lección nueva',deineLektion:'Tu lección',
        ort:'📓 Está en la <b>Biblioteca</b>, en <b>Lecciones</b>.',oeffnen:'Abrir la lección',
        fehler:'Spikiu no está disponible ahora mismo. Vuelve a entregar tu texto en un momento.'},
    en:{room:'Writing',zurueck:'back',sprache:'Language',koennen:'Ability',
        lEs:'Spanish',lDe:'German',lEn:'English',lEl:'Greek',anfang:'Beginning',mittel:'Middle',fort:'Advanced',
        aufgabeLabel:'Your task',aufgabe:"Write a short message: tell someone you're running late.",
        deinText:'Your text',fertig:'✓ done',leer:'Your text will appear here.',liest:'Spikiu is reading',haende:'In your hands',

        neuText:'New text',fast:'Almost.',take:'Put it in my hands',baut:'Spikiu is building your lesson',

        ort:"📓 It's in the <b>Library</b> under <b>Lessons</b>.",oeffnen:'Open lesson',
        fehler:"Spikiu can't be reached right now. Hand your text in again in a moment."},
    el:{room:'Γραφή',zurueck:'Πίσω',sprache:'Γλώσσα',koennen:'Δεξιότητα',
        lEs:'Ισπανικά',lDe:'Γερμανικά',lEn:'Αγγλικά',lEl:'Ελληνικά',anfang:'Αρχή',mittel:'Μέση',fort:'Προχωρημένο',
        aufgabeLabel:'Η εργασία σου',aufgabe:'Γράψε ένα σύντομο μήνυμα: πες σε κάποιον ότι θα αργήσεις.',

        ph:'Γράψε εδώ…',hinlegen:'Παράδωσέ το',weiter:'Συνέχεια',neuStart:'Ξεκίνα από την αρχή',
        hint1:'Γράψε την πρώτη σου προσπάθεια και παράδωσέ την.',hint2:'Διόρθωσε το σημειωμένο σημείο και παράδωσέ το ξανά.',
        treffer:'Εύστοχο.',geschafft:'Τα κατάφερες.',zielSinn:'Το κείμενο κάνει αυτό που πρέπει.',mkLesson:'Κάν’ το μάθημα',
        neuText:'Νέο κείμενο',fast:'Σχεδόν.',take:'Βάλ’ το στα χέρια μου',baut:'Ο Spikiu φτιάχνει το μάθημά σου',
        gehen:'Μπορείς και να φύγεις. Το μάθημα θα φτάσει έτσι κι αλλιώς στη Βιβλιοθήκη.',
        lekFail:'Το μάθημα δεν βγήκε αυτή τη φορά.',lekFail2:'Το κείμενό σου είναι ασφαλές. Δοκίμασε ξανά σε λίγο.',
        nochmal:'Ξανά',lektion:'Μάθημα',neueLektion:'Νέο μάθημα',deineLektion:'Το μάθημά σου',

        fehler:'Ο Spikiu δεν είναι διαθέσιμος αυτή τη στιγμή. Παράδωσε ξανά το κείμενό σου σε λίγο.'}
  };
  function uiLang(){
    var m=stored.muttersprache||langCode(stored.nativeLang);
    if(!m){ try{ m=localStorage.getItem('spikiu_lang'); }catch(e){} }
    m=langCode(m);
    return ['de','es','en','el'].indexOf(m)>-1?m:'de';
  }
  var T=UI[uiLang()];
  (function(){
    document.documentElement.lang=uiLang();
    document.title='Spikiu — '+T.room;
    function setTx(id,v){ var el=document.getElementById(id); if(el) el.textContent=v; }
    setTx('roomName',T.room); setTx('lblSprache',T.sprache); setTx('lblKoennen',T.koennen);
    setTx('optEs',T.lEs); setTx('optDe',T.lDe); setTx('optEn',T.lEn); setTx('optEl',T.lEl);
    setTx('optAnfang',T.anfang); setTx('optMittel',T.mittel); setTx('optFort',T.fort);
    setTx('aufgabeLabel',T.aufgabeLabel); setTx('werkLabelTx',T.deinText); setTx('werkFertig',T.fertig);
    setTx('lekName',T.liest); setTx('handsLabel',T.haende); setTx('primary',T.hinlegen);
    setTx('restart',T.neuStart); setTx('hint',T.hint1);
    werk.textContent=T.leer; aufgabeEl.textContent=T.aufgabe; ta.placeholder=T.ph;
    var bh=document.getElementById('btnHaus'); if(bh) bh.setAttribute('aria-label',T.zurueck);
  })();

  if(stored.aufgabe) aufgabeEl.textContent = stored.aufgabe;
  selLang.value = stored.zielsprache || langCode(stored.targetLang) || 'es';
  selKoennen.value = stored.koennen || koennenFrom(stored.level) || 'anfang';

  function profile(){
    return {
      name: stored.name || '',
      muttersprache: stored.muttersprache || langCode(stored.nativeLang) || 'de',
      zielsprache: selLang.value,
      koennen: selKoennen.value,
      fremde_schrift: selLang.value === 'el',
      aufgabe: (aufgabeEl.textContent||'').trim() || null
    };
  }

  // ── Zustand ──────────────────────────────────────────────────────
  var verlauf=[], lastRaw='', currentText='', step='einstieg', busy=false;
  var lastLektor=null, saveTimer=null;

  function esc(s){return s.replace(/[&<>]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;'})[c];});}

  // ── Sitzungs-Persistenz (sitzung.js) — entprellt vom Raum (~350 ms) ──
  function scheduleSave(){
    if(!window.spikiuSitzung) return;
    clearTimeout(saveTimer);
    saveTimer=setTimeout(doSave, 350);
  }
  function doSave(){
    if(!window.spikiuSitzung) return;
    if(!currentText && !(ta.value && ta.value.trim()) && verlauf.length===0) return; // nichts angefangen
    try{ window.spikiuSitzung.speichere('schreibwerkstatt',
      { verlauf:verlauf, currentText:currentText, lastRaw:lastRaw, step:step, draft:ta.value, lastLektor:lastLektor }); }catch(e){}
  }
  function raeumeSitzung(){
    clearTimeout(saveTimer); saveTimer=null;
    if(window.spikiuSitzung){ try{ window.spikiuSitzung.raeume('schreibwerkstatt'); }catch(e){} }
  }

  function standText(text, mark){
    werk.classList.remove('empty');
    if(mark && mark.zitat && ['lesen','beinah','stuck'].indexOf(mark.status)>-1){
      var fe=esc(text), fz=esc(mark.zitat), i=fe.indexOf(fz);
      if(i>-1){
        werk.innerHTML = fe.slice(0,i)+'<span class="spot" id="spot">'+fz+'</span>'+fe.slice(i+fz.length);
        requestAnimationFrame(function(){var s=document.getElementById('spot');if(s)s.classList.add('lit');});
        return;
      }
    }
    werk.textContent = text;
  }

  function showThinking(){
    document.getElementById('lekName').textContent=T.liest;
    lekBody.innerHTML='<p class="lek-sinn" style="color:var(--ink-soft)">…</p>';
    lektor.classList.remove('treffer'); lektor.hidden=false;
    requestAnimationFrame(function(){lektor.classList.add('show');});
  }

  function renderLektor(l){
    lektor.classList.toggle('treffer', l.status==='treffer'||l.status==='ziellinie');
    var html='';
    if(l.status==='treffer'){
      html+='<p class="lek-status t">'+T.treffer+'</p>';
      if(l.sinn) html+='<p class="lek-sinn" style="margin-top:.4rem">'+esc(l.sinn)+'</p>';
    } else if(l.status==='ziellinie'){
      html+='<p class="lek-status t">'+T.geschafft+'</p>';
      html+='<p class="lek-sinn" style="margin-top:.4rem">'+esc(l.sinn||T.zielSinn)+'</p>';
      html+='<div class="lek-aktionen"><button class="lesson-btn" id="mklesson">'+T.mkLesson+'</button>'+
            '<button class="btn-leise" id="neuText">'+T.neuText+'</button></div>';
    } else {
      if(l.status==='beinah') html+='<p class="lek-status b" style="margin-bottom:.4rem">'+T.fast+'</p>';
      if(l.sinn)  html+='<p class="lek-sinn">'+esc(l.sinn)+'</p>';
      if(l.sache) html+='<p class="lek-sache">'+esc(l.sache)+'</p>';
      if(l.form){
        html+='<p class="lek-form">'+esc(l.form)+'</p>';
        if(l.lautschrift) html+='<p class="lek-laut">['+esc(l.lautschrift)+']</p>';
        html+='<button class="uebernehmen" id="take">'+T.take+'</button>';
      }
    }
    lekBody.innerHTML=html;

    var take=document.getElementById('take');
    if(take) take.onclick=function(){
      var next = currentText.indexOf(l.zitat)>-1 ? currentText.replace(l.zitat, l.form) : (currentText+' '+l.form);
      ta.value=next; ta.focus();
    };
    var ml=document.getElementById('mklesson');
    if(ml) ml.onclick=function(){ baueLektion(); };
    var nt=document.getElementById('neuText');
    if(nt) nt.onclick=neuerText;
  }

  // ── Lektion aus dem Text (02.10.2026) ────────────────────────────
  // Gleicher Weg wie chat.html: Auftrag zuerst in spikiu_pending_lesson sichern
  // (lektionen.html / nav.js stellen ihn fertig, falls der Nutzer geht), dann
  // /api/generate-lesson, Eintrag in spikiu_user.lessons (max. 14).
  var SPRACHNAME={de:'German',es:'Spanish',en:'English',el:'Greek'};
  var STUFE={anfang:'A2',mittel:'B1',fortgeschritten:'B2'};
  var lektionLaeuft=false;
  function leseNutzer(){ try{ return JSON.parse(localStorage.getItem('spikiu_user')||'{}')||{}; }catch(e){ return {}; } }
  function lesePending(){ try{ return JSON.parse(localStorage.getItem('spikiu_pending_lesson')||'null'); }catch(e){ return null; } }
  function lektionsAuftrag(){
    var u=leseNutzer(), pr=profile(), up=u.profile||{};
    var prof={}; for(var k in up){ if(Object.prototype.hasOwnProperty.call(up,k)) prof[k]=up[k]; }
    prof.targetLang = up.targetLang || SPRACHNAME[pr.zielsprache] || 'Spanish';
    prof.level      = up.level || STUFE[pr.koennen] || 'A2';
    var kopf={role:'assistant', content:'[Schreibwerkstatt] Aufgabe: '+(pr.aufgabe||'freier Text')+
      '\nDer Lerner hat einen kurzen Text geschrieben und mit Spikiu als Lektor überarbeitet. '+
      'Die Züge unten zeigen seine Fassungen und Spikius Rückmeldungen.\nEndfassung: '+currentText};
    return {
      name: u.name || pr.name || 'du',
      nativeLang: u.nativeLang || SPRACHNAME[pr.muttersprache] || 'German',
      profile: prof,
      conversationHistory: [kopf].concat(verlauf.map(function(m){ return {role:m.role, content:m.content}; }))
    };
  }
  function lektorKarte(kopf, html, cls){
    document.getElementById('lekName').textContent=kopf;
    lektor.classList.toggle('bereit', cls==='bereit');
    lektor.classList.toggle('treffer', cls!=='bereit');
    lekBody.innerHTML=html;
    lektor.hidden=false; lektor.classList.add('show');
    if(window.innerWidth<760) setTimeout(function(){ try{ lektor.scrollIntoView({behavior:'smooth',block:'nearest'}); }catch(e){} },60);
  }
  async function baueLektion(){
    if(lektionLaeuft) return;
    lektionLaeuft=true;
    // Auftrag sichern — nur in einen freien Platz oder in unseren eigenen; nie einen fremden überschreiben.
    var pend=lesePending(), gesichert=false;
    if(pend && pend.status==='pending' && pend.quelle==='schreibwerkstatt' && pend.text===currentText){ gesichert=true; }
    else if(!pend || pend.status!=='pending'){
      pend={ id:'lesson_'+Date.now(), body:lektionsAuftrag(), thema:'Schreibwerkstatt',
             zielsprache:profile().zielsprache, createdAt:new Date().toISOString(), status:'pending',
             quelle:'schreibwerkstatt', text:currentText };
      try{ localStorage.setItem('spikiu_pending_lesson', JSON.stringify(pend)); gesichert=true; }catch(e){}
    } else {
      pend={ id:'lesson_'+Date.now(), body:lektionsAuftrag(), thema:'Schreibwerkstatt',
             zielsprache:profile().zielsprache, createdAt:new Date().toISOString() };
    }
    lektorKarte('Spikiu',
      '<p class="lek-sinn"><b>'+T.baut+'</b> <span class="punkte" aria-hidden="true"><i></i><i></i><i></i></span></p>'+
      (gesichert?'<p class="lek-leise">'+T.gehen+'</p>':''));

    var r=null, raw='', d=null;
    try{
      r=await fetch('/api/generate-lesson',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pend.body)});
      try{ raw=await r.text(); }catch(e){ raw=''; }
      try{ d=raw?JSON.parse(raw):null; }catch(e){ d=null; }
    }catch(e){ r=null; raw=String((e&&e.message)||e); }
    lektionLaeuft=false;

    if(!r || !r.ok || !d || !d.lesson){
      console.error('generate-lesson '+(r?r.status:'netz'), (d&&(d.error||d.detail))||(raw||'').slice(0,300));
      lektorKarte('Spikiu',
        '<p class="lek-status e">'+T.lekFail+'</p>'+
        '<p class="lek-sinn" style="margin-top:.35rem">'+T.lekFail2+'</p>'+
        '<div class="lek-aktionen"><button class="lesson-btn" id="lekNochmal">'+T.nochmal+'</button>'+
        '<button class="btn-leise" id="neuText2">'+T.neuText+'</button></div>');
      document.getElementById('lekNochmal').onclick=baueLektion;
      document.getElementById('neuText2').onclick=neuerText;
      return;
    }

    var u=leseNutzer();
    var arr=Array.isArray(u.lessons)?u.lessons.slice():[];
    if(!arr.some(function(x){ return x && x.id===pend.id; })) arr.push({
      id:pend.id, topic:d.lesson.title||T.lektion, thema:pend.thema, raum:'schreiben', fromConversation:true,
      lesson:d.lesson, createdAt:pend.createdAt, zielsprache:pend.zielsprache });
    arr.sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); });
    u.lessons=arr.slice(0,14);
    try{ localStorage.setItem('spikiu_user', JSON.stringify(u)); }catch(e){}
    if(gesichert){ var p2=lesePending(); if(p2 && p2.id===pend.id){ try{ localStorage.removeItem('spikiu_pending_lesson'); }catch(e){} } }

    var L=d.lesson;
    lektorKarte(T.neueLektion,
      '<p class="lek-titel">'+esc(L.title||T.deineLektion)+'</p>'+
      ((L.subtitle||L.goal)?'<p class="lek-ziel">'+esc(L.subtitle||L.goal)+'</p>':'')+
      '<p class="lek-ort">'+T.ort+'</p>'+
      '<div class="lek-aktionen"><button class="lesson-btn blau" id="lekOeffnen">'+T.oeffnen+'</button>'+
      '<button class="btn-leise" id="neuText3">'+T.neuText+'</button></div>', 'bereit');
    document.getElementById('lekOeffnen').onclick=function(){ location.href='lektionen.html#last'; };
    document.getElementById('neuText3').onclick=neuerText;
  }
  function neuerText(){ raeumeSitzung(); doRestart(); try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){} }

  function renderError(){
    document.getElementById('lekName').textContent='Spikiu';
    lekBody.innerHTML='<p class="lek-error">'+esc(T.fehler)+'</p>'+
      '<button class="retry" id="retry">'+T.nochmal+'</button>';
    lektor.hidden=false; requestAnimationFrame(function(){lektor.classList.add('show');});
    document.getElementById('retry').onclick=function(){ submit(true); };
  }

  async function callLektor(){
    var r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:verlauf, profile:profile(), maxTokens:600})});
    var d=await r.json();
    if(!r.ok) throw new Error('http');
    return d;
  }

  async function submit(isRetry){
    if(busy) return;
    var text = ta.value.trim();
    if(!text && !isRetry){ ta.focus(); return; }

    if(!isRetry){
      currentText = text;
      verlauf.push({role:'user', content:text});
    }
    standText(currentText, null);   // Text steht, noch ohne Markierung
    busy=true; primary.disabled=true; showThinking();

    try{
      var d=await callLektor();
      var l=d.lektor || {sinn:(d.text||'').slice(0,200), zitat:'', sache:'', form:null, lautschrift:null, status:'lesen'};
      lastRaw = d.text || JSON.stringify(l);
      lastLektor = l;
      // letzten Lektor-Zug in den Verlauf, damit der nächste Aufruf Kontext hat
      verlauf.push({role:'assistant', content:lastRaw});

      standText(currentText, l);
      lektor.classList.remove('show');
      requestAnimationFrame(function(){ renderLektor(l); lektor.hidden=false;
        requestAnimationFrame(function(){lektor.classList.add('show');}); });

      if(l.status==='ziellinie'){
        werk.classList.add('fertig'); werk.textContent=currentText;
        primary.hidden=true; ta.disabled=true;
        document.getElementById('werkLabel').hidden=false;
        document.getElementById('hands').classList.add('zu');   // Hände weg — die Karte führt
        raeumeSitzung();   // Ziellinie erreicht → kein Zombie-Resume
      } else {
        step='arbeit'; primary.textContent=T.weiter;
        hint.textContent=T.hint2;
        scheduleSave();    // kohärenter Stand nach abgeschlossenem Lektor-Zug
      }
    }catch(e){
      // fehlgeschlagenen user-Push zurücknehmen, damit Retry sauber ist
      if(!isRetry && verlauf.length && verlauf[verlauf.length-1].role==='user') verlauf.pop();
      renderError();
    }finally{
      busy=false; if(!primary.hidden) primary.disabled=false;
    }
  }

  primary.onclick=function(){ submit(false); };
  function doRestart(){
    verlauf=[]; lastRaw=''; currentText=''; step='einstieg'; busy=false; lastLektor=null;
    werk.className='werkstueck empty'; werk.textContent=T.leer;
    lektor.hidden=true; lektor.classList.remove('show','treffer','bereit'); lekBody.innerHTML='';
    document.getElementById('werkLabel').hidden=true; document.getElementById('hands').classList.remove('zu');
    document.getElementById('lekName').textContent=T.liest; lektionLaeuft=false;
    ta.disabled=false; ta.value=''; primary.hidden=false; primary.disabled=false; primary.textContent=T.hinlegen;
    restart.hidden=true; hint.textContent=T.hint1;
  }
  restart.onclick=function(){ raeumeSitzung(); doRestart(); };
  ta.addEventListener('keydown',function(e){
    if(e.key==='Enter' && (e.metaKey||e.ctrlKey)){ e.preventDefault(); if(!primary.hidden) submit(false); }
  });
  ta.addEventListener('input', function(){ scheduleSave(); });   // Entwurf laufend sichern (entprellt)

  // ── Sitzungs-Persistenz: Stand wiederherstellen ────────────────────
  function restoreState(s){
    verlauf = Array.isArray(s.verlauf) ? s.verlauf : [];
    currentText = s.currentText || '';
    lastRaw = s.lastRaw || '';
    step = s.step || 'einstieg';
    lastLektor = s.lastLektor || null;
    ta.value = s.draft || '';
    if(currentText){
      standText(currentText, lastLektor);
      if(lastLektor){
        renderLektor(lastLektor);
        lektor.hidden=false; lektor.classList.add('show');
        step='arbeit'; primary.textContent=T.weiter;
        hint.textContent=T.hint2;
      }
    }
  }
  function resumable(s){
    if(!s) return false;
    var hatText   = s.currentText && (''+s.currentText).trim();
    var hatDraft  = s.draft && (''+s.draft).trim();
    var hatLektor = !!s.lastLektor;
    var hatVerlauf= Array.isArray(s.verlauf) && s.verlauf.length>0;
    return !!(hatText || hatDraft || hatLektor || hatVerlauf);
  }
  function start(){
    var saved=(window.spikiuSitzung && window.spikiuSitzung.lade) ? window.spikiuSitzung.lade('schreibwerkstatt') : null;
    if(resumable(saved)){
      window.spikiuSitzung.frageWiederkommen({
        raum:'schreibwerkstatt', ts:saved.ts, wo:T.room,
        beimWeiter:function(){ restoreState(saved); },
        beimNeu:function(){ raeumeSitzung(); doRestart(); }
      });
    } else if(saved){
      raeumeSitzung();   // stale/leerer Rest → wegräumen
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>

<!-- Dev-Schloss: ?dev=1 blendet die zwei Test-Wähler ein. Im Produkt unsichtbar.
     Vorbelegung erledigt bereits das Lektor-Script oben (selLang/selKoennen aus dem Profil). -->
<script>
  (function(){
    var bh=document.getElementById('btnHaus'); if(bh)bh.onclick=function(){location.href='haus.html';};
    if(!/[?&]dev=1\b/.test(location.search)) return;   // Produkt: Wähler bleiben weg
    var box=document.getElementById('devControls'); if(box) box.hidden=false;
  })();
</script>
