<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spikiu · Wortschatz-Werkstatt</title>
<link rel="stylesheet" href="/fonts/spikiu-fonts.css">
<style>
:root{--bg:#eef7f1;--ink:#15163a;--read:#2b2621;--muted:#6b6154;--de:#fbf8f0;--sage:#9bd14a;--green:#2d6a4f;--pink:#ff4f9a;--gold:#a87b2e;--red:#e05252;--ow:2.5px;--warm:#c3bcae;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;line-height:1.5;display:flex;align-items:center;justify-content:center;min-height:100dvh;-webkit-font-smoothing:antialiased;}
@media (min-width:700px) and (min-height:560px){
 html{font-size:17px;}
 body{background:#15163a;background-image:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1px);background-size:22px 22px;padding:24px;}
 .app{width:min(460px,94vw);height:min(880px,90vh);border-radius:28px;box-shadow:9px 11px 0 rgba(0,0,0,.22);border:2.5px solid var(--ink);}
}
.app{position:relative;display:flex;flex-direction:column;height:100dvh;width:100%;background:var(--bg);overflow:hidden;}
.top{flex:0 0 auto;background:rgba(255,255,255,.72);border-bottom:var(--ow) solid var(--ink);padding:calc(.6rem + env(safe-area-inset-top)) .9rem .6rem;display:flex;align-items:center;gap:.6rem;}
.back{width:36px;height:36px;flex:0 0 auto;border-radius:999px;border:var(--ow) solid var(--ink);background:#fff;font-size:1.2rem;cursor:pointer;box-shadow:2px 2px 0 var(--ink);}
.back:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink);}
.tt-wrap{flex:1;text-align:center;}
.tt-wrap .rk{font:500 .58rem/1 'DM Mono',monospace;letter-spacing:.2em;color:var(--green);text-transform:uppercase;}
.tt-wrap h1{font-family:'Archivo Black',sans-serif;font-size:1.12rem;margin:.1rem 0 0;}
.deck{flex:1;position:relative;overflow:hidden;min-height:0;}
.card{position:absolute;inset:1.1rem 1rem;background:#fff;border:var(--ow) solid var(--ink);border-radius:22px;box-shadow:5px 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.9rem;padding:1.6rem 1.4rem;overflow-y:auto;transform:translateX(115%);opacity:0;pointer-events:none;transition:transform .38s cubic-bezier(.4,0,.2,1),opacity .38s ease;will-change:transform,opacity;}
.card.deck-current{transform:translateX(0) rotate(0);opacity:1;pointer-events:auto;z-index:2;}
.card.deck-next{transform:translateX(115%) rotate(1.4deg);opacity:0;z-index:1;}
.card.deck-past{transform:translateX(-115%) rotate(-1.4deg);opacity:0;z-index:1;}
.word-icon{font-size:4.4rem;line-height:1;filter:drop-shadow(2px 3px 0 rgba(21,22,58,.12));}
.gym-eyebrow{font:700 .68rem/1 'DM Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);}
.gym-eyebrow.ueb{color:var(--green);}
.gym-wort{font-family:'Lora',serif;font-weight:600;font-size:clamp(1.7rem,7vw,2.4rem);line-height:1.25;color:var(--read);}
.gym-speak{width:48px;height:48px;border:var(--ow) solid var(--ink);border-radius:999px;cursor:pointer;background:var(--pink);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:3px 3px 0 var(--ink);}
.gym-speak:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
.gym-speak svg{width:20px;height:20px;}
.gym-speak.playing{animation:gymPulse 1s ease infinite;}
.gym-speak.loading svg{display:none;}
.gym-speak.loading::after{content:'';width:16px;height:16px;border:2.5px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:gymSpin .7s linear infinite;}
@keyframes gymPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
@keyframes gymSpin{to{transform:rotate(360deg);}}
.gym-tr{font-size:1.08rem;color:var(--muted);font-weight:600;}
.gym-ex{font-family:'Lora',serif;font-style:italic;font-size:1.05rem;color:#8a8378;max-width:20rem;}
.gym-src{font:700 .9rem/1 'DM Mono',monospace;color:var(--sage);}
.card-hint{position:absolute;left:0;right:0;bottom:.7rem;font:600 .72rem/1 'DM Mono',monospace;color:var(--warm);letter-spacing:.05em;animation:gymNudge 1.8s ease-in-out infinite;}
@keyframes gymNudge{0%,100%{transform:translateX(0);opacity:.7;}50%{transform:translateX(-5px);opacity:1;}}
.deck-nav{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.7rem 1rem calc(1rem + env(safe-area-inset-bottom));border-top:var(--ow) solid var(--ink);background:rgba(255,255,255,.7);}
.deck-btn{background:#fff;border:var(--ow) solid var(--ink);color:var(--ink);border-radius:999px;padding:.6rem .9rem;font:800 .86rem/1 'DM Sans';cursor:pointer;box-shadow:3px 3px 0 var(--ink);white-space:nowrap;}
.deck-btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
.deck-btn:disabled{opacity:.35;box-shadow:none;cursor:default;}
.deck-btn.fwd{background:var(--green);color:#fff;}
.deck-btn.add{background:var(--gold);color:#fff;}
.add-panel{position:absolute;left:0;right:0;bottom:0;z-index:120;background:#fff;border-top:var(--ow) solid var(--ink);box-shadow:0 -6px 0 rgba(0,0,0,.08);padding:1.1rem 1.2rem calc(1.1rem + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:.6rem;}
.add-panel[hidden]{display:none;}
.add-title{font-family:'Archivo Black',sans-serif;font-size:1.05rem;}
.add-panel input{background:var(--de);border:2px solid var(--ink);border-radius:12px;padding:.7rem .9rem;font:1rem 'DM Sans';color:var(--ink);outline:none;}
.add-panel input:focus{border-color:var(--green);}
.add-row{display:flex;gap:.6rem;}
.add-row button{flex:1;border:var(--ow) solid var(--ink);border-radius:999px;padding:.7rem;font:800 .92rem 'DM Sans';cursor:pointer;box-shadow:3px 3px 0 var(--ink);}
.add-save{background:var(--green);color:#fff;}
.add-cancel{background:#fff;color:var(--ink);}
.gym-toast{position:absolute;left:50%;bottom:5.5rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.55rem 1rem;border-radius:999px;font-weight:700;font-size:.85rem;z-index:130;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:3px 3px 0 rgba(0,0,0,.3);}
.gym-toast.show{opacity:1;}
@media (prefers-reduced-motion:reduce){.card-hint{animation:none;}}
</style>
</head>
<body>

<div class="app">
  <div class="top"><button class="back" id="btnHaus" aria-label="zurück">‹</button><div class="tt-wrap"><div class="rk">Übung</div><h1 id="roomTitle">Wortschatz</h1></div><div style="width:36px"></div></div>
  <div class="deck" id="deck"></div>
  <div class="deck-nav">
    <button class="deck-btn" type="button" id="btnBack">‹ <span id="btnBackLbl">zurück</span></button>
    <button class="deck-btn add" type="button" id="btnAdd">➕ <span id="btnAddLbl">Wort</span></button>
    <button class="deck-btn fwd" type="button" id="btnFwd"><span id="btnFwdLbl">weiter</span> ›</button>
  </div>
</div>

<div class="add-panel" id="addPanel" hidden>
  <div class="add-title" id="addTitle">Wort hinzufügen</div>
  <input type="text" id="addWort" autocomplete="off">
  <input type="text" id="addTr" autocomplete="off">
  <div class="add-row">
    <button class="add-cancel" type="button" id="addCancel">Abbrechen</button>
    <button class="add-save" type="button" id="addSave">Speichern</button>
  </div>
</div>
<div class="gym-toast" id="gymToast"></div>

<script>
// ════════════════════════════════════════════════════════════════════
//  SPIKIU · RAUM „WORTSCHATZ-WERKSTATT / GYM" (Teil 52) — Tinder-Deck OHNE KI.
//  Quelle = fester Starter-Wortschatz (wortschatz.js) + eigene Wörter (localStorage).
//  Wort → Übung (uebung.js) → nächstes Wort → … Daumen links=weiter, rechts=zurück.
//  EHRLICH: KEINE erfundenen Companion-/Wackel-Daten (per-Wort-Tracking = Phase 2).
//  Anti-Gamification: kein Streak/Score. Reuse: audio.js, uebung.js, wortschatz.js. Self-contained (Pop, Rueckweg ins Haus).
// ════════════════════════════════════════════════════════════════════
var STORE_KEY = 'spikiu_wortschatz';

// ── Profil defensiv (Codes de/es/en/el) ──
var stored = {};
try { stored = (JSON.parse(localStorage.getItem('spikiu_user')||'{}').profile) || {}; } catch(e){}
function langCode(v){
  if(!v) return null; v=(''+v).toLowerCase();
  if(/^(de|es|en|el)$/.test(v)) return v;
  if(v.indexOf('deutsch')>-1||v.indexOf('german')>-1) return 'de';
  if(v.indexOf('span')>-1||v.indexOf('español')>-1) return 'es';
  if(v.indexOf('engl')>-1) return 'en';
  if(v.indexOf('griech')>-1||v.indexOf('greek')>-1) return 'el';
  return null;
}
var zielC = stored.zielsprache || langCode(stored.targetLang) || 'es';
var mutterC = stored.muttersprache || langCode(stored.nativeLang) || 'de';
var PROFILE = { zielsprache: zielC, muttersprache: mutterC };
function uiLang(){ return (['de','es','en'].indexOf(PROFILE.muttersprache) > -1) ? PROFILE.muttersprache : 'de'; }

var UI = {
  de:{ eyebrow:'Wortschatz', uebung:'Übung', back:'zurück', fwd:'weiter', add:'Wort', hintFwd:'← weiter wischen',
       addTitle:'Wort hinzufügen', phWort:'Wort (Zielsprache)', phTr:'Übersetzung', save:'Speichern', cancel:'Abbrechen', added:'Hinzugefügt ✓' },
  es:{ eyebrow:'Vocabulario', uebung:'Ejercicio', back:'atrás', fwd:'seguir', add:'Palabra', hintFwd:'← desliza para seguir',
       addTitle:'Añadir palabra', phWort:'Palabra (idioma meta)', phTr:'Traducción', save:'Guardar', cancel:'Cancelar', added:'Añadido ✓' },
  en:{ eyebrow:'Vocabulary', uebung:'Exercise', back:'back', fwd:'next', add:'Word', hintFwd:'← swipe to continue',
       addTitle:'Add a word', phWort:'Word (target language)', phTr:'Translation', save:'Save', cancel:'Cancel', added:'Added ✓' }
};
function ui(){ return UI[uiLang()] || UI.de; }

var SPK_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4.03v8.06A4.5 4.5 0 0016.5 12z"/></svg>';
var CAPY_SVG = '<svg viewBox="0 0 80 80" fill="none">'
  + '<ellipse cx="40" cy="50" rx="28" ry="20" fill="#c9956a"/><ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/>'
  + '<ellipse cx="40" cy="36" rx="10" ry="7" fill="#b8845a"/><ellipse cx="40" cy="33" rx="4" ry="2.5" fill="#8b5e3c"/>'
  + '<circle cx="38" cy="33" r="1" fill="#6b4226"/><circle cx="42" cy="33" r="1" fill="#6b4226"/>'
  + '<g class="spk-capy-eyes"><circle cx="33" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="47" cy="24" r="3.5" fill="#3d2b1f"/>'
  + '<circle cx="34" cy="23" r="1.2" fill="white"/><circle cx="48" cy="23" r="1.2" fill="white"/></g>'
  + '<ellipse cx="26" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="54" cy="17" rx="6" ry="5" fill="#b8845a"/>'
  + '<ellipse cx="22" cy="66" rx="7" ry="5" fill="#b8845a"/><ellipse cx="34" cy="68" rx="7" ry="5" fill="#b8845a"/>'
  + '<ellipse cx="46" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="58" cy="66" rx="7" ry="5" fill="#b8845a"/>'
  + '<path class="spk-capy-mouth" d="M36 38 Q40 41 44 38" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>';
function escPlain(t){ return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function wordCount(t){ return String(t||'').trim().split(/\s+/).filter(Boolean).length; }

// ── Audio (🔊) ──
var voiceReady = false;
function warmVoice(){ if (!window.spkWarm) return; try { var p = window.spkWarm(PROFILE.zielsprache); if (p && p.then) p.then(function(){ voiceReady = true; }, function(){}); } catch(e){} }
function speakText(text){
  if (window.spkSpeak){ try { return window.spkSpeak(text, PROFILE.zielsprache); } catch(e){} }
  try { var s = window.speechSynthesis;
    if (s && typeof SpeechSynthesisUtterance !== 'undefined'){
      var bcp = { de:'de-DE', es:'es-ES', en:'en-US', el:'el-GR' }[PROFILE.zielsprache] || 'en-US';
      var u = new SpeechSynthesisUtterance(String(text)); u.lang = bcp; s.cancel(); s.speak(u);
    } } catch(e){}
}
function playFrom(btn, text){
  var loading = !voiceReady; if (btn){ btn.classList.add(loading ? 'loading' : 'playing'); }
  var fin = function(){ voiceReady = true; if (btn){ btn.classList.remove('loading'); btn.classList.remove('playing'); } };
  var p = speakText(text); if (p && p.then){ p.then(fin, fin); } else { setTimeout(fin, 1400); }
}

// ── Quelle: Starter-Wortschatz + eigene Wörter (localStorage) ──
var WORDS = [];   // [{ wort, tr, text, own? }]
function loadOwn(){ try { var a = JSON.parse(localStorage.getItem(STORE_KEY)||'[]'); return Array.isArray(a)?a:[]; } catch(e){ return []; } }
function loadBuch(){ try { var a = JSON.parse(localStorage.getItem('spikiu_buch')||'[]'); return Array.isArray(a)?a:[]; } catch(e){ return []; } }
function saveOwn(list){ try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); } catch(e){} }
function buildWords(){
  var out = [];
  if (typeof window.spikiuWortschatz === 'function'){
    var starter = window.spikiuWortschatz(PROFILE.zielsprache, PROFILE.muttersprache) || [];
    starter.forEach(function(it){ out.push({ wort:it.wort, tr:it.tr, text:it.text || '', own:false, icon:it.icon||'' }); });
  }
  loadOwn().forEach(function(it){ if (it && it.wort) out.push({ wort:it.wort, tr:it.tr||'', text:it.text||'', own:true }); });
  var seen = {}; out.forEach(function(w){ seen[String(w.wort).trim().toLowerCase()] = 1; });
  loadBuch().forEach(function(e){
    if (!e || !e.wort) return;
    var key = String(e.roh||e.wort).trim().toLowerCase(); if (seen[key]) return; seen[key]=1;
    out.push({ wort:(e.roh||e.wort), tr:(e.tr || (window.spikiuWoerterbuch && window.spikiuWoerterbuch.tr(e.roh||e.wort, PROFILE.zielsprache, PROFILE.muttersprache)) || ''), text:'', own:false, buch:true, icon:'' });
  });
  return out;
}

// ── Deck mit echtem Verlauf ──
var deck = document.getElementById('deck');
var stepEls = [];
var pointer = 0;
var forced = {};   // step-Index → erzwungene Wort-Karte (für gerade hinzugefügte Wörter)

function deckLayout(){
  for (var i=0;i<stepEls.length;i++){
    var c = stepEls[i]; if (!c) continue;
    c.classList.remove('deck-current','deck-past','deck-next');
    c.classList.add(i < pointer ? 'deck-past' : (i === pointer ? 'deck-current' : 'deck-next'));
  }
  var b = document.getElementById('btnBack'); if (b) b.disabled = pointer <= 0;
}

function makeWordCard(wi){
  var wd = WORDS[wi] || { wort:'', tr:'', text:'' };
  var card = document.createElement('div'); card.className = 'card wort';
  card.innerHTML =
      (wd.icon ? '<div class="word-icon">' + escPlain(wd.icon) + '</div>' : '')
    + '<div class="gym-eyebrow">' + escPlain(ui().eyebrow) + '</div>'
    + '<div class="gym-wort">' + escPlain(wd.wort) + '</div>'
    + '<button class="gym-speak" type="button" aria-label="Vorlesen">' + SPK_ICON + '</button>'
    + '<div class="gym-tr">' + escPlain(wd.tr) + '</div>'
    + (wd.text ? '<div class="gym-ex">' + escPlain(wd.text) + '</div>' : '')
    + (wd.buch ? '<div class="gym-src">🍃</div>' : wd.own ? '<div class="gym-src">+</div>' : '')
    + '<div class="card-hint">' + escPlain(ui().hintFwd) + '</div>';
  var sb = card.querySelector('.gym-speak');
  if (sb) sb.onclick = function(){ playFrom(sb, wd.wort); };
  return card;
}

function makeUebungCard(wi){
  var wd = WORDS[wi] || { wort:'', tr:'', text:'' };
  // mean = richtige Übersetzung + 2 fremde Übersetzungen (datengetrieben aus dem Wortschatz)
  var others = [];
  for (var k=0;k<WORDS.length;k++){ if (k !== wi && WORDS[k].tr) others.push(WORDS[k].tr); }
  window.spikiuUebung.shuffle(others);
  var mean = [wd.tr, others[0] || '', others[1] || ''].filter(Boolean);
  var exText = (wordCount(wd.text) >= 3) ? wd.text : wd.wort;   // ohne Beispielsatz → Wort als Basis
  var item = { text: exText, tr: wd.tr, mean: mean, lang: PROFILE.zielsprache, nativeLang: uiLang() };
  // Typ: mit Beispielsatz alle vier; ohne → 'mc' (Bedeutung)
  var type = (wordCount(wd.text) >= 3)
    ? window.spikiuUebung.types[Math.floor(Math.random() * window.spikiuUebung.types.length)]
    : 'mc';

  var card = document.createElement('div'); card.className = 'card ueb-card';
  var eb = document.createElement('div'); eb.className = 'gym-eyebrow ueb'; eb.textContent = ui().uebung;
  card.appendChild(eb);
  card.appendChild(window.spikiuUebung(item, type));
  var hint = document.createElement('div'); hint.className = 'card-hint'; hint.textContent = ui().hintFwd;
  card.appendChild(hint);
  return card;
}

function ensureStep(i){
  if (i < 0 || !WORDS.length) return null;
  if (stepEls[i]) return stepEls[i];
  var card;
  if (i % 2 === 0){
    var wi = (typeof forced[i] === 'number') ? forced[i] : (Math.floor(i / 2) % WORDS.length);
    card = makeWordCard(wi);
  } else {
    var wj = (typeof forced[i-1] === 'number') ? forced[i-1] : (Math.floor(i / 2) % WORDS.length);
    card = makeUebungCard(wj);
  }
  stepEls[i] = card; deck.appendChild(card); deckLayout();
  return card;
}
function forward(){ pointer++; ensureStep(pointer); deckLayout(); }
function back(){ if (pointer > 0){ pointer--; deckLayout(); } }

// ── Daumen: links = weiter, rechts = zurück ──
function bindSwipe(){
  var x0 = null, y0 = null;
  deck.addEventListener('touchstart', function(e){ var t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; }, { passive:true });
  deck.addEventListener('touchend', function(e){
    if (x0 == null) return;
    var t = e.changedTouches[0]; var dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if (Math.abs(dx) < 45 || Math.abs(dy) > Math.abs(dx)) return;
    if (dx < 0) forward(); else back();
  }, { passive:true });
}

// ── „Wort hinzufügen" ──
var panel = document.getElementById('addPanel');
function openAdd(){
  document.getElementById('addWort').value=''; document.getElementById('addTr').value='';
  panel.hidden = false;
  setTimeout(function(){ document.getElementById('addWort').focus(); }, 30);
}
function closeAdd(){ panel.hidden = true; }
function toast(msg){
  var t = document.getElementById('gymToast'); t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1600);
}
function saveWord(){
  var wort = (document.getElementById('addWort').value || '').trim();
  var tr   = (document.getElementById('addTr').value || '').trim();
  if (!wort){ document.getElementById('addWort').focus(); return; }
  var own = loadOwn(); own.push({ wort: wort, tr: tr, text: '' }); saveOwn(own);
  WORDS.push({ wort: wort, tr: tr, text: '', own: true });
  closeAdd(); toast(ui().added);
  // direkt zeigen: die nächste Wort-Karte wird das neue Wort
  var ni = WORDS.length - 1;
  var nextWordStep = (pointer % 2 === 0) ? pointer + 2 : pointer + 1;
  forced[nextWordStep] = ni;
  pointer = nextWordStep; stepEls[pointer] = makeWordCard(ni);
  if (!stepEls[pointer].parentNode) deck.appendChild(stepEls[pointer]);
  deckLayout();
}

document.getElementById('btnBack').onclick = back;
document.getElementById('btnFwd').onclick = forward;
document.getElementById('btnAdd').onclick = openAdd;
document.getElementById('addCancel').onclick = closeAdd;
document.getElementById('addSave').onclick = saveWord;
document.getElementById('addTr').addEventListener('keydown', function(e){ if (e.key==='Enter') saveWord(); });
document.addEventListener('keydown', function(e){
  if (!panel.hidden){ if (e.key==='Escape') closeAdd(); return; }
  if (e.key === 'ArrowRight') forward();
  else if (e.key === 'ArrowLeft') back();
});

// ── Start ──
window.addEventListener('load', function(){
  var u = ui();
  document.getElementById('btnBackLbl').textContent = u.back;
  document.getElementById('btnFwdLbl').textContent = u.fwd;
  document.getElementById('btnAddLbl').textContent = u.add;
  document.getElementById('addTitle').textContent = u.addTitle;
  document.getElementById('addWort').setAttribute('placeholder', u.phWort);
  document.getElementById('addTr').setAttribute('placeholder', u.phTr);
  document.getElementById('addSave').textContent = u.save;
  document.getElementById('addCancel').textContent = u.cancel;
  document.getElementById('roomTitle').textContent = u.eyebrow;
  document.getElementById('btnHaus').onclick = function(){ location.href='haus.html'; };
  WORDS = buildWords();
  bindSwipe();
  warmVoice();
  pointer = 0; ensureStep(0); deckLayout();
});
</script>
<script type="module">
  import { speak, warm } from '/audio.js';
  window.spkSpeak = speak;
  window.spkWarm  = warm;
</script>
<script src="woerterbuch.js" defer></script>
<script src="wortschatz.js" defer></script>
<script src="uebung.js" defer></script>
</body>
</html>
