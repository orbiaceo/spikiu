<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spikiu · Wortschatz-Werkstatt</title>
<link rel="stylesheet" href="/fonts/spikiu-fonts.css">
<style>
:root{--bg:#eef7f1;--ink:#15163a;--read:#2b2621;--muted:#6b6154;--de:#fbf8f0;--sage:#9bd14a;--green:#1f93b0;--pink:#1f93b0;--gold:#a87b2e;--red:#e05252;--ow:2.5px;--warm:#c3bcae;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;line-height:1.5;display:flex;align-items:center;justify-content:center;min-height:100dvh;-webkit-font-smoothing:antialiased;}
@media (min-width:700px) and (min-height:560px){
 html{font-size:17px;}
 body{background:#15163a;background-image:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1px);background-size:22px 22px;padding:24px;}
 .app{width:min(460px,94vw);height:min(880px,90vh);border-radius:28px;box-shadow:9px 11px 0 rgba(0,0,0,.22);border:2.5px solid var(--ink);}
}
.app{position:relative;display:flex;flex-direction:column;height:100dvh;width:100%;background:var(--bg);overflow:hidden;}
.top{flex:0 0 auto;background:rgba(255,255,255,.72);border-bottom:var(--ow) solid var(--ink);padding:calc(.6rem + env(safe-area-inset-top)) .9rem .6rem;display:flex;align-items:center;gap:.6rem;}
.back{width:36px;height:36px;flex:0 0 auto;border-radius:999px;border:var(--ow) solid var(--ink);background:#fff;font-size:1.2rem;cursor:pointer;box-shadow:2px 2px 0 var(--ink);}
.back:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink);}
.tt-wrap{flex:1;text-align:center;}
.tt-wrap .rk{font:500 .58rem/1 'DM Mono',monospace;letter-spacing:.2em;color:var(--green);text-transform:uppercase;}
.tt-wrap h1{font-family:'Archivo Black',sans-serif;font-size:1.12rem;margin:.1rem 0 0;}
.deck{flex:1;position:relative;overflow:hidden;min-height:0;}
.card{position:absolute;inset:1.1rem 1rem;background:#fff;border:var(--ow) solid var(--ink);border-radius:22px;box-shadow:5px 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.9rem;padding:1.6rem 1.4rem;overflow-y:auto;transform:translateX(115%);opacity:0;pointer-events:none;transition:transform .38s cubic-bezier(.4,0,.2,1),opacity .38s ease;will-change:transform,opacity;}
.card.deck-current{transform:translateX(0) rotate(0);opacity:1;pointer-events:auto;z-index:2;}
.card.deck-next{transform:translateX(115%) rotate(1.4deg);opacity:0;z-index:1;}
.card.deck-past{transform:translateX(-115%) rotate(-1.4deg);opacity:0;z-index:1;}
.word-icon{display:block;width:96px;height:96px;flex:0 0 auto;filter:drop-shadow(2px 3px 0 rgba(21,22,58,.12));}
.gym-eyebrow{font:700 .68rem/1 'DM Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan,#1f93b0);}
.gym-eyebrow.ueb{color:var(--green);}
/* Wiedersehen (18.08.2026): eine Station ist rund geworden, weil ihre Wörter
   wiederkamen. Leise, einmalig, ohne Zahl und ohne Konfetti — kein Streak,
   keine Punkte. „Fortschritt wird gefühlt, nie gezählt." */
.pf-wieder{position:fixed;left:50%;bottom:1.6rem;transform:translateX(-50%);z-index:60;
  background:#dff2e5;border:2.5px solid #2d6a4f;border-radius:16px;
  padding:.65rem 1.1rem;max-width:min(22rem,88vw);text-align:center;
  font:700 .92rem/1.4 'DM Sans',sans-serif;color:#1d4d38;
  box-shadow:3px 3px 0 #2d6a4f;animation:pfAuf .4s ease forwards;}
.pf-wieder.weg{animation:pfZu .7s ease forwards;}
@keyframes pfAuf{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pfZu{to{opacity:0;transform:translate(-50%,8px)}}
.gym-wort{font-family:'Lora',serif;font-weight:600;font-size:clamp(1.7rem,7vw,2.4rem);line-height:1.25;color:var(--read);}
.gym-speak{width:48px;height:48px;border:var(--ow) solid var(--ink);border-radius:999px;cursor:pointer;background:var(--pink);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:3px 3px 0 var(--ink);}
.gym-speak:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
.gym-speak svg{width:20px;height:20px;}
.gym-speak.playing{animation:gymPulse 1s ease infinite;}
.gym-speak.loading svg{display:none;}
.gym-speak.loading::after{content:'';width:16px;height:16px;border:2.5px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:gymSpin .7s linear infinite;}
@keyframes gymPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
@keyframes gymSpin{to{transform:rotate(360deg);}}
.gym-tr{font-size:1.08rem;color:var(--muted);font-weight:600;}
.gym-ex{font-family:'Lora',serif;font-style:italic;font-size:1.05rem;color:#8a8378;max-width:20rem;}
.gym-ts{font-size:.9rem;color:#5f7068;max-width:20rem;margin-top:-.45rem;}   /* Übersetzung des Beispielsatzes (Leo, 12.10.) */
.gym-src{font:700 .9rem/1 'DM Mono',monospace;color:var(--sage);}
.card-hint{display:none!important;position:absolute;left:0;right:0;bottom:.7rem;font:600 .72rem/1 'DM Mono',monospace;color:var(--warm);letter-spacing:.05em;animation:gymNudge 1.8s ease-in-out infinite;}
@keyframes gymNudge{0%,100%{transform:translateX(0);opacity:.7;}50%{transform:translateX(-5px);opacity:1;}}
.deck-nav{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.7rem 1rem calc(1rem + env(safe-area-inset-bottom));border-top:var(--ow) solid var(--ink);background:rgba(255,255,255,.7);}
.deck-btn{background:#fff;border:var(--ow) solid var(--ink);color:var(--ink);border-radius:999px;padding:.6rem .9rem;font:800 .86rem/1 'DM Sans';cursor:pointer;box-shadow:3px 3px 0 var(--ink);white-space:nowrap;}
.deck-btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
.deck-btn:disabled{opacity:.35;box-shadow:none;cursor:default;}
.deck-btn.fwd{background:var(--green);color:#fff;}
.deck-btn.add{background:var(--bg);color:var(--ink);}
.add-panel{position:absolute;left:0;right:0;bottom:0;z-index:120;background:#fff;border-top:var(--ow) solid var(--ink);box-shadow:0 -6px 0 rgba(0,0,0,.08);padding:1.1rem 1.2rem calc(1.1rem + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:.6rem;}
.add-panel[hidden]{display:none;}
.add-title{font-family:'Archivo Black',sans-serif;font-size:1.05rem;}
.add-panel input{background:var(--de);border:2px solid var(--ink);border-radius:12px;padding:.7rem .9rem;font:1rem 'DM Sans';color:var(--ink);outline:none;}
.add-panel input:focus{border-color:var(--green);}
.add-row{display:flex;gap:.6rem;}
.add-row button{flex:1;border:var(--ow) solid var(--ink);border-radius:999px;padding:.7rem;font:800 .92rem 'DM Sans';cursor:pointer;box-shadow:3px 3px 0 var(--ink);}
.add-save{background:var(--green);color:#fff;}
.add-cancel{background:#fff;color:var(--ink);}
.gym-toast{position:absolute;left:50%;bottom:5.5rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.55rem 1rem;border-radius:999px;font-weight:700;font-size:.85rem;z-index:130;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:3px 3px 0 rgba(0,0,0,.3);}
.gym-toast.show{opacity:1;}
/* ── Wörter UND Wendungen in einem Deck (Leo, 16.10.2026: „fusionar vocabulary and expressions
   en una sola unidad" · „Perfecto") — die Ausdrucks-Karte sieht bewusst anders aus. ── */
.filter{flex:0 0 auto;display:flex;gap:.4rem;justify-content:center;padding:.55rem .8rem 0}
.filter button{border:2px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);font:800 .78rem/1 'DM Sans';padding:.42rem .8rem;cursor:pointer}
.filter button.an{background:var(--ink);color:#fff}
.filter .f-pfeil{align-self:center;font:800 .8rem/1 'DM Sans';color:var(--muted)}
.card.ausdruck{background:#fffaf0;justify-content:flex-start;overflow-y:auto;padding-top:1.4rem}
.card.ausdruck.satz{background:#fff;justify-content:center;padding-top:0}
.aus-eyebrow{font:700 .68rem/1 'DM Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.aus-icon{display:block;width:84px;height:84px;flex:0 0 auto;filter:drop-shadow(2px 3px 0 rgba(21,22,58,.12))}
.aus-text{font-family:'Lora',serif;font-weight:600;font-size:clamp(1.45rem,5.8vw,1.95rem);line-height:1.35;color:var(--read);max-width:21rem}
.aus-lit{font-family:'Lora',serif;font-size:1.12rem;line-height:1.4;background:#fff6d6;border:2px dashed #e0c36a;border-radius:12px;padding:.5rem .75rem;max-width:21rem}
.aus-k{font:700 .62rem/1 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-right:.3rem}
.aus-mean{font-size:1.02rem;color:var(--muted);font-weight:600;max-width:21rem}
.aus-src{font:600 .76rem/1 'DM Mono',monospace;color:#8a8378}
.aus-buch{border:2px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);font:800 .82rem/1 'DM Sans';padding:.45rem .85rem;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.aus-buch.drin{background:#dff2e5;box-shadow:none;cursor:default}
@media (prefers-reduced-motion:reduce){.card-hint{animation:none;}}
/* Ohne Wisch-Kinetik (Leo, 17.10.2026: „eliminar ese efecto … simplemente hacer aparecer la siguiente tarjeta, sea con el botón o como en Reel“): Karten erscheinen ohne Gleiten. */
.card,.card.deck-current,.card.deck-next,.card.deck-past{transform:none!important;transition:none!important}
.card.deck-next,.card.deck-past{visibility:hidden}
</style>
</head>
<body>

<div class="app">
  <div class="top"><button class="back" id="btnHaus" aria-label="zurück">‹</button><div class="tt-wrap"><h1 id="roomTitle">Wortschatz</h1></div><div style="width:36px"></div></div>
  <div id="reiter"></div>
  <div class="filter" id="filter"></div>
  <div class="deck" id="deck"></div>
  <div class="deck-nav">
    <button class="deck-btn" type="button" id="btnBack">‹ <span id="btnBackLbl">zurück</span></button>
    <button class="deck-btn add" type="button" id="btnAdd">➕ <span id="btnAddLbl">Wort</span></button>
    <button class="deck-btn fwd" type="button" id="btnFwd"><span id="btnFwdLbl">weiter</span> ›</button>
  </div>
</div>

<div class="add-panel" id="addPanel" hidden>
  <div class="add-title" id="addTitle">Wort hinzufügen</div>
  <input type="text" id="addWort" autocomplete="off">
  <input type="text" id="addTr" autocomplete="off">
  <div class="add-row">
    <button class="add-cancel" type="button" id="addCancel">Abbrechen</button>
    <button class="add-save" type="button" id="addSave">Speichern</button>
  </div>
</div>
<div class="gym-toast" id="gymToast"></div>

<script>
// ════════════════════════════════════════════════════════════════════
//  SPIKIU · RAUM „WORTSCHATZ-WERKSTATT / GYM" (Teil 52) — Tinder-Deck OHNE KI.
//  Quelle = fester Starter-Wortschatz (wortschatz.js) + eigene Wörter (localStorage).
//  Wort → Übung (uebung.js) → nächstes Wort → … Daumen links=weiter, rechts=zurück.
//  EHRLICH: KEINE erfundenen Companion-/Wackel-Daten (per-Wort-Tracking = Phase 2).
//  Anti-Gamification: kein Streak/Score. Reuse: audio.js, uebung.js, wortschatz.js. Self-contained (Pop, Rueckweg ins Haus).
// ════════════════════════════════════════════════════════════════════
var STORE_KEY = 'spikiu_wortschatz';

// ── Profil defensiv (Codes de/es/en/el) ──
var stored = {};
try { stored = (JSON.parse(localStorage.getItem('spikiu_user')||'{}').profile) || {}; } catch(e){}
function langCode(v){
  if(!v) return null; v=(''+v).toLowerCase();
  if(/^(de|es|en|el)$/.test(v)) return v;
  if(v.indexOf('deutsch')>-1||v.indexOf('german')>-1) return 'de';
  if(v.indexOf('span')>-1||v.indexOf('español')>-1) return 'es';
  if(v.indexOf('engl')>-1) return 'en';
  if(v.indexOf('griech')>-1||v.indexOf('greek')>-1||v.indexOf('ελλην')>-1) return 'el';
  return null;
}
var zielC = stored.zielsprache || langCode(stored.targetLang) || 'es';
var mutterC = stored.muttersprache || langCode(stored.nativeLang) || 'de';
var PROFILE = { zielsprache: zielC, muttersprache: mutterC };
function uiLang(){ return (['de','es','en','el'].indexOf(PROFILE.muttersprache) > -1) ? PROFILE.muttersprache : 'de'; }

var UI = {
  de:{ eyebrow:'Wortschatz', uebung:'Übung', fWort:'Wörter', fSatz:'Sätze', fAus:'Wendungen', ausEb:'Wendung', satzEb:'Satz', qWort:'Was bedeutet dieses Wort?', qRueck:'Wie sagt man das?', qSatz:'Was bedeutet dieser Satz?', lit:'wörtlich', mean:'bedeutet', insBuch:'➕ in mein Buch', imBuch:'🍃 in deinem Buch', back:'zurück', fwd:'weiter', add:'Wort', hintFwd:'← weiter wischen',
       addTitle:'Wort hinzufügen', phWort:'Wort (Zielsprache)', phTr:'Übersetzung', save:'Speichern', cancel:'Abbrechen', added:'Hinzugefügt ✓' },
  es:{ eyebrow:'Vocabulario', uebung:'Ejercicio', fWort:'Palabras', fSatz:'Frases', fAus:'Expresiones', ausEb:'Expresión', satzEb:'Frase', qWort:'¿Qué significa esta palabra?', qRueck:'¿Cómo se dice?', qSatz:'¿Qué significa esta frase?', lit:'literalmente', mean:'significa', insBuch:'➕ a mi libro', imBuch:'🍃 en tu libro', back:'atrás', fwd:'seguir', add:'Palabra', hintFwd:'← desliza para seguir',
       addTitle:'Añadir palabra', phWort:'Palabra (idioma meta)', phTr:'Traducción', save:'Guardar', cancel:'Cancelar', added:'Añadido ✓' },
  en:{ eyebrow:'Vocabulary', uebung:'Exercise', fWort:'Words', fSatz:'Sentences', fAus:'Expressions', ausEb:'Expression', satzEb:'Sentence', qWort:'What does this word mean?', qRueck:'How do you say it?', qSatz:'What does this sentence mean?', lit:'literally', mean:'means', insBuch:'➕ to my book', imBuch:'🍃 in your book', back:'back', fwd:'next', add:'Word', hintFwd:'← swipe to continue',
       addTitle:'Add a word', phWort:'Word (target language)', phTr:'Translation', save:'Save', cancel:'Cancel', added:'Added ✓' },
  el:{ eyebrow:'Λεξιλόγιο', uebung:'Εξάσκηση', fWort:'Λέξεις', fSatz:'Προτάσεις', fAus:'Εκφράσεις', ausEb:'Έκφραση', satzEb:'Πρόταση', qWort:'Τι σημαίνει αυτή η λέξη;', qRueck:'Πώς λέγεται;', qSatz:'Τι σημαίνει αυτή η πρόταση;', lit:'κατά λέξη', mean:'σημαίνει', insBuch:'➕ στο βιβλίο μου', imBuch:'🍃 στο βιβλίο σου', back:'πίσω', fwd:'συνέχεια', add:'Λέξη', hintFwd:'← σύρε για να συνεχίσεις',
       addTitle:'Πρόσθεσε μια λέξη', phWort:'Λέξη (γλώσσα που μαθαίνεις)', phTr:'Μετάφραση', save:'Αποθήκευση', cancel:'Ακύρωση', added:'Προστέθηκε ✓' }
};
function ui(){ return UI[uiLang()] || UI.de; }

var SPK_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4.03v8.06A4.5 4.5 0 0016.5 12z"/></svg>';
var CAPY_SVG = '<svg viewBox="0 0 80 80" fill="none">'
  + '<ellipse cx="40" cy="50" rx="28" ry="20" fill="#c9956a"/><ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/>'
  + '<ellipse cx="40" cy="36" rx="10" ry="7" fill="#b8845a"/><ellipse cx="40" cy="33" rx="4" ry="2.5" fill="#8b5e3c"/>'
  + '<circle cx="38" cy="33" r="1" fill="#6b4226"/><circle cx="42" cy="33" r="1" fill="#6b4226"/>'
  + '<g class="spk-capy-eyes"><circle cx="33" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="47" cy="24" r="3.5" fill="#3d2b1f"/>'
  + '<circle cx="34" cy="23" r="1.2" fill="white"/><circle cx="48" cy="23" r="1.2" fill="white"/></g>'
  + '<ellipse cx="26" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="54" cy="17" rx="6" ry="5" fill="#b8845a"/>'
  + '<ellipse cx="22" cy="66" rx="7" ry="5" fill="#b8845a"/><ellipse cx="34" cy="68" rx="7" ry="5" fill="#b8845a"/>'
  + '<ellipse cx="46" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="58" cy="66" rx="7" ry="5" fill="#b8845a"/>'
  + '<path class="spk-capy-mouth" d="M36 38 Q40 41 44 38" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>';
function escPlain(t){ return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function wordCount(t){ return String(t||'').trim().split(/\s+/).filter(Boolean).length; }

// ── Audio (🔊) ──
var voiceReady = false;
function warmVoice(){ if (!window.spkWarm) return; try { var p = window.spkWarm(PROFILE.zielsprache); if (p && p.then) p.then(function(){ voiceReady = true; }, function(){}); } catch(e){} }
function speakText(text){
  if (window.spkSpeak){ try { return window.spkSpeak(text, PROFILE.zielsprache); } catch(e){} }
  try { var s = window.speechSynthesis;
    if (s && typeof SpeechSynthesisUtterance !== 'undefined'){
      var bcp = { de:'de-DE', es:'es-ES', en:'en-US', el:'el-GR' }[PROFILE.zielsprache] || 'en-US';
      var u = new SpeechSynthesisUtterance(String(text)); u.lang = bcp; s.cancel(); s.speak(u);
    } } catch(e){}
}
function playFrom(btn, text){
  var loading = !voiceReady; if (btn){ btn.classList.add(loading ? 'loading' : 'playing'); }
  var fin = function(){ voiceReady = true; if (btn){ btn.classList.remove('loading'); btn.classList.remove('playing'); } };
  var p = speakText(text); if (p && p.then){ p.then(fin, fin); } else { setTimeout(fin, 1400); }
}

// ── Quelle: Starter-Wortschatz + eigene Wörter (localStorage) ──
var WORDS = [];   // [{ wort, tr, text, own? }]
function loadOwn(){ try { var a = JSON.parse(localStorage.getItem(STORE_KEY)||'[]'); return Array.isArray(a)?a:[]; } catch(e){ return []; } }
function loadBuch(){ try { var a = JSON.parse(localStorage.getItem('spikiu_buch')||'[]'); return Array.isArray(a)?a:[]; } catch(e){ return []; } }
function saveOwn(list){ try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); } catch(e){} }
function buildWords(){
  var out = [];
  // ── Quelle 1: die berührten Stationen des Lernpfads ──────────────────
  // Das Gym übt, was der Lernpfad lehrt. Wackelnde Wörter kommen zuerst,
  // bereits sitzende ruhen. Erst wenn daraus nichts (mehr) kommt, greift
  // der feste Starter-Wortschatz — sonst übt man an der Reise vorbei.
  // Zielsprach-Wache: Stationswörter nur, wenn die geladenen Daten zur Zielsprache passen
  // (z. B. Griechisch hat noch keinen Lernpfad → nur Starter-Wortschatz, nie fremde Wörter).
  if (window.SpikiuWoerter && window.SpikiuPfad && window.SpikiuLernpfad
      && window.SpikiuLernpfad.zielsprache === PROFILE.zielsprache){
    try {
      var ausPfad = window.SpikiuWoerter.ausStationen(PROFILE.zielsprache, PROFILE.muttersprache) || [];
      ausPfad.forEach(function(it){
        out.push({ wort:it.wort, tr:it.tr, text:it.text || '', ts:it.ts || '', own:false, icon:'', station:it.station });
      });
    } catch(e){}
  }
  // ── Quelle 2: fester Starter-Wortschatz ──────────────────────────────
  if (typeof window.spikiuWortschatz === 'function'){
    var starter = window.spikiuWortschatz(PROFILE.zielsprache, PROFILE.muttersprache) || [];
    starter.forEach(function(it){ out.push({ wort:it.wort, tr:it.tr, text:it.text || '', ts:it.ts || '', own:false, icon:it.icon||'', konzept:it.konzept||'' }); });
  }
  loadOwn().forEach(function(it){ if (it && it.wort) out.push({ wort:it.wort, tr:it.tr||'', text:it.text||'', own:true }); });
  var seen = {}; out.forEach(function(w){ seen[String(w.wort).trim().toLowerCase()] = 1; });
  loadBuch().forEach(function(e){
    if (!e || !e.wort || e.quelle === 'ausdruck') return;   // Wendungen laufen im eigenen Strang
    var key = String(e.roh||e.wort).trim().toLowerCase(); if (seen[key]) return; seen[key]=1;
    out.push({ wort:(e.roh||e.wort), tr:(e.tr || (window.spikiuWoerterbuch && window.spikiuWoerterbuch.tr(e.roh||e.wort, PROFILE.zielsprache, PROFILE.muttersprache)) || ''), text:'', own:false, buch:true, icon:'' });
  });
  // Doppelte entfernen: ein Wort aus einer Station schlägt dasselbe Wort
  // aus dem Starter-Set, weil es die Station kennt.
  var gesehen = {}, sauber = [];
  out.forEach(function(w){
    var k = String(w.wort).trim().toLowerCase();
    if (gesehen[k]) return;
    gesehen[k] = 1; sauber.push(w);
  });
  return sauber;
}

// ── DREI STUFEN: Wörter → Sätze → Wendungen (Leo, 17.10.2026) ─────────────
//  „Zuerst mit Wörtern beginnen, dann Sätze und dann Wendungen." Kein gemischtes
//  „Alles" mehr: ein Anfänger kennt die Wörter des Satzes noch nicht und kann so
//  weder den Eindringling noch die Lücke finden. Erst die Wörter, dann erkennt er
//  sie in Sätzen und Wendungen wieder.
//   Wörter    — nur Einzelwörter; Übung: Bedeutung wählen oder umgekehrt.
//   Sätze     — Beispielsätze der Stationswörter + kurze Alltagssätze (kurzsaetze,
//               art 'satz', bis zur eigenen Stufe); Übung: Eindringling, Lücke,
//               Reihenfolge, Bedeutung.
//   Wendungen — nur Wendungen, Giros, Sprichwörter (Samen/Stamm: Stamm-Wendungen,
//               Krone: + Redewendungen und Sprichwörter). Aus „Mein Buch" zuerst.
var AUS = [];      // [{ text, lit, mean, icon, src }]
var SAETZE = [];   // [{ text, mean, stufe }]
var FILTER = 'wort';
function aktStufe(){ try { var P = window.SpikiuPfad; if (P && P.existiert && P.existiert()) return P.stufe(); } catch(e){} return 'a1'; }
function mtVon(o){ if (!o) return ''; var m = PROFILE.muttersprache; return o[m] || (m === 'el' ? o.en : '') || o.de || o.en || o.es || ''; }
function stufenBis(st){ return st === 'b1' ? ['b1','a2','a1'] : (st === 'a2' ? ['a2','a1'] : ['a1']); }
function mische(a){ if (window.spikiuUebung && window.spikiuUebung.shuffle) window.spikiuUebung.shuffle(a); return a; }
function buildAusdruecke(){
  var z = PROFILE.zielsprache, st = aktStufe(), out = [];
  var KS = (window.spikiuKurzsaetze || {})[z] || {}, SP = window.spikiuSprichwort || {};
  var dazu = function(text, lit, mean, icon, src, k){ if (text && mean) out.push({ text:text, lit:lit || '', mean:mean, icon:icon || '', src:src || '', stufe:k }); };
  // Wer Wendungen wählt, will die Schwierigkeit steigern: auch im Samen gibt es die Stamm-Wendungen.
  var stufen = st === 'b1' ? ['b1','a2','a1'] : ['a2','a1'];
  stufen.forEach(function(k){
    (KS[k] || []).forEach(function(x){ if (x.art !== 'satz') dazu(x.z, '', mtVon(x.t), '', '', k); });
    if (k === 'a2') ((SP.wendungen || {})[z] || []).forEach(function(p){ dazu(p.text, mtVon(p.w), mtVon(p.t), p.icon, p.src, k); });
    if (k === 'b1') ((SP.daten || {})[z] || []).forEach(function(p){ dazu(p.text, mtVon(p.w), mtVon(p.t), p.icon, p.src, k); });
  });
  // Doppelte raus; Wendungen aus dem Buch nach vorn.
  var imBuch = {}; loadBuch().forEach(function(e){ if (e && e.quelle === 'ausdruck') imBuch[String(e.roh || e.wort).trim().toLowerCase()] = 1; });
  var seen = {}, sauber = [];
  out.forEach(function(a){ var k = a.text.trim().toLowerCase(); if (seen[k]) return; seen[k] = 1; sauber.push(a); });
  var vorn = sauber.filter(function(a){ return imBuch[a.text.trim().toLowerCase()]; });
  // Danach die höchste Stufe zuerst (Krone: echte Sprichwörter und Redewendungen), je Stufe gemischt.
  var rest = [];
  stufen.forEach(function(k){
    rest = rest.concat(mische(sauber.filter(function(a){ return a.stufe === k && !imBuch[a.text.trim().toLowerCase()]; })));
  });
  return vorn.concat(rest);
}
function buildSaetze(){
  var z = PROFILE.zielsprache, st = aktStufe(), out = [], seen = {};
  var dazu = function(text, mean){
    text = String(text || '').trim(); if (!text || !mean || wordCount(text) < 3) return;
    var k = text.toLowerCase(); if (seen[k]) return; seen[k] = 1; out.push({ text:text, mean:mean });
  };
  // 1. Beispielsätze der geübten Wörter (Lernpfad zuerst): dieselben Wörter, jetzt im Satz.
  var ausWoertern = [];
  WORDS.forEach(function(w){ if (w.text && w.ts) ausWoertern.push([w.text, w.ts]); });
  // 2. Kurze Alltagssätze bis zur eigenen Stufe.
  var KS = (window.spikiuKurzsaetze || {})[z] || {}, kurz = [];
  stufenBis(st).slice().reverse().forEach(function(k){
    (KS[k] || []).forEach(function(x){ if (x.art === 'satz') kurz.push([x.z, mtVon(x.t)]); });
  });
  // Abwechselnd, damit beide Quellen früh vorkommen.
  mische(kurz);
  var n = Math.max(ausWoertern.length, kurz.length);
  for (var i = 0; i < n; i++){
    if (ausWoertern[i]) dazu(ausWoertern[i][0], ausWoertern[i][1]);
    if (kurz[i]) dazu(kurz[i][0], kurz[i][1]);
  }
  return out;
}
var UNITS = [];    // [{ typ:'wort'|'satz'|'aus', i }]
function buildUnits(){
  var u = [];
  if (FILTER === 'aus' && AUS.length)     { AUS.forEach(function(a, i){ u.push({ typ:'aus', i:i }); }); return u; }
  if (FILTER === 'satz' && SAETZE.length) { SAETZE.forEach(function(a, i){ u.push({ typ:'satz', i:i }); }); return u; }
  WORDS.forEach(function(w, i){ u.push({ typ:'wort', i:i }); });
  return u;
}
function ausIcon(e){
  if (!e) return '';
  var src = (window.spikiuIcon && window.spikiuIcon.datei) ? window.spikiuIcon.datei(e) : '';
  return src ? '<img class="aus-icon" src="' + src + '" alt="" aria-hidden="true" width="84" height="84">' : '';
}
function istImBuch(text){ var k = String(text).trim().toLowerCase(); return loadBuch().some(function(e){ return e && e.quelle === 'ausdruck' && String(e.roh || e.wort).trim().toLowerCase() === k; }); }
function insBuch(a){
  try { var b = loadBuch(); if (istImBuch(a.text)) return;
        b.push({ wort: String(a.text).trim().toLowerCase(), roh: a.text, tr: a.mean, quelle: 'ausdruck', t: Date.now() });
        localStorage.setItem('spikiu_buch', JSON.stringify(b)); } catch(e){}
}
function makeAusdruckCard(ai){
  var a = AUS[ai] || { text:'', lit:'', mean:'' }, u = ui();
  var card = document.createElement('div'); card.className = 'card ausdruck';
  var drin = istImBuch(a.text);
  card.innerHTML = '<div class="aus-eyebrow">' + escPlain(u.ausEb) + '</div>'
    + ausIcon(a.icon)
    + '<div class="aus-text">' + escPlain(a.text) + '</div>'
    + '<button class="gym-speak" type="button" aria-label="Vorlesen">' + SPK_ICON + '</button>'
    + (a.lit && a.lit !== a.mean ? '<div class="aus-lit"><span class="aus-k">' + escPlain(u.lit) + '</span>' + escPlain(a.lit) + '</div>' : '')
    + '<div class="aus-mean"><span class="aus-k">' + escPlain(u.mean) + '</span>' + escPlain(a.mean) + '</div>'
    + (a.src ? '<div class="aus-src">— ' + escPlain(a.src) + '</div>' : '')
    + '<button class="aus-buch' + (drin ? ' drin' : '') + '" type="button">' + escPlain(drin ? u.imBuch : u.insBuch) + '</button>';
  var sb = card.querySelector('.gym-speak'); if (sb) sb.onclick = function(){ playFrom(sb, a.text); };
  var bb = card.querySelector('.aus-buch');
  bb.onclick = function(){ if (bb.classList.contains('drin')) return; insBuch(a); bb.classList.add('drin'); bb.textContent = u.imBuch; };
  return card;
}
function makeAusdruckUebung(ai){
  var a = AUS[ai] || { text:'', mean:'' };
  var others = []; AUS.forEach(function(x, k){ if (k !== ai && x.mean && x.mean !== a.mean) others.push(x.mean); });
  window.spikiuUebung.shuffle(others);
  var mean = [a.mean, others[0] || '', others[1] || ''].filter(Boolean);
  var item = { text: a.text, tr: a.mean, mean: mean, lang: PROFILE.zielsprache, nativeLang: uiLang() };
  var type = (wordCount(a.text) >= 3) ? window.spikiuUebung.types[Math.floor(Math.random() * window.spikiuUebung.types.length)] : 'mc';
  var card = document.createElement('div'); card.className = 'card ueb-card';
  var eb = document.createElement('div'); eb.className = 'gym-eyebrow ueb'; eb.textContent = ui().uebung;
  card.appendChild(eb);
  var uebEl = window.spikiuUebung(item, type); card.appendChild(uebEl);
  if (window.SpikiuWoerter) uebEl.addEventListener('ueb-done', function(ev){ try { window.SpikiuWoerter.melde(PROFILE.zielsprache, a.text, !!(ev.detail && ev.detail.ok), null); } catch(e){} });
  return card;
}
function makeSatzCard(si){
  var a = SAETZE[si] || { text:'', mean:'' }, u = ui();
  var card = document.createElement('div'); card.className = 'card ausdruck satz';
  card.innerHTML = '<div class="aus-eyebrow">' + escPlain(u.satzEb) + '</div>'
    + '<div class="aus-text">' + escPlain(a.text) + '</div>'
    + '<button class="gym-speak" type="button" aria-label="Vorlesen">' + SPK_ICON + '</button>'
    + '<div class="aus-mean">' + escPlain(a.mean) + '</div>';
  var sb = card.querySelector('.gym-speak'); if (sb) sb.onclick = function(){ playFrom(sb, a.text); };
  return card;
}
function makeSatzUebung(si){
  var a = SAETZE[si] || { text:'', mean:'' }, U = window.spikiuUebung;
  var others = []; SAETZE.forEach(function(x, k){ if (k !== si && x.mean && x.mean !== a.mean) others.push(x.mean); });
  U.shuffle(others);
  var mean = [a.mean, others[0] || '', others[1] || ''].filter(Boolean);
  var item = { text: a.text, tr: a.mean, mean: mean, lang: PROFILE.zielsprache, nativeLang: uiLang(), frage: ui().qSatz };
  var type = U.types[Math.floor(Math.random() * U.types.length)];
  var card = document.createElement('div'); card.className = 'card ueb-card';
  var eb = document.createElement('div'); eb.className = 'gym-eyebrow ueb'; eb.textContent = ui().uebung;
  card.appendChild(eb); card.appendChild(U(item, type));
  return card;
}
function baueFilter(){
  var f = document.getElementById('filter'), u = ui(); if (!f) return;
  var stufen = [['wort', u.fWort]];
  if (SAETZE.length) stufen.push(['satz', u.fSatz]);
  if (AUS.length) stufen.push(['aus', u.fAus]);
  if (stufen.length < 2) { f.innerHTML = ''; return; }
  f.innerHTML = stufen.map(function(x){
    return '<button type="button" data-f="' + x[0] + '"' + (FILTER === x[0] ? ' class="an"' : '') + '>' + escPlain(x[1]) + '</button>';
  }).join('<span class="f-pfeil" aria-hidden="true">›</span>');
  [].forEach.call(f.querySelectorAll('button'), function(b){
    b.onclick = function(){ FILTER = b.getAttribute('data-f'); baueFilter(); neuStart(0); sitzSichern(); };
  });
}
function neuStart(p){
  stepEls.forEach(function(c){ if (c && c.parentNode) c.parentNode.removeChild(c); });
  stepEls = []; forced = {}; UNITS = buildUnits(); pointer = 0;
  for (var k = 0; k <= (p || 0); k++) ensureStep(k);
  pointer = p || 0; deckLayout();
}
// Sitzungs-Persistenz (Pflicht je Raum): Filter + Kartenstand, entprellt.
var sitzT = null;
function sitzSichern(){
  clearTimeout(sitzT);
  sitzT = setTimeout(function(){ try { if (window.spikiuSitzung) window.spikiuSitzung.speichere('gym', { filter: FILTER, pointer: pointer, ziel: PROFILE.zielsprache }); } catch(e){} }, 350);
}

// ── Deck mit echtem Verlauf ──
var deck = document.getElementById('deck');
var stepEls = [];
var pointer = 0;
var forced = {};   // step-Index → erzwungene Wort-Karte (für gerade hinzugefügte Wörter)

function deckLayout(){
  for (var i=0;i<stepEls.length;i++){
    var c = stepEls[i]; if (!c) continue;
    c.classList.remove('deck-current','deck-past','deck-next');
    c.classList.add(i < pointer ? 'deck-past' : (i === pointer ? 'deck-current' : 'deck-next'));
  }
  var b = document.getElementById('btnBack'); if (b) b.disabled = pointer <= 0;
}

// Emoji → self-hosted OpenMoji-SVG (bilder/om-<Codepunkte>.svg), wie in proverbios.html.
function omIcon(e){
  if (!e) return '';
  var src = (window.spikiuIcon && window.spikiuIcon.datei) ? window.spikiuIcon.datei(e) : '';
  if (!src) return '';
  return '<img class="word-icon" src="' + src + '" alt="" aria-hidden="true" width="96" height="96">';
}

function makeWordCard(wi){
  var wd = WORDS[wi] || { wort:'', tr:'', text:'' };
  var card = document.createElement('div'); card.className = 'card wort';
  card.innerHTML =
        omIcon((window.spikiuIcon && ((wd.konzept && window.spikiuIcon.konzept(wd.konzept)) || window.spikiuIcon(wd.wort))) || wd.icon)
    + '<div class="gym-wort">' + escPlain(wd.wort) + '</div>'
    + '<button class="gym-speak" type="button" aria-label="Vorlesen">' + SPK_ICON + '</button>'
    + '<div class="gym-tr">' + escPlain(wd.tr) + '</div>'
    + (wd.buch ? '<div class="gym-src">🍃</div>' : wd.own ? '<div class="gym-src">+</div>' : '')
    ;  /* „weiter wischen“ entfernt (Leo, 15.10.) */
  var sb = card.querySelector('.gym-speak');
  if (sb) sb.onclick = function(){ playFrom(sb, wd.wort); };
  return card;
}

function makeUebungCard(wi){
  var wd = WORDS[wi] || { wort:'', tr:'', text:'' };
  // Nur das Wort selbst — keine Satzübung (Sätze haben ihre eigene Stufe).
  // Abwechselnd: Wort → Bedeutung wählen, oder Bedeutung → Wort wählen.
  var rueck = !!wd.tr && Math.random() < 0.5;
  var andere = [];
  for (var k=0;k<WORDS.length;k++){
    if (k === wi) continue;
    var v = rueck ? WORDS[k].wort : WORDS[k].tr;
    if (v && v !== (rueck ? wd.wort : wd.tr) && andere.indexOf(v) < 0) andere.push(v);
  }
  window.spikiuUebung.shuffle(andere);
  var richtig = rueck ? wd.wort : wd.tr;
  var mean = [richtig, andere[0] || '', andere[1] || ''].filter(Boolean);
  var item = { text: rueck ? wd.tr : wd.wort, tr: richtig, mean: mean, lang: PROFILE.zielsprache, nativeLang: uiLang(),
               frage: rueck ? ui().qRueck : ui().qWort };
  var type = 'mc';

  var card = document.createElement('div'); card.className = 'card ueb-card';
  var eb = document.createElement('div'); eb.className = 'gym-eyebrow ueb'; eb.textContent = ui().uebung;
  card.appendChild(eb);
  var uebEl = window.spikiuUebung(item, type);
  card.appendChild(uebEl);
  // Rückweg zum Lernpfad: uebung.js feuert 'ueb-done' mit detail.ok.
  // Erkannt oder gewackelt wird gemeldet — ein Fehlgriff löscht nichts,
  // er holt das Wort nur öfter zurück (siehe woerter.js).
  if (window.SpikiuWoerter){
    uebEl.addEventListener('ueb-done', function(ev){
      try {
        window.SpikiuWoerter.melde(PROFILE.zielsprache, wd.wort, !!(ev.detail && ev.detail.ok), wd.station || null);
        var frisch = window.SpikiuWoerter.pruefeStationen(PROFILE.zielsprache) || [];
        if (frisch.length) zeigeWiedersehen(frisch);
      } catch(e){}
    });
  }
  return card;
}

// Eine Station ist rund geworden. Leise, einmalig, ohne Zahl und ohne Konfetti —
// „Fortschritt wird gefühlt, nie gezählt." Kein Streak, keine Punkte.
function zeigeWiedersehen(frisch){
  var D = window.SpikiuLernpfad; if (!D) return;
  var alt = document.getElementById('pfWieder'); if (alt) alt.remove();
  var namen = frisch.map(function(x){
    var t = D.thema(x.thema);
    return t ? (t.em + ' ' + (t.na[uiLang()] || t.na.en || t.na.de)) : '';
  }).filter(Boolean).join(' · ');
  if (!namen) return;
  var TXT = { de:' sitzt jetzt.', es:' ya se te ha quedado.', en:' has settled.', el:' το έμαθες πια.' };
  var box = document.createElement('div');
  box.id = 'pfWieder'; box.className = 'pf-wieder';
  box.textContent = namen + (TXT[uiLang()] || TXT.de);
  document.body.appendChild(box);
  setTimeout(function(){ box.classList.add('weg'); }, 3200);
  setTimeout(function(){ if (box.parentNode) box.remove(); }, 4000);
}

function ensureStep(i){
  if (i < 0 || !UNITS.length) return null;
  if (stepEls[i]) return stepEls[i];
  var card, unit = UNITS[Math.floor(i / 2) % UNITS.length];
  if (typeof forced[i - (i % 2)] === 'number') unit = { typ:'wort', i: forced[i - (i % 2)] };
  if (unit.typ === 'aus') card = (i % 2 === 0) ? makeAusdruckCard(unit.i) : makeAusdruckUebung(unit.i);
  else if (unit.typ === 'satz') card = (i % 2 === 0) ? makeSatzCard(unit.i) : makeSatzUebung(unit.i);
  else card = (i % 2 === 0) ? makeWordCard(unit.i) : makeUebungCard(unit.i);
  stepEls[i] = card; deck.appendChild(card); deckLayout();
  return card;
}
function forward(){ pointer++; ensureStep(pointer); deckLayout(); sitzSichern(); }
function back(){ if (pointer > 0){ pointer--; deckLayout(); sitzSichern(); } }

// ── Daumen: links = weiter, rechts = zurück ──
function bindSwipe(){
  var x0 = null, y0 = null;
  deck.addEventListener('touchstart', function(e){ var t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; }, { passive:true });
  deck.addEventListener('touchend', function(e){
    if (x0 == null) return;
    var t = e.changedTouches[0]; var dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if (Math.abs(dx) < 45 || Math.abs(dy) > Math.abs(dx)) return;
    if (dx < 0) forward(); else back();
  }, { passive:true });
}

// ── „Wort hinzufügen" ──
var panel = document.getElementById('addPanel');
function openAdd(){
  document.getElementById('addWort').value=''; document.getElementById('addTr').value='';
  panel.hidden = false;
  setTimeout(function(){ document.getElementById('addWort').focus(); }, 30);
}
function closeAdd(){ panel.hidden = true; }
function toast(msg){
  var t = document.getElementById('gymToast'); t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1600);
}
function saveWord(){
  var wort = (document.getElementById('addWort').value || '').trim();
  var tr   = (document.getElementById('addTr').value || '').trim();
  if (!wort){ document.getElementById('addWort').focus(); return; }
  var own = loadOwn(); own.push({ wort: wort, tr: tr, text: '' }); saveOwn(own);
  WORDS.push({ wort: wort, tr: tr, text: '', own: true });
  closeAdd(); toast(ui().added);
  // direkt zeigen: die nächste Wort-Karte wird das neue Wort
  var ni = WORDS.length - 1;
  var nextWordStep = (pointer % 2 === 0) ? pointer + 2 : pointer + 1;
  forced[nextWordStep] = ni;
  pointer = nextWordStep; stepEls[pointer] = makeWordCard(ni);
  if (!stepEls[pointer].parentNode) deck.appendChild(stepEls[pointer]);
  deckLayout();
}

document.getElementById('btnBack').onclick = back;
document.getElementById('btnFwd').onclick = forward;
document.getElementById('btnAdd').onclick = openAdd;
document.getElementById('addCancel').onclick = closeAdd;
document.getElementById('addSave').onclick = saveWord;
document.getElementById('addTr').addEventListener('keydown', function(e){ if (e.key==='Enter') saveWord(); });
document.addEventListener('keydown', function(e){
  if (!panel.hidden){ if (e.key==='Escape') closeAdd(); return; }
  if (e.key === 'ArrowRight') forward();
  else if (e.key === 'ArrowLeft') back();
});

// ── Start ──
window.addEventListener('load', function(){
  var u = ui();
  document.getElementById('btnBackLbl').textContent = u.back;
  document.getElementById('btnFwdLbl').textContent = u.fwd;
  document.getElementById('btnAddLbl').textContent = u.add;
  document.getElementById('addTitle').textContent = u.addTitle;
  document.getElementById('addWort').setAttribute('placeholder', u.phWort);
  document.getElementById('addTr').setAttribute('placeholder', u.phTr);
  document.getElementById('addSave').textContent = u.save;
  document.getElementById('addCancel').textContent = u.cancel;
  document.getElementById('roomTitle').textContent = u.eyebrow;
  // Raum Wortschatz = Karten · Feines Ohr · Der Schlag (Leo, 17.10.2026)
  try { if (window.spikiuWortschatzReiter) document.getElementById('reiter').appendChild(window.spikiuWortschatzReiter.leiste('karten', uiLang())); } catch(e){}
  document.getElementById('btnHaus').onclick = function(){ location.href='haus.html'; };
  WORDS = buildWords();
  AUS = buildAusdruecke();
  SAETZE = buildSaetze();
  bindSwipe();
  warmVoice();
  // Wiederkommen: nur bei einer wirklich angefangenen Runde.
  var sv = null; try { sv = window.spikiuSitzung ? window.spikiuSitzung.lade('gym') : null; } catch(e){ sv = null; }
  if (sv && sv.ziel === PROFILE.zielsprache && ['wort','satz','aus'].indexOf(sv.filter) > -1) FILTER = sv.filter;   // altes 'alle' → Wörter
  baueFilter();
  if (sv && sv.ziel === PROFILE.zielsprache && (sv.pointer || 0) >= 2 && window.spikiuSitzung && window.spikiuSitzung.frageWiederkommen){
    neuStart(0);
    window.spikiuSitzung.frageWiederkommen({ raum:'gym', ts: sv.ts, wo: u.eyebrow,
      beimWeiter: function(){ neuStart(sv.pointer); },
      beimNeu: function(){ try { window.spikiuSitzung.raeume('gym'); } catch(e){} FILTER = 'wort'; baueFilter(); neuStart(0); } });
  } else {
    neuStart(0);
  }
});
