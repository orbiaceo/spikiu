<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wohin gehört's</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Lora:wght@500;600&family=DM+Sans:wght@500;600;700;800&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: Handy-Säule. Raum „Wortschatz" wie wortschatz.html, jetzt mit sechster Kachel „Wohin gehört's?" (ersetzt „Auf dem Markt" im Spielzimmer). Darin: erst hören, dann in den Korb. */
:root{--bg:#eef7f1;--card:#ffffff;--ink:#15163a;--mid:#5f7068;--acc:#1f93b0;--ok:#c7e89a;--warn:#c67a1e;--warn2:#fbf0e0;--yel:#ffd24a;
 --f-head:'Archivo Black','DM Sans',system-ui,sans-serif;--f-ui:'DM Sans',system-ui,sans-serif;--f-read:'Lora',Georgia,serif;--f-mono:'DM Mono',ui-monospace,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);margin:0}
.app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:.6rem;padding-block:.6rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:2.5px solid var(--ink);background:rgba(255,255,255,.75)}
.zur{width:42px;height:42px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);font:800 1.1rem var(--f-ui);color:var(--ink)}
.top .tt{flex:1;text-align:center}
.top small{display:block;font:500 .62rem var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
.top b{font:400 1.25rem var(--f-head)}
.proto{font:500 .6rem var(--f-mono);letter-spacing:.1em;padding:0 16px;text-transform:uppercase;color:var(--mid);text-align:center;margin:.5rem 0 0}
.schalter{display:flex;justify-content:center;gap:.4rem;margin:.35rem 0 0}
.schalter[hidden]{display:none}
.schalter button{font:700 .72rem var(--f-ui);border:1.5px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);padding:.2rem .6rem;cursor:pointer}
.schalter button.on{background:var(--ink);color:#fff}
.buehne{flex:1;min-height:0;display:flex;flex-direction:column;padding-block:.8rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.karte{flex:1;min-height:0;background:var(--card);border:2.5px solid var(--ink);border-radius:22px;box-shadow:5px 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;padding:1.2rem 1rem;text-align:center;animation:rein .35s ease}
@keyframes rein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.em{font-size:4.2rem;line-height:1}
.wort{font:600 clamp(1.7rem,7vw,2.3rem)/1.2 var(--f-read)}
.tr{font-weight:600;color:var(--mid);font-size:1.05rem}
.spk{width:52px;height:52px;border-radius:50%;border:2.5px solid var(--ink);background:var(--acc);color:#fff;font-size:1.2rem;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.zaehl{font:500 .7rem var(--f-mono);color:var(--mid);letter-spacing:.08em}
.aufgabe{font:600 1.15rem/1.3 var(--f-read);margin:0;text-wrap:balance}
.kl{font-size:.82rem;color:var(--mid);font-weight:600;margin:-.4rem 0 0}
.ware{min-width:9rem;min-height:4.2rem;display:flex;align-items:center;justify-content:center;gap:.5rem;font:600 1.7rem var(--f-read);border:2.5px solid var(--ink);border-radius:18px;padding:.6rem 1.1rem;background:var(--yel);box-shadow:3px 4px 0 var(--ink);cursor:pointer;color:var(--ink)}
.ware .ohr{font-size:2rem}
.ware.neu{animation:pop .35s ease}@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.06)}100%{transform:none}}
.koerbe{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.korb{background:#fff;border:2.5px solid var(--ink);border-radius:14px 14px 30px 30px;box-shadow:3px 4px 0 var(--ink);padding:10px 8px;min-height:9rem;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--ink);font-family:var(--f-ui)}
.korb .ki{font-size:1.8rem}.korb b{font-weight:800;font-size:.95rem}
.korb .inhalt{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.korb .inhalt span{font:500 .82rem var(--f-read);background:var(--ok);border-radius:8px;padding:1px 7px}
.korb.no{border-color:var(--warn);background:var(--warn2);animation:wack .4s}
@keyframes wack{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{min-height:2.6em;font:700 1rem/1.3 var(--f-ui);color:#2f6b3a;text-wrap:balance}
.fb em{font:600 1.05rem var(--f-read);font-style:normal}
.fb.soft{color:var(--warn)}
.fuss{display:flex;justify-content:space-between;gap:12px;padding-block:.2rem calc(.9rem + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{border:2.5px solid var(--ink);border-radius:999px;box-shadow:3px 4px 0 var(--ink);padding:.7rem 1.2rem;font:800 1rem var(--f-ui);background:#fff;color:var(--ink);cursor:pointer}
.btn.pri{background:var(--acc);color:#fff}
.btn[disabled]{opacity:.38;box-shadow:none;cursor:default}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
/* Raum Wortschatz wie wortschatz.html: jetzt sechs gleich große Kacheln, 3 Reihen × 2 */
.raum{flex:1;min-height:0;display:flex;flex-direction:column;gap:.8rem}
.gruss{display:flex;align-items:flex-end;gap:.6rem}.gruss .bub{background:#fff;border:2.5px solid var(--ink);border-radius:16px 16px 16px 4px;padding:.55rem .8rem;font-weight:600;font-size:.9rem;line-height:1.35;box-shadow:2px 3px 0 var(--ink)}
.gruss .cap{font-size:2.4rem}
.doors{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:.85rem;min-height:22rem}
.door{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;text-align:center;padding:.7rem .5rem;border:2.5px solid var(--ink);border-radius:20px;box-shadow:4px 5px 0 var(--ink);cursor:pointer;color:var(--ink);font-family:var(--f-ui);position:relative}
.door .emo{font-size:2.3rem;line-height:1}.door b{font:800 .95rem/1.1 var(--f-ui)}
.door span.d{font-size:.72rem;line-height:1.2;font-weight:600;color:rgba(21,22,58,.72)}
.door.neu::after{content:"neu";position:absolute;top:8px;right:10px;font:800 .6rem var(--f-ui);background:var(--yel);border:1.5px solid var(--ink);border-radius:999px;padding:0 .35rem}
.toast{position:fixed;left:50%;bottom:calc(5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:.55rem .9rem;font-weight:600;font-size:.88rem;max-width:88vw;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><button class="zur" type="button" aria-label="zurück" id="zur">‹</button><div class="tt"><small>Übung</small><b id="kopf">Wortschatz</b></div><span style="width:42px"></span></div>
  <p class="proto">Prototyp · Spanisch, für Deutschsprachige</p>
  <div class="schalter" id="schalter"><button type="button" data-m="hoeren" class="on">Erst nur hören</button><button type="button" data-m="sehen">Wort gleich zeigen</button></div>
  <div class="buehne" id="buehne"></div>
  <div class="fuss" id="fuss"></div>
</div>
<div class="toast" id="toast"></div>
<div style="display:none">
</div>
