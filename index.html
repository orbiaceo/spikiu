<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spikiu</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,700;1,400;1,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#f6f3ec;--white:#fff;--ink:#1a1816;--mid:#6b6560;--faint:#e8e0d0;--accent:#2d6a4f;--accent2:#e8f2ed;--accent3:#1a4a38;--capy:#c9956a;--gold:#a07830;}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
em{font-style:italic;}

/* Topbar (Landing: Marke + Sprach-Switcher, KEINE Hamburger) */
.topbar{display:flex;align-items:center;gap:0.8rem;padding:0.85rem 1.1rem;background:var(--bg);border-bottom:1px solid var(--faint);position:sticky;top:0;z-index:50;}
.brand{font-family:'Lora',serif;font-size:1.2rem;font-weight:700;display:flex;align-items:center;gap:0.5rem;cursor:pointer;}
.brand em{color:var(--accent);}
.brand svg{width:25px;height:25px;}
.topbar-spacer{flex:1;}
.topbar-lang{background:none;border:1px solid var(--faint);border-radius:100px;padding:0.35rem 0.8rem;font-size:0.82rem;font-family:inherit;color:var(--mid);cursor:pointer;display:flex;align-items:center;gap:0.35rem;}
.topbar-lang:hover{border-color:var(--accent);color:var(--accent3);}

.lang-menu{position:absolute;top:3.6rem;right:1rem;background:#fff;border:1px solid var(--faint);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.12);padding:.5rem;z-index:60;display:none;min-width:180px;}
.lang-menu.show{display:block;}
.lang-menu .head{font-size:.7rem;color:var(--mid);padding:.4rem .7rem;}
.lang-opt{display:flex;align-items:center;gap:.6rem;padding:.6rem .7rem;border-radius:9px;cursor:pointer;font-size:.95rem;font-weight:500;}
.lang-opt:hover{background:var(--accent2);}
.lang-opt.sel{color:var(--accent3);font-weight:700;}

/* Inhalt */
.wrap{max-width:600px;margin:0 auto;padding:2.2rem 1.2rem 3rem;}
.center{text-align:center;}
.kicker{font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);}
.capy{width:104px;height:104px;margin:1.6rem auto;display:block;}
h1.big{font-family:'Lora',serif;font-size:clamp(1.8rem,7vw,2.5rem);font-weight:700;line-height:1.15;letter-spacing:-.02em;}
h1.big em{color:var(--accent);}
.sub{color:var(--mid);line-height:1.55;margin-top:.7rem;font-size:1.05rem;max-width:440px;margin-left:auto;margin-right:auto;}
.promo{max-width:430px;margin:1.8rem auto 0;background:var(--accent2);border:1px solid var(--accent);border-radius:16px;padding:1.05rem 1.3rem;font-size:.94rem;line-height:1.6;color:var(--accent3);}
.doors{margin:2.1rem auto 0;}
.btn{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:100px;padding:1.05rem 2.2rem;font-family:inherit;font-size:1.08rem;font-weight:600;cursor:pointer;text-decoration:none;transition:all .2s;}
.btn:hover{background:var(--accent3);transform:translateY(-1px);}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <svg viewBox="0 0 80 80" fill="none"><ellipse cx="40" cy="50" rx="28" ry="20" fill="#c9956a"/><ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/><ellipse cx="40" cy="36" rx="10" ry="7" fill="#b8845a"/><ellipse cx="40" cy="33" rx="4" ry="2.5" fill="#8b5e3c"/><circle cx="38" cy="33" r="1" fill="#6b4226"/><circle cx="42" cy="33" r="1" fill="#6b4226"/><circle cx="33" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="47" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="34" cy="23" r="1.2" fill="white"/><circle cx="48" cy="23" r="1.2" fill="white"/><ellipse cx="26" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="54" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="22" cy="66" rx="7" ry="5" fill="#b8845a"/><ellipse cx="34" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="46" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="58" cy="66" rx="7" ry="5" fill="#b8845a"/><path d="M36 38 Q40 41 44 38" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
    <span>Spi<em>k</em>iu</span>
  </div>
  <div class="topbar-spacer"></div>
  <button class="topbar-lang" id="langBtn" aria-label="language">🌐 <span id="langName">Deutsch</span> ⌄</button>
  <div class="lang-menu" id="langMenu"></div>
</div>

<div class="wrap center">
  <div class="kicker" id="kicker">SPIKIU · BETA</div>
  <div class="capy">
    <svg viewBox="0 0 80 80" fill="none"><ellipse cx="40" cy="50" rx="28" ry="20" fill="#c9956a"/><ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/><ellipse cx="40" cy="36" rx="10" ry="7" fill="#b8845a"/><ellipse cx="40" cy="33" rx="4" ry="2.5" fill="#8b5e3c"/><circle cx="38" cy="33" r="1" fill="#6b4226"/><circle cx="42" cy="33" r="1" fill="#6b4226"/><circle cx="33" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="47" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="34" cy="23" r="1.2" fill="white"/><circle cx="48" cy="23" r="1.2" fill="white"/><ellipse cx="26" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="54" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="22" cy="66" rx="7" ry="5" fill="#b8845a"/><ellipse cx="34" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="46" cy="68" rx="7" ry="5" fill="#b8845a"/><path d="M36 38 Q40 41 44 38" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
  </div>
  <h1 class="big" id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="promo" id="promo"></div>
  <div class="doors">
    <button class="btn" id="startBtn"></button>
  </div>
</div>

<script>
// ── i18n (Landing-Texte aus dem genehmigten Dummy) ──
var T = {
  Deutsch: { langName:'Deutsch',
    kicker:'SPIKIU · BETA',
    title:'Sprich <em>jetzt</em>!<br>Warte nicht!',
    sub:'Spikiu, dein eigener und persönlicher <em>Weg</em>, Sprachen zu lernen.',
    promo:'Eine Woche lang gratis testen: jeden Tag mit Spikiu so lange reden wie du willst — plus eine Lektion gratis pro Tag und 3 Bücher gratis.',
    start:'Beginn! Worauf wartest du?',
    langhead:'Sprache wählen' },
  'Español': { langName:'Español',
    kicker:'SPIKIU · BETA',
    title:'¡Habla <em>ya</em>!<br>¡No esperes!',
    sub:'Spikiu, tu propio y personal <em>camino</em> para aprender idiomas.',
    promo:'Una semana gratis: cada día habla con Spikiu todo lo que quieras — más una lección gratis al día y 3 libros gratis.',
    start:'¡Empieza! ¿A qué esperas?',
    langhead:'Elegir idioma' },
  English: { langName:'English',
    kicker:'SPIKIU · BETA',
    title:'Speak <em>now</em>!<br>Don\u2019t wait!',
    sub:'Spikiu, your own personal <em>way</em> to learn languages.',
    promo:'One week free: every day talk with Spikiu as much as you want — plus one free lesson a day and 3 free books.',
    start:'Start! What are you waiting for?',
    langhead:'Choose language' }
};
var CODE = { Deutsch:'de', 'Español':'es', English:'en' };
var NAME = { de:'Deutsch', es:'Español', en:'English' };

// ── Sprache bestimmen: gespeicherte Wahl > Browser > Englisch ──
function detectLang(){
  var l = (navigator.language || 'en').toLowerCase();
  if (l.indexOf('de') === 0) return 'Deutsch';
  if (l.indexOf('es') === 0) return 'Español';
  return 'English';
}
function initLang(){
  var stored = localStorage.getItem('spikiu_lang');
  if (stored && NAME[stored]) return NAME[stored];
  return detectLang();
}
var S = { lang: initLang() };

// Beim ersten Laden die (erkannte) Sprache gleich festhalten,
// damit Assessment + App sie erben.
function persistLang(){
  try {
    localStorage.setItem('spikiu_lang', CODE[S.lang]);
    localStorage.setItem('spikiu_native', S.lang);
  } catch(e) {}
}

function render(){
  var t = T[S.lang] || T.Deutsch;
  document.getElementById('langName').textContent = t.langName;
  document.getElementById('kicker').textContent = t.kicker;
  document.getElementById('title').innerHTML = t.title;
  document.getElementById('sub').innerHTML = t.sub;
  document.getElementById('promo').textContent = t.promo;
  document.getElementById('startBtn').textContent = t.start;
  document.documentElement.lang = CODE[S.lang];
  // Sprach-Menü
  var head = '<div class="head">' + t.langhead + '</div>';
  var opts = ['Deutsch','Español','English'].map(function(l){
    return '<div class="lang-opt' + (l===S.lang?' sel':'') + '" data-lang="' + l + '">🌐 ' + T[l].langName + '</div>';
  }).join('');
  document.getElementById('langMenu').innerHTML = head + opts;
}

function setLang(name){
  S.lang = name;
  persistLang();
  closeMenu();
  render();
}
function toggleMenu(e){ e.stopPropagation(); document.getElementById('langMenu').classList.toggle('show'); }
function closeMenu(){ document.getElementById('langMenu').classList.remove('show'); }

function start(){
  persistLang();
  window.location.href = 'assessment.html';
}

// ── Events ──
document.getElementById('langBtn').addEventListener('click', toggleMenu);
document.getElementById('langMenu').addEventListener('click', function(e){
  var opt = e.target.closest('.lang-opt');
  if (opt) setLang(opt.getAttribute('data-lang'));
  e.stopPropagation();
});
document.getElementById('startBtn').addEventListener('click', start);
document.addEventListener('click', closeMenu);

persistLang();
render();
</script>
</body>
</html>
