<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spikiu · Spiele</title>
<link rel="stylesheet" href="/fonts/spikiu-fonts.css">
<style>
:root{--bg:#eef7f1;--ink:#15163a;--mid:#5f7068;--green:#1f93b0;--ow:2.5px;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;line-height:1.5;display:flex;align-items:center;justify-content:center;min-height:100dvh;-webkit-font-smoothing:antialiased;}
@media (min-width:700px) and (min-height:560px){
 html{font-size:17px;}
 body{background:#15163a;background-image:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1px);background-size:22px 22px;padding:24px;}
 .app{width:min(460px,94vw);height:min(880px,90vh);border-radius:28px;box-shadow:9px 11px 0 rgba(0,0,0,.22);border:2.5px solid var(--ink);}
}
.app{position:relative;display:flex;flex-direction:column;height:100dvh;width:100%;background:var(--bg);overflow:hidden;}
.top{flex:0 0 auto;background:rgba(255,255,255,.72);border-bottom:var(--ow) solid var(--ink);padding:calc(.6rem + env(safe-area-inset-top)) .9rem .6rem;display:flex;align-items:center;gap:.6rem;}
.back{width:36px;height:36px;flex:0 0 auto;border-radius:999px;border:var(--ow) solid var(--ink);background:#fff;font-size:1.2rem;cursor:pointer;box-shadow:2px 2px 0 var(--ink);color:var(--ink);}
.back:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink);}
.tt-wrap{flex:1;text-align:center;min-width:0;}
.tt-wrap .rk{font:500 .58rem/1 'DM Mono',monospace;letter-spacing:.2em;color:var(--green);text-transform:uppercase;}
.tt-wrap h1{font-family:'Archivo Black',sans-serif;font-size:1.12rem;margin:.1rem 0 0;}
.stage{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1rem 1rem calc(1.4rem + env(safe-area-inset-bottom));}
.inner{max-width:30rem;margin:0 auto;display:flex;flex-direction:column;gap:1rem;}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:.85rem;}
.door{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;text-align:center;min-height:9.2rem;padding:.8rem .6rem;border:var(--ow) solid var(--ink);border-radius:20px;box-shadow:4px 5px 0 var(--ink);cursor:pointer;color:var(--ink);font-family:inherit;}
.door:active{transform:translate(2px,2px);box-shadow:2px 3px 0 var(--ink);}
.door svg,.door img{width:2.9rem;height:2.9rem;}
.door b{font:800 .98rem/1.1 'DM Sans',sans-serif;}
.door span{font-size:.74rem;line-height:1.2;font-weight:600;color:rgba(21,22,58,.72);}
.regal{font:500 .62rem/1 'DM Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--mid);margin:.6rem 0 -.4rem .2rem;}
.door .emo{font-size:2.3rem;line-height:1;}
.door.zu{opacity:.55;}
.door .lock{position:absolute;top:.5rem;right:.6rem;font-size:.95rem;}
.door{position:relative;}
.tages{display:flex;align-items:center;gap:.9rem;text-align:left;width:100%;min-height:0;padding:1rem;flex-direction:row;justify-content:flex-start;}
.tages .emo,.tages svg,.tages img{flex:none;}
.tages .txt{display:flex;flex-direction:column;gap:.15rem;min-width:0;}
.tages .k{font:500 .62rem/1 'DM Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);opacity:.7;}
.probe{font-size:.8rem;color:var(--mid);text-align:center;margin:0;}
.note{font-size:.76rem;color:var(--mid);line-height:1.45;text-align:center;margin:.4rem 0 0;}
.ends{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:space-between;}
.end{background:#fff;color:var(--ink);border:var(--ow) solid var(--ink);border-radius:999px;padding:.6rem 1rem;font:800 .9rem/1 'DM Sans',sans-serif;cursor:pointer;box-shadow:3px 3px 0 var(--ink);}
.end.primary{background:var(--green);color:#fff;}
.end:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
.card{background:#fff;border:var(--ow) solid var(--ink);border-radius:22px;box-shadow:5px 6px 0 var(--ink);padding:1rem .9rem;}
.empty{text-align:center;color:var(--mid);}
</style>
</head>
<body>

<div class="app">
  <div class="top"><button class="back" id="btnZurueck" aria-label="zurück">‹</button><div class="tt-wrap"><div class="rk" id="roomEyebrow"></div><h1 id="roomTitle">Spiele</h1></div><div style="width:36px"></div></div>
  <div class="stage" id="stage"><div class="inner" id="inner"></div></div>
</div>

function uiLang(){ return (['de','es','en','el'].indexOf(PROFILE.muttersprache) > -1) ? PROFILE.muttersprache : 'de'; }

var UI = {

       huerto:['Spikius Garten','Von A bis Z: pflanz deine Wörter.'], acrostico:['Akrostichon','Ein Wort, zu jedem Buchstaben ein Gedanke.'],

       regale:['Hören & Sprechen','Wörter finden','Schnell & leicht'], tages:'Spiel des Tages', tagesSub:'Heute schlägt Spikiu vor:',
       gesperrt:function(x){ return 'Das gehört zum Spielzimmer (1,50 € im Monat). Heute frei: ' + x + '.'; }, zumTages:'Zum Spiel des Tages', abo:'Spielzimmer ansehen',
       probe:function(n){ return 'Probezeit: alles frei, noch ' + n + (n === 1 ? ' Tag.' : ' Tage.'); }, schloss:'Spielzimmer',
       weiter:'noch eine ›', genug:'Genug für heute', themaWortschatz:'Wortschatz',

  es:{ titel:'Juegos', eyebrow:'Ejercicio', hallo:'Nueve juegos, cortos y ligeros. Elige uno.',
       pinata:['Piñata','¡Dale! Y atrapa al intruso.'], globos:['Globos','Revienta las palabras en el orden correcto.'],
       huerto:['El huerto de Spikiu','De la A a la Z: planta tus palabras.'], acrostico:['Acróstico','Una palabra, una idea por letra.'],
       encadenado:['Encadenado','Cadena de palabras con Spikiu. Si te atascas, te ayuda letra a letra.'], oido:['Oído fino','Escucha una palabra, toca la imagen.'],

       regale:['Escuchar y hablar','Encontrar palabras','Rápido y ligero'], tages:'Juego del día', tagesSub:'Hoy Spikiu te propone:',
       gesperrt:function(x){ return 'Esto es del cuarto de juegos (1,50 € al mes). Hoy gratis: ' + x + '.'; }, zumTages:'Al juego del día', abo:'Ver el cuarto de juegos',
       probe:function(n){ return 'Prueba: todo gratis, ' + (n === 1 ? 'queda 1 día.' : 'quedan ' + n + ' días.'); }, schloss:'Cuarto de juegos',
       weiter:'otra ›', genug:'Ya está bien por hoy', themaWortschatz:'Vocabulario',
       leer:'Para tu idioma meta todavía no hay frases aquí.' },
  en:{ titel:'Games', eyebrow:'Exercise', hallo:'Nine games, short and light. Pick one.',
       pinata:['Piñata','Swing and catch the intruder.'], globos:['Balloons','Pop the words in the right order.'],
       huerto:['Spikiu’s garden','From A to Z: plant your words.'], acrostico:['Acrostic','One word, one thought per letter.'],
       encadenado:['Word Chain','A word chain with Spikiu. Stuck? He helps letter by letter.'], oido:['Sharp Ear','Hear a word, tap the picture.'],
       golpe:['The Beat','Where is the beat? Tap the strong syllable.'], mercado:['At the Market','Every word in the right basket.'], memoria:['Memory','Find the pairs: word and picture.'],
       regale:['Listen & speak','Find words','Quick & light'], tages:'Game of the day', tagesSub:'Today Spikiu suggests:',
       gesperrt:function(x){ return 'This is part of the games room (€1.50 a month). Free today: ' + x + '.'; }, zumTages:'Go to the game of the day', abo:'See the games room',
       probe:function(n){ return 'Trial: everything free, ' + n + (n === 1 ? ' day left.' : ' days left.'); }, schloss:'Games room',
       weiter:'another ›', genug:'Enough for today', themaWortschatz:'Vocabulary',
       leer:'There are no sentences for your target language here yet.' },
  el:{ titel:'Παιχνίδια', eyebrow:'Εξάσκηση', hallo:'Εννιά παιχνίδια, σύντομα και ανάλαφρα. Διάλεξε ένα.',
       pinata:['Πινιάτα','Χτύπα και πιάσε τον παρείσακτο.'], globos:['Μπαλόνια','Σκάσε τις λέξεις με τη σωστή σειρά.'],
       huerto:['Ο κήπος του Spikiu','Από το Α ως το Ω: φύτεψε τις λέξεις σου.'], acrostico:['Ακροστιχίδα','Μία λέξη, μία σκέψη για κάθε γράμμα.'],
       encadenado:['Αλυσίδα λέξεων','Αλυσίδα λέξεων με τον Spikiu. Αν κολλήσεις, σε βοηθάει γράμμα γράμμα.'], oido:['Λεπτό αυτί','Άκου μια λέξη, πάτα την εικόνα.'],
       golpe:['Ο τόνος','Πού πέφτει ο τόνος; Πάτα την τονισμένη συλλαβή.'], mercado:['Στην αγορά','Κάθε λέξη στο σωστό καλάθι.'], memoria:['Μνήμη','Βρες τα ζευγάρια: λέξη και εικόνα.'],
       regale:['Ακρόαση & ομιλία','Βρες λέξεις','Γρήγορα & εύκολα'], tages:'Το παιχνίδι της ημέρας', tagesSub:'Σήμερα ο Spikiu σού προτείνει:',
       gesperrt:function(x){ return 'Αυτό ανήκει στο δωμάτιο παιχνιδιών (1,50 € τον μήνα). Δωρεάν σήμερα: ' + x + '.'; }, zumTages:'Στο παιχνίδι της ημέρας', abo:'Δες το δωμάτιο παιχνιδιών',
       probe:function(n){ return 'Δοκιμαστική περίοδος: όλα δωρεάν, ' + (n === 1 ? 'μένει 1 μέρα.' : 'μένουν ' + n + ' μέρες.'); }, schloss:'Δωμάτιο παιχνιδιών',
       weiter:'άλλο ένα ›', genug:'Αρκετά για σήμερα', themaWortschatz:'Λεξιλόγιο',
       leer:'Δεν υπάρχουν ακόμα προτάσεις εδώ για τη γλώσσα που μαθαίνεις.' }
};
function ui(){ return UI[uiLang()] || UI.de; }


var GLYPH = {
  pinata:'<svg viewBox="0 0 44 44"><path d="M22 2v8" stroke="#15163a" stroke-width="2"/><circle cx="22" cy="24" r="10" fill="#ffd24a" stroke="#15163a" stroke-width="2"/><path d="M22 14l-3-4h6zM32 24l4-3v6zM12 24l-4-3v6zM22 34l-3 4h6z" fill="#e0412f" stroke="#15163a" stroke-width="1.5"/></svg>',
  globos:'<svg viewBox="0 0 44 44"><ellipse cx="16" cy="15" rx="9" ry="11" fill="#f7bcd8" stroke="#15163a" stroke-width="2"/><ellipse cx="29" cy="19" rx="9" ry="11" fill="#9fd6e8" stroke="#15163a" stroke-width="2"/><path d="M16 26q2 8 0 16M29 30q-2 6 0 12" stroke="#15163a" stroke-width="1.5" fill="none"/></svg>',
  huerto:'<img src="bilder/om-1F331.svg" alt="" aria-hidden="true">',
  acrostico:'<svg viewBox="0 0 44 44"><rect x="12" y="3" width="13" height="11" rx="3" fill="#ffd24a" stroke="#15163a" stroke-width="2"/><rect x="12" y="17" width="13" height="11" rx="3" fill="#ffd24a" stroke="#15163a" stroke-width="2"/><rect x="12" y="31" width="13" height="11" rx="3" fill="#ffd24a" stroke="#15163a" stroke-width="2"/><path d="M29 8h12M29 22h9M29 36h11" stroke="#15163a" stroke-width="2" stroke-linecap="round"/></svg>'
};
GLYPH.encadenado = '<span class="emo">🔗</span>'; GLYPH.oido = '<span class="emo">👂</span>'; GLYPH.golpe = '<span class="emo">🥁</span>';
GLYPH.mercado = '<span class="emo">🧺</span>'; GLYPH.memoria = '<span class="emo">🃏</span>';
var FARBE = { pinata:'#ffd0b0', globos:'#d3eef6', huerto:'#c7e89a', acrostico:'#cdbdf2',
  encadenado:'#ffe08a', oido:'#bfe6d5', golpe:'#f7bcd8', mercado:'#e9dcc0', memoria:'#b7c9f2' };   // neun Kacheln, neun Farben (Leo, 11.10.)
// Drei Regale (Leo, 11.10.): nach dem, was ein Spiel trainiert
var REGALE = [ ['oido','golpe'], ['encadenado','acrostico','huerto','memoria'], ['pinata','globos','mercado'] ];
function spielListe(){ return [].concat.apply([], REGALE).filter(verfuegbar); }
function verfuegbar(id){ return true; }   // 12.10.: alle neun Spiele in es/de/en/el (Der Schlag: es/el nach Regel, de/en über silben.js)

// ── Audio ──
function sprich(text){
  if (window.spkSpeak){ try { return window.spkSpeak(text, PROFILE.zielsprache); } catch(e){} }
  try { var s = window.speechSynthesis;
    if (s && typeof SpeechSynthesisUtterance !== 'undefined'){
      var bcp = { de:'de-DE', es:'es-ES', en:'en-US', el:'el-GR' }[PROFILE.zielsprache] || 'es-ES';
      var u = new SpeechSynthesisUtterance(String(text)); u.lang = bcp; s.cancel(); s.speak(u);
    } } catch(e){}
}
function opts(){ return { nativeLang: uiLang(), zielLang: PROFILE.zielsprache, sprich: sprich }; }

// ── Daten (nur eigene Zielsprache) ──
var SAETZE = [];   // [{ satz, art }]
var LEXIKON = [];  // [{ z, tr }]
function lernpfad(){ var D = window.SpikiuLernpfad; return (D && D.zielsprache === PROFILE.zielsprache) ? D : null; }
function trVon(na){ if(!na) return ''; return na[PROFILE.muttersprache] || (PROFILE.muttersprache === 'el' ? na.en : '') || na.de || na.es || na.en || ''; }
function baueDaten(){
  var z = PROFILE.zielsprache, SP = window.spikiuSprichwort, J = window.spikiuJuegos;
  SAETZE = [];
  if (SP && SP.daten){
    var trP = function(p){ return (p.t && (p.t[PROFILE.muttersprache] || (PROFILE.muttersprache === 'el' ? p.t.en : ''))) || ''; };
    (SP.daten[z] || []).forEach(function(p){ SAETZE.push({ satz:p.text, tr:trP(p), art:'spruch' }); });
    ((SP.wendungen||{})[z] || []).forEach(function(p){ SAETZE.push({ satz:p.text, tr:trP(p), art:'wendung' }); });
  }
  var WS = (typeof window.spikiuWortschatz === 'function' && window.spikiuWortschatz.daten && window.spikiuWortschatz.daten[z])
    ? window.spikiuWortschatz(z, PROFILE.muttersprache) : [];
  WS.forEach(function(x){ if (x.text) SAETZE.push({ satz:x.text, tr:x.ts || '', art:'beispiel' }); LEXIKON.push({ z:x.wort, tr:x.tr }); });
  // Leo 10.10.: jeder Wurf endet mit der Übersetzung → nur Sätze, die eine haben.
  SAETZE = SAETZE.filter(function(s){ var n = J.woerterAus(s.satz).length; return s.tr && n >= 3 && n <= 8; });
  var D = lernpfad();
  if (D){
    D.themen.forEach(function(t){ woerterVonThemaLernpfad(t.id).forEach(function(x){ LEXIKON.push(x); }); });
  }
  if (window.spikiuWortfelder) window.spikiuWortfelder.themen.forEach(function(id){ feldVon(id).forEach(function(x){ LEXIKON.push({ z:x.z, tr:x.tr }); }); });
}
function woerterVonThema(id){
  var basis = woerterVonThemaLernpfad(id), st = stufeZahl(), seen = {};
  basis.forEach(function(x){ seen[String(x.z).toLowerCase()] = 1; });
  feldVon(id).forEach(function(x){ if (x.stufe <= st && !seen[String(x.z).toLowerCase()]) { seen[String(x.z).toLowerCase()] = 1; basis.push({ z:x.z, tr:x.tr }); } });
  return basis;
}
function woerterVonThemaLernpfad(id){
  var D = lernpfad();
  if (!D && id !== '_ws') return [];
  if (!D || id === '_ws'){
    var z = PROFILE.zielsprache;
    return (typeof window.spikiuWortschatz === 'function' && window.spikiuWortschatz.daten[z])
      ? window.spikiuWortschatz(z, PROFILE.muttersprache).map(function(x){ return { z:x.wort, tr:x.tr }; }) : [];
  }
  var out = [];
  (D.stufen || ['a1','a2']).forEach(function(st){
    // ES-Datei liefert na als Objekt, DE/EN als fertigen String — beides tragen.
    (D.woerter(st, id, PROFILE.muttersprache) || []).forEach(function(w){ out.push({ z:w.z, tr:(typeof w.na === 'string') ? w.na : trVon(w.na) }); });
  });
  return out;
}
// ── Wortfelder (10.10.): thematische Felder in allen vier Zielsprachen ──
function stufeZahl(){ try { var P = window.SpikiuPfad; if (P && P.existiert && P.existiert()) return P.stufe() === 'a2' ? 2 : 1; } catch(e){} return 1; }
function feldVon(id){ var W = window.spikiuWortfelder; return W ? W.feld(PROFILE.zielsprache, id, PROFILE.muttersprache) : []; }
function bereichVon(id){ var W = window.spikiuWortfelder; return (W && W.bereich) ? W.bereich(PROFILE.zielsprache, id, PROFILE.muttersprache) : feldVon(id); }
// Themennamen in der Muttersprache — aus irgendeiner geladenen Lernpfad-Datei
function themenNamen(){
  var m = {}, mu = PROFILE.muttersprache;
  ['SpikiuLernpfadES','SpikiuLernpfadDE','SpikiuLernpfadEN','SpikiuLernpfad'].forEach(function(k){
    var D = window[k]; if (!D || !D.themen) return;
    D.themen.forEach(function(t){ var n = t.na && (t.na[mu] || (mu === 'el' ? t.na.en : '')); if (n && !m[t.id]) m[t.id] = (t.em ? t.em + ' ' : '') + n; });
    (D.kategorien || []).forEach(function(t){ var n = t.na && (t.na[mu] || (mu === 'el' ? t.na.en : '')); if (n && t.id === 'essen' && !m.essen) m.essen = '🥘 ' + n; });
  });
  return m;
}
function feldThemen(){
  var W = window.spikiuWortfelder, N = themenNamen();
  return W ? W.themen.map(function(id){ return { id:id, t: N[id] || id }; }) : [];
}
function themen(){
  var D = lernpfad();
  if (!D) { var ft = feldThemen(); return ft.length ? ft : [{ id:'_ws', t: ui().themaWortschatz }]; }
  var essen = feldThemen().filter(function(t){ return t.id === 'essen'; });
  return essen.concat(D.themen.filter(function(t){ return woerterVonThema(t.id).length; })
    .map(function(t){ return { id:t.id, t:(t.em ? t.em + ' ' : '') + trVon(t.na) }; }));
}

// ── Speicher ──
function lies(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function schreib(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function SZ(){ return window.spikiuSitzung || null; }
var sitzTimer = 0, sitzOffen = null;
function sichereSitzung(zustand, sofort){
  var S = SZ(); if (!S) return;
  clearTimeout(sitzTimer); sitzOffen = null;
  if (sofort) { S.speichere('spiele', zustand); return; }
  sitzOffen = zustand;
  sitzTimer = setTimeout(function(){ sitzOffen = null; S.speichere('spiele', zustand); }, 350);
}
// Entprellten Rest nicht verlieren, wenn die Seite verlassen wird.
window.addEventListener('pagehide', function(){ var S = SZ(); if (S && sitzOffen) { S.speichere('spiele', sitzOffen); sitzOffen = null; } });
function raeumeSitzung(){ clearTimeout(sitzTimer); sitzOffen = null; var S = SZ(); if (S) S.raeume('spiele'); }

// ── Ansichten ──
var inner = document.getElementById('inner');
var aktiv = null;   // laufende Spiel-Karte (für stop())
var ansicht = 'tueren';

var letzterSatz = '';
function leeren(){ if (aktiv && aktiv.stop) aktiv.stop(); aktiv = null; inner.innerHTML = ''; document.getElementById('stage').scrollTop = 0; }
function kopf(titel){ document.getElementById('roomTitle').textContent = titel; document.getElementById('roomEyebrow').textContent = ui().eyebrow; }

function tuer(id, klasse){
  var Z = window.spikiuZugang, liste = spielListe(), frei = !Z || Z.darf(id, liste);
  var b = document.createElement('button'); b.type = 'button'; b.className = 'door' + (klasse ? ' ' + klasse : '') + (frei ? '' : ' zu'); b.style.background = FARBE[id];
  b.innerHTML = GLYPH[id] + (klasse === 'tages' ? '<span class="txt"><span class="k"></span><b></b><span class="d"></span></span>' : '<b></b><span class="d"></span>') + (frei ? '' : '<span class="lock" aria-hidden="true">🔒</span>');
  b.querySelector('b').textContent = ui()[id][0]; b.querySelector('.d').textContent = ui()[id][1];
  if (klasse === 'tages') b.querySelector('.k').textContent = ui().tages;
  b.onclick = function(){ oeffne(id); };
  return b;
}
function tueren(){
  ansicht = 'tueren'; leeren(); kopf(ui().titel);
  var J = window.spikiuJuegos; J.css();
  var hi = document.createElement('div'); hi.className = 'jg-spk';
  hi.innerHTML = J.spikiuSvg + '<div class="jg-bub"></div>'; hi.querySelector('.jg-bub').textContent = ui().hallo;
  var wrap = document.createElement('div'); wrap.className = 'jg'; wrap.appendChild(hi); inner.appendChild(wrap);
  var Z = window.spikiuZugang, liste = spielListe();
  // Spiel des Tages — für alle gleich, wechselt täglich, immer frei
  var heute = Z ? Z.tagesSpiel(liste) : liste[0];
  if (heute) inner.appendChild(tuer(heute, 'tages'));
  var st = Z ? Z.status() : null;
  if (st && st.aktiv && !st.abo && st.probeTage > 0) { var pr = document.createElement('p'); pr.className = 'probe'; pr.textContent = ui().probe(st.probeTage); inner.appendChild(pr); }
  REGALE.forEach(function(regal, i){
    var ids = regal.filter(verfuegbar); if (!ids.length) return;
    var h = document.createElement('p'); h.className = 'regal'; h.textContent = ui().regale[i]; inner.appendChild(h);
    var d = document.createElement('div'); d.className = 'doors';
    ids.forEach(function(id){ d.appendChild(tuer(id)); });
    inner.appendChild(d);
  });
}
// Freundliche Sperre (nur wenn die Zugangswache aktiv ist und die Probezeit vorbei)
function sperre(id){
  leeren(); kopf(ui().schloss); ansicht = 'sperre';
  var J = window.spikiuJuegos, heute = window.spikiuZugang.tagesSpiel(spielListe());
  var wrap = document.createElement('div'); wrap.className = 'jg';
  var hi = document.createElement('div'); hi.className = 'jg-spk'; hi.innerHTML = J.spikiuSvg + '<div class="jg-bub"></div>';
  hi.querySelector('.jg-bub').textContent = ui().gesperrt(ui()[heute][0]); wrap.appendChild(hi); inner.appendChild(wrap);
  var e = document.createElement('div'); e.className = 'ends';
  var a = document.createElement('button'); a.className = 'end'; a.type = 'button'; a.textContent = ui().abo; a.onclick = function(){ location.href = 'spikiu-products.html#premium'; };
  var t = document.createElement('button'); t.className = 'end primary'; t.type = 'button'; t.textContent = ui().zumTages; t.onclick = function(){ oeffne(heute); };
  e.appendChild(a); e.appendChild(t); inner.appendChild(e);
}

function enden(nochmal){
  var e = document.createElement('div'); e.className = 'ends';
  var g = document.createElement('button'); g.className = 'end'; g.type = 'button'; g.textContent = ui().genug;
  g.onclick = function(){ raeumeSitzung(); location.href = 'haus.html'; };
  e.appendChild(g);
  if (nochmal){ var w = document.createElement('button'); w.className = 'end primary'; w.type = 'button'; w.textContent = ui().weiter; w.onclick = nochmal; e.appendChild(w); }
  inner.appendChild(e);
  return e;
}
function zieheSatz(){
  if (!SAETZE.length) return null;
  var pool = SAETZE.filter(function(s){ return s.satz !== letzterSatz; });
  if (!pool.length) pool = SAETZE;
  var s = pool[Math.floor(Math.random() * pool.length)]; letzterSatz = s.satz; return s;
}
function leerHinweis(){ var p = document.createElement('div'); p.className = 'card empty'; p.textContent = ui().leer; inner.appendChild(p); enden(null); }

function rundeKarte(spiel){
  leeren(); kopf(ui()[spiel][0]); ansicht = spiel;
  sichereSitzung({ spiel: spiel }, true);
  var J = window.spikiuJuegos, s = zieheSatz();
  if (!s) { leerHinweis(); return; }
  var karte;
  if (spiel === 'pinata'){
    var ein = J.eindringling(s.satz, SAETZE.map(function(x){ return x.satz; }), PROFILE.zielsprache);
    if (!ein) { leerHinweis(); return; }
    karte = J.pinata({ satz: s.satz, tr: s.tr, intruso: ein.wort, intrusoDe: ein.aus }, opts());
  } else {
    karte = J.globos({ satz: s.satz, tr: s.tr }, opts());
  }
  var c = document.createElement('div'); c.className = 'card'; c.appendChild(karte); inner.appendChild(c);
  aktiv = karte;
  var e = null;
  karte.addEventListener('jg-done', function(){ if (!e) e = enden(function(){ rundeKarte(spiel); }); });
}

function garten(themaId){
  leeren(); kopf(ui().huerto[0]); ansicht = 'huerto';
  var z = PROFILE.zielsprache, alle = themen();
  var gespeichert = lies('spikiu_huerto', {});
  var thema = themaId || lies('spikiu_huerto_thema', {})[z] || (alle[0] && alle[0].id);
  if (!alle.some(function(t){ return t.id === thema; })) thema = alle[0] && alle[0].id;
  var tz = lies('spikiu_huerto_thema', {}); tz[z] = thema; schreib('spikiu_huerto_thema', tz);
  sichereSitzung({ spiel: 'huerto', thema: thema }, true);
  var ansichtEl = window.spikiuJuegos.huerto({
    themen: alle, thema: thema,
    woerterVon: woerterVonThema, lexikon: LEXIKON,
    lade: function(id){ return ((gespeichert[z] || {})[id]) || {}; },
    speichere: function(id, daten){ gespeichert = lies('spikiu_huerto', {}); gespeichert[z] = gespeichert[z] || {}; gespeichert[z][id] = daten; schreib('spikiu_huerto', gespeichert); },
    beiThema: function(id){ garten(id); }
  }, opts());
  inner.appendChild(ansichtEl); aktiv = ansichtEl;
  enden(null);
}

function akrostichon(entwurf, themaId){
  leeren(); kopf(ui().acrostico[0]); ansicht = 'acrostico';
  var z = PROFILE.zielsprache, alle = feldThemen();
  var thema = (entwurf && entwurf.thema) || themaId || lies('spikiu_acro_thema', {})[z] || 'essen';
  if (!alle.some(function(t){ return t.id === thema; })) thema = alle[0] && alle[0].id;
  var tz = lies('spikiu_acro_thema', {}); tz[z] = thema; schreib('spikiu_acro_thema', tz);
  sichereSitzung({ spiel: 'acrostico', entwurf: entwurf || null, thema: thema }, true);
  var ansichtEl = window.spikiuJuegos.acrostico({
    themen: alle, thema: thema, feldVon: feldVon, bereichVon: bereichVon, stufe: stufeZahl(),
    lade: function(){ return (lies('spikiu_acrosticos', {})[z]) || []; },
    speichere: function(liste){ var a = lies('spikiu_acrosticos', {}); a[z] = liste; schreib('spikiu_acrosticos', a); },
    entwurf: entwurf || null,
    beiEntwurf: function(e){ sichereSitzung({ spiel: 'acrostico', entwurf: e, thema: thema }, false); },
    beiThema: function(id){ akrostichon(null, id); }
  }, opts());
  inner.appendChild(ansichtEl); aktiv = ansichtEl;
  enden(null);
}

// ── Spielzimmer II: Daten aus Wortfeldern + Bildern ──
function bildVon(x){ var I = window.spikiuIcon; if (!I || !x.en) return ''; var e = I.konzept(x.en); return e ? I.datei(e) : ''; }
function bilderAus(liste){ var seen = {}, out = []; liste.forEach(function(x){ var b = bildVon(x); if (b && !seen[b]) { seen[b] = 1; out.push({ z:x.z, tr:x.tr, bild:b }); } }); return out; }
function bilderPool(){
  var J = window.spikiuJuegos, W = window.spikiuWortfelder; if (!W) return [];
  var bereiche = J.mezcla(['essen','essen','taxi','hotel','wetter','arzt','einkaufen']);
  for (var i = 0; i < bereiche.length; i++){ var b = bilderAus(bereichVon(bereiche[i])); if (b.length >= 6) return b; }
  return bilderAus(bereichVon('essen'));
}
function kategorieName(id){
  var mu = PROFILE.muttersprache, n = '';
  ['SpikiuLernpfadES','SpikiuLernpfadDE','SpikiuLernpfadEN'].forEach(function(k){ var D = window[k]; if (n || !D || !D.kategorien) return; D.kategorien.forEach(function(t){ if (t.id === id && t.na && t.na[mu]) n = t.na[mu]; }); });
  if (!n && mu === 'el') ['SpikiuLernpfadES','SpikiuLernpfadDE','SpikiuLernpfadEN'].forEach(function(k){ var D = window[k]; if (n || !D || !D.kategorien) return; D.kategorien.forEach(function(t){ if (t.id === id && t.na && t.na.en) n = t.na.en; }); });
  return n || id;
}
function neueRunde(spiel){
  leeren(); kopf(ui()[spiel][0]); ansicht = spiel;
  sichereSitzung({ spiel: spiel }, true);
  var J = window.spikiuJuegos, st = stufeZahl(), karte = null;
  var einzel = function(x){ return /^[\p{L}]+$/u.test(String(x.z).replace(/^(el|la|los|las|der|die|das|the|ο|η|το|οι|τα)\s+/i,'')); };
  if (spiel === 'encadenado') karte = J.encadenado({ feld: bereichVon('essen'), stufe: st }, opts());
  else if (spiel === 'oido') { var p = bilderPool(); if (p.length >= 4) karte = J.oido({ bilder: p }, opts()); }
  else if (spiel === 'memoria') { var m = J.mezcla(bilderPool()); if (m.length >= 4) karte = J.memoria({ paare: m.slice(0, 4) }, opts()); }
  else if (spiel === 'golpe') {
    var z = PROFILE.zielsprache;
    var w = bereichVon('essen').concat(bereichVon('taxi')).filter(function(x){ var r = J.silbenTon(x.z, z); return r && einzel(x) && x.stufe <= Math.max(st, 2) && r.s.length >= 2 && r.s.length <= 4; });
    if (w.length) karte = J.golpe({ woerter: w }, opts());
  }
  else if (spiel === 'mercado') {
    // Nur eindeutige Dinge (Nomen), keine Wörter, die auch in den anderen Korb oder zum Einkaufen passen (precio, tarjeta …)
    var ess = bereichVon('essen'), andere = {};
    ess.concat(bereichVon('einkaufen')).forEach(function(x){ andere[x.en] = 1; });
    var weg = [].concat(feldVon('taxi'), feldVon('bahnhof'), feldVon('wegbeschreibung')).filter(function(x){ return !andere[x.en] && x.nomen && x.stufe <= 2 && einzel(x); });
    ess = ess.filter(function(x){ return x.nomen && x.stufe <= Math.max(st, 1) && einzel(x); });
    if (ess.length >= 3 && weg.length >= 3) karte = J.mercado({ koerbe: [ { titel: kategorieName('essen'), icon:'🥘', woerter: ess }, { titel: kategorieName('unterwegs'), icon:'🧳', woerter: weg } ] }, opts());
  }
  if (!karte) { leerHinweis(); return; }
  var c = document.createElement('div'); c.className = 'card'; c.appendChild(karte); inner.appendChild(c);
  aktiv = karte;
  var e = null;
  karte.addEventListener('jg-done', function(){ if (!e) e = enden(function(){ neueRunde(spiel); }); });
}

function oeffne(id, zustand){
  zustand = zustand || {};
  var Z = window.spikiuZugang;
  if (Z && id !== 'tueren' && UI.de[id] && !Z.darf(id, spielListe())) { sperre(id); return; }
  if (id === 'pinata' || id === 'globos') rundeKarte(id);
  else if (['encadenado','oido','golpe','mercado','memoria'].indexOf(id) > -1) neueRunde(id);
  else if (id === 'huerto') garten(zustand.thema);
  else if (id === 'acrostico') akrostichon(zustand.entwurf, zustand.thema);
  else tueren();
}

document.getElementById('btnZurueck').onclick = function(){
  raeumeSitzung();
  if (ansicht === 'tueren' || herkunftHaus) location.href = 'haus.html'; else tueren();
};

window.addEventListener('load', function(){
  document.documentElement.lang = uiLang();
  if (!window.spikiuJuegos){ inner.textContent = 'juegos.js fehlt.'; return; }
  baueDaten();
  try { window.spikiuJuegos.klang.vorladen(); } catch (e) {}   // Dur/Moll früh laden (Piñata, Globos)
  // Direktweg aus dem Regal im Haus (11.10.): spiele.html?spiel=huerto | acrostico
  var direkt = (/[?&]spiel=([a-z]+)/.exec(window.location.search) || [])[1];
  if (direkt && UI.de[direkt]) { herkunftHaus = true; oeffne(direkt); return; }
  var S = SZ(), z = S ? S.lade('spiele') : null;
  if (z && z.spiel && UI.de[z.spiel]){
    tueren();
    S.frageWiederkommen({ raum:'spiele', ts:z.ts, wo: ui()[z.spiel][0],
      beimWeiter: function(){ oeffne(z.spiel, z); },
      beimNeu: function(){ raeumeSitzung(); tueren(); } });
  } else {
    tueren();
  }
});
