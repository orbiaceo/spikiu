<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spikiu — Los geht's</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="geraet.css">
<style>
/* ── EINGANG „ZAUBERSTAB“ (Leo, 25.11.2026: Vorschlag B aus prototyp-eingang-zauberstab.html) ──
   Drei kurze Bildschirme, jeder passt ohne Scrollen auf das Handy, jeder Tipp springt von selbst weiter:
   1 Muttersprache (Zeile, aus dem Browser erkannt, ▾ öffnet die Auswahl-Maske) + Zielsprache
   2 Wie viel kannst du schon?   3 Wofür? (mehrere, überspringbar) → Haus.
   Name, Wochenzeit, Zieldatum und Freitext fallen weg (Spikiu kann den Namen später fragen).
   Pastell Minze, Nunito, kleine Icon-Kacheln wie die acht Kapitel der Startseite. */
:root{--minz:#eef7f1;--ink:#15163a;--muted:#5f7068;--sky:#e1f3f8;--mustard:#ffe7a3;--cyan:#1f93b0;--line:#dcebe1;--shadow:0 6px 18px rgba(21,22,58,.07)}
*{box-sizing:border-box;min-width:0;margin:0;padding:0}
html,body{height:100%}
body{background:var(--minz);color:var(--ink);font:16px/1.4 'Nunito',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.app{max-width:460px;height:100%;height:100dvh;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border-bottom:1.5px solid var(--line);flex:none}
.back{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font:800 1.1rem 'Nunito',system-ui,sans-serif;color:var(--ink);cursor:pointer;visibility:hidden}
.dots{flex:1;display:flex;gap:6px}
.dots i{height:6px;flex:1;border-radius:9px;background:var(--line)}.dots i.on{background:var(--cyan)}
.logo{font-weight:900;color:var(--ink);text-decoration:none;font-size:1.05rem}.logo em{color:var(--cyan)}
main{flex:1;display:flex;flex-direction:column;padding:14px 16px 18px;gap:12px;overflow:hidden}
.mutter{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);font:inherit;color:var(--ink);cursor:pointer;text-align:left;min-height:52px}
.mutter .fl{font-size:1.4rem}
.mutter small{color:var(--muted);font-weight:800;font-size:.82rem}
.mutter b{font-weight:900}
.mutter .pf{margin-left:auto;color:var(--cyan);font-weight:900;font-size:1.1rem}
.say{display:flex;gap:10px;align-items:center}
.capy{width:52px;height:52px;flex:none;border-radius:50%;background:var(--mustard);display:grid;place-items:center}
.capy svg{width:44px;height:44px}
.bub{background:#fff;border:1.5px solid var(--line);border-radius:18px 18px 18px 6px;padding:9px 13px;font-weight:800;font-size:1.05rem;box-shadow:var(--shadow)}
.grid{display:grid;gap:8px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.tile{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:9px 2px 8px;text-align:center;box-shadow:var(--shadow);cursor:pointer;font:inherit;color:var(--ink);transition:transform .1s,background .15s}
.tile:active{transform:scale(.96)}
.tile i{display:grid;place-items:center;width:44px;height:44px;margin:0 auto 5px;border-radius:14px;font-style:normal;font-size:1.5rem}
.tile span{display:block;font-size:.76rem;font-weight:800;line-height:1.12}
.g5 .tile i{width:38px;height:38px;font-size:1.25rem;border-radius:12px}.g5 .tile span{font-size:.7rem}
.tile.sel{background:var(--mustard);border-color:#e9cf7a}
.foot{margin-top:auto}
.go{display:block;width:100%;font:800 1.05rem 'Nunito',system-ui,sans-serif;color:var(--ink);background:#c9ecd9;border:1.5px solid var(--line);border-radius:999px;padding:14px;box-shadow:var(--shadow);cursor:pointer}
.skip{display:block;margin:8px auto 0;border:0;background:none;color:var(--muted);font:800 .88rem 'Nunito',system-ui,sans-serif;cursor:pointer;padding:8px 14px}
/* Auswahl-Maske Muttersprache: jede Sprache in ihrer eigenen Schrift, scrollt bei vielen Sprachen */
.veil{position:absolute;inset:0;background:rgba(21,22,58,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:10px 16px 18px;transform:translateY(102%);transition:transform .25s ease-out;max-height:62%;display:flex;flex-direction:column;z-index:6}
.open .veil{opacity:1;pointer-events:auto}.open .sheet{transform:none}
.grip{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet h3{margin:0 0 8px;font-size:1rem;font-weight:900}
.list{overflow-y:auto;overscroll-behavior:contain;border-top:1.5px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1.5px solid var(--line);background:none;font:inherit;color:var(--ink);padding:12px 4px;cursor:pointer;min-height:52px;text-align:left}
.row .fl{font-size:1.4rem}.row b{flex:1;font-weight:800}.row .ck{color:var(--cyan);font-weight:900;visibility:hidden}
.row.sel{background:var(--sky)}.row.sel .ck{visibility:visible}
.fade{animation:f .22s ease-out}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.sheet,.veil{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <button class="back" id="back" type="button">‹</button>
    <div class="dots" id="dots"></div>
    <a class="logo" href="index.html">Spi<em>k</em>iu</a>
  </header>
  <main id="main"></main>
  <div class="veil" id="veil"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetH"><div class="grip"></div><h3 id="sheetH"></h3><div class="list" id="list"></div></div>
</div>

<script>
/* ── Daten-Vertrag mit haus/chat/szene UNVERÄNDERT: spikiu_user { name?, nativeLang 'Deutsch'|'Español'|'English'|'Ελληνικά',
   targetLangDisplay, profile{ targetLang 'Spanish'|…, level A0–B2, motivation[], muttersprache, zielsprache, koennen, … } },
   spikiu_lang, spikiu_pfad (nur anlegen, Stationen nie anfassen). Name ist jetzt optional (haus prüft profile).
   NEUE SPRACHE: eine Zeile in LANGS; als Muttersprache zusätzlich ein Block in UI. Die Maske wächst ohne Umbau. ── */
var LANGS = [
  { code:'es', v:'Spanish', native:'Español',  f:'🇪🇸', bg:'#ffd0b0', n:{ de:'Spanisch',   es:'Español', en:'Spanish', el:'Ισπανικά' } },
  { code:'de', v:'German',  native:'Deutsch',  f:'🇩🇪', bg:'#ffe08a', n:{ de:'Deutsch',    es:'Alemán',  en:'German',  el:'Γερμανικά' } },
  { code:'en', v:'English', native:'English',  f:'🇬🇧', bg:'#d3eef6', n:{ de:'Englisch',   es:'Inglés',  en:'English', el:'Αγγλικά' } },
  { code:'el', v:'Greek',   native:'Ελληνικά', f:'🇬🇷', bg:'#cdbdf2', n:{ de:'Griechisch', es:'Griego',  en:'Greek',   el:'Ελληνικά' } }
];
var STAND = [['A0','🌱','#c7e89a'],['A1','👋','#ffe08a'],['A2','💬','#d3eef6'],['B1','🚶','#ffd0b0'],['B2','🗣️','#cdbdf2']];
var WOFUER = [['travel','✈️','#d3eef6'],['work','💼','#ffd0b0'],['exam','📝','#ffe08a'],['family','👪','#f7bcd8'],['study','🎓','#cdbdf2'],['interest','✨','#c7e89a'],['daily','☕','#ffb27a']];
var UI = {
  de:{ title:"Spikiu — Los geht's", back:'Ein Schritt zurück', mutter:'Meine Muttersprache',
    s1:'¡Hola! Was lernst du?', s2:'Wie viel kannst du schon?', s3:'Wofür? Gern mehrere.', go:'Los geht’s →', skip:'Überspringen',
    stand:['Bei Null','Ein paar Wörter','Einfache Gespräche','Ich komme durch','Ziemlich sicher'],
    wofuer:['Reisen','Arbeit','Prüfung','Familie','Studium','Neugier','Alltag'] },
  es:{ title:'Spikiu — Empezamos', back:'Un paso atrás', mutter:'Mi lengua materna',
    s1:'¡Hola! ¿Qué aprendes?', s2:'¿Cuánto sabes ya?', s3:'¿Para qué? Puedes elegir varias.', go:'¡Vamos! →', skip:'Saltar',
    stand:['Desde cero','Unas palabras','Charlas sencillas','Me defiendo','Bastante seguro'],
    wofuer:['Viajes','Trabajo','Examen','Familia','Estudios','Curiosidad','Día a día'] },
  en:{ title:"Spikiu — Let's go", back:'One step back', mutter:'My mother tongue',
    s1:'¡Hola! What are you learning?', s2:'How much do you know already?', s3:'What for? Pick as many as you like.', go:'Let’s go →', skip:'Skip',
    stand:['From zero','A few words','Simple chats','I get by','Fairly confident'],
    wofuer:['Travel','Work','Exam','Family','Studies','Curiosity','Everyday life'] },
  el:{ title:'Spikiu — Πάμε', back:'Ένα βήμα πίσω', mutter:'Η μητρική μου γλώσσα',
    s1:'¡Hola! Τι μαθαίνεις;', s2:'Πόσα ξέρεις ήδη;', s3:'Για ποιο λόγο; Διάλεξε όσα θες.', go:'Πάμε →', skip:'Παράλειψη',
    stand:['Από το μηδέν','Λίγες λέξεις','Απλές κουβέντες','Τα βγάζω πέρα','Αρκετά σίγουρα'],
    wofuer:['Ταξίδια','Δουλειά','Εξετάσεις','Οικογένεια','Σπουδές','Περιέργεια','Καθημερινότητα'] }
};
var CAPY = '<svg viewBox="0 0 80 80" fill="none"><ellipse cx="40" cy="50" rx="28" ry="20" fill="#c9956a"/><ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/><ellipse cx="40" cy="36" rx="10" ry="7" fill="#b8845a"/><ellipse cx="40" cy="33" rx="4" ry="2.5" fill="#8b5e3c"/><circle cx="33" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="47" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="34" cy="23" r="1.2" fill="white"/><circle cx="48" cy="23" r="1.2" fill="white"/><ellipse cx="26" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="54" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="22" cy="66" rx="7" ry="5" fill="#b8845a"/><ellipse cx="34" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="46" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="58" cy="66" rx="7" ry="5" fill="#b8845a"/><path d="M36 38 Q40 41 44 38" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>';

function langBy(key,val){ for (var i=0;i<LANGS.length;i++){ if (LANGS[i][key]===val) return LANGS[i]; } return null; }
function bisher(){ try { return JSON.parse(localStorage.getItem('spikiu_user')||'{}') || {}; } catch(e){ return {}; } }
// Muttersprache: früheres Profil → Startseite (spikiu_lang) → Browser → Deutsch.
function startSprache(){
  var u = bisher(), p = u.profile || {};
  if (UI[p.muttersprache]) return p.muttersprache;
  var l = null; try { l = localStorage.getItem('spikiu_lang'); } catch(e){}
  if (!UI[l]) { var b = (navigator.language||'').slice(0,2).toLowerCase(); l = UI[b] ? b : 'de'; }
  return l;
}
var st = { mutter: startSprache(), ziel: null, stand: null, wofuer: [] };
var step = 0;
function T(){ return UI[st.mutter]; }
function $(id){ return document.getElementById(id); }

function tile(key,v,em,bg,label,multi){
  var on = multi ? st[key].indexOf(v)>-1 : st[key]===v;
  return '<button type="button" class="tile'+(on?' sel':'')+'" data-k="'+key+'" data-v="'+v+'"'+(multi?' data-m="1" aria-pressed="'+on+'"':'')+'><i style="background:'+bg+'">'+em+'</i><span>'+label+'</span></button>';
}
function say(s){ return '<div class="say"><div class="capy">'+CAPY+'</div><div class="bub">'+s+'</div></div>'; }

function render(){
  var m = $('main'); m.classList.remove('fade'); void m.offsetWidth; m.classList.add('fade');
  document.documentElement.lang = st.mutter; document.title = T().title;
  $('back').setAttribute('aria-label', T().back); $('back').title = T().back;
  $('back').style.visibility = step ? 'visible' : 'hidden';
  $('dots').innerHTML = [0,1,2].map(function(k){ return '<i class="'+(k<=step?'on':'')+'"></i>'; }).join('');
  if (step===0){
    var M = langBy('code', st.mutter);
    var ziele = LANGS.filter(function(L){ return L.code!==st.mutter; });
    m.innerHTML = '<button type="button" class="mutter" id="mut" aria-haspopup="dialog"><span class="fl">'+M.f+'</span><span><small>'+T().mutter+':</small><br><b>'+M.native+'</b></span><span class="pf">▾</span></button>'
      + say(T().s1)
      + '<div class="grid g'+ziele.length+'">'+ziele.map(function(L){ return tile('ziel',L.code,L.f,L.bg,L.n[st.mutter]); }).join('')+'</div>';
  } else if (step===1){
    m.innerHTML = say(T().s2) + '<div class="grid g5">'+STAND.map(function(s,i){ return tile('stand',s[0],s[1],s[2],T().stand[i]); }).join('')+'</div>';
  } else {
    m.innerHTML = say(T().s3) + '<div class="grid g4">'+WOFUER.map(function(s,i){ return tile('wofuer',s[0],s[1],s[2],T().wofuer[i],true); }).join('')+'</div>'
      + '<div class="foot"><button type="button" class="go" id="go">'+T().go+'</button><button type="button" class="skip" id="skip">'+T().skip+'</button></div>';
  }
}

function maske(auf){
  if (auf){
    $('sheetH').textContent = T().mutter;
    $('list').innerHTML = LANGS.filter(function(L){ return UI[L.code]; }).map(function(L){
      return '<button type="button" class="row'+(L.code===st.mutter?' sel':'')+'" data-mut="'+L.code+'"><span class="fl">'+L.f+'</span><b>'+L.native+'</b><span class="ck">✓</span></button>';
    }).join('');
  }
  $('app').classList.toggle('open', auf);
}

document.addEventListener('click', function(e){
  if (e.target.id==='veil'){ maske(false); return; }
  var b = e.target.closest('button'); if (!b) return;
  if (b.id==='mut'){ maske(true); return; }
  if (b.dataset.mut){ st.mutter=b.dataset.mut; try{ localStorage.setItem('spikiu_lang', st.mutter); }catch(x){} if (st.ziel===st.mutter) st.ziel=null; maske(false); render(); return; }
  if (b.id==='back'){ step=Math.max(0,step-1); render(); return; }
  if (b.id==='go'){ finish(); return; }
  if (b.id==='skip'){ st.wofuer=[]; finish(); return; }
  if (b.dataset.k){
    var k=b.dataset.k, v=b.dataset.v;
    if (b.dataset.m){ var i=st[k].indexOf(v); if (i>-1) st[k].splice(i,1); else st[k].push(v); b.classList.toggle('sel'); b.setAttribute('aria-pressed', b.classList.contains('sel')); return; }
    st[k]=v; b.classList.add('sel');
    setTimeout(function(){ step++; render(); }, 220);
  }
});
document.addEventListener('keydown', function(e){ if (e.key==='Escape') maske(false); });

function finish(){
  var M = langBy('code', st.mutter), Z = langBy('code', st.ziel) || LANGS[0];
  var KOENNEN = { A0:'anfang', A1:'anfang', A2:'mittel', B1:'mittel', B2:'fortgeschritten' };
  var level = st.stand || 'A0', koennen = KOENNEN[level] || 'anfang';
  var u = bisher(), alt = u.profile || {};
  // Bestehende Felder (Name, Stimme, E-Mail …) bleiben erhalten — nur die Einstufung wird neu gesetzt.
  var profile = Object.assign({}, alt, {
    targetLang: Z.v, targetLangDisplay: Z.n[st.mutter] || Z.native, level: level, motivation: st.wofuer.slice(),
    driveText: alt.driveText || '', weeklyTime: alt.weeklyTime || '', deadline: alt.deadline || 'none',
    muttersprache: st.mutter, zielsprache: Z.code, koennen: koennen, fremde_schrift: Z.code==='el', etappe: alt.etappe || 'samen'
  });
  try {
    u.nativeLang = M.native; u.targetLangDisplay = profile.targetLangDisplay; u.profile = profile;
    u.roadmapPending = true; if (!u.createdAt) u.createdAt = new Date().toISOString(); u.lastSeenAt = new Date().toISOString();
    localStorage.setItem('spikiu_user', JSON.stringify(u));
    localStorage.setItem('spikiu_lang', st.mutter);
    /* DEN WEG ANLEGEN (01.09.2026, Neu-Einstufung 19.10.): nur anlegen, nie überschreiben;
       ein bestehender Weg behält seine Stationen und bekommt nur die neue Stufe. */
    try {
      var neueStufe = (koennen==='anfang') ? 'a1' : (level==='B2' ? 'b2' : (level==='B1' ? 'b1' : 'a2'));
      var wegDa = localStorage.getItem('spikiu_pfad');
      if (wegDa){ var weg = JSON.parse(wegDa); if (weg && weg.stationen){ weg.stufe = neueStufe; localStorage.setItem('spikiu_pfad', JSON.stringify(weg)); } }
      else localStorage.setItem('spikiu_pfad', JSON.stringify({ zielsprache: Z.code, stufe: neueStufe, stationen: {} }));
    } catch (e) { console.error('Weg konnte nicht angelegt werden', e); }
  } catch (e) { console.error('Storage failed', e); }
  window.location.href = 'haus.html';
}

render();
</script>
<script src="/feedback-spikiu.js" defer></script>
</body>
</html>
