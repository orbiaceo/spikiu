// Blase → Textfeld. Abbrechen stellt die Blase wieder her.
function reelEditStart(slide){
  if (busy || guiding) return;
  var ui = editUI();
  var alt = slide.dataset.userText || '';
  slide.innerHTML = '';
  var box = document.createElement('div'); box.className = 'reel-editbox';
  var ta = document.createElement('textarea'); ta.rows = 3; ta.value = alt;
  var row = document.createElement('div'); row.className = 'reel-editrow';
  var no = document.createElement('button'); no.type='button'; no.className='no'; no.textContent = ui.no;
  var ok = document.createElement('button'); ok.type='button'; ok.className='ok'; ok.textContent = ui.ok;
  var istStift = slide.classList.contains('rk-btn');
  var istEcho = slide.classList.contains('reel-echo');
  if (istStift){
    // Der Stift sitzt in der Kopfzeile: das Feld oeffnet sich auf DERSELBEN
    // Karte, nicht anstelle des Knopfs.
    var karte = slide.closest('.reel-slide');
    var vorhanden = karte.querySelector('.reel-editbox');
    if (vorhanden){ vorhanden.remove(); fitSlide(karte); return; }
    var bx = document.createElement('div'); bx.className = 'reel-editbox';
    var t2 = document.createElement('textarea'); t2.rows = 2; t2.value = alt;
    var r2 = document.createElement('div'); r2.className = 'reel-editrow';
    var n2 = document.createElement('button'); n2.type='button'; n2.className='no'; n2.textContent = ui.no;
    var o2 = document.createElement('button'); o2.type='button'; o2.className='ok'; o2.textContent = ui.ok;
    n2.onclick = function(){ bx.remove(); fitSlide(karte); };
    o2.onclick = function(){
      var nn = t2.value.trim();
      if (nn.length < 2 || nn === alt){ bx.remove(); fitSlide(karte); return; }
      reelEditResend(slide, nn);
    };
    r2.appendChild(n2); r2.appendChild(o2);
    bx.appendChild(t2); bx.appendChild(r2);
    karte.insertBefore(bx, karte.querySelector('.reel-kopf').nextSibling);
    fitSlide(karte);
    setTimeout(function(){ t2.focus(); t2.setSelectionRange(t2.value.length, t2.value.length); }, 40);
    return;
  }
  no.onclick = function(){
    slide.innerHTML = '';
    if (istEcho){
      // Echo: kleine Zeile mit Ändern-Knopf, wie zuvor auf Spikius Karte.
      var et = document.createElement('span'); et.className = 're-text'; et.textContent = alt;
      var ee = document.createElement('button');
      ee.type='button'; ee.className='re-edit'; ee.textContent = ui.edit;
      ee.onclick = function(){ reelEditStart(slide); };
      slide.appendChild(et); slide.appendChild(ee);
    } else {
      slide.innerHTML = '<div class="reel-userbubble">' + escPlain(alt) + '</div>';
      var eb = document.createElement('button');
      eb.type='button'; eb.className='reel-edit'; eb.textContent = ui.edit;
      eb.onclick = function(){ reelEditStart(slide); };
      slide.appendChild(eb);
    }
    var sl = slide.closest('.reel-slide') || slide; fitSlide(sl);
  };
  ok.onclick = function(){
    var neu = ta.value.trim();
    if (neu.length < 2 || neu === alt){ no.onclick(); return; }
    reelEditResend(slide, neu);
  };
  row.appendChild(no); row.appendChild(ok);
  box.appendChild(ta); box.appendChild(row);
  slide.appendChild(box);
  fitSlide(slide.closest('.reel-slide') || slide);
  setTimeout(function(){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 40);
}

// Neu senden: alles AB diesem Zug fliegt raus — aus dem Reel und aus dem verlauf.
// Nur so ist das Versehen wirklich weg; sonst antwortet Spikiu weiter darauf.
function reelEditResend(slide, neuerText){
  var reel = reelEl(); if (!reel) return;

  // 1. Wievielter Lerner-Zug ist das? Gezählt werden eigene User-Folien
  //    (geführt) UND Echos auf Spikius Karten (frei) — beide tragen
  //    data-user-text, in der Reihenfolge, in der sie im Reel stehen.
  var traeger = reel.querySelectorAll('[data-user-text]');
  var nummer = -1;
  for (var i = 0; i < traeger.length; i++){ if (traeger[i] === slide){ nummer = i; break; } }
  if (nummer < 0) return;
  var gefunden = nummer;
  // Die Karte, ab der aufgeräumt wird: bei einem Echo ist es Spikius Karte.
  var abKarte = (slide.classList.contains('reel-echo') || slide.classList.contains('rk-btn'))
    ? slide.closest('.reel-slide') : slide;

  // 2. verlauf bis vor diesen user-Eintrag kürzen (Spikius Antwort darauf inklusive)
  var z = 0, schnitt = verlauf.length;
  for (var v = 0; v < verlauf.length; v++){
    if (verlauf[v].role === 'user'){
      if (z === gefunden){ schnitt = v; break; }
      z++;
    }
  }
  verlauf = verlauf.slice(0, schnitt);

  // 3. Folien ab hier entfernen (Lerner-Folie wird ohnehin neu gebaut)
  var weg = false;
  reelSlides().forEach(function(s){
    if (s === abKarte) weg = true;
    if (weg) s.remove();
  });
  offenerEcho = null;
  removeLearnerSlide();

  // 4. Der korrigierte Zug zählt NICHT als neue Kostprobe — es ist derselbe Zug.
  reelResendLaeuft = true;
  sendUserTurn(neuerText);
}
var reelResendLaeuft = false;
// Lerner-Slide: Textfeld → Senden ruft den BESTEHENDEN sendUserTurn(). Optional „Beenden".
// Die Eingabe wandert AUF Spikius Folie: Frage und Antwort auf einer Karte.
// Ersetzt im freien Flur die eigene „Du bist dran"-Folie. Der geführte Modus
// behält seine Lerner-Folie, weil dort Karten und Chips darauf sitzen.
function appendAntwortFeld(slide){
  if (!slide || slide.querySelector('.reel-antwort')) return;
  var ui = reelUI();
  var box = document.createElement('div');
  box.className = 'reel-antwort';
  // Kein „Du bist dran": der Rahmen sagt es schon. Platzhalter sind drei Punkte.
  // Kein „Gespräch beenden" mehr im Fuß — es sitzt als ✕ in der Kopfzeile,
  // wo es bei jeder Karte gleich steht und nie mitwächst.
  // Der Ausgang erscheint erst, wenn die letzte Aufgabe läuft — nicht davor.
  var letzte = szeneAufgaben.length && szeneOffen === szeneAufgaben.length - 1;
  var SCHLUSS = { de:'Senden & abschließen', es:'Enviar y terminar', en:'Send & finish' };
  box.innerHTML = '<textarea id="reelInput" rows="2" placeholder="\u00b7\u00b7\u00b7"></textarea>'
    + '<button class="ra-send' + (letzte ? ' ausgang' : '') + '" type="button" id="reelSendBtn">'
    + escPlain(letzte ? (SCHLUSS[uiLang()] || SCHLUSS.de) : ui.send) + '</button>';
  slide.appendChild(box);
  slide.classList.add('hat-antwort');       // blendet den Wisch-Hinweis aus
  box.querySelector('#reelSendBtn').onclick = reelSend;
  var ta = box.querySelector('#reelInput');
  if (ta){
    ta.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); reelSend(); } });
    ta.addEventListener('input', function(){
      if (ta.dataset.zweit && ta.value.trim() !== ta.dataset.zweit){
        ta.dataset.zweit = ''; ta.classList.remove('gewarnt'); reelWarnWeg();
      }
    });
  }
  fitSlide(slide);
}

// Die letzte Spikiu-Folie bekommt das Feld. Gibt es keine (Gesprächsanfang),
// bleibt es bei der eigenen Einladungs-Folie.
function antwortAufLetzterFolie(){
  var reel = reelEl(); if (!reel) return false;
  var alle = reel.querySelectorAll('.reel-slide.reel-spikiu:not(#reelTyping):not(#reelErr)');
  if (!alle.length) return false;
  removeLearnerSlide();
  appendAntwortFeld(alle[alle.length - 1]);
  return true;
}

function renderLearnerSlide(first){
  var reel = reelEl(); if (!reel) return;
  removeLearnerSlide();
  var ui = reelUI();
  // „Beenden" zeigen, sobald das Gespräch begonnen hat (≥1 gerenderter Spikiu-Slide).
  // Verlässlicher als verlauf.length: turn() rendert vor dem assistant-Push.
  var canEnd = !!reel.querySelector('.reel-slide.reel-spikiu:not(#reelTyping)');
  var slide = document.createElement('div');
  slide.className = 'reel-slide reel-learner'; slide.id = 'reelLearner';
  slide.innerHTML = '<div class="reel-learner-head">' + escPlain(first ? ui.start : ui.yourTurn) + '</div>'
    + '<div class="reel-learner-field"><textarea id="reelInput" rows="2" placeholder="' + ui.write.replace(/"/g,'&quot;') + '"></textarea>'
    + '<button class="reel-send" type="button" id="reelSendBtn">' + escPlain(ui.send) + '</button></div>'
    + (canEnd ? '<button class="reel-end" type="button" id="reelEndBtn">' + escPlain(ui.end) + '</button>' : '');
  reel.appendChild(slide);
  slide.querySelector('#reelSendBtn').onclick = reelSend;
  var ta = slide.querySelector('#reelInput');
  if (ta){
    ta.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); reelSend(); } });
    // Sobald der Nutzer etwas ändert, ist die Warnung veraltet — sonst glaubt er,
    // seine korrigierte Eingabe sei immer noch falsch (Beobachtung 18.08.2026).
    ta.addEventListener('input', function(){
      if (ta.dataset.zweit && ta.value.trim() !== ta.dataset.zweit){
        ta.dataset.zweit = '';

// ── Vertipper-Filter ───────────────────────────────────────────────────
// Bewusst ENG: darf einen echten kurzen Zug nie blockieren. „Sí", „hola",
// „Un café" müssen durch — „Gor", „asdf", „xkcd" nicht.
var ECHTE_KURZE = { si:1,'sí':1,no:1,ja:1,yes:1,ok:1,hola:1,pan:1,'café':1,cafe:1,
  agua:1,uno:1,dos:1,tres:1,gut:1,und:1,der:1,die:1,das:1,ich:1,du:1,er:1,sie:1,
  soy:1,'té':1,te:1,con:1,sin:1,mas:1,'más':1,por:1,que:1,'qué':1,wie:1,wo:1,wer:1,
  was:1,hi:1,hey:1,bye:1,gern:1,bitte:1,dank:1,nein:1,doch:1,also:1,noch:1,nur:1,
  ναι:1,'όχι':1,'γεια':1 };
var WARN_UI = {
  de:{ warn:'Sieht nach einem Vertipper aus. Nochmal senden schickt es trotzdem.', korr:'← Zug korrigieren' },
  es:{ warn:'Parece un error de tecleo. Pulsa enviar otra vez para mandarlo igual.', korr:'← Corregir mi mensaje' },
  en:{ warn:'Looks like a typo. Press send again to send it anyway.', korr:'← Fix my message' }
};
function warnUI(){ return WARN_UI[uiLang()] || WARN_UI.de; }

function vertipper(s){
  var t = (s || '').trim();
  if (t.length < 2) return 'kurz';
  if (t.indexOf(' ') === -1){
    if (!/[aeiouáéíóúäöüàèìòùαεηιουω]/i.test(t)) return 'vokallos';
    if (/^(.)\1+$/i.test(t)) return 'wiederholung';
    if (/^[a-zäöüß]{2,4}$/i.test(t) && !ECHTE_KURZE[t.toLowerCase()]) return 'unbekannt';
  }
  if (/(.)\1{3,}/.test(t)) return 'salat';
  return null;
}

function reelSend(){
  if (busy || guiding || szeneBeendet) return;
  var ta = document.getElementById('reelInput'); if (!ta) return;
  var text = ta.value.trim();
  // Stiller Enter-Schutz: ein einzelnes Zeichen ist fast immer ein zu früh
  // gedrücktes Enter. Es geht nichts raus — kein Dialog, der Text bleibt stehen.
  if (text.length < 2) return;

  // Vertipper-Filter: erster Versuch warnt nur, KEIN Aufruf. Zweiter Druck
  // auf denselben Text schickt es doch.
  if (vertipper(text) && ta.dataset.zweit !== text){
    ta.dataset.zweit = text;
    ta.classList.add('gewarnt');
    reelWarnZeigen(warnUI().warn);
    return;
  }
  ta.value = ''; ta.dataset.zweit = '';
  ta.classList.remove('gewarnt');
  reelWarnWeg();
  // Das Feld bleibt stehen — reelTypingOn() macht daraus die Warte-Punkte,
  // reelTypingOff() raeumt es weg. So wartet der Lerner auf seiner Karte.
  reelSendVerdaechtig = !!vertipper(text);   // für den Korrektur-Knopf
  sendUserTurn(text);          // MOTOR unverändert (addMessage('user') routet hierher)
}
var reelSendVerdaechtig = false;

function reelWarnZeigen(txt){
  // Die Warnung haengt dort, wo das Eingabefeld gerade sitzt: im freien Flur
  // auf Spikius Folie, im gefuehrten auf der eigenen Lerner-Folie.
  var ta = document.getElementById('reelInput');
  var slide = ta ? (ta.closest('.reel-slide') || document.getElementById('reelLearner'))
                 : document.getElementById('reelLearner');
  if (!slide) return;
  reelWarnWeg();
  var w = document.createElement('div'); w.className = 'reel-warn'; w.textContent = txt;
  slide.appendChild(w); fitSlide(slide);
}
function reelWarnWeg(){
  var w = document.querySelector('.reel-warn'); if (w) w.remove();
}

// Vom Antwort-Slide direkt zurück auf die eigene Blase, Textfeld sofort offen.
// Der Nutzer soll nicht erst suchen lernen müssen, wo sein Zug lag.
function reelKorrigieren(){
  var alle = reelSlides();
  for (var k = alle.length - 1; k >= 0; k--){
    if (alle[k].classList.contains('reel-user')){
      reelGoTo(k);
      reelEditStart(alle[k]);
      return;
    }
  }
}
function reelEnd(){
  if (gefuehrt){ terminar(); return; }   // geführtes Sprechen: regulärer Abschluss
  renderReelSchluss();                   // freier Flur: Schluss-Karte IM Reel
}

// Die Szene endet im Reel, nicht im alten Blasen-Chat. Beide Wege führen nach
// Hause: mit Lektion oder ohne. Vorher landete der Lerner in einer Ansicht, in
// der Spikiu weiterredete und das Angebot sich verdoppelte.
function renderReelSchluss(){
  var reel = reelEl(); if (!reel) return;
  if (document.getElementById('reelSchluss')) return;
  szeneBeendet = true;                 // ab jetzt rendert nichts mehr nach
  busy = true;                          // und es geht kein Zug mehr raus
  removeLearnerSlide();
  var w = document.querySelector('.reel-antwort'); if (w) w.remove();
  var ui = endUI();

  var slide = document.createElement('div');
  slide.id = 'reelSchluss';
  slide.className = 'reel-slide reel-spikiu reel-schluss';

  // Die ERNTE statt der Lektionsfrage: Wendungen und Wörter der Station,
  // mit Klang. Alles aus lernpfad-daten.js — null Token, kein Aufruf.
  // „La cuenta, por favor" bringt weiter, „la cuenta" allein nicht.
  var ERNTE_UI = {
    de:{ titel:'Das hast du geübt', sagen:'Das kannst du sagen', woerter:'Wörter', heim:'Nach Hause' },
    es:{ titel:'Esto has practicado', sagen:'Esto ya lo puedes decir', woerter:'Palabras', heim:'A casa' },
    en:{ titel:'This is what you practised', sagen:'You can say this now', woerter:'Words', heim:'Home' }
  };
  var eui = ERNTE_UI[uiLang()] || ERNTE_UI.de;
  var geerntet = [];
  try {
    var D2 = window.SpikiuLernpfad, P2 = window.SpikiuPfad;
    if (D2 && D2.ernte && P2 && TOPIC_ID) geerntet = D2.ernte(P2.stufe(), TOPIC_ID, uiLang()) || [];
  } catch(e){}

  if (geerntet.length){
    var t0 = document.createElement('div');
    t0.className = 'rs-frage'; t0.textContent = eui.titel;
    slide.appendChild(t0);
    var box = document.createElement('div'); box.className = 'reel-ernte';
    function ernteGruppe(titel, liste){
      if (!liste.length) return;
      var h = document.createElement('div'); h.className = 'e-kopf'; h.textContent = titel;
      box.appendChild(h);
      liste.forEach(function(x){
        var z = document.createElement('div'); z.className = 'e-z';
        var ab = document.createElement('button');
        ab.type = 'button'; ab.className = 'e-a'; ab.innerHTML = SPK_ICON;
        ab.onclick = function(){ playFrom(ab, plainForSpeech(x.z), 'playing'); };
        var w = document.createElement('span'); w.className = 'e-w'; w.textContent = x.z;
        var tr = document.createElement('span'); tr.className = 'e-t'; tr.textContent = x.na;
        z.appendChild(ab); z.appendChild(w); z.appendChild(tr);
        box.appendChild(z);
      });
    }
    ernteGruppe(eui.sagen,  geerntet.filter(function(x){ return x.art === 'wendung'; }));
    ernteGruppe(eui.woerter, geerntet.filter(function(x){ return x.art === 'wort'; }));
    slide.appendChild(box);
  } else {
    slide.innerHTML = '<div class="reel-capy" aria-hidden="true">' + CAPY_SMALL + '</div>'
      + '<div class="rs-frage">' + escPlain(ui.offer) + '</div>';
  }

  var ja = document.createElement('button');
  ja.type = 'button'; ja.className = 'rs-btn ja';
  ja.textContent = geerntet.length ? eui.heim : ui.yes;
  ja.onclick = function(){
    ja.disabled = true;
    if (geerntet.length){
      try { if (window.SpikiuSitzung) window.SpikiuSitzung.raeume('gespraech'); } catch(e){}
      location.href = 'haus.html';
    } else makeLessonAndLeave();
  };
  slide.appendChild(ja);

  if (!geerntet.length){
    var nein = document.createElement('button');
    nein.type = 'button'; nein.className = 'rs-btn nein'; nein.textContent = ui.no;
    nein.onclick = function(){
      try { if (window.SpikiuSitzung) window.SpikiuSitzung.raeume('gespraech'); } catch(e){}
      location.href = 'haus.html';
    };
    slide.appendChild(nein);
  }
  reel.appendChild(slide);
  reelGoTo(reelSlides().length - 1);
}

// ── Phase 3a (Teil 45): geführte Sprechen-Elemente als Reel-Slides ──────────
// Antwort-Paletten → Tinder-Karten auf dem Lerner-Slide (Tipp = bestehender
// sendUserTurn). Korrektur + Szenenende-Menü als eigene Slides. Inhalt/Logik
// unverändert — nur Platzierung im Reel statt als Chat-Blasen.
function renderReelCards(optionen){
  var learner = document.getElementById('reelLearner'); if (!learner) return;
  var head = learner.querySelector('.reel-learner-head');
  if (head) head.textContent = PALETTE_LABEL[uiLang()] || PALETTE_LABEL.de;   // Karten primär
  var old = learner.querySelector('.reel-cards'); if (old) old.remove();
  var cards = document.createElement('div'); cards.className = 'reel-cards';
  optionen.forEach(function(o){

// Routing aus den Anzeige-Funktionen (nur bei reelActive). Parsing/Logik unverändert:
// dieselbe splitThoughts/splitBridge/fmt/plainForSpeech/playFrom wie die Blasen.
function addReelMessage(role, text){
  removeLearnerSlide();
  if (role === 'spikiu'){
    var firstNew = reelSlides().length;     // Index der ERSTEN neuen Spikiu-Karte
    var segments = splitThoughts(text);
    if (!segments.length) segments = [text || ''];
    segments.forEach(function(seg){
      var parts = splitBridge(seg);
      appendSpikiuSlide(parts.ziel, parts.trans);
    });
    // Frei: die Eingabe sitzt AUF Spikius letzter Karte. Geführt: eigene Folie,
    // weil dort Karten und Antwort-Chips liegen.
    if (!gefuehrt) antwortAufLetzterFolie(); else renderLearnerSlide(false);
    reelGoTo(firstNew);             // zuerst Spikius neue Karte zeigen
  } else {
    appendUserSlide(text);
    reelGoTo(reelSlides().length - 1);   // die Wahl/der Tipp des Lerners kurz sichtbar
  }
}

// Ja → Lektion DIREKT erzeugen (Generator + Schema unberührt), rolling-3 speichern,
// dann sanfte Auflösung → Dashboard. Speichern MUSS vor der Navigation passieren.
// Teil 61: Der Transcript wird beim Klick SOFORT persistiert (spikiu_pending_lesson),
// BEVOR das Netz läuft → ein Fehlschlag verliert NICHTS. Erfolg = Lektion speichern +
// pending löschen. Fehler = pending BLEIBT (der nav.js-Finalizer macht sie auf der
// nächsten Seite fertig), ehrliche beruhigende Nachricht + „Nochmal versuchen".
var FREI_LESSON = { de:'Freies Gespräch', es:'Conversación libre', en:'Free chat' };

async function makeLessonAndLeave(){
  // Spinner, Fehlermeldung und „Nochmal versuchen" leben im Blasen-Chat. Der ist
  // versteckt, solange der Reel laeuft — deshalb wirkte „Ja, gern" wie ein toter
  // Knopf (19.08.2026). Erst den Reel verlassen, dann die Lektion bauen.
  if (reelActive){
    var rs = document.getElementById('reelSchluss'); if (rs) rs.remove();
    exitReel();
    chat.innerHTML = '';                 // die Szene ist vorbei — keine alten Blasen
  }
  var offer = document.getElementById('lessonOffer'); if (offer) offer.remove();
  var oldRetry = document.getElementById('lessonRetry'); if (oldRetry) oldRetry.remove();
  setExitVisible(false); freeExitBar.hidden = true;
  showLessonSpinner();
  var ui = endUI();
  var u = {};
  try { u = JSON.parse(localStorage.getItem('spikiu_user') || '{}'); } catch(e){ u = {}; }

  // (1) SOFORT sichern — bestehenden pending-Eintrag wiederverwenden („Nochmal versuchen"
  //     nutzt denselben), sonst neu anlegen und schreiben.
  var pending = null;
  try { pending = JSON.parse(localStorage.getItem('spikiu_pending_lesson') || 'null'); } catch(e){ pending = null; }
  if (!pending || pending.status !== 'pending' || !pending.body){
    pending = {
      id: 'lesson_' + Date.now(),
      body: {
        name:                u.name,
        nativeLang:          u.nativeLang,
        profile:             u.profile,
        conversationHistory: buildConvoForLesson()
      },
      thema:       TOPIC_LABEL || (FREI_LESSON[uiLang()] || FREI_LESSON.de),   // Teil 53: Thema fürs Archiv
      zielsprache: PROFILE.zielsprache,
      createdAt:   new Date().toISOString(),
      status:      'pending'
    };
    try { localStorage.setItem('spikiu_pending_lesson', JSON.stringify(pending)); } catch(e){}
  }
  // Teil 62: Der Transcript ist jetzt im pending gesichert (Teil 61) → die Live-Sitzung
  // ist nicht mehr nötig; gespraech-Schlüssel räumen, kein Zombie-Resume des fertigen Gesprächs.
  gespraechRaeumen();

  // (2) Netz: Body robust lesen, ECHTEN Fehlergrund SEHEN (Charta), nie bloß „hat nicht geklappt".
  var r = null, raw = '', d = null;
  try {
    r = await fetch('/api/generate-lesson', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(pending.body)
    });
    try { raw = await r.text(); } catch(e){ raw = ''; }
    try { d = raw ? JSON.parse(raw) : null; } catch(e){ d = null; }
  } catch(e){ r = null; d = null; raw = String((e && e.message) || e); }
  hideLessonSpinner();

  if (!r || !r.ok || !d || !d.lesson){
    console.error('generate-lesson ' + (r ? r.status : 'netz'), errDetail(d, raw));
    // pending BLEIBT → der nav.js-Finalizer macht die Lektion auf der nächsten Seite fertig.
    showLessonBgSafe(ui);                   // beruhigend, KEINE Navigation, Beenden bleibt erreichbar
    updateFreeExit();
    return;
  }

  // (3) ERFOLG: Eintrag aus pending (id/createdAt/thema → identisch zum Finalizer), pending löschen.
  var entry = {
    id:               pending.id,
    topic:            (d.lesson.title) || 'Lektion',
    thema:            pending.thema,
    fromConversation: true,
    lesson:           d.lesson,
    createdAt:        pending.createdAt,
    zielsprache:      pending.zielsprache
  };
  // Rolling-Archiv: anhängen (per id entdoppelt), nach createdAt absteigend, max 14 (Teil 53).
  var arr = Array.isArray(u.lessons) ? u.lessons.slice() : [];
  if (!arr.some(function(l){ return l && l.id === pending.id; })) arr.push(entry);
  arr.sort(function(a, b){ return (b.createdAt || '').localeCompare(a.createdAt || ''); });
  u.lessons = arr.slice(0, 14);
  try { localStorage.setItem('spikiu_user', JSON.stringify(u)); } catch(e){}        // VOR der Navigation
  try { localStorage.removeItem('spikiu_pending_lesson'); } catch(e){}              // erledigt → kein Finalizer-Lauf
  addPlainSpikiu(ui.byeMade);
  // Sanfte Auflösung (fade + leichtes blur) → Dashboard.
  var app = document.querySelector('.app');
  setTimeout(function(){ if (app) app.classList.add('dissolving'); }, 350);
  // Beenden heißt beenden: nach Hause, nicht ins Dashboard. Die Lektion
  // liegt dort und wartet — der Lerner findet sie über die Bibliothek.
  setTimeout(function(){ window.location.href = 'haus.html'; }, 1050);
}

// ── Backend ──────────────────────────────────────────────────────
// Den ECHTEN Fehlergrund aus einer Server-Antwort ziehen (Anthropic/Backend), nicht nur den Status.
// d = geparster Body (oder null), raw = roher Text (Fallback, falls kein JSON).
function errDetail(d, raw){
  if (d){
    if (d.error && d.error.message) return d.error.message;
    if (d.error && d.error.type) return d.error.type;
    if (typeof d.error === 'string') return d.error;
    if (d.detail) return d.detail;
    if (d.message) return d.message;
    try { return JSON.stringify(d); } catch(e){}
  }
  return (raw || '').replace(/\s+/g,' ').trim().slice(0, 300) || 'kein Body';
}

async function callGespraech(){
  // Verlauf glätten: nie zwei gleiche Rollen hintereinander (sonst lehnt Anthropic ab).
  function alternate(msgs){
    var out = [];
    for (var i=0;i<msgs.length;i++){
      if (out.length && out[out.length-1].role === msgs[i].role) out[out.length-1] = msgs[i];
      else out.push(msgs[i]);
    }
    return out;
  }
  // Body bombensicher: messages IMMER Array, profile IMMER vollständig.
  var safeProfile = {
    name:          (PROFILE && PROFILE.name) || '',
    muttersprache: (PROFILE && PROFILE.muttersprache) || 'de',
    zielsprache:   (PROFILE && PROFILE.zielsprache) || 'es',
    koennen:       (PROFILE && PROFILE.koennen) || 'anfang',
    fremde_schrift: !!(PROFILE && PROFILE.fremde_schrift)
  };
  // Der Anker: die offene Aufgabe geht als eigener Auftrag mit. Spikiu bekommt
  // damit je Zug EINE Anweisung — deshalb kann die Szene nicht entgleisen.
  // Die Rollen verhindern, dass er eine dritte Figur erfindet.
  if (!gefuehrt && szeneAufgaben.length){
    var mu = safeProfile.muttersprache;
    var Rz = (window.SpikiuLernpfad && TOPIC_ID) ? window.SpikiuLernpfad.rolle(TOPIC_ID) : null;
    safeProfile.szene = {
      offen:      szeneOffen < szeneAufgaben.length
                    ? (szeneAufgaben[szeneOffen][mu] || szeneAufgaben[szeneOffen].de) : null,
      beispiel:   szeneBeispiele[szeneOffen] ? szeneBeispiele[szeneOffen].z : '',
      erledigt:   szeneOffen,
      gesamt:     szeneAufgaben.length,
      zug:        szeneZug + 1,
      maxZuege:   SZENE_ZUG_DECKEL,
      rolleSpikiu: Rz ? (Rz.spikiu[mu] || Rz.spikiu.de) : '',
      rolleLerner: Rz ? (Rz.lerner[mu] || Rz.lerner.de) : '',
      ort:         Rz ? (Rz.ort[mu] || Rz.ort.de) : ''
    };
  }
  // (1) Gleit-Fenster: nur Seed + die letzten GESP_WINDOW Nachrichten ausgehend.
  // verlauf bleibt unangetastet (Referenzen → unten beim Cap NIE in-place mutieren).
  function fenster(msgs){
    if (msgs.length <= GESP_WINDOW) return msgs.slice();
    var tail = msgs.slice(msgs.length - GESP_WINDOW);
    var seed = msgs[0];                                   // geführtes Thema = Seed-User-Zug
    if (gefuehrt && seed && seed.role === 'user' && tail.indexOf(seed) === -1) tail = [seed].concat(tail);
    while (tail.length && tail[0].role !== 'user') tail.shift();   // Backend verlangt user-first (kein [EINSTIEG]-Zweit-Gruß)
    return tail;
  }
  var safeMessages = alternate(fenster(Array.isArray(verlauf) ? verlauf : []));

  // (2) Sprechen-Cap: nur im geführten Rollenspiel. Ab GESP_CAP Spikiu-Zügen den
  // stillen Abschluss-Hinweis an die AUSGEHENDE letzte User-Nachricht hängen — als
  // NEUES Objekt (safeMessages trägt verlauf-Referenzen; in-place würde verlauf/Persistenz vergiften).
  if (gefuehrt){
    var spikiuZuege = 0;
    for (var si=0; si<verlauf.length; si++) if (verlauf[si] && verlauf[si].role === 'assistant') spikiuZuege++;
    if (spikiuZuege >= GESP_CAP){
      for (var ui=safeMessages.length-1; ui>=0; ui--){
        if (safeMessages[ui].role === 'user'){
          safeMessages[ui] = { role: 'user', content: safeMessages[ui].content + '\n\n' + CLOSE_HINT };
          break;
        }
      }
    }
  }

  var r = await fetch(ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: safeMessages, profile: safeProfile, maxTokens: 300 })
  });
  // Diagnose (Charta: den echten Fehler SEHEN, nicht raten): Body robust lesen (Text→JSON),
  // bei !ok die volle Server-Antwort loggen und den ECHTEN Grund in den Fehler geben.
  var raw = '';
  try { raw = await r.text(); } catch(e){ raw = ''; }
  var d = null;
  try { d = raw ? JSON.parse(raw) : null; } catch(e){ d = null; }
  if (!r.ok){
    console.error('gespraech ' + r.status, d || raw);
    throw new Error('http ' + r.status + ' · ' + errDetail(d, raw));
  }
  return (d && d.text) || '';
}

// EINE Runde abrufen: leere History → Opener, sonst Antwort auf den letzten User-Zug.
// (Bei Retry unverändert wiederholbar, weil der User-Zug schon in verlauf steht.)
async function turn(){
  if (busy) return;
  busy = true; sendBtn.disabled = true; lastTurnOk = false; showTyping();
  var reply;
  try {
    reply = await callGespraech();          // nur Netzwerk
  } catch(e){
    hideTyping(); showError('Netz: ' + ((e && e.message) || e));
    busy = false; sendBtn.disabled = input.value.trim() === ''; return;
  }
  hideTyping();
  try {
    // Signale in fester Reihenfolge abfangen, NIE als Rohtext zeigen:
    // [KARTE] → Erklärkarte (unterbricht) · [WECHSEL] → Tür ·
    // [KORREKTUR] → Karte (vor dem Menü) · [SZENENENDE] → Menü.
    // Der Fortschritt hängt NICHT am Modell. Erst tat er es — Spikiu sollte
    // [AUFGABE] melden — und lieferte den Marker fast nie: die Aufgabe blieb
    // bei 1 von 3 stehen, der Souffleur wiederholte ewig denselben Satz
    // (gesehen 19.08.2026). Jetzt rückt jeder Zug des Lerners eine Aufgabe
    // weiter. Das ist ehrlicher: die Aufgaben führen, sie prüfen nicht.
    // Der Marker wird nur noch aus dem Text entfernt, falls er doch kommt.
    if (!gefuehrt && szeneAufgaben.length){
      reply = reply.replace(/\[AUFGABE\]/g, '').trim();
      if (szeneStartzug){
        szeneStartzug = false;             // Startschuss: Aufgabe 1 bleibt offen
      } else {
        szeneZug++;
        if (szeneOffen < szeneAufgaben.length) szeneOffen++;
      }
    }
    var ka = extractKarte(reply);
    var w = extractWechsel(ka.text);
    var k = extractKorrektur(w.text);
    var s = extractSceneEnd(k.text);
    var o = extractOptionen(s.text);                        // [OPTIONEN] → Antwort-Chips
    var shown = o.text;
    if (!shown && !ka.karte && !k.pairs.length && !s.ended && !w.ziel && !o.optionen.length) shown = reply;  // malformed → roh statt leer

    // Die Karte ist die GANZE Antwort: kein Fließtext daneben, keine Rollen-Replik
    // im selben Zug. Sonst mischt sich die Szene wieder in die Erklärung.
    if (ka.karte){
      renderErklaerung(ka.karte);
      // In den Verlauf wandert eine NOTIZ, nicht die Karte. Läge das Kartenformat
      // im Verlauf, ahmte Spikiu es in den Folgezügen nach und antwortete auch
      // auf normale Gesprächszüge in Kartenform.
      var kurz = String(ka.karte.z || ka.karte.regel || '').slice(0, 40);
      verlauf.push({ role:'assistant', content:'(Erklärkarte: ' + kurz + ')' });
      sitzungSpeichern();
      lastTurnOk = true;
      busy = false; sendBtn.disabled = input.value.trim() === '';
      return;                                               // Szene läuft beim nächsten Zug weiter
    }

    // Alle Aufgaben erledigt oder Zug-Decke erreicht: die Szene schließt.
    // Die Replik wird noch gezeigt, danach kommt die Schluss-Karte.
    var szeneVorbei = !gefuehrt && szeneAufgaben.length
      && (szeneOffen >= szeneAufgaben.length || szeneZug >= SZENE_ZUG_DECKEL);

    if (szeneBeendet) return;          // die Szene ist zu — keine Nachzügler
    if (shown){
      addMessage('spikiu', shown);                          // nur Anzeige (ohne Marker)
      verlauf.push({ role: 'assistant', content: shown });  // sauberer Verlauf (Marker raus, [[…]] bleibt)
      sitzungSpeichern();                                   // Teil 62: nach dem Assistant-Zug sichern
    }
    lastTurnOk = true;                                      // Runde sauber → Opener darf die Gabelung zeigen
    if (k.pairs.length){ korrekturen = korrekturen.concat(k.pairs); renderKorrekturCard(k.pairs); }
    if (w.ziel) addDoorButton(w.ziel);                      // sanfter Knopf, kein Auto-Sprung
    if (s.ended) renderEndMenu();                           // drei Knöpfe nach der Karte
    else if (szeneVorbei) renderReelSchluss();              // Aufgaben erledigt oder Zug-Decke erreicht
    else if (o.optionen.length) renderOptionen(o.optionen); // sonst: Antwort-Chips (nur geführt, in renderOptionen geprüft)
  } catch(e){
    showError('Anzeige: ' + ((e && e.message) || e));
  }
  busy = false;
  sendBtn.disabled = input.value.trim() === '';
  updateFreeExit();                 // freier „Gespräch beenden" ein-/ausblenden (Teil 32 #1)
  input.focus();
}

function sendMessage(){
  if (busy || guiding) return;
  var text = input.value.trim();
  if (!text) return;
  input.value = ''; input.style.height = 'auto'; sendBtn.disabled = true;
  sendUserTurn(text);               // wer frei tippt, hat die Wahl getroffen (schließt Gabelung/Palette)
}

function pickTopic(label, id){
  if (busy || guiding) return;
  setOpenerChrome(false);                // Gespräch beginnt → Schreibfeld + Profil-Chip wieder ein (geführt: sichtbar, aber gesperrt)
  removeGabelung();

  TOPIC_LABEL = label;
  TOPIC_ID = id || null;                 // Teil 64: feste Themen treffen die DB; Frei-Themen (kein id) → API-Fallback

  // FREIES GESPRÄCH: keine Häppchen, keine Drills, keine Leiste.
  // Wörter, Hören und Sprechen sind Sache des geführten Raums — hier wird
  // GESPROCHEN. Das ist nicht nur die Architektur-Entscheidung vom 18.08.2026,
  // es beendet auch die doppelte Karten-Umsetzung: die .hap-/.hv-Widgets in
  // dieser Datei laufen nur noch im geführten Modus, wo sie herkommen.
  if (getModus() === 'frei'){
    gefuehrt = false;                    // freier Flur: keine Antwort-Chips erzwingen
    hideRail();
    enterReel();
    removeLearnerSlide();                // die Bühne kommt zuerst, nicht das Textfeld
    var start = function(){
      szeneStartzug = true;                // der Themen-Wunsch ist keine Antwort
      sendUserTurn((WUNSCH[uiLang()] || WUNSCH.de)(label));
    };
    // Bühnenkarte statt Spikius Höflichkeitszug: Bild, Rollen, „Los!".
    // Fehlen Rollen oder Bild, geht es ohne sie direkt los.
    if (!renderBuehne(TOPIC_ID, start)) start();
    return;
  }

  gefuehrt = true;                       // geführtes Thema-Rollenspiel → Antwort-Chips erlaubt
  showRail(); setStage('wortschatz');
  enterReel();                           // Phase 3b: der GANZE geführte Pfad läuft im horizontalen Deck
  addMessage('user', label);             // die Wahl als (erste) Karte im Deck
  loadHaeppchen();
}

async function loadHaeppchen(){
  lockComposer(true);
  warmVoice(PROFILE.zielsprache);     // Stimme still im Hintergrund vorwärmen (gilt für beide Wege)
  // Teil 64: feste DB ZUERST (kein API-Call, kein Spinner) — Wörter/Hören sind fester Inhalt.
  // Nur Frei-Themen ohne DB-Eintrag (kein TOPIC_ID / Thema fehlt) fallen auf /api/haeppchen zurück.
  var local = (window.spikiuHaeppchen && TOPIC_ID)
    ? window.spikiuHaeppchen(TOPIC_ID, PROFILE.zielsprache, PROFILE.muttersprache)
    : null;
  if (local && Array.isArray(local.wortschatz) && local.wortschatz.length){
    HAP = local;
    renderWortschatz();
    return;                           // KEIN API-Call
  }
  showHapSpinner();
  var data = null, r = null, raw = '';
  try {
    r = await fetch('/api/haeppchen', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        thema:          TOPIC_LABEL,
        zielsprache:    PROFILE.zielsprache,
        muttersprache:  PROFILE.muttersprache,
        koennen:        PROFILE.koennen,
        fremde_schrift: !!PROFILE.fremde_schrift
      })
    });
    try { raw = await r.text(); } catch(e){ raw = ''; }
    try { data = raw ? JSON.parse(raw) : null; } catch(e){ data = null; }
    // Diagnose: 400 hier 't würde sonst still als „skip" durchrutschen → Status + Body sichtbar.
    if (!r.ok) console.error('haeppchen ' + r.status, data || raw);
  } catch(e){ data = null; console.error('haeppchen fetch fehlgeschlagen', e); }
  hideHapSpinner();
  // Robust: ohne brauchbaren Wortschatz NICHT hängen bleiben — direkt ins Rollenspiel
  // (der P1-Pfad funktioniert allein; die Häppchen sind ein Plus, kein Muss).
  if (!data || !Array.isArray(data.wortschatz) || !data.wortschatz.length){
    console.warn('haeppchen übersprungen', r ? ('status ' + r.status + ' · ' + errDetail(data, raw)) : 'kein Response', data);
    addNote(HAP_UI[uiLang()].skip);
    startSeedTurn();
    return;
  }
  HAP = data;
  renderWortschatz();
}

// Fisher-Yates — mischt eine Kopie (für die Antwort-Position + Wort-Chips).
function shuffle(a){
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// Dispatcher: zwei Übungstypen. typ „woerter" → Wörter-Tippen, sonst Minimalpaar A/B.

  if (item && item.typ === 'woerter' && Array.isArray(item.woerter) && item.woerter.length){

  } else {
    renderMinimalpaar(item);

}

function buildStaticLesson(){
  var ui = uiLang(), L = LESSON_UI[ui] || LESSON_UI.de;
  var list = (typeof HAP !== 'undefined' && HAP && HAP.wortschatz) ? HAP.wortschatz : [];
  var vocab = list.map(function(h){ return { word: h.ziel, translation: h.uebersetzung || '' }; });
  var dialogue = [];
  if (RP && RP.schritte && RP.schritte.length){
    RP.schritte.forEach(function(st){
      dialogue.push({ speaker: RP.rolle, text: st.spikiu.ziel, translation: st.spikiu.trans });
      var okOpt = null, k;
      for (k = 0; k < st.opts.length; k++){ if (st.opts[k].ok){ okOpt = st.opts[k]; break; } }
      if (okOpt) dialogue.push({ speaker: L.you, text: okOpt.text, translation: '' });
    });
  }
  var quiz = [];
  vocab.forEach(function(v, i){
    if (!v.translation) return;
    var distract = [];
    vocab.forEach(function(x, j){ if (j !== i && x.translation && distract.indexOf(x.translation) === -1) distract.push(x.translation); });
    var opts = shuffle([v.translation].concat(shuffle(distract).slice(0, 2)));
    quiz.push({ question: L.quizQ(v.word), options: opts, answer: v.translation });
  });
  return {
    title: TOPIC_LABEL || L.subtitle, subtitle: L.subtitle,

      var all = w.querySelectorAll('.rp-opt');
      all.forEach(function(x){ x.setAttribute('data-done', '1'); });
      if (chosen.ok){ b.classList.add('correct'); }
      else { b.classList.add('wrong'); all.forEach(function(x, idx){ if (opts[idx].ok) x.classList.add('correct'); }); }
      addFlowButton(HAP_UI[ui].weiter, function(){ RP_I++; renderRPStep(); });
    };
  });
}
// Der BESTEHENDE P1-Seed-Zug: schickt „Ich möchte das Thema … üben" an /api/gespraech
// → Themen-Entrada → Rollenspiel. Unverändert, nur jetzt NACH den Häppchen. Das Thema
// ist oben schon als User-Bubble zu sehen, darum hier kein zweites sichtbares Echo.
function startSeedTurn(){
  lockComposer(false);
  setExitVisible(true);              // Rollenspiel beginnt → Ausstieg dauerhaft erreichbar
  var seed = GAB[uiLang()].seed(TOPIC_LABEL);
  verlauf.push({ role: 'user', content: seed });
  sitzungSpeichern();                          // Teil 62: nach dem Thema-Seed sichern
  turn();
}

// Opener (Teil 35): ruhige Wahl-Seite — NUR „Wähle eine Aktivität" + die Gabelung.
// KEIN Begrüßungs-Bubble (kein Doppel-Gruß / zweiter Capy), kein Profil-Chip, kein
// Schreibfeld. Das Gespräch (und damit der erste turn()) beginnt erst nach der Wahl.
function setOpenerChrome(hidden){
  var pb = document.getElementById('profileBar');
  var ia = document.querySelector('.input-area');
  if (pb) pb.style.display = hidden ? 'none' : '';
  if (ia) ia.style.display = hidden ? 'none' : '';
}
// ── Voz primero (Paket 5): Präsenz-Gruß beim Eintritt ─────────────
// Spikiu LÄDT EIN (sanfter Puls + Hinweis) — KEIN Auto-Play. Erst der Tipp (Geste)
// spielt seine Stimme + schaltet den Capy in den Sprech-Zustand (Mund + Aura aus
// capy-vivo.js), danach wieder Ruhe. Gruß in der Zielsprache (HÖREN = lebendig);
// der Hinweis in der Muttersprache. Stimme ist beim Eintritt schon vorgewärmt (__spkBoot).
var VOZ_GREET = {
  es: function(n){ return '¡Hola' + (n ? ', ' + n : '') + '! Me alegro de verte.'; },
  de: function(n){ return 'Hallo' + (n ? ', ' + n : '') + '! Schön, dich zu sehen.'; },
  en: function(n){ return 'Hi' + (n ? ', ' + n : '') + '! Good to see you.'; },
  el: function(n){ return 'Γεια σου' + (n ? ', ' + n : '') + '! Χαίρομαι που σε βλέπω.'; }
};
var VOZ_HINT = { de:'tippen, um Spikiu zu hören', es:'toca para oír a Spikiu', en:'tap to hear Spikiu' };
// Phase 1 (Teil 43): einladende Frage in der ZIELSPRACHE (wie der Gruß — „Man betritt sie").
// Nur Präsentation; was Spikiu SPRICHT (VOZ_GREET) bleibt unverändert.
var VOZ_INVITE = {
  es: { q:'¿Qué te apetece hoy?',         sub:'¡Tú eliges!' },
  de: { q:'Worauf hast du heute Lust?',   sub:'Du entscheidest!' },
  en: { q:'What do you feel like today?', sub:'You choose!' },
  el: { q:'Τι σου κάνει κέφι σήμερα;',     sub:'Εσύ διαλέγεις!' }
};

function removeOpenerGreeting(){ var g = document.getElementById('vozGreet'); if (g) g.remove(); vozHandle = null; }

// capy-vivo.js ist deferred → beim ERSTEN startOpener evtl. noch nicht da. Dann bindet
// der DOMContentLoaded-Hook nach. Idempotent (spkCapyAlive ist je SVG einmalig).
function bindVozCapy(){
  var svg = document.querySelector('#vozGreet .voz-capy');
  if (!svg || !window.spkCapyAlive) return;
  vozHandle = window.spkCapyAlive(svg, { tapTarget: document.getElementById('vozGreet') });
}

function speakOpenerGreeting(box){
  var lang = PROFILE.zielsprache;
  var txt  = (VOZ_GREET[lang] || VOZ_GREET.es)(PROFILE.name || '');
  box.classList.add('spoke');                   // Hinweis/Puls verschwindet, sobald gehört
  if (vozHandle) vozHandle.speak(true);         // Mund + Aura für die Dauer
  var done = function(){ if (vozHandle) vozHandle.speak(false); };   // danach wieder ruhig
  var p = speakText(txt, lang);                 // window.spkSpeak/Fallback (beide async)
  if (p && typeof p.then === 'function') p.then(done, done);
  else setTimeout(done, 2200);                  // klassischer Fallback: feste Dauer
}

function renderOpenerGreeting(){
  if (document.getElementById('vozGreet')) return;
  var ui   = uiLang();
  var lang = PROFILE.zielsprache;
  var greet = (VOZ_GREET[lang] || VOZ_GREET.es)(PROFILE.name || '');
  var inv  = VOZ_INVITE[lang] || VOZ_INVITE.es;
  var box = document.createElement('div');
  box.className = 'voz-greet'; box.id = 'vozGreet';
  box.innerHTML = CAPY_OPENER
    + '<div class="voz-greet-line">' + escPlain(greet) + '</div>'
    + '<div class="voz-invite">' + escPlain(inv.q) + ' <span class="voz-invite-sub">' + escPlain(inv.sub) + '</span></div>'
    + '<div class="voz-hint">' + escPlain(VOZ_HINT[ui] || VOZ_HINT.de) + '</div>';
  chat.appendChild(box);
  chat.scrollTop = chat.scrollHeight;
  box.addEventListener('click', function(){ speakOpenerGreeting(box); });   // die GESTE
  bindVozCapy();
}

function startOpener(){
  sessionGezaehlt = false;
  setOpenerChrome(true);
  if (getModus() === 'frei'){
    if (!devOffen()){ showPremiumSperre(); return; }   // Freies Gespräch = Premium (Etappe 4)
    // Besteht ein Lernpfad, führt Spikiu auch hier: erst Gruß, dann die Themen
    // der aktuellen Stufe. Kein leeres Feld, keine Ratlosigkeit — und der
    // Einstieg kostet nichts, weil Name, Stufe und Themen aus dem Pfad kommen.
    var Pf = window.SpikiuPfad;
    if (Pf && Pf.existiert() && Pf.palette().length){
      renderOpenerGreeting();
      showGabelung();
      return;
    }
    goFree(); return;                                  // ohne Pfad: direkt in den freien Flur
  }
  renderOpenerGreeting();       // Voz primero: Präsenz-Gruß (lädt ein, KEIN Auto-Play)
  showGabelung();
}

// ── Teil 62: Dialog aus einer gesicherten Sitzung ins Reel zurückholen ──
// Anzeige-only: KEIN neuer API-Call, KEIN erneutes verlauf.push. Die schon vorhandenen
// Render-Pfade (appendSpikiuSlide/appendUserSlide/renderLearnerSlide) — nichts neu erfunden.
function sitzungWiederherstellen(s){
  verlauf = Array.isArray(s.verlauf) ? s.verlauf.slice() : [];
  gefuehrt = !!s.gefuehrt;
  TOPIC_LABEL = s.topicLabel || null;
  TOPIC_ID = s.topicId || null;       // Teil 64: wiederhergestellte geführte Sitzung trifft die DB
  sessionGezaehlt = false;
  setOpenerChrome(false);            // Profil-Chip + Eingabe wieder einblenden
  removeOpenerGreeting();            // falls ein Präsenz-Gruß stand
  enterReel();                       // freier Flur UND geführt laufen beide im Reel
  removeLearnerSlide();              // enterReel kann (freier Flur) einen Start-Slide setzen → weg, wir bauen neu
  verlauf.forEach(function(m){
    if (m.role === 'assistant'){
      var segments = splitThoughts(m.content);
      if (!segments.length) segments = [m.content || ''];
      segments.forEach(function(seg){ var parts = splitBridge(seg); appendSpikiuSlide(parts.ziel, parts.trans); });
    } else if (m.role === 'user'){
      appendUserSlide(m.content);
    }
  });
  renderLearnerSlide(false);         // frische Eingabe-Folie ans Ende → nahtlos weiterschreiben
  reelGoTo(reelSlides().length - 1); // ans Ende gehen
  updateFreeExit();
}

// Eintritt: gibt es eine wirklich angefangene, unfertige Sitzung → „Weiter, wo du warst?".
// Sonst der normale Opener (unverändert).
function startGespraech(){
  if (getModus() === 'frei' && !devOffen()){ showPremiumSperre(); return; }   // Freies Gespräch = Premium (Etappe 4) — nie Sitzung
  var s = null;
  try { s = (window.spikiuSitzung && window.spikiuSitzung.lade) ? window.spikiuSitzung.lade('gespraech') : null; } catch(e){ s = null; }
  // Nur GEFÜHRTE Sitzungen wieder aufnehmen (frei-Sitzungen gibt es künftig nicht mehr).
  if (window.spikiuSitzung && s && s.gefuehrt && Array.isArray(s.verlauf) && s.verlauf.length >= 2){
    window.spikiuSitzung.frageWiederkommen({
      raum: 'gespraech', ts: s.ts,
      wo: (s.topicLabel || 'Geführtes Gespräch'),
      beimWeiter: function(){ sitzungWiederherstellen(s); },
      beimNeu: function(){ gespraechRaeumen(); startOpener(); }
    });
  } else {
    startOpener();
  }
}

// ── Eingabe ──────────────────────────────────────────────────────
input.addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 130) + 'px';
  sendBtn.disabled = busy || guiding || this.value.trim() === '';
});
input.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); if (this.value.trim()) sendMessage(); }
});

// ── Ausstiegs-Leiste (Teil 31 #1): dauerhaft erreichbar im geführten Rollenspiel ──
// ⋯ über dem Eingabefeld öffnet dieselben Optionen wie das End-Menü (Anderes Thema /
// Beenden → Lektion) — kein neues System, dieselben Handler otroTema/terminar.
var EXIT_UI = { de:'⋯ Optionen', es:'⋯ Opciones', en:'⋯ Options' };
var exitBar = document.getElementById('exitBar');
var exitMenu = document.getElementById('exitMenu');
var exitToggle = document.getElementById('exitToggle');
function setExitVisible(show){
  if (show){
    var ui = uiLang();
    exitToggle.textContent = EXIT_UI[ui] || EXIT_UI.de;
    document.getElementById('exitOtro').textContent = p3().otro;
    document.getElementById('exitTerminar').textContent = p3().terminar;
    exitBar.hidden = false;
  } else {
    exitMenu.hidden = true;
    exitBar.hidden = true;
  }
}
exitToggle.onclick = function(){ exitMenu.hidden = !exitMenu.hidden; };
document.getElementById('exitOtro').onclick = function(){ exitMenu.hidden = true; otroTema(); };       // otroTema blendet die Leiste selbst aus
document.getElementById('exitTerminar').onclick = function(){ exitMenu.hidden = true; terminar(); };   // → Lektion-Angebot (Teil 32)

// Freier-Flur-Ausstieg (Teil 32 #1): „Gespräch beenden" → Lektion-Angebot.
var freeExitBar = document.getElementById('freeExitBar');
var freeExitBtn = document.getElementById('freeExitBtn');
freeExitBtn.onclick = offerLesson;

// Teil B: Stimme schon beim RAUM-EINTRITT vorwärmen (nicht erst bei der Themenwahl).
// Das Modul-Script unten setzt window.spkWarm erst NACH diesem klassischen Script —
// darum als Hook, den das Modul aufruft, sobald die Audio-API da ist (idempotent).
window.__spkBoot = function(){ warmVoice(PROFILE.zielsprache); };

// ── Einstieg: kein Welcome-Screen, kein Onboarding. Direkt rein. ──
fillProfileBar();
startGespraech();   // Teil 62: unfertige Sitzung → „Weiter, wo du warst?"; sonst normaler Opener
// capy-vivo.js ist deferred → beim startGespraech oben evtl. noch nicht geladen.
// Hier nachbinden, sobald die Helfer da sind (Sprech-/Blinzel-Zustand des Gruß-Capy
// bzw. der lebendige Capy auf der Wiederkommen-Karte).
document.addEventListener('DOMContentLoaded', function(){
  bindVozCapy();
  if (window.spkCapyAlive){
    var c = document.querySelector('.spk-sitz-veil .spk-sitz-capy svg');
    if (c){ try { window.spkCapyAlive(c); } catch(e){} }
  }
});
</script>
<!-- Audio (Paket 2): audio.js ist ein ES-Modul am Root. Hier importiert, via window
     an das klassische Haupt-Script durchgereicht (das bleibt klassisch wegen
     onclick="sendMessage()"). Browser-Fallback steckt schon in audio.js. -->
<script type="module">
  import { speak, warm } from '/audio.js';
  window.spkSpeak = speak;
  window.spkWarm  = warm;
  if (window.__spkBoot) window.__spkBoot();   // Teil B: früh vorwärmen, sobald die Audio-API bereit ist
</script>
<!-- Voz primero (Paket 5): capy-vivo.js liefert den Sprech-Zustand (Mund + Aura) +
     Blinzeln/Blick für den Präsenz-Gruß. Idempotent (IIFE-Guard), nav.js lädt es ohnehin. -->
<script src="capy-vivo.js" defer></script>
