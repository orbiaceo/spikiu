<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Spikiu — Talk</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --white:#ffffff;--bg:#faf9f7;--bg2:#f3f1ee;--ink:#1a1816;--mid:#6b6560;
  --faint:#e8e4df;--warm:#d4cdc6;--accent:#2d6a4f;--accent2:#e8f2ed;
  --accent3:#1a4a38;--capy:#c9956a;
}
html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
.app { display: flex; flex-direction: column; height: 100dvh; max-width: 680px; margin: 0 auto; background: var(--white); }
.app.keyboard-open { height: 100dvh; }

@supports (height: 100svh) {
  .app { height: 100svh; }
}

header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem 0.875rem; border-bottom: 1px solid var(--faint); background: var(--white); flex-shrink: 0; }
.header-left { display: flex; align-items: center; gap: 0.65rem; }
.header-right { display: flex; align-items: center; gap: 1rem; }
.capy-icon { width: 36px; height: 36px; flex-shrink: 0; }
.brand-name { font-family: 'Lora', serif; font-size: 1.2rem; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }
.brand-name em { color: var(--accent); font-style: italic; }
.status-dot { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; animation: pulse 2.5s infinite; }
@keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.5; transform:scale(0.85); } }
.back-link { font-size: 0.82rem; color: var(--mid); text-decoration: none; font-weight: 500; transition: color 0.2s; }
.back-link:hover { color: var(--ink); }

.chat { flex: 1; overflow-y: auto; padding: 1.5rem 1.25rem; display: flex; flex-direction: column; gap: 1.25rem; scroll-behavior: smooth; }
.chat::-webkit-scrollbar { width: 3px; }
.chat::-webkit-scrollbar-thumb { background: var(--warm); border-radius: 10px; }

.message { display: flex; gap: 0.75rem; animation: fadeUp 0.3s ease forwards; opacity: 0; }
.message.user { flex-direction: row-reverse; }
@keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

.avatar-spikiu { background: var(--accent2); border-radius: 50%; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex-shrink: 0; margin-top: 2px; }

.bubble { max-width: 82%; padding: 0.85rem 1.1rem; border-radius: 1.2rem; font-size: 1rem; line-height: 1.65; }
.bubble.spikiu { background: var(--bg2); color: var(--ink); border-radius: 0.3rem 1.2rem 1.2rem 1.2rem; font-family: 'Lora', serif; font-size: 1.025rem; }
.bubble.user { background: var(--accent); color: var(--white); border-radius: 1.2rem 0.3rem 1.2rem 1.2rem; font-size: 0.975rem; }

.typing-bubble { background: var(--bg2); border-radius: 0.3rem 1.2rem 1.2rem 1.2rem; padding: 0.9rem 1.1rem; display: flex; gap: 5px; align-items: center; }
.typing-bubble span { width: 7px; height: 7px; background: var(--warm); border-radius: 50%; animation: bounce 1.3s infinite; }
.typing-bubble span:nth-child(2) { animation-delay: 0.18s; }
.typing-bubble span:nth-child(3) { animation-delay: 0.36s; }
@keyframes bounce { 0%,80%,100% { transform:translateY(0); background:var(--warm); } 40% { transform:translateY(-5px); background:var(--capy); } }

.welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 2rem 1rem; text-align: center; gap: 1rem; }
.welcome-capy { width: 88px; height: 88px; margin-bottom: 0.5rem; animation: float 4s ease-in-out infinite; }
@keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
.welcome h1 { font-family: 'Lora', serif; font-size: 1.75rem; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; line-height: 1.2; }
.welcome h1 em { font-style: italic; color: var(--accent); }
.welcome p { color: var(--mid); font-size: 0.975rem; line-height: 1.65; max-width: 300px; }
.start-btn { margin-top: 0.5rem; background: var(--accent); color: var(--white); border: none; border-radius: 100px; padding: 0.85rem 2.2rem; font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.start-btn:hover { background: var(--accent3); transform: translateY(-1px); }
.welcome-note { font-size: 0.78rem; color: var(--warm); margin-top: 0.25rem; }

.input-area { flex-shrink: 0; padding: 0.875rem 1.25rem; border-top: 1px solid var(--faint); background: var(--white); padding-bottom: calc(0.875rem + env(safe-area-inset-bottom)); }
.input-row { display: flex; gap: 0.6rem; align-items: flex-end; }
textarea { flex: 1; background: var(--bg2); border: 1.5px solid transparent; border-radius: 1.2rem; padding: 0.75rem 1.1rem; font-family: 'DM Sans', sans-serif; font-size: 1rem; color: var(--ink); resize: none; outline: none; min-height: 48px; max-height: 130px; line-height: 1.5; transition: border-color 0.2s, background 0.2s; }
textarea:focus { border-color: var(--accent); background: var(--white); }
textarea::placeholder { color: var(--mid); font-style: italic; }
.send-btn { width: 46px; height: 46px; background: var(--accent); border: none; border-radius: 50%; color: var(--white); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.send-btn:hover { background: var(--accent3); transform: scale(1.05); }
.send-btn:active { transform: scale(0.95); }
.send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
.send-btn svg { width: 20px; height: 20px; transform: translateX(1px); }

@media (max-width: 480px) {
  header { padding: 0.875rem 1rem 0.75rem; }
  .header-right { gap: 0.7rem; }
  .back-link { font-size: 0.78rem; }
  .chat { padding: 1.25rem 1rem; gap: 1rem; }
  .input-area { padding: 0.75rem 1rem; padding-bottom: calc(0.75rem + env(safe-area-inset-bottom)); }
  .bubble { max-width: 88%; }
  .welcome { padding: 1.5rem 1.5rem 1rem; }
  .welcome h1 { font-size: 1.5rem; }
}
@media (min-width: 680px) {
  body { background: var(--bg2); }
  .app { margin: 1.5rem auto; height: calc(100dvh - 3rem); border-radius: 1.5rem; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.08); }
}
/* ── HÄPPCHEN CARD ───────────────────── */
.haeppchen-card {
  width: 100%;
  max-width: 480px;
  margin: 0.5rem 0 0.8rem;
  background: #ffffff;
  border: 2px solid var(--accent, #2d6a4f);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(45, 106, 79, 0.12);
  animation: cardIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}
@keyframes cardIn {
  from { opacity: 0; transform: scale(0.95) translateY(10px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
.hc-header {
  background: var(--accent, #2d6a4f);
  color: #ffffff;
  padding: 0.85rem 1.3rem;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.hc-intro {
  padding: 1rem 1.3rem 0.4rem;
  font-size: 0.95rem;
  color: #1a1816;
  line-height: 1.5;
  font-weight: 500;
}
.hc-items {
  padding: 0.5rem 1.3rem 1.2rem;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}
.hc-item {
  background: #faf9f7;
  border-radius: 12px;
  padding: 0.75rem 0.95rem;
  display: flex;
  align-items: flex-start;
  gap: 0.65rem;
}
.hc-num {
  background: var(--accent, #2d6a4f);
  color: #ffffff;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 700;
  flex-shrink: 0;
  margin-top: 0.05rem;
}
.hc-text { flex: 1; }
.hc-target {
  font-family: 'Lora', Georgia, serif;
  font-size: 1.05rem;
  font-weight: 700;
  color: #1a4a38;
  line-height: 1.3;
}
.hc-native {
  font-size: 0.83rem;
  color: #78716c;
  margin-top: 0.2rem;
}
.hc-button {
  width: 100%;
  background: #1a1816;
  color: #ffffff;
  border: none;
  padding: 1rem;
  font-family: inherit;
  font-size: 0.98rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}
.hc-button:hover { background: #2d6a4f; }
.hc-button:disabled { background: #c0b8a8; cursor: not-allowed; }

</style>
</head>
<body>
<div class="app">

    <div class="header-left">

        <ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/>

      </svg>

    <div class="header-right">

  <div class="welcome" id="welcome">

      <ellipse cx="40" cy="50" rx="28" ry="20" fill="#c9956a"/>
      <ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/>
      <ellipse cx="40" cy="36" rx="10" ry="7" fill="#b8845a"/>
      <ellipse cx="40" cy="33" rx="4" ry="2.5" fill="#8b5e3c"/>
      <circle cx="38" cy="33" r="1" fill="#6b4226"/>
      <circle cx="42" cy="33" r="1" fill="#6b4226"/>
      <circle cx="33" cy="24" r="3.5" fill="#3d2b1f"/>
      <circle cx="47" cy="24" r="3.5" fill="#3d2b1f"/>
      <circle cx="34" cy="23" r="1.2" fill="white"/>
      <circle cx="48" cy="23" r="1.2" fill="white"/>
      <ellipse cx="26" cy="17" rx="6" ry="5" fill="#b8845a"/>
      <ellipse cx="54" cy="17" rx="6" ry="5" fill="#b8845a"/>
      <ellipse cx="22" cy="66" rx="7" ry="5" fill="#b8845a"/>
      <ellipse cx="34" cy="68" rx="7" ry="5" fill="#b8845a"/>
      <ellipse cx="46" cy="68" rx="7" ry="5" fill="#b8845a"/>
      <ellipse cx="58" cy="66" rx="7" ry="5" fill="#b8845a"/>
      <path d="M36 38 Q40 41 44 38" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </svg>
    <h1 data-i18n="welcome.title">Just <em>speak.</em><br>Now, don't wait!</h1>
    <p data-i18n="welcome.sub">No grades. No pressure.<br>Just you and Spikiu — talking.</p>
    <button class="start-btn" onclick="startChat()" data-i18n="welcome.cta">Start talking →</button>
    <span class="welcome-note" data-i18n="welcome.note">Spanish · German · English</span>

  <div class="chat" id="chat" style="display:none"></div>

  <div class="input-area" id="inputArea" style="display:none">
    <div class="input-row">
      <textarea id="userInput" data-i18n-placeholder="input.placeholder" placeholder="Say something..." rows="1"></textarea>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>

<script type="module">
import { parseMarkdown } from './pdf-generator.js';

// ── SESSION STATE ──────────────────────────────────────
const session = {
  phase: 0,
  nativeLang: null,
  name: null,
  profile: {},
  onboardingHistory: [],
  assessmentHistory: [],
  history: []
};

const CAPY_SMALL = `<svg width="18" height="18" viewBox="0 0 80 80" fill="none"><ellipse cx="40" cy="50" rx="28" ry="20" fill="#c9956a"/><ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/><ellipse cx="40" cy="36" rx="10" ry="7" fill="#b8845a"/><ellipse cx="40" cy="33" rx="4" ry="2.5" fill="#8b5e3c"/><circle cx="38" cy="33" r="1" fill="#6b4226"/><circle cx="42" cy="33" r="1" fill="#6b4226"/><circle cx="33" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="47" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="34" cy="23" r="1.2" fill="white"/><circle cx="48" cy="23" r="1.2" fill="white"/><ellipse cx="26" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="54" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="22" cy="66" rx="7" ry="5" fill="#b8845a"/><ellipse cx="34" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="46" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="58" cy="66" rx="7" ry="5" fill="#b8845a"/><path d="M36 38 Q40 41 44 38" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>`;

const WAIT_MSG = {
  'Deutsch': 'Einen Moment bitte — ich erstelle deinen Lernpfad. 🌱',
  'Español': 'Un momento por favor — estoy creando tu camino. 🌱',
  'English': 'One moment please — I am creating your learning path. 🌱'
};

const READY_MSG = {
  'Deutsch': 'Dein Lernpfad ist fertig — du kannst ihn herunterladen. 🌱\nBereit für dein erstes Gespräch?',
  'Español': 'Tu camino está listo — puedes descargarlo. 🌱\n¿Listo para tu primera conversación?',
  'English': 'Your learning path is ready — download it above. 🌱\nReady for your first conversation?'
};

// ── READER PROGRESS — gives Spikiu context about what user is reading ──
function buildReaderProgress(targetLang) {
  // Map targetLang to book code (which Reader matches)
  let bookLang = null;
  if (targetLang === 'German')  bookLang = 'de';
  else if (targetLang === 'Spanish') bookLang = 'es';
  // English learners have no Reader yet → return null
  if (!bookLang) return null;

  let readChapters = [];
  try {
    readChapters = JSON.parse(localStorage.getItem('spikiu_read_' + bookLang) || '[]');
  } catch(e) {
    readChapters = [];
  }

  const sortedRead = readChapters.slice().sort((a, b) => a - b);
  const lastRead = sortedRead.length > 0 ? sortedRead[sortedRead.length - 1] : null;

  return {
    bookLang,                       // 'de' or 'es'
    hasRead: sortedRead,            // [1, 2, 3]
    totalAvailableInBeta: 4,
    lastRead,                       // 3 or null
    hasReadAnything: sortedRead.length > 0
  };
}

// ── BUILD LAST-CONVERSATION MEMORY ─────────────────────
// Today (beta): turn the stored last conversation into a plain-text
// transcript that Spikiu can read as context.
// Later (post-Supabase + Haiku): replace the body of this function
// with a per-conversation summary fetched from the backend. The
// downstream contract — a string field called `lastConversationMemory`
// in the profile — stays identical, so no backend rewrite needed.
function buildLastConversationMemory(lastConversation) {
  if (!Array.isArray(lastConversation) || lastConversation.length === 0) {
    return null;
  }

  // Skip leading assistant message if it's the opener (no preceding user turn)
  // so we don't waste tokens on Spikiu's own hellos from last time.
  const lines = lastConversation
    .filter(m => m && typeof m.content === 'string' && m.content.trim().length > 0)
    .map(m => {
      const speaker = m.role === 'user' ? 'USER' : 'SPIKIU';
      // Strip any of the internal markers Spikiu uses (lesson triggers, PDF marks, etc.)
      const clean = m.content
        .replace(/\[LESSON_REQUEST:[^\]]*\]/g, '')
        .replace(/\[LESSON_FROM_CONVERSATION\]/g, '')
        .replace(/\[PDF_AVAILABLE\]/g, '')
        .replace(/\[OPEN_CONVERSATION\]/g, '')
        .trim();
      return clean ? `${speaker}: ${clean}` : '';
    })
    .filter(Boolean);

  if (lines.length === 0) return null;
  return lines.join('\n');
}

// ── UI HELPERS ─────────────────────────────────────────
// ── HÄPPCHEN PARSER ─────────────────────
// Spikiu emits a card via the marker [HÄPPCHEN]{json}[/HÄPPCHEN].
// We strip the marker out of the chat bubble and render a visual card instead.
// We also scrub stray artifacts (lone punctuation lines, trailing whitespace,
// empty lines) that the LLM sometimes emits adjacent to the marker.
function parseHaeppchen(text) {
  const m = text.match(/\[HÄPPCHEN\]([\s\S]*?)\[\/HÄPPCHEN\]/);
  if (!m) return { cleanText: text, haeppchen: null };
  let json = null;
  try { json = JSON.parse(m[1].trim()); } catch(e) { console.error('Häppchen JSON parse failed', e); }
  // Remove the marker block itself
  let cleanText = text.replace(/\[HÄPPCHEN\][\s\S]*?\[\/HÄPPCHEN\]/, '');
  // Scrub lone-punctuation / empty-content lines (e.g. a stray "." the LLM emits)
  cleanText = cleanText
    .split('\n')
    .map(line => line.trim())
    .filter(line => line.length > 0 && !/^[.\-—_·•]+$/.test(line))
    .join('\n')
    .trim();
  return { cleanText, haeppchen: json };
}

// ── READY MESSAGES BY NATIVE LANGUAGE ───
const HAEPPCHEN_READY = {
  Deutsch: 'Ich bin bereit',
  'Español': 'Estoy listo',
  English: "I'm ready"
};

function renderHaeppchenCard(container, data) {
  if (!data || !Array.isArray(data.items)) return;
  const lang = (session && session.nativeLang) || 'English';
  const readyLabel = data.readyButton || HAEPPCHEN_READY[lang] || HAEPPCHEN_READY.English;

  const card = document.createElement('div');
  card.className = 'haeppchen-card';
  card.innerHTML = `
    <div class="hc-header">🐾 ${data.title || 'Häppchen'}</div>
    <div class="hc-intro">${data.intro || ''}</div>
    <div class="hc-items">
      ${data.items.map((it, i) => `
        <div class="hc-item">
          <div class="hc-num">${i+1}</div>
          <div class="hc-text">
            <div class="hc-target">${escapeHtml(it.target || '')}</div>
            <div class="hc-native">${escapeHtml(it.native || '')}</div>
          </div>
        </div>
      `).join('')}
    </div>
    <button class="hc-button" type="button">${readyLabel} →</button>
  `;
  const btn = card.querySelector('.hc-button');
  btn.addEventListener('click', () => {
    btn.disabled = true;
    btn.textContent = '✓ ' + readyLabel;
    // Auto-send the ready message so Spikiu enters practice mode
    const input = document.getElementById('userInput');
    if (input) {
      input.value = readyLabel;
      sendMessage();
    }
  });
  container.appendChild(card);
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function addMessage(role, text) {
  const chat = document.getElementById('chat');
  const msg = document.createElement('div');
  msg.className = 'message ' + role;

  if (role === 'spikiu') {
    const { cleanText, haeppchen } = parseHaeppchen(text);
    // Only render the text bubble if there's actually text to show
    if (cleanText) {
      const rendered = parseMarkdown(cleanText);
      msg.innerHTML = `<div class="avatar-spikiu">${CAPY_SMALL}</div><div style="flex:1;min-width:0;"><div class="bubble spikiu">${rendered}</div></div>`;
      chat.appendChild(msg);
    }

    // If Spikiu offered a Häppchen, render the card right after the bubble
    if (haeppchen) {
      const wrapper = document.createElement('div');
      wrapper.className = 'message spikiu';
      wrapper.innerHTML = `<div class="avatar-spikiu" style="visibility:hidden;"></div><div style="flex:1;min-width:0;"></div>`;
      const slot = wrapper.querySelector('div:last-child');
      renderHaeppchenCard(slot, haeppchen);
      chat.appendChild(wrapper);
    }
  } else {
    msg.innerHTML = `<div class="bubble user">${text.split('\n').join('<br>')}</div>`;
    chat.appendChild(msg);
  }

  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
  const chat = document.getElementById('chat');
  const t = document.createElement('div');
  t.className = 'message spikiu';
  t.id = 'typing';
  t.innerHTML = `<div class="avatar-spikiu">${CAPY_SMALL}</div><div class="typing-bubble"><span></span><span></span><span></span></div>`;
  chat.appendChild(t);
  chat.scrollTop = chat.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

// PDF download from button — exposed globally for inline onclick
window.spikiuDownloadPDF = function(btn) {
  const content = decodeURIComponent(btn.getAttribute('data-content'));
  downloadPDF(content);
};

// ── BACKEND CALLS ──────────────────────────────────────
async function apiOnboarding(messages) {
  const r = await fetch('/api/onboarding', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages })
  });
  return await r.json();
}

async function apiAssessment(messages, name, nativeLang) {
  const r = await fetch('/api/assessment', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages, name, nativeLang })
  });
  return await r.json();
}

async function apiGeneratePlan(name, nativeLang, profile) {
  const r = await fetch('/api/generate-learningpath', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, nativeLang, profile })
  });
  const d = await r.json();
  return d.roadmap;
}

async function apiChat(targetLang, messages, profile) {
  const endpoint = targetLang === 'Spanish' ? '/api/chat-spanish'
                : targetLang === 'German'  ? '/api/chat-german'
                : '/api/chat-english';
  const r = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages, profile, maxTokens: 600 })
  });
  const d = await r.json();
  return d.reply;
}

// ── FLOW ───────────────────────────────────────────────
window.startChat = function() {
  document.getElementById('welcome').style.display = 'none';
  document.getElementById('chat').style.display = 'flex';
  document.getElementById('inputArea').style.display = 'block';

  const input = document.getElementById('userInput');
  input.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 130) + 'px';
    document.getElementById('sendBtn').disabled = this.value.trim() === '';
  });
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (this.value.trim()) sendMessage();
    }
  });

  // ── ANDROID/iOS KEYBOARD HANDLING ──────────────────
  input.addEventListener('focus', function() {
    setTimeout(() => {
      const chat = document.getElementById('chat');
      chat.scrollTop = chat.scrollHeight;
      input.scrollIntoView({ block: 'end', behavior: 'smooth' });
    }, 300);
  });

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
      const app = document.querySelector('.app');
      const vh = window.visualViewport.height;
      app.style.height = vh + 'px';
      const chat = document.getElementById('chat');
      chat.scrollTop = chat.scrollHeight;
    });
  }

  // Check if user already completed Beratung (assessment.html)
  const existingUser = loadExistingUser();

  if (existingUser && existingUser.profile && existingUser.profile.targetLang) {
    resumeConversation(existingUser);
  } else {
    // ── LEGACY phase 1+2 (Onboarding + Assessment in chat) — REPLACED by assessment.html ──
    // The old conversational onboarding/assessment now lives in assessment.html as a card flow.
    // No profile = user landed on chat.html directly — send them through Beratung first.
    window.location.replace('assessment.html');
    return;
  }

  input.focus();
};

// ── RESUME CONVERSATION (returning user) ──────────────
function loadExistingUser() {
  try {
    const raw = localStorage.getItem('spikiu_user');
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e) { return null; }
}

async function resumeConversation(user) {
  session.phase = 3;
  session.name = user.name;
  session.nativeLang = user.nativeLang;
  session.profile = user.profile;

  showTyping();

  try {
    // Build reader progress for THIS user
    const readerProgress = buildReaderProgress(user.profile.targetLang);

    // ── FRESHNESS ─────────────────────────────────────────
    // How long since the user was last here? Spikiu reads this
    // and adjusts his greeting (no more "Schön dich kennenzulernen"
    // after 3 minutes away).
    let timeSinceLastSeen = null;
    if (user.lastSeenAt) {
      try { timeSinceLastSeen = Date.now() - new Date(user.lastSeenAt).getTime(); }
      catch(e) { timeSinceLastSeen = null; }
    }

    // ── MEMORY OF LAST CONVERSATION ───────────────────────
    // Spikiu remembers what was talked about in the previous session.
    // Today: full last conversation as plain text. Later (post-beta):
    // can be replaced by a Haiku-generated summary — same field name,
    // different content, no backend changes needed.
    const lastConversationMemory = buildLastConversationMemory(user.lastConversation);

    const reply = await apiChat(
      user.profile.targetLang,
      [],
      {
        name: user.name,
        nativeLang: user.nativeLang,
        ...user.profile,
        readerProgress: readerProgress,
        timeSinceLastSeen: timeSinceLastSeen,
        lastConversationMemory: lastConversationMemory
      }
    );
    hideTyping();
    session.history.push({ role: 'assistant', content: reply });
    addMessage('spikiu', reply);

    // Update lastSeenAt so the next session computes a fresh diff
    try {
      user.lastSeenAt = new Date().toISOString();
      localStorage.setItem('spikiu_user', JSON.stringify(user));
    } catch(e) {}

  } catch(e) {
    hideTyping();
    const fallback = user.profile.targetLang === 'German'
      ? `Hallo ${user.name}! 🐾 Wie geht es dir heute?`
      : user.profile.targetLang === 'Spanish'
      ? `¡Hola ${user.name}! 🐾 ¿Cómo estás hoy?`
      : `Hello ${user.name}! 🐾 How are you today?`;
    addMessage('spikiu', fallback);
    session.history.push({ role: 'assistant', content: fallback });
    console.error(e);
  }
}

window.sendMessage = async function() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;
  addMessage('user', text);

  try {
    if (session.phase === 1) {
      session.onboardingHistory.push({ role: 'user', content: text });
      showTyping();
      const result = await apiOnboarding(session.onboardingHistory);
      hideTyping();

      if (result.name) session.name = result.name;
      if (result.nativeLang) session.nativeLang = result.nativeLang;

      addMessage('spikiu', result.reply);
      session.onboardingHistory.push({ role: 'assistant', content: result.reply });

      if (result.ready && session.name && session.nativeLang) {
        setTimeout(() => {
          session.phase = 2;
          startAssessment();
        }, 800);
      }
    }
    else if (session.phase === 2) {
      session.assessmentHistory.push({ role: 'user', content: text });
      showTyping();
      const result = await apiAssessment(session.assessmentHistory, session.name, session.nativeLang);
      hideTyping();

      if (result.profile) {
        session.profile = { ...session.profile, ...result.profile };
      }

      addMessage('spikiu', result.reply);
      session.assessmentHistory.push({ role: 'assistant', content: result.reply });

      if (result.ready) {
        setTimeout(() => generateRoadmapAndRedirect(), 1500);
      }
    }
    else if (session.phase === 3) {
      session.history.push({ role: 'user', content: text });
      showTyping();

      // Re-build reader progress on EVERY message — user might have read a chapter mid-chat
      const readerProgress = buildReaderProgress(session.profile.targetLang);

      // Compute freshness from stored lastSeenAt (BEFORE updating it)
      let timeSinceLastSeen = null;
      try {
        const rawF = localStorage.getItem('spikiu_user');
        if (rawF) {
          const uF = JSON.parse(rawF);
          if (uF.lastSeenAt) {
            timeSinceLastSeen = Date.now() - new Date(uF.lastSeenAt).getTime();
          }
        }
      } catch(e) {}

      const reply = await apiChat(
        session.profile.targetLang,
        session.history,
        {
          name: session.name,
          nativeLang: session.nativeLang,
          ...session.profile,
          readerProgress: readerProgress,  // ← NEW
          timeSinceLastSeen: timeSinceLastSeen
        }
      );
      session.history.push({ role: 'assistant', content: reply });
      hideTyping();

      const lessonMatch = reply.match(/\[LESSON_REQUEST:\s*topic="([^"]*)"\s*focus="([^"]*)"\]/);
      const fromConvoMatch = reply.match(/\[LESSON_FROM_CONVERSATION\]/);
      const cleanReply = reply
        .replace(/\[LESSON_REQUEST:[^\]]*\]/g, '')
        .replace(/\[LESSON_FROM_CONVERSATION\]/g, '')
        .trim();
      addMessage('spikiu', cleanReply);

      if (lessonMatch) {
        const topic = lessonMatch[1];
        const focus = lessonMatch[2];
        generateLessonInBackground(topic, focus);
      } else if (fromConvoMatch) {
        generateLessonFromConversation();
      }

      try {
        const rawU = localStorage.getItem('spikiu_user');
        if (rawU) {
          const u = JSON.parse(rawU);
          u.lastConversation = session.history;
          u.lastSeenAt = new Date().toISOString();
          localStorage.setItem('spikiu_user', JSON.stringify(u));
        }
      } catch(e) {}
    }
  } catch(e) {
    hideTyping();
    addMessage('spikiu', 'Something went wrong. Try again? 🐾');
    console.error(e);
  }

  document.getElementById('sendBtn').disabled = false;
  input.focus();
};

async function startAssessment() {
  showTyping();
  try {
    const result = await apiAssessment([], session.name, session.nativeLang);
    hideTyping();
    if (result.profile) session.profile = { ...session.profile, ...result.profile };
    addMessage('spikiu', result.reply);
    session.assessmentHistory.push({ role: 'assistant', content: result.reply });
  } catch(e) {
    hideTyping();
    addMessage('spikiu', 'Something went wrong. Try again? 🐾');
    console.error(e);
  }
}

async function generateLessonFromConversation() {
  try {
    const raw = localStorage.getItem('spikiu_user');
    if (!raw) return;
    const user = JSON.parse(raw);
    const lessons = user.lessons || [];

    if (lessons.length >= 3) {
      const limitMsg = user.nativeLang === 'Deutsch'
        ? `🌱 Du hast deine 3 kostenlosen Lektionen schon — du findest sie in deinem Dashboard. Mit Premium gibt es unbegrenzte Lektionen.`
        : user.nativeLang === 'Español'
        ? `🌱 Ya tienes tus 3 lecciones gratuitas. Con Premium tienes lecciones ilimitadas.`
        : `🌱 You've used your 3 free lessons. Premium gives unlimited lessons.`;
      addMessage('spikiu', limitMsg);
      return;
    }

    user.lastConversation = session.history;
    localStorage.setItem('spikiu_user', JSON.stringify(user));

    const r = await fetch('/api/generate-lesson', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: session.name,
        nativeLang: session.nativeLang,
        profile: session.profile,
        conversationHistory: session.history
      })
    });
    const d = await r.json();
    if (!d.lesson) return;

    const newLesson = {
      id: 'lesson_' + Date.now(),
      topic: d.lesson.title || 'Lesson from our conversation',
      fromConversation: true,
      lesson: d.lesson,
      createdAt: new Date().toISOString()
    };
    user.lessons = [...lessons, newLesson];
    localStorage.setItem('spikiu_user', JSON.stringify(user));

  } catch(e) {
    console.error('Lesson from conversation failed:', e);
  }
}

async function generateLessonInBackground(topic, focus) {
  try {
    const raw = localStorage.getItem('spikiu_user');
    if (!raw) return;
    const user = JSON.parse(raw);
    const lessons = user.lessons || [];

    const duplicate = lessons.find(l =>
      l.topic && l.topic.toLowerCase() === topic.toLowerCase()
    );
    if (duplicate) {
      const dupMsg = user.nativeLang === 'Deutsch'
        ? `💡 Hinweis: Du hast schon eine Lektion zu "${topic}" in deinem Dashboard. Soll ich eine vertiefendere erstellen? Sag mir wie.`
        : user.nativeLang === 'Español'
        ? `💡 Aviso: ya tienes una lección sobre "${topic}" en tu dashboard. ¿Te creo una más profunda? Dime cómo.`
        : `💡 Note: you already have a lesson on "${topic}" in your dashboard. Want a deeper one? Tell me how.`;
      addMessage('spikiu', dupMsg);
      return;
    }

    if (lessons.length >= 3) {
      const limitMsg = user.nativeLang === 'Deutsch'
        ? `🌱 Du hast deine 3 kostenlosen Lektionen schon — du findest sie in deinem Dashboard. Mit Premium gibt es unbegrenzte Lektionen.`
        : user.nativeLang === 'Español'
        ? `🌱 Ya tienes tus 3 lecciones gratuitas — están en tu dashboard. Con Premium tienes lecciones ilimitadas.`
        : `🌱 You've used your 3 free lessons — they're in your dashboard. Premium gives unlimited lessons.`;
      addMessage('spikiu', limitMsg);
      return;
    }

    const r = await fetch('/api/generate-lesson', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: session.name,
        nativeLang: session.nativeLang,
        profile: session.profile,
        topic,
        focusInterest: focus
      })
    });
    const d = await r.json();
    if (!d.lesson) return;

    const newLesson = {
      id: 'lesson_' + Date.now(),
      topic,
      focus,
      lesson: d.lesson,
      createdAt: new Date().toISOString()
    };
    user.lessons = [...lessons, newLesson];
    user.lastConversation = session.history;
    localStorage.setItem('spikiu_user', JSON.stringify(user));

    setTimeout(() => {
      const readyMsg = user.nativeLang === 'Deutsch'
        ? `✓ Deine Lektion über "${topic}" ist fertig — sie wartet in deinem Dashboard. 🐾`
        : user.nativeLang === 'Español'
        ? `✓ Tu lección sobre "${topic}" está lista — te espera en tu dashboard. 🐾`
        : `✓ Your lesson on "${topic}" is ready — waiting in your dashboard. 🐾`;
      addMessage('spikiu', readyMsg);
    }, 1500);

  } catch(e) {
    console.error('Lesson generation failed:', e);
  }
}

async function generateRoadmapAndRedirect() {
  document.getElementById('inputArea').style.display = 'none';
  showTyping();

  try {
    const roadmap = await apiGeneratePlan(session.name, session.nativeLang, session.profile);
    hideTyping();

    localStorage.setItem('spikiu_user', JSON.stringify({
      name: session.name,
      nativeLang: session.nativeLang,
      profile: session.profile,
      roadmap: roadmap,
      createdAt: new Date().toISOString(),
      lastSeenAt: new Date().toISOString()
    }));

    const goodbyeMsg = session.nativeLang === 'Deutsch'
      ? 'Fertig! Komm zu deinem Dashboard — da wartet dein Lernraum auf dich. Bis gleich! 🐾'
      : session.nativeLang === 'Español'
      ? '¡Listo! Ven a tu dashboard — allí te espera tu espacio. ¡Hasta ahora! 🐾'
      : 'Ready! Come to your dashboard — your learning space is waiting. See you in a moment! 🐾';
    addMessage('spikiu', goodbyeMsg);

    setTimeout(() => {
      document.body.style.transition = 'opacity 1.2s ease';
      document.body.style.opacity = '0';
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1200);
    }, 3800);

  } catch(e) {
    hideTyping();
    addMessage('spikiu', 'Something went wrong creating your Roadmap. Try again? 🐾');
    document.getElementById('inputArea').style.display = 'block';
    console.error(e);
  }
}
</script>

    'welcome.sub': 'No grades. No pressure.<br>Just you and Spikiu — talking.',
    'welcome.cta': 'Start talking →',

    'welcome.title': 'Einfach <em>sprechen.</em><br>Jetzt, nicht warten!',
    'welcome.sub': 'Keine Noten. Kein Druck.<br>Nur du und Spikiu — im Gespräch.',
    'welcome.cta': 'Jetzt sprechen →',
    'welcome.note': 'Spanisch · Deutsch · Englisch',

  es: {
    'nav.dashboard': '← Mi Spikiu',
    'nav.books': '📚 Libros',
    'welcome.title': 'Solo <em>habla.</em><br>Ahora, no esperes!',

(function applyLang() {
  let lang = localStorage.getItem('spikiu_lang');
  if (!lang || !I18N[lang]) {
    const browser = (navigator.language || 'en').slice(0,2).toLowerCase();
    lang = I18N[browser] ? browser : 'en';
  }
  document.documentElement.lang = lang;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (I18N[lang][key]) el.innerHTML = I18N[lang][key];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (I18N[lang][key]) el.placeholder = I18N[lang][key];
  });
})();
