<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Spikiu — Talk</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --white:#ffffff;--bg:#faf9f7;--bg2:#f3f1ee;--ink:#1a1816;--mid:#6b6560;
  --faint:#e8e4df;--warm:#d4cdc6;--accent:#2d6a4f;--accent2:#e8f2ed;
  --accent3:#1a4a38;--capy:#c9956a;
}
html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
.app { display: flex; flex-direction: column; height: 100dvh; max-width: 680px; margin: 0 auto; background: var(--white); }
.app.keyboard-open { height: 100dvh; }

@supports (height: 100svh) {
  .app { height: 100svh; }
}

header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem 0.875rem; border-bottom: 1px solid var(--faint); background: var(--white); flex-shrink: 0; }
.header-left { display: flex; align-items: center; gap: 0.65rem; }
.header-right { display: flex; align-items: center; gap: 1rem; }
.capy-icon { width: 36px; height: 36px; flex-shrink: 0; }
.brand-name { font-family: 'Lora', serif; font-size: 1.2rem; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }
.brand-name em { color: var(--accent); font-style: italic; }
.status-dot { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; animation: pulse 2.5s infinite; }
@keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.5; transform:scale(0.85); } }
.back-link { font-size: 0.82rem; color: var(--mid); text-decoration: none; font-weight: 500; transition: color 0.2s; }
.back-link:hover { color: var(--ink); }

.chat { flex: 1; overflow-y: auto; padding: 1.5rem 1.25rem; display: flex; flex-direction: column; gap: 1.25rem; scroll-behavior: smooth; }
.chat::-webkit-scrollbar { width: 3px; }
.chat::-webkit-scrollbar-thumb { background: var(--warm); border-radius: 10px; }

.message { display: flex; gap: 0.75rem; animation: fadeUp 0.3s ease forwards; opacity: 0; }
.message.user { flex-direction: row-reverse; }
@keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

.avatar-spikiu { background: var(--accent2); border-radius: 50%; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex-shrink: 0; margin-top: 2px; }

.bubble { max-width: 82%; padding: 0.85rem 1.1rem; border-radius: 1.2rem; font-size: 1rem; line-height: 1.65; }
.bubble.spikiu { background: var(--bg2); color: var(--ink); border-radius: 0.3rem 1.2rem 1.2rem 1.2rem; font-family: 'Lora', serif; font-size: 1.025rem; }
.bubble.user { background: var(--accent); color: var(--white); border-radius: 1.2rem 0.3rem 1.2rem 1.2rem; font-size: 0.975rem; }

.typing-bubble { background: var(--bg2); border-radius: 0.3rem 1.2rem 1.2rem 1.2rem; padding: 0.9rem 1.1rem; display: flex; gap: 5px; align-items: center; }
.typing-bubble span { width: 7px; height: 7px; background: var(--warm); border-radius: 50%; animation: bounce 1.3s infinite; }
.typing-bubble span:nth-child(2) { animation-delay: 0.18s; }
.typing-bubble span:nth-child(3) { animation-delay: 0.36s; }
@keyframes bounce { 0%,80%,100% { transform:translateY(0); background:var(--warm); } 40% { transform:translateY(-5px); background:var(--capy); } }

.welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 2rem 1rem; text-align: center; gap: 1rem; }
.welcome-capy { width: 88px; height: 88px; margin-bottom: 0.5rem; animation: float 4s ease-in-out infinite; }
@keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
.welcome h1 { font-family: 'Lora', serif; font-size: 1.75rem; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; line-height: 1.2; }
.welcome h1 em { font-style: italic; color: var(--accent); }
.welcome p { color: var(--mid); font-size: 0.975rem; line-height: 1.65; max-width: 300px; }
.start-btn { margin-top: 0.5rem; background: var(--accent); color: var(--white); border: none; border-radius: 100px; padding: 0.85rem 2.2rem; font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.start-btn:hover { background: var(--accent3); transform: translateY(-1px); }
.welcome-note { font-size: 0.78rem; color: var(--warm); margin-top: 0.25rem; }

.input-area { flex-shrink: 0; padding: 0.875rem 1.25rem; border-top: 1px solid var(--faint); background: var(--white); padding-bottom: calc(0.875rem + env(safe-area-inset-bottom)); }
.input-row { display: flex; gap: 0.6rem; align-items: flex-end; }
textarea { flex: 1; background: var(--bg2); border: 1.5px solid transparent; border-radius: 1.2rem; padding: 0.75rem 1.1rem; font-family: 'DM Sans', sans-serif; font-size: 1rem; color: var(--ink); resize: none; outline: none; min-height: 48px; max-height: 130px; line-height: 1.5; transition: border-color 0.2s, background 0.2s; }
textarea:focus { border-color: var(--accent); background: var(--white); }
textarea::placeholder { color: var(--mid); font-style: italic; }
.send-btn { width: 46px; height: 46px; background: var(--accent); border: none; border-radius: 50%; color: var(--white); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.send-btn:hover { background: var(--accent3); transform: scale(1.05); }
.send-btn:active { transform: scale(0.95); }
.send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
.send-btn svg { width: 20px; height: 20px; transform: translateX(1px); }

@media (max-width: 480px) {
  header { padding: 0.875rem 1rem 0.75rem; }
  .header-right { gap: 0.7rem; }
  .back-link { font-size: 0.78rem; }
  .chat { padding: 1.25rem 1rem; gap: 1rem; }
  .input-area { padding: 0.75rem 1rem; padding-bottom: calc(0.75rem + env(safe-area-inset-bottom)); }
  .bubble { max-width: 88%; }
  .welcome { padding: 1.5rem 1.5rem 1rem; }
  .welcome h1 { font-size: 1.5rem; }
}
@media (min-width: 680px) {
  body { background: var(--bg2); }
  .app { margin: 1.5rem auto; height: calc(100dvh - 3rem); border-radius: 1.5rem; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.08); }
}
/* ── HÄPPCHEN REELS — FULL-SCREEN ─────── */
.reels-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg, #faf9f7);
  z-index: 1000;
  display: none;
  font-family: 'DM Sans', sans-serif;
}
.reels-overlay.open { display: block; }

.reels-slide {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding: 1.2rem 1.5rem 1.5rem;
  padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
  padding-top: calc(1.2rem + env(safe-area-inset-top));
  background: var(--bg, #faf9f7);
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s;
  opacity: 0;
  transform: translateX(100%);
}
.reels-slide.active   { opacity: 1; transform: translateX(0);     z-index: 2; }
.reels-slide.previous { opacity: 0; transform: translateX(-100%); z-index: 1; }

.reels-top {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  margin-bottom: 0.8rem;
}
.reels-close, .reels-audio {
  background: rgba(0,0,0,0.05);
  border: none;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 1rem;
  cursor: pointer;
  color: #6b6560;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s, color 0.2s;
}
.reels-close:hover, .reels-audio:hover { background: rgba(0,0,0,0.1); }
.reels-audio.muted { color: #c0392b; }

.reels-progress {
  flex: 1;
  display: flex;
  gap: 4px;
}
.reels-bar {
  flex: 1;
  height: 3px;
  background: rgba(0,0,0,0.08);
  border-radius: 100px;
  overflow: hidden;
}
.reels-bar .fill {
  height: 100%;
  width: 0%;
  background: var(--accent, #2d6a4f);
  border-radius: 100px;
}
.reels-bar.done .fill, .reels-bar.current .fill { width: 100%; }

.reels-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 0 1rem;
  gap: 1.4rem;
}
.reels-intro-count {
  font-size: 0.78rem;
  color: #6b6560;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: var(--accent2, #e8f5ee);
  padding: 0.35rem 0.9rem;
  border-radius: 100px;
}
.reels-emoji { font-size: 3.5rem; }
.reels-emoji.outro { animation: reelsPop 0.5s ease; }
@keyframes reelsPop {
  0% { transform: scale(0); }
  60% { transform: scale(1.2); }
  100% { transform: scale(1); }
}
.reels-title {
  font-family: 'Lora', Georgia, serif;
  font-weight: 700;
  font-size: 1.9rem;
  line-height: 1.15;
  letter-spacing: -0.02em;
  color: #1a1816;
}
.reels-title em { font-style: italic; color: var(--accent, #2d6a4f); }
.reels-sub {
  font-size: 1rem;
  color: #6b6560;
  line-height: 1.5;
  max-width: 320px;
}
.reels-item-num {
  font-size: 0.82rem;
  color: var(--accent, #2d6a4f);
  font-weight: 700;
  letter-spacing: 0.1em;
}
.reels-target {
  font-family: 'Lora', Georgia, serif;
  font-weight: 700;
  font-size: 2rem;
  line-height: 1.2;
  letter-spacing: -0.02em;
  color: #1a1816;
}
.reels-phonetic {
  font-size: 1rem;
  color: #8a847d;
  font-family: 'DM Sans', sans-serif;
  letter-spacing: 0.01em;
  line-height: 1.3;
}
.reels-phonetic::before { content: '['; }
.reels-phonetic::after  { content: ']'; }
.reels-divider {
  width: 40px;
  height: 2px;
  background: var(--accent, #2d6a4f);
  border-radius: 100px;
}
.reels-native {
  font-size: 1.1rem;
  color: #6b6560;
  font-style: italic;
  line-height: 1.45;
  max-width: 320px;
}
.reels-hear {
  margin-top: 0.4rem;
  background: #ffffff;
  border: 1.5px solid var(--faint, #e7e5e4);
  border-radius: 100px;
  padding: 0.55rem 1.1rem;
  font-family: inherit;
  font-size: 0.88rem;
  font-weight: 500;
  color: #6b6560;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.reels-hear:hover { color: var(--accent, #2d6a4f); border-color: var(--accent, #2d6a4f); }
.reels-hear.speaking {
  background: var(--accent2, #e8f5ee);
  color: var(--accent, #2d6a4f);
  border-color: var(--accent, #2d6a4f);
  animation: reelsPulse 1s ease-in-out infinite;
}
@keyframes reelsPulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.05); }
}

.reels-actions {
  display: flex;
  gap: 0.6rem;
  padding-top: 1rem;
}
.reels-btn {
  flex: 1;
  background: #1a1816;
  color: #ffffff;
  border: none;
  border-radius: 100px;
  padding: 1rem;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}
.reels-btn:hover { background: #2d6a4f; }
.reels-btn.secondary {
  background: transparent;
  color: #6b6560;
  border: 1.5px solid var(--faint, #e7e5e4);
}
.reels-btn.primary-green { background: var(--accent, #2d6a4f); }
.reels-btn.primary-green:hover { background: #1a4a38; }

/* ── HEADER MENU (three-dot) ─────────── */
.menu-wrap { position: relative; }
.menu-btn {
  background: transparent;
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  cursor: pointer;
  color: #6b6560;
  font-size: 1.3rem;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.menu-btn:hover { background: rgba(0,0,0,0.06); color: #1a1816; }

.menu-dropdown {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  background: #ffffff;
  border: 1px solid var(--faint, #e7e5e4);
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  min-width: 220px;
  padding: 0.4rem 0;
  z-index: 50;
  display: none;
  animation: menuPop 0.18s ease;
}
@keyframes menuPop {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.menu-dropdown.open { display: block; }
.menu-item {
  display: block;
  width: 100%;
  background: transparent;
  border: none;
  text-align: left;
  padding: 0.7rem 1rem;
  font-family: inherit;
  font-size: 0.92rem;
  color: #1a1816;
  cursor: pointer;
  transition: background 0.15s;
}
.menu-item:hover { background: var(--bg2, #f3f1ee); }
.menu-item.danger { color: #c0392b; }
.menu-item.danger:hover { background: #fdebe9; }

/* ── RESET MODAL ────────────────────── */
.reset-modal {
  position: fixed;
  inset: 0;
  background: rgba(26,24,22,0.5);
  z-index: 2000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
}
.reset-modal.open { display: flex; }
.reset-card {
  background: #ffffff;
  border-radius: 18px;
  padding: 1.8rem 1.6rem;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}
.reset-card h3 {
  font-family: 'Lora', Georgia, serif;
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
  color: #1a1816;
}
.reset-card p {
  font-size: 0.95rem;
  color: #6b6560;
  line-height: 1.55;
  margin-bottom: 1.1rem;
}
.reset-check {
  display: flex;
  align-items: flex-start;
  gap: 0.6rem;
  background: var(--bg2, #f3f1ee);
  border-radius: 12px;
  padding: 0.8rem 1rem;
  margin-bottom: 1.4rem;
  cursor: pointer;
}
.reset-check input { margin-top: 0.2rem; flex-shrink: 0; cursor: pointer; }
.reset-check span {
  font-size: 0.9rem;
  color: #1a1816;
  line-height: 1.5;
}
.reset-actions { display: flex; gap: 0.6rem; }
.reset-btn {
  flex: 1;
  padding: 0.85rem;
  border: none;
  border-radius: 100px;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}
.reset-btn.cancel {
  background: transparent;
  color: #6b6560;
  border: 1.5px solid var(--faint, #e7e5e4);
}
.reset-btn.cancel:hover { border-color: #1a1816; color: #1a1816; }
.reset-btn.confirm {
  background: #c0392b;
  color: #ffffff;
}
.reset-btn.confirm:hover { background: #a02e22; }
.reset-btn:disabled { opacity: 0.5; cursor: wait; }

</style>
</head>
<body>
<!-- HÄPPCHEN REELS overlay (full-screen, hidden by default) -->
<div class="reels-overlay" id="reelsOverlay"></div>
<div class="app">

  <header>
    <div class="header-left">
      <svg class="capy-icon" viewBox="0 0 80 80" fill="none">
        <ellipse cx="40" cy="50" rx="28" ry="20" fill="#c9956a"/>
        <ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/>
        <ellipse cx="40" cy="36" rx="10" ry="7" fill="#b8845a"/>
        <ellipse cx="40" cy="33" rx="4" ry="2.5" fill="#8b5e3c"/>
        <circle cx="38" cy="33" r="1" fill="#6b4226"/>
        <circle cx="42" cy="33" r="1" fill="#6b4226"/>
        <circle cx="33" cy="24" r="3.5" fill="#3d2b1f"/>
        <circle cx="47" cy="24" r="3.5" fill="#3d2b1f"/>
        <circle cx="34" cy="23" r="1.2" fill="white"/>
        <circle cx="48" cy="23" r="1.2" fill="white"/>
        <ellipse cx="26" cy="17" rx="6" ry="5" fill="#b8845a"/>
        <ellipse cx="54" cy="17" rx="6" ry="5" fill="#b8845a"/>
        <ellipse cx="22" cy="66" rx="7" ry="5" fill="#b8845a"/>
        <ellipse cx="34" cy="68" rx="7" ry="5" fill="#b8845a"/>
        <ellipse cx="46" cy="68" rx="7" ry="5" fill="#b8845a"/>
        <ellipse cx="58" cy="66" rx="7" ry="5" fill="#b8845a"/>
        <path d="M36 38 Q40 41 44 38" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </svg>
      <span class="brand-name">Spi<em>k</em>iu</span>
      <div class="status-dot"></div>
    </div>
    <div class="header-right">
      <a href="books.html" class="back-link" data-i18n="nav.books">📚 Books</a>
      <a href="dashboard.html" class="back-link" data-i18n="nav.dashboard">← Dashboard</a>
      <div class="menu-wrap">
        <button class="menu-btn" id="menuBtn" aria-label="Menu" onclick="toggleMenu(event)">⋯</button>
        <div class="menu-dropdown" id="menuDropdown">
          <button class="menu-item" id="menuSaveLesson" onclick="menuSaveLesson()" data-i18n="menu.saveLesson">Lektion aus diesem Chat speichern</button>
          <button class="menu-item danger" onclick="openResetModal()" data-i18n="menu.reset">Chat zurücksetzen</button>
        </div>
      </div>
    </div>
  </header>

  <!-- RESET MODAL -->
  <div class="reset-modal" id="resetModal">
    <div class="reset-card">
      <h3 data-i18n="reset.title">Chat zurücksetzen?</h3>
      <p data-i18n="reset.body">Du fängst frisch an. Diese Konversation wird gelöscht.</p>
      <label class="reset-check">
        <input type="checkbox" id="resetSaveLesson" checked>
        <span data-i18n="reset.saveLesson">Vorher als Lektion in mein Dashboard speichern.</span>
      </label>
      <div class="reset-actions">
        <button class="reset-btn cancel" onclick="closeResetModal()" data-i18n="reset.cancel">Abbrechen</button>
        <button class="reset-btn confirm" id="resetConfirmBtn" onclick="confirmReset()" data-i18n="reset.confirm">Zurücksetzen</button>
      </div>
    </div>
  </div>

  <div class="welcome" id="welcome">
    <svg class="welcome-capy" viewBox="0 0 80 80" fill="none">
      <ellipse cx="40" cy="50" rx="28" ry="20" fill="#c9956a"/>
      <ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/>
      <ellipse cx="40" cy="36" rx="10" ry="7" fill="#b8845a"/>
      <ellipse cx="40" cy="33" rx="4" ry="2.5" fill="#8b5e3c"/>
      <circle cx="38" cy="33" r="1" fill="#6b4226"/>
      <circle cx="42" cy="33" r="1" fill="#6b4226"/>
      <circle cx="33" cy="24" r="3.5" fill="#3d2b1f"/>
      <circle cx="47" cy="24" r="3.5" fill="#3d2b1f"/>
      <circle cx="34" cy="23" r="1.2" fill="white"/>
      <circle cx="48" cy="23" r="1.2" fill="white"/>
      <ellipse cx="26" cy="17" rx="6" ry="5" fill="#b8845a"/>
      <ellipse cx="54" cy="17" rx="6" ry="5" fill="#b8845a"/>
      <ellipse cx="22" cy="66" rx="7" ry="5" fill="#b8845a"/>
      <ellipse cx="34" cy="68" rx="7" ry="5" fill="#b8845a"/>
      <ellipse cx="46" cy="68" rx="7" ry="5" fill="#b8845a"/>
      <ellipse cx="58" cy="66" rx="7" ry="5" fill="#b8845a"/>
      <path d="M36 38 Q40 41 44 38" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </svg>
    <h1 data-i18n="welcome.title">Just <em>speak.</em><br>Now, don't wait!</h1>
    <p data-i18n="welcome.sub">No grades. No pressure.<br>Just you and Spikiu — talking.</p>
    <button class="start-btn" onclick="startChat()" data-i18n="welcome.cta">Start talking →</button>
    <span class="welcome-note" data-i18n="welcome.note">Spanish · German · English</span>
  </div>

  <div class="chat" id="chat" style="display:none"></div>

  <div class="input-area" id="inputArea" style="display:none">
    <div class="input-row">
      <textarea id="userInput" data-i18n-placeholder="input.placeholder" placeholder="Say something..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" disabled onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

// ── READER PROGRESS — gives Spikiu context about what user is reading ──
function buildReaderProgress(targetLang) {

  let bookLang = null;
  if (targetLang === 'German')  bookLang = 'de';
  else if (targetLang === 'Spanish') bookLang = 'es';

  return {
    bookLang,                       // 'de' or 'es'
    hasRead: sortedRead,            // [1, 2, 3]
    totalAvailableInBeta: 4,
    lastRead,                       // 3 or null
    hasReadAnything: sortedRead.length > 0
  };
}

// ── BUILD LAST-CONVERSATION MEMORY ─────────────────────
// Today (beta): turn the stored last conversation into a plain-text
// transcript that Spikiu can read as context.
// Later (post-Supabase + Haiku): replace the body of this function
// with a per-conversation summary fetched from the backend. The
// downstream contract — a string field called `lastConversationMemory`
// in the profile — stays identical, so no backend rewrite needed.
function buildLastConversationMemory(lastConversation) {
  if (!Array.isArray(lastConversation) || lastConversation.length === 0) {
    return null;
  }

  // Skip leading assistant message if it's the opener (no preceding user turn)
  // so we don't waste tokens on Spikiu's own hellos from last time.
  const lines = lastConversation
    .filter(m => m && typeof m.content === 'string' && m.content.trim().length > 0)
    .map(m => {
      const speaker = m.role === 'user' ? 'USER' : 'SPIKIU';
      // Strip any of the internal markers Spikiu uses (lesson triggers, PDF marks, etc.)
      const clean = m.content
        .replace(/\[LESSON_REQUEST:[^\]]*\]/g, '')
        .replace(/\[LESSON_FROM_CONVERSATION\]/g, '')
        .replace(/\[PDF_AVAILABLE\]/g, '')
        .replace(/\[OPEN_CONVERSATION\]/g, '')
        .trim();
      return clean ? `${speaker}: ${clean}` : '';
    })
    .filter(Boolean);

  if (lines.length === 0) return null;
  return lines.join('\n');
}

// ── UI HELPERS ─────────────────────────────────────────
// ── HÄPPCHEN PARSER ─────────────────────
// Spikiu emits a card via the marker [HÄPPCHEN]{json}[/HÄPPCHEN].
// We strip the marker out of the chat bubble and render a visual card instead.
// We also scrub stray artifacts (lone punctuation lines, trailing whitespace,
// empty lines) that the LLM sometimes emits adjacent to the marker.
function parseHaeppchen(text) {
  const m = text.match(/\[HÄPPCHEN\]([\s\S]*?)\[\/HÄPPCHEN\]/);
  if (!m) return { cleanText: text, haeppchen: null };
  let json = null;
  try { json = JSON.parse(m[1].trim()); } catch(e) { console.error('Häppchen JSON parse failed', e); }
  // Remove the marker block itself
  let cleanText = text.replace(/\[HÄPPCHEN\][\s\S]*?\[\/HÄPPCHEN\]/, '');
  // Scrub lone-punctuation / empty-content lines (e.g. a stray "." the LLM emits)
  cleanText = cleanText
    .split('\n')
    .map(line => line.trim())
    .filter(line => line.length > 0 && !/^[.\-—_·•]+$/.test(line))
    .join('\n')
    .trim();
  return { cleanText, haeppchen: json };
}

// ── TEXT-TO-SPEECH (Browser-native, Web Speech API) ───
// Free, runs on the user's device. Quality varies: iPhone with Siri voices
// is excellent, Android Chrome is solid, desktop varies. Degrades silently
// when unavailable — the listen button still appears but does nothing.
const TTS_SUPPORTED = (typeof window !== 'undefined') && 'speechSynthesis' in window;
let ttsVoices = [];
let audioEnabled = (localStorage.getItem('spikiu_audio') !== 'off');
let speakingBtnRef = null;

function loadTtsVoices() {
  if (!TTS_SUPPORTED) return;
  ttsVoices = window.speechSynthesis.getVoices() || [];
}
if (TTS_SUPPORTED) {
  loadTtsVoices();
  window.speechSynthesis.onvoiceschanged = loadTtsVoices;
}

function pickTtsVoice(langCode) {
  if (!ttsVoices.length) loadTtsVoices();
  const base = (langCode || 'en').toLowerCase().split('-')[0];
  const candidates = ttsVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith(base));
  if (!candidates.length) return null;
  return candidates.sort((a, b) => {
    const score = (v) => {
      const n = (v.name || '').toLowerCase();
      let s = 0;
      if (n.includes('premium') || n.includes('enhanced') || n.includes('natural')) s += 3;
      if (v.localService) s += 2;
      if (v.lang && v.lang.toLowerCase() === (langCode || '').toLowerCase()) s += 1;
      if (n.includes('compact')) s -= 2;
      return s;
    };
    return score(b) - score(a);
  })[0];
}

function speak(text, langCode, btnEl, force) {
  if (!TTS_SUPPORTED) return;
  if (!audioEnabled && !force) return;
  window.speechSynthesis.cancel();

  const u = new SpeechSynthesisUtterance(text);
  u.lang = langCode || 'es-ES';
  u.rate = 0.92;
  u.pitch = 1.0;
  u.volume = 1.0;
  const v = pickTtsVoice(u.lang);
  if (v) u.voice = v;

  if (btnEl) {
    btnEl.classList.add('speaking');
    speakingBtnRef = btnEl;
  }
  u.onend = u.onerror = () => {
    if (btnEl) btnEl.classList.remove('speaking');
    speakingBtnRef = null;
  };
  window.speechSynthesis.speak(u);
}

function stopSpeak() {
  if (TTS_SUPPORTED) window.speechSynthesis.cancel();
  if (speakingBtnRef) {
    speakingBtnRef.classList.remove('speaking');
    speakingBtnRef = null;
  }
}

function toggleAudio() {
  audioEnabled = !audioEnabled;
  localStorage.setItem('spikiu_audio', audioEnabled ? 'on' : 'off');
  if (!audioEnabled) stopSpeak();

  document.querySelectorAll('.reels-audio').forEach(b => {

// ── HÄPPCHEN REELS — full-screen multi-slide UI ────
let reelsState = { slides: 0, idx: 0, ttsLang: 'es-ES', labels: REELS_LABELS.English };

function openReels(data) {
  if (!data || !Array.isArray(data.items) || data.items.length === 0) return;

  const nativeLang = (session && session.nativeLang) || 'English';

  reelsState = {
    slides: data.items.length + 2,   // intro + items + outro
    idx: 0,
    ttsLang,
    labels,
    nativeLang,
    items: data.items,
    title: data.title || labels.badge,
    intro: data.intro || ''

  overlay.innerHTML = '';

  overlay.appendChild(buildReelsIntroSlide());
  data.items.forEach((it, i) => overlay.appendChild(buildReelsItemSlide(it, i)));

  overlay.classList.add('open');

}

function closeReels(silent) {

function buildReelsTopBar(slideIdx) {

  const bars = document.createElement('div');
  bars.className = 'reels-progress';
  for (let i = 0; i < reelsState.slides; i++) {
    const bar = document.createElement('div');
    bar.className = 'reels-bar';
    if (i < slideIdx) bar.classList.add('done');
    if (i === slideIdx) bar.classList.add('current');
    bar.innerHTML = '<div class="fill"></div>';
    bars.appendChild(bar);
  }
  top.appendChild(bars);

  const audio = document.createElement('button');
  audio.className = 'reels-audio' + (audioEnabled ? '' : ' muted');

function buildReelsIntroSlide() {

function buildReelsItemSlide(item, i) {

  s.dataset.target = item.target || '';
  s.dataset.ttsLang = reelsState.ttsLang;

  const content = document.createElement('div');

  content.innerHTML = `
    <div class="reels-item-num">${i + 1} / ${reelsState.items.length}</div>
    <div class="reels-target">${escapeHtml(item.target || '')}</div>

    <div class="reels-divider"></div>

  hearBtn.onclick = (e) => {
    e.stopPropagation();

  };
  content.appendChild(hearBtn);
  s.appendChild(content);

  const isLast = (i === reelsState.items.length - 1);
  const actions = document.createElement('div');
  actions.className = 'reels-actions';
  const back = document.createElement('button');
  back.className = 'reels-btn secondary';
  back.textContent = labels.prev;
  back.onclick = prevReelsSlide;
  const next = document.createElement('button');
  next.className = 'reels-btn';
  next.textContent = isLast ? labels.last : labels.next;
  next.onclick = nextReelsSlide;
  actions.appendChild(back);
  actions.appendChild(next);
  s.appendChild(actions);

  return s;
}

function buildReelsOutroSlide() {
  const labels = reelsState.labels;
  const s = document.createElement('div');
  s.className = 'reels-slide';
  s.dataset.idx = reelsState.slides - 1;
  s.appendChild(buildReelsTopBar(reelsState.slides - 1));

  const content = document.createElement('div');
  content.className = 'reels-content';
  content.innerHTML = `
    <div class="reels-emoji outro">✓</div>

  actions.className = 'reels-actions';
  const back = document.createElement('button');
  back.className = 'reels-btn secondary';
  back.textContent = labels.outroBack;
  back.onclick = prevReelsSlide;
  const go = document.createElement('button');
  go.className = 'reels-btn primary-green';
  go.textContent = labels.practice;
  go.onclick = startPracticeFromReels;
  actions.appendChild(back);
  actions.appendChild(go);
  s.appendChild(actions);

  return s;
}

function showReelsSlide(idx) {
  stopSpeak();
  const slides = document.querySelectorAll('#reelsOverlay .reels-slide');
  slides.forEach((s, i) => {
    s.classList.remove('active', 'previous');
    if (i < idx) s.classList.add('previous');
    else if (i === idx) s.classList.add('active');
  });
  reelsState.idx = idx;

  // Auto-speak target on item slides
  if (audioEnabled) {
    const active = slides[idx];
    if (active && active.dataset.target) {
      const hearBtn = active.querySelector('.reels-hear');
      setTimeout(() => speak(active.dataset.target, active.dataset.ttsLang, hearBtn), 320);
    }
  }
}

function nextReelsSlide() {
  if (reelsState.idx < reelsState.slides - 1) showReelsSlide(reelsState.idx + 1);
}
function prevReelsSlide() {
  if (reelsState.idx > 0) showReelsSlide(reelsState.idx - 1);
}

function startPracticeFromReels() {
  const readyLabel = HAEPPCHEN_READY[reelsState.nativeLang] || HAEPPCHEN_READY.English;
  closeReels(true);
  const input = document.getElementById('userInput');
  if (input) {
    input.value = readyLabel;
    sendMessage();
  }
}

// Swipe gestures + keyboard shortcuts
let reelsTouchX = null;
let reelsTouchY = null;
function attachReelsSwipe(overlay) {
  overlay.ontouchstart = (e) => {
    reelsTouchX = e.touches[0].clientX;
    reelsTouchY = e.touches[0].clientY;
  };
  overlay.ontouchend = (e) => {
    if (reelsTouchX === null) return;
    const dx = e.changedTouches[0].clientX - reelsTouchX;
    const dy = e.changedTouches[0].clientY - reelsTouchY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) nextReelsSlide();
      else prevReelsSlide();
    }
    reelsTouchX = null;
  };
  document.addEventListener('keydown', (e) => {
    if (!document.getElementById('reelsOverlay').classList.contains('open')) return;
    if (e.key === 'ArrowRight') nextReelsSlide();
    if (e.key === 'ArrowLeft')  prevReelsSlide();
    if (e.key === 'Escape')     closeReels();
  });
}

// ═══════════════════════════════════════════════════════
// CHAT LOG PERSISTENCE — WhatsApp-style
// ═══════════════════════════════════════════════════════
// The conversation survives page navigation, accidental back-button,
// app switch and tab close. It only clears when the user explicitly
// hits "Chat zurücksetzen" in the header menu.
//
// Stored as localStorage['spikiu_chat_log'] = { updatedAt, messages: [...] }
// Each message: { role: 'spikiu'|'user', text: string }
// Spikiu messages keep their full text including [HÄPPCHEN]/[LESSON_FROM_CONVERSATION]
// markers so the UI can fully re-render (Reels stay re-openable from history).

let chatLog = [];

function loadChatLog() {
  try {
    const raw = localStorage.getItem('spikiu_chat_log');
    if (!raw) return [];
    const data = JSON.parse(raw);
    return Array.isArray(data.messages) ? data.messages : [];
  } catch(e) { return []; }
}

function saveChatLog() {
  try {
    localStorage.setItem('spikiu_chat_log', JSON.stringify({
      updatedAt: new Date().toISOString(),
      messages: chatLog
    }));
  } catch(e) { /* localStorage full or unavailable — silent */ }
}

function clearChatLog() {
  try { localStorage.removeItem('spikiu_chat_log'); } catch(e) {}
  chatLog = [];
}

function appendToChatLog(role, text) {
  chatLog.push({ role, text });
  saveChatLog();
}

// ═══ RESTORE on chat.html load ═══
function restoreChatFromLog(user, log) {
  // Hydrate session from user profile (same as resumeConversation does)
  session.phase = 3;
  session.name = user.name;
  session.nativeLang = user.nativeLang;
  session.profile = user.profile;
  session.history = [];
  chatLog = log.slice();

  // Re-render each stored message + reconstruct session.history for the API
  log.forEach(m => {
    addMessage(m.role, m.text, { skipSave: true, skipReels: true });
    if (m.role === 'spikiu') {
      session.history.push({ role: 'assistant', content: m.text });
    } else {
      session.history.push({ role: 'user', content: m.text });
    }
  });

  // Update lastSeenAt — but NO new greeting, we continue where we left off
  try {
    user.lastSeenAt = new Date().toISOString();
    localStorage.setItem('spikiu_user', JSON.stringify(user));
  } catch(e) {}
}

window.menuSaveLesson = async function() {

window.confirmReset = async function() {
  const btn = document.getElementById('resetConfirmBtn');
  btn.disabled = true;
  const wantsLesson = document.getElementById('resetSaveLesson').checked;

  // Optionally save the conversation as a lesson before wiping
  if (wantsLesson && session.history && session.history.length > 0) {
    try { await generateLessonFromConversation(); } catch(e) {}
  }

  // Wipe the chat log; keep the user profile + roadmap
  clearChatLog();
  session.history = [];

  // Restart fresh: hide the modal, clear the DOM, re-trigger resume flow
  closeResetModal();
  const chatEl = document.getElementById('chat');
  if (chatEl) chatEl.innerHTML = '';
  btn.disabled = false;

  const user = loadExistingUser();
  if (user && user.profile && user.profile.targetLang) {
    resumeConversation(user);
  } else {
    window.location.replace('assessment.html');
  }
};

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function addMessage(role, text, opts) {
  opts = opts || {};
  const chat = document.getElementById('chat');
  const msg = document.createElement('div');
  msg.className = 'message ' + role;

  if (role === 'spikiu') {
    const { cleanText, haeppchen } = parseHaeppchen(text);
    // Only render the text bubble if there's actually text to show
    if (cleanText) {
      const rendered = parseMarkdown(cleanText);
      msg.innerHTML = `<div class="avatar-spikiu">${CAPY_SMALL}</div><div style="flex:1;min-width:0;"><div class="bubble spikiu">${rendered}</div></div>`;
      chat.appendChild(msg);
    }

    // If Spikiu offered a Häppchen → open the full-screen Reels overlay
    // Skip auto-opening on restore — the user already saw it before.
    if (haeppchen && !opts.skipReels) {
      // Tiny delay so the lead-in bubble renders first, then Reels takes over
      setTimeout(() => openReels(haeppchen), cleanText ? 350 : 0);
    }
  } else {
    msg.innerHTML = `<div class="bubble user">${text.split('\n').join('<br>')}</div>`;
    chat.appendChild(msg);
  }

  chat.scrollTop = chat.scrollHeight;

  // Persist this bubble unless the caller is replaying from log
  if (!opts.skipSave) appendToChatLog(role, text);
}

function showTyping() {
  const chat = document.getElementById('chat');
  const t = document.createElement('div');
  t.className = 'message spikiu';
  t.id = 'typing';
  t.innerHTML = `<div class="avatar-spikiu">${CAPY_SMALL}</div><div class="typing-bubble"><span></span><span></span><span></span></div>`;
  chat.appendChild(t);
  chat.scrollTop = chat.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

// PDF download from button — exposed globally for inline onclick
window.spikiuDownloadPDF = function(btn) {
  const content = decodeURIComponent(btn.getAttribute('data-content'));
  downloadPDF(content);
};

// ── BACKEND CALLS ──────────────────────────────────────
async function apiOnboarding(messages) {
  const r = await fetch('/api/onboarding', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages })
  });
  return await r.json();
}

async function apiAssessment(messages, name, nativeLang) {
  const r = await fetch('/api/assessment', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages, name, nativeLang })
  });
  return await r.json();
}

async function apiGeneratePlan(name, nativeLang, profile) {
  const r = await fetch('/api/generate-learningpath', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, nativeLang, profile })
  });
  const d = await r.json();
  return d.roadmap;
}

async function apiChat(targetLang, messages, profile) {
  const endpoint = targetLang === 'Spanish' ? '/api/chat-spanish'
                : targetLang === 'German'  ? '/api/chat-german'
                : '/api/chat-english';
  const r = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages, profile, maxTokens: 600 })
  });

  // ── DEBUG MODE — surface the real backend error instead of swallowing it ──
  // When the backend returns 4xx/5xx, the JSON has { error, detail } where
  // `detail` is the slice of the Anthropic response body. We throw a tagged
  // error so the catch in sendMessage can show it as a chat bubble.
  if (!r.ok) {
    let d = {};
    try { d = await r.json(); } catch(e) {}
    const detailStr = d.detail ? ` · detail: ${typeof d.detail === 'string' ? d.detail : JSON.stringify(d.detail)}` : '';
    const errStr = d.error ? d.error : 'API request failed';
    throw new Error(`[${r.status}] ${errStr}${detailStr} · msgs=${messages.length}`);
  }

  const d = await r.json();
  return d.reply;
}

// ── FLOW ───────────────────────────────────────────────
window.startChat = function() {
  document.getElementById('welcome').style.display = 'none';
  document.getElementById('chat').style.display = 'flex';
  document.getElementById('inputArea').style.display = 'block';

  const input = document.getElementById('userInput');
  input.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 130) + 'px';
    document.getElementById('sendBtn').disabled = this.value.trim() === '';
  });
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (this.value.trim()) sendMessage();
    }
  });

  // ── ANDROID/iOS KEYBOARD HANDLING ──────────────────
  input.addEventListener('focus', function() {
    setTimeout(() => {
      const chat = document.getElementById('chat');
      chat.scrollTop = chat.scrollHeight;
      input.scrollIntoView({ block: 'end', behavior: 'smooth' });
    }, 300);
  });

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
      const app = document.querySelector('.app');
      const vh = window.visualViewport.height;
      app.style.height = vh + 'px';
      const chat = document.getElementById('chat');
      chat.scrollTop = chat.scrollHeight;
    });
  }

  // Check if user already completed Beratung (assessment.html)
  const existingUser = loadExistingUser();

  if (existingUser && existingUser.profile && existingUser.profile.targetLang) {
    // WhatsApp-style: if a chat log exists, continue where we left off
    const savedLog = loadChatLog();
    if (savedLog.length > 0) {
      restoreChatFromLog(existingUser, savedLog);
    } else {
      resumeConversation(existingUser);
    }
  } else {
    // ── LEGACY phase 1+2 (Onboarding + Assessment in chat) — REPLACED by assessment.html ──
    // The old conversational onboarding/assessment now lives in assessment.html as a card flow.
    // No profile = user landed on chat.html directly — send them through Beratung first.
    window.location.replace('assessment.html');
    return;
  }

  input.focus();
};

// ── RESUME CONVERSATION (returning user) ──────────────
function loadExistingUser() {
  try {
    const raw = localStorage.getItem('spikiu_user');
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e) { return null; }
}

async function resumeConversation(user) {
  session.phase = 3;
  session.name = user.name;
  session.nativeLang = user.nativeLang;
  session.profile = user.profile;

  showTyping();

  try {
    // Build reader progress for THIS user
    const readerProgress = buildReaderProgress(user.profile.targetLang);

    // ── FRESHNESS ─────────────────────────────────────────
    // How long since the user was last here? Spikiu reads this
    // and adjusts his greeting (no more "Schön dich kennenzulernen"
    // after 3 minutes away).
    let timeSinceLastSeen = null;
    if (user.lastSeenAt) {
      try { timeSinceLastSeen = Date.now() - new Date(user.lastSeenAt).getTime(); }
      catch(e) { timeSinceLastSeen = null; }
    }

    // ── MEMORY OF LAST CONVERSATION ───────────────────────
    // Spikiu remembers what was talked about in the previous session.
    // Today: full last conversation as plain text. Later (post-beta):
    // can be replaced by a Haiku-generated summary — same field name,
    // different content, no backend changes needed.
    const lastConversationMemory = buildLastConversationMemory(user.lastConversation);

    const reply = await apiChat(
      user.profile.targetLang,
      [],
      {
        name: user.name,
        nativeLang: user.nativeLang,
        ...user.profile,
        readerProgress: readerProgress,
        timeSinceLastSeen: timeSinceLastSeen,
        lastConversationMemory: lastConversationMemory
      }
    );
    hideTyping();
    session.history.push({ role: 'assistant', content: reply });
    addMessage('spikiu', reply);

    // Update lastSeenAt so the next session computes a fresh diff
    try {
      user.lastSeenAt = new Date().toISOString();
      localStorage.setItem('spikiu_user', JSON.stringify(user));
    } catch(e) {}

  } catch(e) {
    hideTyping();
    const fallback = user.profile.targetLang === 'German'
      ? `Hallo ${user.name}! 🐾 Wie geht es dir heute?`
      : user.profile.targetLang === 'Spanish'
      ? `¡Hola ${user.name}! 🐾 ¿Cómo estás hoy?`
      : `Hello ${user.name}! 🐾 How are you today?`;
    addMessage('spikiu', fallback);
    session.history.push({ role: 'assistant', content: fallback });
    console.error(e);
  }
}

window.sendMessage = async function() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;
  addMessage('user', text);

  try {
    if (session.phase === 1) {
      session.onboardingHistory.push({ role: 'user', content: text });
      showTyping();
      const result = await apiOnboarding(session.onboardingHistory);
      hideTyping();

      if (result.name) session.name = result.name;
      if (result.nativeLang) session.nativeLang = result.nativeLang;

      addMessage('spikiu', result.reply);
      session.onboardingHistory.push({ role: 'assistant', content: result.reply });

      if (result.ready && session.name && session.nativeLang) {
        setTimeout(() => {
          session.phase = 2;
          startAssessment();
        }, 800);
      }
    }
    else if (session.phase === 2) {
      session.assessmentHistory.push({ role: 'user', content: text });
      showTyping();
      const result = await apiAssessment(session.assessmentHistory, session.name, session.nativeLang);
      hideTyping();

      if (result.profile) {
        session.profile = { ...session.profile, ...result.profile };
      }

      addMessage('spikiu', result.reply);
      session.assessmentHistory.push({ role: 'assistant', content: result.reply });

      if (result.ready) {
        setTimeout(() => generateRoadmapAndRedirect(), 1500);
      }
    }
    else if (session.phase === 3) {
      session.history.push({ role: 'user', content: text });
      showTyping();

      // Re-build reader progress on EVERY message — user might have read a chapter mid-chat
      const readerProgress = buildReaderProgress(session.profile.targetLang);

      // Compute freshness from stored lastSeenAt (BEFORE updating it)
      let timeSinceLastSeen = null;
      try {
        const rawF = localStorage.getItem('spikiu_user');
        if (rawF) {
          const uF = JSON.parse(rawF);
          if (uF.lastSeenAt) {
            timeSinceLastSeen = Date.now() - new Date(uF.lastSeenAt).getTime();
          }
        }
      } catch(e) {}

      const reply = await apiChat(
        session.profile.targetLang,
        session.history,
        {
          name: session.name,
          nativeLang: session.nativeLang,
          ...session.profile,
          readerProgress: readerProgress,  // ← NEW
          timeSinceLastSeen: timeSinceLastSeen
        }
      );
      session.history.push({ role: 'assistant', content: reply });
      hideTyping();

      const lessonMatch = reply.match(/\[LESSON_REQUEST:\s*topic="([^"]*)"\s*focus="([^"]*)"\]/);
      const fromConvoMatch = reply.match(/\[LESSON_FROM_CONVERSATION\]/);
      const cleanReply = reply
        .replace(/\[LESSON_REQUEST:[^\]]*\]/g, '')
        .replace(/\[LESSON_FROM_CONVERSATION\]/g, '')
        .trim();
      addMessage('spikiu', cleanReply);

      if (lessonMatch) {
        const topic = lessonMatch[1];
        const focus = lessonMatch[2];
        generateLessonInBackground(topic, focus);
      } else if (fromConvoMatch) {
        generateLessonFromConversation();
      }

      try {
        const rawU = localStorage.getItem('spikiu_user');
        if (rawU) {
          const u = JSON.parse(rawU);
          u.lastConversation = session.history;
          u.lastSeenAt = new Date().toISOString();
          localStorage.setItem('spikiu_user', JSON.stringify(u));
        }
      } catch(e) {}
    }
  } catch(e) {
    hideTyping();
    // ── DEBUG MODE — show the real error so we can diagnose without Vercel logs ──
    const msg = (e && e.message) ? String(e.message) : 'Unknown error';
    addMessage('spikiu', `🔧 **DEBUG**\n\nFehler beim API-Call:\n\n\`${msg}\`\n\nBitte Screenshot oder Text kopieren und an Spikiu-Entwickler schicken.`);
    console.error(e);
  }

  document.getElementById('sendBtn').disabled = false;
  input.focus();
};

async function startAssessment() {
  showTyping();
  try {
    const result = await apiAssessment([], session.name, session.nativeLang);
    hideTyping();
    if (result.profile) session.profile = { ...session.profile, ...result.profile };
    addMessage('spikiu', result.reply);
    session.assessmentHistory.push({ role: 'assistant', content: result.reply });
  } catch(e) {
    hideTyping();
    const msg = (e && e.message) ? String(e.message) : 'Unknown error';
    addMessage('spikiu', `🔧 **DEBUG (assessment)**\n\n\`${msg}\``);
    console.error(e);
  }
}

async function generateLessonFromConversation() {
  try {
    const raw = localStorage.getItem('spikiu_user');
    if (!raw) return;
    const user = JSON.parse(raw);
    const lessons = user.lessons || [];

    if (lessons.length >= 3) {
      const limitMsg = user.nativeLang === 'Deutsch'
        ? `🌱 Du hast deine 3 kostenlosen Lektionen schon — du findest sie in deinem Dashboard. Mit Premium gibt es unbegrenzte Lektionen.`
        : user.nativeLang === 'Español'
        ? `🌱 Ya tienes tus 3 lecciones gratuitas. Con Premium tienes lecciones ilimitadas.`
        : `🌱 You've used your 3 free lessons. Premium gives unlimited lessons.`;
      addMessage('spikiu', limitMsg);
      return;
    }

    user.lastConversation = session.history;
    localStorage.setItem('spikiu_user', JSON.stringify(user));

    const r = await fetch('/api/generate-lesson', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: session.name,
        nativeLang: session.nativeLang,
        profile: session.profile,
        conversationHistory: session.history
      })
    });
    const d = await r.json();
    if (!d.lesson) return;

    const newLesson = {
      id: 'lesson_' + Date.now(),
      topic: d.lesson.title || 'Lesson from our conversation',
      fromConversation: true,
      lesson: d.lesson,
      createdAt: new Date().toISOString()
    };
    user.lessons = [...lessons, newLesson];
    localStorage.setItem('spikiu_user', JSON.stringify(user));

  } catch(e) {
    console.error('Lesson from conversation failed:', e);
  }
}

async function generateLessonInBackground(topic, focus) {
  try {
    const raw = localStorage.getItem('spikiu_user');
    if (!raw) return;
    const user = JSON.parse(raw);
    const lessons = user.lessons || [];

    const duplicate = lessons.find(l =>
      l.topic && l.topic.toLowerCase() === topic.toLowerCase()
    );
    if (duplicate) {
      const dupMsg = user.nativeLang === 'Deutsch'
        ? `💡 Hinweis: Du hast schon eine Lektion zu "${topic}" in deinem Dashboard. Soll ich eine vertiefendere erstellen? Sag mir wie.`
        : user.nativeLang === 'Español'
        ? `💡 Aviso: ya tienes una lección sobre "${topic}" en tu dashboard. ¿Te creo una más profunda? Dime cómo.`
        : `💡 Note: you already have a lesson on "${topic}" in your dashboard. Want a deeper one? Tell me how.`;
      addMessage('spikiu', dupMsg);
      return;
    }

    if (lessons.length >= 3) {
      const limitMsg = user.nativeLang === 'Deutsch'
        ? `🌱 Du hast deine 3 kostenlosen Lektionen schon — du findest sie in deinem Dashboard. Mit Premium gibt es unbegrenzte Lektionen.`
        : user.nativeLang === 'Español'
        ? `🌱 Ya tienes tus 3 lecciones gratuitas — están en tu dashboard. Con Premium tienes lecciones ilimitadas.`
        : `🌱 You've used your 3 free lessons — they're in your dashboard. Premium gives unlimited lessons.`;
      addMessage('spikiu', limitMsg);
      return;
    }

    const r = await fetch('/api/generate-lesson', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: session.name,
        nativeLang: session.nativeLang,
        profile: session.profile,
        topic,
        focusInterest: focus
      })
    });
    const d = await r.json();
    if (!d.lesson) return;

    const newLesson = {
      id: 'lesson_' + Date.now(),
      topic,
      focus,
      lesson: d.lesson,
      createdAt: new Date().toISOString()
    };
    user.lessons = [...lessons, newLesson];
    user.lastConversation = session.history;
    localStorage.setItem('spikiu_user', JSON.stringify(user));

    setTimeout(() => {
      const readyMsg = user.nativeLang === 'Deutsch'
        ? `✓ Deine Lektion über "${topic}" ist fertig — sie wartet in deinem Dashboard. 🐾`
        : user.nativeLang === 'Español'
        ? `✓ Tu lección sobre "${topic}" está lista — te espera en tu dashboard. 🐾`
        : `✓ Your lesson on "${topic}" is ready — waiting in your dashboard. 🐾`;
      addMessage('spikiu', readyMsg);
    }, 1500);

  } catch(e) {
    console.error('Lesson generation failed:', e);
  }
}

async function generateRoadmapAndRedirect() {
  document.getElementById('inputArea').style.display = 'none';
  showTyping();

  try {
    const roadmap = await apiGeneratePlan(session.name, session.nativeLang, session.profile);
    hideTyping();

    localStorage.setItem('spikiu_user', JSON.stringify({
      name: session.name,
      nativeLang: session.nativeLang,
      profile: session.profile,
      roadmap: roadmap,
      createdAt: new Date().toISOString(),
      lastSeenAt: new Date().toISOString()
    }));

    const goodbyeMsg = session.nativeLang === 'Deutsch'
      ? 'Fertig! Komm zu deinem Dashboard — da wartet dein Lernraum auf dich. Bis gleich! 🐾'
      : session.nativeLang === 'Español'
      ? '¡Listo! Ven a tu dashboard — allí te espera tu espacio. ¡Hasta ahora! 🐾'
      : 'Ready! Come to your dashboard — your learning space is waiting. See you in a moment! 🐾';
    addMessage('spikiu', goodbyeMsg);

    setTimeout(() => {
      document.body.style.transition = 'opacity 1.2s ease';
      document.body.style.opacity = '0';
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1200);
    }, 3800);

  } catch(e) {
    hideTyping();
    addMessage('spikiu', 'Something went wrong creating your Roadmap. Try again? 🐾');
    document.getElementById('inputArea').style.display = 'block';
    console.error(e);
  }
}
</script>
