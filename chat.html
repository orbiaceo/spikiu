<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Spikiu</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --white:#ffffff; --bg:#faf9f7; --bg2:#f3f1ee; --ink:#1c1917; --mid:#78716c;
  --faint:#e7e5e4; --warm:#d6cfc8; --accent:#2d6a4f; --accent2:#e8f5ee; --capy:#a97c50;
  --accent3:#1f5239; --gold:#a07830; --wrong:#c0392b; --wrong-bg:#fdebe9;
  /* Übersetzungs-Kästchen (Feinschliff): gedämpfte Muleta, sekundär (Stil = Prototyp) */
  --trans-bg:#f1eee8; --trans-ink:#8a847d; --trans-border:#e2ddd4;
  /* Korrektur-Karte „Du hast gesagt" (P3, Stil = prototyp-feinschliff-iii.html) */
  --said-bg:#f6efe2; --said-ink:#8a6d2e; --said-border:#e6d8bb;
}
html, body { height:100%; background:var(--bg); color:var(--ink); font-family:'DM Sans',sans-serif; -webkit-font-smoothing:antialiased; }
.app { display:flex; flex-direction:column; height:calc(100dvh - var(--spk-navh, 0px)); max-width:680px; margin:0 auto; background:var(--white); }
header { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.25rem 0.875rem; border-bottom:1px solid var(--faint); background:var(--white); flex-shrink:0; }
.header-left { display:flex; align-items:center; gap:0.65rem; }
.capy-icon { width:38px; height:38px; flex-shrink:0; }
.brand-name { font-family:'Lora',serif; font-size:1.2rem; font-weight:500; color:var(--ink); letter-spacing:-0.01em; }
.brand-name span { color:var(--accent); font-style:italic; }
.back-link { font-family:'DM Sans',sans-serif; font-size:0.8rem; color:var(--mid); text-decoration:none; }
.back-link:hover { color:var(--ink); }
/* Profil-Chip: sichtbarer Beweis, dass das Profil gelesen und Onboarding übersprungen wurde */
.profile-bar { display:flex; align-items:center; gap:0.5rem; padding:0.55rem 1.25rem; background:var(--accent2); border-bottom:1px solid var(--faint); flex-shrink:0; font-size:0.8rem; color:var(--accent); }
.profile-bar .who { font-weight:600; color:var(--ink); }
.profile-bar .sep { color:var(--warm); }
.profile-bar .chip { background:var(--white); border:1px solid #cfe6da; border-radius:100px; padding:0.1rem 0.6rem; font-size:0.72rem; }
.chat { flex:1; overflow-y:auto; padding:1.5rem 1.25rem; display:flex; flex-direction:column; gap:1.25rem; scroll-behavior:smooth; }
.chat::-webkit-scrollbar { width:3px; }
.chat::-webkit-scrollbar-thumb { background:var(--warm); border-radius:10px; }
.message { display:flex; gap:0.75rem; animation:fadeUp 0.35s ease forwards; opacity:0; }
.message.user { flex-direction:row-reverse; }
@keyframes fadeUp { from { opacity:0; transform:translateY(6px);} to { opacity:1; transform:translateY(0);} }
.avatar-spikiu { background:var(--accent2); border-radius:50%; display:flex; align-items:center; justify-content:center; width:32px; height:32px; flex-shrink:0; margin-top:2px; }
.bubble { max-width:82%; padding:0.85rem 1.1rem; border-radius:1.2rem; font-size:1rem; line-height:1.65; }
.bubble.spikiu { background:var(--bg2); color:var(--ink); border-radius:0.3rem 1.2rem 1.2rem 1.2rem; font-family:'Lora',serif; font-size:1.025rem; position:relative; padding-right:2.7rem; }
.bubble.user { background:var(--accent); color:var(--white); border-radius:1.2rem 0.3rem 1.2rem 1.2rem; font-size:0.975rem; }
/* Feinschliff II: Zielsprache IMMER aufrecht — auch wenn das Modell die fremde
   Wendung in _…_/*…* setzt, kippt die Blase nie ins Kursive. Kursiv bleibt allein
   dem Übersetzungs-Kästchen (.trans). Betonung trägt <strong>. */
.bubble.spikiu, .bubble.spikiu em { font-style:normal; }
/* Mehrere Gedanken (an --- gesplittet) = mehrere gestapelte Blasen: Luft zwischen den
   Gedanken, das Übersetzungs-Kästchen bleibt tight unter SEINER Blase (margin-top 0.4rem). */
.message.spikiu .bubble.spikiu:not(:first-child) { margin-top:0.7rem; }
/* 🔊 dezent in der Spikiu-Blase, nur auf dem Zielsprachen-Teil (Feinschliff). Fallback in audio.js. */
.speak-btn { position:absolute; top:0.6rem; right:0.55rem; width:28px; height:28px; border:none; cursor:pointer; background:var(--accent2); color:var(--accent); border-radius:50%; display:flex; align-items:center; justify-content:center; transition:0.16s; -webkit-tap-highlight-color:transparent; }
.speak-btn:hover { background:var(--accent); color:var(--white); }
.speak-btn.playing { animation:pulse 1s ease infinite; }
.speak-btn svg { width:14px; height:14px; }
/* Kalter 🔊-Klick (Stimme lädt noch): Spinner statt Lautsprecher, bis DIESER Text spielt (Teil B). */
.speak-btn.loading { background:var(--accent2); cursor:default; }
.speak-btn.loading svg { display:none; }
.speak-btn.loading::after { content:''; width:13px; height:13px; border:2px solid var(--warm); border-top-color:var(--accent); border-radius:50%; animation:spin 0.7s linear infinite; }
/* Gedämpftes Übersetzungs-Kästchen unter der Blase (Muttersprache, KEIN Audio) */
.trans { margin-top:0.4rem; align-self:flex-start; background:var(--trans-bg); border:1px solid var(--trans-border); border-radius:8px; padding:0.4rem 0.7rem; font-family:'DM Sans',sans-serif; font-style:italic; font-size:0.82rem; line-height:1.45; color:var(--trans-ink); max-width:82%; }
.bubble .retry-btn { margin-left:0.4rem; font-family:'DM Sans',sans-serif; font-size:0.82rem; font-weight:600; color:var(--accent); background:var(--white); border:1px solid #cfe6da; border-radius:100px; padding:0.2rem 0.7rem; cursor:pointer; }
.bubble .retry-btn:hover { background:var(--accent); color:var(--white); }
/* Tür-Knopf: Raumwechsel-Signal [WECHSEL:…] wird hier abgefangen → sanfter Knopf, kein Auto-Sprung */
.door-row { display:flex; padding-left:2.75rem; animation:fadeUp 0.35s ease forwards; opacity:0; }
.door-btn { display:inline-flex; align-items:center; gap:0.4rem; font-family:'DM Sans',sans-serif; font-size:0.9rem; font-weight:500; color:var(--accent); background:var(--accent2); border:1px solid #cfe6da; border-radius:100px; padding:0.55rem 1.1rem; cursor:pointer; transition:all 0.2s; -webkit-tap-highlight-color:transparent; }
.door-btn:hover { background:var(--accent); color:var(--white); border-color:var(--accent); }
.door-btn:active { transform:scale(0.97); }
/* Opener-Gabelung (Paket 1): nach dem [EINSTIEG]-Gruß — plaudern oder ein Thema.
   Chip-Stil aus prototyp-gespraech-gefuehrt.html. KEIN Fortschrittsbalken in P1. */
.gabelung { align-self:center; width:100%; max-width:30rem; display:flex; flex-direction:column; align-items:center; text-align:center; gap:0.6rem; padding:0.25rem 0.75rem 0.5rem; animation:fadeUp 0.35s ease forwards; opacity:0; }
.gab-label { font-size:0.78rem; color:var(--mid); font-weight:500; }
/* Opener-Überschrift (Teil 35): ruhige einzelne Zeile statt Gruß-Bubble. */
.gab-ask { font-family:'Lora',serif; font-size:1.05rem; font-weight:600; color:#1a1816; margin:0 0 0.25rem; }
.gab-chips { display:flex; flex-wrap:wrap; justify-content:center; gap:0.5rem; }
.chip { background:var(--white); border:1.5px solid var(--accent); color:var(--accent); padding:0.5rem 0.85rem; border-radius:100px; font-family:'DM Sans',sans-serif; font-size:0.85rem; font-weight:500; cursor:pointer; transition:all 0.18s; -webkit-tap-highlight-color:transparent; }
.chip:hover { background:var(--accent); color:var(--white); }
.chip:active { transform:scale(0.97); }
.chip.full { background:var(--accent); color:var(--white); width:100%; padding:0.65rem; font-weight:600; }
.chip.full:hover { background:#1f5239; }
.chip.ghost { border-style:dashed; border-color:var(--capy); color:var(--capy); }
.chip.ghost:hover { background:var(--capy); color:var(--white); }
.gab-input { display:flex; gap:0.45rem; }
.gab-input input { flex:1; background:var(--bg2); border:1.5px solid transparent; border-radius:100px; padding:0.55rem 0.95rem; font-family:'DM Sans',sans-serif; font-size:0.9rem; color:var(--ink); outline:none; }
.gab-input input:focus { border-color:var(--accent); background:var(--white); }
.gab-send { width:40px; flex-shrink:0; border:none; background:var(--accent); color:var(--white); border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.gab-send svg { width:16px; height:16px; }
.typing-bubble { background:var(--bg2); border-radius:0.3rem 1.2rem 1.2rem 1.2rem; padding:0.9rem 1.1rem; display:flex; gap:5px; align-items:center; }
.typing-bubble span { width:7px; height:7px; background:var(--warm); border-radius:50%; animation:bounce 1.3s infinite; }
.typing-bubble span:nth-child(2){animation-delay:0.18s;} .typing-bubble span:nth-child(3){animation-delay:0.36s;}
@keyframes bounce { 0%,80%,100%{transform:translateY(0);background:var(--warm);} 40%{transform:translateY(-5px);background:var(--capy);} }
.input-area { flex-shrink:0; padding:0.875rem 1.25rem; border-top:1px solid var(--faint); background:var(--white); padding-bottom:calc(0.875rem + env(safe-area-inset-bottom)); }
.input-row { display:flex; gap:0.6rem; align-items:flex-end; }
textarea { flex:1; background:var(--bg2); border:1.5px solid transparent; border-radius:1.2rem; padding:0.75rem 1.1rem; font-family:'DM Sans',sans-serif; font-size:1rem; color:var(--ink); resize:none; outline:none; min-height:48px; max-height:130px; line-height:1.5; transition:border-color 0.2s,background 0.2s; }
textarea:focus { border-color:var(--accent); background:var(--white); }
textarea::placeholder { color:var(--mid); font-style:italic; }
.send-btn { width:46px; height:46px; background:var(--accent); border:none; border-radius:50%; color:var(--white); cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all 0.2s; -webkit-tap-highlight-color:transparent; }
.send-btn:hover { background:#1f5239; transform:scale(1.05); }
.send-btn:active { transform:scale(0.95); }
.send-btn:disabled { opacity:0.35; cursor:not-allowed; transform:none; }
.send-btn svg { width:20px; height:20px; transform:translateX(1px); }
@media (max-width:480px){ header{padding:0.875rem 1rem 0.75rem;} .chat{padding:1.25rem 1rem;gap:1rem;} .input-area{padding:0.75rem 1rem;padding-bottom:calc(0.75rem + env(safe-area-inset-bottom));} .bubble{max-width:88%;} }
@media (min-width:680px){ body{background:var(--bg2);} .app{margin:1.5rem auto;height:calc(100dvh - 3rem - var(--spk-navh, 0px));border-radius:1.5rem;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.08);} }

/* ── Geführtes Gespräch · Fortschrittsbalken (Paket 2) ──
   Thema · Wörter · Hören · Sprechen · Lektion. Füllt bis Sprechen; Lektion bleibt
   blass (= Paket 3). Versteckt, bis ein Thema gewählt ist (der freie Flur bleibt rein). */
.rail { display:flex; gap:0.3rem; padding:0.6rem 1.25rem; background:var(--white); border-bottom:1px solid var(--faint); flex-shrink:0; }
.rail.hidden { display:none; }
.rail-step { flex:1; text-align:center; font-size:0.56rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--warm); transition:0.3s; }
.rail-step .dot { display:block; height:3px; border-radius:100px; background:var(--faint); margin-bottom:0.3rem; transition:0.4s; }
.rail-step.active { color:var(--accent); }
.rail-step.active .dot { background:var(--accent); }
.rail-step.done { color:var(--gold); }
.rail-step.done .dot { background:var(--gold); }

/* ── Häppchen-Widgets (inline im Chat, Stil aus prototyp-gespraech-gefuehrt.html) ── */
.widget { align-self:stretch; background:var(--white); border:1px solid var(--faint); border-radius:16px; padding:0.85rem 0.8rem; margin-left:2.75rem; opacity:0; animation:fadeUp 0.45s ease forwards; box-shadow:0 6px 18px rgba(0,0,0,0.05); }
.w-eyebrow { font-size:0.6rem; font-weight:700; letter-spacing:0.13em; text-transform:uppercase; color:var(--gold); margin-bottom:0.65rem; display:flex; align-items:center; gap:0.35rem; }
.hap-card { display:flex; align-items:center; gap:0.65rem; border:1.5px solid var(--faint); border-radius:12px; padding:0.55rem 0.7rem; margin-bottom:0.4rem; }
.hap-card:last-child { margin-bottom:0; }
.hap-play { width:30px; height:30px; flex-shrink:0; border:none; cursor:pointer; background:var(--accent); color:var(--white); border-radius:50%; display:flex; align-items:center; justify-content:center; transition:0.18s; -webkit-tap-highlight-color:transparent; }
.hap-play:hover { background:var(--accent3); transform:scale(1.06); }
.hap-play.playing { animation:pulse 1s ease infinite; }
@keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(45,106,79,0.4);} 50%{ box-shadow:0 0 0 7px rgba(45,106,79,0);} }
.hap-play svg { width:13px; height:13px; }
.hap-text { flex:1; text-align:left; min-width:0; }
.hap-ziel { font-family:'Lora',serif; font-weight:500; font-size:0.9rem; line-height:1.15; }
.hap-phon { font-size:0.66rem; color:var(--gold); font-weight:500; margin-top:0.08rem; }
.hap-trans { font-size:0.72rem; color:var(--mid); font-style:italic; margin-top:0.08rem; }
.hv-speaker { display:flex; margin:0.2rem auto 0.7rem; width:56px; height:56px; background:var(--accent); border:none; border-radius:50%; cursor:pointer; align-items:center; justify-content:center; color:var(--white); box-shadow:0 6px 18px rgba(45,106,79,0.3); transition:0.18s; -webkit-tap-highlight-color:transparent; }
.hv-speaker:hover { transform:scale(1.05); }
.hv-speaker.playing { animation:pulse 1.1s ease infinite; }
.hv-speaker svg { width:24px; height:24px; }
.hv-q { text-align:center; font-family:'Lora',serif; font-style:italic; font-size:0.9rem; margin-bottom:0.65rem; }
.hv-opt { display:flex; align-items:center; gap:0.55rem; width:100%; background:var(--white); border:1.5px solid var(--faint); cursor:pointer; padding:0.6rem 0.7rem; border-radius:12px; margin-bottom:0.4rem; transition:0.3s; font-family:inherit; font-size:0.84rem; text-align:left; color:var(--ink); -webkit-tap-highlight-color:transparent; }
.hv-opt:last-of-type { margin-bottom:0; }
.hv-opt:hover:not(:disabled) { border-color:var(--accent); }
.hv-opt:disabled { cursor:default; }
.hv-key { width:22px; height:22px; flex-shrink:0; border-radius:50%; background:var(--bg2); color:var(--mid); font-weight:700; font-size:0.7rem; display:flex; align-items:center; justify-content:center; }
.hv-opt-text { flex:1; }
.hv-mark { font-weight:700; font-size:1rem; opacity:0; transition:0.3s; }
.hv-opt.correct { background:var(--accent2); border-color:var(--accent); color:var(--accent3); font-weight:600; }
.hv-opt.correct .hv-key { background:var(--accent); color:var(--white); }
.hv-opt.correct .hv-mark { opacity:1; color:var(--accent); }
.hv-opt.wrong { background:var(--wrong-bg); border-color:var(--wrong); color:var(--wrong); }
.hv-opt.wrong .hv-key { background:var(--wrong); color:var(--white); }
.hv-opt.wrong .hv-mark { opacity:1; color:var(--wrong); }
.hv-feedback { text-align:center; font-size:0.74rem; margin-top:0.55rem; min-height:1em; font-weight:600; }
/* ── Word-Spotting (Übungs-Varianten): gehörte Wörter antippen, Distraktoren als
   Minimalpaar. Stil aus prototyp-feinschliff-iii.html. ── */
.ws-words { display:flex; flex-wrap:wrap; gap:0.4rem; justify-content:center; }
.ws-word { background:var(--white); border:1.5px solid var(--faint); border-radius:100px; padding:0.45rem 0.85rem; font-family:'Lora',serif; font-size:0.85rem; font-weight:600; color:var(--ink); cursor:pointer; transition:0.14s; -webkit-tap-highlight-color:transparent; }
.ws-word.sel { background:var(--accent); color:var(--white); border-color:var(--accent); }
.ws-word.ok { background:var(--accent2); border-color:var(--accent); color:var(--accent3); }
.ws-word.bad { background:var(--wrong-bg); border-color:var(--wrong); color:var(--wrong); text-decoration:line-through; }
.ws-word.missed { border-color:var(--accent); border-style:dashed; color:var(--accent); }
.ws-word.locked { cursor:default; }
/* Inline-Steuerknopf (Weiter) im Chat-Strom */
.flow-row { display:flex; padding-left:2.75rem; animation:fadeUp 0.35s ease forwards; opacity:0; }
.flow-btn { background:var(--accent); color:var(--white); border:none; cursor:pointer; padding:0.6rem 1.2rem; border-radius:100px; font-family:'DM Sans',sans-serif; font-size:0.88rem; font-weight:600; transition:0.18s; -webkit-tap-highlight-color:transparent; }
.flow-btn:hover { background:var(--accent3); }
.flow-btn:active { transform:scale(0.97); }
/* Lade-Spinner (lokalisiert) */
.hap-spin { width:16px; height:16px; flex-shrink:0; border:2.5px solid var(--faint); border-top-color:var(--accent); border-radius:50%; animation:spin 0.7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
/* Übergabe-Notiz (Szene/Brücke) */
.scene-note { align-self:center; text-align:center; font-family:'Lora',serif; font-style:italic; font-size:0.82rem; color:var(--mid); background:rgba(0,0,0,0.02); padding:0.45rem 0.85rem; border-radius:10px; max-width:90%; opacity:0; animation:fadeUp 0.45s ease forwards; }

/* ── Korrektur-Karte am Szenenende (Paket 3) — zwei Spalten „Du hast gesagt → Besser",
   NUR kommunikativ unpassend, OHNE Erklärung; 🔊 auf „Besser". Stil = prototyp-feinschliff-iii.html. */
.kk { align-self:stretch; background:var(--white); border:1px solid var(--faint); border-radius:16px; padding:0.85rem 0.8rem; margin-left:2.75rem; opacity:0; animation:fadeUp 0.45s ease forwards; box-shadow:0 6px 18px rgba(0,0,0,0.05); }
.kk-eyebrow { font-size:0.6rem; font-weight:700; letter-spacing:0.13em; text-transform:uppercase; color:var(--gold); margin-bottom:0.6rem; text-align:center; }
.kk-row { display:grid; grid-template-columns:1fr 1fr; gap:0.45rem; margin-bottom:0.45rem; }
.kk-row:last-child { margin-bottom:0; }
.kk-head > div { font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; text-align:center; }
.kk-head .h-said { color:var(--said-ink); }
.kk-head .h-better { color:var(--accent); }
.kk-cell { border-radius:10px; padding:0.5rem 0.6rem; font-family:'Lora',serif; font-size:0.86rem; line-height:1.3; }
.kk-said { background:var(--said-bg); border:1px solid var(--said-border); color:var(--said-ink); }
.kk-better { background:var(--accent2); border:1px solid var(--accent); color:var(--accent3); font-weight:600; position:relative; padding-right:1.9rem; }
.kk-better .speak-btn { top:50%; transform:translateY(-50%); right:0.4rem; width:24px; height:24px; background:var(--white); }
/* Abschluss-Menü (Paket 3): drei Knöpfe inline im Chat-Strom, kein Auto-Sprung */
.endmenu { align-self:stretch; display:flex; flex-direction:column; gap:0.5rem; margin-left:2.75rem; opacity:0; animation:fadeUp 0.45s ease forwards; }
.endmenu .chip { width:100%; text-align:center; }
/* ── Antwort-Paletten (Teil A): 2–3 klickbare Lerner-Antworten im geführten Thema-
   Rollenspiel. Chips primär, Textfeld bleibt sekundär. NIE im freien Gespräch. ── */
.antwort-palette { align-self:stretch; display:flex; flex-direction:column; gap:0.5rem; padding-left:2.75rem; opacity:0; animation:fadeUp 0.45s ease forwards; }
/* ── Ausstiegs-Leiste (Teil 31 #1): dauerhaft erreichbar im geführten Rollenspiel,
   über dem Eingabefeld. ⋯ öffnet dieselben Optionen wie das End-Menü (Anderes Thema /
   Beenden → Lektion). Nur geführt; im freien Flur ausgeblendet. ── */
.exit-bar { display:flex; flex-direction:column; gap:0.4rem; margin-bottom:0.5rem; }
.exit-bar[hidden] { display:none; }
.exit-toggle { align-self:flex-end; background:none; border:1px solid var(--faint); color:var(--mid); border-radius:100px; padding:0.2rem 0.75rem; font-family:'DM Sans',sans-serif; font-size:0.8rem; cursor:pointer; transition:0.15s; -webkit-tap-highlight-color:transparent; }
.exit-toggle:hover { border-color:var(--accent); color:var(--accent); }
.exit-menu { display:flex; flex-direction:column; gap:0.4rem; }
.exit-menu[hidden] { display:none; }
.exit-menu .chip { width:100%; text-align:center; }
/* ── Freies-Gespräch-Ausstieg (Teil 32 #1): dezenter „Gespräch beenden", dauerhaft
   sichtbar im freien Flur (ab ≥2 Verlauf-Einträgen). Optik wie die Ausstiegs-Leiste. ── */
.free-exit { display:flex; margin-bottom:0.5rem; }
.free-exit[hidden] { display:none; }
.free-exit .exit-toggle { align-self:flex-end; margin-left:auto; }
/* ── Lektion-Angebot (Teil 32 #2): Ja/Nein-Karte am Gesprächsende, Stil wie End-Menü. ── */
.app.dissolving { transition:opacity 0.6s ease, filter 0.6s ease; opacity:0; filter:blur(6px); pointer-events:none; }
/* ── Voz primero (Paket 5): Präsenz-Gruß beim Eintritt. Spikiu LÄDT EIN (sanfter Puls +

<body>
<div class="app">

<script>
// ════════════════════════════════════════════════════════════════════
//  SPIKIU · RAUM: FREIES GESPRÄCH (der Flur)
//  Onboarding ÜBERSPRUNGEN. Profil aus spikiu_user (defensiv, wie
//  schreibwerkstatt.html). Echte Antworten von /api/gespraech.
//  Leere History beim Start → Backend setzt [EINSTIEG] → Opener (Gruß ohne Frage).
// ════════════════════════════════════════════════════════════════════
var ENDPOINT = '/api/gespraech';

// ── Spikiu IMMER komplett: Ohren + 4 Füße. Nie einen halben Capy. ──
var CAPY_SMALL = '<svg width="20" height="20" viewBox="0 0 80 80" fill="none">'
  + '<ellipse cx="40" cy="50" rx="28" ry="20" fill="#c9956a"/><ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/>'
  + '<ellipse cx="40" cy="36" rx="10" ry="7" fill="#b8845a"/><ellipse cx="40" cy="33" rx="4" ry="2.5" fill="#8b5e3c"/>'
  + '<circle cx="38" cy="33" r="1" fill="#6b4226"/><circle cx="42" cy="33" r="1" fill="#6b4226"/>'
  + '<circle cx="33" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="47" cy="24" r="3.5" fill="#3d2b1f"/>'
  + '<circle cx="34" cy="23" r="1.2" fill="white"/><circle cx="48" cy="23" r="1.2" fill="white"/>'
  + '<ellipse cx="26" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="54" cy="17" rx="6" ry="5" fill="#b8845a"/>'
  + '<ellipse cx="22" cy="66" rx="7" ry="5" fill="#b8845a"/><ellipse cx="34" cy="68" rx="7" ry="5" fill="#b8845a"/>'
  + '<ellipse cx="46" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="58" cy="66" rx="7" ry="5" fill="#b8845a"/>'
  + '<path d="M36 38 Q40 41 44 38" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>';

// Voz primero (Paket 5): größerer, vollständiger Capy für den Präsenz-Gruß. Augen in
// einer Gruppe (capy-vivo blinzelt/folgt) + Mund mit Kennung spk-capy-mouth (Sprech-Zustand).
var CAPY_OPENER = '<svg class="voz-capy" viewBox="0 0 80 80" fill="none">'
  + '<ellipse cx="40" cy="50" rx="28" ry="20" fill="#c9956a"/><ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/>'
  + '<ellipse cx="40" cy="36" rx="10" ry="7" fill="#b8845a"/><ellipse cx="40" cy="33" rx="4" ry="2.5" fill="#8b5e3c"/>'
  + '<circle cx="38" cy="33" r="1" fill="#6b4226"/><circle cx="42" cy="33" r="1" fill="#6b4226"/>'
  + '<g class="spk-capy-eyes">'
  +   '<circle cx="33" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="47" cy="24" r="3.5" fill="#3d2b1f"/>'
  +   '<circle cx="34" cy="23" r="1.2" fill="white"/><circle cx="48" cy="23" r="1.2" fill="white"/>'
  + '</g>'
  + '<ellipse cx="26" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="54" cy="17" rx="6" ry="5" fill="#b8845a"/>'
  + '<ellipse cx="22" cy="66" rx="7" ry="5" fill="#b8845a"/><ellipse cx="34" cy="68" rx="7" ry="5" fill="#b8845a"/>'
  + '<ellipse cx="46" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="58" cy="66" rx="7" ry="5" fill="#b8845a"/>'
  + '<path class="spk-capy-mouth" d="M36 38 Q40 41 44 38" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>';

// ── Profil defensiv lesen (Assessment-Paket noch offen — 1:1 wie schreibwerkstatt) ──
var stored = {};
try { stored = (JSON.parse(localStorage.getItem('spikiu_user')||'{}').profile) || {}; } catch(e){}
function langCode(v){
  if(!v) return null; v=(''+v).toLowerCase();
  if(/^(de|es|en|el)$/.test(v)) return v;
  if(v.indexOf('deutsch')>-1||v.indexOf('german')>-1) return 'de';
  if(v.indexOf('span')>-1||v.indexOf('español')>-1) return 'es';
  if(v.indexOf('engl')>-1) return 'en';
  if(v.indexOf('griech')>-1||v.indexOf('greek')>-1) return 'el';
  return null;
}
function koennenFrom(v){
  if(!v) return null; v=(''+v).toLowerCase();
  if(['anfang','mittel','fortgeschritten'].indexOf(v)>-1) return v;
  if(/a[12]/.test(v)) return 'anfang';
  if(/b[12]/.test(v)) return 'mittel';
  if(/c[12]/.test(v)) return 'fortgeschritten';
  return null;
}
var ziel = stored.zielsprache || langCode(stored.targetLang) || 'es';
var PROFILE = {
  name:          stored.name || '',
  muttersprache: stored.muttersprache || langCode(stored.nativeLang) || 'de',
  zielsprache:   ziel,
  koennen:       stored.koennen || koennenFrom(stored.level) || 'anfang',
  fremde_schrift: ziel === 'el'
};

function fillProfileBar(){
  var L = { de:'Deutsch', es:'Español', en:'English', el:'Ελληνικά' };
  var K = { anfang:'Anfänger', mittel:'Mittel', fortgeschritten:'Fortgeschritten' };
  document.getElementById('pName').textContent = PROFILE.name || 'Gast';
  document.getElementById('pLangs').textContent = (L[PROFILE.muttersprache]||PROFILE.muttersprache) + ' → ' + (L[PROFILE.zielsprache]||PROFILE.zielsprache);
  document.getElementById('pKoennen').textContent = K[PROFILE.koennen] || PROFILE.koennen;
}

// ── Zustand ──────────────────────────────────────────────────────
var verlauf = [];
var busy = false;
var lastTurnOk = false;   // hat die letzte Runde sauber gerendert? (steuert die Opener-Gabelung)
var guiding = false;      // geführter Häppchen-Schritt läuft → Eingabe gesperrt (Paket 2)
var gefuehrt = false;     // geführtes Thema-Rollenspiel? (Thema gewählt) → Antwort-Chips erlaubt. „Einfach plaudern"/frei → nie.
var sessionGezaehlt = false;   // Teil 36: pro Gesprächsbogen wächst GENAU EIN Blatt (user.blaetter); neues Gespräch setzt zurück.
var voiceReady = false;   // Stimme vorgewärmt (Teil B)? steuert Spinner vs. Puls am 🔊
var vozHandle = null;     // Voz primero (Paket 5): Sprech-Handle des Präsenz-Gruß-Capy (capy-vivo)
var TOPIC_LABEL = null;   // gewähltes Thema, wartet auf den P1-Seed-Zug nach den Häppchen
var hvIndex = 0;          // aktuelles Hörverständnis-Item
var chat = document.getElementById('chat');
var input = document.getElementById('userInput');
var sendBtn = document.getElementById('sendBtn');
var INPUT_PH = input.getAttribute('placeholder') || '';

// ── Audio (Paket 2): audio.js liegt am Root als ES-Modul. Ein separates
// type=module-Script unten reicht speak/warm via window durch (das Haupt-Script
// ist klassisch wegen onclick="sendMessage()"). Der Browser-Fallback steckt schon
// in audio.js; greift der Import gar nicht, hält diese Mini-Notbremse den Knopf
// trotzdem hörbar (nie stummer Knopf). ──
function speakText(text, zielsprache){
  if (window.spkSpeak) { try { return window.spkSpeak(text, zielsprache); } catch(e){} }
  try {
    var synth = window.speechSynthesis;
    if (synth && typeof SpeechSynthesisUtterance !== 'undefined'){
      var bcp = { de:'de-DE', es:'es-ES', en:'en-US', el:'el-GR' }[zielsprache] || 'en-US';
      var u = new SpeechSynthesisUtterance(String(text)); u.lang = bcp;
      synth.cancel(); synth.speak(u);
    }
  } catch(e){}
}
// Stimme still vorwärmen; sobald bereit, ist der nächste 🔊-Klick sofort hörbar (Teil B).
function warmVoice(zielsprache){
  if (!window.spkWarm) return;
  try {
    var p = window.spkWarm(zielsprache);
    if (p && typeof p.then === 'function') p.then(function(){ voiceReady = true; }, function(){});
  } catch(e){}
}
// 🔊-Knopf-Handler: ist die Stimme bereit → Puls; ist sie kalt → Spinner, bis DIESER
// Text spielt (nie ein alter — der Generations-Guard in audio.js verwirft Überholtes).
function playFrom(btn, text, cls){
  var loading = !voiceReady;
  if (btn){ btn.classList.add(loading ? 'loading' : cls); }
  var done = function(){
    voiceReady = true;                                   // ab jetzt ist die Stimme warm
    if (btn){ btn.classList.remove('loading'); btn.classList.remove(cls); }
  };
  var p = speakText(text, PROFILE.zielsprache);
  if (p && typeof p.then === 'function'){ p.then(done, done); }
  else { setTimeout(done, 1400); }
}

// ── leichte, sichere Darstellung (keine Asterisks im HTML stehen lassen) ──
function fmt(t){
  var s = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
  // _kursiv_ → <em>: Spikius Muttersprach-Brücke kommt mit Unterstrichen.
  // Nur paarweise an Wortgrenzen — Unterstrich MITTEN im Wort (el_perro,
  // datei_name) bleibt unberührt, wird nicht zu Kursiv zerschnitten.
  s = s.replace(/(^|[^\w])_(?=\S)([^_\n]*?\S)_(?!\w)/g,'$1<em>$2</em>');
  s = s.replace(/\n/g,'<br>');
  return s;
}
function escPlain(t){
  return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

// ── Übersetzungs-Brücke [[…]] (Feinschliff) ───────────────────────
// Spikiu schreibt zuerst die Zielsprache, dann EIN [[ Muttersprache ]] auf eigener
// Zeile (Struktur-Signal wie [WECHSEL]). Die Oberfläche splittet: Zielsprache → Blase
// (mit 🔊), [[…]] → gedämpftes Kästchen darunter (kein Audio). [[…]] NIE als Rohtext.
function splitBridge(text){
  var m = (text||'').match(/\[\[\s*([\s\S]*?)\s*\]\]/);
  var trans = m ? m[1].trim() : null;
  var ziel = (text||'').replace(/\[\[[\s\S]*?\]\]/g, ' ').replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n').replace(/\n{3,}/g,'\n\n').trim();
  if (!ziel && trans){ ziel = trans; trans = null; }   // nie eine leere Blase
  return { ziel: ziel, trans: trans };
}
// ── EIN Gedanke pro Blase (Feinschliff II) ───────────────────────
// Spikiu trennt verschiedene Gedanken/Repliken mit einer Zeile, die NUR --- (oder —)
// enthält. Wir splitten daran in Segmente → jedes wird eine eigene Sprechblase (mit
// eigenem splitBridge/🔊/Übersetzungs-Kästchen). Das rohe --- wird NIE gezeigt.
// Reihenfolge: [WECHSEL] ist in turn() schon raus → hier ----Split → pro Segment [[…]].
function splitThoughts(text){
  var lines = (text||'').split('\n');
  var dashOnly = /^[ \t]*(?:-{3,}|—)[ \t]*$/;   // ganze Zeile nur Striche
  var segs = [], cur = [];
  for (var i=0;i<lines.length;i++){
    if (dashOnly.test(lines[i])){ segs.push(cur.join('\n')); cur = []; }
    else cur.push(lines[i]);
  }
  segs.push(cur.join('\n'));
  return segs.map(function(s){ return s.trim(); }).filter(function(s){ return s.length; });
}
// Klartext für die Stimme: Emphasis-Marker raus (🔊 spricht keine Unterstriche/Sterne)
function plainForSpeech(s){
  s = (s||'');
  s = s.replace(/\*\*([^*]+)\*\*/g,'$1');
  s = s.replace(/\*([^*\n]+)\*/g,'$1');
  s = s.replace(/(^|[^\w])_(?=\S)([^_\n]*?\S)_(?!\w)/g,'$1$2');
  return s.trim();
}

// ── Raumwechsel-Signal (Paket B) ─────────────────────────────────
// Spikiu öffnet die Tür, statt sie zu beschreiben: setzt am Antwort-Ende EIN
// [WECHSEL:zielraum]. Wir fangen es hier ab — NIE als Text zeigen — und rendern
// einen sanften Knopf. Kein Auto-Sprung: der Lerner drückt. Profil reist via
// localStorage (spikiu_user) automatisch in den Zielraum mit.
var WECHSEL_ZIELE = {
  schreibwerkstatt: { href:'schreibwerkstatt.html',  label:{ de:'Zur Schreibwerkstatt', es:'Al taller de escritura', en:'To the Writing Workshop' } },
  lesewerkstatt:    { href:'taller.html',             label:{ de:'Zur Lesewerkstatt',    es:'Al taller de lectura',   en:'To the Reading Workshop' } },
  buecher:          { href:'books.html',              label:{ de:'Zu meinen Büchern',    es:'A mis libros',           en:'To my Books' } },
  lektionen:        { href:'dashboard.html#lektionen', label:{ de:'Zu den Lektionen',    es:'A las lecciones',        en:'To the Lessons' } }
};
// Breit strippen, damit NIE ein Marker als Text leakt (auch ein vertippter Zielraum) —
// Knopf aber nur bei gültigem Ziel rendern.
var WECHSEL_RE = /\s*\[WECHSEL:\s*([a-zäöü]+)\s*\]\s*/i;
function extractWechsel(t){
  var m = (t||'').match(WECHSEL_RE);
  if(!m) return { text:t, ziel:null };
  var ziel = m[1].toLowerCase();
  var clean = (t||'').replace(WECHSEL_RE, ' ').trim();
  return { text:clean, ziel: WECHSEL_ZIELE[ziel] ? ziel : null };
}
function addDoorButton(ziel){
  var z = WECHSEL_ZIELE[ziel]; if(!z) return;
  var uiLang = (['de','es','en'].indexOf(PROFILE.muttersprache) > -1) ? PROFILE.muttersprache : 'de';
  var label = z.label[uiLang] || z.label.de;
  var row = document.createElement('div');
  row.className = 'door-row';
  row.innerHTML = '<button class="door-btn" type="button">→ ' + escPlain(label) + '</button>';
  row.querySelector('.door-btn').onclick = function(){ window.location.href = z.href; };
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

// SPK_ICON: dezentes Lautsprecher-Glyph für die Spikiu-Blase (gleich wie im Prototyp).
var SPK_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4.03v8.06A4.5 4.5 0 0016.5 12z"/></svg>';

// ── Szenenende: Korrektur-Karte + Menü (Paket 3) ──────────────────
// Spikiu hängt am Szenenende EIN [SZENENENDE]-Signal an (→ Menü) und, falls es
// kommunikativ unpassende Wendungen gab, davor einen [KORREKTUR]-Block. Beide werden
// hier abgefangen, NIE als Rohtext gezeigt; das WARUM kommt erst in der Lektion.
var korrekturen = [];   // gesammelte Paare der laufenden Szene (für die Lektion bei „Terminar")
var P3_UI = {
  de:{ kkEyebrow:'Für nächstes Mal', said:'Du hast gesagt', better:'Besser',
       mismo:'🔁 Gleiches Thema — weiter üben', otro:'🔀 Anderes Thema', terminar:'✓ Beenden → Lektion',
       mismoSeed:'Lass uns dasselbe Thema weiterüben.', toLesson:'→ Zur Lektion', lessonNote:'Deine Lektion wartet im Dashboard.' },
  es:{ kkEyebrow:'Para la próxima', said:'Dijiste', better:'Mejor',
       mismo:'🔁 Mismo tema — seguir', otro:'🔀 Otro tema', terminar:'✓ Terminar → Lección',
       mismoSeed:'Sigamos practicando el mismo tema.', toLesson:'→ A la lección', lessonNote:'Tu lección te espera en el panel.' },
  en:{ kkEyebrow:'For next time', said:'You said', better:'Better',
       mismo:'🔁 Same topic — keep going', otro:'🔀 Another topic', terminar:'✓ Finish → Lesson',
       mismoSeed:'Let’s keep practicing the same topic.', toLesson:'→ To the lesson', lessonNote:'Your lesson is waiting in the dashboard.' }
};
function p3(){ return P3_UI[uiLang()] || P3_UI.de; }

// [KORREKTUR]…[/KORREKTUR] → Paare {said, better}. Zeilen der Form „so gesagt -> besser".
function extractKorrektur(t){
  var m = (t||'').match(/\[KORREKTUR\]([\s\S]*?)\[\/KORREKTUR\]/i);
  if(!m) return { text:t, pairs:[] };
  var pairs = [];
  m[1].split('\n').forEach(function(line){
    var halves = line.split(/\s*(?:->|→|=>)\s*/);
    if(halves.length === 2 && halves[0].trim() && halves[1].trim()){
      pairs.push({ said: halves[0].trim(), better: halves[1].trim() });
    }
  });
  var clean = (t||'').replace(/\[KORREKTUR\][\s\S]*?\[\/KORREKTUR\]/i,' ')
    .replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n').replace(/\n{3,}/g,'\n\n').trim();
  return { text:clean, pairs:pairs.slice(0,3) };   // max 3 Paare
}
// [SZENENENDE] → Menü-Signal (breit strippen, nie als Text zeigen).
var SZENE_RE = /\s*\[SZENENENDE\]\s*/i;
function extractSceneEnd(t){
  if(!SZENE_RE.test(t||'')) return { text:t, ended:false };
  return { text:(t||'').replace(SZENE_RE,' ').trim(), ended:true };
}
// [OPTIONEN]…[/OPTIONEN] → 2–3 Lerner-Antworten (Zielsprache). Signal NIE roh zeigen;
// auch verirrte/halbe Tags werden gestrippt. Nur im geführten Modus gerendert.
function extractOptionen(t){
  t = t || '';
  var m = t.match(/\[OPTIONEN\]([\s\S]*?)\[\/OPTIONEN\]/i);
  var optionen = m ? m[1].split('\n')
    .map(function(l){ return l.replace(/\[\[[\s\S]*?\]\]/g,'').trim(); })   // ein evtl. [[…]] je Zeile raus
    .filter(function(l){ return l.length; })
    .slice(0, 3) : [];
  var clean = t.replace(/\[OPTIONEN\][\s\S]*?\[\/OPTIONEN\]/ig, ' ')
    .replace(/\[\/?OPTIONEN\]/ig, ' ')   // halbe/verirrte Tags nie roh zeigen
    .replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n').replace(/\n{3,}/g,'\n\n').trim();
  return { text: clean, optionen: optionen };
}

// Ja → Lektion DIREKT erzeugen (Generator + Schema unberührt), rolling-3 speichern,
// dann sanfte Auflösung → Dashboard. Speichern MUSS vor der Navigation passieren.
async function makeLessonAndLeave(){
  var offer = document.getElementById('lessonOffer'); if (offer) offer.remove();
  setExitVisible(false); freeExitBar.hidden = true;
  showLessonSpinner();
  var ui = endUI();
  var u = {};
  try { u = JSON.parse(localStorage.getItem('spikiu_user') || '{}'); } catch(e){ u = {}; }
  var d = null;
  try {
    var r = await fetch('/api/generate-lesson', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name:                u.name,
        nativeLang:          u.nativeLang,
        profile:             u.profile,
        conversationHistory: buildConvoForLesson()
      })
    });
    d = await r.json();
  } catch(e){ d = null; }
  hideLessonSpinner();
  if (!d || !d.lesson){
    addPlainSpikiu(ui.err);                 // ehrlich, keine Navigation, Beenden bleibt erreichbar
    updateFreeExit();
    return;
  }
  // Ergebnis-Lektion: id + createdAt + zielsprache (Letzteres fürs 🔊 im Poster).
  var entry = {
    id:              'lesson_' + Date.now(),
    topic:           (d.lesson.title) || 'Lektion',
    fromConversation: true,
    lesson:          d.lesson,
    createdAt:       new Date().toISOString(),
    zielsprache:     PROFILE.zielsprache
  };
  // Rolling-3: anhängen, nach createdAt absteigend behalten, max 3 (älteste fällt raus).
  var arr = Array.isArray(u.lessons) ? u.lessons.slice() : [];
  arr.push(entry);
  arr.sort(function(a, b){ return (b.createdAt || '').localeCompare(a.createdAt || ''); });
  arr = arr.slice(0, 3);
  u.lessons = arr;
  try { localStorage.setItem('spikiu_user', JSON.stringify(u)); } catch(e){}   // VOR der Navigation
  addPlainSpikiu(ui.byeMade);
  // Sanfte Auflösung (fade + leichtes blur) → Dashboard.
  var app = document.querySelector('.app');
  setTimeout(function(){ if (app) app.classList.add('dissolving'); }, 350);
  setTimeout(function(){ window.location.href = 'dashboard.html#lektionen'; }, 1050);
}

function addMessage(role, text){
  var msg = document.createElement('div');
  msg.className = 'message ' + role;

    // EIN Gedanke pro Blase: erst an --- splitten, dann pro Segment [[…]] trennen.

    var segments = splitThoughts(text);
    if (!segments.length) segments = [text || ''];
    var zielTexts = [], inner = '';
    segments.forEach(function(seg){
      var parts = splitBridge(seg);
      zielTexts.push(parts.ziel);
      inner += '<div class="bubble spikiu">' + fmt(parts.ziel)
        + '<button class="speak-btn" type="button" aria-label="Vorlesen">' + SPK_ICON + '</button></div>';

    msg.querySelectorAll('.speak-btn').forEach(function(sb, i){

    });

// ── Backend ──────────────────────────────────────────────────────
async function callGespraech(){
  // Verlauf glätten: nie zwei gleiche Rollen hintereinander (sonst lehnt Anthropic ab).
  function alternate(msgs){
    var out = [];
    for (var i=0;i<msgs.length;i++){
      if (out.length && out[out.length-1].role === msgs[i].role) out[out.length-1] = msgs[i];
      else out.push(msgs[i]);
    }
    return out;
  }
  // Body bombensicher: messages IMMER Array, profile IMMER vollständig.
  var safeProfile = {
    name:          (PROFILE && PROFILE.name) || '',
    muttersprache: (PROFILE && PROFILE.muttersprache) || 'de',
    zielsprache:   (PROFILE && PROFILE.zielsprache) || 'es',
    koennen:       (PROFILE && PROFILE.koennen) || 'anfang',
    fremde_schrift: !!(PROFILE && PROFILE.fremde_schrift)
  };
  var safeMessages = alternate(Array.isArray(verlauf) ? verlauf : []);
  var r = await fetch(ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: safeMessages, profile: safeProfile, maxTokens: 600 })
  });
  var d = await r.json();
  if (!r.ok) throw new Error('http ' + r.status);
  return d.text || '';
}

// EINE Runde abrufen: leere History → Opener, sonst Antwort auf den letzten User-Zug.
// (Bei Retry unverändert wiederholbar, weil der User-Zug schon in verlauf steht.)
async function turn(){
  if (busy) return;
  busy = true; sendBtn.disabled = true; lastTurnOk = false; showTyping();
  var reply;
  try {
    reply = await callGespraech();          // nur Netzwerk
  } catch(e){
    hideTyping(); showError('Netz: ' + ((e && e.message) || e));
    busy = false; sendBtn.disabled = input.value.trim() === ''; return;
  }
  hideTyping();
  try {
    // Signale in fester Reihenfolge abfangen, NIE als Rohtext zeigen:
    // [WECHSEL] → Tür · [KORREKTUR] → Karte (vor dem Menü) · [SZENENENDE] → Menü.
    var w = extractWechsel(reply);
    var k = extractKorrektur(w.text);
    var s = extractSceneEnd(k.text);
    var o = extractOptionen(s.text);                        // [OPTIONEN] → Antwort-Chips
    var shown = o.text;
    if (!shown && !k.pairs.length && !s.ended && !w.ziel && !o.optionen.length) shown = reply;  // malformed → roh statt leer
    if (shown){
      addMessage('spikiu', shown);                          // nur Anzeige (ohne Marker)
      verlauf.push({ role: 'assistant', content: shown });  // sauberer Verlauf (Marker raus, [[…]] bleibt)
    }
    lastTurnOk = true;                                      // Runde sauber → Opener darf die Gabelung zeigen
    if (k.pairs.length){ korrekturen = korrekturen.concat(k.pairs); renderKorrekturCard(k.pairs); }
    if (w.ziel) addDoorButton(w.ziel);                      // sanfter Knopf, kein Auto-Sprung
    if (s.ended) renderEndMenu();                           // drei Knöpfe nach der Karte
    else if (o.optionen.length) renderOptionen(o.optionen); // sonst: Antwort-Chips (nur geführt, in renderOptionen geprüft)
  } catch(e){
    showError('Anzeige: ' + ((e && e.message) || e));
  }
  busy = false;
  sendBtn.disabled = input.value.trim() === '';
  updateFreeExit();                 // freier „Gespräch beenden" ein-/ausblenden (Teil 32 #1)
  input.focus();
}

function sendMessage(){
  if (busy || guiding) return;
  var text = input.value.trim();
  if (!text) return;
  input.value = ''; input.style.height = 'auto'; sendBtn.disabled = true;
  sendUserTurn(text);               // wer frei tippt, hat die Wahl getroffen (schließt Gabelung/Palette)
}

// Paket 2: ein Thema startet NICHT mehr sofort das Rollenspiel, sondern erst die
// Vorbereitung (Häppchen). Der bestehende P1-Seed-Zug folgt unverändert danach.
function pickTopic(label){
  if (busy || guiding) return;
  setOpenerChrome(false);                // Gespräch beginnt → Schreibfeld + Profil-Chip wieder ein (geführt: sichtbar, aber gesperrt)
  removeGabelung();
  removeOpenerGreeting();                // Voz primero: Präsenz-Gruß weg, Gespräch beginnt
  removeEndMenu();                       // falls ein altes Menü noch offen war
  removeOptionen();
  korrekturen = [];                      // neue Szene → frische Korrektur-Sammlung
  sessionGezaehlt = false;               // Teil 36: neuer Gesprächsbogen → Blatt-Zähler zurück
  gefuehrt = true;                       // geführtes Thema-Rollenspiel → Antwort-Chips erlaubt
  TOPIC_LABEL = label;
  addMessage('user', label);             // die Wahl als User-Bubble (wie P1, nur ohne Seed-Floskel)
  showRail(); setStage('wortschatz');
  loadHaeppchen();
}

}

// ── Häppchen (Paket 2) — Vorbereitung VOR dem Rollenspiel ─────────
// Thema gewählt → Stimme vorwärmen → /api/haeppchen → Wortschatz-Widget →
// Hörverständnis-Widget(s) → kurze Übergabe → bestehender P1-Seed-Zug → Rollenspiel.
// Inline im Chat (Muster [WECHSEL]/Lesebegleiter), KEINE Vollbild-Slides.
var HAP = null;
var SPEAKER_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4.03v8.06A4.5 4.5 0 0016.5 12z"/></svg>';
var PLAY_SVG    = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>';
var HAP_UI = {
  de:{ loading:'Spikiu bereitet die Häppchen vor…', vocab:'Wortschatz mit Audio', listen:'Hörverständnis', weiterVocab:'Verstanden — weiter', weiter:'Weiter', correct:'Richtig!', wrong:'Knapp — die grüne war es.', handover:'Stark. Jetzt üben wir das im Gespräch.', skip:'Wir steigen direkt ins Gespräch ein.', locked:'Erst die Häppchen…', listenHint:'Was hörst du?', wordspot:'Wörter tippen', wordHint:'Welche Wörter hörst du? Tippe sie an.', check:'Prüfen', wordPerfect:'Perfekt — gutes Ohr!', wordClose:'Fast — grün = richtig, gestrichelt = verpasst.' },
  es:{ loading:'Spikiu prepara los bocados…', vocab:'Vocabulario con audio', listen:'Comprensión auditiva', weiterVocab:'Entendido — seguir', weiter:'Seguir', correct:'¡Correcto!', wrong:'Casi — era la verde.', handover:'¡Genial! Ahora lo practicamos hablando.', skip:'Entramos directo en la conversación.', locked:'Primero los bocados…', listenHint:'¿Qué oyes?', wordspot:'Toca las palabras', wordHint:'¿Qué palabras oyes? Tócalas.', check:'Comprobar', wordPerfect:'¡Perfecto, buen oído!', wordClose:'Casi — verde = correcto, punteado = te faltó.' },
  en:{ loading:'Spikiu is preparing the snacks…', vocab:'Vocabulary with audio', listen:'Listening', weiterVocab:'Got it — continue', weiter:'Continue', correct:'Correct!', wrong:'Close — the green one.', handover:'Great. Now let’s practice it in conversation.', skip:'Let’s jump straight into the conversation.', locked:'First the snacks…', listenHint:'What do you hear?', wordspot:'Tap the words', wordHint:'Which words do you hear? Tap them.', check:'Check', wordPerfect:'Perfect — good ear!', wordClose:'Close — green = right, dashed = missed.' }
};
var RAIL_LBL = {
  de:['Thema','Wörter','Hören','Sprechen','Lektion'],
  es:['Tema','Palabras','Escucha','Hablar','Lección'],
  en:['Topic','Words','Listening','Speaking','Lesson']
};

function fillRail(){
  var lbls = RAIL_LBL[uiLang()] || RAIL_LBL.de;
  document.querySelectorAll('#rail .rail-step').forEach(function(el, i){
    var s = el.querySelector('.rail-lbl'); if (s) s.textContent = lbls[i] || '';
  });
}
function showRail(){ var r = document.getElementById('rail'); if (r){ fillRail(); r.classList.remove('hidden'); } }
function setStage(stage){
  var order = ['thema','wortschatz','hoeren','sprechen','lektion'];
  var idx = order.indexOf(stage);
  document.querySelectorAll('#rail .rail-step').forEach(function(el){
    var i = order.indexOf(el.getAttribute('data-stage'));
    el.classList.remove('active','done');
    if (i >= 0 && i < idx) el.classList.add('done');     // erledigt (gold)
    else if (i === idx) el.classList.add('active');       // aktiv (grün)
    // 'lektion' wird nie erreicht → bleibt blass (= Paket 3)
  });
}

function addNote(text){
  var d = document.createElement('div'); d.className = 'scene-note';
  d.textContent = text; chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}
function lockComposer(lock){
  guiding = lock;
  if (lock){ input.disabled = true; sendBtn.disabled = true; input.placeholder = HAP_UI[uiLang()].locked; }
  else { input.disabled = false; input.placeholder = INPUT_PH; sendBtn.disabled = input.value.trim() === ''; }
}
function addFlowButton(label, fn){
  var row = document.createElement('div'); row.className = 'flow-row';
  row.innerHTML = '<button class="flow-btn" type="button"></button>';
  var b = row.querySelector('.flow-btn');
  b.textContent = label;
  b.onclick = function(){ row.remove(); fn(); };
  chat.appendChild(row); chat.scrollTop = chat.scrollHeight;
}

function showHapSpinner(){
  var d = document.createElement('div'); d.className = 'message spikiu'; d.id = 'hapSpin';
  d.innerHTML = '<div class="avatar-spikiu">' + CAPY_SMALL + '</div>'
    + '<div style="flex:1;min-width:0;"><div class="bubble spikiu" style="display:inline-flex;align-items:center;gap:0.55rem;">'
    + '<span class="hap-spin"></span>' + escPlain(HAP_UI[uiLang()].loading) + '</div></div>';
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}
function hideHapSpinner(){ var s = document.getElementById('hapSpin'); if (s) s.remove(); }

async function loadHaeppchen(){
  lockComposer(true);
  warmVoice(PROFILE.zielsprache);     // Stimme still im Hintergrund vorwärmen
  showHapSpinner();
  var data = null;
  try {
    var r = await fetch('/api/haeppchen', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        thema:          TOPIC_LABEL,
        zielsprache:    PROFILE.zielsprache,
        muttersprache:  PROFILE.muttersprache,
        koennen:        PROFILE.koennen,
        fremde_schrift: !!PROFILE.fremde_schrift
      })
    });
    data = await r.json();
  } catch(e){ data = null; }
  hideHapSpinner();
  // Robust: ohne brauchbaren Wortschatz NICHT hängen bleiben — direkt ins Rollenspiel
  // (der P1-Pfad funktioniert allein; die Häppchen sind ein Plus, kein Muss).
  if (!data || !Array.isArray(data.wortschatz) || !data.wortschatz.length){
    addNote(HAP_UI[uiLang()].skip);
    startSeedTurn();
    return;
  }
  HAP = data;
  renderWortschatz();
}

function renderWortschatz(){
  var ui = uiLang();
  var w = document.createElement('div'); w.className = 'widget';
  var html = '<div class="w-eyebrow">🎧 ' + escPlain(HAP_UI[ui].vocab) + '</div>';
  HAP.wortschatz.forEach(function(h){
    var phon  = h.lautschrift  ? '<div class="hap-phon">' + escPlain(h.lautschrift) + '</div>' : '';
    var trans = h.uebersetzung ? '<div class="hap-trans">' + escPlain(h.uebersetzung) + '</div>' : '';
    html += '<div class="hap-card">'
      + '<button class="hap-play" type="button">' + PLAY_SVG + '</button>'
      + '<div class="hap-text"><div class="hap-ziel">' + escPlain(h.ziel) + '</div>' + phon + trans + '</div></div>';
  });
  w.innerHTML = html;
  chat.appendChild(w);
  w.querySelectorAll('.hap-card').forEach(function(card, i){
    var btn = card.querySelector('.hap-play');
    btn.onclick = function(){ playFrom(btn, HAP.wortschatz[i].ziel, 'playing'); };
  });
  chat.scrollTop = chat.scrollHeight;
  addFlowButton(HAP_UI[ui].weiterVocab, startHoeren);
}

// Fisher-Yates — mischt eine Kopie (für die Antwort-Position + Wort-Chips).
function shuffle(a){
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function startHoeren(){ setStage('hoeren'); hvIndex = 0; renderHV(); }
// Dispatcher: zwei Übungstypen. typ „woerter" → Wörter-Tippen, sonst Minimalpaar A/B.
function renderHV(){
  var item = HAP.hoerverstehen[hvIndex];
  if (item && item.typ === 'woerter' && Array.isArray(item.woerter) && item.woerter.length){
    renderWortsuche(item);
  } else {
    renderMinimalpaar(item);
  }
}
function hvHead(ui, suffix){
  return '<div class="w-eyebrow">🎧 ' + escPlain(HAP_UI[ui].listen) + ' · ' + (hvIndex+1)
    + ' / ' + HAP.hoerverstehen.length + (suffix ? ' · ' + escPlain(suffix) : '') + '</div>';
}

// ── Typ A: Minimalpaar A/B — richtige Option ZUFÄLLIG platziert (Übungs-Varianten ①) ──
function renderMinimalpaar(item){
  var ui = uiLang();
  var opts = shuffle((item.optionen || []).slice());   // nicht mehr immer die erste
  var w = document.createElement('div'); w.className = 'widget';   // KEINE id (mehrere Items im DOM)
  var html = hvHead(ui)
    + '<button class="hv-speaker" type="button">' + SPEAKER_SVG + '</button>'
    + '<div class="hv-q">' + escPlain(item.frage || HAP_UI[ui].listenHint) + '</div>';
  opts.forEach(function(o, i){
    var key = String.fromCharCode(65 + i);   // A, B
    html += '<button class="hv-opt" data-i="' + i + '" type="button">'
      + '<span class="hv-key">' + key + '</span>'
      + '<span class="hv-opt-text">' + escPlain(o.text) + '</span>'
      + '<span class="hv-mark">' + (o.richtig ? '✓' : '✗') + '</span></button>';
  });
  html += '<div class="hv-feedback"></div>';
  w.innerHTML = html;
  chat.appendChild(w);
  var spk = w.querySelector('.hv-speaker');
  spk.onclick = function(){ playFrom(spk, item.audio, 'playing'); };
  // Referenzen über die Closure (w, opts) — NIE über getElementById (gleiche Klassen mehrfach im DOM).
  w.querySelectorAll('.hv-opt').forEach(function(b){
    b.onclick = function(){ answerMinimalpaar(w, opts, +b.getAttribute('data-i')); };
  });
  chat.scrollTop = chat.scrollHeight;
  setTimeout(function(){ playFrom(spk, item.audio, 'playing'); }, 450);   // einmal anspielen
}
function answerMinimalpaar(w, opts, oi){
  var ui = uiLang();
  var picked = opts[oi];
  w.querySelectorAll('.hv-opt').forEach(function(b, i){
    b.disabled = true;
    if (opts[i].richtig) b.classList.add('correct');   // richtige immer grün enthüllen
  });
  var fb = w.querySelector('.hv-feedback');
  if (picked && picked.richtig){ fb.textContent = HAP_UI[ui].correct; fb.style.color = 'var(--accent)'; }
  else {
    var wb = w.querySelector('.hv-opt[data-i="' + oi + '"]'); if (wb) wb.classList.add('wrong');
    fb.textContent = HAP_UI[ui].wrong; fb.style.color = 'var(--wrong)';
  }
  addFlowButton(HAP_UI[ui].weiter, nextHV);
}

// ── Typ B: Wörter-Tippen — markiere die gehörten Wörter (Übungs-Varianten ①) ──
function renderWortsuche(item){
  var ui = uiLang();
  var words = shuffle((item.woerter || []).slice());
  var w = document.createElement('div'); w.className = 'widget';
  w.innerHTML = hvHead(ui, HAP_UI[ui].wordspot)
    + '<button class="hv-speaker" type="button">' + SPEAKER_SVG + '</button>'
    + '<div class="hv-q">' + escPlain(item.frage || HAP_UI[ui].wordHint) + '</div>'
    + '<div class="ws-words"></div><div class="hv-feedback"></div>';
  chat.appendChild(w);
  var box = w.querySelector('.ws-words');
  words.forEach(function(o){
    var b = document.createElement('button'); b.type = 'button'; b.className = 'ws-word';
    b.textContent = o.text;
    b._gehoert = !!o.gehoert;   // Wahrheit über die Closure, nie im DOM
    b.onclick = function(){ if (!b.classList.contains('locked')) b.classList.toggle('sel'); };
    box.appendChild(b);
  });
  var spk = w.querySelector('.hv-speaker');
  spk.onclick = function(){ playFrom(spk, item.audio, 'playing'); };
  chat.scrollTop = chat.scrollHeight;
  setTimeout(function(){ playFrom(spk, item.audio, 'playing'); }, 450);
  addFlowButton(HAP_UI[ui].check, function(){ checkWortsuche(w); });
}
function checkWortsuche(w){
  var ui = uiLang();
  var allOk = true;
  w.querySelectorAll('.ws-word').forEach(function(b){
    var ok = b._gehoert, sel = b.classList.contains('sel');
    b.classList.remove('sel'); b.classList.add('locked');
    if (ok && sel) b.classList.add('ok');
    else if (!ok && sel){ b.classList.add('bad'); allOk = false; }     // Distraktor gewählt
    else if (ok && !sel){ b.classList.add('missed'); allOk = false; }  // gehörtes Wort verpasst
  });
  var fb = w.querySelector('.hv-feedback');
  fb.textContent = allOk ? HAP_UI[ui].wordPerfect : HAP_UI[ui].wordClose;
  fb.style.color = allOk ? 'var(--accent)' : 'var(--gold)';
  addFlowButton(HAP_UI[ui].weiter, nextHV);
}
function nextHV(){
  hvIndex++;
  if (hvIndex < HAP.hoerverstehen.length){ renderHV(); }
  else { handover(); }
}
function handover(){
  setStage('sprechen');
  addNote(HAP_UI[uiLang()].handover);
  startSeedTurn();
}
// Der BESTEHENDE P1-Seed-Zug: schickt „Ich möchte das Thema … üben" an /api/gespraech
// → Themen-Entrada → Rollenspiel. Unverändert, nur jetzt NACH den Häppchen. Das Thema
// ist oben schon als User-Bubble zu sehen, darum hier kein zweites sichtbares Echo.
function startSeedTurn(){
  lockComposer(false);
  setExitVisible(true);              // Rollenspiel beginnt → Ausstieg dauerhaft erreichbar
  var seed = GAB[uiLang()].seed(TOPIC_LABEL);
  verlauf.push({ role: 'user', content: seed });
  turn();
}

// Opener (Teil 35): ruhige Wahl-Seite — NUR „Wähle eine Aktivität" + die Gabelung.
// KEIN Begrüßungs-Bubble (kein Doppel-Gruß / zweiter Capy), kein Profil-Chip, kein
// Schreibfeld. Das Gespräch (und damit der erste turn()) beginnt erst nach der Wahl.
function setOpenerChrome(hidden){
  var pb = document.getElementById('profileBar');
  var ia = document.querySelector('.input-area');
  if (pb) pb.style.display = hidden ? 'none' : '';
  if (ia) ia.style.display = hidden ? 'none' : '';
}
// ── Voz primero (Paket 5): Präsenz-Gruß beim Eintritt ─────────────
// Spikiu LÄDT EIN (sanfter Puls + Hinweis) — KEIN Auto-Play. Erst der Tipp (Geste)
// spielt seine Stimme + schaltet den Capy in den Sprech-Zustand (Mund + Aura aus
// capy-vivo.js), danach wieder Ruhe. Gruß in der Zielsprache (HÖREN = lebendig);
// der Hinweis in der Muttersprache. Stimme ist beim Eintritt schon vorgewärmt (__spkBoot).
var VOZ_GREET = {
  es: function(n){ return '¡Hola' + (n ? ', ' + n : '') + '! Me alegro de verte.'; },
  de: function(n){ return 'Hallo' + (n ? ', ' + n : '') + '! Schön, dich zu sehen.'; },
  en: function(n){ return 'Hi' + (n ? ', ' + n : '') + '! Good to see you.'; },
  el: function(n){ return 'Γεια σου' + (n ? ', ' + n : '') + '! Χαίρομαι που σε βλέπω.'; }
};
var VOZ_HINT = { de:'tippen, um Spikiu zu hören', es:'toca para oír a Spikiu', en:'tap to hear Spikiu' };
// Phase 1 (Teil 43): einladende Frage in der ZIELSPRACHE (wie der Gruß — „Man betritt sie").
// Nur Präsentation; was Spikiu SPRICHT (VOZ_GREET) bleibt unverändert.
var VOZ_INVITE = {
  es: { q:'¿Qué te apetece hoy?',         sub:'¡Tú eliges!' },
  de: { q:'Worauf hast du heute Lust?',   sub:'Du entscheidest!' },
  en: { q:'What do you feel like today?', sub:'You choose!' },
  el: { q:'Τι σου κάνει κέφι σήμερα;',     sub:'Εσύ διαλέγεις!' }
};

function removeOpenerGreeting(){ var g = document.getElementById('vozGreet'); if (g) g.remove(); vozHandle = null; }

// capy-vivo.js ist deferred → beim ERSTEN startOpener evtl. noch nicht da. Dann bindet
// der DOMContentLoaded-Hook nach. Idempotent (spkCapyAlive ist je SVG einmalig).
function bindVozCapy(){
  var svg = document.querySelector('#vozGreet .voz-capy');
  if (!svg || !window.spkCapyAlive) return;
  vozHandle = window.spkCapyAlive(svg, { tapTarget: document.getElementById('vozGreet') });
}

function speakOpenerGreeting(box){
  var lang = PROFILE.zielsprache;
  var txt  = (VOZ_GREET[lang] || VOZ_GREET.es)(PROFILE.name || '');
  box.classList.add('spoke');                   // Hinweis/Puls verschwindet, sobald gehört
  if (vozHandle) vozHandle.speak(true);         // Mund + Aura für die Dauer
  var done = function(){ if (vozHandle) vozHandle.speak(false); };   // danach wieder ruhig
  var p = speakText(txt, lang);                 // window.spkSpeak/Fallback (beide async)
  if (p && typeof p.then === 'function') p.then(done, done);
  else setTimeout(done, 2200);                  // klassischer Fallback: feste Dauer
}

function renderOpenerGreeting(){
  if (document.getElementById('vozGreet')) return;
  var ui   = uiLang();
  var lang = PROFILE.zielsprache;
  var greet = (VOZ_GREET[lang] || VOZ_GREET.es)(PROFILE.name || '');
  var inv  = VOZ_INVITE[lang] || VOZ_INVITE.es;
  var box = document.createElement('div');
  box.className = 'voz-greet'; box.id = 'vozGreet';
  box.innerHTML = CAPY_OPENER
    + '<div class="voz-greet-line">' + escPlain(greet) + '</div>'
    + '<div class="voz-invite">' + escPlain(inv.q) + ' <span class="voz-invite-sub">' + escPlain(inv.sub) + '</span></div>'
    + '<div class="voz-hint">' + escPlain(VOZ_HINT[ui] || VOZ_HINT.de) + '</div>';
  chat.appendChild(box);
  chat.scrollTop = chat.scrollHeight;
  box.addEventListener('click', function(){ speakOpenerGreeting(box); });   // die GESTE
  bindVozCapy();
}

function startOpener(){
  sessionGezaehlt = false;      // Teil 36: frischer Eintritt → Blatt-Zähler zurück
  setOpenerChrome(true);        // Profil-Chip + Schreibfeld aus, solange die Gabelung steht
  renderOpenerGreeting();       // Voz primero: Präsenz-Gruß (lädt ein, KEIN Auto-Play)
  showGabelung();
}

// ── Eingabe ──────────────────────────────────────────────────────
input.addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 130) + 'px';
  sendBtn.disabled = busy || guiding || this.value.trim() === '';
});
input.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); if (this.value.trim()) sendMessage(); }
});

// ── Ausstiegs-Leiste (Teil 31 #1): dauerhaft erreichbar im geführten Rollenspiel ──
// ⋯ über dem Eingabefeld öffnet dieselben Optionen wie das End-Menü (Anderes Thema /
// Beenden → Lektion) — kein neues System, dieselben Handler otroTema/terminar.
var EXIT_UI = { de:'⋯ Optionen', es:'⋯ Opciones', en:'⋯ Options' };
var exitBar = document.getElementById('exitBar');
var exitMenu = document.getElementById('exitMenu');
var exitToggle = document.getElementById('exitToggle');
function setExitVisible(show){
  if (show){
    var ui = uiLang();
    exitToggle.textContent = EXIT_UI[ui] || EXIT_UI.de;
    document.getElementById('exitOtro').textContent = p3().otro;
    document.getElementById('exitTerminar').textContent = p3().terminar;
    exitBar.hidden = false;
  } else {
    exitMenu.hidden = true;
    exitBar.hidden = true;
  }
}
exitToggle.onclick = function(){ exitMenu.hidden = !exitMenu.hidden; };
document.getElementById('exitOtro').onclick = function(){ exitMenu.hidden = true; otroTema(); };       // otroTema blendet die Leiste selbst aus
document.getElementById('exitTerminar').onclick = function(){ exitMenu.hidden = true; terminar(); };   // → Lektion-Angebot (Teil 32)

// Freier-Flur-Ausstieg (Teil 32 #1): „Gespräch beenden" → Lektion-Angebot.
var freeExitBar = document.getElementById('freeExitBar');
var freeExitBtn = document.getElementById('freeExitBtn');
freeExitBtn.onclick = offerLesson;

// Teil B: Stimme schon beim RAUM-EINTRITT vorwärmen (nicht erst bei der Themenwahl).
// Das Modul-Script unten setzt window.spkWarm erst NACH diesem klassischen Script —
// darum als Hook, den das Modul aufruft, sobald die Audio-API da ist (idempotent).
window.__spkBoot = function(){ warmVoice(PROFILE.zielsprache); };

// ── Einstieg: kein Welcome-Screen, kein Onboarding. Direkt rein. ──
fillProfileBar();
startOpener();   // verlauf leer → Backend [EINSTIEG] → Opener-Gruß, danach die Gabelung
// capy-vivo.js ist deferred → beim startOpener oben evtl. noch nicht geladen.
// Hier nachbinden, sobald die Helfer da sind (Sprech-/Blinzel-Zustand des Gruß-Capy).
document.addEventListener('DOMContentLoaded', bindVozCapy);
</script>
<!-- Audio (Paket 2): audio.js ist ein ES-Modul am Root. Hier importiert, via window
     an das klassische Haupt-Script durchgereicht (das bleibt klassisch wegen
     onclick="sendMessage()"). Browser-Fallback steckt schon in audio.js. -->
<script type="module">
  import { speak, warm } from '/audio.js';
  window.spkSpeak = speak;
  window.spkWarm  = warm;
  if (window.__spkBoot) window.__spkBoot();   // Teil B: früh vorwärmen, sobald die Audio-API bereit ist
</script>
<!-- Voz primero (Paket 5): capy-vivo.js liefert den Sprech-Zustand (Mund + Aura) +
     Blinzeln/Blick für den Präsenz-Gruß. Idempotent (IIFE-Guard), nav.js lädt es ohnehin. -->
<script src="capy-vivo.js" defer></script>
<script src="nav.js" defer></script>
</body>
</html>
