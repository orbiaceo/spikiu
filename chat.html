<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Spikiu</title>
<link rel="stylesheet" href="/fonts/spikiu-fonts.css">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --white:#ffffff; --bg:#eef7f1; --bg2:#ffffff; --ink:#15163a; --mid:#5f7068; --ow:2.5px;
  --bubS:#fff; --you:#ffd24a; --youtx:#15163a; --spk:#1f93b0; --shb:3px 4px; --shs:3px 3px; --de:#f1faf5; --sky:#d3eef6;
  --faint:#dfe6e0; --warm:#cddcd3; --accent:#1f93b0; --accent2:#e8f5ee; --capy:#a97c50;
  --accent3:#1f93b0; --gold:#15163a; --wrong:#c67a1e; --wrong-bg:#fbf0e0;
  /* Übersetzungs-Kästchen (Feinschliff): gedämpfte Muleta, sekundär (Stil = Prototyp) */
  --trans-bg:#f1eee8; --trans-ink:#8a847d; --trans-border:#e2ddd4;
  /* Korrektur-Karte „Du hast gesagt" (P3, Stil = prototyp-feinschliff-iii.html) */
  --said-bg:#f6efe2; --said-ink:#8a6d2e; --said-border:#e6d8bb;
}
html, body { height:100%; background:var(--bg); color:var(--ink); font-family:'DM Sans',sans-serif; -webkit-font-smoothing:antialiased; }
.app { display:flex; flex-direction:column; height:calc(100dvh - var(--spk-navh, 0px)); max-width:680px; margin:0 auto; background:var(--bg); }
header { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.25rem 0.875rem; border-bottom:var(--ow) solid var(--ink); background:var(--white); flex-shrink:0; }
  .rnav{ justify-content:flex-start; gap:.6rem; background:var(--bg); }
  .rnav .back{ width:36px; height:36px; border-radius:999px; border:2.5px solid var(--ink); background:#fff; font-size:1.2rem; line-height:1; box-shadow:2px 2px 0 var(--ink); cursor:pointer; flex:0 0 auto; }
  .rnav .back:active{ transform:translate(1px,1px); box-shadow:1px 1px 0 var(--ink); }
.header-left { display:flex; align-items:center; gap:0.65rem; }
.capy-icon { width:38px; height:38px; flex-shrink:0; }
.brand-name { font-family:'Cormorant Garamond',serif; font-size:1.2rem; font-weight:500; color:var(--ink); letter-spacing:-0.01em; }
.brand-name span { color:var(--accent); font-style:italic; }
.back-link { font-family:'DM Sans',sans-serif; font-size:0.8rem; color:var(--mid); text-decoration:none; }
.back-link:hover { color:var(--ink); }
/* Profil-Chip: sichtbarer Beweis, dass das Profil gelesen und Onboarding übersprungen wurde */
.profile-bar { display:none !important; }
.profile-bar .who { font-weight:600; color:var(--ink); }
.profile-bar .sep { color:var(--warm); }
.profile-bar .chip { background:var(--white); border:1px solid #cfe6da; border-radius:100px; padding:0.1rem 0.6rem; font-size:0.72rem; }
.chat { flex:1; overflow-y:auto; padding:1.5rem 1.25rem; display:flex; flex-direction:column; gap:1.25rem; scroll-behavior:smooth; }
.chat::-webkit-scrollbar { width:3px; }
.chat::-webkit-scrollbar-thumb { background:var(--warm); border-radius:10px; }
.message { display:flex; gap:0.75rem; animation:fadeUp 0.35s ease forwards; opacity:0; }
.message.user { flex-direction:row-reverse; }
@keyframes fadeUp { from { opacity:0; transform:translateY(6px);} to { opacity:1; transform:translateY(0);} }
.avatar-spikiu { background:var(--accent2); border-radius:50%; display:flex; align-items:center; justify-content:center; width:32px; height:32px; flex-shrink:0; margin-top:2px; }
.bubble { max-width:82%; padding:0.85rem 1.1rem; border-radius:1.2rem; font-size:1rem; line-height:1.65; }
.bubble.spikiu { background:var(--bubS); color:var(--ink); border:var(--ow) solid var(--ink); box-shadow:var(--shb) 0 var(--ink); border-radius:0.3rem 1.2rem 1.2rem 1.2rem; font-family:'Cormorant Garamond',serif; font-size:1.2rem; line-height:1.4; position:relative; padding-right:2.7rem; }
.bubble.user { background:var(--you); color:var(--youtx); border:2px solid var(--ink); box-shadow:2px 2px 0 var(--ink); border-radius:1.2rem 0.3rem 1.2rem 1.2rem; font:800 1rem/1.3 'DM Sans',sans-serif; }
/* Feinschliff II: Zielsprache IMMER aufrecht — auch wenn das Modell die fremde
   Wendung in _…_/*…* setzt, kippt die Blase nie ins Kursive. Kursiv bleibt allein
   dem Übersetzungs-Kästchen (.trans). Betonung trägt <strong>. */
.bubble.spikiu, .bubble.spikiu em { font-style:normal; }
/* Mehrere Gedanken (an --- gesplittet) = mehrere gestapelte Blasen: Luft zwischen den
   Gedanken, das Übersetzungs-Kästchen bleibt tight unter SEINER Blase (margin-top 0.4rem). */
.message.spikiu .bubble.spikiu:not(:first-child) { margin-top:0.7rem; }
/* 🔊 dezent in der Spikiu-Blase, nur auf dem Zielsprachen-Teil (Feinschliff). Fallback in audio.js. */
.speak-btn { position:absolute; top:0.6rem; right:0.55rem; width:28px; height:28px; border:none; cursor:pointer; background:var(--accent2); color:var(--accent); border-radius:50%; display:flex; align-items:center; justify-content:center; transition:0.16s; -webkit-tap-highlight-color:transparent; }
.speak-btn:hover { background:var(--accent); color:var(--white); }
.speak-btn.playing { animation:pulse 1s ease infinite; }
.speak-btn svg { width:14px; height:14px; }
/* Kalter 🔊-Klick (Stimme lädt noch): Spinner statt Lautsprecher, bis DIESER Text spielt (Teil B). */
.speak-btn.loading { background:var(--accent2); cursor:default; }
.speak-btn.loading svg { display:none; }
.speak-btn.loading::after { content:''; width:13px; height:13px; border:2px solid var(--warm); border-top-color:var(--accent); border-radius:50%; animation:spin 0.7s linear infinite; }
/* Gedämpftes Übersetzungs-Kästchen unter der Blase (Muttersprache, KEIN Audio) */
.trans { margin-top:0.4rem; align-self:flex-start; background:var(--trans-bg); border:1px solid var(--trans-border); border-radius:8px; padding:0.4rem 0.7rem; font-family:'DM Sans',sans-serif; font-style:italic; font-size:0.82rem; line-height:1.45; color:var(--trans-ink); max-width:82%; }
.bubble .retry-btn { margin-left:0.4rem; font-family:'DM Sans',sans-serif; font-size:0.82rem; font-weight:600; color:var(--accent); background:var(--white); border:1px solid #cfe6da; border-radius:100px; padding:0.2rem 0.7rem; cursor:pointer; }
.bubble .retry-btn:hover { background:var(--accent); color:var(--white); }
/* Tür-Knopf: Raumwechsel-Signal [WECHSEL:…] wird hier abgefangen → sanfter Knopf, kein Auto-Sprung */
.door-row { display:flex; padding-left:2.75rem; animation:fadeUp 0.35s ease forwards; opacity:0; }
.door-btn { display:inline-flex; align-items:center; gap:0.4rem; font-family:'DM Sans',sans-serif; font-size:0.9rem; font-weight:500; color:var(--accent); background:var(--accent2); border:1px solid #cfe6da; border-radius:100px; padding:0.55rem 1.1rem; cursor:pointer; transition:all 0.2s; -webkit-tap-highlight-color:transparent; }
.door-btn:hover { background:var(--accent); color:var(--white); border-color:var(--accent); }
.door-btn:active { transform:scale(0.97); }
/* Opener-Gabelung (Paket 1): nach dem [EINSTIEG]-Gruß — plaudern oder ein Thema.
   Chip-Stil aus prototyp-gespraech-gefuehrt.html. KEIN Fortschrittsbalken in P1. */
.gabelung { align-self:center; width:100%; max-width:30rem; display:flex; flex-direction:column; align-items:center; text-align:center; gap:0.6rem; padding:0.25rem 0.75rem 0.5rem; animation:fadeUp 0.35s ease forwards; opacity:0; }
.gab-label { font-size:0.78rem; color:var(--mid); font-weight:500; }
/* Opener-Überschrift (Teil 35): ruhige einzelne Zeile statt Gruß-Bubble. */
.gab-ask { font-family:'DM Sans',sans-serif; font-size:1.12rem; font-weight:800; color:var(--ink); margin:0 0 0.35rem; }
    .premgate{ text-align:center; display:flex; flex-direction:column; align-items:center; gap:.55rem; padding:2rem 1.2rem; }
    .pg-emoji{ font-size:2.6rem; }
    .pg-title{ font:800 1.35rem 'DM Sans',sans-serif; color:var(--ink); }
    .pg-sub{ font:500 .98rem/1.45 'DM Sans',sans-serif; color:var(--mid); max-width:26ch; }
    .pg-btn{ margin-top:.6rem; display:inline-block; background:var(--accent); color:#fff; font:800 1rem 'DM Sans',sans-serif; text-decoration:none; padding:.7rem 1.7rem; border-radius:100px; border:var(--ow) solid var(--ink); box-shadow:var(--shs) 0 var(--ink); }
    .pg-back{ background:#fff; color:var(--ink); font:700 .9rem 'DM Sans',sans-serif; border:2px solid var(--ink); border-radius:100px; padding:.5rem 1.3rem; box-shadow:2px 2px 0 var(--ink); cursor:pointer; }
.gab-chips { display:flex; flex-wrap:wrap; justify-content:center; gap:0.5rem; }
.chip { background:var(--white); border:2px solid var(--ink); color:var(--ink); padding:0.5rem 0.85rem; border-radius:100px; font-family:'DM Sans',sans-serif; font-size:0.85rem; font-weight:700; cursor:pointer; box-shadow:2px 2px 0 var(--ink); transition:transform .1s,box-shadow .1s; -webkit-tap-highlight-color:transparent; }
.chip:active{ transform:translate(2px,2px); box-shadow:0 0 0 var(--ink); }
.gab-stufe { font:800 0.66rem 'DM Sans',sans-serif; letter-spacing:0.06em; text-transform:uppercase; color:var(--mid); text-align:center; margin-bottom:0.35rem; opacity:0.75; }
.chip:hover { background:var(--accent); color:var(--white); }
.chip:active { transform:scale(0.97); }
.chip.full { background:var(--accent); color:var(--white); width:100%; padding:0.65rem; font-weight:600; }
.chip.full:hover { background:#1f93b0; }
.chip.ghost { border-style:dashed; border-color:var(--capy); color:var(--capy); }
.chip.ghost:hover { background:var(--capy); color:var(--white); }
.gab-input { display:flex; gap:0.45rem; }
.gab-input input { flex:1; background:var(--white); border:2px solid var(--ink); border-radius:100px; padding:0.55rem 0.95rem; font-family:'DM Sans',sans-serif; font-size:0.9rem; color:var(--ink); outline:none; }
.gab-input input:focus { border-color:var(--accent); background:var(--white); }
.gab-send { width:40px; flex-shrink:0; border:2px solid var(--ink); background:var(--accent); color:var(--white); border-radius:50%; box-shadow:2px 2px 0 var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; }
.gab-send svg { width:16px; height:16px; }
.typing-bubble { background:var(--bg2); border-radius:0.3rem 1.2rem 1.2rem 1.2rem; padding:0.9rem 1.1rem; display:flex; gap:5px; align-items:center; }
.typing-bubble span { width:7px; height:7px; background:var(--warm); border-radius:50%; animation:bounce 1.3s infinite; }
.typing-bubble span:nth-child(2){animation-delay:0.18s;} .typing-bubble span:nth-child(3){animation-delay:0.36s;}
@keyframes bounce { 0%,80%,100%{transform:translateY(0);background:var(--warm);} 40%{transform:translateY(-5px);background:var(--capy);} }
.input-area { flex-shrink:0; padding:0.875rem 1.25rem; border-top:1px solid var(--faint); background:var(--white); padding-bottom:calc(0.875rem + env(safe-area-inset-bottom)); }
.input-row { display:flex; gap:0.6rem; align-items:flex-end; }
textarea { flex:1; background:var(--bg2); border:1.5px solid transparent; border-radius:1.2rem; padding:0.75rem 1.1rem; font-family:'DM Sans',sans-serif; font-size:1rem; color:var(--ink); resize:none; outline:none; min-height:48px; max-height:130px; line-height:1.5; transition:border-color 0.2s,background 0.2s; }
textarea:focus { border-color:var(--accent); background:var(--white); }
textarea::placeholder { color:var(--mid); font-style:italic; }
.send-btn { width:46px; height:46px; background:var(--accent); border:none; border-radius:50%; color:var(--white); cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all 0.2s; -webkit-tap-highlight-color:transparent; }
.send-btn:hover { background:#1f93b0; transform:scale(1.05); }
.send-btn:active { transform:scale(0.95); }
.send-btn:disabled { opacity:0.35; cursor:not-allowed; transform:none; }
.send-btn svg { width:20px; height:20px; transform:translateX(1px); }
@media (max-width:480px){ header{padding:0.875rem 1rem 0.75rem;} .chat{padding:1.25rem 1rem;gap:1rem;} .input-area{padding:0.75rem 1rem;padding-bottom:calc(0.75rem + env(safe-area-inset-bottom));} .bubble{max-width:88%;} }
@media (min-width:680px){ body{background:var(--bg2);} .app{margin:1.5rem auto;height:calc(100dvh - 3rem - var(--spk-navh, 0px));border-radius:1.5rem;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.08);} }

/* ── Geführtes Gespräch · Fortschrittsbalken (Paket 2) ──
   Thema · Wörter · Hören · Sprechen · Lektion. Füllt bis Sprechen; Lektion bleibt
   blass (= Paket 3). Versteckt, bis ein Thema gewählt ist (der freie Flur bleibt rein). */
.rail { display:flex; gap:0.3rem; padding:0.6rem 1.25rem; background:var(--white); border-bottom:var(--ow) solid var(--ink); flex-shrink:0; }
.rail.hidden { display:none; }
.rail-step { flex:1; text-align:center; font-size:0.62rem; font-weight:800; letter-spacing:0.04em; text-transform:uppercase; color:var(--ink); opacity:.55; transition:0.3s; }
.rail-step .dot { display:block; height:3px; border-radius:100px; background:var(--faint); margin-bottom:0.3rem; transition:0.4s; }
.rail-step.active { color:var(--ink); opacity:1; }
.rail-step.active .dot { background:var(--accent); }
.rail-step.done { color:var(--ink); opacity:1; }
.rail-step.done .dot { background:var(--accent); }

/* ── Häppchen-Widgets (inline im Chat, Stil aus prototyp-gespraech-gefuehrt.html) ── */
.widget { align-self:stretch; background:var(--white); border:1px solid var(--faint); border-radius:16px; padding:0.85rem 0.8rem; margin-left:2.75rem; opacity:0; animation:fadeUp 0.45s ease forwards; box-shadow:0 6px 18px rgba(0,0,0,0.05); }
.w-eyebrow { font-size:0.6rem; font-weight:700; letter-spacing:0.13em; text-transform:uppercase; color:var(--muted,#5f7068); margin-bottom:0.65rem; display:flex; align-items:center; gap:0.35rem; }
.hap-card { display:flex; align-items:center; gap:0.65rem; border:var(--ow) solid var(--ink); border-radius:14px; box-shadow:2px 3px 0 var(--ink); padding:0.55rem 0.7rem; margin-bottom:0.6rem; }
.hap-card:last-child { margin-bottom:0; }
.hap-play { width:32px; height:32px; flex-shrink:0; border:2px solid var(--ink); cursor:pointer; background:var(--spk); color:#fff; border-radius:50%; box-shadow:2px 2px 0 var(--ink); display:flex; align-items:center; justify-content:center; transition:0.18s; -webkit-tap-highlight-color:transparent; }
.hap-play:hover { background:var(--accent3); transform:scale(1.06); }
.hap-play.playing { animation:pulse 1s ease infinite; }
@keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(45,106,79,0.4);} 50%{ box-shadow:0 0 0 7px rgba(45,106,79,0);} }
.hap-play svg { width:13px; height:13px; }
.hap-text { flex:1; text-align:left; min-width:0; }
.hap-ziel { font-family:'Cormorant Garamond',serif; font-weight:500; font-size:0.9rem; line-height:1.15; }
.hap-card-solo { border:none; padding:1.2rem 0.4rem; justify-content:center; }
.hap-card-solo .hap-ziel { font-size:1.4rem; line-height:1.3; }
.hap-card-solo .hap-trans { font-size:1rem; }
.hap-swipe-hint { text-align:center; color:#b0a89f; font-size:0.8rem; font-weight:600; margin-top:0.9rem; }
.hap-phon { font-size:0.66rem; color:var(--muted,#5f7068); font-weight:500; margin-top:0.08rem; }
.hap-trans { font-size:0.72rem; color:var(--mid); font-style:italic; margin-top:0.08rem; }
/* ── Teil 60: Wort-Häppchen als Flip-Karte (Vorderseite Ziel+🔊 · Rückseite Übersetzung) ── */
.hap-flip { perspective:1200px; cursor:pointer; width:100%; flex:1 1 auto; min-height:14rem; -webkit-tap-highlight-color:transparent; }
.hap-flip-inner { position:relative; width:100%; height:100%; transition:transform .5s cubic-bezier(.4,0,.2,1); transform-style:preserve-3d; }
.hap-flip.flipped .hap-flip-inner { transform:rotateY(180deg); }
.hap-face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1rem; border:none; box-shadow:none; background:transparent; padding:0.5rem; }
.hap-face.back { transform:rotateY(180deg); background:var(--accent2); border-color:#cfe5da; }
.hap-flip .hap-ziel { font-family:'Cormorant Garamond',serif; font-weight:500; font-size:1.4rem; line-height:1.3; text-align:center; }
.hap-flip .hap-phon { font-size:0.8rem; margin-top:0; }
.hap-tlabel { font-size:0.6rem; font-weight:700; letter-spacing:0.13em; text-transform:uppercase; color:var(--ink); }
.hap-back-trans { font-family:'Cormorant Garamond',serif; font-size:1.3rem; line-height:1.3; text-align:center; color:var(--ink); }
.hap-fliphint { font-size:0.72rem; color:var(--muted,#5f7068); font-weight:600; }
/* ── Reel-Häppchen: die .widget ist im Reel KEINE eigene Karte, sondern füllt die grosse Reel-Karte ── */
.reel-haeppchen .widget { border:none !important; box-shadow:none !important; background:transparent !important; margin:0 !important; padding:0 !important; width:100%; flex:1 1 auto; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1rem; animation:none; opacity:1; }
.reel-haeppchen .w-eyebrow { font-size:0.66rem; margin-bottom:0; justify-content:center; }
.reel-haeppchen .hap-flip { width:100%; flex:1 1 auto; min-height:8rem; }
.reel-haeppchen .hap-flip .hap-ziel { font-family:'Lora',serif !important; font-weight:600 !important; font-size:clamp(2.6rem,11vw,3.8rem) !important; line-height:1.15; color:var(--read,#2b2621); }
.reel-haeppchen .hap-back-trans { font-family:'Lora',serif !important; font-size:clamp(2.1rem,8.5vw,3rem) !important; line-height:1.2; }
.reel-haeppchen .hap-face.back { background:transparent; border:none; }
.reel-haeppchen .hap-play { width:56px; height:56px; }
.reel-haeppchen .hap-play svg { width:22px; height:22px; }
.reel-haeppchen .hap-fliphint, .reel-haeppchen .hap-tlabel { font-size:1.02rem !important; }
.reel-haeppchen .hap-phon { font-size:1.25rem !important; }
.reel-haeppchen .drill-say { font:700 .82rem 'DM Sans',sans-serif; color:var(--mid); text-transform:uppercase; letter-spacing:.05em; margin-bottom:.2rem; }
.reel-haeppchen .drill-done-emoji { font-size:3rem; }
.reel-haeppchen .drill-done-title { font:800 1.6rem 'DM Sans',sans-serif; color:var(--ink); margin-top:.4rem; }
.reel-haeppchen .drill-done-sub { font:500 1rem/1.4 'DM Sans',sans-serif; color:var(--mid); margin-top:.35rem; max-width:26ch; }
.reel-haeppchen .drill-view-btn { margin-top:.9rem; background:#fff !important; color:var(--ink) !important; border:var(--ow) solid var(--ink); box-shadow:var(--shs) 0 var(--ink); font-weight:800 !important; }
.reel-haeppchen .rp-line { display:flex; flex-direction:column; align-items:center; gap:.5rem; margin-bottom:.9rem; }
.reel-haeppchen .rp-ziel { font-family:'Lora',serif; font-weight:600; font-size:clamp(1.7rem,7vw,2.5rem); line-height:1.25; color:var(--read,#2b2621); }
.reel-haeppchen .rp-trans { font:500 1rem/1.35 'DM Sans',sans-serif; color:var(--mid); }
.reel-haeppchen .rp-tip { font:600 .9rem 'DM Sans',sans-serif; color:var(--mid); margin-bottom:.7rem; }
.reel-haeppchen .rp-opts { display:flex; flex-direction:column; gap:.6rem; width:100%; }
.reel-haeppchen .rp-opt { text-align:center; justify-content:center; }
.reel-haeppchen .w-eyebrow { font-size:0.74rem; }
/* HÖREN (hv) + LEKTION (kk) im Reel — genauso gross wie WÖRTER */
.reel-haeppchen .hv-q { font-family:'Lora',serif; font-weight:600; font-style:normal; font-size:clamp(1.7rem,6.5vw,2.4rem) !important; line-height:1.28; margin-bottom:1.1rem; color:var(--ink); }
.reel-haeppchen .hv-speaker { width:62px; height:62px; background:var(--spk); border:var(--ow) solid var(--ink); box-shadow:3px 3px 0 var(--ink); }
.reel-haeppchen .hv-speaker svg { width:26px; height:26px; }
.reel-haeppchen .hv-opt { font-size:clamp(1.35rem,5.2vw,1.7rem) !important; font-weight:600; padding:0.85rem 1rem; border:2px solid var(--ink); border-radius:14px; color:var(--ink); }
.reel-haeppchen .hv-feedback { font-size:1.05rem !important; }
.reel-haeppchen .kk-eyebrow { font-size:0.8rem !important; }
.reel-haeppchen .kk-cell { font-family:'Lora',serif; font-size:clamp(1.3rem,5.2vw,1.95rem) !important; line-height:1.28; padding:0.75rem 0.85rem; }
.hv-speaker { display:flex; margin:0.2rem auto 0.7rem; width:56px; height:56px; background:var(--accent); border:none; border-radius:50%; cursor:pointer; align-items:center; justify-content:center; color:var(--white); box-shadow:0 6px 18px rgba(45,106,79,0.3); transition:0.18s; -webkit-tap-highlight-color:transparent; }
.hv-speaker:hover { transform:scale(1.05); }
.hv-speaker.playing { animation:pulse 1.1s ease infinite; }
.hv-speaker svg { width:24px; height:24px; }
.hv-q { text-align:center; font-family:'Cormorant Garamond',serif; font-style:italic; font-size:0.9rem; margin-bottom:0.65rem; }
.hv-opt { display:flex; align-items:center; gap:0.55rem; width:100%; background:var(--white); border:1.5px solid var(--faint); cursor:pointer; padding:0.6rem 0.7rem; border-radius:12px; margin-bottom:0.4rem; transition:0.3s; font-family:inherit; font-size:0.84rem; text-align:left; color:var(--ink); -webkit-tap-highlight-color:transparent; }
.hv-opt:last-of-type { margin-bottom:0; }
.hv-opt:hover:not(:disabled) { border-color:var(--accent); }
.hv-opt:disabled { cursor:default; }
.hv-key { width:22px; height:22px; flex-shrink:0; border-radius:50%; background:var(--bg2); color:var(--mid); font-weight:700; font-size:0.7rem; display:flex; align-items:center; justify-content:center; }
.hv-opt-text { flex:1; }
.hv-mark { font-weight:700; font-size:1rem; opacity:0; transition:0.3s; }
.hv-opt.correct { background:var(--accent2); border-color:var(--accent); color:var(--accent3); font-weight:600; }
.hv-opt.correct .hv-key { background:var(--accent); color:var(--white); }
.hv-opt.correct .hv-mark { opacity:1; color:var(--accent); }
.hv-opt.wrong { background:var(--wrong-bg); border-color:var(--wrong); color:var(--wrong); }
.hv-opt.wrong .hv-key { background:var(--wrong); color:var(--white); }
.hv-opt.wrong .hv-mark { opacity:1; color:var(--wrong); }
.hv-feedback { text-align:center; font-size:0.74rem; margin-top:0.55rem; min-height:1em; font-weight:600; }
/* ── Word-Spotting (Übungs-Varianten): gehörte Wörter antippen, Distraktoren als
   Minimalpaar. Stil aus prototyp-feinschliff-iii.html. ── */
.ws-words { display:flex; flex-wrap:wrap; gap:0.4rem; justify-content:center; }
.ws-word { background:var(--white); border:2px solid var(--ink); border-radius:100px; box-shadow:2px 2px 0 var(--ink); padding:0.45rem 0.85rem; font-family:'Cormorant Garamond',serif; font-size:0.85rem; font-weight:600; color:var(--ink); cursor:pointer; transition:0.14s; -webkit-tap-highlight-color:transparent; }
.ws-word.sel { background:var(--accent); color:var(--white); border-color:var(--accent); }
.ws-word.ok { background:var(--accent2); border-color:var(--accent); color:var(--accent3); }
.ws-word.bad { background:var(--wrong-bg); border-color:var(--wrong); color:var(--wrong); text-decoration:line-through; }
.ws-word.missed { border-color:var(--accent); border-style:dashed; color:var(--accent); }
.ws-word.locked { cursor:default; }
/* Inline-Steuerknopf (Weiter) im Chat-Strom */
.flow-row { display:flex; padding-left:2.75rem; animation:fadeUp 0.35s ease forwards; opacity:0; }
.flow-btn { background:var(--accent); color:var(--white); border:none; cursor:pointer; padding:0.6rem 1.2rem; border-radius:100px; font-family:'DM Sans',sans-serif; font-size:0.88rem; font-weight:600; transition:0.18s; -webkit-tap-highlight-color:transparent; }
.flow-btn:hover { background:var(--accent3); }
.flow-btn:active { transform:scale(0.97); }
/* Lade-Spinner (lokalisiert) */
.hap-spin { width:16px; height:16px; flex-shrink:0; border:2.5px solid var(--faint); border-top-color:var(--accent); border-radius:50%; animation:spin 0.7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
/* Übergabe-Notiz (Szene/Brücke) */
.scene-note { align-self:center; text-align:center; font-family:'Cormorant Garamond',serif; font-style:italic; font-size:0.82rem; color:var(--mid); background:rgba(0,0,0,0.02); padding:0.45rem 0.85rem; border-radius:10px; max-width:90%; opacity:0; animation:fadeUp 0.45s ease forwards; }

/* ── Korrektur-Karte am Szenenende (Paket 3) — zwei Spalten „Du hast gesagt → Besser",
   NUR kommunikativ unpassend, OHNE Erklärung; 🔊 auf „Besser". Stil = prototyp-feinschliff-iii.html. */
.kk { align-self:stretch; background:var(--white); border:1px solid var(--faint); border-radius:16px; padding:0.85rem 0.8rem; margin-left:2.75rem; opacity:0; animation:fadeUp 0.45s ease forwards; box-shadow:0 6px 18px rgba(0,0,0,0.05); }
.kk-eyebrow { font-size:0.6rem; font-weight:700; letter-spacing:0.13em; text-transform:uppercase; color:var(--muted,#5f7068); margin-bottom:0.6rem; text-align:center; }
.kk-row { display:grid; grid-template-columns:1fr 1fr; gap:0.45rem; margin-bottom:0.45rem; }
.kk-row:last-child { margin-bottom:0; }
.kk-head > div { font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; text-align:center; }
.kk-head .h-said { color:var(--said-ink); }
.kk-head .h-better { color:var(--accent); }
.kk-cell { border-radius:10px; padding:0.5rem 0.6rem; font-family:'Cormorant Garamond',serif; font-size:0.86rem; line-height:1.3; }
.kk-said { background:var(--said-bg); border:2px solid var(--ink); color:var(--said-ink); }
.kk-better { background:var(--accent2); border:2px solid var(--ink); color:var(--accent3); font-weight:600; position:relative; padding-right:1.9rem; }
.kk-better .speak-btn { top:50%; transform:translateY(-50%); right:0.4rem; width:24px; height:24px; background:var(--white); }
/* Abschluss-Menü (Paket 3): drei Knöpfe inline im Chat-Strom, kein Auto-Sprung */
.endmenu { align-self:stretch; display:flex; flex-direction:column; gap:0.5rem; margin-left:2.75rem; opacity:0; animation:fadeUp 0.45s ease forwards; }
.endmenu .chip { width:100%; text-align:center; }
/* ── Antwort-Paletten (Teil A): 2–3 klickbare Lerner-Antworten im geführten Thema-
   Rollenspiel. Chips primär, Textfeld bleibt sekundär. NIE im freien Gespräch. ── */
.antwort-palette { align-self:stretch; display:flex; flex-direction:column; gap:0.5rem; padding-left:2.75rem; opacity:0; animation:fadeUp 0.45s ease forwards; }
/* ── Ausstiegs-Leiste (Teil 31 #1): dauerhaft erreichbar im geführten Rollenspiel,
   über dem Eingabefeld. ⋯ öffnet dieselben Optionen wie das End-Menü (Anderes Thema /
   Beenden → Lektion). Nur geführt; im freien Flur ausgeblendet. ── */
.exit-bar { display:flex; flex-direction:column; gap:0.4rem; margin-bottom:0.5rem; }
.exit-bar[hidden] { display:none; }
.exit-toggle { align-self:flex-end; background:#fff; border:2px solid var(--ink); color:var(--ink); border-radius:100px; padding:0.25rem 0.8rem; font-family:'DM Sans',sans-serif; font-size:0.8rem; font-weight:700; box-shadow:2px 2px 0 var(--ink); cursor:pointer; transition:0.15s; -webkit-tap-highlight-color:transparent; }
.exit-toggle:hover { border-color:var(--accent); color:var(--accent); }
.exit-menu { display:flex; flex-direction:column; gap:0.4rem; }
.exit-menu[hidden] { display:none; }
.exit-menu .chip { width:100%; text-align:center; }
/* ── Freies-Gespräch-Ausstieg (Teil 32 #1): dezenter „Gespräch beenden", dauerhaft
   sichtbar im freien Flur (ab ≥2 Verlauf-Einträgen). Optik wie die Ausstiegs-Leiste. ── */
.free-exit { display:flex; margin-bottom:0.5rem; }
.free-exit[hidden] { display:none; }
.free-exit .exit-toggle { align-self:flex-end; margin-left:auto; }
/* ── Lektion-Angebot (Teil 32 #2): Ja/Nein-Karte am Gesprächsende, Stil wie End-Menü. ── */
.app.dissolving { transition:opacity 0.6s ease, filter 0.6s ease; opacity:0; filter:blur(6px); pointer-events:none; }
/* ── Voz primero (Paket 5): Präsenz-Gruß beim Eintritt. Spikiu LÄDT EIN (sanfter Puls +
   „tippen, um zu hören") — Autoplay braucht eine Geste; erst der Tipp spielt die Stimme.
   Größerer, vollständiger Capy; Sprech-Zustand (Mund + Aura) liefert capy-vivo.js. ── */
/* Gespräch-Reel Phase 1 (Teil 43): immersiver Charakter-Eintritt — Spikiu groß/mittig,
   Gruß + einladende Frage zentriert. Optik nach prototyp-final-spikiu-frei.html. */
.voz-greet { align-self:stretch; display:flex; flex-direction:column; align-items:center; text-align:center; gap:0.45rem; padding:1.4rem 0 0.4rem; cursor:pointer; -webkit-tap-highlight-color:transparent; animation:fadeUp 0.4s ease forwards; opacity:0; }
.voz-capy { width:90px; height:90px; overflow:visible; animation:vozBreathe 4.5s ease-in-out infinite; }
.voz-greet-line { font-family:'DM Sans',sans-serif; font-weight:800; font-size:1.5rem; line-height:1.2; color:var(--ink); max-width:22rem; }
.voz-invite { font-family:'DM Sans',sans-serif; font-weight:600; font-size:1rem; line-height:1.35; color:var(--mid); max-width:22rem; margin-top:0.25rem; }
.voz-invite-sub { color:var(--accent); font-weight:600; }
.voz-hint { display:inline-flex; align-items:center; gap:0.4rem; font-size:0.8rem; color:var(--accent); font-weight:500; margin-top:0.15rem; }
.voz-hint::before { content:''; width:8px; height:8px; border-radius:50%; background:var(--accent); animation:vozPulse 1.6s ease-in-out infinite; }
.voz-greet.spoke { cursor:default; }
.voz-greet.spoke .voz-hint { display:none; }
@keyframes vozBreathe { 0%,100%{ transform:translateY(0) scale(1);} 50%{ transform:translateY(-3px) scale(1.02);} }
@keyframes vozPulse { 0%,100%{ transform:scale(1); opacity:1;} 50%{ transform:scale(1.5); opacity:0.4;} }
@media (prefers-reduced-motion: reduce){ .voz-capy{ animation:none; } .voz-hint::before{ animation:none; } }

/* ── Gespräch-Reel Phase 2 (Teil 44): der FREIE FLUR als Vollbild-Slides. ──
   Nur sichtbar, wenn reelActive (gefuehrt===false). Scroll-Snap = Wisch nach
   oben blättert nativ; eine Sache pro Screen. Geführtes Thema bleibt Blasen. */
/* Teil 46: horizontales Ein-Karten-Deck (Buchseiten/Tinder) statt vertikalem Scroll-Snap.
   Slides liegen ABSOLUT übereinander; nur die aktuelle ist sichtbar. Vorrücken = nach links. */
.reel { flex:1; position:relative; overflow:hidden; background:var(--bg); }
.reel[hidden]{ display:none; }
.reel-slide { position:absolute; inset:1rem .9rem; box-sizing:border-box; display:flex; flex-direction:column; align-items:stretch; justify-content:center; text-align:center; gap:.8rem; padding:1.4rem 1.3rem 2rem; overflow-y:auto; background:var(--bubS); border:var(--ow) solid var(--ink); border-radius:22px; box-shadow:5px 6px 0 var(--ink); transform:translateX(118%); opacity:0; pointer-events:none; transition:transform .38s cubic-bezier(.4,0,.2,1), opacity .38s ease; will-change:transform,opacity; }
.reel-slide.reel-current { transform:translateX(0) rotate(0); opacity:1; pointer-events:auto; z-index:2; }
.reel-slide.reel-next { transform:translateX(114%) rotate(1.5deg); opacity:0; pointer-events:none; z-index:1; }
.reel-slide.reel-past { transform:translateX(-114%) rotate(-1.5deg); opacity:0; pointer-events:none; z-index:1; }
.reel-capy { width:52px; height:52px; margin:0 auto; align-self:center; animation:vozBreathe 4.5s ease-in-out infinite; }
/* Warten AUF der Karte (18.08.2026): nach dem Senden bleibt der Lerner bei
   seiner Karte stehen und sieht drei Punkte, wo eben das Feld war. Vorher
   sprang er auf eine leere Folie mit einem einsamen Capy. */
.reel-antwort .ra-warten { display:flex; gap:0.45rem; align-items:center; justify-content:center; min-height:5.4rem; }
.reel-antwort .ra-warten span { width:10px; height:10px; border-radius:50%; background:var(--accent); opacity:0.35; animation:raPuls 1.25s ease-in-out infinite; }
.reel-antwort .ra-warten span:nth-child(2){ animation-delay:0.18s; }
.reel-antwort .ra-warten span:nth-child(3){ animation-delay:0.36s; }
@keyframes raPuls { 0%,100%{ opacity:0.28; transform:translateY(0); } 50%{ opacity:1; transform:translateY(-4px); } }
.reel-antwort .ra-echo { font:700 0.95rem 'DM Sans',sans-serif; color:var(--mid); text-align:center; max-width:22rem; }
.reel-capy svg { width:52px; height:52px; display:block; }
.reel-body { display:flex; flex-direction:column; align-items:center; gap:0.6rem; max-width:22rem; }
.reel-line { font-family:'Lora',serif; font-weight:600; font-size:clamp(2.1rem,8vw,3.1rem); line-height:1.24; color:var(--read,#2b2621); font-style:normal; padding:0 0.2rem; }
.reel-line em, .reel-line strong { font-style:normal; }
.reel-speak { position:static; width:38px; height:38px; margin:0.6rem auto 0; }
.reel-speak svg { width:18px; height:18px; }
.reel-trans { font-family:'DM Sans',sans-serif; font-style:italic; font-size:0.95rem; line-height:1.5; color:var(--mid); max-width:20rem; }
.reel-hint { position:absolute; left:0; right:0; bottom:1.4rem; font-size:0.8rem; color:var(--warm); font-weight:500; animation:reelBob 1.8s ease-in-out infinite; }
/* Vertipper-Schutz (18.08.2026, Kind-Test): sieht ein Zug nach Versehen aus,
   geht KEIN Aufruf raus. Der Text bleibt stehen, das Feld färbt sich, ein
   zweiter Druck auf Senden schickt es doch — der Nutzer hat das letzte Wort. */
.reel-learner-field textarea.gewarnt { border-color:#c67a1e; background:#fffbe8; }
.reel-warn { font:700 0.82rem 'DM Sans',sans-serif; color:#a0630a; text-align:center; margin-top:0.45rem; line-height:1.4; }
.reel-korr { align-self:center; margin-top:0.7rem; background:var(--accent); color:var(--white); border:var(--ow) solid var(--ink); box-shadow:var(--shs) 0 var(--ink); border-radius:100px; padding:0.6rem 1.25rem; font:800 0.9rem 'DM Sans',sans-serif; cursor:pointer; }
.reel-korr:active { transform:translateY(2px); box-shadow:0 0 0 var(--ink); }
@keyframes reelBob { 0%,100%{ transform:translateX(0); opacity:0.7; } 50%{ transform:translateX(-5px); opacity:1; } }
/* Bühnenkarte (18.08.2026): steht vor jeder Szene im freien Flur.
   Bild, Rollen, ein Knopf. Kein Aufruf — alles aus der Datenbank.
   Sie ersetzt Spikius bisheriges „¡Perfecto! Vamos a practicar…", das
   einen ganzen Zug für eine Höflichkeit verbraucht hat. */
.reel-buehne { gap:0.75rem; align-items:center; text-align:center; }
.reel-buehne .bu-bild { width:min(58vw,15rem); height:auto; align-self:center; margin:0 auto; border-radius:18px; border:var(--ow) solid var(--ink); box-shadow:4px 5px 0 var(--ink); display:block; }
.reel-buehne .bu-em { font-size:4.4rem; line-height:1; filter:drop-shadow(2px 3px 0 rgba(21,22,58,.12)); }
.reel-buehne .bu-rollen { font:700 clamp(1.05rem,4.4vw,1.3rem)/1.45 'DM Sans',sans-serif; color:var(--ink); max-width:20rem; }
.reel-buehne .bu-rollen b { color:var(--accent); }
.reel-buehne .bu-ort { font:600 0.88rem 'DM Sans',sans-serif; color:var(--mid); }
.reel-buehne .bu-los { margin-top:0.4rem; background:var(--accent); color:var(--white); border:var(--ow) solid var(--ink); box-shadow:var(--shs) 0 var(--ink); border-radius:100px; padding:0.7rem 2.2rem; font:800 1.05rem 'DM Sans',sans-serif; cursor:pointer; }
.reel-buehne .bu-los:active { transform:translateY(2px); box-shadow:0 0 0 var(--ink); }
.reel-userbubble { background:var(--you); color:var(--youtx); border:var(--ow) solid var(--ink); box-shadow:var(--shs) 0 var(--ink); border-radius:1.2rem 0.3rem 1.2rem 1.2rem; padding:0.8rem 1.1rem; font:800 clamp(1.2rem,5vw,1.65rem)/1.3 'DM Sans',sans-serif; max-width:86%; }
/* Zug ändern (18.08.2026): ein zu früh gesendeter Zug lässt sich korrigieren.
   Beim Neusenden fliegt er samt Spikius Antwort aus dem verlauf — sonst baut
   Spikiu auf dem Versehen weiter auf. Kind-Test, ungeduldiges Tippen. */
.reel-user .reel-edit { align-self:flex-start; margin-top:0.5rem; background:transparent; border:2px solid var(--ink); color:var(--ink); border-radius:100px; padding:0.34rem 0.85rem; font:800 0.8rem 'DM Sans',sans-serif; cursor:pointer; opacity:0.7; }
.reel-user .reel-edit:active { transform:scale(0.97); }
.reel-user .reel-editbox { width:100%; max-width:86%; align-self:flex-start; display:flex; flex-direction:column; gap:0.5rem; }
.reel-user .reel-editbox textarea { width:100%; border:var(--ow) solid var(--ink); border-radius:1rem; padding:0.7rem 0.85rem; font:700 1.05rem 'DM Sans',sans-serif; resize:none; background:var(--white); color:var(--ink); }
.reel-user .reel-editrow { display:flex; gap:0.45rem; }
.reel-user .reel-editrow button { flex:1; border:var(--ow) solid var(--ink); border-radius:100px; padding:0.55rem 0.8rem; font:800 0.88rem 'DM Sans',sans-serif; cursor:pointer; }
.reel-user .reel-editrow .ok { background:var(--accent); color:var(--white); }
.reel-user .reel-editrow .no { background:var(--white); color:var(--ink); }
.reel-learner-head { font-family:'Lora',serif; font-weight:600; font-size:clamp(1.9rem,7.5vw,2.8rem); line-height:1.25; color:var(--read,#2b2621); max-width:22rem; }
.reel-learner-field { display:flex; flex-direction:column; gap:0.7rem; width:100%; max-width:22rem; }
/* Eingabe AUF der Spikiu-Folie (18.08.2026): Frage und Antwort gehoeren
   zusammen. Vorher lag Spikius Zeile auf einer Karte und „Du bist dran"
   auf der naechsten — der Lerner musste wischen, um zu antworten. */
/* Echo des eigenen Zugs (18.08.2026): Er stand als EIGENE gelbe Karte im Reel —
   nach jeder Antwort eine Zwischenkarte, die niemand sehen wollte. Jetzt sitzt
   er klein oben auf Spikius Antwortkarte, mit dem Ändern-Knopf daneben. */
/* ── Aufgeräumte Szenenkarte (19.08.2026) ───────────────────────────────
   Vorher zehn Blöcke: Echo · Ändern · Linie · Capy · Ziel · Audio ·
   Übersetzung · Feld · Senden · Beenden. Bei langen Sätzen wurde oben
   abgeschnitten, weil der WICHTIGSTE Block den Rest bekam.
   Jetzt fünf: Rolle · Ziel · Audio · Feld · Senden.
     Capy raus (in der Szene ist Spikiu die Figur, nicht das Maskottchen),
     Echo raus (der Lerner weiß, was er getippt hat — ein Stift genügt),
     Übersetzung erst auf Tippen (er soll erst raten),
     Beenden in die Kopfzeile, wo es nie mitwächst. */
.reel-slide.hat-antwort .reel-capy { display:none; }
.reel-kopf { flex:0 0 auto; display:flex; align-items:center; gap:0.5rem; width:100%; max-width:24rem; padding:0 0 0.5rem; margin-bottom:0.8rem; border-bottom:2px solid var(--line,#eef1ee); }
.reel-kopf .rk-rolle { font:800 0.66rem 'DM Sans',sans-serif; letter-spacing:0.05em; text-transform:uppercase; color:var(--mid); flex:1; text-align:left; }
.reel-kopf .rk-btn { flex:0 0 auto; width:30px; height:30px; border-radius:50%; border:2px solid var(--line,#eef1ee); background:var(--white); color:var(--mid); font-size:0.82rem; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
.reel-kopf .rk-btn:active { transform:scale(0.94); }
/* Schluss-Karte im freien Flur (19.08.2026): „Gespräch beenden" fiel bisher
   aus dem Reel in den alten Blasen-Chat — daher die verdoppelten Angebote.
   Jetzt endet die Szene IM Reel, und beide Wege führen nach Hause. */
/* Die drei Aufgaben (19.08.2026) — der Anker der Szene.
   Immer nur die AKTUELLE Aufgabe, darüber ein dünner Balken aus drei
   Segmenten. Zwei Gründe: Ein Kreis oder eine Listenzeile sieht aus wie ein
   Knopf und verleitet zum Tippen. Und drei Aufgaben gleichzeitig sind drei
   Dinge im Kopf — die Regel heißt: ein Gedanke pro Karte. */
.reel-jetzt { width:100%; max-width:21rem; display:flex; flex-direction:column; align-items:center; gap:0.4rem; margin-top:0.6rem; }
.reel-jetzt .rj-schritte { display:flex; gap:0.3rem; width:100%; }
.reel-jetzt .rj-st { flex:1; height:5px; border-radius:3px; background:#dfe7e2; }
.reel-jetzt .rj-st.fertig { background:#1b4f72; }
.reel-jetzt .rj-st.jetzt { background:var(--accent); }
.reel-jetzt .rj-klein { font:600 0.72rem 'DM Sans',sans-serif; color:var(--mid); }
.reel-jetzt .rj-txt { font:800 0.96rem/1.35 'DM Sans',sans-serif; color:var(--ink); max-width:19rem; text-align:center; }
/* Verteilung der Szenenkarte (19.08.2026, nach Googles Übungsmodus):
   Kopfzeile → Aufgabe → Spikius Replik → Souffleur → Feld & Senden.
   Die Aufgabe steht GANZ OBEN, weil sie sagt, worum es geht, bevor jemand
   redet. Der Souffleur ist eine eigene Zeile, keine schwebende Blase —
   so kann nichts das Eingabefeld verdecken. */
.reel-aufgabe { width:100%; max-width:22rem; display:flex; flex-direction:column; align-items:center; gap:0.3rem; padding:0 0 0.55rem; margin-bottom:0.7rem; border-bottom:2px solid var(--line,#eef1ee); }
.reel-aufgabe .ag-txt { font:800 1.02rem/1.3 'DM Sans',sans-serif; color:var(--ink); text-align:center; }
.reel-souff { display:flex; align-items:center; gap:0.6rem; width:100%; max-width:22rem; padding:0.55rem 0.1rem 0; margin-top:0.9rem; border-top:2px solid var(--line,#eef1ee); }
.reel-souff .sf-capy { width:42px; height:42px; flex:0 0 auto; border-radius:50%; border:2.5px solid var(--ink); background:var(--white); box-shadow:3px 3px 0 var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
.reel-souff .sf-capy svg { width:27px; height:27px; }
.reel-souff .sf-capy:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
.reel-souff .sf-satz { flex:1; min-width:0; text-align:left; }
.reel-souff .sf-kopf { font:800 0.56rem 'DM Sans',sans-serif; letter-spacing:0.05em; text-transform:uppercase; color:var(--mid); }
.reel-souff .sf-txt { font-family:'Lora',serif; font-weight:600; font-size:1rem; line-height:1.3; color:var(--ink); }
.reel-souff .sf-leer { font:600 0.78rem 'DM Sans',sans-serif; color:var(--mid); opacity:0.8; font-style:italic; }
/* Der Ausgang erscheint erst bei der letzten Aufgabe — nicht davor. */
.reel-antwort .ra-send.ausgang { background:#dff2e5; color:#1d4d38; border-color:#2d6a4f; box-shadow:4px 4px 0 #2d6a4f; }
/* Die Ernte: Wendungen und Wörter der Station, aus der Datenbank. */
.reel-ernte { width:100%; max-width:22rem; display:flex; flex-direction:column; gap:0.2rem; text-align:left; margin-top:0.5rem; }
.reel-ernte .e-kopf { font:800 0.6rem 'DM Sans',sans-serif; letter-spacing:0.05em; text-transform:uppercase; color:var(--mid); margin:0.5rem 0 0.15rem; padding-left:0.5rem; }
.reel-ernte .e-kopf:first-child { margin-top:0; }
.reel-ernte .e-z { display:flex; align-items:flex-start; gap:0.5rem; padding:0.32rem 0.5rem; border-radius:10px; background:var(--bg2); }
.reel-ernte .e-a { width:26px; height:26px; flex:0 0 auto; border-radius:50%; border:0; background:#dff0ef; color:var(--accent); font-size:0.66rem; cursor:pointer; }
.reel-ernte .e-w { font-family:'Lora',serif; font-weight:600; font-size:0.98rem; color:var(--ink); }
.reel-ernte .e-t { color:var(--mid); font-weight:600; font-size:0.82rem; margin-left:auto; text-align:right; }
.reel-schluss { gap:0.9rem; }
.reel-schluss .rs-frage { font:800 clamp(1.15rem,4.8vw,1.45rem)/1.4 'DM Sans',sans-serif; color:var(--ink); max-width:20rem; }
.reel-schluss .rs-btn { width:100%; max-width:20rem; border:var(--ow) solid var(--ink); border-radius:100px; padding:0.7rem 1.2rem; font:800 1rem 'DM Sans',sans-serif; cursor:pointer; box-shadow:4px 4px 0 var(--ink); }
.reel-schluss .rs-btn.ja { background:var(--accent); color:var(--white); }
.reel-schluss .rs-btn.nein { background:var(--white); color:var(--ink); }
.reel-schluss .rs-btn:active { transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink); }
.reel-uez { background:none; border:0; font:700 0.78rem 'DM Sans',sans-serif; color:var(--accent); text-decoration:underline; cursor:pointer; margin-top:0.2rem; }
/* Auf einer Karte mit Antwortfeld gibt es nichts zu wischen — dort wird
   geantwortet. Der fest positionierte Hinweis lag sonst über dem Senden-Knopf. */
.reel-slide.hat-antwort .reel-hint { display:none; }
.reel-spikiu .reel-echo { width:100%; max-width:22rem; margin-bottom:0.9rem; padding-bottom:0.7rem; border-bottom:2px solid var(--line,#eef1ee); display:flex; align-items:center; justify-content:center; gap:0.5rem; flex-wrap:wrap; }
.reel-spikiu .reel-echo .re-text { font:700 0.95rem 'DM Sans',sans-serif; color:var(--mid); }
.reel-spikiu .reel-echo .re-edit { background:none; border:2px solid var(--line,#eef1ee); border-radius:100px; padding:0.2rem 0.65rem; font:800 0.7rem 'DM Sans',sans-serif; color:var(--mid); cursor:pointer; }
.reel-spikiu .reel-echo .re-edit:active { transform:scale(0.97); }
.reel-spikiu .reel-antwort { width:100%; max-width:22rem; margin-top:1.1rem; padding-top:0.9rem; border-top:2px solid var(--line,#eef1ee); display:flex; flex-direction:column; align-items:center; gap:0.7rem; }
/* Variante C (18.08.2026): Rahmen ums Feld, damit der Lerner sieht, WO er
   antwortet. Nur drei Punkte als Andeutung — „Schreib etwas" sagt nichts,
   was der Rahmen nicht schon sagt. Senden darunter und mittig. */
.reel-spikiu .reel-antwort textarea { width:100%; background:var(--white); border:2.5px solid var(--ink); border-radius:16px; padding:0.85rem 1rem; font:600 1.05rem/1.45 'DM Sans',sans-serif; color:var(--ink); resize:none; outline:none; min-height:5.4rem; text-align:center; }
.reel-spikiu .reel-antwort textarea::placeholder { color:#b8c4bd; letter-spacing:0.18em; font-size:1.3rem; }
.reel-spikiu .reel-antwort textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(31,147,176,0.14); }
.reel-spikiu .reel-antwort textarea.gewarnt { border-color:#c67a1e; background:#fffbe8; }
.reel-spikiu .reel-antwort .ra-send { background:var(--accent); color:var(--white); border:var(--ow) solid var(--ink); box-shadow:4px 4px 0 var(--ink); border-radius:100px; padding:0.65rem 2.4rem; font:800 1rem 'DM Sans',sans-serif; cursor:pointer; }
.reel-spikiu .reel-antwort .ra-send:active { transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink); }
.reel-spikiu .reel-antwort .ra-end { background:none; border:0; font:700 0.78rem 'DM Sans',sans-serif; color:var(--mid); text-decoration:underline; cursor:pointer; }
.reel-learner-field textarea { background:var(--bg2); border:1.5px solid transparent; border-radius:1.1rem; padding:0.85rem 1.1rem; font-family:'DM Sans',sans-serif; font-size:1rem; color:var(--ink); resize:none; outline:none; line-height:1.5; }
.reel-learner-field textarea:focus { border-color:var(--accent); background:var(--white); }
.reel-send { background:var(--accent); color:#fff; border:var(--ow) solid var(--ink); box-shadow:var(--shs) 0 var(--ink); border-radius:100px; padding:0.7rem 1.6rem; font-family:'DM Sans',sans-serif; font-size:0.98rem; font-weight:800; cursor:pointer; align-self:center; -webkit-tap-highlight-color:transparent; }
.reel-send:hover { background:var(--accent3); }
.reel-end { margin-top:0.5rem; background:none; border:none; color:var(--mid); font-family:'DM Sans',sans-serif; font-size:0.82rem; text-decoration:underline; cursor:pointer; -webkit-tap-highlight-color:transparent; }
@media (prefers-reduced-motion: reduce){ .reel-capy{ animation:none; } .reel-hint{ animation:none; } .reel-slide{ transition:none; } }

/* ── Phase 3a (Teil 45): geführtes SPRECHEN im Reel — Antwort-Paletten als Tinder-Karten,
   Korrektur-/Endmenü-Slides. Freier Flur (Phase 2) unverändert; Häppchen-Prep bleibt Chat. */
.reel-cards { display:flex; flex-direction:column; gap:0.6rem; width:100%; max-width:22rem; }
.reel-card { background:var(--white); border:2px solid var(--accent); color:var(--accent); border-radius:1rem; padding:0.95rem 1.15rem; font-family:'Cormorant Garamond',serif; font-size:1.12rem; font-weight:500; line-height:1.35; cursor:pointer; transition:0.16s; -webkit-tap-highlight-color:transparent; }
.reel-card:hover { background:var(--accent); color:var(--white); }
.reel-card:active { transform:scale(0.98); }
/* Tinder-Karten primär → Textfeld sekundär (gedämpft, kleiner Abstand). */
.reel-learner .reel-cards ~ .reel-learner-field { margin-top:0.9rem; opacity:0.92; }
.reel-learner .reel-cards ~ .reel-learner-field textarea { font-size:0.92rem; }
.reel-korrektur .kk { align-self:center; margin-left:0; max-width:24rem; width:100%; }

/* ── Erklärkarte (17.08.2026): Antwort auf eine Meta-Frage im Gespräch.
   GESETZ: eine Zeile = eine Sprache. Der 🔊 hängt NUR an Zielsprach-Zeilen;
   Umschrift und Muttersprache bleiben stumm. Behebt den Piper-Mischmasch,
   bei dem „πρέπει να = ich muss" als EINE Zeichenkette vorgelesen wurde. */
.reel-erk { gap:0.55rem; }
.reel-erk .erk-braue { font:800 0.68rem 'DM Sans',sans-serif; letter-spacing:0.04em; text-transform:uppercase; color:var(--mid); opacity:0.75; }
.reel-erk .erk-z { font-family:'Lora',serif; font-weight:600; font-size:clamp(1.9rem,7.5vw,2.8rem); line-height:1.24; color:var(--read,#2b2621); max-width:22rem; align-self:center; }
.reel-erk .erk-tr { font-family:'DM Sans',sans-serif; font-style:italic; font-weight:600; font-size:0.95rem; line-height:1.35; color:var(--mid); max-width:20rem; align-self:center; }
.reel-erk .erk-na { font-family:'DM Sans',sans-serif; font-weight:700; font-size:1.15rem; line-height:1.3; color:var(--ink); max-width:20rem; align-self:center; }
.reel-erk .erk-regel { font-family:'DM Sans',sans-serif; font-weight:600; font-size:1.02rem; line-height:1.5; color:var(--ink); max-width:21rem; align-self:center; }
.reel-erk .erk-wann { font-family:'DM Sans',sans-serif; font-weight:500; font-size:0.9rem; line-height:1.45; color:var(--mid); max-width:20rem; align-self:center; }
.reel-erk .erk-hr { width:100%; max-width:20rem; height:2px; background:var(--line,#eef1ee); border:0; align-self:center; margin:0.1rem 0; }
.reel-erk .erk-box { width:100%; max-width:21rem; align-self:center; background:var(--bg2); border:2px solid var(--line,#eef1ee); border-radius:14px; padding:0.6rem 0.75rem; display:flex; flex-direction:column; gap:0.3rem; text-align:left; }
.reel-erk .erk-zeile { display:flex; align-items:center; gap:0.6rem; width:100%; }
.reel-erk .erk-sp { display:flex; flex-direction:column; gap:0.05rem; min-width:0; flex:1; }
.reel-erk .speak-btn.erk-speak { position:static; width:38px; height:38px; flex:0 0 38px; margin:0; }
.reel-erk .speak-btn.erk-speak svg { width:18px; height:18px; }
.reel-erk .erk-gross { width:56px; height:56px; flex:0 0 56px; margin:0.35rem auto 0; align-self:center; }
.reel-erk .erk-gross svg { width:24px; height:24px; }
.reel-erk .erk-glied { display:flex; align-items:center; gap:0.6rem; width:100%; max-width:22rem; align-self:center; padding:0.34rem 0; border-bottom:1px solid var(--line,#eef1ee); text-align:left; }
.reel-erk .erk-glied:last-of-type { border-bottom:0; }
.reel-erk .erk-glied-z { font-family:'Lora',serif; font-weight:600; font-size:1.2rem; line-height:1.25; color:var(--read,#2b2621); }
.reel-erk .erk-glied-tr { font-family:'DM Sans',sans-serif; font-style:italic; font-weight:500; font-size:0.8rem; color:var(--mid); }
.reel-erk .erk-glied-na { font-family:'DM Sans',sans-serif; font-weight:600; font-size:0.92rem; color:var(--mid); text-align:right; margin-left:auto; }
.reel-erk .erk-btn { align-self:center; margin-top:0.5rem; background:var(--white); color:var(--accent); border:2px solid var(--accent); border-radius:100px; padding:0.6rem 1.4rem; font:800 0.92rem 'DM Sans',sans-serif; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.reel-erk .erk-btn:active { transform:scale(0.98); }
.reel-erk .erk-punkte { display:flex; gap:0.35rem; justify-content:center; align-self:center; margin-top:0.35rem; }
.reel-erk .erk-punkt { width:8px; height:8px; border-radius:50%; background:var(--ink); opacity:0.22; }
.reel-erk .erk-punkt.an { opacity:1; }
.reel-endmenu .reel-cards { gap:0.55rem; }
.reel-endmenu .reel-card.full { background:var(--accent); color:var(--white); border-color:var(--accent); }
.reel-endmenu .reel-card.full:hover { background:var(--accent3); }

/* Phase 3b (Teil 48): geführter Prep (Wörter/Hören) + Übergabe als Reel-Karten —
   gleiche Widgets/Logik, nur ins horizontale Deck gewickelt. */
.reel-haeppchen { justify-content:flex-start; padding-top:2rem; gap:1rem; }
.reel-haeppchen .widget { align-self:center; margin-left:0; width:100%; max-width:23rem; text-align:left; }
.reel-haeppchen .flow-row { padding-left:0; justify-content:center; }
.reel-note-card { justify-content:center; gap:1.3rem; }
.reel-note-text { font-family:'Cormorant Garamond',serif; font-size:1.3rem; line-height:1.35; color:var(--ink); max-width:20rem; }
.reel-note { justify-content:center; }
.reel-note .scene-note { align-self:center; }
.reel-spikiu .hap-spin { margin-bottom:0.2rem; }
</style>
</head>
<body>
<div class="app">

  <!-- Slot-Modus: nav.js (data-spk-nav) füllt diese vorhandene Kopfzeile mit
       Hamburger + Logo — KEINE zweite Leiste. „← Dashboard" wandert in den Drawer.
       Die Seiten-eigenen header-Styles (flex, padding, border-bottom) bleiben. -->
  <header class="rnav"><button class="back" onclick="location.href='haus.html'" aria-label="zurück">‹</button></header>

  <!-- Profil-Chip: gelesen aus spikiu_user, Onboarding übersprungen -->
  <div class="profile-bar" id="profileBar">
    <span class="who" id="pName">Gast</span>
    <span class="sep">·</span>
    <span id="pLangs">Deutsch → Español</span>
    <span class="chip" id="pKoennen">Anfänger</span>
  </div>

  <!-- Fortschrittsbalken (Paket 2): nur im geführten Pfad sichtbar (per JS enthüllt).
       Füllt Thema→Wörter→Hören→Sprechen; „Lektion" bleibt blass (= Paket 3). -->
  <div class="rail hidden" id="rail" aria-hidden="true">
    <div class="rail-step" data-stage="thema"><span class="dot"></span><span class="rail-lbl"></span></div>
    <div class="rail-step" data-stage="wortschatz"><span class="dot"></span><span class="rail-lbl"></span></div>
    <div class="rail-step" data-stage="hoeren"><span class="dot"></span><span class="rail-lbl"></span></div>
    <div class="rail-step" data-stage="sprechen"><span class="dot"></span><span class="rail-lbl"></span></div>
    <div class="rail-step" data-stage="lektion"><span class="dot"></span><span class="rail-lbl"></span></div>
  </div>

  <div class="chat" id="chat"></div>

  <!-- Gespräch-Reel Phase 2 (Teil 44): Vollbild-Slides für den freien Flur. Per JS
       (enterReel/exitReel) ein-/ausgeblendet; ersetzt den Chat nur bei „Einfach plaudern". -->
  <div class="reel" id="reel" hidden></div>

  <div class="input-area">
    <!-- Dauerhafter Ausstieg im geführten Rollenspiel (Teil 31 #1); per JS ein-/ausgeblendet. -->
    <div class="exit-bar" id="exitBar" hidden>
      <div class="exit-menu" id="exitMenu" hidden>
        <button class="chip" type="button" id="exitOtro"></button>
        <button class="chip full" type="button" id="exitTerminar"></button>
      </div>
      <button class="exit-toggle" type="button" id="exitToggle"></button>
    </div>
    <!-- Freies Gespräch: dezenter „Gespräch beenden" (Teil 32 #1); per JS ein-/ausgeblendet. -->
    <div class="free-exit" id="freeExitBar" hidden>
      <button class="exit-toggle" type="button" id="freeExitBtn"></button>
    </div>
    <div class="input-row">
      <textarea id="userInput" placeholder="Schreib etwas…" rows="1"></textarea>
      <button class="send-btn" id="sendBtn" disabled onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

</div>

<!-- Teil 62: Sitzungs-Persistenz-Helfer SYNCHRON (vor dem Haupt-Script), damit
     window.spikiuSitzung beim Eintritt (startGespraech) schon verfügbar ist. -->
<script src="sitzung.js"></script>
<!-- Teil 64: feste Häppchen-DB (4 Themen × es/de/en/el) SYNCHRON vor dem Haupt-Script,
     damit loadHaeppchen sie ohne API-Call nutzen kann (Fallback bleibt /api/haeppchen). -->
<script src="haeppchen-db.js"></script>
<script src="szenen.js"></script>
<script src="szenen-dialog.js"></script>
<script src="lernpfad-daten.js"></script>
<script src="lernpfad.js"></script>
<script src="bilder-db.js"></script>
<script>
// ════════════════════════════════════════════════════════════════════
//  SPIKIU · RAUM: FREIES GESPRÄCH (der Flur)
//  Onboarding ÜBERSPRUNGEN. Profil aus spikiu_user (defensiv, wie
//  schreibwerkstatt.html). Echte Antworten von /api/gespraech.
//  Leere History beim Start → Backend setzt [EINSTIEG] → Opener (Gruß ohne Frage).
// ════════════════════════════════════════════════════════════════════
var ENDPOINT = '/api/gespraech';

// ── Token-Paket A (Teil 66) ───────────────────────────────────────
// Token-Last je Zug deckeln, ohne das Erlebnis zu ändern.
// (1) Gleit-Fenster: ausgehend nur Seed + die letzten WINDOW Nachrichten (verlauf
//     selbst bleibt voll → Anzeige + sitzung.js-Persistenz unberührt).
// (2) Sprechen-Cap: das GEFÜHRTE Rollenspiel kommt ab CAP Spikiu-Zügen sanft zum
//     Abschluss — versteckter Steuer-Hinweis NUR an der ausgehenden letzten
//     User-Nachricht (nie in verlauf), worauf das Modell sein reguläres
//     [SZENENENDE] setzt. Freies Plaudern/„Schreib etwas…" bleibt unberührt.
var GESP_WINDOW = 12;   // Nachrichten im Gleit-Fenster (zzgl. Seed)
var GESP_CAP    = 6;    // ab so vielen Spikiu-Zügen wird zum Abschluss gesteuert (~6–8)
var CLOSE_HINT  = '[HINWEIS: Schließe die Szene JETZT ab — gib höchstens noch eine kurze Schluss-Replik der Figur, dann setze unmittelbar dein reguläres [SZENENENDE]. Nicht weiter ausbauen, keine neue Frage stellen. Dies ist eine stille Regie-Anweisung, sprich sie NIE aus.]';

// ── Spikiu IMMER komplett: Ohren + 4 Füße. Nie einen halben Capy. ──
var CAPY_SMALL = '<svg width="20" height="20" viewBox="0 0 80 80" fill="none">'
  + '<ellipse cx="40" cy="50" rx="28" ry="20" fill="#c9956a"/><ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/>'
  + '<ellipse cx="40" cy="36" rx="10" ry="7" fill="#b8845a"/><ellipse cx="40" cy="33" rx="4" ry="2.5" fill="#8b5e3c"/>'
  + '<circle cx="38" cy="33" r="1" fill="#6b4226"/><circle cx="42" cy="33" r="1" fill="#6b4226"/>'
  + '<circle cx="33" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="47" cy="24" r="3.5" fill="#3d2b1f"/>'
  + '<circle cx="34" cy="23" r="1.2" fill="white"/><circle cx="48" cy="23" r="1.2" fill="white"/>'
  + '<ellipse cx="26" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="54" cy="17" rx="6" ry="5" fill="#b8845a"/>'
  + '<ellipse cx="22" cy="66" rx="7" ry="5" fill="#b8845a"/><ellipse cx="34" cy="68" rx="7" ry="5" fill="#b8845a"/>'
  + '<ellipse cx="46" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="58" cy="66" rx="7" ry="5" fill="#b8845a"/>'
  + '<path d="M36 38 Q40 41 44 38" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>';

// Voz primero (Paket 5): größerer, vollständiger Capy für den Präsenz-Gruß. Augen in
// einer Gruppe (capy-vivo blinzelt/folgt) + Mund mit Kennung spk-capy-mouth (Sprech-Zustand).
var CAPY_OPENER = '<svg class="voz-capy" viewBox="0 0 80 80" fill="none">'
  + '<ellipse cx="40" cy="50" rx="28" ry="20" fill="#c9956a"/><ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/>'
  + '<ellipse cx="40" cy="36" rx="10" ry="7" fill="#b8845a"/><ellipse cx="40" cy="33" rx="4" ry="2.5" fill="#8b5e3c"/>'
  + '<circle cx="38" cy="33" r="1" fill="#6b4226"/><circle cx="42" cy="33" r="1" fill="#6b4226"/>'
  + '<g class="spk-capy-eyes">'
  +   '<circle cx="33" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="47" cy="24" r="3.5" fill="#3d2b1f"/>'
  +   '<circle cx="34" cy="23" r="1.2" fill="white"/><circle cx="48" cy="23" r="1.2" fill="white"/>'
  + '</g>'
  + '<ellipse cx="26" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="54" cy="17" rx="6" ry="5" fill="#b8845a"/>'
  + '<ellipse cx="22" cy="66" rx="7" ry="5" fill="#b8845a"/><ellipse cx="34" cy="68" rx="7" ry="5" fill="#b8845a"/>'
  + '<ellipse cx="46" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="58" cy="66" rx="7" ry="5" fill="#b8845a"/>'

// ── Audio (Paket 2): audio.js liegt am Root als ES-Modul. Ein separates
// type=module-Script unten reicht speak/warm via window durch (das Haupt-Script
// ist klassisch wegen onclick="sendMessage()"). Der Browser-Fallback steckt schon
// in audio.js; greift der Import gar nicht, hält diese Mini-Notbremse den Knopf
// trotzdem hörbar (nie stummer Knopf). ──
function speakText(text, zielsprache){
  if (window.spkSpeak) { try { return window.spkSpeak(text, zielsprache); } catch(e){} }
  try {
    var synth = window.speechSynthesis;
    if (synth && typeof SpeechSynthesisUtterance !== 'undefined'){
      var bcp = { de:'de-DE', es:'es-ES', en:'en-US', el:'el-GR' }[zielsprache] || 'en-US';
      var u = new SpeechSynthesisUtterance(String(text)); u.lang = bcp;
      synth.cancel(); synth.speak(u);
    }
  } catch(e){}
}
// Stimme still vorwärmen; sobald bereit, ist der nächste 🔊-Klick sofort hörbar (Teil B).
function warmVoice(zielsprache){
  if (!window.spkWarm) return;
  try {
    var p = window.spkWarm(zielsprache);
    if (p && typeof p.then === 'function') p.then(function(){ voiceReady = true; }, function(){});
  } catch(e){}
}
// 🔊-Knopf-Handler: ist die Stimme bereit → Puls; ist sie kalt → Spinner, bis DIESER
// Text spielt (nie ein alter — der Generations-Guard in audio.js verwirft Überholtes).
function playFrom(btn, text, cls){
  var loading = !voiceReady;
  if (btn){ btn.classList.add(loading ? 'loading' : cls); }
  var done = function(){
    voiceReady = true;                                   // ab jetzt ist die Stimme warm
    if (btn){ btn.classList.remove('loading'); btn.classList.remove(cls); }
  };
  var p = speakText(text, PROFILE.zielsprache);
  if (p && typeof p.then === 'function'){ p.then(done, done); }
  else { setTimeout(done, 1400); }
}

// ── leichte, sichere Darstellung (keine Asterisks im HTML stehen lassen) ──
function fmt(t){
  var s = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
  // _kursiv_ → <em>: Spikius Muttersprach-Brücke kommt mit Unterstrichen.
  // Nur paarweise an Wortgrenzen — Unterstrich MITTEN im Wort (el_perro,
  // datei_name) bleibt unberührt, wird nicht zu Kursiv zerschnitten.
  s = s.replace(/(^|[^\w])_(?=\S)([^_\n]*?\S)_(?!\w)/g,'$1<em>$2</em>');
  s = s.replace(/\n/g,'<br>');
  return s;
}
function escPlain(t){
  return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

// ── Übersetzungs-Brücke [[…]] (Feinschliff) ───────────────────────
// Spikiu schreibt zuerst die Zielsprache, dann EIN [[ Muttersprache ]] auf eigener
// Zeile (Struktur-Signal wie [WECHSEL]). Die Oberfläche splittet: Zielsprache → Blase
// (mit 🔊), [[…]] → gedämpftes Kästchen darunter (kein Audio). [[…]] NIE als Rohtext.
function splitBridge(text){
  var m = (text||'').match(/\[\[\s*([\s\S]*?)\s*\]\]/);
  var trans = m ? m[1].trim() : null;
  var ziel = (text||'').replace(/\[\[[\s\S]*?\]\]/g, ' ').replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n').replace(/\n{3,}/g,'\n\n').trim();
  if (!ziel && trans){ ziel = trans; trans = null; }   // nie eine leere Blase
  return { ziel: ziel, trans: trans };
}
// ── EIN Gedanke pro Blase (Feinschliff II) ───────────────────────
// Spikiu trennt verschiedene Gedanken/Repliken mit einer Zeile, die NUR --- (oder —)
// enthält. Wir splitten daran in Segmente → jedes wird eine eigene Sprechblase (mit
// eigenem splitBridge/🔊/Übersetzungs-Kästchen). Das rohe --- wird NIE gezeigt.
// Reihenfolge: [WECHSEL] ist in turn() schon raus → hier ----Split → pro Segment [[…]].
function splitThoughts(text){
  var lines = (text||'').split('\n');
  var dashOnly = /^[ \t]*(?:-{3,}|—)[ \t]*$/;   // ganze Zeile nur Striche
  var segs = [], cur = [];
  for (var i=0;i<lines.length;i++){
    if (dashOnly.test(lines[i])){ segs.push(cur.join('\n')); cur = []; }
    else cur.push(lines[i]);
  }
  segs.push(cur.join('\n'));
  return segs.map(function(s){ return s.trim(); }).filter(function(s){ return s.length; });
}
// Klartext für die Stimme: Emphasis-Marker raus (🔊 spricht keine Unterstriche/Sterne)
function plainForSpeech(s){
  s = (s||'');
  s = s.replace(/\*\*([^*]+)\*\*/g,'$1');
  s = s.replace(/\*([^*\n]+)\*/g,'$1');
  s = s.replace(/(^|[^\w])_(?=\S)([^_\n]*?\S)_(?!\w)/g,'$1$2');
  return s.trim();
}

// [KORREKTUR]…[/KORREKTUR] → Paare {said, better}. Zeilen der Form „so gesagt -> besser".
function extractKorrektur(t){
  var m = (t||'').match(/\[KORREKTUR\]([\s\S]*?)\[\/KORREKTUR\]/i);
  if(!m) return { text:t, pairs:[] };
  var pairs = [];
  m[1].split('\n').forEach(function(line){
    var halves = line.split(/\s*(?:->|→|=>)\s*/);
    if(halves.length === 2 && halves[0].trim() && halves[1].trim()){
      pairs.push({ said: halves[0].trim(), better: halves[1].trim() });
    }
  });
  var clean = (t||'').replace(/\[KORREKTUR\][\s\S]*?\[\/KORREKTUR\]/i,' ')
    .replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n').replace(/\n{3,}/g,'\n\n').trim();
  return { text:clean, pairs:pairs.slice(0,3) };   // max 3 Paare

var SZENE_RE = /\s*\[SZENENENDE\]\s*/i;
function extractSceneEnd(t){
  if(!SZENE_RE.test(t||'')) return { text:t, ended:false };
  return { text:(t||'').replace(SZENE_RE,' ').trim(), ended:true };
}
// [OPTIONEN]…[/OPTIONEN] → 2–3 Lerner-Antworten (Zielsprache). Signal NIE roh zeigen;
// auch verirrte/halbe Tags werden gestrippt. Nur im geführten Modus gerendert.
function extractOptionen(t){
  t = t || '';
  var m = t.match(/\[OPTIONEN\]([\s\S]*?)\[\/OPTIONEN\]/i);
  var optionen = m ? m[1].split('\n')
    .map(function(l){ return l.replace(/\[\[[\s\S]*?\]\]/g,'').trim(); })   // ein evtl. [[…]] je Zeile raus
    .filter(function(l){ return l.length; })
    .slice(0, 3) : [];
  var clean = t.replace(/\[OPTIONEN\][\s\S]*?\[\/OPTIONEN\]/ig, ' ')
    .replace(/\[\/?OPTIONEN\]/ig, ' ')   // halbe/verirrte Tags nie roh zeigen
    .replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n').replace(/\n{3,}/g,'\n\n').trim();
  return { text: clean, optionen: optionen };
}

// ── Erklärkarte: Meta-Fragen im Gespräch (17.08.2026) ──────────────────
// Fragt der Lerner ÜBER die Sprache statt IN ihr („Was heißt das?"), antwortet
// Spikiu mit [KARTE:typ]…[/KARTE] statt mit einer Gesprächsblase. Grund: die
// Blase kennt nur EIN Format (Zielsprache + [[Übersetzung]]); eine Erklärung
// passt nicht hinein und landete gemischt im Audio-Feld.
//
//   [KARTE:satz]
//   z: Πρέπει να φύγω τώρα.
//   tr: prépi na fígo tóra
//   na: Ich muss jetzt gehen.
//   --
//   πρέπει | prépi | es ist nötig
//   να | na | dass
//   [/KARTE]
//
// Typen: wort · satz · grammatik · ausdruck. Der --Block nur bei satz (max 5).
var ERK_TYPEN = { wort:1, satz:1, grammatik:1, ausdruck:1 };
var ERK_UI = {
  de:{ braue:{wort:'Wort', satz:'Satz', grammatik:'Warum das so ist', ausdruck:'So sagt man das'},
       glieder:'Stück für Stück', zurueck:'Zurück ins Gespräch' },
  es:{ braue:{wort:'Palabra', satz:'Frase', grammatik:'Por qué es así', ausdruck:'Así se dice'},
       glieder:'Parte por parte', zurueck:'Volver a la conversación' },
  en:{ braue:{wort:'Word', satz:'Sentence', grammatik:'Why it works this way', ausdruck:'How to say it'},
       glieder:'Piece by piece', zurueck:'Back to the conversation' }
};
function erkUI(){ return ERK_UI[uiLang()] || ERK_UI.de; }

function extractKarte(text){
  var m = (text||'').match(/\[KARTE:\s*([a-zA-ZäöüÄÖÜ]+)\s*\]([\s\S]*?)\[\/KARTE\]/);
  if (!m) return { text: text, karte: null };
  var typ = String(m[1]).toLowerCase();
  var rest = (text||'').replace(m[0], ' ').replace(/[ \t]+/g,' ').trim();
  if (!ERK_TYPEN[typ]) return { text: text, karte: null };   // unbekannt → roher Pfad

  var roh = m[2] || '';
  var teile = roh.split(/^\s*--\s*$/m);
  var kopf = teile[0] || '', gliederRoh = teile[1] || '';

  var K = { kartentyp: typ, glieder: [] };
  kopf.split('\n').forEach(function(zeile){
    var f = zeile.match(/^\s*([a-zA-Z]+)\s*:\s*([\s\S]*?)\s*$/);
    if (!f) return;
    var schl = f[1].toLowerCase();
    if (['z','tr','na','regel','bz','btr','bna','wann'].indexOf(schl) !== -1) K[schl] = f[2];
  });

  if (typ === 'satz' && gliederRoh){
    gliederRoh.split('\n').forEach(function(zeile){
      if (K.glieder.length >= 5) return;                      // harte Grenze: 5
      if (zeile.indexOf('|') === -1) return;
      var sp = zeile.split('|');
      var g = { z:(sp[0]||'').trim(), tr:(sp[1]||'').trim(), na:(sp[2]||'').trim() };
      if (g.z && g.na) K.glieder.push(g);
    });
  }

  // Mindestbedingung je Typ. Fehlt sie, gilt die Karte als kaputt und der
  // bestehende Malformed-Pfad zeigt lieber rohen Text als eine leere Folie.
  var ok = (typ === 'grammatik') ? !!K.regel : (!!K.z && !!K.na);
  if (!ok) return { text: text, karte: null };

  return { text: rest, karte: K };
}

  wrap.appendChild(sp);

  return wrap;
}

var reelActive = false;

// ── Horizontales Karten-Deck (Teil 46): EINE Karte pro Screen ──────────────
// Die Slides liegen absolut übereinander; reelIndex zeigt die aktuelle Karte.
// Vorrücken (← wischen / Tipp auf Spikiu-Karte) schiebt sie nach links, die
// nächste kommt von rechts. Kein vertikaler Stapel mehr.
var reelIndex = 0;
function reelSlides(){ var r = reelEl(); return r ? r.querySelectorAll('.reel-slide') : []; }
// ── ZENTRALE Auto-Fit: skaliert den Haupttext jeder Reel-Karte, damit er immer
//    sauber in die Karte passt. Kurz = gross, lang = schrumpft automatisch.
//    Ein Ort, eine Regel — statt fixer Groessen pro Element. ──
function fitSlide(slide){
  if (!slide) return;
  var mains = slide.querySelectorAll('.reel-line, .hap-flip .hap-ziel, .hap-back-trans, .hv-q, .reel-learner-head, .rp-ziel, .erk-z, .erk-glied-z');
  var opts  = slide.querySelectorAll('.hv-opt');   // Antwort-Chips folgen jetzt auch der Regel
  if (!mains.length && !opts.length) return;
  var start = Math.min(60, Math.max(32, Math.round((slide.clientWidth||360) * 0.15)));
  var min = 27, px = start, guard = 0;
  function apply(v){
    var j, ov = Math.max(23, Math.round(v * 0.78));   // Chips ~78% der Hauptgroesse, nie unter 23px
    for (j = 0; j < mains.length; j++) mains[j].style.setProperty('font-size', v + 'px', 'important');
    for (j = 0; j < opts.length; j++)  opts[j].style.setProperty('font-size', ov + 'px', 'important');
  }
  apply(px);
  while (slide.scrollHeight > slide.clientHeight - 4 && px > min && guard < 70){
    px -= 1.5; apply(px); guard++;
  }
}
function reelLayout(){
  var slides = reelSlides(); if (!slides.length) return;
  if (reelIndex > slides.length - 1) reelIndex = slides.length - 1;
  if (reelIndex < 0) reelIndex = 0;
  for (var i = 0; i < slides.length; i++){
    var s = slides[i];
    s.classList.remove('reel-current','reel-past','reel-next');
    s.classList.add(i < reelIndex ? 'reel-past' : (i === reelIndex ? 'reel-current' : 'reel-next'));
    if (i !== reelIndex){ var hf = s.querySelector('.hap-flip'); if (hf) hf.classList.remove('flipped'); }  // Teil 60: neu erreichte Karte zeigt die Vorderseite
  }
  var __cur = slides[reelIndex];
  if (__cur){ if (window.requestAnimationFrame) requestAnimationFrame(function(){ fitSlide(__cur); }); else fitSlide(__cur); }
}
function reelGoTo(i){ reelIndex = i; reelLayout(); }
function reelAdvance(){ if (reelIndex < reelSlides().length - 1){ reelIndex++; reelLayout(); } }
function reelBack(){ if (reelIndex > 0){ reelIndex--; reelLayout(); } }
function scrollReelToEnd(){ reelGoTo(reelSlides().length - 1); }   // „letzte Karte zeigen" (Typing/Fehler)
// Wischen (←/→) + Tipp auf Spikiu-/Korrektur-Karten = weiter. Lerner-/Endmenü-Karten:
// per Tipp wählen/senden (kein Wisch-Weiter). Einmalig an das statische #reel gebunden.
function bindReelGestures(){
  var reel = reelEl(); if (!reel || reel.__spkReelBound) return;
  reel.__spkReelBound = true;
  window.addEventListener('resize', function(){ if (reelSlides().length) reelLayout(); });
  var x0 = null, y0 = null;
  reel.addEventListener('touchstart', function(e){ var t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; }, { passive:true });
  reel.addEventListener('touchend', function(e){
    if (x0 == null) return;
    var t = e.changedTouches[0]; var dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if (Math.abs(dx) < 45 || Math.abs(dy) > Math.abs(dx)) return;     // nur klar horizontale Wische
    var cur = reelSlides()[reelIndex];
    if (dx < 0){ if (cur && (cur.classList.contains('reel-learner') || cur.classList.contains('reel-endmenu'))) return; reelAdvance(); }   // Teil 59: Häppchen jetzt auch vorwärts wischbar (vor/zurück symmetrisch)
    else reelBack();                                                   // nach rechts = nur zurückblättern (lesen)
  }, { passive:true });
  reel.addEventListener('click', function(e){
    if (e.target.closest('button, textarea, input, a')) return;       // 🔊/Karten/Senden/Textfeld nicht stören
    var cur = reelSlides()[reelIndex]; if (!cur) return;
    if (cur.classList.contains('reel-learner') || cur.classList.contains('reel-endmenu') || cur.classList.contains('reel-haeppchen')) return;
    reelAdvance();                                                    // Tipp auf Spikiu-/Korrektur-Karte = weiter
  });
}

// Spikiu-Slide: kleiner vollständiger Capy + große Zielsprachen-Zeile + 🔊 + Übersetzung.

// Sie sind der Anker: Spikiu bekommt je Zug nur die OFFENE Aufgabe als
// Anweisung. Deshalb kann die Szene nicht entgleisen, egal was der Lerner
// einwirft. Harte Decke bei sechs Zügen — die Kosten sind fest begrenzt.
var SZENE_ZUG_DECKEL = 6;
// Ein Schalter statt vieler Enden: sobald die Szene beendet ist, rendert

// Karte nach, und je nach Weg landete der Lerner woanders (19.08.2026).
var szeneBeendet = false;
var szeneAufgaben = [];   // [{de,en}] aus lernpfad-daten.js
var szeneOffen = 0;       // Index der offenen Aufgabe
var szeneZug = 0;         // Spikiu-Züge in dieser Szene

var szeneBeispiele = [];   // die Skriptzeilen des Lerners — der Souffleur
// Der erste Zug ist der Themen-Wunsch („Ich möchte das Thema … üben"), nicht
// die Antwort auf eine Aufgabe. Zählte er mit, sprang die Anzeige auf
// „Aufgabe 2 von 3", bevor Spikiu überhaupt gesprochen hatte — und der
// Souffleur bot den Satz zur falschen Aufgabe an (19.08.2026).

  szeneAufgaben = []; szeneBeispiele = []; szeneOffen = 0; szeneZug = 0;

    var S = D.station(st, TOPIC_ID);

  } catch(e){ szeneAufgaben = []; szeneBeispiele = []; }

function appendSpikiuSlide(ziel, trans){
  var reel = reelEl(); if (!reel) return;
  var slide = document.createElement('div');
  slide.className = 'reel-slide reel-spikiu';
  slide.innerHTML = '<div class="reel-capy" aria-hidden="true">' + CAPY_SMALL + '</div>'
    + '<div class="reel-body"><div class="reel-line">' + fmt(ziel)
    + '<button class="speak-btn reel-speak" type="button" aria-label="Vorlesen">' + SPK_ICON + '</button></div>'
    + (trans ? '<div class="reel-trans">' + fmt(trans) + '</div>' : '')
    + '</div>'
    + '<div class="reel-hint">' + escPlain(reelUI().swipe) + '</div>';
  // Kopfzeile: Rolle links, Stift und Beenden rechts. Feste Höhe — sie wächst
  // nie mit dem Satz, egal wie lang er wird. Nur im freien Flur.
  if (!gefuehrt){
    var ui2 = reelUI();
    var kopf = document.createElement('div');
    kopf.className = 'reel-kopf';
    var rolle = document.createElement('div');
    rolle.className = 'rk-rolle';
    rolle.textContent = szenenRolle();
    kopf.appendChild(rolle);
    if (offenerEcho){
      // Der Lerner weiß, was er getippt hat — ein Stift genügt statt des Echos.
      var stift = document.createElement('button');
      stift.type = 'button'; stift.className = 'rk-btn'; stift.textContent = '\u270e';
      stift.title = editUI().edit;
      stift.dataset.userText = offenerEcho;
      stift.onclick = function(){ reelEditStart(stift); };
      kopf.appendChild(stift);
      offenerEcho = null;
    }
    var xb = document.createElement('button');
    xb.type = 'button'; xb.className = 'rk-btn'; xb.textContent = '\u2715';
    xb.title = ui2.end; xb.onclick = reelEnd;
    kopf.appendChild(xb);
    slide.insertBefore(kopf, slide.firstChild);

    // Übersetzung erst auf Tippen: der Lerner soll erst raten.
    var tr = slide.querySelector('.reel-trans');
    if (tr){
      tr.style.display = 'none';
      var uez = document.createElement('button');
      uez.type = 'button'; uez.className = 'reel-uez';
      uez.textContent = ui2.uebersetzung;
      uez.onclick = function(){ tr.style.display = ''; uez.remove(); fitSlide(slide); };
      tr.parentNode.insertBefore(uez, tr);
    }

  if (!gefuehrt){
    // Aufgabe GANZ OBEN, direkt nach der Kopfzeile.
    var auf2 = renderAufgabeJetzt();
    if (auf2){
      var kopfEl = slide.querySelector('.reel-kopf');
      if (kopfEl) kopfEl.after(auf2); else slide.insertBefore(auf2, slide.firstChild);

  if (sb) sb.onclick = function(){ playFrom(sb, plainForSpeech(ziel), 'playing'); };
  // War der letzte Lerner-Zug ein mutmaßlicher Vertipper, bekommt Spikius
  // Antwort einen direkten Weg zurück. Ohne ihn müsste der Nutzer erst
  // begreifen, dass er zurückwischen kann (Beobachtung 18.08.2026).
  if (reelSendVerdaechtig){
    reelSendVerdaechtig = false;
    var kb = document.createElement('button');
    kb.type = 'button'; kb.className = 'reel-korr'; kb.textContent = warnUI().korr;
    kb.onclick = reelKorrigieren;
    slide.querySelector('.reel-body').appendChild(kb);
  }
  reel.appendChild(slide);
}

var offenerEcho = null;   // der Zug des Lerners, der auf Spikius nächste Karte gehört

function appendUserSlide(text){
  var reel = reelEl(); if (!reel) return;
  // Freier Flur: KEINE eigene Karte. Der Zug erscheint klein auf Spikius
  // Antwortkarte — sonst liegt zwischen Frage und Antwort eine gelbe
  // Zwischenkarte, die den Fluss zerschneidet.
  if (!gefuehrt){ offenerEcho = text; return; }

  // Nur im freien Flur: der Zug lässt sich nachträglich korrigieren. Im geführten
  // Modus sind die Züge Tipps auf Karten, da gibt es nichts zu tippen.
  if (!gefuehrt){
