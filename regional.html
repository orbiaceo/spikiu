<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spikiu · Regionalismos</title>
<link rel="stylesheet" href="/fonts/spikiu-fonts.css">
<style>
:root{--bg:#eef7f1;--ink:#15163a;--read:#2b2621;--muted:#6b6154;--acc:#1f93b0;--ow:2.5px;
  --paper:#fff;--soft:#f6f1e6;--wasser:#cfe7e6;--nachbar:#e6ebe3;--heim:#f4efe2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;line-height:1.5;display:flex;justify-content:center}
@media (min-width:700px) and (min-height:560px){
 html{font-size:17px}
 body{background:#15163a;background-image:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1px);background-size:22px 22px;padding:24px;align-items:center}
 .app{width:min(460px,94vw);height:min(880px,90vh);border-radius:28px;box-shadow:9px 11px 0 rgba(0,0,0,.22);border:2.5px solid var(--ink)}
}
.app{position:relative;display:flex;flex-direction:column;height:100dvh;width:100%;background:var(--bg);overflow:hidden}
.kopf{flex:0 0 auto;background:rgba(255,255,255,.72);border-bottom:var(--ow) solid var(--ink);padding:calc(.6rem + env(safe-area-inset-top)) .9rem .6rem;display:flex;align-items:center;gap:.6rem}
.back{width:36px;height:36px;flex:0 0 auto;border-radius:999px;border:var(--ow) solid var(--ink);background:#fff;font-size:1.2rem;cursor:pointer;box-shadow:2px 2px 0 var(--ink);color:var(--ink)}
.back:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.tt{flex:1;text-align:center;padding-right:36px;min-width:0}
.tt .rk{font:500 .58rem/1 'DM Mono',monospace;letter-spacing:.2em;color:var(--acc);text-transform:uppercase}
.tt h1{font-family:'Archivo Black',sans-serif;font-size:1.12rem;margin:.1rem 0 0;text-wrap:balance}
.punkte{display:flex;gap:5px;justify-content:center;margin-top:.35rem}
.punkte i{width:20px;height:5px;border-radius:3px;background:#cfd9d2;transition:background .2s}
.punkte i.an{background:var(--ink)}
.buehne{flex:1;overflow-y:auto;padding:1rem 1rem 2rem;-webkit-overflow-scrolling:touch}
.schritt{display:flex;flex-direction:column;gap:1rem;animation:rein .28s ease-out}
@keyframes rein{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
.capy{flex:0 0 auto}
.spikiu{display:flex;gap:.55rem;align-items:flex-end}
.spikiu .capy{width:52px;height:52px}
.blase{background:#fff;border:2px solid var(--ink);border-radius:16px 16px 16px 4px;padding:.55rem .8rem;font-size:.97rem;line-height:1.4;box-shadow:3px 3px 0 var(--ink);min-width:0}

/* Schritt 1 · Karte */
.karte-wrap{background:var(--wasser);border:var(--ow) solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 var(--ink);overflow:hidden}
.karte-wrap svg{display:block;width:100%;height:auto;touch-action:manipulation}
.nachbar{fill:var(--nachbar);stroke:#b3bfb8;stroke-width:.6;stroke-linejoin:round}
.heim{fill:var(--heim);stroke:#9aa59e;stroke-width:.7;stroke-linejoin:round}
.land{cursor:pointer}
.land path{fill:var(--paper);stroke:var(--ink);stroke-width:1.1;stroke-linejoin:round;transition:fill .18s}
.land.an path{stroke-width:1.6}
.land:focus{outline:none}
.land:focus-visible path{stroke:var(--acc);stroke-width:3}
.pille rect{fill:var(--paper);stroke:var(--ink);stroke-width:1.8}
.pille .sch{fill:var(--ink);stroke:none}
.pille text{font:800 11px 'DM Sans',system-ui,sans-serif;fill:var(--ink)}
.meer{pointer-events:none;font:500 8.5px 'DM Mono',monospace;letter-spacing:.28em;fill:#5f8f88}
.ausschnitt{fill:var(--wasser)}
.ausschnitt-rand{fill:none;stroke:var(--ink);stroke-width:1.6}
.ausschnitt-titel{font:500 8px 'DM Mono',monospace;letter-spacing:.16em;fill:#4c7770;text-transform:uppercase}
.ausschnitt-quelle{fill:none;stroke:var(--ink);stroke-width:1;stroke-dasharray:3 2}
.gewaehlt{display:flex;flex-wrap:wrap;gap:.35rem;min-height:2rem;align-items:center}
.gewaehlt .leer{color:var(--muted);font-size:.92rem}
.rchip{border:2px solid var(--ink);border-radius:999px;padding:.2rem .65rem;font:800 .85rem/1.2 'DM Sans';display:inline-flex;gap:.3rem;align-items:center}
.links{display:flex;gap:1.1rem}
.link{background:none;border:none;color:var(--acc);font:700 .92rem 'DM Sans';cursor:pointer;padding:.2rem 0;text-decoration:underline;text-underline-offset:3px}
.weiter{border:var(--ow) solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;padding:.85rem 1rem;font:800 1.05rem 'DM Sans';cursor:pointer;box-shadow:3px 3px 0 var(--acc);width:100%}
.weiter:disabled{background:#c9d3cd;color:#6f7a74;box-shadow:none;border-color:#aeb9b3;cursor:default}
.weiter:focus-visible,.tuer:focus-visible,.kachel:focus-visible,.back:focus-visible,.ton:focus-visible,.nav-k:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* Schritt 2 · Türen */
.tueren{display:grid;gap:.85rem}
.tuer{display:flex;align-items:center;gap:1rem;text-align:left;background:#fff;border:var(--ow) solid var(--ink);border-radius:20px;padding:1.1rem 1rem;box-shadow:4px 4px 0 var(--ink);cursor:pointer;color:var(--ink);font-family:'DM Sans'}
.tuer:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.tuer .sym{width:64px;height:64px;flex:0 0 auto;border-radius:16px;display:grid;place-items:center;font-size:2rem;border:2px solid var(--ink)}
.tuer b{display:block;font:1.15rem/1.2 'Archivo Black',sans-serif}
.tuer .u{display:block;color:var(--muted);font-size:.92rem;margin-top:.2rem}

/* Schritt 3 · Themen */
.kacheln{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.kachel{background:#fff;border:var(--ow) solid var(--ink);border-radius:18px;padding:.9rem .7rem;box-shadow:3px 3px 0 var(--ink);cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;font-family:'DM Sans';text-align:left}
.kachel:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.kachel .em{font-size:1.7rem;line-height:1}
.kachel b{font:800 1rem/1.2 'DM Sans'}
.kachel small{font:500 .72rem 'DM Mono',monospace;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.kachel.gemischt{background:var(--soft)}
.kachel:disabled{opacity:.45;cursor:default;box-shadow:none}

/* Schritt 4 · eine Karte nach der anderen */
.auswahl{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;font-size:.85rem}
.auswahl .rchip{font-size:.75rem;padding:.12rem .5rem}
.auswahl .tag{font:500 .7rem 'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.leiste{height:6px;border-radius:3px;background:#d6e2db;overflow:hidden}
.leiste i{display:block;height:100%;background:var(--acc);transition:width .25s}
.wk{background:#fff;border:var(--ow) solid var(--ink);border-radius:22px;box-shadow:4px 4px 0 var(--ink);padding:1.1rem 1rem 1rem;display:flex;flex-direction:column;gap:.8rem}
.wk-kopf{display:flex;align-items:center;gap:.8rem}
.wk-bild{width:62px;height:62px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:2.1rem;flex:0 0 auto}
.wk-bild img{width:52px;height:52px}
.wk-tt{font:1.25rem/1.2 'Archivo Black',sans-serif}
.wk-kat{font:500 .66rem/1 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:.3rem}
.vergleich{display:grid;gap:.55rem}
.zeile{display:flex;align-items:center;gap:.7rem;border:2px solid var(--ink);border-radius:16px;padding:.55rem .55rem .55rem .8rem}
.zeile .w{flex:1;min-width:0}
.zeile .wort{font:600 1.35rem/1.25 'Lora',serif;color:var(--read);overflow-wrap:anywhere}
.zeile .laut{display:block;font:500 .82rem/1.3 'DM Mono',monospace;color:var(--muted)}
.zeile .wer{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.25rem}
.zeile .wer span{font:800 .72rem/1.4 'DM Sans';border:1.5px solid var(--ink);border-radius:999px;padding:0 .45rem}
.ton{width:44px;height:44px;flex:0 0 auto;border-radius:999px;border:2px solid var(--ink);background:var(--acc);cursor:pointer;display:grid;place-items:center;box-shadow:2px 2px 0 var(--ink)}
.ton svg{width:22px;height:22px}
.ton.spielt{animation:puls 1s ease infinite}
@keyframes puls{50%{transform:scale(1.1)}}
.witz{display:flex;gap:.55rem;align-items:flex-start;background:var(--bg);border-radius:14px;padding:.6rem .7rem;font-size:.95rem;line-height:1.4}
.witz .capy{width:32px;height:32px}
.hinweis{font-size:.88rem;color:var(--muted);line-height:1.4}
.erkl{font-size:1rem;line-height:1.5;color:var(--read)}
.nav{display:flex;align-items:center;gap:.7rem}
.nav-k{width:52px;height:52px;border-radius:999px;border:var(--ow) solid var(--ink);background:#fff;font-size:1.3rem;cursor:pointer;box-shadow:2px 2px 0 var(--ink);color:var(--ink)}
.nav-k:disabled{opacity:.3;cursor:default;box-shadow:none}
.nav-k.vor{background:var(--ink);color:#fff;box-shadow:2px 2px 0 var(--acc)}
.zaehler{flex:1;text-align:center;font:500 .85rem 'DM Mono',monospace;color:var(--muted);font-variant-numeric:tabular-nums}
.ende{text-align:center;display:flex;flex-direction:column;gap:.8rem;align-items:center;padding-top:1rem}
.ende .capy{width:90px;height:90px}
.ende h2{font:1.3rem 'Archivo Black',sans-serif;margin:0}
.ende p{margin:0}
.knopf2{border:var(--ow) solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:.7rem 1.2rem;font:800 1rem 'DM Sans';cursor:pointer;box-shadow:2px 2px 0 var(--ink);width:100%}
.leer-box{text-align:center;padding:1.5rem 1rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.schritt,.ton.spielt{animation:none}}
</style>
</head>
<body>
<div class="app">
  <div class="kopf"><button class="back" id="zurueck" type="button" aria-label="zurück">‹</button>
    <div class="tt"><div class="rk" id="rk"></div><h1 id="titel">Regional</h1>
      <div class="punkte" id="punkte" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div></div>
  <div class="buehne" id="buehne"></div>
</div>

<script type="module">
  import { speak, warm } from '/audio.js';
  window.spkSpeak = speak;
  window.spkWarm  = warm;
  try { var pr = JSON.parse(localStorage.getItem('spikiu_user') || '{}').profile || {}; warm(pr.zielsprache || 'es'); } catch (e) {}
</script>

  function datenReihe(ids) { var alle = DB.regionen.map(function (r) { return r.id; }); return ids.slice().sort(function (a, b) { return alle.indexOf(a) - alle.indexOf(b); }); }

  // ── Vorlesen mit audio.js (Piper), Fallback Browser-Stimme ──
  function sprich(text, knopf) {
    knopf.classList.add('spielt');
    var fertig = function () { knopf.classList.remove('spielt'); };
    try {
      if (window.spkSpeak) { var p = window.spkSpeak(text, ZIEL); if (p && p.then) { p.then(fertig, fertig); return; } fertig(); return; }
    } catch (e) {}
    try {
      var syn = window.speechSynthesis;
      if (syn && typeof SpeechSynthesisUtterance !== 'undefined') {
        var u = new SpeechSynthesisUtterance(String(text));
        u.lang = { de:'de-DE', es:'es-ES', en:'en-US', el:'el-GR' }[ZIEL] || 'en-US';
        u.onend = fertig; u.onerror = fertig; syn.cancel(); syn.speak(u); return;
      }
    } catch (e) {}
    fertig();
  }

  function bildHtml(en, em) {
    var I = window.spikiuIcon, e = (I && en) ? I.konzept(en) : '';
    if (e) return '<img src="' + esc(I.datei(e)) + '" alt="" loading="lazy">';
    return em ? '<span aria-hidden="true">' + esc(em) + '</span>' : '';
  }
  function spikiu(html) { return '<div class="spikiu">' + CAPY + '<div class="blase">' + html + '</div></div>'; }
  function rchip(r, kurz) { return '<span class="rchip" style="background:' + esc(r.farbe) + '">' + esc(r.em || '') + ' ' + esc(kurz ? r.kurz : ohneKlammer(inUi(r.name))) + '</span>'; }

  /* ── Karten-Stapel nach Auswahl ──
     KONTRAST STATT WIEDERHOLUNG (Leo, 16.10.): jedes WORT nur einmal, daneben alle
     gewählten Gegenden, die es sagen; „fegen / kehren" zählt für beide Wörter;
     sagen alle gewählten Gegenden dasselbe, fällt die Karte weg. */
  function gruppen(w) {
    var map = {}, liste = [];
    datenReihe(zustand.regionen).forEach(function (rid) {
      var v = w.varianten[rid]; if (!v) return;
      String(v).split(/\s*[\/·]\s*/).forEach(function (teil) {
        teil = teil.trim(); if (!teil) return;
        var k = teil.toLowerCase();
        if (!map[k]) { map[k] = { wort: teil, regionen: [] }; liste.push(map[k]); }
        if (map[k].regionen.indexOf(rid) === -1) map[k].regionen.push(rid);
      });
    });
    return liste;
  }
  function wortStapel(kat) {
    return DB.woerter.map(function (w, i) { return { art: 'wort', w: w, i: i, gr: gruppen(w) }; })
      .filter(function (x) { return (kat === 'alle' || x.w.kat === kat) && x.gr.length > 1; })
      .sort(function (x, y) { return (y.gr.length - x.gr.length) || (x.i - y.i); });
  }
  function lautStapel() {
    var out = [];
    DB.aussprache.forEach(function (a) {
      var bsp = a.beispiele.filter(function (b) { return gewaehlt(b.region); });
      if (bsp.length) out.push({ art: 'laut', a: a, bsp: bsp });
    });
    return out;
  }
  function stapelBauen() { stapel = zustand.art === 'laut' ? lautStapel() : wortStapel(zustand.kat || 'alle'); }

  function punkte() {
    var p = document.querySelectorAll('#punkte i');
    for (var i = 0; i < p.length; i++) p[i].classList.toggle('an', i < zustand.schritt);
  }
  function geh(s) {
    zustand.schritt = s;
    if (s === 4) stapelBauen();
    punkte(); buehne.scrollTop = 0;
    [null, schritt1, schritt2, schritt3, schritt4][s]();
    sichern();
  }

  /* ── Schritt 1 · echte Landkarte ── */
  function schildText(rid) {
    var r = regionVon(rid), k = KARTE.schild && KARTE.schild.kurz && KARTE.schild.kurz[rid];
    return k ? inUi(k) : ohneKlammer(inUi(r.name));
  }
  function pille(rid, c) {
    var r = regionVon(rid), an = gewaehlt(rid), v = (KARTE.schild && KARTE.schild.versatz && KARTE.schild.versatz[rid]) || [0, 0];
    var txt = schildText(rid) + (an ? ' ✓' : ''), w = Math.round(txt.length * 6.3 + 30), h = 22;
    var x = c[0] + v[0] - w / 2, y = c[1] + v[1] - h / 2;
    return '<g class="land pille-g' + (an ? ' an' : '') + '" data-r="' + esc(rid) + '" aria-hidden="true"><g class="pille" transform="translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ')">'
      + '<rect class="sch" x="2" y="2" width="' + w + '" height="' + h + '" rx="11"/>'
      + '<rect width="' + w + '" height="' + h + '" rx="11"' + (an ? ' style="fill:' + esc(r.farbe) + '"' : '') + '/>'
      + '<text x="9" y="15.5">' + esc(r.em || '') + ' ' + esc(txt) + '</text></g></g>';
  }
  function landG(rid, teile) {
    var r = regionVon(rid); if (!r) return '';
    var an = gewaehlt(rid);
    return '<g class="land' + (an ? ' an' : '') + '" tabindex="0" role="checkbox" aria-checked="' + an + '" aria-label="' + esc(ohneKlammer(inUi(r.name))) + '" data-r="' + esc(rid) + '">'
      + teile.map(function (d) { return '<path d="' + d + '"' + (an ? ' style="fill:' + esc(r.farbe) + '"' : '') + '/>'; }).join('') + '</g>';
  }
  function hinter(ctx) { return ctx.map(function (d) { return d.charAt(0) === '§' ? '<path class="nachbar" d="' + d.slice(1) + '"/>' : '<path class="heim" d="' + d + '"/>'; }).join(''); }
  function karteSvg() {
    var M = KARTE, s = '<svg viewBox="0 0 ' + M.w + ' ' + M.h + '" role="group" aria-label="' + esc(T.karteLabel) + '">';
    s += hinter(M.main.ctx);
    Object.keys(M.main.reg).forEach(function (rid) { s += landG(rid, M.main.reg[rid]); });
    (M.meere || []).forEach(function (m) { s += '<text class="meer" x="' + m[1] + '" y="' + m[2] + '">' + esc(inUi(m[0])) + '</text>'; });
    if (M.inset) {
      var I = M.inset;
      if (I.quelle) {
        var q = I.quelle;
        s += '<rect class="ausschnitt-quelle" x="' + q[0][0] + '" y="' + q[0][1] + '" width="' + (q[1][0] - q[0][0]) + '" height="' + (q[1][1] - q[0][1]) + '"/>'
          + '<line class="ausschnitt-quelle" x1="' + ((q[0][0] + q[1][0]) / 2) + '" y1="' + q[1][1] + '" x2="' + (I.x + I.w / 2) + '" y2="' + I.y + '"/>';
      }
      s += '<clipPath id="ausschnitt-clip"><rect x="' + I.x + '" y="' + I.y + '" width="' + I.w + '" height="' + I.h + '" rx="8"/></clipPath>'
        + '<rect class="ausschnitt" x="' + I.x + '" y="' + I.y + '" width="' + I.w + '" height="' + I.h + '" rx="8"/>'
        + '<g clip-path="url(#ausschnitt-clip)">' + hinter(I.ctx);
      Object.keys(I.reg).forEach(function (rid) { s += landG(rid, I.reg[rid]); });
      s += '</g><rect class="ausschnitt-rand" x="' + I.x + '" y="' + I.y + '" width="' + I.w + '" height="' + I.h + '" rx="8"/>';
      if (I.titel) s += '<text class="ausschnitt-titel" x="' + (I.x + 7) + '" y="' + (I.y + I.h - 6) + '">' + esc(inUi(I.titel)) + '</text>';
    }
    // Namensschilder zuletzt: liegen über allem und sind selbst antippbar (kleine Gegenden).
    Object.keys(M.main.reg).forEach(function (rid) { if (regionVon(rid)) s += pille(rid, M.main.cen[rid]); });
    if (M.inset) Object.keys(M.inset.reg).forEach(function (rid) { if (regionVon(rid)) s += pille(rid, M.inset.cen[rid]); });
    return s + '</svg>';
  }
  function schritt1() {
    var n = zustand.regionen.length;
    buehne.innerHTML = '<section class="schritt">'
      + spikiu(T.s1)
      + (KARTE ? '<div class="karte-wrap">' + karteSvg() + '</div>' : '')
      + '<div class="gewaehlt">' + (n ? datenReihe(zustand.regionen).map(function (id) { return rchip(regionVon(id)); }).join('') : '<span class="leer">' + esc(T.nichts) + '</span>') + '</div>'
      + '<div class="links"><button class="link" type="button" id="alle">' + esc(T.alle) + '</button>'
      + (n ? '<button class="link" type="button" id="keine">' + esc(T.leeren) + '</button>' : '') + '</div>'
      + '<button class="weiter" type="button" id="w1"' + (n < 2 ? ' disabled' : '') + '>' + esc(n < 2 ? T.fehlt(2 - n) : T.weiter) + '</button>'
      + '</section>';
    [].forEach.call(buehne.querySelectorAll('.land'), function (g) {
      var umschalten = function () {
        var id = g.getAttribute('data-r'), k = zustand.regionen.indexOf(id);
        if (k < 0) zustand.regionen.push(id); else zustand.regionen.splice(k, 1);
        var y = buehne.scrollTop; schritt1(); buehne.scrollTop = y; sichern();
        var el = buehne.querySelector('.land[tabindex="0"][data-r="' + id + '"]'); if (el && g.hasAttribute('tabindex')) el.focus({ preventScroll: true });
      };
      g.addEventListener('click', umschalten);
      g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); umschalten(); } });
    });
    document.getElementById('alle').onclick = function () { zustand.regionen = DB.regionen.map(function (r) { return r.id; }); schritt1(); sichern(); };
    var k = document.getElementById('keine'); if (k) k.onclick = function () { zustand.regionen = []; schritt1(); sichern(); };
    document.getElementById('w1').onclick = function () { geh(2); };
  }

  /* ── Schritt 2 · Wörter oder Aussprache ── */
  function schritt2() {
    buehne.innerHTML = '<section class="schritt">'
      + spikiu(esc(T.s2))
      + '<div class="gewaehlt">' + datenReihe(zustand.regionen).map(function (id) { return rchip(regionVon(id)); }).join('') + '</div>'
      + '<div class="tueren">'
      + '<button class="tuer" type="button" data-a="wort"><span class="sym" style="background:#F7E3B0">🗣️</span><span><b>' + esc(T.woerter) + '</b><span class="u">' + esc(T.woerterU) + '</span></span></button>'
      + '<button class="tuer" type="button" data-a="laut"><span class="sym" style="background:#B8E2EC">👂</span><span><b>' + esc(T.laut) + '</b><span class="u">' + esc(T.lautU) + '</span></span></button>'
      + '</div></section>';
    [].forEach.call(buehne.querySelectorAll('.tuer'), function (b) {
      b.onclick = function () {
        zustand.art = b.getAttribute('data-a'); zustand.i = 0;
        if (zustand.art === 'laut') { zustand.kat = ''; geh(4); } else geh(3);
      };
    });
  }

  /* ── Schritt 3 · Thema (nur Wörter) ── */
  function schritt3() {
    var da = {}; DB.woerter.forEach(function (w) { da[w.kat] = 1; });
    var h = '<section class="schritt">' + spikiu(esc(T.s3)) + '<div class="kacheln">';
    ['alltag','essen','unterwegs','leute','gruesse'].forEach(function (k) {
      if (!da[k]) return;
      var n = wortStapel(k).length;
      h += '<button class="kachel" type="button" data-k="' + k + '"' + (n ? '' : ' disabled') + '><span class="em">' + KAT_EM[k] + '</span><b>' + esc(T.kat[k]) + '</b><small>' + esc(T.karten(n)) + '</small></button>';
    });
    var alle = wortStapel('alle').length;
    h += '<button class="kachel gemischt" type="button" data-k="alle"' + (alle ? '' : ' disabled') + '><span class="em">🎲</span><b>' + esc(T.gemischt) + '</b><small>' + esc(T.karten(alle)) + '</small></button>';
    buehne.innerHTML = h + '</div></section>';
    [].forEach.call(buehne.querySelectorAll('.kachel'), function (b) {
      b.onclick = function () { zustand.kat = b.getAttribute('data-k'); zustand.i = 0; geh(4); };
    });
  }

  /* ── Schritt 4 · eine Karte nach der anderen ── */
  function wortKarte(c) {
    var w = c.w, b = bildHtml(w.en, w.em);
    return '<div class="wk-kopf">' + (b ? '<div class="wk-bild">' + b + '</div>' : '')
      + '<div><div class="wk-tt">' + esc(inUi(w.konzept)) + '</div><div class="wk-kat">' + esc(T.kat[w.kat] || '') + '</div></div></div>'
      + '<div class="vergleich">' + c.gr.map(function (g) {
          var r0 = regionVon(g.regionen[0]);
          return '<div class="zeile" style="background:' + esc(r0.farbe) + '40"><div class="w"><div class="wort" lang="' + ZIEL + '">' + esc(g.wort) + '</div><div class="wer">'
            + g.regionen.map(function (id) { var r = regionVon(id); return '<span style="background:' + esc(r.farbe) + '">' + esc(r.em || '') + ' ' + esc(ohneKlammer(inUi(r.name))) + '</span>'; }).join('')
            + '</div></div><button class="ton" type="button" data-text="' + esc(g.wort) + '" aria-label="' + esc(g.wort + ' · ' + T.hoeren) + '">' + TON + '</button></div>';
        }).join('') + '</div>'
      + (w.witz ? '<div class="witz">' + CAPY + '<div>' + esc(inUi(w.witz)) + '</div></div>' : '')
      + (w.hinweis ? '<div class="hinweis">💡 ' + esc(inUi(w.hinweis)) + '</div>' : '');
  }
  function lautKarte(c) {
    var a = c.a;
    return '<div class="wk-tt">' + esc(inUi(a.titel)) + '</div><div class="erkl">' + esc(inUi(a.erklaerung)) + '</div>'
      + '<div class="vergleich">' + c.bsp.map(function (b) {
          var r = regionVon(b.region); if (!r) return '';
          return '<div class="zeile" style="background:' + esc(r.farbe) + '40"><div class="w"><div class="wort" lang="' + ZIEL + '">' + esc(b.wort) + '</div>'
            + (b.laut ? '<span class="laut">[' + esc(b.laut) + ']</span>' : '')
            + '<div class="wer"><span style="background:' + esc(r.farbe) + '">' + esc(r.em || '') + ' ' + esc(ohneKlammer(inUi(r.name))) + '</span></div></div>'
            + '<button class="ton" type="button" data-text="' + esc(b.wort) + '" aria-label="' + esc(b.wort + ' · ' + T.hoeren) + '">' + TON + '</button></div>';
        }).join('') + '</div>';
  }
  function schritt4() {
    var n = stapel.length;
    var thema = zustand.art === 'laut' ? T.laut : (zustand.kat === 'alle' ? T.gemischt : (T.kat[zustand.kat] || ''));
    var kopf = '<div class="auswahl">' + datenReihe(zustand.regionen).map(function (id) { return rchip(regionVon(id), true); }).join('')
      + '<span class="tag">· ' + esc(thema) + '</span><button class="link" type="button" id="aendern">' + esc(T.aendern) + '</button></div>';
    if (!n) {
      buehne.innerHTML = '<section class="schritt">' + kopf + spikiu(esc(T.keine)) + '<button class="weiter" type="button" id="neu">' + esc(T.andere) + '</button></section>';
      document.getElementById('neu').onclick = function () { geh(1); };
      document.getElementById('aendern').onclick = function () { geh(1); };
      return;
    }
    if (zustand.i >= n) {
      raeumen();
      buehne.innerHTML = '<section class="schritt">' + kopf + '<div class="ende">' + CAPY + '<h2>' + esc(T.ende) + '</h2><p>' + esc(T.endeT(n)) + '</p>'
        + '<button class="weiter" type="button" id="nochmal">' + esc(T.nochmal) + '</button>'
        + '<button class="knopf2" type="button" id="neu">' + esc(T.andere) + '</button></div></section>';
      document.getElementById('nochmal').onclick = function () { zustand.i = 0; schritt4(); sichern(); };
      document.getElementById('neu').onclick = function () { geh(1); };
      document.getElementById('aendern').onclick = function () { geh(1); };
      return;
    }
    var c = stapel[zustand.i];
    buehne.innerHTML = '<section class="schritt">' + kopf
      + '<div class="leiste"><i style="width:' + Math.round((zustand.i + 1) / n * 100) + '%"></i></div>'
      + '<article class="wk">' + (c.art === 'wort' ? wortKarte(c) : lautKarte(c)) + '</article>'
      + '<div class="nav"><button class="nav-k" type="button" id="zr" aria-label="' + esc(T.zurKarte) + '"' + (zustand.i ? '' : ' disabled') + '>‹</button>'
      + '<div class="zaehler">' + (zustand.i + 1) + ' / ' + n + '</div>'
      + '<button class="nav-k vor" type="button" id="vr" aria-label="' + esc(T.vor) + '">›</button></div></section>';
    document.getElementById('aendern').onclick = function () { geh(1); };
    document.getElementById('zr').onclick = function () { blaettern(-1); };
    document.getElementById('vr').onclick = function () { blaettern(1); };
    [].forEach.call(buehne.querySelectorAll('.ton'), function (b) { b.onclick = function () { sprich(b.getAttribute('data-text'), b); }; });
  }
  function blaettern(d) {
    if (zustand.schritt !== 4) return;
    var ziel = zustand.i + d;
    if (ziel < 0 || ziel > stapel.length) return;
    zustand.i = ziel; buehne.scrollTop = 0; schritt4(); sichern();
  }
  // Wischen und Pfeiltasten auf den Karten
  var x0 = null, y0 = null;
  buehne.addEventListener('touchstart', function (e) { if (zustand.schritt === 4) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } }, { passive: true });
  buehne.addEventListener('touchend', function (e) {
    if (x0 == null) return;
    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)) return;
    blaettern(dx < 0 ? 1 : -1);
  });
  document.addEventListener('keydown', function (e) {
    if (zustand.schritt !== 4) return;
    if (e.key === 'ArrowRight') blaettern(1); else if (e.key === 'ArrowLeft') blaettern(-1);
  });

  // Zurück: einen Schritt zurück, im ersten Schritt ins Haus
  document.getElementById('zurueck').onclick = function () {
    if (zustand.schritt === 4) geh(zustand.art === 'laut' ? 2 : 3);
    else if (zustand.schritt > 1) geh(zustand.schritt - 1);
    else window.location.href = 'haus.html';
  };

  // ── Eintritt ──
  if (!DB) { buehne.innerHTML = '<div class="leer-box">—</div>'; return; }
  document.getElementById('titel').textContent = inUi(DB.titel);
  document.title = 'Spikiu · ' + inUi(DB.titel);
  var sv = null;
  try { sv = window.spikiuSitzung ? window.spikiuSitzung.lade('regional') : null; } catch (e) { sv = null; }
  var gueltig = sv && sv.ziel === ZIEL && sv.regionen && sv.regionen.filter(regionVon).length > 1;
  if (gueltig && sv.schritt === 4 && (sv.i || 0) > 0 && window.spikiuSitzung && window.spikiuSitzung.frageWiederkommen) {
    // Angefangener Durchgang: Wiederkommen-Karte anbieten
    zustand.regionen = sv.regionen.filter(regionVon);
    geh(1);
    window.spikiuSitzung.frageWiederkommen({
      raum: 'regional', ts: sv.ts,
      wo: inUi(DB.titel) + ' · ' + (sv.art === 'laut' ? T.laut : T.woerter) + ' · ' + ((sv.i || 0) + 1),
      beimWeiter: function () { zustand.art = sv.art || 'wort'; zustand.kat = sv.kat || 'alle'; zustand.i = sv.i || 0; geh(4); },
      beimNeu: function () { raeumen(); zustand.regionen = []; geh(1); }
    });
  } else {
    // Gewählte Gegenden bleiben still erhalten, sonst leere Karte
    if (gueltig) zustand.regionen = sv.regionen.filter(regionVon);
    geh(1);
  }
})();
</script>
</body>
