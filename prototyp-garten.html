<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spikiu · Prototyp Garten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<!--
  PROTOTYP „Spikius Garten“ neu (Leo, 22.11.2026, 00:32: „Mache 2 Prototypen daraus“ — Garten: endlose A–Z-Reihe, Themenleiste zum Ziehen, Spikius Text unschön; Wunsch: Ästhetik und Einheit). Themen als Raster auf einen Blick; alle 27 Beete auf einem Bildschirm (6 pro Reihe), Pflanze wächst 🌱🌿🌳; Beet öffnet ein Blatt von unten statt die Seite springen zu lassen.
  Spikiu-Design wie dev (Kopf wie spiele.html, Minze, Tintenränder, harte Schatten). Beispielwörter „Essen & Trinken“.
  Nur Prototyp, Live-System (juegos.js huerto/acrostico) unberührt. Keine KI.
-->
<style>
:root{--ink:#15163a;--bg:#eef7f1;--acc:#ff6b5a;--mustard:#ffd24a;--sage:#c7e89a;--sky:#d3eef6;--muted:#5f7068;--green:#1f93b0;--ow:2.5px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden}
button{font-family:inherit;color:var(--ink)}
input{font-family:inherit;color:var(--ink)}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative}
#kopf{flex:0 0 auto}
.top{display:flex;align-items:center;gap:.6rem;padding:calc(.6rem + env(safe-area-inset-top)) .9rem .6rem;background:rgba(255,255,255,.72);border-bottom:var(--ow) solid var(--ink)}
.back{width:36px;height:36px;flex:0 0 36px;border-radius:999px;border:var(--ow) solid var(--ink);background:#fff;font-size:1.2rem;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.tt-wrap{flex:1;text-align:center;min-width:0}
.tt-wrap .rk{font:500 .58rem/1 'DM Mono',monospace;letter-spacing:.2em;color:var(--green);text-transform:uppercase}
.tt-wrap h1{font-family:'Archivo Black',sans-serif;font-size:1.12rem;margin:.1rem 0 0}
.stage{flex:1;min-height:0;overflow:auto;padding:.9rem 1rem 1.6rem}
.fade{animation:fd .3s ease both}
@keyframes fd{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.row{display:flex;gap:.6rem;align-items:flex-start;margin:0 0 .9rem}
.av{flex:0 0 36px;height:36px}
.says{flex:1;min-width:0;background:#fff;border:var(--ow) solid var(--ink);border-radius:16px;box-shadow:3px 4px 0 var(--ink);padding:.5rem .75rem;font:500 .93rem/1.38 'DM Sans'}
.says em{font-family:'Lora',serif;font-style:italic;font-weight:600}
.k-label{font:800 .66rem/1 'DM Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center;margin:.9rem 0 .6rem}
/* Themen auf einen Blick */
.themen{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem}
.th{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;min-height:4.6rem;border:var(--ow) solid var(--ink);border-radius:16px;box-shadow:3px 4px 0 var(--ink);cursor:pointer;padding:.35rem .25rem;text-align:center}
.th .em{font-size:1.45rem;line-height:1}
.th .tt{font:800 .76rem/1.1 'DM Sans'}
.th.on{outline:3px dashed var(--acc);outline-offset:3px}
.th:active,.knopf:active,.beet:active,.wahl:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
/* Thema-Schild oben */
.schild{display:flex;align-items:center;gap:.5rem;width:100%;border:var(--ow) solid var(--ink);border-radius:999px;background:#fff;padding:.35rem .5rem .35rem .8rem;box-shadow:2px 3px 0 var(--ink);cursor:pointer;margin-bottom:.8rem}
.schild .em{font-size:1.15rem}
.schild b{flex:1;text-align:left;font:800 .9rem 'DM Sans'}
.schild span.w{font:700 .72rem 'DM Sans';border:2px solid var(--ink);border-radius:999px;padding:.12rem .55rem;background:var(--mustard)}
/* Knöpfe */
.knopf{display:block;width:100%;border:var(--ow) solid var(--ink);border-radius:999px;background:var(--acc);color:#fff;padding:.75rem 1rem;font:800 1rem 'DM Sans';cursor:pointer;box-shadow:3px 4px 0 var(--ink)}
.knopf.sek{background:#fff;color:var(--ink)}
.knopf.klein{width:auto;display:inline-block;padding:.5rem .95rem;font-size:.9rem}
.leise{display:block;margin:1rem auto 0;background:none;border:none;font:700 .82rem 'DM Sans';color:var(--muted);text-decoration:underline;cursor:pointer}
/* Blatt von unten */
.ov{position:fixed;inset:0;z-index:60;background:rgba(21,22,58,.4);display:flex;align-items:flex-end;justify-content:center;animation:fd .2s ease both}
.blatt{width:100%;max-width:560px;background:#fff;border:var(--ow) solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0;padding:1rem 1rem calc(1.1rem + env(safe-area-inset-bottom));box-shadow:0 -4px 0 var(--ink);max-height:80%;overflow:auto}
.griff{width:46px;height:5px;border-radius:9px;background:rgba(21,22,58,.25);margin:-.3rem auto .7rem}
.pop{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;font:600 .86rem/1.35 'DM Sans';padding:.5rem .85rem;border-radius:12px;display:none;max-width:86%;text-align:center}
.pop.on{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* Garten: alle Beete auf einem Bildschirm */
.beete{display:grid;grid-template-columns:repeat(6,1fr);gap:.4rem}
.beet{position:relative;aspect-ratio:1/1.05;border:2px solid var(--ink);border-radius:12px;background:#fff;box-shadow:2px 3px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.beet .L{font:900 1.05rem/1 'Archivo Black',sans-serif}
.beet .p{font-size:.95rem;line-height:1;margin-top:.12rem;height:1rem}
.beet.leer{background:rgba(255,255,255,.55);border-style:dashed;box-shadow:none}
.beet.leer .L{opacity:.55}
.beet.k{background:#c7e89a}
.beet.d{background:#fff3c4}
.beet.s{background:#eceee9}
.beet.mix{background:linear-gradient(135deg,#c7e89a 50%,#fff3c4 50%)}
.legende{display:flex;flex-wrap:wrap;justify-content:center;gap:.35rem .9rem;margin:.8rem 0 0;font:600 .72rem 'DM Sans';color:var(--muted)}
.legende i{display:inline-block;width:11px;height:11px;border:1.5px solid var(--ink);border-radius:3px;margin-right:.3rem;vertical-align:-1px}
/* Blatt eines Beets */
.bkopf{display:flex;align-items:center;gap:.7rem;margin-bottom:.7rem}
.bkopf .L{flex:0 0 56px;height:56px;border:var(--ow) solid var(--ink);border-radius:14px;background:var(--mustard);display:flex;align-items:center;justify-content:center;font:900 1.7rem 'Archivo Black';box-shadow:2px 3px 0 var(--ink)}
.bkopf .t{font:800 1rem/1.25 'DM Sans'}
.bkopf .t small{display:block;font:600 .8rem 'DM Sans';color:var(--muted)}
.pflanzen{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.8rem;min-height:1rem}
.pfl{border:2px solid var(--ink);border-radius:12px;padding:.3rem .6rem;cursor:pointer;text-align:left;background:#fff}
.pfl b{display:block;font:600 1rem/1.15 'Lora',serif}
.pfl small{display:block;font:600 .7rem 'DM Sans';color:var(--muted)}
.pfl.k{background:#c7e89a}.pfl.d{background:#fff3c4}.pfl.s{background:#eceee9;border-style:dashed}
.ein{display:flex;gap:.45rem}
.ein input{flex:1;min-width:0;border:var(--ow) solid var(--ink);border-radius:14px;padding:.6rem .75rem;font:600 1.05rem 'Lora',serif;background:#fff}
.ein .knopf{width:auto;padding:.55rem .9rem;font-size:.92rem}
.fluester{min-height:1.3em;font:600 .86rem/1.35 'DM Sans';margin:.55rem 0 .2rem}
.fluester em{font-family:'Lora',serif;font-weight:600}
.blatt .zeile2{display:flex;justify-content:space-between;align-items:center;margin-top:.4rem}

</style>
</head>
<body>
<div class="app"><header id="kopf"></header><div class="stage" id="stage"></div></div>
<div class="pop" id="pop"></div>
<script>
/* ===== GEMEINSAM für Garten + Akrostichon (Prototypen 22.11.2026) ===== */
var CAPY='<svg viewBox="0 0 80 80" fill="none" width="100%" height="100%"><ellipse cx="40" cy="50" rx="28" ry="20" fill="#c9956a"/><ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/><ellipse cx="40" cy="36" rx="10" ry="7" fill="#b8845a"/><ellipse cx="40" cy="33" rx="4" ry="2.5" fill="#8b5e3c"/><circle cx="38" cy="33" r="1" fill="#6b4226"/><circle cx="42" cy="33" r="1" fill="#6b4226"/><circle cx="33" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="47" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="34" cy="23" r="1.2" fill="white"/><circle cx="48" cy="23" r="1.2" fill="white"/><ellipse cx="26" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="54" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="22" cy="66" rx="7" ry="5" fill="#b8845a"/><ellipse cx="34" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="46" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="58" cy="66" rx="7" ry="5" fill="#b8845a"/><path d="M36 38 Q40 41 44 38" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>';
var RED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function capys(r){(r||document).querySelectorAll('[data-capy]').forEach(function(e){if(!e.innerHTML)e.innerHTML=CAPY;});}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function mk(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function sagt(t){return '<div class="row"><div class="av" data-capy></div><div class="says">'+t+'</div></div>';}
var tt;function toast(t){var p=document.getElementById('pop');p.textContent=t;p.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){p.classList.remove('on');},2400);}
function stage(){return document.getElementById('stage');}
function leere(){var s=stage();s.innerHTML='';s.scrollTop=0;var w=mk('div','fade');s.appendChild(w);return w;}
function kopf(eb,t,zur){document.getElementById('kopf').innerHTML='<div class="top">'+(zur?'<button class="back" onclick="'+zur+'">‹</button>':'<button class="back" onclick="toast(\'Zurück ins Regal\')">‹</button>')+'<div class="tt-wrap"><div class="rk">'+eb+'</div><h1>'+t+'</h1></div><div style="width:36px"></div></div>';}

/* Themen — alle auf einen Blick */
var THEMEN=[['essen','🥘','Essen & Trinken','#ffd0b0'],['cafe','☕','Im Café','#ffe08a'],['restaurant','🍽️','Restaurant','#ffd24a'],['einkaufen','🛒','Einkaufen','#c7e89a'],
 ['weg','🧭','Weg fragen','#d3eef6'],['taxi','🚕','Im Taxi','#ffe08a'],['familie','👪','Familie','#f7bcd8'],['hotel','🏨','Im Hotel','#cdbdf2'],
 ['bahnhof','🚉','Bahnhof','#d3eef6'],['arzt','🩺','Beim Arzt','#c7e89a'],['wetter','🌤️','Wetter','#ffd0b0']];
function themaVon(id){return THEMEN.filter(function(t){return t[0]===id;})[0]||THEMEN[0];}
function themenRaster(aktiv,beiWahl){var g=mk('div','themen');
 THEMEN.forEach(function(t){var b=mk('button','th'+(t[0]===aktiv?' on':''),'<span class="em">'+t[1]+'</span><span class="tt">'+t[2]+'</span>');b.style.background=t[3];b.onclick=function(){beiWahl(t[0]);};g.appendChild(b);});
 return g;}

/* Kleiner Wortschatz (Beispiel: Essen & Trinken) — im echten Bau kommen die Wörter aus wortfelder.js / lexikon */
var LEX=[['el agua','das Wasser'],['el aceite','das Öl'],['el ajo','der Knoblauch'],['el arroz','der Reis'],['el azúcar','der Zucker'],['el bocadillo','das belegte Brötchen'],
 ['el café','der Kaffee'],['la cerveza','das Bier'],['el chocolate','die Schokolade'],['la cuchara','der Löffel'],['la carne','das Fleisch'],['la cuenta','die Rechnung'],
 ['el desayuno','das Frühstück'],['la ensalada','der Salat'],['la fruta','das Obst'],['la galleta','der Keks'],['el helado','das Eis'],['el huevo','das Ei'],
 ['la infusión','der Kräutertee'],['el jamón','der Schinken'],['el kiwi','die Kiwi'],['la leche','die Milch'],['el limón','die Zitrone'],['la mantequilla','die Butter'],
 ['la manzana','der Apfel'],['la mesa','der Tisch'],['la naranja','die Orange'],['las olivas','die Oliven'],['el pan','das Brot'],['el plato','der Teller'],
 ['el pescado','der Fisch'],['el queso','der Käse'],['la sal','das Salz'],['la sopa','die Suppe'],['el té','der Tee'],['el tomate','die Tomate'],
 ['la uva','die Traube'],['el vino','der Wein'],['el vaso','das Glas'],['el yogur','der Joghurt'],['el zumo','der Saft'],['el ñame','die Yamswurzel']];
function ohneArtikel(s){return s.replace(/^(el|la|los|las|un|una)\s+/i,'');}
function norm(s){return ohneArtikel(String(s).trim().toLowerCase()).replace(/ñ/g,'\u0001').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\u0001/g,'ñ');}
function anfang(s){var n=norm(s);return n?n.charAt(0).toUpperCase():'';}
function finde(v){var k=norm(v);for(var i=0;i<LEX.length;i++){var f=norm(LEX[i][0]);if(f===k||f===k.replace(/e?s$/,'')||k===f.replace(/e?s$/,''))return {z:LEX[i][0],tr:LEX[i][1]};}return null;}


var ABC='ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'.split('');
var THEMA=null,GARTEN={};
function beispiel(){return {A:[{z:'el agua',tr:'das Wasser',k:1}],B:[{z:'la birra'}],C:[{z:'el café',tr:'der Kaffee',k:1},{z:'la cerveza',tr:'das Bier',k:1}],L:[{z:'la leche',tr:'die Milch',k:1,s:1}],P:[{z:'el pan',tr:'das Brot',k:1}],Z:[{z:'el zumo',tr:'der Saft',k:1}]};}
function start(){kopf('Mein Regal','Spikius Garten');var w=leere();
 w.innerHTML=sagt('Jeder Buchstabe ist ein Beet. Such dir zuerst ein Thema aus.')+'<div class="k-label">Welches Thema?</div>';
 w.appendChild(themenRaster(THEMA,function(id){THEMA=id;if(!GARTEN[id])GARTEN[id]=id==='essen'?beispiel():{};garten();}));capys(w);}
function pflanzenZahl(){var n=0;Object.keys(GARTEN[THEMA]).forEach(function(k){n+=GARTEN[THEMA][k].length;});return n;}
function garten(){var T=themaVon(THEMA);kopf('Mein Regal','Spikius Garten','start()');var w=leere();var d=GARTEN[THEMA];
 var sch=mk('button','schild','<span class="em">'+T[1]+'</span><b>'+T[2]+'</b><span class="w">Thema wechseln</span>');sch.onclick=start;w.appendChild(sch);
 w.insertAdjacentHTML('beforeend',sagt(pflanzenZahl()?'Dein Garten wächst. Tipp ein Beet an und pflanz noch ein Wort — wie es kommt, nicht der Reihe nach.':'Tipp ein Beet an und pflanz ein Wort, das dir einfällt.'));
 var g=mk('div','beete');
 ABC.forEach(function(L){var e=d[L]||[];var art=!e.length?'leer':(e.some(function(x){return x.k&&!x.s;})&&e.some(function(x){return !x.k;})?'mix':(e.every(function(x){return x.s;})?'s':(e.some(function(x){return x.k;})?'k':'d')));
  var p=e.length===0?'':(e.length===1?'🌱':(e.length===2?'🌿':'🌳'));
  var b=mk('button','beet '+art,'<span class="L">'+L+'</span><span class="p">'+p+'</span>');b.setAttribute('aria-label','Beet '+L);b.onclick=function(){beet(L);};g.appendChild(b);});
 w.appendChild(g);
 w.insertAdjacentHTML('beforeend','<div class="legende"><span><i style="background:#c7e89a"></i>kenne ich</span><span><i style="background:#fff3c4"></i>dein Wort</span><span><i style="background:#eceee9;border-style:dashed"></i>von Spikiu gesät</span><span>🌱 🌿 🌳 wächst</span></div>');
 var neu=mk('button','leise','Beet neu anlegen'),scharf=false;neu.onclick=function(){if(!scharf){scharf=true;neu.textContent='Wirklich umgraben? Tipp nochmal.';return;}GARTEN[THEMA]={};garten();};w.appendChild(neu);
 capys(w);}
function beet(L){var d=GARTEN[THEMA];var ov=mk('div','ov'),bl=mk('div','blatt');ov.appendChild(bl);
 function zeichne(meldung){var e=d[L]||[];
  bl.innerHTML='<div class="griff"></div><div class="bkopf"><span class="L">'+L+'</span><span class="t">Beet '+L+'<small>'+(e.length?'Tipp ein Wort an, um es zu entfernen.':'Noch leer. Was fällt dir mit '+L+' ein?')+'</small></span></div><div class="pflanzen"></div><div class="ein"><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Wort mit '+L+' …"><button class="knopf">Pflanzen</button></div><div class="fluester">'+(meldung||'')+'</div><div class="zeile2"><button class="knopf sek klein" id="saat">🌰 Spikiu sät</button><button class="knopf sek klein" id="zu">Fertig</button></div>';
  var pf=bl.querySelector('.pflanzen');
  e.forEach(function(x,ix){var c=mk('button','pfl '+(x.s?'s':(x.k?'k':'d')),'<b>'+esc(x.z)+'</b>'+(x.tr?'<small>'+esc(x.tr)+'</small>':''));c.onclick=function(){e.splice(ix,1);zeichne('');};pf.appendChild(c);});
  var inp=bl.querySelector('input');
  function pflanze(){var v=inp.value.trim();if(!v)return;
   if(anfang(v)!==L){zeichne('Das beginnt nicht mit '+L+'. Gehört es in ein anderes Beet?');return;}
   var f=finde(v);(d[L]=d[L]||[]).push(f?{z:f.z,tr:f.tr,k:1}:{z:v});
   zeichne(f?'<em>'+esc(f.z)+'</em> = '+esc(f.tr):'Kenne ich noch nicht. Es bleibt in deinem Garten.');
   var ni=bl.querySelector('input');if(ni)ni.focus();}
  bl.querySelector('.ein .knopf').onclick=pflanze;inp.onkeydown=function(ev){if(ev.key==='Enter')pflanze();};
  bl.querySelector('#saat').onclick=function(){var schon=(d[L]||[]).map(function(x){return norm(x.z);});
   var k=LEX.filter(function(x){return anfang(x[0])===L&&schon.indexOf(norm(x[0]))<0;});
   if(!k.length){zeichne('In diesem Beet habe ich keine Samen mehr.');return;}
   var f=k[Math.floor(Math.random()*k.length)];(d[L]=d[L]||[]).push({z:f[0],tr:f[1],k:1,s:1});zeichne('Spikiu sät: <em>'+esc(f[0])+'</em> ('+esc(f[1])+'). Jetzt du.');};
  bl.querySelector('#zu').onclick=schliesse;
  if(!meldung)setTimeout(function(){try{inp.focus({preventScroll:true});}catch(x){}},60);}
 function schliesse(){ov.remove();garten();}
 ov.onclick=function(ev){if(ev.target===ov)schliesse();};
 document.body.appendChild(ov);zeichne('');}
start();

</script>
</body>
</html>
