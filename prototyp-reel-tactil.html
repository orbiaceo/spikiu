<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spikiu — Reel táctil (Prototyp)</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--off:#faf9f7;--ink:#1a1816;--mid:#6b6560;--faint:#e8e4df;--warm:#d4cdc6;--accent:#2d6a4f;--accent2:#e8f2ed;--accent3:#1a4a38;--gold:#a07830;--no:#c0844a;--yes:#2d6a4f}
body{background:#efece6;color:var(--ink);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:44px 0 0}
.proto-banner{position:fixed;top:0;left:0;right:0;z-index:9999;background:#1a4a38;color:#fff;padding:.5rem 1rem;text-align:center;font-size:.72rem;line-height:1.4;border-bottom:2px solid #2d6a4f}
.proto-banner strong{color:#a8d5be}.proto-banner em{color:#c9956a;font-style:normal;font-weight:600}
.phone{position:relative;width:100%;max-width:400px;height:calc(100vh - 64px);max-height:840px;margin:12px auto;background:var(--off);border-radius:30px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.22),0 0 0 1px rgba(0,0,0,.05);display:flex;flex-direction:column}
.bar{padding:.85rem 1rem;border-bottom:1px solid var(--faint);background:#fff;display:flex;align-items:center;gap:.5rem}
.bar .t{font-family:'Lora',serif;font-weight:700}.bar .t em{color:var(--accent);font-style:italic}
.bar .cnt{margin-left:auto;font-size:.66rem;color:var(--mid);font-weight:600}
.deck{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:1.2rem}
.card{position:absolute;width:78%;max-width:280px;height:64%;background:#fff;border:1px solid var(--faint);border-radius:24px;
  box-shadow:0 14px 36px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;
  cursor:grab;user-select:none;touch-action:none;will-change:transform}
.card:active{cursor:grabbing}
.card .big{font-family:'Lora',serif;font-size:2rem;font-weight:600;text-align:center;padding:0 1rem}
.card .tr{color:var(--mid);font-style:italic;font-size:1rem;opacity:0;transition:opacity .25s}
.card.flip .tr{opacity:1}
.card .tap{font-size:.66rem;color:var(--warm);position:absolute;bottom:1.1rem}
.card .stamp{position:absolute;top:1.1rem;font-family:'Lora',serif;font-weight:700;font-size:1.2rem;padding:.2rem .7rem;border-radius:10px;border:3px solid;opacity:0;transform:rotate(-12deg)}
.card .stamp.l{left:1.1rem;color:var(--no);border-color:var(--no)}
.card .stamp.r{right:1.1rem;color:var(--yes);border-color:var(--yes)}
.behind{transform:scale(.93) translateY(14px);filter:saturate(.9);box-shadow:0 8px 20px rgba(0,0,0,.08)}
.controls{display:flex;gap:1.1rem;justify-content:center;padding:.8rem 1rem 1.4rem}
.cbtn{width:62px;height:62px;border-radius:50%;border:2px solid;background:#fff;cursor:pointer;font-size:1.5rem;display:flex;align-items:center;justify-content:center;transition:.15s}
.cbtn.no{border-color:var(--no);color:var(--no)}.cbtn.no:hover{background:var(--no);color:#fff}
.cbtn.yes{border-color:var(--yes);color:var(--yes)}.cbtn.yes:hover{background:var(--yes);color:#fff}
.cbtn.sound{width:48px;height:48px;border-color:var(--faint);color:var(--accent);font-size:1.1rem;align-self:center}
.hintbar{text-align:center;font-size:.66rem;color:var(--warm);padding-bottom:.3rem}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;text-align:center;padding:2rem}
.done.show{display:flex}.done .big{font-family:'Lora',serif;font-size:1.4rem}.done .s{color:var(--mid);font-size:.85rem}
@media(max-width:430px){body{padding-top:50px}.phone{max-width:100%;height:calc(100vh - 58px);border-radius:0;margin:0;box-shadow:none}}
</style>
</head>
<body>
<div class="proto-banner"><strong>🧠 PROTOTYP — Reel táctil (Gym).</strong> Daumen wischt: 👈 kenn ich nicht · weiß ich 👉. <em>Mit Vibration + Klick + sanftem Gleiten.</em></div>
<div class="phone">
  <div class="bar"><span class="t">Spi<em>k</em>iu · 🧠 Wortschatz</span><span class="cnt" id="cnt">1 / 5</span></div>
  <div class="deck" id="deck">
    <div class="done" id="done"><div style="font-size:2rem">🌿</div><div class="big">¡Buena ronda!</div><div class="s">3 weißt du sicher · 2 nehmen wir nochmal mit.</div><button class="cbtn yes" style="width:auto;border-radius:100px;padding:.6rem 1.2rem;font-size:.9rem;margin-top:.6rem" onclick="restart()">↺ Otra vez</button></div>
  </div>
  <div class="hintbar" id="hint">Tippe die Karte = Übersetzung · wisch oder nutz die Knöpfe</div>
  <div class="controls">
    <button class="cbtn no" onclick="swipe(-1)">✕</button>
    <button class="cbtn sound" onclick="say()">🔊</button>
    <button class="cbtn yes" onclick="swipe(1)">✓</button>
  </div>
</div>
<script>
var WORDS=[
  {w:'la llave',t:'der Schlüssel'},{w:'la cuenta',t:'die Rechnung'},
  {w:'la maleta',t:'der Koffer'},{w:'el aeropuerto',t:'der Flughafen'},{w:'la reserva',t:'die Reservierung'}
];
var deck=document.getElementById('deck'), cnt=document.getElementById('cnt'), done=document.getElementById('done'), hint=document.getElementById('hint');
var i=0, cards=[];
function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }
var AC; function tone(freq,dur,type){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  var o=AC.createOscillator(),g=AC.createGain(); o.type=type||'sine'; o.frequency.value=freq;
  o.connect(g); g.connect(AC.destination); g.gain.setValueAtTime(.0001,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.18,AC.currentTime+.01); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
  o.start(); o.stop(AC.currentTime+dur); }catch(e){} }
function say(){ try{ var c=WORDS[i]; if(!c)return; window.speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(c.w); u.lang='es-ES'; u.rate=.95; window.speechSynthesis.speak(u);}catch(e){} }

function build(){
  deck.querySelectorAll('.card').forEach(function(c){c.remove()}); cards=[];
  for(var k=Math.min(i+1,WORDS.length-1);k>=i;k--){ // hintere zuerst
    if(k>WORDS.length-1)continue; var d=WORDS[k]; if(!d)continue;
    var el=document.createElement('div'); el.className='card'+(k>i?' behind':'');
    el.innerHTML='<div class="stamp l">NEU</div><div class="stamp r">✓</div><div class="big">'+d.w+'</div><div class="tr">'+d.t+'</div><div class="tap">tippen für Übersetzung</div>';
    deck.appendChild(el); if(k===i){ topCard=el; bindDrag(el); el.addEventListener('click',function(e){ if(!dragged) el.classList.toggle('flip'); }); }
    cards.push(el);
  }
  cnt.textContent=(Math.min(i+1,WORDS.length))+' / '+WORDS.length;
}
var topCard, startX=0, curX=0, dragging=false, dragged=false;
function bindDrag(el){
  function down(x){ dragging=true; dragged=false; startX=x; el.style.transition='none'; }
  function move(x){ if(!dragging)return; curX=x-startX; if(Math.abs(curX)>4)dragged=true;
    var rot=curX/16; el.style.transform='translateX('+curX+'px) rotate('+rot+'deg)';
    var sr=el.querySelector('.stamp.r'), sl=el.querySelector('.stamp.l');
    sr.style.opacity=curX>0?Math.min(1,curX/80):0; sl.style.opacity=curX<0?Math.min(1,-curX/80):0; }
  function up(){ if(!dragging)return; dragging=false; el.style.transition='transform .3s ease';
    if(curX>90){ fly(1); } else if(curX<-90){ fly(-1); } else { el.style.transform=''; el.querySelector('.stamp.r').style.opacity=0; el.querySelector('.stamp.l').style.opacity=0; } curX=0; }
  el.addEventListener('mousedown',function(e){down(e.clientX)});
  window.addEventListener('mousemove',function(e){move(e.clientX)});
  window.addEventListener('mouseup',up);
  el.addEventListener('touchstart',function(e){down(e.touches[0].clientX)},{passive:true});
  el.addEventListener('touchmove',function(e){move(e.touches[0].clientX)},{passive:true});
  el.addEventListener('touchend',up);
}
function fly(dir){ if(!topCard)return; var el=topCard; topCard=null;
  el.style.transition='transform .35s ease, opacity .35s ease';
  el.style.transform='translateX('+(dir*520)+'px) rotate('+(dir*22)+'deg)'; el.style.opacity='0';
  buzz(dir>0?[14]:[10,40,10]); tone(dir>0?660:300,.14,dir>0?'sine':'triangle');
  // hintere Karte nach vorn
  var behind=deck.querySelector('.card.behind'); if(behind){ behind.style.transition='transform .35s cubic-bezier(.34,1.3,.5,1)'; behind.classList.remove('behind'); }
  setTimeout(function(){ el.remove(); i++; if(i>=WORDS.length){ done.classList.add('show'); hint.style.visibility='hidden'; } else { build(); } }, 320);
}
function swipe(dir){ if(topCard) fly(dir); }
function restart(){ i=0; done.classList.remove('show'); hint.style.visibility='visible'; build(); }
build();
</script>
</body>
</html>
