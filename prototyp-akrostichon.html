<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spikiu · Prototyp Akrostichon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<!--
  PROTOTYP „Akrostichon“ neu (Leo, 22.11.2026, 00:32). Themen als Raster; Wörter als Buchstaben-Kacheln; Schreiben mit einer Zeile pro Buchstabe, aktive Zeile hervorgehoben, EINE Hilfe unten statt Hilfe-Knopf in jeder Zeile; Ergebnis als Gedicht-Karte.
  Spikiu-Design wie dev (Kopf wie spiele.html, Minze, Tintenränder, harte Schatten). Beispielwörter „Essen & Trinken“.
  Nur Prototyp, Live-System (juegos.js huerto/acrostico) unberührt. Keine KI.
-->
<style>
:root{--ink:#15163a;--bg:#eef7f1;--acc:#ff6b5a;--mustard:#ffd24a;--sage:#c7e89a;--sky:#d3eef6;--muted:#5f7068;--green:#1f93b0;--ow:2.5px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden}
button{font-family:inherit;color:var(--ink)}
input{font-family:inherit;color:var(--ink)}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative}
#kopf{flex:0 0 auto}
.top{display:flex;align-items:center;gap:.6rem;padding:calc(.6rem + env(safe-area-inset-top)) .9rem .6rem;background:rgba(255,255,255,.72);border-bottom:var(--ow) solid var(--ink)}
.back{width:36px;height:36px;flex:0 0 36px;border-radius:999px;border:var(--ow) solid var(--ink);background:#fff;font-size:1.2rem;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.tt-wrap{flex:1;text-align:center;min-width:0}
.tt-wrap .rk{font:500 .58rem/1 'DM Mono',monospace;letter-spacing:.2em;color:var(--green);text-transform:uppercase}
.tt-wrap h1{font-family:'Archivo Black',sans-serif;font-size:1.12rem;margin:.1rem 0 0}
.stage{flex:1;min-height:0;overflow:auto;padding:.9rem 1rem 1.6rem}
.fade{animation:fd .3s ease both}
@keyframes fd{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.row{display:flex;gap:.6rem;align-items:flex-start;margin:0 0 .9rem}
.av{flex:0 0 36px;height:36px}
.says{flex:1;min-width:0;background:#fff;border:var(--ow) solid var(--ink);border-radius:16px;box-shadow:3px 4px 0 var(--ink);padding:.5rem .75rem;font:500 .93rem/1.38 'DM Sans'}
.says em{font-family:'Lora',serif;font-style:italic;font-weight:600}
.k-label{font:800 .66rem/1 'DM Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center;margin:.9rem 0 .6rem}
/* Themen auf einen Blick */
.themen{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem}
.th{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;min-height:4.6rem;border:var(--ow) solid var(--ink);border-radius:16px;box-shadow:3px 4px 0 var(--ink);cursor:pointer;padding:.35rem .25rem;text-align:center}
.th .em{font-size:1.45rem;line-height:1}
.th .tt{font:800 .76rem/1.1 'DM Sans'}
.th.on{outline:3px dashed var(--acc);outline-offset:3px}
.th:active,.knopf:active,.beet:active,.wahl:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
/* Thema-Schild oben */
.schild{display:flex;align-items:center;gap:.5rem;width:100%;border:var(--ow) solid var(--ink);border-radius:999px;background:#fff;padding:.35rem .5rem .35rem .8rem;box-shadow:2px 3px 0 var(--ink);cursor:pointer;margin-bottom:.8rem}
.schild .em{font-size:1.15rem}
.schild b{flex:1;text-align:left;font:800 .9rem 'DM Sans'}
.schild span.w{font:700 .72rem 'DM Sans';border:2px solid var(--ink);border-radius:999px;padding:.12rem .55rem;background:var(--mustard)}
/* Knöpfe */
.knopf{display:block;width:100%;border:var(--ow) solid var(--ink);border-radius:999px;background:var(--acc);color:#fff;padding:.75rem 1rem;font:800 1rem 'DM Sans';cursor:pointer;box-shadow:3px 4px 0 var(--ink)}
.knopf.sek{background:#fff;color:var(--ink)}
.knopf.klein{width:auto;display:inline-block;padding:.5rem .95rem;font-size:.9rem}
.leise{display:block;margin:1rem auto 0;background:none;border:none;font:700 .82rem 'DM Sans';color:var(--muted);text-decoration:underline;cursor:pointer}
/* Blatt von unten */
.ov{position:fixed;inset:0;z-index:60;background:rgba(21,22,58,.4);display:flex;align-items:flex-end;justify-content:center;animation:fd .2s ease both}
.blatt{width:100%;max-width:560px;background:#fff;border:var(--ow) solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0;padding:1rem 1rem calc(1.1rem + env(safe-area-inset-bottom));box-shadow:0 -4px 0 var(--ink);max-height:80%;overflow:auto}
.griff{width:46px;height:5px;border-radius:9px;background:rgba(21,22,58,.25);margin:-.3rem auto .7rem}
.pop{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;font:600 .86rem/1.35 'DM Sans';padding:.5rem .85rem;border-radius:12px;display:none;max-width:86%;text-align:center}
.pop.on{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* Akrostichon */
.beispiel{background:#fff;border:var(--ow) solid var(--ink);border-radius:18px;box-shadow:3px 4px 0 var(--ink);padding:.7rem .9rem;display:grid;grid-template-columns:auto 1fr;gap:.15rem .7rem;align-items:baseline}
.beispiel .eb{grid-column:1/-1;font:700 .58rem/1.2 'DM Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem}
.beispiel .L{font:900 1.3rem/1.1 'Archivo Black';color:var(--green)}
.beispiel .A{font:600 1rem/1.2 'Lora',serif}
.beispiel .A small{font:600 .72rem 'DM Sans';color:var(--muted);margin-left:.4rem}
.woerter{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.wahl{border:var(--ow) solid var(--ink);border-radius:16px;box-shadow:3px 4px 0 var(--ink);cursor:pointer;padding:.65rem .4rem;display:flex;justify-content:center;gap:.22rem}
.wahl i{font-style:normal;width:1.6rem;height:1.9rem;display:flex;align-items:center;justify-content:center;background:#fff;border:2px solid var(--ink);border-radius:7px;font:900 .95rem 'Archivo Black'}
/* Schreiben */
.akro{display:flex;flex-direction:column;gap:.5rem}
.az{display:flex;align-items:stretch;gap:.55rem;background:#fff;border:var(--ow) solid var(--ink);border-radius:16px;box-shadow:3px 4px 0 var(--ink);padding:.4rem .5rem .4rem .4rem;transition:background .2s}
.az .L{flex:0 0 46px;border:var(--ow) solid var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;font:900 1.4rem 'Archivo Black'}
.az .r{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.az input{width:100%;border:none;border-bottom:2px solid rgba(21,22,58,.18);padding:.35rem .2rem;font:600 1.12rem 'Lora',serif;background:transparent;outline:none}
.az.aktiv{background:#fffbea;outline:3px solid var(--mustard);outline-offset:0}
.az.aktiv input{border-bottom-color:var(--green)}
.az .info{font:600 .76rem/1.25 'DM Sans';color:var(--muted);min-height:1em;padding:.15rem .2rem 0}
.az.ok{background:#f1fae6}
.az.ok input{border-bottom-color:transparent}
.az .ok-m{flex:0 0 auto;align-self:center;font:800 .9rem 'DM Sans';width:26px;height:26px;border-radius:999px;border:2px solid var(--ink);background:#c7e89a;display:none;align-items:center;justify-content:center}
.az.ok .ok-m{display:flex}
.hilfe{display:flex;gap:.5rem;align-items:center;margin-top:.8rem}
.hilfe .av{flex:0 0 34px;height:34px}
.hilfe button{flex:1}
.hilfe .tipp{font:700 1.15rem 'DM Mono',monospace;letter-spacing:.18em}
/* Ergebnis */
.poster{background:#fff;border:var(--ow) solid var(--ink);border-radius:22px;box-shadow:5px 6px 0 var(--ink);padding:1.1rem 1rem 1rem;text-align:left}
.poster .eb{font:700 .6rem/1.2 'DM Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem}
.poster .pz{display:flex;align-items:center;gap:.7rem;padding:.3rem 0;border-bottom:1.5px dashed rgba(21,22,58,.15)}
.poster .pz:last-child{border-bottom:none}
.poster .pz .L{flex:0 0 44px;height:44px;border:var(--ow) solid var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;font:900 1.35rem 'Archivo Black'}
.poster .pz b{font:600 1.15rem 'Lora',serif}
.poster .pz small{display:block;font:600 .74rem 'DM Sans';color:var(--muted)}
.btns{display:flex;flex-direction:column;gap:.6rem;margin-top:1rem}

</style>
</head>
<body>
<div class="app"><header id="kopf"></header><div class="stage" id="stage"></div></div>
<div class="pop" id="pop"></div>
<script>
/* ===== GEMEINSAM für Garten + Akrostichon (Prototypen 22.11.2026) ===== */
var CAPY='<svg viewBox="0 0 80 80" fill="none" width="100%" height="100%"><ellipse cx="40" cy="50" rx="28" ry="20" fill="#c9956a"/><ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/><ellipse cx="40" cy="36" rx="10" ry="7" fill="#b8845a"/><ellipse cx="40" cy="33" rx="4" ry="2.5" fill="#8b5e3c"/><circle cx="38" cy="33" r="1" fill="#6b4226"/><circle cx="42" cy="33" r="1" fill="#6b4226"/><circle cx="33" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="47" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="34" cy="23" r="1.2" fill="white"/><circle cx="48" cy="23" r="1.2" fill="white"/><ellipse cx="26" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="54" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="22" cy="66" rx="7" ry="5" fill="#b8845a"/><ellipse cx="34" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="46" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="58" cy="66" rx="7" ry="5" fill="#b8845a"/><path d="M36 38 Q40 41 44 38" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>';
var RED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function capys(r){(r||document).querySelectorAll('[data-capy]').forEach(function(e){if(!e.innerHTML)e.innerHTML=CAPY;});}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function mk(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function sagt(t){return '<div class="row"><div class="av" data-capy></div><div class="says">'+t+'</div></div>';}
var tt;function toast(t){var p=document.getElementById('pop');p.textContent=t;p.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){p.classList.remove('on');},2400);}
function stage(){return document.getElementById('stage');}
function leere(){var s=stage();s.innerHTML='';s.scrollTop=0;var w=mk('div','fade');s.appendChild(w);return w;}
function kopf(eb,t,zur){document.getElementById('kopf').innerHTML='<div class="top">'+(zur?'<button class="back" onclick="'+zur+'">‹</button>':'<button class="back" onclick="toast(\'Zurück ins Regal\')">‹</button>')+'<div class="tt-wrap"><div class="rk">'+eb+'</div><h1>'+t+'</h1></div><div style="width:36px"></div></div>';}

/* Themen — alle auf einen Blick */
var THEMEN=[['essen','🥘','Essen & Trinken','#ffd0b0'],['cafe','☕','Im Café','#ffe08a'],['restaurant','🍽️','Restaurant','#ffd24a'],['einkaufen','🛒','Einkaufen','#c7e89a'],
 ['weg','🧭','Weg fragen','#d3eef6'],['taxi','🚕','Im Taxi','#ffe08a'],['familie','👪','Familie','#f7bcd8'],['hotel','🏨','Im Hotel','#cdbdf2'],
 ['bahnhof','🚉','Bahnhof','#d3eef6'],['arzt','🩺','Beim Arzt','#c7e89a'],['wetter','🌤️','Wetter','#ffd0b0']];
function themaVon(id){return THEMEN.filter(function(t){return t[0]===id;})[0]||THEMEN[0];}
function themenRaster(aktiv,beiWahl){var g=mk('div','themen');
 THEMEN.forEach(function(t){var b=mk('button','th'+(t[0]===aktiv?' on':''),'<span class="em">'+t[1]+'</span><span class="tt">'+t[2]+'</span>');b.style.background=t[3];b.onclick=function(){beiWahl(t[0]);};g.appendChild(b);});
 return g;}

/* Kleiner Wortschatz (Beispiel: Essen & Trinken) — im echten Bau kommen die Wörter aus wortfelder.js / lexikon */
var LEX=[['el agua','das Wasser'],['el aceite','das Öl'],['el ajo','der Knoblauch'],['el arroz','der Reis'],['el azúcar','der Zucker'],['el bocadillo','das belegte Brötchen'],
 ['el café','der Kaffee'],['la cerveza','das Bier'],['el chocolate','die Schokolade'],['la cuchara','der Löffel'],['la carne','das Fleisch'],['la cuenta','die Rechnung'],
 ['el desayuno','das Frühstück'],['la ensalada','der Salat'],['la fruta','das Obst'],['la galleta','der Keks'],['el helado','das Eis'],['el huevo','das Ei'],
 ['la infusión','der Kräutertee'],['el jamón','der Schinken'],['el kiwi','die Kiwi'],['la leche','die Milch'],['el limón','die Zitrone'],['la mantequilla','die Butter'],
 ['la manzana','der Apfel'],['la mesa','der Tisch'],['la naranja','die Orange'],['las olivas','die Oliven'],['el pan','das Brot'],['el plato','der Teller'],
 ['el pescado','der Fisch'],['el queso','der Käse'],['la sal','das Salz'],['la sopa','die Suppe'],['el té','der Tee'],['el tomate','die Tomate'],
 ['la uva','die Traube'],['el vino','der Wein'],['el vaso','das Glas'],['el yogur','der Joghurt'],['el zumo','der Saft'],['el ñame','die Yamswurzel']];
function ohneArtikel(s){return s.replace(/^(el|la|los|las|un|una)\s+/i,'');}
function norm(s){return ohneArtikel(String(s).trim().toLowerCase()).replace(/ñ/g,'\u0001').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\u0001/g,'ñ');}
function anfang(s){var n=norm(s);return n?n.charAt(0).toUpperCase():'';}
function finde(v){var k=norm(v);for(var i=0;i<LEX.length;i++){var f=norm(LEX[i][0]);if(f===k||f===k.replace(/e?s$/,'')||k===f.replace(/e?s$/,''))return {z:LEX[i][0],tr:LEX[i][1]};}return null;}


var THEMA=null,WORT=null,ANTW=[],AKT=0,HILFE=0;
var FARBEN=['#ffd24a','#c7e89a','#d3eef6','#f7bcd8','#cdbdf2','#ffd0b0','#ffe08a'];
var KAND=['AGUA','LECHE','SAL','VINO','MESA','ZUMO'];
function start(){kopf('Mein Regal','Akrostichon');var w=leere();
 w.innerHTML=sagt('Ein Wort, zu jedem Buchstaben ein Gedanke. Such dir zuerst ein Thema aus.')+'<div class="k-label">Welches Thema?</div>';
 w.appendChild(themenRaster(THEMA,function(id){THEMA=id;wahl();}));capys(w);}
function wahl(){var T=themaVon(THEMA);kopf('Mein Regal','Akrostichon','start()');var w=leere();
 var sch=mk('button','schild','<span class="em">'+T[1]+'</span><b>'+T[2]+'</b><span class="w">Thema wechseln</span>');sch.onclick=start;w.appendChild(sch);
 w.insertAdjacentHTML('beforeend',sagt('So sieht eins aus. Jetzt du: wähl ein Wort.')+'<div class="beispiel"><div class="eb">Spikius Akrostichon</div><span class="L">S</span><span class="A">la sal<small>das Salz</small></span><span class="L">O</span><span class="A">las olivas<small>die Oliven</small></span><span class="L">P</span><span class="A">el pan<small>das Brot</small></span><span class="L">A</span><span class="A">el ajo<small>der Knoblauch</small></span></div><div class="k-label">Wähl ein Wort</div>');
 var g=mk('div','woerter');KAND.forEach(function(K,i){var b=mk('button','wahl',K.split('').map(function(c){return '<i>'+c+'</i>';}).join(''));b.style.background=FARBEN[i%FARBEN.length];b.onclick=function(){WORT=K;ANTW=K.split('').map(function(){return null;});AKT=0;HILFE=0;schreiben();};g.appendChild(b);});
 w.appendChild(g);capys(w);}
function vorschlag(L){var schon=ANTW.filter(Boolean).map(function(a){return norm(a.z);});return LEX.filter(function(x){return anfang(x[0])===L&&schon.indexOf(norm(x[0]))<0;})[0];}
function schreiben(){kopf('Akrostichon · '+themaVon(THEMA)[2],WORT,'wahl()');var w=leere();
 w.insertAdjacentHTML('beforeend',sagt('Zu jedem Buchstaben ein Wort zum Thema. Hängst du, hilft Spikiu unten — Buchstabe für Buchstabe.'));
 var ak=mk('div','akro');w.appendChild(ak);
 var zeilen=[];
 WORT.split('').forEach(function(L,i){var z=mk('div','az','<span class="L" style="background:'+FARBEN[i%FARBEN.length]+'">'+L+'</span><span class="r"><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+L+' …"><span class="info"></span></span><span class="ok-m">✓</span>');
  var inp=z.querySelector('input');
  inp.onfocus=function(){setzeAktiv(i);};
  inp.onkeydown=function(ev){if(ev.key==='Enter')pruefe(i);};
  inp.onblur=function(){if(inp.value.trim()&&!ANTW[i])pruefe(i,true);};
  ak.appendChild(z);zeilen.push(z);});
 var hb=mk('div','hilfe','<div class="av" data-capy></div><button class="knopf sek" id="hilf">Spikiu, hilf mir bei <b id="hL"></b></button>');w.appendChild(hb);
 var btns=mk('div','btns','<button class="knopf" id="fertig">Fertig</button>');w.appendChild(btns);
 function setzeAktiv(i){if(i!==AKT)HILFE=0;AKT=i;zeilen.forEach(function(z,k){z.classList.toggle('aktiv',k===i);});var b=document.getElementById('hL');if(b)b.textContent=WORT.charAt(i);
  document.getElementById('hilf').innerHTML='Spikiu, hilf mir bei <b>'+WORT.charAt(i)+'</b>';}
 function pruefe(i,still){var z=zeilen[i],inp=z.querySelector('input'),v=inp.value.trim(),L=WORT.charAt(i),info=z.querySelector('.info');if(!v)return;
  if(anfang(v)!==L){info.textContent='Das beginnt nicht mit '+L+'.';return;}
  var f=finde(v);if(!f){info.textContent='Passt das zum Thema? Probier ein anderes.';return;}
  ANTW[i]=f;inp.value=f.z;info.textContent=f.tr;z.classList.add('ok');z.classList.remove('aktiv');
  var n=ANTW.findIndex(function(a){return !a;});if(n>-1&&!still){zeilen[n].querySelector('input').focus();}else if(n<0){zeilen[i].querySelector('input').blur();}}
 document.getElementById('hilf').onclick=function(){var i=AKT;if(ANTW[i]){var n=ANTW.findIndex(function(a){return !a;});if(n<0)return;i=n;setzeAktiv(n);}
  var L=WORT.charAt(i),x=vorschlag(L),info=zeilen[i].querySelector('.info');if(!x){info.textContent='Da fällt mir auch nichts ein.';return;}
  var n2=ohneArtikel(x[0]);HILFE++;
  if(HILFE>=n2.length){zeilen[i].querySelector('input').value=x[0];pruefe(i);HILFE=0;return;}
  info.innerHTML='<span class="tipp">'+n2.split('').map(function(c,k){return k<HILFE?c:'_';}).join(' ')+'</span>';zeilen[i].querySelector('input').focus();};
 document.getElementById('fertig').onclick=function(){zeilen.forEach(function(z,i){if(!ANTW[i])pruefe(i,true);});
  if(ANTW.some(function(a){return !a;})){toast('Noch nicht ganz — ein paar Buchstaben warten noch.');var n=ANTW.findIndex(function(a){return !a;});zeilen[n].querySelector('input').focus();return;}
  ergebnis();};
 setzeAktiv(0);capys(w);setTimeout(function(){try{zeilen[0].querySelector('input').focus({preventScroll:true});}catch(e){}},80);}
function ergebnis(){kopf('Akrostichon','Dein Gedicht','wahl()');var w=leere();
 var h=sagt('¡Precioso! Dein Akrostichon liegt jetzt im Regal.')+'<div class="poster"><div class="eb">'+WORT+' · '+themaVon(THEMA)[2]+'</div>';
 WORT.split('').forEach(function(L,i){h+='<div class="pz"><span class="L" style="background:'+FARBEN[i%FARBEN.length]+'">'+L+'</span><span><b>'+esc(ANTW[i].z)+'</b><small>'+esc(ANTW[i].tr)+'</small></span></div>';});
 h+='</div><div class="btns"><button class="knopf" id="noch">Noch ein Wort</button><button class="knopf sek" id="regal">Ins Regal</button></div>';
 w.innerHTML=h;capys(w);document.getElementById('noch').onclick=wahl;document.getElementById('regal').onclick=function(){toast('Liegt unter „Deine Akrosticha“.');};}
start();

</script>
</body>
</html>
