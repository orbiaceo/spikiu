<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spikiu · Das Haus</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
:root{--navy:#15163a;--terra:#ff6b5a;--pink:#ff4f9a;--sage:#9bd14a;--mustard:#ffd24a;--plum:#9b7bff;--cyan:#2bb3d4;--sky:#d3eef6}
/* ===== MUTATIONS-VARIABLEN (Default = M1 Pop) ===== */
body{
 --bg:#eef7f1;--ink:#15163a;--bubS:#fff;--bubT:#fff;--you:#ffd24a;--youtx:#15163a;
 --acc:#ff6b5a;--acctx:#fff;--spk:#ff4f9a;--de:#f1faf5;--back:#15163a;
 --ow:2.5px;--shb:3px 4px;--shs:3px 3px;--muted:#5f7068;--eb:#ff6b5a;
 background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;line-height:1.5;
 display:flex;align-items:center;justify-content:center;min-height:100dvh}
body.m1{--bg:#eef7f1;--bubS:#fff;--bubT:#fff;--you:#ffd24a;--youtx:#15163a;--acc:#ff6b5a;--acctx:#fff;--spk:#ff4f9a;--eb:#ff6b5a;--ow:2.5px;--shb:3px 4px;--shs:3px 3px}
body.m2{--bg:#cdeee2;--bubS:#fff;--bubT:#fff;--you:#ffd24a;--youtx:#15163a;--acc:#ff4f9a;--acctx:#fff;--spk:#ff4f9a;--eb:#ff4f9a;--ow:2.5px;--shb:3px 4px;--shs:3px 3px}
body.m3{--bg:#eef7f1;--bubS:#d3eef6;--bubT:#fff;--you:#ffd24a;--youtx:#15163a;--acc:#ff6b5a;--acctx:#fff;--spk:#ff4f9a;--eb:#1f93b0;--ow:2.5px;--shb:3px 4px;--shs:3px 3px}
body.m4{--bg:#cdeee2;--bubS:#fff;--bubT:#fff;--you:#ffd24a;--youtx:#15163a;--acc:#ff6b5a;--acctx:#fff;--spk:#ff4f9a;--eb:#ff6b5a;--ow:3.5px;--shb:5px 6px;--shs:4px 4px}
body.m5{--bg:#cfeee2;--bubS:#fff;--bubT:#fff;--you:#15163a;--youtx:#eef7f1;--acc:#15163a;--acctx:#eef7f1;--spk:#ff4f9a;--eb:#15163a;--ow:2.5px;--shb:3px 4px;--shs:3px 3px}
.badge{position:fixed;top:calc(.5rem + env(safe-area-inset-top));right:.7rem;z-index:80;font:700 .56rem/1 'DM Mono',monospace;letter-spacing:.08em;color:var(--ink);background:rgba(255,255,255,.92);border:2px solid var(--ink);padding:.3rem .55rem;border-radius:999px;box-shadow:2px 2px 0 var(--ink)}
.view{display:none;background-color:var(--bg)}
.view.active{display:flex;flex-direction:column;height:100dvh;width:100%;position:relative}
@media (min-width:700px) and (min-height:560px){
 html{font-size:17px}
 body{background:var(--back);background-image:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1px);background-size:22px 22px;padding:24px}
 .view.active{width:min(460px,94vw);height:min(880px,90vh);border-radius:28px;overflow:hidden;box-shadow:9px 11px 0 rgba(0,0,0,.22);border:2.5px solid var(--ink)}
 .badge{top:calc(1rem + env(safe-area-inset-top));right:1.1rem}
}
@media (min-width:1200px){.badge{right:calc(50vw - 250px)}}
button{font-family:inherit}
.welcome{align-items:center;justify-content:center;text-align:center;padding:1.5rem;gap:.2rem;overflow:auto}
.welcome .big{width:148px;height:148px;margin-bottom:.4rem}
.welcome h1{font-family:'Archivo Black',sans-serif;font-size:1.95rem;margin:.25rem 0;letter-spacing:-.01em;color:var(--ink)}
.welcome p{color:var(--muted);font-size:1.05rem;margin:.1rem 0 1.3rem;font-weight:600}
.namebox{display:flex;gap:.6rem;width:100%;max-width:360px}
.namebox input{flex:1;min-width:0;border:none;border-bottom:2.5px solid var(--ink);background:transparent;outline:none;font-family:'Archivo Black',sans-serif;font-size:1.3rem;color:var(--ink);padding:.3rem .1rem;text-align:center}
.namebox input::placeholder{font-family:'DM Sans';font-weight:600;color:var(--muted)}
.namebox .go{flex:0 0 56px;height:56px;border-radius:16px;border:2.5px solid var(--ink);background:var(--acc);color:var(--acctx);font-size:1.4rem;cursor:pointer;box-shadow:var(--shs) 0 var(--ink)}
.namebox .go:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.langrow{display:flex;gap:.7rem;margin-top:1rem;width:100%;max-width:360px}
.langrow button{flex:1;padding:1rem;border-radius:16px;border:2.5px solid var(--ink);background:var(--bubS);font-family:'Archivo Black',sans-serif;font-size:1.2rem;color:var(--ink);cursor:pointer;box-shadow:var(--shs) 0 var(--ink)}
.langrow button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.nav{flex:0 0 auto;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:2.5px solid var(--ink);padding:calc(.5rem + env(safe-area-inset-top)) .5rem 0;z-index:10}
.doors{display:flex;gap:.4rem;max-width:560px;margin:0 auto}
.door{flex:1;background:transparent;border:none;cursor:pointer;padding:.5rem .2rem .6rem;border-radius:14px 14px 0 0;display:flex;flex-direction:column;align-items:center;gap:.25rem;position:relative;min-height:72px}
.door .ic{width:42px;height:42px;transition:transform .2s}
.door .lb{font:800 .82rem/1 'DM Sans';color:var(--muted);letter-spacing:.01em}
.door.on .lb{color:var(--ink)}
.door.on .ic{transform:translateY(-1px) scale(1.04)}
.door.on:after{content:'';position:absolute;left:16%;right:16%;bottom:-2.5px;height:4px;border-radius:3px;background:var(--acc)}
.door:active .ic{transform:scale(.94)}
.subbar{max-width:560px;margin:.15rem auto 0;text-align:center;font-size:.8rem;line-height:1.3;color:var(--muted);padding:.4rem 1.1rem .6rem;font-weight:600}
.stage{flex:1;min-height:0;overflow:auto;max-width:560px;width:100%;margin:0 auto;padding:1.1rem 1.15rem calc(2.2rem + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.turn{display:flex;gap:.6rem;margin:1.15rem 0;align-items:flex-start;opacity:0;transform:translateY(9px);animation:rise .45s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.av{flex:0 0 40px;height:40px;margin-top:.15rem}.av svg{width:100%;height:100%}
.says{flex:1;min-width:0;font-size:1.05rem;color:var(--ink);background:var(--bubS);border:var(--ow) solid var(--ink);border-radius:18px;box-shadow:var(--shb) 0 var(--ink);padding:.75rem .9rem}
.says.target{background:var(--bubT)}
.you{margin:.7rem 0 1rem;display:flex;justify-content:flex-end;opacity:0;animation:rise .4s forwards}
.you span{display:inline-block;max-width:82%;background:var(--you);color:var(--youtx);border:var(--ow) solid var(--ink);border-radius:18px;box-shadow:var(--shb) 0 var(--ink);padding:.6rem .9rem;font:800 1.08rem/1.2 'DM Sans'}
.es-row{display:flex;align-items:flex-start;gap:.5rem}
.es-row .es{flex:1}
.says .es{font-family:'Archivo Black',sans-serif;font-size:1.4rem;line-height:1.16;color:var(--ink);display:block}
.de-box{margin-top:.6rem;border:1.5px dashed rgba(21,22,58,.4);border-radius:12px;padding:.45rem .65rem;font-style:italic;color:var(--muted);font-size:.9rem;background:var(--de)}
.spk{flex:0 0 36px;height:36px;border-radius:999px;border:2px solid var(--ink);background:var(--spk);color:#fff;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 var(--ink)}
.spk:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.bigcards{display:flex;flex-direction:column;gap:.65rem;margin:.7rem 0 .4rem 46px}
.bigcard{display:flex;align-items:center;gap:.9rem;text-align:left;background:var(--bubS);border:var(--ow) solid var(--ink);border-radius:18px;padding:1.05rem 1.1rem;cursor:pointer;box-shadow:var(--shb) 0 var(--ink);transition:transform .1s,box-shadow .1s}
.bigcard:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.bigcard .em{font-size:1.75rem;flex:0 0 auto;width:42px;text-align:center;line-height:1}
.bigcard .bc-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:.18rem}
.bigcard .tt{font:800 1.1rem/1.25 'DM Sans';color:var(--ink)}
.bigcard .ss{font-size:.85rem;line-height:1.35;color:var(--muted)}
.bigcard .bc-chev{flex:0 0 auto;color:var(--ink);font-size:1.5rem;line-height:1}
.k-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1rem;min-height:0}
.k-greet{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.3rem;padding:.2rem 0 .4rem}
.k-greet .cap{width:66px;height:66px;border-radius:999px;background:#fff;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:3px 3px 0 var(--ink)}
.k-greet .cap svg{width:50px;height:50px}
.k-greet h2{font:800 1.3rem/1.15 'DM Sans',sans-serif;color:var(--ink)}
.k-greet .kr{color:var(--muted);font-weight:600;font-size:.88rem;line-height:1.3;max-width:26ch}
.k-two,.k-four,.k-tri{display:grid;grid-template-columns:1fr 1fr;gap:.85rem;width:100%;max-width:340px;margin:0 auto}
.k-tri .k-top{grid-column:1 / -1;max-width:55%;justify-self:center;width:100%}
.tile{height:118px;border:var(--ow) solid var(--ink);border-radius:20px;box-shadow:4px 5px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:.6rem;gap:.12rem;background:#fff;font-family:inherit}
.tile:active{transform:translate(2px,2px);box-shadow:2px 3px 0 var(--ink)}
.tile .em{font-size:1.85rem;line-height:1}
.tile .tt{font:800 .92rem/1.05 'DM Sans',sans-serif;color:var(--ink)}
.tile .ss{font-size:.72rem;color:rgba(21,22,58,.7);line-height:1.15;font-weight:600}
.tile .pill{font:800 .56rem 'DM Sans',sans-serif;border:2px solid var(--ink);border-radius:999px;padding:.08rem .4rem;margin-top:.1rem;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:.55rem;margin:.4rem 0 .3rem 46px}
.chip{font:800 1.02rem/1.15 'DM Sans';color:var(--ink);background:var(--bubS);border:var(--ow) solid var(--ink);padding:.7rem 1rem;border-radius:14px;cursor:pointer;box-shadow:var(--shs) 0 var(--ink);transition:transform .1s,box-shadow .1s}
.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.ends{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0 .3rem 46px}
.end{font:800 .96rem/1 'DM Sans';padding:.7rem 1.1rem;border-radius:999px;cursor:pointer;border:var(--ow) solid var(--ink);background:var(--bubS);color:var(--ink);box-shadow:var(--shs) 0 var(--ink);transition:transform .1s,box-shadow .1s}
.end:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.end.primary{background:var(--acc);color:var(--acctx)}
.tool{margin:1.1rem 0 1.1rem 46px;background:var(--bubS);border:var(--ow) solid var(--ink);border-radius:16px;box-shadow:var(--shb) 0 var(--ink);padding:1rem 1.1rem 1.1rem}
.eyebrow{font:700 .62rem/1 'DM Mono',monospace;letter-spacing:.2em;color:var(--eb);text-transform:uppercase;margin-bottom:.5rem}
.read .es{font-family:'Lora',serif;font-size:1.5rem;line-height:1.32;margin:.12rem 0}
.read .fr{border-bottom:1.5px dotted var(--acc);cursor:pointer}
.flip{perspective:900px;margin:.4rem 0 .2rem 46px}
.flip .card{background:var(--bubS);border:var(--ow) solid var(--ink);border-radius:18px;min-height:130px;box-shadow:var(--shb) 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;padding:1.2rem;cursor:pointer;text-align:center}
.flip .w{font-family:'Archivo Black',sans-serif;font-size:1.8rem;color:var(--ink)}
.flip .m{font-size:1.05rem;color:var(--acc);font-weight:700}
.flip .hint{font:600 .8rem/1 'DM Sans';color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:.45rem;align-items:center;margin:.2rem 0 .8rem;padding-bottom:.7rem;border-bottom:2px solid var(--ink)}
.emojirow{display:flex;gap:.28rem;justify-content:center;align-items:center}
.emojirow .e{width:1.9rem;height:1.9rem;display:inline-flex;align-items:center;justify-content:center;opacity:.3;transition:.25s}
.emojirow .e svg{width:100%;height:100%}
.emojirow .e.done{opacity:.82}
.emojirow .e.on{opacity:1;transform:scale(1.22)}
.steplabel{font:800 .98rem/1 'DM Sans';color:var(--ink);display:flex;align-items:center;gap:.4rem}
.steplabel .ic{width:1.3rem;height:1.3rem;display:inline-flex}
.steplabel .ic svg{width:100%;height:100%}
.steplabel small{color:var(--muted);font-weight:700}
.deck{margin:.5rem 0 .3rem 46px}
.deckrow{display:flex;align-items:center;gap:.5rem}
.dcard{flex:1;background:var(--bubS);border:var(--ow) solid var(--ink);border-radius:20px;min-height:128px;box-shadow:var(--shb) 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;padding:1.1rem;text-align:center;touch-action:pan-y;user-select:none}
.dcard .es{font-family:'Archivo Black',sans-serif;font-size:1.6rem;color:var(--ink);line-height:1.1}
.dcard .de{font-size:.95rem;color:var(--muted)}
.navc{flex:0 0 46px;height:46px;border-radius:999px;border:var(--ow) solid var(--ink);background:var(--bubS);color:var(--ink);font-size:1.4rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shs) 0 var(--ink)}
.navc:disabled{opacity:.3;box-shadow:none;cursor:default}
.navc:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.dots{display:flex;gap:.42rem;justify-content:center;margin:.7rem 0 .1rem}
.dot{width:8px;height:8px;border-radius:999px;background:var(--ink);opacity:.25;transition:.2s}
.dot.on{opacity:1;background:var(--acc);transform:scale(1.3)}
.pop{position:fixed;left:50%;transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;font-size:.92rem;padding:.5rem .8rem;border-radius:12px;box-shadow:3px 3px 0 rgba(0,0,0,.3);display:none;max-width:80%}
.pop b{color:var(--mustard)}
.cover{text-align:center;max-width:520px;margin:.6rem auto 1.6rem}
.cover .ol{width:116px;height:140px;margin:0 auto}
.cover h2{font-family:'Archivo Black',sans-serif;font-size:1.7rem;margin:.5rem 0 .15rem;color:var(--ink)}
.cover p{color:var(--muted);font-size:.92rem;margin:0}
.bp{max-width:520px;margin:0 auto 1.5rem;border-top:2px solid var(--ink);padding-top:1.2rem}
.bp .ch{font:700 .64rem/1 'DM Mono',monospace;letter-spacing:.2em;color:var(--eb);text-transform:uppercase;margin-bottom:.45rem}
.bp h3{font-family:'Archivo Black',sans-serif;font-size:1.3rem;margin:.1rem 0 .5rem;color:var(--ink)}
.bp .body{font-size:1.02rem;line-height:1.62}
.bp .keep{margin-top:.8rem;display:flex;align-items:center;gap:.5rem}
.bp .keep .w{font-family:'Archivo Black',sans-serif;font-size:1.15rem;color:var(--acc)}
.bp .note{margin-top:.8rem;font-style:italic;color:var(--muted);font-size:1.05rem}
.bp .lf{color:var(--acc)}
.empty{max-width:520px;margin:1rem auto;color:var(--muted);font-size:1.05rem;text-align:center;line-height:1.6}
/* ===== MEIN BUCH · Blättern (immersives Overlay) ===== */
.bookov{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;background:var(--bg)}
.bookov.open{display:flex}
.bkhead{flex:0 0 auto;display:flex;align-items:center;justify-content:flex-start;gap:.7rem;padding:calc(.7rem + env(safe-area-inset-top)) .9rem .6rem;border-bottom:var(--ow) solid var(--ink);background:rgba(255,255,255,.9)}
.bktitle{font-family:'Archivo Black',sans-serif;font-size:1.1rem}
.bkx{width:36px;height:36px;flex:0 0 36px;border-radius:999px;border:var(--ow) solid var(--ink);background:#fff;font-size:1.15rem;line-height:1;cursor:pointer;box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center}
.bkx:active{transform:translate(1px,1px);box-shadow:0 0 0 var(--ink)}
.bkx:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.bkview{flex:1;min-height:0;overflow:auto;padding:1.1rem 1rem}
.bpage{background:#fff;border:var(--ow) solid var(--ink);border-radius:20px;box-shadow:var(--shb) 0 var(--ink);padding:1.2rem 1.1rem;min-height:100%}
.bpage.inR{animation:binR .3s cubic-bezier(.2,.7,.2,1)}
.bpage.inL{animation:binL .3s cubic-bezier(.2,.7,.2,1)}
@keyframes binR{from{opacity:0;transform:translateX(26px) rotate(1deg)}to{opacity:1;transform:none}}
@keyframes binL{from{opacity:0;transform:translateX(-26px) rotate(-1deg)}to{opacity:1;transform:none}}
.bkflip{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:1rem;padding:.55rem 0 calc(.85rem + env(safe-area-inset-bottom))}
.bkcnt{font:800 .88rem/1 'DM Sans';min-width:3.4rem;text-align:center;color:var(--ink)}
.beyebrow{font:700 .62rem/1 'DM Mono',monospace;letter-spacing:.2em;color:var(--eb);text-transform:uppercase;margin-bottom:.5rem}
.bptitle{font-family:'Archivo Black',sans-serif;font-size:1.45rem;margin:.1rem 0 .7rem;line-height:1.14}
.bpbody{font-family:'Lora',serif;font-size:1.28rem;line-height:1.5}
.bsaid{margin-top:1rem}
.blbl{font:700 .64rem/1 'DM Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem}
.bphrase{display:flex;align-items:center;gap:.55rem;margin:.35rem 0}
.bes{flex:1;font-family:'Lora',serif;font-weight:600;font-size:1.3rem}
.bnote{margin-top:1rem;display:flex;gap:.55rem;align-items:flex-start;background:var(--de);border:2px dashed var(--muted);border-radius:14px;padding:.7rem .8rem}
.bcap{flex:0 0 30px;height:30px}.bcap svg{width:100%;height:100%}
.bt{font-family:'Lora',serif;font-style:italic;font-size:1.14rem}
.bpnum{margin-top:1.1rem;font:700 .68rem/1 'DM Mono',monospace;color:var(--muted);text-align:right}
.bneu{display:inline-block;font:800 .6rem/1 'DM Sans';color:#fff;background:var(--terra);border:2px solid var(--ink);border-radius:999px;padding:.24rem .5rem;box-shadow:2px 2px 0 var(--ink);transform:rotate(-4deg);margin-bottom:.5rem}
.bcover{text-align:center}
.bol{width:120px;height:144px;margin:.2rem auto 0;animation:bfloat 4s ease-in-out infinite}
@keyframes bfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bcover h2{font-family:'Archivo Black',sans-serif;font-size:1.9rem;margin:.5rem 0 .1rem}
.bsub{color:var(--muted);font-size:.96rem;font-weight:600}
.bby{margin-top:1rem;display:inline-flex;align-items:center;gap:.5rem;font-family:'Lora',serif;font-style:italic;font-size:1.1rem;color:var(--muted)}
.bby .bcap{width:32px;height:32px;flex:0 0 32px}
.bspine{margin-top:1rem;font:700 .7rem/1 'DM Mono',monospace;color:var(--muted)}
.bwords .bleaf{display:grid;grid-template-columns:1fr 1fr 30px;align-items:center;column-gap:.7rem;row-gap:.12rem;padding:.5rem .1rem;border-bottom:1px solid #e6dec9;font-family:'Lora',serif;margin:0}.bl-z{font-weight:600;font-size:1.14rem;color:var(--ink);word-break:break-word}.bl-m{font-size:1rem;color:var(--muted);word-break:break-word}.bleaf .spk.bl-spk{width:28px;height:28px;font-size:.76rem;box-shadow:1px 1px 0 var(--ink);justify-self:end}.bl-lau{grid-column:1 / -1;font-family:'DM Mono',monospace;font-size:.76rem;color:var(--muted);font-style:italic;margin-top:.05rem}
.blf{color:var(--sage)}
.bhook{text-align:center;padding-top:.4rem}
.bbig{font-family:'Archivo Black',sans-serif;font-size:1.45rem;line-height:1.2;margin:.3rem 0}

<script>
/* ── SPIKIU · CAPY VIVO (wiederverwendbarer Helfer) ──────────────────
   Macht ein bereits gerendertes Capy-<svg> lebendig — ohne Abhängigkeiten,
   eigener CSS-Namensraum (spk-capy-*), stört nichts.

     window.spkCapyAlive(svgEl, { tapTarget, clamp, eyeY });

   Das SVG braucht eine Augen-Gruppe <g class="spk-capy-eyes">…</g>
   (zwei dunkle Augen + zwei Glanzpunkte). Der Helfer:
     • blinzelt automatisch (Augen-Gruppe kurz zu Schlitzen),
     • lässt den Blick dem Zeiger folgen (geklemmt, sanft),
     • macht beim Antippen einen kurzen Freuden-Hüpfer (ohne den Klick
       zu schlucken — Panel/Handler feuern weiter).
   Atmen bleibt der Seite (CSS) überlassen. Mehrfach-Aufruf je SVG = no-op.
   prefers-reduced-motion → ruhig (kein Tracking/Hüpfer/Blinzeln).        */
(function () {
  if (window.spkCapyAlive) return;

  var STYLE_ID = 'spk-capy-vivo-style';
  function injectStyle() {
    if (document.getElementById(STYLE_ID)) return;
    var css = ''
      + '.spk-capy-eyes{transform-box:fill-box;transform-origin:center;transition:transform .14s ease-out}'
      + '@keyframes spk-capy-hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-9px)}55%{transform:translateY(0)}74%{transform:translateY(-4px)}}'
      + '.spk-capy-hop{animation:spk-capy-hop .5s cubic-bezier(.3,1.4,.5,1) !important}'
      // — Sprech-Zustand: Mund auf/zu + zwei weiche Aura-Ringe (wie prototyp-voz.html) —
      + '.spk-capy-mouth{transform-box:fill-box;transform-origin:center}'
      + '@keyframes spk-capy-talk{0%,100%{transform:scaleY(1)}50%{transform:scaleY(2.1) scaleX(1.1)}}'
      + '.spk-capy-speaking .spk-capy-mouth{animation:spk-capy-talk .4s ease-in-out infinite}'
      + '.spk-capy-aura{transform-box:fill-box;transform-origin:center;opacity:0;pointer-events:none}'
      + '@keyframes spk-capy-ring{0%{transform:scale(.55);opacity:.45}100%{transform:scale(1.25);opacity:0}}'
      + '.spk-capy-speaking .spk-capy-aura{animation:spk-capy-ring 1.6s ease-out infinite}'
      + '.spk-capy-speaking .spk-capy-aura2{animation-delay:.8s}';
    var st = document.createElement('style');
    st.id = STYLE_ID; st.textContent = css;
    (document.head || document.documentElement).appendChild(st);
  }

  function reducedMotion() {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  // Aura-Ringe einmalig in den SVG hängen (hinter den Capy). Idempotent.
  function ensureAura(svg) {
    if (svg.__spkAura) return;
    svg.__spkAura = true;
    svg.style.overflow = 'visible';                // Ringe dürfen über die viewBox hinaus
    var NS = 'http://www.w3.org/2000/svg';
    for (var i = 0; i < 2; i++) {
      var c = document.createElementNS(NS, 'circle');
      c.setAttribute('class', 'spk-capy-aura' + (i ? ' spk-capy-aura2' : ''));
      c.setAttribute('cx', '40'); c.setAttribute('cy', '42'); c.setAttribute('r', '28');
      c.setAttribute('fill', 'none'); c.setAttribute('stroke', '#1f93b0'); c.setAttribute('stroke-width', '2');
      svg.insertBefore(c, svg.firstChild);         // hinter den Capy einsortieren
    }
  }

  // Sprech-Zustand schalten (wiederverwendbar): Mund auf/zu + Aura-Ringe.
  // Braucht im SVG den Mund-Pfad <… class="spk-capy-mouth">. reduced-motion → ruhig
  // (kein hektischer Mund, keine Ringe). Defensiv/idempotent.
  window.spkCapySpeak = function (svg, on) {
    if (!svg) return;
    injectStyle();
    if (reducedMotion()) return;                   // ruhig: kein Mund/keine Ringe
    if (on) ensureAura(svg);
    svg.classList.toggle('spk-capy-speaking', !!on);
  };

  window.spkCapyAlive = function (svg, opts) {
    // Handle mit .speak(on) — auch dann nutzbar, wenn unten früh zurückgekehrt wird.
    var handle = { speak: function (on) { window.spkCapySpeak(svg, on); } };
    if (!svg) return handle;
    if (svg.__spkAlive) return handle;             // idempotent je SVG
    var eyes = svg.querySelector('.spk-capy-eyes');
    if (!eyes) return handle;                      // ohne Augen-Gruppe: blinzeln no-op, Sprech-Handle bleibt
    svg.__spkAlive = true;
    opts = opts || {};
    injectStyle();

    if (reducedMotion()) return handle;            // ruhig: nur Atmen (CSS der Seite)

    var CLAMP = (typeof opts.clamp === 'number') ? opts.clamp : 2.4;  // viewBox-Einheiten
    var EYEY  = (typeof opts.eyeY  === 'number') ? opts.eyeY  : 0.34; // Augenhöhe im SVG
    var tx = 0, ty = 0, blinking = false;

    function apply() {
      eyes.style.transform = 'translate(' + tx + 'px,' + ty + 'px)' + (blinking ? ' scaleY(.1)' : '');
    }

    // — Blinzeln (zufälliges Intervall) —
    function scheduleBlink() {
      setTimeout(function () {
        blinking = true; apply();
        setTimeout(function () { blinking = false; apply(); }, 130);
        scheduleBlink();
      }, 2500 + Math.random() * 3500);
    }
    setTimeout(scheduleBlink, 1400 + Math.random() * 1200);

    // — Blick folgt dem Zeiger (geklemmt, Bezug = SVG-Mitte) —
    function track(px, py) {
      var r = svg.getBoundingClientRect();
      if (!r.width) return;
      var cx = r.left + r.width / 2, cy = r.top + r.height * EYEY;
      var dx = (px - cx) / 40, dy = (py - cy) / 40;
      tx = Math.max(-CLAMP, Math.min(CLAMP, dx));
      ty = Math.max(-CLAMP, Math.min(CLAMP, dy));
      apply();
    }
    function recenter() { tx = 0; ty = 0; apply(); }
    document.addEventListener('mousemove', function (e) { track(e.clientX, e.clientY); }, { passive: true });
    document.addEventListener('touchmove', function (e) { var p = e.touches && e.touches[0]; if (p) track(p.clientX, p.clientY); }, { passive: true });
    document.addEventListener('mouseleave', recenter);
    window.addEventListener('blur', recenter);

    // — Tipp = Freuden-Hüpfer (schluckt den Klick NICHT) —
    var tapTarget = opts.tapTarget || svg;
    tapTarget.addEventListener('pointerdown', function () {
      svg.classList.remove('spk-capy-hop');
      void svg.getBoundingClientRect().width;      // Reflow → Animation neu starten
      svg.classList.add('spk-capy-hop');
    });
    svg.addEventListener('animationend', function (e) {
      if (e.animationName === 'spk-capy-hop') svg.classList.remove('spk-capy-hop');
    });

    return handle;
  };
})();

</script>
