<!--
  ══════════════════════════════════════════════════════════════════════
  SPIKIU — DIE SZENE (Freies Gespräch) · im „Feines Ohr"-Design seit 19.10.2026

  Leo, 19.10.: „Lasst uns geführt und freies Gespräch nach diesem Prototyp
  reformieren." Vorlage: prototyp-gespraech-ohr.html, Bausteine: ohr-karten.js.
  Eine Karte füllt den Schirm: Spikius Satz in der Blase · die Aufgabe ·
  der große gelbe Knopf „Selbst sagen" · vier Vorschläge · Rückmeldezeile ·
  zwei Knöpfe unten.

  WAS BLEIBT (die Logik von vorher, nur neu angezogen):
  - Der Lerner bekommt konkrete Aufgaben und BAUT den Satz SELBST (Leo, 30.08.).
    Er kann frei schreiben/diktieren ODER einen der vier Vorschläge antippen
    (Ohr-Runde: falsch = „passt hier noch nicht"; der richtige ZÄHLT als
    Antwort — Leo, 19.10.: „Ja, es soll zählen."). Angetippte Zeilen gehen
    nicht in die Rückmeldung; ändert er sie später, zählen sie als eigene.
  - NULL TOKEN während der Szene. Spikius Zeile ist IMMER die nächste
    Skriptzeile — die Szene kann nicht entgleisen.
  - ES WIRD NICHTS GEPRÜFT (31.08.): jede offene Antwort rückt die Aufgabe vor;
    nur eine Rückfrage („¿Cómo?") nicht (Sieb, R13). Beurteilt wird EINMAL am
    Ende von /api/rueckmeldung — nur die selbst gebauten Sätze.
  - Vor der Rückmeldung kann er jeden eigenen Satz noch ändern (Stift, 30.08.).
  - Die Ernte zeigt nur, was vorkam. Sitzung über sitzung.js ('szene').

  Neu: „Den Tisch decken" — vier Bildwörter der Station zum Antippen, bevor es
  losgeht (Prototyp 18.10.).
  Kein Bottom-Nav: das hier ist ein Raum, nur haus.html trägt die Navi.
  ══════════════════════════════════════════════════════════════════════
-->

:root{ --minz:#eef7f1; --ink:#15163a; --muted:#5f7068; --acc:#1f93b0; --faint:#dfe6e0; --ow:2.5px; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--minz);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer}
.app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;background:var(--minz)}

.kopf{flex:0 0 auto;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:6px;
  padding:calc(.55rem + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) .55rem max(14px,env(safe-area-inset-left));
  border-bottom:var(--ow) solid var(--ink);background:rgba(255,255,255,.55)}
.kopf .back{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;box-shadow:2px 3px 0 var(--ink);
  font-size:1.15rem;display:grid;place-items:center;color:var(--ink)}
.kopf .back:active{transform:translate(1px,1px);box-shadow:0 0 0 var(--ink)}
.kopf .mitte{text-align:center;min-width:0}
.kopf .eb{font:600 .64rem/1 'DM Mono',ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
.kopf .ttl{font:900 1.3rem/1.15 'Archivo Black','DM Sans',sans-serif;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.rail{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:8px max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}
.rail .step{display:flex;flex-direction:column;gap:4px}
.rail .step i{display:block;height:5px;border-radius:9px;background:var(--faint)}
.rail .step b{font:700 .58rem/1 'DM Sans',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#9aa49f;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail .step.done i,.rail .step.on i{background:var(--acc)}
.rail .step.on b{color:var(--acc)} .rail .step.done b{color:var(--ink)}

main.stage{flex:1 1 auto;min-height:0;position:relative;display:flex;flex-direction:column;
  padding:12px max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}
#fuss{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}

/* Selbst sagen: das Feld nimmt den Platz der Vorschläge ein */
.fz-selbst{flex:1 1 0;min-height:150px;width:100%;display:flex;flex-direction:column;gap:9px}
.fz-feld{flex:1 1 0;min-height:70px;width:100%;resize:none;border:2.5px solid var(--ink);border-radius:16px;box-shadow:3px 4px 0 var(--ink);
  padding:10px 12px;font:600 1.12rem/1.35 'Lora',Georgia,serif;color:var(--ink);background:#fff}
.fz-feld:focus{outline:3px solid var(--acc);outline-offset:2px}
.fz-reihe{flex:0 0 auto;display:flex;gap:8px;white-space:nowrap;justify-content:space-between;align-items:center}
.fz-klein{border:2px solid var(--ink);border-radius:100px;background:#fff;color:var(--ink);box-shadow:2px 3px 0 var(--ink);padding:.5rem .8rem;font:800 .88rem 'DM Sans',sans-serif;white-space:nowrap}
.fz-klein.pri{background:var(--acc);color:#fff}
.fz-klein[disabled]{opacity:.38;box-shadow:none;cursor:default}
.fz-klein.an{background:#ffd24a}
.fz-link{border:0;background:none;color:var(--acc);font:700 .85rem 'DM Sans',sans-serif;text-decoration:underline;text-underline-offset:3px;padding:.3rem 0;white-space:nowrap}

/* Lesekarten (Rückmeldung, Ernte): lang, werden gelesen — rollen innen */
.fz-liste{flex:1 1 0;min-height:120px;width:100%;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding:2px 4px 6px 2px}
.fz-kopf{font:700 .68rem/1 'DM Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);text-align:left;margin-top:4px}
.fz-zeile{flex:0 0 auto;display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:2.5px solid var(--ink);border-radius:16px;
  box-shadow:3px 4px 0 var(--ink);padding:8px 12px;color:var(--ink);width:100%}
.fz-zeile .a{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);background:var(--acc);color:#fff;display:grid;place-items:center;font-size:.8rem}
.fz-zeile .t{flex:1;min-width:0}
.fz-zeile .w{display:block;font:600 1.04rem/1.3 'Lora',Georgia,serif}
.fz-zeile .lt{display:block;font:500 .74rem/1.3 'DM Mono',ui-monospace,monospace;color:var(--muted)}
.fz-zeile .u{display:block;font:600 .82rem/1.3 'DM Sans',sans-serif;color:var(--muted)}
.fz-zeile .x{display:block;font:600 .9rem/1.3 'DM Sans',sans-serif;color:#c67a1e;text-decoration:line-through;text-decoration-thickness:1.5px}
.fz-zeile .stift{flex:0 0 auto;font-size:1rem;color:var(--muted)}
.fz-zeile:active{transform:translate(2px,2px);box-shadow:1px 2px 0 var(--ink)}
.oh-karte.dicht{gap:7px;padding-top:10px}
.oh-karte.dicht .oh-blase .oh-lt{display:none}
.oh-karte.dicht .oh-blase .oh-z{font-size:.95rem;line-height:1.25}
.oh-karte.dicht .oh-zeile .oh-cap{flex-basis:32px;height:32px}
.oh-karte.dicht .oh-task{font-size:.93rem;line-height:1.28}
.oh-karte.dicht .oh-big{padding:.4rem 1.3rem;font-size:1rem}
.oh-karte.dicht .oh-fb{min-height:2em;font-size:.88rem}
.fz-lbl{font:700 .66rem/1 'DM Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.fz-leer{font:600 .95rem/1.4 'DM Sans',sans-serif;color:var(--muted);text-align:center;margin:auto 0}
.fz-punkte{font:800 1.6rem 'DM Sans',sans-serif;color:var(--muted);letter-spacing:.3em;margin:auto 0}
@media (max-height:720px){.kopf .ttl{font-size:1.12rem}.kopf .back{width:36px;height:36px}.fz-selbst{min-height:130px}}

      feld.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); if (!sb.disabled) sb.click(); } });
      var zb = selbstBox.querySelector('#fz-zurueck');
      if (zb) zb.onclick = function () { selbstBox.remove(); selbstBox = null; g.hidden = false; big.hidden = false; O.fit(g); fb.className = 'oh-fb'; fb.innerHTML = '<span class="oh-leise">' + esc(U.hinweis) + '</span>'; };
      var db = selbstBox.querySelector('#fz-dikt');
      if (db) db.onclick = function () { diktat(feld, db, function () { sb.disabled = !feld.value.trim(); }); };
      sb.onclick = function () {
        var t = feld.value.trim(); if (!t) return;
        var art = 'offen';
        try { if (window.SpikiuSieb) art = window.SpikiuSieb.art(t, ZS, MU); } catch (e) {}
        var z = automat.antworte(t, art === 'offen' ? 'offen' : 'rolle');
        if (z.abgelehnt) { schluss(); return; }
        if (art !== 'offen') {
          /* Rückfrage: die Figur wiederholt ihre Zeile, die Aufgabe bleibt stehen (R13). */
          automat.spikiuAntwortet(spz.z);
          if (automat.zustand().phase === 'ernte') { schluss(); return; }
          feld.value = ''; sb.disabled = true;
          fb.className = 'oh-fb soft'; fb.innerHTML = esc(U.nochmalSp);
          setTimeout(function () { sprich(spz.z); }, 300);
          return;
        }
        beantwortet = true;
        protokoll.push({ aufgabe: index, gesagt: t, erwartet: lernerZeilen[index] ? lernerZeilen[index].z : '', auftrag: inSprache(AUFG[index]), vorher: spz.z });
        geerntet.gesagt.push(t);
        speichern();
        feld.disabled = true; sb.disabled = true; if (db) db.disabled = true; if (zb) zb.hidden = true;
        fb.className = 'oh-fb'; fb.innerHTML = '<span>' + U.du(esc(t)) + '</span>';
        O.klang(true);
        var r = document.getElementById('oh-rechts'); if (r) r.disabled = false;
      };
      if (!vs.length) return;             // ohne Vorschläge: Feld steht, Tastatur erst auf Tippen
      setTimeout(function () { try { feld.focus(); } catch (e) {} }, 60);
    }
    setTimeout(function () { sprich(spz.z); }, 380);
  }
  /* Nach der Antwort: Spikius nächste Skriptzeile — oder der Schluss. */
  function naechster(index) {
    var zst = automat.zustand();
    var antwort = zielzeilen[index] || { z: '' };
    if (zst.ausgangOffen || zst.zug >= ZUG_DECKEL) { schluss(antwort); return; }
    automat.spikiuAntwortet(antwort.z);
    geerntet.gehoert.push(antwort.z);
    letzteSpikiu = antwort;
    zug();
  }

  /* Diktieren: Spracherkennung des Geräts, wenn es sie gibt (0 Token). */
  var REK_LANG = { es:'es-ES', de:'de-DE', en:'en-GB', el:'el-GR' };
  function diktatDa() { return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
  var rek = null;
  function diktat(feld, knopf, dann) {
    var R = window.SpeechRecognition || window.webkitSpeechRecognition; if (!R) return;
    if (rek) { try { rek.stop(); } catch (e) {} return; }
    stumm();
    try {
      rek = new R(); rek.lang = REK_LANG[ZS] || ZS; rek.interimResults = true; rek.maxAlternatives = 1;
      var vorher = feld.value ? feld.value.replace(/\s*$/, ' ') : '';
      knopf.classList.add('an'); knopf.textContent = U.hoertZu;
      rek.onresult = function (ev) { var s = ''; for (var i = 0; i < ev.results.length; i++) s += ev.results[i][0].transcript; feld.value = vorher + s; dann(); };
      rek.onend = rek.onerror = function () { rek = null; knopf.classList.remove('an'); knopf.textContent = U.diktieren; dann(); };
      rek.start();
    } catch (e) { rek = null; knopf.classList.remove('an'); knopf.textContent = U.diktieren; }
  }

  /* „Genug für heute": was er gesagt hat, geht nicht verloren — Rückblick, sonst nach Hause. */
  function genug() {
    if (protokoll.length) { try { automat.abbrechen(); } catch (e) {} schluss(null, true); return; }
    raeumen(); window.location.href = 'haus.html';
  }

  /* ══════════════════════════════════════════════════════════
     4 · DER RUNDE ABSCHLUSS + DEINE SÄTZE (mit Stift)
     Spikius letzte Antwort und die Abrundung in EINER Blase (31.08.).
     Darunter seine eigenen Sätze: antippen = ändern (30.08.). Die Szene
     spult nicht zurück — Spikius Zeilen kämen ohnehin gleich.
     ══════════════════════════════════════════════════════════ */
  var SCHLUSS = null;
  function schluss(letzte, abgebrochen) {
    if (!SCHLUSS) {
      var teile = [], lts = [], nas = [];
      if (letzte && letzte.z) { teile.push(letzte.z); if (letzte.tr) lts.push(letzte.tr); if (letzte.na) nas.push(letzte.na); }
      if (!abrundungIstZiel || abgebrochen) {
        var a = LP.abrundungVon(STUFE, THEMA);
        if (a && a.z && teile.indexOf(a.z) < 0) { teile.push(a.z); if (a.tr) lts.push(a.tr); if (a.na) nas.push(inSprache(a.na)); }
      }
      SCHLUSS = { z: teile.join(' '), tr: lts.join(' '), na: nas.join(' ') };
      try { if (automat.zustand().phase !== 'ernte') { automat.spikiuAntwortet(SCHLUSS.z); } } catch (e) {}
      geerntet.gehoert.push(SCHLUSS.z);
    }
    PHASE = 'schluss'; speichern();
    kopf(THEMA_NA, 3);
    var k = O.karte(stage);
    if (SCHLUSS.z) O.blase(k, { capy: CAPY, z: SCHLUSS.z, lang: ZS, lt: SCHLUSS.tr, tr: SCHLUSS.na, trLabel: U.ueb, mini: { label: U.anhoeren, fn: function () { sprich(SCHLUSS.z); } } });
    O.task(k, U.deineSaetze, U.deineSaetzeKlein);
    var liste = O.el('div', 'fz-liste'); k.appendChild(liste);
    protokoll.forEach(function (p, i) {
      var b = O.el('button', 'fz-zeile', '<span class="t"><span class="w" lang="' + esc(ZS) + '">' + esc(p.gesagt) + '</span><span class="u">' + esc(mitPunkt(p.auftrag)) + '</span></span><span class="stift" aria-hidden="true">✎</span>');
      b.type = 'button'; b.id = 'satz-' + i; b.onclick = function () { aendern(i); }; liste.appendChild(b);
    });
    if (!protokoll.length) liste.innerHTML = '<p class="fz-leer">' + esc(U.nichtsGeerntet) + '</p>';
    O.fb(k, '');
    O.fuss(fussEl, null, { t: U.rueckmeldung, pri: true, go: function () { try { automat.abbrechen(); } catch (e) {} rueckmeldung(); } });
    if (SCHLUSS.z) setTimeout(function () { sprich(SCHLUSS.z); }, 380);
  }
  function aendern(i) {
    kopf(THEMA_NA, 3);
    var p = protokoll[i];
    var k = O.karte(stage);
    O.task(k, mitPunkt(p.auftrag));
    var box = O.el('div', 'fz-selbst');
    box.innerHTML = '<textarea class="fz-feld" id="fz-feld" lang="' + esc(ZS) + '"></textarea>';
    k.appendChild(box); O.fb(k, '');
    var f = box.querySelector('textarea'); f.value = p.gesagt;
    O.fuss(fussEl, { t: U.zurueck, go: function () { schluss(); } }, { t: U.uebernehmen, pri: true, go: function () {
      var alt = p.gesagt, neu = f.value.trim() || alt;
      var j = geerntet.gesagt.indexOf(alt); if (j > -1) geerntet.gesagt[j] = neu;
      p.gesagt = neu; if (neu !== alt) { p.geaendert = true; p.getippt = false; }
      speichern(); schluss();
    } });
    setTimeout(function () { try { f.focus(); } catch (e) {} }, 60);
  }

  /* ══════════════════════════════════════════════════════════
     5 · DIE RÜCKMELDUNG — der EINZIGE Modellaufruf einer Szene
     Nur seine Zeilen (die Musterzeile geht als „üblich" mit, nicht als
     Lösung, 31.08.). Nennt NUR, wo es natürlicher geht. Fällt der Aufruf
     aus, geht es ohne ihn weiter — die Ernte bleibt ihm.
     ══════════════════════════════════════════════════════════ */
  async function rueckmeldung() {
    /* Angetippte Vorschläge sind Skriptzeilen — sie gehen nicht in die Rückmeldung (spart Token, nichts zu berichtigen). */
    var zuege = protokoll.filter(function (p) { return p.gesagt && p.gesagt.trim() && !p.getippt; })
      .map(function (p) { return { gesagt: p.gesagt, aufgabe: p.auftrag || '', vorher: p.vorher || '', ueblich: p.erwartet || '' }; });
    var zeilen = zuege.map(function (z) { return z.gesagt; });
    if (!zuege.length) { ernte(); return; }

    kopf(THEMA_NA, 3);
    var k = O.karte(stage);
    O.task(k, U.warte);
    k.appendChild(O.el('div', 'fz-punkte', '• • •'));
    O.fuss(fussEl, null, null);

    var d = null;
    try {
      var r = await fetch('/api/rueckmeldung', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          zielsprache: ZS, muttersprache: MU, koennen: PROFIL.koennen || 'anfang',
          /* BEIDE Rollen und die Rollenfakten — sonst ist „¿Teno manzanas?" in zwei Richtungen reparierbar (31.08.). */
          szene: [
            THEMA_NA + ' — ' + inSprache(ROLLE && ROLLE.ort),
            'Spikiu spielt: ' + inSprache(ROLLE && ROLLE.spikiu),
            'Der Lerner ist: ' + inSprache(ROLLE && ROLLE.lerner),
            LP.rolleFaktenVon ? LP.rolleFaktenVon(STUFE, THEMA, MU) : ''
          ].filter(Boolean).join(' · '),
          zuege: zuege
        })
      });
      d = await r.json();
      if (!r.ok) { console.error('rueckmeldung ' + r.status, d); d = null; }
      else if (d && (!d.korrekturen || !d.korrekturen.length)) console.log('[Rückmeldung] keine Korrektur. Antwort:', d.roh);
    } catch (e) { console.error('rueckmeldung', e); d = null; }

    if (!d) { ernte(); return; }
    var w = d.worte || { titel: U.korrTitel, sauber: U.sauber };
    var liste = d.korrekturen || [];
    /* Nichts zu berichtigen: KEINE eigene Karte — der Gruß steht über der Ernte (31.08.). */
    if (!liste.length) { ernte(w.sauber || U.sauber); return; }

    k = O.karte(stage);
    O.task(k, w.titel || U.korrTitel);
    var L = O.el('div', 'fz-liste'); k.appendChild(L);
    liste.forEach(function (kor, i) {
      var meins = zeilen[kor.nr - 1] || '';
      var b = O.el('button', 'fz-zeile', '<span class="a" aria-hidden="true">🔊</span><span class="t">' + (meins ? '<span class="x">' + esc(meins) + '</span>' : '') + '<span class="w" lang="' + esc(ZS) + '">' + esc(kor.richtig) + '</span></span>');
      b.type = 'button'; b.id = 'kor-' + i; b.onclick = function () { sprich(kor.richtig); }; L.appendChild(b);
    });
    O.fb(k, '');
    O.fuss(fussEl, null, { t: U.weiter, pri: true, go: function () { ernte(); } });
  }

  /* ══════════════════════════════════════════════════════════
     6 · DIE ERNTE — nur was vorkam
     ══════════════════════════════════════════════════════════ */
  function ernte(gruss) {
    PHASE = 'ernte'; raeumen();
    kopf(THEMA_NA, 4);
    var alles = ' ' + flach(geerntet.gesagt.join(' ') + ' ' + geerntet.gehoert.join(' ')) + ' ';
    var lager = LP.ernte(STUFE, THEMA, MU) || [];
    var drin = lager.filter(function (x) {
      var n = flach(x.z); if (!n) return false;
      if (alles.indexOf(' ' + n + ' ') > -1) return true;
      var ws = n.split(' ').filter(function (s) { return s.length > 3; });
      return ws.length > 0 && ws.every(function (s) { return alles.indexOf(' ' + s) > -1; });
    });
    var k = O.karte(stage);
    O.task(k, (gruss ? gruss + ' ' : '') + U.geuebt, THEMA_NA);
    var L = O.el('div', 'fz-liste'); k.appendChild(L);
    /* Nicht „Das kannst du sagen": auch Spikius Zeilen stehen hier — die muss man VERSTEHEN (31.08.). */
    function gruppe(ueber, eintraege) {
      if (!eintraege.length) return;
      L.appendChild(O.el('div', 'fz-kopf', esc(ueber)));
      eintraege.forEach(function (x) {
        var b = O.el('button', 'fz-zeile', '<span class="a" aria-hidden="true">🔊</span><span class="t"><span class="w" lang="' + esc(ZS) + '">' + esc(x.z) + '</span><span class="u">' + esc(x.na) + '</span></span>');
        b.type = 'button'; b.onclick = function () { sprich(x.z); }; L.appendChild(b);
      });
    }
    gruppe(U.wendungen, drin.filter(function (x) { return x.art === 'wendung'; }));
    gruppe(U.woerter, drin.filter(function (x) { return x.art === 'wort'; }));
    if (!drin.length) L.innerHTML = '<p class="fz-leer">' + esc(U.nichtsGeerntet) + '<br>' + esc(U.nichtsGeerntetText) + '</p>';
    O.fb(k, '');
    try { automat.nachHause(); } catch (e) {}
    O.fuss(fussEl, { t: U.nochmal, go: function () { SCHLUSS = null; start(); } }, { t: U.nachHause, pri: true, go: function () { raeumen(); window.location.href = 'haus.html'; } });
  }

  /* ══════════════════════════════════════════════════════════
     WIEDERKOMMEN — die Sitzung nachspielen (0 Token: alles aus dem Skript)
     ══════════════════════════════════════════════════════════ */
  function wiederherstellen(sv) {
    STUFE = sv.stufe || STUFE; THEMA = sv.thema;
    if (!LP.gefuellt(STUFE, THEMA) || !vorbereiten()) { raeumen(); waehler(); return; }
    lexikonDann(function () {
      var alt = sv.protokoll || [];
      if (sv.phase === 'buehne' || (sv.phase === 'tisch' && !alt.length)) { buehne(); return; }
      automat.los();
      letzteSpikiu = eroeffnung();
      automat.spikiuAntwortet(letzteSpikiu.z); geerntet.gehoert.push(letzteSpikiu.z);
      alt.forEach(function (p) {
        automat.antworte(p.gesagt, 'offen');
        protokoll.push(p); geerntet.gesagt.push(p.gesagt);
        var a = zielzeilen[p.aufgabe] || { z: '' };
        var zs = automat.zustand();
        if (!(zs.ausgangOffen || zs.zug >= ZUG_DECKEL)) { automat.spikiuAntwortet(a.z); geerntet.gehoert.push(a.z); letzteSpikiu = a; }
        else letzteSpikiu = a;
      });
      var z = automat.zustand();
      if (sv.phase === 'schluss' || z.ausgangOffen || z.zug >= ZUG_DECKEL) {
        var letzte = alt.length ? zielzeilen[alt[alt.length - 1].aufgabe] : null;
        schluss(z.ausgangOffen ? letzte : null, !z.ausgangOffen);
        return;
      }
      zug();
    });
  }

  /* ══════════════════════════════════════════════════════════
     EINTRITT
     ══════════════════════════════════════════════════════════ */
  if (!LP || !window.SpikiuSzene) { hinweis(U.keineDaten); return; }
  if (LP.zielsprache && LP.zielsprache !== ZS) { console.warn('[Szene] Profil will "' + ZS + '", geladen ist "' + LP.zielsprache + '".'); ZS = LP.zielsprache; }
  (function eintritt() {
    var sv = null;
    try { sv = (window.spikiuSitzung && window.spikiuSitzung.lade) ? window.spikiuSitzung.lade('szene') : null; } catch (e) { sv = null; }
    var passt = sv && sv.thema && sv.phase && (!THEMA || sv.thema === THEMA) && LP.gefuellt(sv.stufe || STUFE, sv.thema);
    if (passt && window.spikiuSitzung.frageWiederkommen) {
      window.spikiuSitzung.frageWiederkommen({ raum: 'szene', ts: sv.ts, wo: sv.themaNa || '',
        beimWeiter: function () { wiederherstellen(sv); },
        beimNeu: function () { raeumen(); if (THEMA) start(); else waehler(); } });
      return;
    }
    if (THEMA) start(); else waehler();
  })();
})();
</script>
