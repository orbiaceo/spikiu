<title>Spikiu · Szene</title>
<!--
  ══════════════════════════════════════════════════════════════════════
  SPIKIU — DIE SZENE

  WAS DER LERNER HIER TUT (Leos Worte, 30.08.):
  „Der User bekommt ganz konkrete Aufgaben. Es ist so eine Art
   Übersetzungsaufgabe, wo er seinen Wortschatz und seine Fähigkeit zu
   formulieren trainiert."
  Er weiß WAS er sagen soll und muss es SELBST BAUEN. Das kann er weder im
  geführten Gespräch (dort wählt er) noch im Gym (dort erkennt er).

  WARUM SPIKIU AUS DER DATENBANK ANTWORTET
  Erster Versuch (30.08.): Haiku antwortete frei, mit der Skriptzeile als Ziel.
  Am Gerät fragte der Taxifahrer „¿Cuántas maletas tienes?", die Szene driftete,
  nach drei Zügen war sie vorbei ohne dass etwas geübt worden wäre. Leo: „Das
  bringt gar nichts." Jetzt ist Spikius Zeile IMMER die nächste Skriptzeile.
  Die Szene kann nicht entgleisen, weil nichts zu entgleisen ist.

  **NULL TOKEN. Kein fetch, kein Modell, kein Netz.** Die Szene läuft offline.
  Das Modell kommt später für EINEN Aufruf am Ende — die Rückmeldung auf das,
  was der Lerner wirklich geschrieben hat. Eigener Schritt, noch nicht gebaut.

  DER DANEBENSCHUSS (Leos „Joker-User")
  Wir kennen die Zeile, die er hätte sagen sollen — also können wir prüfen,
  umsonst. Der Test ist milde: EIN tragendes Wort genügt, akzentfrei und
  endungstolerant. Beim zweiten Danebenschuss geht die Aufgabe TROTZDEM durch;
  niemand steckt fest (Entscheid A).

  DER SOUFFLEUR (Entscheid 30.08., kehrt Frage 8 um)
  Die Aufgabe steht NICHT offen da. Erster Tipp auf den Capy: die Aufgabe.
  Zweiter Tipp: der fertige Satz mit „Einsetzen". Abschreiben ist erlaubt —
  es ist seine Entscheidung, und er darf ihn vorher ändern.

  Kein Bottom-Nav: das hier ist ein Raum, nur haus.html trägt die Navi.
  ══════════════════════════════════════════════════════════════════════
-->

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#eef7f1;--white:#fff;--ink:#15163a;--mid:#5f7068;--accent:#1f93b0;
  --accent2:#e8f5ee;--du:#ffd24a;--faint:#dfe6e0;--ow:2.5px;
  --trans-bg:#f1eee8;--trans-ink:#8a847d;--trans-border:#e2ddd4;
}
html,body{height:100%;background:var(--bg);color:var(--ink);
  font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;height:100dvh;max-width:680px;margin:0 auto}

.kopf{display:flex;align-items:center;gap:.7rem;padding:.7rem 1rem;
  border-bottom:var(--ow) solid var(--ink);background:var(--bg);flex:0 0 auto}
.back{width:38px;height:38px;border-radius:999px;border:2.5px solid var(--ink);
  background:#fff;font-size:1.15rem;line-height:1;box-shadow:2px 2px 0 var(--ink);
  cursor:pointer;flex:0 0 auto}
.back:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.kopf .titel{font:600 .95rem/1.2 'DM Sans'}
.kopf .titel span{display:block;font-weight:400;font-size:.75rem;color:var(--mid)}

/* ── Horizontales Deck: EINE Karte pro Bildschirm ─────────────────────────
   Übernommen aus chat.html, weil es sich am Gerät bewährt hat: die Karten
   liegen absolut übereinander, die aktuelle steht in der Mitte, die alten
   links, die kommenden rechts. Kein Scrollen, um an „Senden" zu kommen. */
.deck{flex:1;position:relative;overflow:hidden;background:var(--bg)}
.karte{position:absolute;inset:1rem .9rem;box-sizing:border-box;display:flex;
  flex-direction:column;justify-content:center;overflow-y:auto;
  background:var(--white);border:var(--ow) solid var(--ink);border-radius:22px;
  box-shadow:5px 6px 0 var(--ink);padding:1.3rem 1.2rem;
  transform:translateX(118%);opacity:0;pointer-events:none;
  transition:transform .38s cubic-bezier(.4,0,.2,1),opacity .38s ease;
  will-change:transform,opacity}
.karte.jetzt{transform:translateX(0) rotate(0);opacity:1;pointer-events:auto;z-index:2}
.karte.kommt{transform:translateX(114%) rotate(1.5deg);opacity:0;z-index:1}
.karte.war  {transform:translateX(-114%) rotate(-1.5deg);opacity:0;z-index:1}
@media (prefers-reduced-motion:reduce){.karte{transition:none}}

/* Wisch-Hinweis: nur auf der ersten Karte, verschwindet nach dem ersten Wisch */
.wischhilfe{text-align:center;font:600 .78rem/1 'DM Sans';color:var(--mid);
  margin-top:.9rem;opacity:.75}

/* Der Änderungs-Stift auf den gelben Lerner-Karten */
.stift{position:absolute;top:.7rem;right:.8rem;width:34px;height:34px;
  border-radius:999px;border:2px solid var(--ink);background:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:.95rem;
  box-shadow:2px 2px 0 var(--ink);color:var(--ink)}
.stift:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}

.bue-bild{height:130px;border-radius:.7rem;border:2px solid var(--ink);
  background:linear-gradient(145deg,#cfe6db,#a9cfc0);display:flex;align-items:center;
  justify-content:center;font-size:3rem;margin-bottom:.9rem}
.bue-titel{font:600 1.6rem/1.15 'Cormorant Garamond',serif;margin-bottom:.4rem}
.bue-ort{font:400 .85rem/1.4 'DM Sans';color:var(--mid);margin-bottom:.9rem}
.rollen{display:flex;gap:.6rem;margin-bottom:1rem}
.rolle{flex:1;background:var(--accent2);border:2px solid var(--ink);
  border-radius:.6rem;padding:.6rem}
.rolle .l{font:700 .62rem/1 'DM Sans';letter-spacing:.09em;text-transform:uppercase;
  color:var(--mid);margin-bottom:.25rem}
.rolle .n{font:600 .95rem/1.2 'DM Sans'}

.k-rolle{font:700 .65rem/1 'DM Sans';letter-spacing:.1em;text-transform:uppercase;
  color:var(--mid);margin-bottom:.85rem}
.zug{font:400 1.55rem/1.35 'Cormorant Garamond',serif;text-align:center;margin-bottom:.7rem}
.werkz{display:flex;gap:.55rem;justify-content:center;margin-bottom:.2rem}
.ikon{height:42px;min-width:42px;padding:0 .75rem;border-radius:999px;
  border:2px solid var(--ink);background:var(--accent2);display:flex;
  align-items:center;justify-content:center;cursor:pointer;
  font:700 .78rem/1 'DM Sans';color:var(--ink)}
.ikon:active{transform:translate(1px,1px)}
.ueb{font:italic 400 .88rem/1.45 'DM Sans';color:var(--trans-ink);background:var(--trans-bg);
  border:1px solid var(--trans-border);border-radius:.5rem;padding:.5rem .7rem;
  margin-top:.7rem;display:none}
.ueb.an{display:block}

.trenn{height:1px;background:var(--faint);margin:1rem 0}
.schritte{display:flex;gap:.4rem;justify-content:center;margin-bottom:.6rem}
.st{width:34px;height:5px;border-radius:99px;background:var(--faint)}
.st.jetzt{background:var(--accent)}
.st.fertig{background:var(--ink)}
.zaehler{text-align:center;font:500 .78rem/1 'DM Sans';color:var(--mid);margin-bottom:.9rem}
.aufg{display:flex;gap:.7rem;align-items:center;min-height:44px}
.capy{width:42px;height:42px;flex:0 0 auto;border-radius:50%;border:2.5px solid var(--ink);
  background:#fff;box-shadow:3px 3px 0 var(--ink);display:flex;align-items:center;
  justify-content:center;cursor:pointer;position:relative;
  animation:schweben 4s ease-in-out infinite}
@keyframes schweben{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.capy{animation:none}}
.capy svg{width:27px;height:27px}
.capy .punkt{position:absolute;top:-3px;right:-3px;width:14px;height:14px;
  border-radius:50%;background:var(--accent);border:2px solid var(--ink)}
.aufg .txt{flex:1}
.aufg .txt .leer{font:400 .95rem/1.3 'DM Sans';color:var(--mid);font-style:italic}
.hinweis{margin-top:.8rem;background:var(--accent2);border:2px solid var(--ink);
  border-radius:.7rem;padding:.7rem .8rem;display:none}
.hinweis.an{display:block}
.hinweis .l{font:700 .6rem/1 'DM Sans';letter-spacing:.09em;text-transform:uppercase;
  color:var(--mid);margin-bottom:.3rem}
.hinweis .s{font:500 1.15rem/1.3 'Cormorant Garamond',serif;margin-bottom:.5rem}
.hinweis .kn{display:flex;gap:.5rem}
.hinweis button{flex:1;padding:.5rem;border:2px solid var(--ink);border-radius:.5rem;
  background:#fff;font:600 .8rem/1 'DM Sans';cursor:pointer;color:var(--ink)}
.aufg .txt .l{font:700 .62rem/1 'DM Sans';letter-spacing:.09em;text-transform:uppercase;
  color:var(--mid);margin-bottom:.2rem}
.aufg .txt .t{font:600 1.15rem/1.25 'Cormorant Garamond',serif}

.feld{width:100%;min-height:74px;border:var(--ow) solid var(--ink);border-radius:.8rem;
  padding:.8rem;font:400 1.05rem/1.4 'DM Sans';text-align:center;resize:none;
  background:#fff;margin-top:1rem;color:var(--ink)}
.feld:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px #d3eef6}
.knopf{width:100%;margin-top:.7rem;padding:.85rem;border:var(--ow) solid var(--ink);
  border-radius:999px;background:var(--accent);color:#fff;font:700 1rem/1 'DM Sans';
  box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.knopf:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.knopf.gelb{background:var(--du);color:var(--ink)}
.knopf.stumm{background:#fff;color:var(--ink)}
.knopf[disabled]{opacity:.45;cursor:default}

.karte.du{background:var(--du)}
.karte.du .zug{padding-top:1.4rem}
.karte.du .zug{font-family:'DM Sans',sans-serif;font-size:1.15rem;font-weight:500;
  text-align:right;margin:0}

.k-erklaer{background:var(--accent2)}
.k-erklaer .w{font:600 1.35rem/1.2 'Cormorant Garamond',serif;margin-bottom:.3rem}
.k-erklaer .b{font:400 .95rem/1.45 'DM Sans';color:var(--mid)}

.e-kopf{font:700 .65rem/1 'DM Sans';letter-spacing:.1em;text-transform:uppercase;
  color:var(--mid);margin:1.1rem 0 .5rem}
.e-z{display:flex;gap:.6rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--faint)}
.e-a{width:32px;height:32px;flex:0 0 auto;border-radius:999px;border:none;
  background:var(--accent2);color:var(--accent);cursor:pointer;font-size:.85rem}
.e-w{flex:1;font:500 1.15rem/1.25 'Cormorant Garamond',serif}
.e-t{font:400 .82rem/1.25 'DM Sans';color:var(--mid);text-align:right}

.punkte{text-align:center;font-size:1.6rem;letter-spacing:.2em;color:var(--faint);padding:1.4rem 0}
.fehlerkarte{border-color:#b4534b;box-shadow:5px 6px 0 #b4534b}
.fehlerkarte .zug{font-family:'DM Sans',sans-serif;font-size:1rem;color:#b4534b}

.wahl{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
.wahl button{flex:1 1 44%;padding:.7rem .5rem;border:2px solid var(--ink);
  border-radius:.7rem;background:#fff;font:600 .9rem/1.2 'DM Sans';cursor:pointer;
  box-shadow:3px 3px 0 var(--ink);color:var(--ink)}
.wahl button:active{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
.wahl button.leer{opacity:.4}
</style>
</head>
<body>
<div class="app">
  <div class="kopf">
    <button class="back" id="zurueck" aria-label="Zurück">‹</button>
    <div class="titel" id="kopfTitel">Szene<span id="kopfUnter">wird geladen …</span></div>
  </div>
  <div class="deck" id="deck"></div>
</div>

<script src="lernpfad-daten.js"></script>
<script src="lernpfad-daten-de.js"></script>
<script src="lernpfad-daten-en.js"></script>
<script src="lernpfad-sprache.js"></script>
<script src="szene.js"></script>
<script src="frage-sieb.js"></script>
<script src="sitzung.js"></script>
<script>
(function () {
  'use strict';

  /* Die Decke ist hier KEINE Kostenbremse mehr — die Szene kostet nichts.
     Sie sorgt nur dafür, dass eine Szene endet: drei Aufgaben mal höchstens
     zwei Versuche plus ein paar Rückfragen. */
  var ZUG_DECKEL  = 9;
  var MAX_DANEBEN = 2;    // beim zweiten Danebenschuss geht die Aufgabe durch

  var deck  = document.getElementById('deck');
  var titel = document.getElementById('kopfTitel');
  var unter = document.getElementById('kopfUnter');

  /* Kanonischer Spikiu. Nie neu erfinden, immer diese Form. */
  var CAPY = '<svg viewBox="0 0 80 80" fill="none" aria-hidden="true">'
  + '<ellipse cx="40" cy="50" rx="28" ry="20" fill="#c9956a"/>'
  + '<ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/>'
  + '<ellipse cx="26" cy="17" rx="5" ry="5" fill="#b8845a"/>'
  + '<ellipse cx="54" cy="17" rx="5" ry="5" fill="#b8845a"/>'
  + '<ellipse cx="40" cy="36" rx="10" ry="7" fill="#b8845a"/>'
  + '<ellipse cx="40" cy="33" rx="4" ry="2.5" fill="#8b5e3c"/>'
  + '<circle cx="38" cy="33" r="1" fill="#6b4226"/><circle cx="42" cy="33" r="1" fill="#6b4226"/>'
  + '<circle cx="33" cy="26" r="2.4" fill="#3d2b1f"/><circle cx="47" cy="26" r="2.4" fill="#3d2b1f"/>'
  + '<circle cx="33.8" cy="25.2" r=".8" fill="#fff"/><circle cx="47.8" cy="25.2" r=".8" fill="#fff"/>'
  + '<path d="M35 40 Q40 43 45 40" stroke="#8b5e3c" stroke-width="1.5" fill="none" stroke-linecap="round"/>'
  + '<ellipse cx="26" cy="66" rx="5" ry="4" fill="#b8845a"/>'
  + '<ellipse cx="36" cy="68" rx="5" ry="4" fill="#b8845a"/>'
  + '<ellipse cx="46" cy="68" rx="5" ry="4" fill="#b8845a"/>'
  + '<ellipse cx="56" cy="66" rx="5" ry="4" fill="#b8845a"/></svg>';

  /* Die Figur bleibt in der Rolle, wenn sie nicht versteht — sie schimpft
     nicht und erklärt nicht. Dieselbe Zeile für alle Stationen, deshalb hier
     und nicht in den Datendateien. */
  var NICHT_VERSTANDEN = {
    es: { z: 'Perdone, no le entiendo.',
          na: { de: 'Verzeihung, ich verstehe Sie nicht.', en: "Sorry, I don't understand." } },
    de: { z: 'Entschuldigung, das verstehe ich nicht.',
          na: { es: 'Perdone, no le entiendo.', en: "Sorry, I don't understand." } },
    en: { z: "Sorry, I didn't catch that.",
          na: { de: 'Entschuldigung, das habe ich nicht verstanden.', es: 'Perdone, no le entendí.' } }
  };

  /* ── Werkzeug ─────────────────────────────────────────────── */
  function esc(t) {
    return String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function pfeil(name) {
    try { return new URLSearchParams(location.search).get(name) || ''; }
    catch (e) { return ''; }
  }
  function inSprache(o, mu) { return o ? (o[mu] || o.de || o.en || o.es || '') : ''; }

  /* Akzente weg, Satzzeichen weg, klein. „¿Está libre?" und „esta libre"
     sind dasselbe — Tippfehler dürfen nicht bestraft werden. */
  function flach(t) {
    return String(t || '')
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-zäöüß0-9\s]/gi, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  /* ══════════════════════════════════════════════════════════
     DIE TREFFERPRÜFUNG (Entscheid A: ein Wort genügt)

     Wir kennen die Zeile, die er hätte sagen sollen. Aus ihr nehmen wir die
     tragenden Wörter — ab vier Buchstaben, ohne Füllwörter. Kommt EINES davon
     in seiner Antwort vor, ist er in der Szene.

     Verglichen wird der WORTSTAMM (fünf Buchstaben), damit „maleta / maletas /
     Maletas." alle zählen. Der Preis: „No tengo maleta" besteht auch. Das ist
     richtig so — geprüft wird, ob er in der Szene ist, nicht ob er die
     Wahrheit sagt.
     ══════════════════════════════════════════════════════════ */
  var FUELL = ('der die das den dem des ein eine einen einem und oder aber ist sind war'
    + ' ich sie wir ihr mit von zum zur fuer auf aus nicht kein sehr auch noch schon dann'
    + ' habe haben hast bitte danke'
    + ' el la los las un una unos unas pero es son esta estan soy eres con para por del al'
    + ' que muy tambien mas favor gracias tengo tiene'
    + ' the an and but are was with from for you your this that have has please thanks'
    + ' would like want').split(/\s+/);

  function stamm(w) { return w.slice(0, 5); }

  function tragend(zeile) {
    var w = flach(zeile).split(' ').filter(function (x) { return x.length >= 4; });
    var ohneFuell = w.filter(function (x) { return FUELL.indexOf(x) === -1; });
    if (ohneFuell.length) return ohneFuell;
    /* Vier von 180 Skriptzeilen tragen kein Wort ab vier Buchstaben:
       „Para dos, por favor." · „¿De qué vía?" · „Two, please." · „Is it far?"
       Ohne Rückfallstufe würden sie ALLES durchlassen. Deshalb hier ab drei
       Buchstaben — „dos", „via", „two", „far" sind dort das ganze Ereignis. */
    return flach(zeile).split(' ').filter(function (x) {
      return x.length >= 3 && FUELL.indexOf(x) === -1;
    });
  }

  function trifft(antwort, erwartet) {
    var ziel = tragend(erwartet);
    if (!ziel.length) return true;                  // nichts zu prüfen → durchlassen
    var meine = flach(antwort).split(' ').filter(function (w) { return w.length >= 3; });
    for (var i = 0; i < ziel.length; i++) {
      for (var j = 0; j < meine.length; j++) {
        if (stamm(meine[j]) === stamm(ziel[i])) return true;
      }
    }
    return false;
  }

  /* ── Profil ───────────────────────────────────────────────── */
  var PROFIL = {};
  try { PROFIL = JSON.parse(localStorage.getItem('spikiu_user') || '{}') || {}; }
  catch (e) { PROFIL = {}; }
  var MU = PROFIL.muttersprache || 'de';
  var ZS = PROFIL.zielsprache   || 'es';
  var LP = window.SpikiuLernpfad || null;

  /* ── Zustand dieser Seite ─────────────────────────────────── */
  var STUFE = pfeil('stufe') || 'a1';
  var THEMA = pfeil('thema') || '';
  var ST = null, ROLLE = null, automat = null;
  var zielzeilen = [];
  var lernerZeilen = [];
  var abrundungIstZiel = false;
  var daneben = 0;
  var geerntet = { gesagt: [], gehoert: [] };
  var protokoll = [];        // für die spätere Rückmeldung am Ende
  var busy = false;

  /* ══════════════════════════════════════════════════════════
     KARTEN
     ══════════════════════════════════════════════════════════ */
  /* ══════════════════════════════════════════════════════════
     DAS HORIZONTALE DECK
     Eine Karte pro Bildschirm. Wischen nach links = weiter (nur auf
     Spikiu-Karten), nach rechts = zurückblättern. Zurückblättern ist immer
     erlaubt — es ist Lesen, nicht Spielen.
     ══════════════════════════════════════════════════════════ */
  var reelIndex = 0;
  function slides() { return deck.querySelectorAll('.karte'); }

  /* Passt den Haupttext an, bis die Karte ohne Scrollen hineinpasst. Eine
     Regel an einem Ort statt fester Größen pro Element (aus chat.html). */
  function anpassen(s) {
    if (!s) return;
    var haupt = s.querySelectorAll('.zug');
    if (!haupt.length) return;
    var px = Math.min(30, Math.max(19, Math.round((s.clientWidth || 340) * 0.075)));
    var schutz = 0;
    function setze(v) {
      for (var i = 0; i < haupt.length; i++) haupt[i].style.fontSize = v + 'px';
    }
    setze(px);
    while (s.scrollHeight > s.clientHeight - 4 && px > 15 && schutz < 40) {
      px -= 1; setze(px); schutz++;
    }
  }

  function anordnen() {
    var l = slides();
    if (!l.length) return;
    if (reelIndex > l.length - 1) reelIndex = l.length - 1;
    if (reelIndex < 0) reelIndex = 0;
    for (var i = 0; i < l.length; i++) {
      l[i].className = l[i].className.replace(/\s*(jetzt|war|kommt)/g, '')
        + ' ' + (i < reelIndex ? 'war' : i === reelIndex ? 'jetzt' : 'kommt');
    }
    var jetzt = l[reelIndex];
    if (jetzt) {
      if (window.requestAnimationFrame) requestAnimationFrame(function () { anpassen(jetzt); });
      else anpassen(jetzt);
      var f = jetzt.querySelector('.feld');
      if (f && !f.disabled) setTimeout(function () { try { f.focus(); } catch (e) {} }, 250);
    }
  }
  function zeige(i) { reelIndex = i; anordnen(); }
  function zurZuletzt() { zeige(slides().length - 1); }
  function vor()  { if (reelIndex < slides().length - 1) { reelIndex++; anordnen(); } }
  function rueck() { if (reelIndex > 0) { reelIndex--; anordnen(); } }

  (function gesten() {
    window.addEventListener('resize', function () { if (slides().length) anordnen(); });
    var x0 = null, y0 = null;
    deck.addEventListener('touchstart', function (e) {
      var t = e.touches[0]; x0 = t.clientX; y0 = t.clientY;
    }, { passive: true });
    deck.addEventListener('touchend', function (e) {
      if (x0 == null) return;
      var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
      x0 = null;
      if (Math.abs(dx) < 45 || Math.abs(dy) > Math.abs(dx)) return;   // nur klar horizontal
      if (dx < 0) {
        /* Vorwärts nur, solange die Karte nichts von dir will. Eine Karte mit
           offenem Eingabefeld darf man nicht wegwischen — sonst verliert der
           Lerner sein Feld und weiß nicht, wohin. */
        var cur = slides()[reelIndex];
        if (cur && cur.querySelector('.feld:not([disabled])')) return;
        vor();
      } else rueck();
    }, { passive: true });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') rueck();
      else if (e.key === 'ArrowRight') {
        var cur = slides()[reelIndex];
        if (cur && cur.querySelector('.feld:not([disabled])')) return;
        vor();
      }
    });
  })();

  /* stehenbleiben = true legt die Karte an, springt aber NICHT hin. Nötig am
     Schluss: dort entstehen drei Karten hintereinander (letzte Antwort,
     Abrundung, Ausgang). Sprang das Deck jedesmal ans Ende, sah der Lerner
     nur den Ausgang und musste zurückblättern, um Spikius letzte Worte zu
     finden (gesehen 31.08.). Jetzt bleibt er stehen und wischt selbst. */
  function karte(klasse, stehenbleiben) {
    var d = document.createElement('div');
    d.className = 'karte' + (klasse ? ' ' + klasse : '') + ' kommt';
    deck.appendChild(d);
    if (!stehenbleiben) setTimeout(zurZuletzt, 20);
    else setTimeout(anordnen, 20);
    return d;
  }

  /* Eine kurze Pause vor Spikius Antwort. Die Zeile steht sofort bereit —
     ohne Pause wirkt es wie ein Automat, nicht wie ein Gegenüber. */
  function nachDenkpause(fn) {
    var k = karte();
    k.innerHTML = '<div class="punkte">• • •</div>';
    setTimeout(function () {
      if (k.parentNode) k.parentNode.removeChild(k);
      if (reelIndex >= slides().length) reelIndex = slides().length - 1;
      fn();
    }, 700);
  }

  function sprich(text) {
    if (window.spkSpeak) { try { return window.spkSpeak(text, ZS); } catch (e) {} }
    try {
      var s = window.speechSynthesis;
      if (s && typeof SpeechSynthesisUtterance !== 'undefined') {
        var u = new SpeechSynthesisUtterance(String(text));
        u.lang = { de: 'de-DE', es: 'es-ES', en: 'en-US', el: 'el-GR' }[ZS] || 'en-US';
        s.cancel(); s.speak(u);
      }
    } catch (e) {}
  }

  /* ══════════════════════════════════════════════════════════
     1 · BÜHNE
     ══════════════════════════════════════════════════════════ */
  function buehne() {
    var thema = LP.thema(THEMA);
    var k = karte();
    k.innerHTML =
      '<div class="bue-bild">' + esc(thema ? thema.em : '🎭') + '</div>'
    + '<div class="bue-titel">' + esc(inSprache(thema && thema.na, MU)) + '</div>'
    + '<div class="bue-ort">' + esc(inSprache(ROLLE && ROLLE.ort, MU)) + '</div>'
    + '<div class="rollen">'
    +   '<div class="rolle"><div class="l">Spikiu ist</div><div class="n">'
    +     esc(inSprache(ROLLE && ROLLE.spikiu, MU)) + '</div></div>'
    +   '<div class="rolle"><div class="l">Du bist</div><div class="n">'
    +     esc(inSprache(ROLLE && ROLLE.lerner, MU)) + '</div></div>'
    + '</div>';
    k.insertAdjacentHTML('beforeend',
      '<div class="wischhilfe">← wischen zum Weiterblättern →</div>');
    var b = document.createElement('button');
    b.className = 'knopf';
    b.textContent = 'Los!';
    b.onclick = function () {
      b.disabled = true;
      automat.los();
      var e = LP.eroeffnungVon(STUFE, THEMA);
      spikiuSagt((e && e.z) || '', (e && e.na) ? inSprache(e.na, MU) : '', true);
    };
    k.appendChild(b);
  }

  /* ══════════════════════════════════════════════════════════
     2 · SPIKIU SAGT — immer aus der Datenbank
     ══════════════════════════════════════════════════════════ */
  function spikiuSagt(text, bruecke, mitFeld, stehenbleiben) {
    automat.spikiuAntwortet(text);
    geerntet.gehoert.push(text);
    speichern();

    var z = automat.zustand();
    var aufgaben = automat.aufgabenListe();
    var k = karte(null, stehenbleiben);

    var h = '<div class="k-rolle">' + esc(inSprache(ROLLE && ROLLE.spikiu, MU)) + '</div>'
          + '<div class="zug">' + esc(text) + '</div>'
          + '<div class="werkz">'
          +   '<button class="ikon" data-hoer aria-label="Anhören">🔊</button>'
          +   (bruecke ? '<button class="ikon" data-ueb aria-label="Übersetzung">'
                       + esc(MU.toUpperCase()) + '</button>' : '')
          + '</div>'
          + (bruecke ? '<div class="ueb">' + esc(bruecke) + '</div>' : '');

    var zeigeAufgabe = mitFeld && z.aufgabeIndex < aufgaben.length;
    if (zeigeAufgabe) {
      h += '<div class="trenn"></div><div class="schritte">';
      for (var i = 0; i < aufgaben.length; i++) {
        h += '<div class="st' + (i < z.aufgabeIndex ? ' fertig'
                               : i === z.aufgabeIndex ? ' jetzt' : '') + '"></div>';
      }
      h += '</div><div class="zaehler">Aufgabe ' + (z.aufgabeIndex + 1)
        +  ' von ' + aufgaben.length + '</div>'
        +  '<div class="aufg">'
        +    '<div class="capy" data-capy role="button" tabindex="0" aria-label="Hilfe">'
        +      '<span class="punkt" data-punkt></span>' + CAPY + '</div>'
        +    '<div class="txt"><div class="l" data-lbl></div>'
        +    '<div class="t leer" data-aufg>Was soll ich tun?</div></div>'
        +  '</div>'
        +  '<div class="hinweis" data-hinweis>'
        +    '<div class="l">So könntest du es sagen</div>'
        +    '<div class="s" data-satz></div>'
        +    '<div class="kn"><button data-einsetzen>Einsetzen</button>'
        +      '<button data-hsprich>🔊 Anhören</button></div>'
        +  '</div>'
        +  '<textarea class="feld" placeholder="Antworte …"></textarea>';
    }
    k.innerHTML = h;

    var hb = k.querySelector('[data-hoer]'); if (hb) hb.onclick = function () { sprich(text); };
    var ub = k.querySelector('[data-ueb]');
    if (ub) ub.onclick = function () { k.querySelector('.ueb').classList.toggle('an'); };

    if (zeigeAufgabe) bauSouffleur(k, z.aufgabeIndex, aufgaben);
  }

  /* ══════════════════════════════════════════════════════════
     3 · DER SOUFFLEUR — zwei Stufen auf Tipp
     Erster Tipp: die Aufgabe. Zweiter: der fertige Satz.
     Der blaue Punkt sagt „hier gibt es noch mehr" und verschwindet,
     wenn alles ausgeklappt ist — sonst weiß niemand, dass man tippen kann.
     ══════════════════════════════════════════════════════════ */
  function bauSouffleur(k, index, aufgaben) {
    var stufe  = 0;
    var capy   = k.querySelector('[data-capy]');
    var punkt  = k.querySelector('[data-punkt]');
    var lbl    = k.querySelector('[data-lbl]');
    var txt    = k.querySelector('[data-aufg]');
    var hin    = k.querySelector('[data-hinweis]');
    var satzEl = k.querySelector('[data-satz]');
    var feld   = k.querySelector('.feld');

    /* Der Satz zum Abschreiben ist die LERNERZEILE aus dem Skript — sie steht
       in der Datenbank, der Hinweis kostet nichts. */
    var satz = lernerZeilen[index] ? lernerZeilen[index].z : '';
    satzEl.textContent = satz;

    function zeichne() {
      if (stufe === 0) {
        lbl.textContent = '';
        txt.className = 't leer';
        txt.textContent = 'Was soll ich tun?';
      } else {
        lbl.textContent = 'Deine Aufgabe';
        txt.className = 't';
        txt.textContent = inSprache(aufgaben[index], MU);
      }
      hin.classList.toggle('an', stufe >= 2 && !!satz);
      punkt.style.display = (stufe >= 2 || (stufe === 1 && !satz)) ? 'none' : 'block';
    }
    capy.onclick = function () { stufe = Math.min(stufe + 1, 2); zeichne(); };
    capy.onkeydown = function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); capy.click(); }
    };
    zeichne();

    /* Wer schon einmal danebenlag, bekommt die Aufgabe von selbst zu sehen —
       er soll nicht auch noch raten müssen, wo die Hilfe steckt. */
    if (daneben > 0) { stufe = 1; zeichne(); }

    k.querySelector('[data-hsprich]').onclick = function () { sprich(satz); };
    k.querySelector('[data-einsetzen]').onclick = function () {
      feld.value = satz;
      feld.dispatchEvent(new Event('input'));
      try { feld.focus(); } catch (e) {}
    };

    var b = document.createElement('button');
    b.className = 'knopf';
    b.textContent = 'Senden';
    b.disabled = true;
    feld.addEventListener('input', function () { b.disabled = !feld.value.trim(); });
    feld.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); if (!b.disabled) b.click(); }
    });
    b.onclick = function () {
      var t = feld.value.trim();
      if (!t || busy) return;                     // R4 · Doppelklick prallt ab
      b.disabled = true; feld.disabled = true; capy.onclick = null;
      senden(t, index);
    };
    k.appendChild(b);
    setTimeout(function () { try { feld.focus(); } catch (e) {} }, 60);
  }

  /* ══════════════════════════════════════════════════════════
     DIE GELBE KARTE DES LERNERS — mit Änderungs-Stift

     Zurückblättern und ändern (Leo, 30.08.). Geändert wird NUR der Text:
     die Karte, die Ernte und die spätere Rückmeldung rechnen mit der neuen
     Fassung. Die Szene spult NICHT zurück — Spikius Zeilen kommen aus der
     Datenbank, hinter der Korrektur käme also dieselbe Antwort wieder. Ein
     Rückspulen ließe den Lerner seine Arbeit wegwerfen, ohne dass sich etwas
     ändert (Entscheid A).
     ══════════════════════════════════════════════════════════ */
  function lernerKarte(text, nr) {
    var k = karte('du');

    function ansicht() {
      k.innerHTML = '<button class="stift" data-stift aria-label="Ändern">✎</button>'
                  + '<div class="zug">' + esc(protokoll[nr].gesagt) + '</div>';
      k.querySelector('[data-stift]').onclick = bearbeiten;
    }
    function bearbeiten() {
      var alt = protokoll[nr].gesagt;
      k.innerHTML = '<textarea class="feld" style="margin-top:0"></textarea>';
      var f = k.querySelector('.feld');
      f.value = alt;
      var fertig = document.createElement('button');
      fertig.className = 'knopf';
      fertig.textContent = 'Übernehmen';
      fertig.onclick = function () {
        var neu = f.value.trim() || alt;
        /* Auch in der Ernte ersetzen — dort steht das, was er WIRKLICH
           gesagt hat, und das ist jetzt die neue Fassung. */
        var i = geerntet.gesagt.indexOf(alt);
        if (i > -1) geerntet.gesagt[i] = neu;
        protokoll[nr].gesagt = neu;
        protokoll[nr].getroffen = trifft(neu, protokoll[nr].erwartet);
        protokoll[nr].geaendert = true;
        speichern();
        ansicht();
        anordnen();
      };
      k.appendChild(fertig);
      setTimeout(function () { try { f.focus(); } catch (e) {} }, 60);
      anordnen();
    }
    ansicht();
    return k;
  }

  /* ══════════════════════════════════════════════════════════
     4 · DER ZUG DES LERNERS
     ══════════════════════════════════════════════════════════ */
  function senden(text, index) {
    var art = 'offen';
    try { if (window.SpikiuSieb) art = window.SpikiuSieb.art(text, ZS, MU); } catch (e) {}

    var erwartet = lernerZeilen[index] ? lernerZeilen[index].z : '';
    var getroffen = (art === 'offen') && trifft(text, erwartet);
    var durchlassen = getroffen || daneben >= MAX_DANEBEN - 1;

    /* Nur ein offener UND durchgelassener Zug rückt die Aufgabe vor. Alles
       andere zählt gegen die Decke, aber nicht gegen die Aufgaben (R13). */
    var z = automat.antworte(text, (art === 'offen' && durchlassen) ? 'offen' : 'rolle');
    if (z.abgelehnt) return;

    busy = true;
    protokoll.push({ aufgabe: index, gesagt: text, erwartet: erwartet, getroffen: getroffen });
    lernerKarte(text, protokoll.length - 1);

    if (art === 'offen' && durchlassen) { geerntet.gesagt.push(text); daneben = 0; }
    else if (art === 'offen')           { daneben += 1; }
    speichern();

    nachDenkpause(function () {
      busy = false;
      var neu = automat.zustand();

      if (art !== 'offen') {
        /* Rückfrage oder Meta-Frage: die Figur wiederholt ihre Zeile,
           die Aufgabe bleibt stehen. */
        spikiuSagt(zielzeilen[index] || '', brueckeZu(index), true);
        return;
      }
      if (!durchlassen) {
        var nv = NICHT_VERSTANDEN[ZS] || NICHT_VERSTANDEN.es;
        spikiuSagt(nv.z, inSprache(nv.na, MU), true);
        return;
      }
      spikiuSagt(zielzeilen[index] || '', brueckeZu(index),
                 !neu.ausgangOffen && neu.zug < ZUG_DECKEL);
      if (neu.ausgangOffen || neu.zug >= ZUG_DECKEL) schluss();
    });
  }

  /* Die Brücke zu Spikius Zeile — aus der Datenbank, nicht erfunden. */
  function brueckeZu(index) {
    var zeilen = (ST.dialog && ST.dialog.zeilen) || [];
    var sp = zeilen.filter(function (z) { return z.wer === 'spikiu'; });
    var versatz = (zeilen[0] && zeilen[0].wer === 'spikiu') ? 1 : 0;
    var z = sp[index + versatz];
    if (z && z.na) return inSprache(z.na, MU);
    var a = LP.abrundungVon(STUFE, THEMA);
    return (a && a.na) ? inSprache(a.na, MU) : '';
  }

  /* ══════════════════════════════════════════════════════════
     5 · DER RUNDE ABSCHLUSS
     ══════════════════════════════════════════════════════════ */
  function schluss() {
    if (!abrundungIstZiel) {
      var a = LP.abrundungVon(STUFE, THEMA);
      if (a && a.z) spikiuSagt(a.z, a.na ? inSprache(a.na, MU) : '', false, true);
    }
    var k = karte(null, true);
    k.innerHTML = '<div class="zaehler" style="margin:0 0 .9rem">'
      + 'Du kannst zurückwischen und alles noch einmal ansehen.</div>';
    var b = document.createElement('button');
    b.className = 'knopf gelb';
    b.textContent = 'Szene beenden';
    b.onclick = function () { b.disabled = true; automat.abbrechen(); ernte(); };
    k.appendChild(b);
  }

  /* ══════════════════════════════════════════════════════════
     6 · DIE ERNTE — nur was vorkam
     ══════════════════════════════════════════════════════════ */
  function ernte() {
    var alles = ' ' + flach(geerntet.gesagt.join(' ') + ' ' + geerntet.gehoert.join(' ')) + ' ';
    var lager = LP.ernte(STUFE, THEMA, MU) || [];

    var da = lager.filter(function (x) {
      var n = flach(x.z);
      if (!n) return false;
      if (alles.indexOf(' ' + n + ' ') > -1) return true;
      var w = n.split(' ').filter(function (s) { return s.length > 3; });
      if (!w.length) return false;
      return w.every(function (s) { return alles.indexOf(' ' + s) > -1; });
    });

    var thema = LP.thema(THEMA);
    var k = karte();
    var h = '<div class="bue-titel" style="font-size:1.35rem;margin-bottom:.2rem">Das hast du geübt</div>'
          + '<div class="bue-ort">' + esc(inSprache(thema && thema.na, MU)) + '</div>';

    function gruppe(ueber, liste) {
      if (!liste.length) return '';
      var s = '<div class="e-kopf">' + ueber + '</div>';
      liste.forEach(function (x) {
        s += '<div class="e-z"><button class="e-a" data-sag="' + esc(x.z) + '">🔊</button>'
          +  '<span class="e-w">' + esc(x.z) + '</span>'
          +  '<span class="e-t">' + esc(x.na) + '</span></div>';
      });
      return s;
    }
    h += gruppe('Das kannst du sagen', da.filter(function (x) { return x.art === 'wendung'; }));
    h += gruppe('Wörter', da.filter(function (x) { return x.art === 'wort'; }));
    if (!da.length) {
      h += '<div class="e-kopf">Noch nichts eingesammelt</div>'
        +  '<div class="bue-ort" style="margin:0">Beim nächsten Mal steht hier, '
        +  'was ihr wirklich gesagt habt.</div>';
    }
    k.innerHTML = h;

    Array.prototype.forEach.call(k.querySelectorAll('[data-sag]'), function (b) {
      b.onclick = function () { sprich(b.getAttribute('data-sag')); };
    });

    var b = document.createElement('button');
    b.className = 'knopf';
    b.textContent = 'Nach Hause';
    b.onclick = function () { raeumen(); location.href = 'haus.html'; };
    k.appendChild(b);

    raeumen();
  }

  /* ── Sitzung ──────────────────────────────────────────────── */
  function speichern() {
    try {
      if (!window.spikiuSitzung || !automat) return;
      var z = automat.zustand();
      if (z.vorbei || z.phase === 'ernte') return;
      window.spikiuSitzung.speichere('szene', {
        stufe: STUFE, thema: THEMA, geerntet: geerntet, protokoll: protokoll
      });
    } catch (e) {}
  }
  function raeumen() {
    try { if (window.spikiuSitzung) window.spikiuSitzung.raeume('szene'); } catch (e) {}
  }

  /* ── Themenwahl ohne Parameter ────────────────────────────── */
  function waehler() {
    titel.firstChild.nodeValue = 'Szene ';
    unter.textContent = 'Wähle ein Thema';
    var k = karte();
    var h = '<div class="bue-titel" style="font-size:1.3rem">Wo möchtest du üben?</div>'
          + '<div class="bue-ort">Stufe ' + esc(STUFE.toUpperCase()) + '</div><div class="wahl">';
    LP.themen.forEach(function (t) {
      var da = LP.gefuellt(STUFE, t.id);
      h += '<button data-thema="' + esc(t.id) + '"' + (da ? '' : ' class="leer" disabled') + '>'
        +  esc(t.em) + ' ' + esc(inSprache(t.na, MU)) + '</button>';
    });
    k.innerHTML = h + '</div>';
    Array.prototype.forEach.call(k.querySelectorAll('[data-thema]'), function (b) {
      b.onclick = function () {
        location.href = 'szene.html?stufe=' + encodeURIComponent(STUFE)
                      + '&thema=' + encodeURIComponent(b.getAttribute('data-thema'));
      };
    });
  }
  function hinweisKarte(t) {
    karte().innerHTML = '<div class="zug" style="font-family:\'DM Sans\',sans-serif;font-size:1rem">'
                      + esc(t) + '</div>';
  }

  /* ══════════════════════════════════════════════════════════
     START
     ══════════════════════════════════════════════════════════ */
  document.getElementById('zurueck').onclick = function () { location.href = 'haus.html'; };

  if (!LP || !window.SpikiuSzene) {
    unter.textContent = 'Fehler';
    hinweisKarte('Die Lernpfad-Daten oder der Szenen-Ablauf sind nicht geladen. '
               + 'Prüfe die Script-Reihenfolge in szene.html.');
    return;
  }
  if (LP.zielsprache !== ZS) {
    console.warn('[Szene] Profil will "' + ZS + '", geladen ist "' + LP.zielsprache + '".');
    ZS = LP.zielsprache;
  }
  if (!THEMA || !LP.gefuellt(STUFE, THEMA)) { waehler(); return; }

  ST = LP.station(STUFE, THEMA);
  ROLLE = LP.rolle(THEMA);
  var aufgaben = LP.aufgabenVon(STUFE, THEMA);
  if (!ST || !aufgaben.length) {
    unter.textContent = 'noch leer';
    hinweisKarte('Diese Station hat noch keine Aufgaben. Wähle ein anderes Thema.');
    return;
  }

  /* Spikius Zeilen der Reihe nach. Beginnt der Dialog mit ihm, ist seine erste
     Zeile bereits die Eröffnung und zählt nicht mit. Ist die Liste erschöpft,
     übernimmt die Abrundung — dann antwortet Spikiu auf die letzte Aufgabe UND
     schließt in einem Zug, ohne dass sich etwas doppelt. */
  (function () {
    var zeilen = (ST.dialog && ST.dialog.zeilen) || [];
    var sp = zeilen.filter(function (z) { return z.wer === 'spikiu'; });
    lernerZeilen = zeilen.filter(function (z) { return z.wer === 'lerner'; });
    var versatz = (zeilen[0] && zeilen[0].wer === 'spikiu') ? 1 : 0;
    var abr = LP.abrundungVon(STUFE, THEMA);
    for (var i = 0; i < aufgaben.length; i++) {
      var z = sp[i + versatz];
      if (z) zielzeilen.push(z.z);
      else {
        zielzeilen.push(abr ? abr.z : '');
        if (i === aufgaben.length - 1) abrundungIstZiel = true;
      }
    }
  })();

  var thema = LP.thema(THEMA);
  titel.firstChild.nodeValue = inSprache(thema && thema.na, MU) + ' ';
  unter.textContent = STUFE.toUpperCase() + ' · ' + inSprache(ROLLE && ROLLE.ort, MU);

  automat = window.SpikiuSzene.erzeuge({ aufgaben: aufgaben, maxZuege: ZUG_DECKEL });
  buehne();

})();
</script>
<!-- Audio: audio.js ist ein ES-Modul am Root und lässt sich NICHT als klassisches
     <script src> laden. Es wird hier importiert und via window an das Haupt-Script
     durchgereicht — dasselbe Muster wie in chat.html. Der Browser-Fallback steckt
     bereits in audio.js. -->
<script type="module">
  import { speak, warm } from '/audio.js';
  window.spkSpeak = speak;
  window.spkWarm  = warm;
</script>
