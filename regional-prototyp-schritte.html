<title>Regionalismen Schritt für Schritt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@500&family=DM+Sans:opsz,wght@9..40,500;9..40,700;9..40,800&family=Lora:wght@600&display=swap">
<style>
/* Layout: eine Handy-Bühne, vier Schritte, je ein Bildschirm. Spikiu-Hausstil (wie regional.html), bewusst nur hell. */
:root{
  --bg:#eef7f1; --paper:#ffffff; --ink:#15163a; --read:#2b2621; --muted:#6b6154; --acc:#1f93b0;
  --soft:#f6f1e6; --ow:2.5px; --wasser:#cfe7e6; --nachbar:#e6ebe3; --heim:#f4efe2;
  --f-disp:'Archivo Black','Arial Black',sans-serif;
  --f-body:'DM Sans',system-ui,sans-serif;
  --f-mono:'DM Mono',ui-monospace,monospace;
  --f-wort:'Lora',Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.5;display:flex;justify-content:center}
.app{width:100%;max-width:460px;height:100%;display:flex;flex-direction:column}

/* Kopf */
.kopf{display:flex;align-items:center;gap:.7rem;padding-block:.7rem .6rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:var(--ow) solid var(--ink);background:var(--bg)}
.back{width:38px;height:38px;flex:0 0 auto;border-radius:999px;border:var(--ow) solid var(--ink);background:var(--paper);font-size:1.15rem;cursor:pointer;box-shadow:2px 2px 0 var(--ink);color:var(--ink);display:grid;place-items:center}
.tt{flex:1;min-width:0;text-align:center}
.tt .rk{font:500 .62rem/1 var(--f-mono);letter-spacing:.2em;color:var(--acc);text-transform:uppercase}
.tt h1{font:1.05rem/1.2 var(--f-disp);margin:.15rem 0 0;text-wrap:balance}
.punkte{display:flex;gap:5px;justify-content:center;margin-top:.4rem}
.punkte i{width:22px;height:5px;border-radius:3px;background:#cfd9d2;transition:background .2s}
.punkte i.an{background:var(--ink)}
.platz{width:38px;flex:0 0 auto}

/* Bühne */
.buehne{flex:1;overflow-y:auto;padding-block:1rem 1.4rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:1rem}
.schritt{display:flex;flex-direction:column;gap:1rem;animation:rein .28s ease-out}
@keyframes rein{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.schritt{animation:none}}

.spikiu{display:flex;align-items:flex-end;gap:.55rem}
.capy{width:52px;height:52px;flex:0 0 auto}
.blase{background:var(--paper);border:2px solid var(--ink);border-radius:16px 16px 16px 4px;padding:.55rem .85rem;font-size:1rem;line-height:1.4;box-shadow:3px 3px 0 var(--ink);min-width:0}

/* Karte */
.karte-wrap{background:var(--wasser);border:var(--ow) solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 var(--ink);overflow:hidden}
.karte-wrap svg{display:block;width:100%;height:auto;touch-action:manipulation}
.nachbar{fill:var(--nachbar);stroke:#b3bfb8;stroke-width:.6;stroke-linejoin:round}
.heim{fill:var(--heim);stroke:#9aa59e;stroke-width:.7;stroke-linejoin:round}
.land{cursor:pointer}
.land path{fill:var(--paper);stroke:var(--ink);stroke-width:1.1;stroke-linejoin:round;transition:fill .18s}
.land.an path{stroke-width:1.6}
.land:focus{outline:none}
.land:focus-visible .pille rect{stroke:var(--acc);stroke-width:3.5}
.pille rect{fill:var(--paper);stroke:var(--ink);stroke-width:1.8}
.pille .sch{fill:var(--ink);stroke:none}
.pille text{font:800 11px var(--f-body);fill:var(--ink)}
.land.an .pille text{font-weight:800}
.meer{font:500 8.5px var(--f-mono);letter-spacing:.28em;fill:#5f8f88}
.ausschnitt{fill:var(--wasser);stroke:var(--ink);stroke-width:1.6}
.ausschnitt-titel{font:500 8px var(--f-mono);letter-spacing:.16em;fill:#4c7770;text-transform:uppercase}
.ausschnitt-quelle{fill:none;stroke:var(--ink);stroke-width:1;stroke-dasharray:3 2}
.sprachwahl{display:flex;align-items:center;gap:.35rem;font:500 .7rem var(--f-mono);color:var(--muted);letter-spacing:.06em;flex-wrap:wrap}
.sprachwahl button{border:1.5px solid var(--ink);background:var(--paper);border-radius:999px;padding:.15rem .55rem;font:800 .75rem var(--f-body);color:var(--ink);cursor:pointer}
.sprachwahl button.an{background:var(--ink);color:#fff}
.gewaehlt{display:flex;flex-wrap:wrap;gap:.35rem;min-height:2rem;align-items:center}
.gewaehlt .leer{color:var(--muted);font-size:.92rem}
.rk-chip{border:2px solid var(--ink);border-radius:999px;padding:.2rem .65rem;font:800 .85rem/1.2 var(--f-body);display:inline-flex;gap:.3rem;align-items:center}
.link{background:none;border:none;color:var(--acc);font:700 .92rem var(--f-body);cursor:pointer;padding:.2rem 0;text-decoration:underline;text-underline-offset:3px}

/* Knöpfe */
.weiter{margin-top:auto;border:var(--ow) solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;padding:.85rem 1rem;font:800 1.05rem var(--f-body);cursor:pointer;box-shadow:3px 3px 0 var(--acc)}
.weiter:disabled{background:#c9d3cd;color:#6f7a74;box-shadow:none;border-color:#aeb9b3;cursor:default}
.weiter:focus-visible,.tuer:focus-visible,.kachel:focus-visible,.back:focus-visible,.ton:focus-visible,.nav-k:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* Türen (Schritt 2) */
.tueren{display:grid;gap:.85rem}
.tuer{display:flex;align-items:center;gap:1rem;text-align:left;background:var(--paper);border:var(--ow) solid var(--ink);border-radius:20px;padding:1.1rem 1rem;box-shadow:4px 4px 0 var(--ink);cursor:pointer;color:var(--ink);font-family:var(--f-body)}
.tuer:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.tuer .sym{width:64px;height:64px;flex:0 0 auto;border-radius:16px;display:grid;place-items:center;font-size:2rem;border:2px solid var(--ink)}
.tuer b{display:block;font:1.15rem/1.2 var(--f-disp)}
.tuer span.u{display:block;color:var(--muted);font-size:.92rem;margin-top:.2rem}

/* Themen (Schritt 3) */
.kacheln{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.kachel{background:var(--paper);border:var(--ow) solid var(--ink);border-radius:18px;padding:.9rem .7rem;box-shadow:3px 3px 0 var(--ink);cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;font-family:var(--f-body);text-align:left}
.kachel:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.kachel .em{font-size:1.7rem;line-height:1}
.kachel b{font:800 1rem/1.2 var(--f-body)}
.kachel small{font:500 .72rem var(--f-mono);color:var(--muted);letter-spacing:.06em}
.kachel.breit{background:var(--soft)}
.kachel:disabled{opacity:.45;cursor:default;box-shadow:none}

/* Auswahl-Zeile (Schritt 4) */
.auswahl{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;font-size:.85rem}
.auswahl .rk-chip{font-size:.75rem;padding:.12rem .5rem}
.auswahl .tag{font:500 .7rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* Wortkarte */
.wk{background:var(--paper);border:var(--ow) solid var(--ink);border-radius:22px;box-shadow:4px 4px 0 var(--ink);padding:1.1rem 1rem 1rem;display:flex;flex-direction:column;gap:.8rem}
.wk-kopf{display:flex;align-items:center;gap:.8rem}
.wk-bild{width:62px;height:62px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:2.1rem;flex:0 0 auto}
.wk-tt{font:1.25rem/1.2 var(--f-disp)}
.wk-kat{font:500 .66rem/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:.3rem}
.vergleich{display:grid;gap:.55rem}
.zeile{display:flex;align-items:center;gap:.7rem;border:2px solid var(--ink);border-radius:16px;padding:.55rem .55rem .55rem .8rem}
.zeile .w{flex:1;min-width:0}
.zeile .wort{font:600 1.35rem/1.25 var(--f-wort);color:var(--read)}
.zeile .wer{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.25rem}
.zeile .wer span{font:800 .72rem/1.4 var(--f-body);border:1.5px solid var(--ink);border-radius:999px;padding:0 .45rem;background:rgba(255,255,255,.55)}
.zeile .laut{display:block;font:500 .82rem/1.3 var(--f-mono);color:var(--muted)}
.ton{width:44px;height:44px;flex:0 0 auto;border-radius:999px;border:2px solid var(--ink);background:var(--acc);cursor:pointer;display:grid;place-items:center;box-shadow:2px 2px 0 var(--ink)}
.ton svg{width:22px;height:22px}
.witz{display:flex;gap:.55rem;align-items:flex-start;background:var(--soft);border-radius:14px;padding:.6rem .7rem;font-size:.95rem;line-height:1.4}
.witz .capy{width:32px;height:32px}
.hinweis{font-size:.88rem;color:var(--muted);line-height:1.4}
.erkl{font-size:1rem;line-height:1.5;color:var(--read)}

/* Kartennavigation */
.nav{display:flex;align-items:center;gap:.7rem}
.nav-k{width:52px;height:52px;border-radius:999px;border:var(--ow) solid var(--ink);background:var(--paper);font-size:1.3rem;cursor:pointer;box-shadow:2px 2px 0 var(--ink);color:var(--ink)}
.nav-k:disabled{opacity:.3;cursor:default;box-shadow:none}
.nav-k.vor{background:var(--ink);color:#fff;box-shadow:2px 2px 0 var(--acc)}
.zaehler{flex:1;text-align:center;font:500 .85rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.leiste{height:6px;border-radius:3px;background:#d6e2db;overflow:hidden}
.leiste i{display:block;height:100%;background:var(--acc);transition:width .25s}
.ende{text-align:center;display:flex;flex-direction:column;gap:.8rem;align-items:center;padding-top:1rem}
.ende .capy{width:90px;height:90px}
.ende h2{font:1.3rem var(--f-disp);margin:0}
.knopf2{border:var(--ow) solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:.7rem 1.2rem;font:800 1rem var(--f-body);cursor:pointer;box-shadow:2px 2px 0 var(--ink);width:100%}
.proto{font:500 .68rem var(--f-mono);color:var(--muted);text-align:center;letter-spacing:.08em;padding-block:.3rem}
</style>

<div class="app">
  <header class="kopf">
    <button class="back" id="zurueck" type="button" aria-label="Zurück">‹</button>
    <div class="tt">
      <div class="rk">Bibliothek</div>
      <h1 id="titel">Spanische Regionalismen</h1>
      <div class="punkte" id="punkte" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="platz"></div>
  </header>
  <main class="buehne" id="buehne"></main>
</div>

<script>
var ALLE = {"es":{"titel":"Spanische Regionalismen","regionen":[{"id":"espana","name":"Spanien","kurz":"ES","farbe":"#F6C9B8","em":"🥘"},{"id":"mexico","name":"Mexiko","kurz":"MX","farbe":"#C9E4C5","em":"🌮"},{"id":"caribe","name":"Karibik","kurz":"CAR","farbe":"#B8E2EC","em":"🌴"},{"id":"andes","name":"Anden","kurz":"AND","farbe":"#E6D3F0","em":"🦙"},{"id":"rioplata","name":"Río de la Plata","kurz":"RP","farbe":"#CFE0F7","em":"🧉"},{"id":"chile","name":"Chile","kurz":"CL","farbe":"#F7E3B0","em":"🗿"}],"woerter":[{"id":"movil","em":"📱","kat":"alltag","k":"Handy","v":{"espana":"móvil","mexico":"celular","caribe":"celular","andes":"celular","rioplata":"celular","chile":"celular"},"witz":"Spanien sagt „móvil“, alle anderen „celular“. Mein Handy sagt nur: Akku leer.","hin":null},{"id":"ordenador","em":"💻","kat":"alltag","k":"Computer","v":{"espana":"ordenador","mexico":"computadora","caribe":"computadora","andes":"computador / computadora","rioplata":"computadora","chile":"computador"},"witz":"In Spanien ordnet der Computer, in Amerika rechnet er. Meiner macht vor allem Pause.","hin":null},{"id":"piso","em":"🏢","kat":"alltag","k":"Wohnung","v":{"espana":"piso","mexico":"departamento","caribe":"apartamento","andes":"apartamento / departamento","rioplata":"departamento / apartamento","chile":"departamento"},"witz":"In Madrid wohnst du im „piso“, in Mexiko im „departamento“. Ich wohne am Fluss – mit Aussicht.","hin":"In Spanien heißt „piso“ auch „Stockwerk“: „vivo en el tercer piso“."},{"id":"dinero","kat":"alltag","k":"Geld (umgangssprachlich)","v":{"espana":"pasta","mexico":"lana","caribe":"chavos / reales","andes":"plata","rioplata":"guita / plata","chile":"plata / lucas"},"witz":"Pasta, lana, plata, guita … So viele Namen fürs Geld – und trotzdem ist es nie genug.","hin":"„dinero“ versteht man überall – die anderen Wörter sind locker und umgangssprachlich."},{"id":"bombilla","em":"💡","kat":"alltag","k":"Glühbirne","v":{"espana":"bombilla","mexico":"foco","caribe":"bombillo","andes":"foco / bombillo","rioplata":"lamparita","chile":"ampolleta"},"witz":"In Chile ist die „bombilla“ ein Trinkhalm. Wer Licht will, fragt nach einer „ampolleta“.","hin":null},{"id":"camiseta","em":"👕","kat":"alltag","k":"T-Shirt","v":{"espana":"camiseta","mexico":"playera","caribe":"franela / camiseta","andes":"camiseta / polo","rioplata":"remera","chile":"polera"},"witz":"Camiseta, playera, remera, polera … Ein T-Shirt mit so vielen Namen braucht ein Namensschild.","hin":"In Peru ist ein „polo“ einfach ein T-Shirt; in Venezuela heißt es „franela“."},{"id":"zumo","kat":"essen","k":"Saft","v":{"espana":"zumo","mexico":"jugo","caribe":"jugo","andes":"jugo","rioplata":"jugo","chile":"jugo"},"witz":"Spanien presst „zumo“, Amerika trinkt „jugo“. Ich trinke einfach aus dem Fluss.","hin":null},{"id":"melocoton","kat":"essen","k":"Pfirsich","v":{"espana":"melocotón","mexico":"durazno","caribe":"melocotón / durazno","andes":"durazno","rioplata":"durazno","chile":"durazno"},"witz":"„Melocotón“ hat vier Silben, „durazno“ nur drei. Süß sind beide gleich.","hin":null},{"id":"alubias","em":"🫘","kat":"essen","k":"Bohnen","v":{"espana":"alubias / judías","mexico":"frijoles","caribe":"habichuelas / frijoles / caraotas","andes":"fríjoles / frejoles","rioplata":"porotos","chile":"porotos"},"witz":"Frijoles, porotos, caraotas … Bohnen reisen viel und bekommen an jeder Station einen neuen Namen.","hin":null},{"id":"aguacate","kat":"essen","k":"Avocado","v":{"espana":"aguacate","mexico":"aguacate","caribe":"aguacate","andes":"aguacate / palta","rioplata":"palta","chile":"palta"},"witz":"„Aguacate“ kommt aus dem Nahuatl, „palta“ aus dem Quechua. Die Avocado ist zweisprachig aufgewachsen.","hin":null},{"id":"palomitas","em":"🍿","kat":"essen","k":"Popcorn","v":{"espana":"palomitas","mexico":"palomitas","caribe":"cotufas / palomitas","andes":"crispetas / canguil / canchita","rioplata":"pochoclo / pop","chile":"cabritas"},"witz":"In Spanien sind es Täubchen (palomitas), in Chile Zicklein (cabritas). Popcorn ist ein Zoo!","hin":null},{"id":"pajita","em":"🥤","kat":"essen","k":"Trinkhalm","v":{"espana":"pajita","mexico":"popote","caribe":"pitillo / sorbeto","andes":"pitillo / sorbete","rioplata":"sorbete / pajita","chile":"bombilla"},"witz":"Popote, pitillo, bombilla … Ich trinke ganz ohne Halm. Sehr umweltfreundlich, oder?","hin":"In Argentinien und Uruguay ist die „bombilla“ das Metallröhrchen für den Mate."},{"id":"tarta","kat":"essen","k":"Torte","v":{"espana":"tarta","mexico":"pastel","caribe":"bizcocho / torta","andes":"torta / ponqué","rioplata":"torta","chile":"torta"},"witz":"Bestell in Mexiko bloß keine „torta“ zum Geburtstag – du bekommst ein Brötchen mit Kerze.","hin":"In Mexiko ist eine „torta“ ein belegtes Brötchen; Torte heißt dort „pastel“."},{"id":"platano","kat":"essen","k":"Banane","v":{"espana":"plátano","mexico":"plátano","caribe":"guineo / cambur","andes":"banano / guineo","rioplata":"banana","chile":"plátano"},"witz":"Guineo, cambur, banano, banana … Die Banane hat mehr Spitznamen als ich. Und ich bin beliebt!","hin":"In vielen Ländern Lateinamerikas ist „plátano“ vor allem die Kochbanane."},{"id":"coche","kat":"unterwegs","k":"Auto","v":{"espana":"coche","mexico":"carro / coche","caribe":"carro","andes":"carro","rioplata":"auto","chile":"auto"},"witz":"Coche, carro, auto … Egal, wie es heißt: Ich nehme lieber ein Floß.","hin":"In Spanien ist ein „carro“ eher ein Karren, zum Beispiel der Einkaufswagen."},{"id":"autobus","kat":"unterwegs","k":"Bus","v":{"espana":"autobús","mexico":"camión","caribe":"guagua / bus","andes":"bus / buseta","rioplata":"colectivo / ómnibus","chile":"micro"},"witz":"In Kuba steigst du in die „guagua“, in Chile ist eine „guagua“ ein Baby. Nicht verwechseln!","hin":"In Mexiko heißt „camión“ Bus – aber auch Lastwagen."},{"id":"coger","em":"🚌","kat":"unterwegs","k":"(den Bus) nehmen","v":{"espana":"coger","mexico":"tomar","caribe":"tomar / coger","andes":"tomar / coger","rioplata":"tomar","chile":"tomar"},"witz":"Ein kleines Verb mit viel Reiseerfahrung. Mein Tipp: „tomar“ – damit kommst du überall sicher an.","hin":"In Spanien ganz normal. In einigen Ländern Lateinamerikas ist „coger“ ein heikles Wort – dort lieber „tomar“."},{"id":"billete","kat":"unterwegs","k":"Fahrkarte","v":{"espana":"billete","mexico":"boleto","caribe":"boleto / pasaje","andes":"pasaje / tiquete","rioplata":"boleto / pasaje","chile":"pasaje / boleto"},"witz":"Billete, boleto, pasaje … So viele Wörter für ein Zettelchen, das immer in der Tasche verschwindet.","hin":"In Lateinamerika ist ein „billete“ vor allem ein Geldschein."},{"id":"atasco","kat":"unterwegs","k":"Stau","v":{"espana":"atasco","mexico":"tráfico / embotellamiento","caribe":"tapón / cola","andes":"trancón / tráfico","rioplata":"embotellamiento","chile":"taco"},"witz":"In Chile steckst du im „taco“. Klingt lecker, ist aber nur Stau.","hin":null},{"id":"conducir","em":"🚗","kat":"unterwegs","k":"Auto fahren","v":{"espana":"conducir","mexico":"manejar","caribe":"manejar","andes":"manejar","rioplata":"manejar","chile":"manejar"},"witz":"Spanien „conduce“, Lateinamerika „maneja“. Ich schwimme – mit allen vier Beinen.","hin":null},{"id":"metro","em":"🚇","kat":"unterwegs","k":"U-Bahn","v":{"espana":"metro","mexico":"metro","caribe":"metro","andes":"metro","rioplata":"subte","chile":"metro"},"witz":"In Buenos Aires fährt der „subte“, kurz für „subterráneo“. Dort haben es sogar die Wörter eilig.","hin":null},{"id":"nino","em":"🧒","kat":"leute","k":"Kind (umgangssprachlich)","v":{"espana":"crío / chaval","mexico":"chamaco","caribe":"chamo / nene","andes":"pelado / guagua","rioplata":"pibe / nene","chile":"cabro chico"},"witz":"Chaval, chamaco, pibe, cabro chico … Viele Wörter, ein gemeinsamer Wunsch: Eis!","hin":"„niño“ passt überall. In Chile und Teilen der Anden ist eine „guagua“ ein Baby."},{"id":"novio","em":"💑","kat":"leute","k":"fester Freund / feste Freundin","v":{"espana":"novio (novia)","mexico":"novio (novia)","caribe":"novio (novia)","andes":"novio / enamorado","rioplata":"novio (novia)","chile":"pololo (polola)"},"witz":"In Chile hat man nicht einfach eine Beziehung – man „pololea“. Klingt nach Tanz … und ist fast einer.","hin":"In Peru sagt man oft „enamorado / enamorada“ für den festen Freund oder die feste Freundin."},{"id":"amigo","em":"🤝","kat":"leute","k":"Kumpel","v":{"espana":"colega / tío","mexico":"cuate / carnal","caribe":"pana / asere","andes":"parce / pana / pata","rioplata":"amigo / chabón","chile":"compadre"},"witz":"Pana, parce, cuate, colega … Ich sage einfach „amigo“ – und teile meinen Salat.","hin":"Alles locker und umgangssprachlich; „amigo“ passt überall. Mit „che“ ruft man am Río de la Plata jemanden an."},{"id":"camarero","em":"🧑‍🍳","kat":"leute","k":"Kellner","v":{"espana":"camarero","mexico":"mesero","caribe":"mesonero / mesero","andes":"mesero / mozo","rioplata":"mozo","chile":"garzón"},"witz":"In Chile rufst du den „garzón“. Klingt französisch – und kommt auch daher.","hin":null},{"id":"vosotros","em":"👥","kat":"leute","k":"ihr (mehrere Personen, Du-Form)","v":{"espana":"vosotros","mexico":"ustedes","caribe":"ustedes","andes":"ustedes","rioplata":"ustedes","chile":"ustedes"},"witz":"Spanien sagt „vosotros“, Lateinamerika „ustedes“. Ich sage einfach: Hallo, ihr alle!","hin":"Gut zu erkennen: Am Río de la Plata hörst du „vos“ statt „tú“ (vos tenés). Verstehen reicht – ich spreche mit „tú“."},{"id":"guay","em":"😎","kat":"gruesse","k":"cool / super","v":{"espana":"guay","mexico":"padre / chido","caribe":"chévere","andes":"chévere / bacán","rioplata":"copado / bárbaro","chile":"bacán"},"witz":"Guay, padre, chévere, bacán, copado … Ich bin all das gleichzeitig. Sagt jedenfalls meine Mama.","hin":"In Mexiko heißt „padre“ hier nicht „Vater“, sondern „toll“: ¡Qué padre!"},{"id":"quetal","em":"👋","kat":"gruesse","k":"Wie geht's? / Was geht?","v":{"espana":"¿Qué tal? / ¿Qué pasa?","mexico":"¿Qué onda?","caribe":"¿Qué más? / ¿Qué lo que?","andes":"¿Quiubo? / ¿Qué fue?","rioplata":"¿Todo bien? / ¿Qué onda?","chile":"¿Cómo estai? / ¿Qué onda?"},"witz":"¿Qué onda?, ¿Quiubo?, ¿Qué más? … Ich antworte immer gleich: Gut, danke – und du?","hin":"„¿Cómo estai?“ ist chilenisch und sehr locker. Ich selbst sage: „¿Cómo estás?“"},{"id":"vale","em":"👌","kat":"gruesse","k":"Okay / einverstanden","v":{"espana":"vale","mexico":"órale / sale","caribe":"dale","andes":"listo / dale","rioplata":"dale","chile":"ya / dale"},"witz":"In Spanien sagt man so oft „vale“, dass sogar die Tauben nicken.","hin":"In Chile ist ein kurzes „ya“ oft einfach „okay“."},{"id":"telefono","em":"☎️","kat":"gruesse","k":"Hallo? (am Telefon)","v":{"espana":"¿Diga? / ¿Sí?","mexico":"¿Bueno?","caribe":"¿Aló?","andes":"¿Aló?","rioplata":"¿Hola?","chile":"¿Aló?"},"witz":"In Mexiko meldet man sich mit „¿Bueno?“ – noch bevor klar ist, ob es gut wird.","hin":null},{"id":"adios","em":"👋","kat":"gruesse","k":"Tschüss","v":{"espana":"¡Hasta luego!","mexico":"¡Nos vemos!","caribe":"¡Chao!","andes":"¡Chao!","rioplata":"¡Chau!","chile":"¡Chao!"},"witz":"In Spanien sagt man „¡Hasta luego!“ sogar zu Leuten, die man nie wiedersieht. Wie optimistisch!","hin":"„Chau“ mit u ist die Schreibweise am Río de la Plata."},{"id":"mande","em":"👂","kat":"gruesse","k":"Wie bitte?","v":{"espana":"¿Cómo?","mexico":"¿Mande?","caribe":"¿Cómo?","andes":"¿Mande? / ¿Cómo?","rioplata":"¿Qué? / ¿Cómo?","chile":"¿Cómo?"},"witz":"„¿Mande?“ ist in Mexiko superhöflich – fast „Was befehlen Sie?“. Ich befehle: Snacks!","hin":null}],"laute":[{"id":"theta","t":"Z und C: „th“ oder „s“?","e":"In großen Teilen Spaniens klingen z und c (vor e, i) wie das englische „th“ in „think“. In Lateinamerika und auf den Kanaren klingen sie wie s – das heißt „seseo“. Beides ist richtig.","b":[{"region":"espana","wort":"cerveza","laut":"ther-BE-tha"},{"region":"mexico","wort":"cerveza","laut":"ser-BE-sa"},{"region":"espana","wort":"gracias","laut":"GRA-thyas"},{"region":"andes","wort":"gracias","laut":"GRA-syas"}]},{"id":"yeismo","t":"LL und Y klingen gleich","e":"Fast überall klingen ll und y gleich, wie ein deutsches j in „ja“: „pollo“ klingt wie „poyo“. Nur in manchen Gegenden der Anden hört man noch ein eigenes ll, ähnlich wie „lj“.","b":[{"region":"espana","wort":"pollo","laut":"PO-yo"},{"region":"mexico","wort":"llave","laut":"YA-be"},{"region":"caribe","wort":"playa","laut":"PLA-ya"},{"region":"andes","wort":"calle","laut":"KA-lye"}]},{"id":"rehilamiento","t":"Das „sch“ vom Río de la Plata","e":"In Buenos Aires und Montevideo klingen ll und y wie „sch“: „yo me llamo“ klingt wie „scho me schamo“. Das nennt man „rehilamiento“. Gut zum Erkennen – ich selbst spreche ein neutrales y.","b":[{"region":"rioplata","wort":"yo me llamo","laut":"sho me SHA-mo"},{"region":"rioplata","wort":"playa","laut":"PLA-sha"},{"region":"mexico","wort":"playa","laut":"PLA-ya"}]},{"id":"s_aspirada","t":"Das gehauchte S","e":"In der Karibik, in Andalusien, am Río de la Plata und in Chile wird ein s am Silbenende oft nur gehaucht – wie ein leises h – oder fällt ganz weg. „Estás“ klingt dann wie „ehtá“.","b":[{"region":"caribe","wort":"¿Cómo estás?","laut":"KO-mo eh-TAH"},{"region":"espana","wort":"los niños (Andalucía)","laut":"loh NI-nyoh"},{"region":"chile","wort":"más o menos","laut":"MAH o ME-noh"},{"region":"mexico","wort":"¿Cómo estás?","laut":"KO-mo es-TAS"}]},{"id":"jota","t":"Die Jota: kratzig oder gehaucht","e":"In Spanien wird die j kräftig im Rachen gesprochen, wie das „ch“ in „Bach“. In der Karibik und in vielen Teilen Lateinamerikas ist sie viel weicher – fast nur ein gehauchtes h wie in „Haus“.","b":[{"region":"espana","wort":"jamón","laut":"khha-MON"},{"region":"caribe","wort":"jamón","laut":"ha-MON"},{"region":"espana","wort":"Juan","laut":"KHHWAN"},{"region":"mexico","wort":"México","laut":"ME-hi-ko"}]},{"id":"ado_ao","t":"Aus -ado wird -ao","e":"Im lockeren Gespräch verschwindet das d zwischen Vokalen oft: „cansado“ klingt wie „cansao“. Das hört man in Spanien, in der Karibik und in Chile ständig. Ich spreche das d weich, aber hörbar.","b":[{"region":"espana","wort":"cansado","laut":"kan-SA-o"},{"region":"caribe","wort":"pescado","laut":"peh-KA-o"},{"region":"chile","wort":"helado","laut":"e-LA-o"},{"region":"mexico","wort":"cansado","laut":"kan-SA-do"}]},{"id":"l_r","t":"R oder L? Die Karibik tauscht","e":"Besonders in Puerto Rico und Teilen der Karibik klingt ein r am Silbenende oft wie l: „Puerto Rico“ wird zu „Puelto Rico“. Das ist ganz natürlich und sehr musikalisch. Ich spreche das r so, wie es geschrieben wird.","b":[{"region":"caribe","wort":"Puerto Rico","laut":"PUEL-to RRI-ko"},{"region":"caribe","wort":"amor","laut":"a-MOL"},{"region":"mexico","wort":"amor","laut":"a-MOR"}]},{"id":"chileno_ai","t":"Chilenisch: ¿Cómo estai?","e":"Unter Freunden enden in Chile viele Du-Formen auf -ai oder -ís: „¿Cómo estai?“ statt „¿Cómo estás?“, „¿Qué querís?“ statt „¿Qué quieres?“. Gut zum Verstehen – ich selbst sage „estás“ und „quieres“.","b":[{"region":"chile","wort":"¿Cómo estai?","laut":"KO-mo eh-TAI"},{"region":"chile","wort":"¿Qué querís?","laut":"ke ke-RIS"},{"region":"mexico","wort":"¿Cómo estás?","laut":"KO-mo es-TAS"}]}]},"de":{"titel":"Deutsche Regionalismen","regionen":[{"id":"nord","name":"Norddeutschland (Hamburg, Hannover)","kurz":"HH","farbe":"#BFDDF2","em":"⚓"},{"id":"berlin","name":"Berlin & Brandenburg","kurz":"BLN","farbe":"#D9D2F0","em":"🐻"},{"id":"west","name":"Rheinland & Ruhrgebiet (Köln)","kurz":"KÖL","farbe":"#F6D6C8","em":"⛪"},{"id":"bayern","name":"Bayern (München)","kurz":"BY","farbe":"#CFE6F7","em":"🥨"},{"id":"oesterreich","name":"Österreich (Wien)","kurz":"AT","farbe":"#F5D0D6","em":"☕"},{"id":"schweiz","name":"Schweiz (Zürich)","kurz":"CH","farbe":"#FBEBB8","em":"🧀"}],"woerter":[{"id":"broetchen","em":"🥖","kat":"essen","k":"Brötchen","v":{"nord":"Brötchen","berlin":"Schrippe","west":"Brötchen","bayern":"Semmel","oesterreich":"Semmel","schweiz":"Weggli / Brötli"},"witz":"Schrippe, Semmel, Weggli – ich esse sie alle. Nur zur Sicherheit.","hin":null},{"id":"tomate","kat":"essen","k":"Tomate","v":{"nord":"Tomate","berlin":"Tomate","west":"Tomate","bayern":"Tomate","oesterreich":"Paradeiser","schweiz":"Tomate"},"witz":"Paradeiser – in Wien wächst das Paradies also im Gemüsebeet.","hin":"„Paradeiser“ kommt von „Paradiesapfel“. „Tomate“ versteht man in Österreich aber auch."},{"id":"aprikose","em":"🍑","kat":"essen","k":"Aprikose","v":{"nord":"Aprikose","berlin":"Aprikose","west":"Aprikose","bayern":"Aprikose","oesterreich":"Marille","schweiz":"Aprikose"},"witz":"Wer in Wien Aprikosenknödel bestellt, bekommt Marillenknödel – und einen strengen Blick.","hin":null},{"id":"kartoffel","kat":"essen","k":"Kartoffel","v":{"nord":"Kartoffel","berlin":"Kartoffel","west":"Kartoffel","bayern":"Kartoffel / Erdäpfel","oesterreich":"Erdapfel","schweiz":"Kartoffel / Härdöpfel"},"witz":"Erdapfel – ein Apfel, der lieber unter der Erde wohnt. Sehr gemütlich, wie ich.","hin":"Wörtlich „Apfel der Erde“ – genau wie das französische „pomme de terre“."},{"id":"sahne","em":"🍦","kat":"essen","k":"Schlagsahne","v":{"nord":"Schlagsahne","berlin":"Schlagsahne","west":"Schlagsahne","bayern":"Sahne / Schlagrahm","oesterreich":"Schlagobers","schweiz":"Schlagrahm / Rahm"},"witz":"Schlagobers auf dem Kaffee? In Wien ist das kein Extra, das ist Kultur.","hin":null},{"id":"krapfen","em":"🍩","kat":"essen","k":"Berliner (mit Marmelade gefüllt)","v":{"nord":"Berliner","berlin":"Pfannkuchen","west":"Berliner","bayern":"Krapfen","oesterreich":"Krapfen","schweiz":"Berliner"},"witz":"In Berlin heißt der Berliner Pfannkuchen. Die Berliner wissen eben, wer sie sind.","hin":"Vorsicht: Außerhalb Berlins und Ostdeutschlands ist ein „Pfannkuchen“ meist flach wie ein Crêpe."},{"id":"pfannkuchen","em":"🥞","kat":"essen","k":"Pfannkuchen (flach)","v":{"nord":"Pfannkuchen","berlin":"Eierkuchen","west":"Pfannkuchen","bayern":"Pfannkuchen","oesterreich":"Palatschinke","schweiz":"Omelette"},"witz":"Palatschinke, Eierkuchen, Omelette – drei Namen, ein Pfannenwender, null Reste.","hin":"In der Schweiz ist eine „Omelette“ oft ein dünner Pfannkuchen – nicht unbedingt ein Omelett nur aus Ei."},{"id":"johannisbeere","em":"🍒","kat":"essen","k":"Johannisbeere","v":{"nord":"Johannisbeere","berlin":"Johannisbeere","west":"Johannisbeere","bayern":"Johannisbeere","oesterreich":"Ribisel","schweiz":"Johannisbeere / Meertrübeli"},"witz":"Ribisel klingt wie das Geräusch beim Pflücken. Ribisel, ribisel – schon ist die Schale voll.","hin":null},{"id":"topfen","kat":"essen","k":"Quark (Frischkäse)","v":{"nord":"Quark","berlin":"Quark","west":"Quark","bayern":"Topfen / Quark","oesterreich":"Topfen","schweiz":"Quark"},"witz":"Topfenstrudel klingt nach Kochtopf, schmeckt aber nach Himmel.","hin":null},{"id":"jause","kat":"essen","k":"kleine Zwischenmahlzeit, Pausenbrot","v":{"nord":"Pausenbrot","berlin":"Stulle","west":"Butterbrot / Knifte","bayern":"Brotzeit","oesterreich":"Jause","schweiz":"Znüni / Zvieri"},"witz":"Brotzeit, Jause, Znüni – ich finde ja, jede Zeit ist Brotzeit.","hin":"„Znüni“ heißt „um neun“, „Zvieri“ „um vier“ – in der Schweiz sagt der Imbiss gleich die Uhrzeit mit."},{"id":"samstag","em":"📅","kat":"alltag","k":"Samstag","v":{"nord":"Sonnabend","berlin":"Sonnabend","west":"Samstag","bayern":"Samstag","oesterreich":"Samstag","schweiz":"Samstag"},"witz":"Sonnabend oder Samstag – Hauptsache, ich darf ausschlafen.","hin":"„Sonnabend“ hört man vor allem im Norden und Osten. „Samstag“ versteht man überall."},{"id":"januar","em":"❄️","kat":"alltag","k":"Januar","v":{"nord":"Januar","berlin":"Januar","west":"Januar","bayern":"Januar","oesterreich":"Jänner","schweiz":"Januar"},"witz":"Jänner klingt, als hätte der Januar Schnupfen. Gesundheit!","hin":"In Österreich hört man auch „Feber“ für Februar."},{"id":"tuete","em":"🛍️","kat":"alltag","k":"Tüte","v":{"nord":"Tüte","berlin":"Tüte","west":"Tüte","bayern":"Tüte","oesterreich":"Sackerl","schweiz":"Säckli"},"witz":"Tüte, Sackerl, Säckli – je weiter südlich, desto niedlicher die Tasche.","hin":"„-erl“ (Österreich, Bayern) und „-li“ (Schweiz) sind Verkleinerungsformen wie „-chen“."},{"id":"kehren","em":"🧹","kat":"alltag","k":"fegen (mit dem Besen)","v":{"nord":"fegen","berlin":"fegen","west":"fegen / kehren","bayern":"kehren","oesterreich":"kehren","schweiz":"wischen"},"witz":"Fegen, kehren, wischen – der Besen bleibt gleich, nur die Wörter tanzen.","hin":"Falscher Freund: In der Schweiz bedeutet „wischen“ mit dem Besen fegen."},{"id":"handy","em":"📱","kat":"alltag","k":"Handy","v":{"nord":"Handy","berlin":"Handy","west":"Handy","bayern":"Handy","oesterreich":"Handy","schweiz":"Handy / Natel"},"witz":"„Handy“ verstehen die Engländer nicht. Ich auch nicht – ich habe Pfoten.","hin":"„Handy“ ist kein englisches Wort für Telefon. „Natel“ war ursprünglich der Name des Schweizer Mobilfunks."},{"id":"stuhl","em":"🪑","kat":"alltag","k":"Stuhl","v":{"nord":"Stuhl","berlin":"Stuhl","west":"Stuhl","bayern":"Stuhl","oesterreich":"Sessel","schweiz":"Stuhl / Sessel"},"witz":"In Wien bot man mir einen Sessel an. Ich freute mich aufs Polster – es war ein Stuhl.","hin":"Falscher Freund: In Deutschland ist ein „Sessel“ ein gepolsterter Lehnstuhl, in Österreich einfach ein Stuhl."},{"id":"kiosk","em":"🏪","kat":"alltag","k":"Kiosk","v":{"nord":"Kiosk","berlin":"Späti","west":"Büdchen","bayern":"Kiosk","oesterreich":"Trafik","schweiz":"Kiosk"},"witz":"Der Späti heißt Späti, weil man dort spät noch Snacks findet. Eine Logik, die mir schmeckt.","hin":"Die österreichische Trafik verkauft Zeitungen, Fahrscheine und Tabakwaren."},{"id":"fahrrad","em":"🚲","kat":"unterwegs","k":"Fahrrad","v":{"nord":"Fahrrad / Rad","berlin":"Fahrrad","west":"Fahrrad","bayern":"Radl","oesterreich":"Radl / Fahrrad","schweiz":"Velo"},"witz":"In der Schweiz fahre ich Velo. Klingt schneller, ist aber dasselbe Gestrampel.","hin":null},{"id":"tram","kat":"unterwegs","k":"Straßenbahn","v":{"nord":"Straßenbahn","berlin":"Tram / Straßenbahn","west":"Straßenbahn / Bahn","bayern":"Tram","oesterreich":"Bim / Straßenbahn","schweiz":"Tram"},"witz":"In Wien heißt die Straßenbahn „Bim“ – weil sie so klingelt. Bim, bim, einsteigen!","hin":"In der Schweiz sagt man „das Tram“, in Deutschland „die Tram“."},{"id":"parken","em":"🅿️","kat":"unterwegs","k":"parken","v":{"nord":"parken","berlin":"parken","west":"parken","bayern":"parken","oesterreich":"parken","schweiz":"parkieren"},"witz":"In der Schweiz wird parkiert – so präzise, dass sogar ich staune.","hin":null},{"id":"fahrkarte","kat":"unterwegs","k":"Fahrkarte","v":{"nord":"Fahrkarte","berlin":"Fahrschein","west":"Fahrkarte / Ticket","bayern":"Fahrkarte","oesterreich":"Fahrschein","schweiz":"Billett"},"witz":"Billett, Fahrschein, Ticket – Hauptsache, der Kontrolleur lächelt.","hin":"„Billett“ kommt aus dem Französischen („billet“)."},{"id":"gehweg","em":"🚶","kat":"unterwegs","k":"Gehweg","v":{"nord":"Fußweg / Bürgersteig","berlin":"Bürgersteig","west":"Bürgersteig","bayern":"Gehsteig","oesterreich":"Gehsteig","schweiz":"Trottoir"},"witz":"Trottoir klingt so elegant, dass ich darauf nur noch auf Zehenspitzen gehe.","hin":null},{"id":"maedchen","em":"👧","kat":"leute","k":"Mädchen","v":{"nord":"Deern / Mädchen","berlin":"Mädchen","west":"Mädchen","bayern":"Madl","oesterreich":"Mädel / Mädchen","schweiz":"Meitli"},"witz":"Deern, Madl, Meitli – drei Wörter, und alle klingen nach einem Lächeln.","hin":"„Dirndl“ meint heute fast immer das Trachtenkleid – nimm es lieber nicht als Wort für Mädchen."},{"id":"junge","em":"👦","kat":"leute","k":"Junge","v":{"nord":"Jung / Junge","berlin":"Junge","west":"Junge","bayern":"Bub","oesterreich":"Bub","schweiz":"Bueb"},"witz":"„Bub“ – kurz, rund und fröhlich. Wie ein kleines Capybara.","hin":null},{"id":"metzger","em":"🥩","kat":"leute","k":"Metzger","v":{"nord":"Schlachter","berlin":"Fleischer","west":"Metzger","bayern":"Metzger","oesterreich":"Fleischhauer","schweiz":"Metzger"},"witz":"Ich fresse nur Gras, kenne aber alle vier Wörter. Bildung ist Bildung.","hin":null},{"id":"kumpel","kat":"leute","k":"Kumpel, guter Freund","v":{"nord":"Digga","berlin":"Kumpel / Alter","west":"Kumpel","bayern":"Spezl","oesterreich":"Haberer","schweiz":"Kolleg"},"witz":"Spezl, Haberer, Kolleg – ich habe in jeder Region einen Freund. Meistens wegen meiner Snacks.","hin":"„Digga“ ist sehr locker und jugendlich. In der Schweiz heißt „Kolleg“ einfach Freund, nicht nur Arbeitskollege."},{"id":"hallo","em":"👋","kat":"gruesse","k":"Hallo / Guten Tag","v":{"nord":"Moin","berlin":"Tach / Hallo","west":"Tach / Hallo","bayern":"Servus / Grüß Gott","oesterreich":"Servus / Grüß Gott","schweiz":"Grüezi / Hoi"},"witz":"Im Norden sagt man den ganzen Tag „Moin“. Sogar abends. Ich habe es getestet.","hin":"„Moin“ heißt nicht „Morgen“ – es passt zu jeder Tageszeit. „Grüezi“ ist höflich, „Hoi“ unter Freunden."},{"id":"tschuess","em":"👋","kat":"gruesse","k":"Tschüss / Auf Wiedersehen","v":{"nord":"Tschüss","berlin":"Tschüss","west":"Tschö","bayern":"Servus / Pfiat di","oesterreich":"Baba / Servus","schweiz":"Uf Wiederluege / Tschau"},"witz":"In Österreich sagt man „Baba“ zum Abschied. Ich dachte erst, jemand ruft seinen Papa.","hin":"„Servus“ passt im Süden zur Begrüßung und zum Abschied."},{"id":"wiegehts","em":"🙂","kat":"gruesse","k":"Wie geht's?","v":{"nord":"Wie geht's?","berlin":"Wie jeht's? / Allet jut?","west":"Wie isset?","bayern":"Wia geht's?","oesterreich":"Wie geht's? / Alles leiwand?","schweiz":"Wie gaht's?"},"witz":"Auf „Wie isset?“ antwortet man im Ruhrgebiet: „Muss ja!“ Passt immer.","hin":"„Leiwand“ heißt in Wien so viel wie toll, super."},{"id":"passt","em":"👍","kat":"gruesse","k":"In Ordnung! / Geht klar!","v":{"nord":"Geht klar!","berlin":"Allet klar!","west":"Kein Ding!","bayern":"Passt scho!","oesterreich":"Passt eh!","schweiz":"Isch guet!"},"witz":"„Passt scho“ ist in Bayern fast ein Lob. Mehr Begeisterung wäre schon verdächtig.","hin":null},{"id":"spass","em":"😄","kat":"gruesse","k":"Das macht Spaß!","v":{"nord":"Das macht Spaß!","berlin":"Det macht Spaß!","west":"Dat macht Spaß!","bayern":"Des is a Gaudi!","oesterreich":"Des is leiwand!","schweiz":"Das fägt!"},"witz":"Regionen lernen macht Spaß. Oder Gaudi. Oder es fägt. Jedenfalls lache ich.","hin":"Im Süden spricht man „Spaß“ mit langem a, im Norden oft kurz. In der Schweiz schreibt man ohne ß: „Spass“."},{"id":"appetit","em":"🍽️","kat":"gruesse","k":"Guten Appetit!","v":{"nord":"Guten Appetit! / Mahlzeit!","berlin":"Juten Appetit! / Mahlzeit!","west":"Mahlzeit!","bayern":"An Guadn!","oesterreich":"Mahlzeit! / Guten Appetit!","schweiz":"En Guete!"},"witz":"„Mahlzeit!“ sagt man mittags sogar im Flur, ganz ohne Teller. Ich sage es den ganzen Tag.","hin":"„Mahlzeit“ ist auch ein Mittagsgruß unter Kollegen, zum Beispiel im Büro."}],"laute":[{"id":"ig_endung","t":"-ig: „ich“ oder „ik“?","e":"Am Wortende spricht man -ig in Norddeutschland meist wie „ich“. Im Süden, in Österreich und in der Schweiz klingt es wie „ik“. Beides ist richtig.","b":[{"region":"nord","wort":"König","laut":"KÖ-nich"},{"region":"bayern","wort":"König","laut":"KÖ-nik"},{"region":"oesterreich","wort":"zwanzig","laut":"TSVAN-tsik"}]},{"id":"spitzer_stein","t":"Über'n s-pitzen S-tein","e":"Normalerweise spricht man „st“ und „sp“ am Wortanfang wie „scht“ und „schp“. Im traditionellen Hamburgisch bleibt das s ein scharfes s. Man stolpert also „über'n s-pitzen S-tein“.","b":[{"region":"nord","wort":"Stein","laut":"s-TAIN"},{"region":"bayern","wort":"Stein","laut":"SHTAIN"},{"region":"nord","wort":"spitz","laut":"s-PITS"}]},{"id":"jut_wat_det","t":"„Jut“, „wat“, „det“","e":"In Berlin wird aus g am Wortanfang oft ein j: „gut“ klingt wie „jut“. Außerdem sagt man „wat“ statt „was“ und „det“ statt „das“. Im Rheinland und im Ruhrgebiet hört man ebenfalls „wat“ und „dat“.","b":[{"region":"berlin","wort":"gut","laut":"YOOT"},{"region":"berlin","wort":"Das ist gut.","laut":"det is YOOT"},{"region":"west","wort":"Was ist das?","laut":"vat is DAT?"}]},{"id":"chemie","t":"China, Chemie: ch, sch oder k?","e":"Am Wortanfang vor e oder i spricht man ch im Norden weich, wie in „ich“. Im Rheinland klingt es oft wie „sch“. Im Süden, in Österreich und in der Schweiz sagt man meist „k“.","b":[{"region":"nord","wort":"Chemie","laut":"khye-MEE (soft, like ich)"},{"region":"west","wort":"Chemie","laut":"she-MEE"},{"region":"bayern","wort":"Chemie","laut":"ke-MEE"},{"region":"oesterreich","wort":"China","laut":"KEE-na"}]},{"id":"r_laut","t":"Das r: im Hals oder auf der Zunge?","e":"In den meisten Gegenden Deutschlands spricht man das r hinten im Hals. In Bayern, Österreich und der Schweiz hört man oft auch ein gerolltes Zungen-r. Am Wortende wird „-er“ vielerorts fast zu „a“.","b":[{"region":"nord","wort":"rot","laut":"hhROHT (throat r)"},{"region":"bayern","wort":"rot","laut":"rrROHT (rolled r)"},{"region":"schweiz","wort":"Rösti","laut":"RRÖSH-ti (rolled r)"},{"region":"berlin","wort":"Wasser","laut":"VAS-sa"}]},{"id":"schweizer_ch","t":"Das Schweizer ch: Chuchichäschtli","e":"Im Schweizerdeutschen klingt ch fast immer rau und weit hinten, auch nach i und e. Oft steht ch sogar dort, wo das Hochdeutsche k hat: „Kind“ wird „Chind“. Das berühmte Übungswort ist „Chuchichäschtli“ (Küchenschränkchen).","b":[{"region":"schweiz","wort":"Chuchichäschtli","laut":"KHU-khi-khesh-tli"},{"region":"schweiz","wort":"Chind","laut":"KHIND"},{"region":"schweiz","wort":"Grüezi","laut":"GRÜ-e-tsi"}]},{"id":"wiener_melodie","t":"Die Wiener Melodie: Servus und Baba","e":"In Österreich und Bayern spricht man Vokale oft länger und Konsonanten weicher: p, t, k klingen fast wie b, d, g. Dadurch wirkt die Sprache melodisch und gemütlich. Hör auf den Singsang bei „Servus“ und „Baba“.","b":[{"region":"oesterreich","wort":"Baba!","laut":"BAA-ba"},{"region":"oesterreich","wort":"Servus!","laut":"SEAR-vus"},{"region":"bayern","wort":"Servus!","laut":"SEA-vas"},{"region":"oesterreich","wort":"Tante","laut":"DAN-te"}]},{"id":"e_weg","t":"Im Süden fällt das -e weg","e":"Im Süden lässt man das unbetonte -e am Wortende oft weg. Aus „heute“ wird „heut“, aus „ich habe“ wird „i hob“ oder „ich ha“. Im Norden hört man das -e meist noch, wenn auch leise.","b":[{"region":"nord","wort":"heute","laut":"HOY-teh"},{"region":"bayern","wort":"heute","laut":"HOYT"},{"region":"oesterreich","wort":"ich habe","laut":"ee HOHB"},{"region":"schweiz","wort":"ich habe","laut":"ikh HAA"}]}]},"en":{"titel":"Englische Regionalismen","regionen":[{"id":"usa","name":"USA","kurz":"US","farbe":"#BFD7F5","em":"🗽"},{"id":"uk","name":"England","kurz":"UK","farbe":"#F5C6CB","em":"🫖"},{"id":"schottland","name":"Schottland","kurz":"SCO","farbe":"#D3C6F0","em":"🏰"},{"id":"irland","name":"Irland","kurz":"IE","farbe":"#C4EBC8","em":"☘️"},{"id":"australien","name":"Australien","kurz":"AU","farbe":"#FBE0B5","em":"🦘"},{"id":"indien","name":"Indien","kurz":"IN","farbe":"#FFD3B0","em":"🛺"}],"woerter":[{"id":"wohnung","em":"🏢","kat":"alltag","k":"die Wohnung","v":{"usa":"apartment","uk":"flat","schottland":"flat","irland":"apartment / flat","australien":"unit","indien":"flat"},"witz":"Ich wohne in einer Höhle am Fluss. Mietfrei. Mit Seeblick.","hin":null},{"id":"aufzug","kat":"alltag","k":"der Aufzug","v":{"usa":"elevator","uk":"lift","schottland":"lift","irland":"lift","australien":"lift","indien":"lift"},"witz":"Fünf gegen einen! Die USA fahren allein Aufzug.","hin":null},{"id":"handy","em":"📱","kat":"alltag","k":"das Handy","v":{"usa":"cell phone / cell","uk":"mobile","schottland":"mobile","irland":"mobile","australien":"mobile","indien":"mobile"},"witz":"Achtung: „Handy“ ist kein englisches Wort. Das haben sich die Deutschen ausgedacht!","hin":"„Handy“ ist ein Scheinanglizismus – im Englischen heißt handy „praktisch“."},{"id":"schlange","em":"🧍","kat":"alltag","k":"die Warteschlange","v":{"usa":"line","uk":"queue","schottland":"queue","irland":"queue","australien":"queue / line","indien":"queue / line"},"witz":"In England stellt man sich sogar an, um sich anzustellen. Ich bewundere das.","hin":null},{"id":"muell","em":"🗑️","kat":"alltag","k":"der Müll","v":{"usa":"trash / garbage","uk":"rubbish","schottland":"rubbish","irland":"rubbish","australien":"rubbish","indien":"garbage"},"witz":"Ich esse übrigens Gras, keine Verpackung. Null Müll. Bitte nachmachen!","hin":null},{"id":"pullover","em":"🧶","kat":"alltag","k":"der Pullover","v":{"usa":"sweater","uk":"jumper","schottland":"jumper","irland":"jumper","australien":"jumper","indien":"sweater"},"witz":"„Jumper“? Ich springe nur ins Wasser – Pulli brauche ich mit meinem Fell nicht.","hin":"In den USA ist ein „jumper“ ein Trägerkleid."},{"id":"hose","em":"👖","kat":"alltag","k":"die Hose","v":{"usa":"pants","uk":"trousers","schottland":"trousers","irland":"trousers","australien":"pants / trousers","indien":"pants / trousers"},"witz":"Ich trage nie Hosen. Das erspart mir viele peinliche Missverständnisse.","hin":"Vorsicht: In England sind „pants“ die Unterhose."},{"id":"toilette","em":"🚻","kat":"alltag","k":"die Toilette","v":{"usa":"restroom / bathroom","uk":"loo / toilet","schottland":"toilet / loo","irland":"toilet / the jacks","australien":"toilet / loo","indien":"washroom / toilet"},"witz":"In Amerika fragt man nach dem „Badezimmer“ – auch wenn man gar nicht baden will.","hin":"„The jacks“ ist irische Umgangssprache – locker, nicht für formelle Anlässe."},{"id":"turnschuhe","em":"👟","kat":"alltag","k":"die Turnschuhe","v":{"usa":"sneakers","uk":"trainers","schottland":"trainers","irland":"runners","australien":"runners / joggers","indien":"sports shoes"},"witz":"Vier Pfoten, null Schuhe. Ich spare ein Vermögen.","hin":null},{"id":"klein","em":"🤏","kat":"alltag","k":"klein","v":{"usa":"little","uk":"little / small","schottland":"wee","irland":"small / little","australien":"little","indien":"small"},"witz":"In Schottland bin ich ein „wee capybara“. Klingt viel niedlicher, oder?","hin":"„Wee“ hört man auch in Nordirland."},{"id":"keks","kat":"essen","k":"der Keks","v":{"usa":"cookie","uk":"biscuit","schottland":"biscuit","irland":"biscuit","australien":"biscuit / bikkie","indien":"biscuit"},"witz":"Ein Keks zum Tee – in England fast ein Grundrecht.","hin":"In den USA ist ein „biscuit“ ein weiches Brötchen."},{"id":"pommes","em":"🍟","kat":"essen","k":"die Pommes","v":{"usa":"fries / French fries","uk":"chips","schottland":"chips","irland":"chips","australien":"chips","indien":"French fries / finger chips"},"witz":"Fish and Chips heißt nicht Fisch mit Kartoffelchips. Ich habe nachgefragt.","hin":null},{"id":"chips","em":"🥔","kat":"essen","k":"die Kartoffelchips","v":{"usa":"chips / potato chips","uk":"crisps","schottland":"crisps","irland":"crisps","australien":"chips","indien":"chips / wafers"},"witz":"Chips, Crisps, Chips … Am Ende knistert die Tüte überall gleich.","hin":"Aufgepasst: „chips“ sind in England Pommes, in den USA Kartoffelchips."},{"id":"suessigkeiten","em":"🍬","kat":"essen","k":"die Süßigkeiten","v":{"usa":"candy","uk":"sweets","schottland":"sweeties","irland":"sweets","australien":"lollies","indien":"toffees / sweets"},"witz":"„Sweeties“ – die Schotten machen sogar Süßigkeiten noch süßer.","hin":"In Indien meint „sweets“ oft traditionelle Süßspeisen (mithai)."},{"id":"rechnung","kat":"essen","k":"die Rechnung (im Restaurant)","v":{"usa":"check","uk":"bill","schottland":"bill","irland":"bill","australien":"bill","indien":"bill"},"witz":"Die Rechnung, bitte! Ich zahle mit … Kuscheln?","hin":null},{"id":"mitnehmen","em":"🥡","kat":"essen","k":"Essen zum Mitnehmen","v":{"usa":"takeout / to go","uk":"takeaway","schottland":"takeaway / carry-out","irland":"takeaway","australien":"takeaway","indien":"parcel"},"witz":"In Indien sagt man „parcel“. Mein Abendessen kommt also per Paket. Herrlich!","hin":null},{"id":"sandwich","kat":"essen","k":"das Sandwich / belegte Brot","v":{"usa":"sandwich","uk":"sandwich / sarnie","schottland":"piece","irland":"sandwich / sambo","australien":"sandwich / sanga","indien":"sandwich"},"witz":"In Schottland heißt ein Brot „piece“. Ein Stück Glück eben.","hin":null},{"id":"aubergine","em":"🍆","kat":"essen","k":"die Aubergine","v":{"usa":"eggplant","uk":"aubergine","schottland":"aubergine","irland":"aubergine","australien":"eggplant","indien":"brinjal"},"witz":"„Eggplant“? Ich habe sie lange untersucht. Kein einziges Ei gefunden.","hin":null},{"id":"limo","em":"🥤","kat":"essen","k":"die Limo / das Erfrischungsgetränk","v":{"usa":"soda / pop","uk":"fizzy drink","schottland":"ginger","irland":"minerals","australien":"soft drink","indien":"cold drink"},"witz":"In Glasgow ist jede Limo „ginger“ – auch wenn kein Ingwer drin ist.","hin":"„Soda“ oder „pop“ – das hängt in den USA von der Gegend ab."},{"id":"lastwagen","em":"🚚","kat":"unterwegs","k":"der Lastwagen","v":{"usa":"truck","uk":"lorry","schottland":"lorry","irland":"lorry / truck","australien":"truck","indien":"truck / lorry"},"witz":"Ich bin langsam, aber zuverlässig – fast wie ein Lastwagen.","hin":null},{"id":"gehweg","em":"🚶","kat":"unterwegs","k":"der Gehweg","v":{"usa":"sidewalk","uk":"pavement","schottland":"pavement","irland":"footpath","australien":"footpath","indien":"footpath"},"witz":"Ich gehe am liebsten auf dem „footpath“. Der Name passt zu meinen Pfoten.","hin":"In den USA ist „pavement“ der Straßenbelag – also die Fahrbahn!"},{"id":"benzin","em":"⛽","kat":"unterwegs","k":"das Benzin","v":{"usa":"gas / gasoline","uk":"petrol","schottland":"petrol","irland":"petrol","australien":"petrol","indien":"petrol"},"witz":"Ich laufe mit Gras, nicht mit Gas. Klingt ähnlich, riecht besser.","hin":null},{"id":"urlaub","em":"🏖️","kat":"unterwegs","k":"der Urlaub","v":{"usa":"vacation","uk":"holiday","schottland":"holiday","irland":"holidays","australien":"holiday / hols","indien":"vacation / holidays"},"witz":"Mein Traumurlaub: eine warme Quelle in Japan. Capybaras lieben Onsen!","hin":null},{"id":"freund","kat":"leute","k":"der Kumpel","v":{"usa":"buddy","uk":"mate","schottland":"pal","irland":"pal / mate","australien":"mate","indien":"friend / yaar"},"witz":"Ich bin jedermanns Kumpel. Sogar Vögel sitzen auf mir.","hin":"„Yaar“ ist locker und herzlich – nur unter Freunden."},{"id":"kind","em":"🧒","kat":"leute","k":"das Kind","v":{"usa":"kid","uk":"kid / child","schottland":"bairn / wean","irland":"child / young one","australien":"kid / littlie","indien":"child / baby"},"witz":"„Bairn“ klingt fast wie „Bär“. Schottische Kinder sind halt kuschelig.","hin":"In Indien nennt man auch kleine Kinder liebevoll „baby“."},{"id":"mama","em":"👩","kat":"leute","k":"die Mama","v":{"usa":"Mom","uk":"Mum","schottland":"Mum","irland":"Mam","australien":"Mum","indien":"Mummy / Mom"},"witz":"Mom, Mum, Mam – ein Buchstabe Unterschied, dieselbe Umarmung.","hin":null},{"id":"ihralle","em":"👥","kat":"leute","k":"ihr (alle)","v":{"usa":"you guys / y'all","uk":"you lot","schottland":"youse","irland":"ye","australien":"you guys / youse","indien":"you all"},"witz":"Englisch hat kein eigenes „ihr“. Also hat jede Region eins erfunden!","hin":"„Y'all“ hört man vor allem im Süden der USA."},{"id":"hallo","em":"👋","kat":"gruesse","k":"Hallo!","v":{"usa":"Hey!","uk":"Hiya!","schottland":"Hiya!","irland":"Howya!","australien":"G'day!","indien":"Namaste! / Hello ji!"},"witz":"„G'day!“ – ich übe es jeden Morgen mit den Kängurus.","hin":"„Ji“ ist ein respektvoller Zusatz in Indien – freundlich und höflich."},{"id":"wiegehts","em":"🙂","kat":"gruesse","k":"Wie geht's?","v":{"usa":"What's up?","uk":"You alright?","schottland":"How's it goin'?","irland":"What's the craic?","australien":"How ya going?","indien":"How are you?"},"witz":"„You alright?“ ist eine Begrüßung, keine Sorge. Mir geht's prima!","hin":"„Craic“ (gesprochen wie „crack“) heißt in Irland Spaß oder Neuigkeiten."},{"id":"tschuess","em":"👋","kat":"gruesse","k":"Tschüss!","v":{"usa":"See ya!","uk":"See you later!","schottland":"Cheerio!","irland":"Bye bye bye bye!","australien":"Catch ya later!","indien":"Okay, bye! Take care!"},"witz":"Iren verabschieden sich am Telefon mit fünf „bye“. Mindestens!","hin":null},{"id":"danke","em":"🙏","kat":"gruesse","k":"Danke!","v":{"usa":"Thanks!","uk":"Cheers!","schottland":"Cheers!","irland":"Thanks a million!","australien":"Ta! / Cheers, mate!","indien":"Thank you so much!"},"witz":"„Thanks a million!“ – die Iren danken gleich millionenfach. Großzügig!","hin":"„Cheers“ heißt in Großbritannien oft einfach „danke“ – nicht nur „Prost“."},{"id":"super","em":"🤩","kat":"gruesse","k":"Super! / Klasse!","v":{"usa":"Awesome!","uk":"Brilliant!","schottland":"Braw!","irland":"Grand! / Deadly!","australien":"Awesome! / Ripper!","indien":"Superb! / Too good!"},"witz":"In Irland ist „grand“ einfach „okay“. Und „deadly“ ist richtig super!","hin":"„Deadly“ für „super“ ist typisch für Dublin."}],"laute":[{"id":"r_hoerbar","t":"Das R nach Vokalen","e":"In den USA, Schottland, Irland und Indien spricht man das R in „car“ hörbar aus. In England und Australien verschwindet es meistens – der Vokal wird nur länger.","b":[{"region":"usa","wort":"car","laut":"kaar (R clearly heard)"},{"region":"uk","wort":"car","laut":"kaah (no R)"},{"region":"schottland","wort":"car","laut":"karr (short, tapped R)"},{"region":"australien","wort":"car park","laut":"kaah paahk"}]},{"id":"tomato","t":"Tomayto oder tomahto?","e":"Das berühmte Wort „tomato“ klingt je nach Land anders. In den USA sagt man „to-MAY-to“, in England und Australien „to-MAH-to“. Beides ist richtig!","b":[{"region":"usa","wort":"tomato","laut":"tuh-MAY-toh"},{"region":"uk","wort":"tomato","laut":"tuh-MAH-toh"},{"region":"australien","wort":"tomato","laut":"tuh-MAH-toh"},{"region":"indien","wort":"tomato","laut":"toh-MAA-toh"}]},{"id":"water_t","t":"Das T in „water“","e":"Zwischen Vokalen wird das T in den USA und Australien weich, fast wie ein schnelles D. In London und Glasgow hört man im Alltag oft eine kleine Pause im Hals statt des T.","b":[{"region":"usa","wort":"water","laut":"WAH-der"},{"region":"australien","wort":"water","laut":"WOH-dah"},{"region":"uk","wort":"a bottle of water","laut":"a BO-'l of WAW-'uh (casual London)"},{"region":"schottland","wort":"water","laut":"WAH-'er (catch in the throat)"}]},{"id":"bath_a","t":"Das A in „bath“ und „grass“","e":"In Südengland klingt das A in „bath“ und „grass“ lang und tief wie in „Vater“. In den USA, Schottland und Irland bleibt es kurz und hell wie in „cat“.","b":[{"region":"uk","wort":"bath","laut":"baahth (long A)"},{"region":"usa","wort":"bath","laut":"baeth (short A, like 'cat')"},{"region":"schottland","wort":"grass","laut":"grass (short A)"},{"region":"australien","wort":"bath","laut":"baahth (long A)"}]},{"id":"aussie_melodie","t":"Australische Melodie und „mate“","e":"Australier lassen die Stimme am Satzende oft nach oben gehen – auch wenn es keine Frage ist. Und das „ay“ in „mate“ oder „day“ klingt fast wie „ai“.","b":[{"region":"australien","wort":"G'day, mate!","laut":"g'DAI, mait!"},{"region":"australien","wort":"No worries","laut":"noh WUH-reez ↗ (voice goes up)"},{"region":"uk","wort":"mate","laut":"mayt"}]},{"id":"irisch_th","t":"Das irische TH","e":"Für das englische TH legt man die Zunge zwischen die Zähne. In Irland klingt es oft wie ein weiches T oder D. Aus „three“ wird fast „tree“.","b":[{"region":"irland","wort":"thirty-three","laut":"TIR-tee tree"},{"region":"irland","wort":"Thanks!","laut":"tanks!"},{"region":"usa","wort":"three","laut":"thhree (tongue between the teeth)"}]},{"id":"indisch_t_d","t":"Indisches T und D – und „only“","e":"Im indischen Englisch wird die Zungenspitze bei T und D oft leicht nach hinten gebogen. Das gibt einen vollen, typischen Klang. Und „only“ dient oft zur Betonung: „today only“ heißt „genau heute“.","b":[{"region":"indien","wort":"doctor","laut":"DOK-tar (tongue tip curled back)"},{"region":"indien","wort":"I'll come today only.","laut":"ail kum tu-DAY OHN-lee (= this very day)"},{"region":"usa","wort":"doctor","laut":"DAHK-ter"}]},{"id":"schottisch_ch","t":"Das schottische CH in „loch“","e":"In Schottland klingt das CH in „loch“ (See) wie in deutsch „Bach“. Viele Amerikaner sagen einfach „lock“. Für Deutschsprachige ist der schottische Laut ganz leicht!","b":[{"region":"schottland","wort":"Loch Ness","laut":"lokh NESS (kh as in 'Bach')"},{"region":"usa","wort":"Loch Ness","laut":"lock NESS"}]}]},"el":{"titel":"Griechische Regionalismen","regionen":[{"id":"athen","name":"Athen (Standard)","kurz":"AT","farbe":"#cfe3f7","em":"🏛️"},{"id":"thessaloniki","name":"Thessaloniki & Nordgriechenland","kurz":"TH","farbe":"#f7dcc8","em":"🥯"},{"id":"kreta","name":"Kreta","kurz":"KR","farbe":"#d9edc9","em":"🫒"},{"id":"kypros","name":"Zypern","kurz":"CY","farbe":"#f9edc0","em":"🧀"},{"id":"kykladen","name":"Kykladen","kurz":"KY","farbe":"#d4eef0","em":"⛵"},{"id":"ionisch","name":"Ionische Inseln","kurz":"IO","farbe":"#e6dcf3","em":"🍊"}],"woerter":[{"id":"hallo","em":"👋","kat":"gruesse","k":"Hallo (zu einer Person, per du)","v":{"athen":"Γεια σου!","thessaloniki":"Γεια σου!","kreta":"Γεια σου!","kypros":"Γεια σου!","kykladen":"Γεια σου!","ionisch":"Γεια σου!"},"witz":"Ein Gruß für ganz Griechenland – den sage sogar ich mit vollem Mund.","hin":"Überall gleich. Höflich oder zu mehreren: „Γεια σας!“"},{"id":"wiegehts","em":"💬","kat":"gruesse","k":"Wie geht’s?","v":{"athen":"Τι κάνεις;","thessaloniki":"Τι κάνεις;","kreta":"Ίντα κάνεις;","kypros":"Ίνταλως είσαι;","kykladen":"Τι κάνεις;","ionisch":"Τι κάνεις;"},"witz":"Auf Kreta fragt man „Ίντα κάνεις;“ – meine Antwort: satt, nass und zufrieden.","hin":null},{"id":"pame","em":"🚶","kat":"gruesse","k":"Gehen wir! / Los geht’s!","v":{"athen":"Πάμε!","thessaloniki":"Πάμε!","kreta":"Πάμε!","kypros":"Πάμεν!","kykladen":"Πάμε!","ionisch":"Πάμε!"},"witz":"Auf Zypern hängt man ein -ν an. Ich hänge lieber ein Nickerchen an.","hin":"Zyprisch behält oft das alte End-ν: πάμεν, το σπίτιν."},{"id":"was","em":"❓","kat":"gruesse","k":"Was?","v":{"athen":"Τι;","thessaloniki":"Τι;","kreta":"Ίντα;","kypros":"Ίντα;","kykladen":"Τι;","ionisch":"Τι;"},"witz":"„Ίντα;“ – auf Kreta und Zypern klingt sogar eine Frage nach Musik.","hin":null},{"id":"ela","em":"📞","kat":"gruesse","k":"Komm! / Na? (auch am Telefon)","v":{"athen":"Έλα!","thessaloniki":"Έλα!","kreta":"Έλα!","kypros":"Έλα!","kykladen":"Έλα!","ionisch":"Έλα!"},"witz":"Viele Griechen gehen mit „Έλα!“ ans Telefon. Ich gehe mit „Mmh?“ ran.","hin":"Wörtlich „komm!“, aber auch „na los!“ oder „hallo“ am Telefon – überall gleich."},{"id":"nein","em":"🙅","kat":"gruesse","k":"Nein","v":{"athen":"Όχι","thessaloniki":"Όχι","kreta":"Όχι","kypros":"Όι","kykladen":"Όχι","ionisch":"Όχι"},"witz":"Auf Zypern ist „nein“ so kurz, dass ich es zwischen zwei Bissen sage: „Όι“.","hin":"Achtung: „ναι“ heißt JA – auch wenn es für deutsche Ohren wie „nee“ klingt!"},{"id":"sagtedir","em":"🗣️","kat":"gruesse","k":"Ich hab’s dir (doch) gesagt.","v":{"athen":"Σου είπα.","thessaloniki":"Σε είπα.","kreta":"Σου είπα.","kypros":"Είπα σου.","kykladen":"Σου είπα.","ionisch":"Σου είπα."},"witz":"Im Norden sagt man „σε είπα“. Ich sag’s dir trotzdem gern nochmal.","hin":"Im Norden steht oft „σε/με“ statt „σου/μου“; auf Zypern rückt das Pronomen hinter das Verb."},{"id":"kumpel","kat":"leute","k":"Kumpel! (Anrede)","v":{"athen":"Φίλε!","thessaloniki":"Φίλε!","kreta":"Φίλε!","kypros":"Κουμπάρε!","kykladen":"Φίλε!","ionisch":"Φίλε!"},"witz":"Auf Zypern wirst du schnell „κουμπάρε“ – ganz ohne Hochzeit. Praktisch!","hin":"„Κουμπάρος“ ist eigentlich Trauzeuge oder Taufpate; auf Zypern ruft man so auch Freunde."},{"id":"junge","em":"👦","kat":"leute","k":"Junge","v":{"athen":"αγόρι","thessaloniki":"αγόρι","kreta":"κοπέλι","kypros":"κοπέλλι","kykladen":"αγόρι","ionisch":"αγόρι"},"witz":"Auf Kreta ist ein „κοπέλι“ ein Junge. Ich bin übrigens ein Capybara-κοπέλι.","hin":"Vorsicht: „κοπέλα“ heißt überall „junge Frau“ – „κοπέλι“ auf Kreta und Zypern aber „Junge“!"},{"id":"maedchen","em":"👧","kat":"leute","k":"Mädchen","v":{"athen":"κορίτσι","thessaloniki":"κορίτσι","kreta":"κοπελιά","kypros":"κοπελλούα","kykladen":"κορίτσι","ionisch":"κορίτσι"},"witz":"„Κοπελλούα“ – auf Zypern klingt sogar „Mädchen“ wie ein Kosename.","hin":null},{"id":"oma","em":"👵","kat":"leute","k":"Oma","v":{"athen":"γιαγιά","thessaloniki":"γιαγιά","kreta":"γιαγιά","kypros":"γιαγιά","kykladen":"γιαγιά","ionisch":"νόνα"},"witz":"Ob γιαγιά oder νόνα: Jede griechische Oma fragt zuerst, ob du schon gegessen hast.","hin":"Auf den Ionischen Inseln (z. B. Korfu) sagt man wegen des italienischen Einflusses „νόνα“ und „νόνος“."},{"id":"du","em":"👉","kat":"leute","k":"du","v":{"athen":"εσύ","thessaloniki":"εσύ","kreta":"εσύ","kypros":"εσού","kykladen":"εσύ","ionisch":"εσύ"},"witz":"Auf Zypern wird „εσύ“ zu „εσού“ – klingt, als würde man dich umarmen.","hin":null},{"id":"jetzt","em":"⏰","kat":"alltag","k":"jetzt","v":{"athen":"τώρα","thessaloniki":"τώρα","kreta":"εδά","kypros":"τωρά","kykladen":"τώρα","ionisch":"τώρα"},"witz":"Auf Kreta heißt „jetzt“ „εδά“. Für mich heißt „jetzt“ meistens: gleich, nach dem Bad.","hin":"Kretisch „εδά“ = jetzt – nicht mit „εδώ“ (hier) verwechseln!"},{"id":"hier","em":"📍","kat":"alltag","k":"hier","v":{"athen":"εδώ","thessaloniki":"εδώ","kreta":"εδώ","kypros":"δαμαί","kykladen":"εδώ","ionisch":"εδώ"},"witz":"„Δαμαί“ heißt auf Zypern „hier“. Hier bin ich – und hier bleibe ich, im Schatten.","hin":null},{"id":"dort","em":"🪧","kat":"alltag","k":"dort","v":{"athen":"εκεί","thessaloniki":"εκεί","kreta":"εκεί","kypros":"τζιαμαί","kykladen":"εκεί","ionisch":"εκεί"},"witz":"Zypern: δαμαί hier, τζιαμαί dort. Ich: dazwischen, mitten im Wasser.","hin":"Auf Kreta schreibt man „εκεί“, spricht aber oft „e-TSI“."},{"id":"zuhause","kat":"alltag","k":"Ich bin zu Hause.","v":{"athen":"Είμαι σπίτι.","thessaloniki":"Είμαι σπίτι.","kreta":"Είμαι σπίτι.","kypros":"Είμαι έσσω.","kykladen":"Είμαι σπίτι.","ionisch":"Είμαι σπίτι."},"witz":"Auf Zypern ist man „έσσω“ – drinnen. Mein έσσω ist der Teich.","hin":"„Έσσω“ heißt wörtlich „drinnen“ und wird auf Zypern für „zu Hause“ gebraucht."},{"id":"istschoen","em":"🌅","kat":"alltag","k":"Es ist sehr schön.","v":{"athen":"Είναι πολύ ωραίο.","thessaloniki":"Είναι πολύ ωραίο.","kreta":"Είναι πολύ ωραίο.","kypros":"Εν πολλά ωραίο.","kykladen":"Είναι πολύ ωραίο.","ionisch":"Είναι πολύ ωραίο."},"witz":"Zyprisch spart Silben: „εν“ statt „είναι“. Die gesparte Zeit nutze ich zum Dösen.","hin":"Auf Zypern: „εν“ = ist, „πολλά“ = sehr."},{"id":"und","em":"➕","kat":"alltag","k":"und","v":{"athen":"και","thessaloniki":"και","kreta":"και","kypros":"τζαι","kykladen":"και","ionisch":"και"},"witz":"Auf Zypern schreibt man das „und“ sogar so, wie man es spricht: „τζαι“. Ehrlich!","hin":"Auf Kreta schreibt man „και“, spricht aber oft „tse“."},{"id":"sehen","em":"👀","kat":"alltag","k":"ich sehe","v":{"athen":"βλέπω","thessaloniki":"βλέπω","kreta":"θωρώ","kypros":"θωρώ","kykladen":"βλέπω","ionisch":"βλέπω"},"witz":"„Θωρώ“ – auf Kreta und Zypern sieht man mit einem alten, schönen Wort. Ich sehe nur Melonen.","hin":null},{"id":"sagen","em":"👄","kat":"alltag","k":"ich sage / ich spreche","v":{"athen":"λέω","thessaloniki":"λέω","kreta":"λέω","kypros":"λαλώ","kykladen":"λέω","ionisch":"λέω"},"witz":"Auf Zypern „λαλεί“ jeder. In Athen tut das nur der Hahn.","hin":"Im Standard heißt „λαλώ“ eher „krähen/singen“ (bei Vögeln)."},{"id":"wannkommst","em":"📅","kat":"alltag","k":"Wann kommst du?","v":{"athen":"Πότε θα έρθεις;","thessaloniki":"Πότε θα ’ρθεις;","kreta":"Πότε θα ’ρθεις;","kypros":"Πότε εννά ’ρτεις;","kykladen":"Πότε θα ’ρθεις;","ionisch":"Πότε θα ’ρθεις;"},"witz":"Egal wie du fragst – meine Antwort ist immer: wenn das Essen fertig ist.","hin":"Zyprisch bildet die Zukunft mit „εννά“ statt „θα“. Im Alltag verschluckt man überall gern das „έ“: θα ’ρθεις."},{"id":"koulouri","em":"🥯","kat":"essen","k":"Sesamkringel","v":{"athen":"κουλούρι Θεσσαλονίκης","thessaloniki":"κουλούρι / σιμίτι","kreta":"κουλούρι","kypros":"κουλούρι","kykladen":"κουλούρι","ionisch":"κουλούρι"},"witz":"In Athen heißt er „aus Thessaloniki“. In Thessaloniki einfach „meiner“.","hin":"In Athen sagt man „κουλούρι Θεσσαλονίκης“; in Thessaloniki „κουλούρι“, ältere Leute auch „σιμίτι“."},{"id":"spiess","em":"🍢","kat":"essen","k":"Fleischspieß","v":{"athen":"καλαμάκι","thessaloniki":"σουβλάκι","kreta":"σουβλάκι / καλαμάκι","kypros":"σουβλάκι","kykladen":"καλαμάκι","ionisch":"καλαμάκι / σουβλάκι"},"witz":"Bestell in Athen ein „καλαμάκι“ und du kriegst einen Spieß. Ich wollte einen Strohhalm.","hin":"Athen: „καλαμάκι“ = Spieß; im Norden und auf Zypern heißt er „σουβλάκι“. „Καλαμάκι“ ist außerdem der Trinkhalm."},{"id":"bougatsa","em":"🥧","kat":"essen","k":"Bougatsa (Blätterteig mit Creme oder Käse)","v":{"athen":"μπουγάτσα","thessaloniki":"μπουγάτσα","kreta":"μπουγάτσα (με μυζήθρα)","kypros":"μπουγάτσα","kykladen":"μπουγάτσα","ionisch":"μπουγάτσα"},"witz":"In Thessaloniki isst man Bougatsa zum Frühstück. Ich auch – und zum Mittag, und zum …","hin":"Das Wort ist überall gleich. Thessaloniki ist berühmt dafür; auf Kreta (Chania) gibt es sie mit Mizithra-Käse."},{"id":"schnaps","em":"🥃","kat":"essen","k":"Traubenschnaps","v":{"athen":"τσίπουρο / ούζο","thessaloniki":"τσίπουρο","kreta":"τσικουδιά / ρακί","kypros":"ζιβανία","kykladen":"ρακί","ionisch":"τσίπουρο / ούζο"},"witz":"Ich trinke nur Wasser. Aber mein „Γεια μας!“ ist das lauteste am Tisch.","hin":"Nur für Erwachsene: klein serviert, langsam getrunken, immer mit Mezé."},{"id":"schnecken","em":"🐌","kat":"essen","k":"Schnecken (als Gericht)","v":{"athen":"σαλιγκάρια","thessaloniki":"σαλιγκάρια","kreta":"χοχλιοί","kypros":"σαλιγκάρια","kykladen":"σαλιγκάρια","ionisch":"σαλιγκάρια"},"witz":"Auf Kreta heißen Schnecken „χοχλιοί“. Klingt wie ein Zungenbrecher – sie haben ja Zeit.","hin":"Berühmtes kretisches Gericht: „χοχλιοί μπουμπουριστοί“ (in Öl gebraten, mit Rosmarin)."},{"id":"halloumi","kat":"essen","k":"Halloumi (Grillkäse)","v":{"athen":"χαλούμι","thessaloniki":"χαλούμι","kreta":"χαλούμι","kypros":"χαλλούμι","kykladen":"χαλούμι","ionisch":"χαλούμι"},"witz":"Halloumi quietscht beim Kauen. Ich auch, wenn ich mich freue.","hin":"Auf Zypern mit Doppel-λ geschrieben – und das l wird auch länger gesprochen."},{"id":"frappe","em":"🧋","kat":"essen","k":"Frappé (geschäumter Eiskaffee)","v":{"athen":"φραπέ","thessaloniki":"φραπέ","kreta":"φραπέ","kypros":"φραπέ","kykladen":"φραπέ","ionisch":"φραπέ"},"witz":"Der Frappé wurde 1957 in Thessaloniki erfunden – aus Versehen. Wie meine besten Ideen.","hin":"Überall gleich. Man bestellt ihn „σκέτο, μέτριο oder γλυκό“ (ohne, mittel, süß)."},{"id":"pita","em":"🫓","kat":"essen","k":"Fladenbrot (Pita)","v":{"athen":"πίτα","thessaloniki":"πίτα","kreta":"πίτα","kypros":"πίττα","kykladen":"πίτα","ionisch":"πίτα"},"witz":"Die zyprische „πίττα“ hat ein Extra-τ. Ich hätte lieber Extra-Füllung.","hin":"„Πίτα“ ist auch eine gefüllte Pastete: τυρόπιτα (Käse), σπανακόπιτα (Spinat)."},{"id":"faehre","em":"⛴️","kat":"unterwegs","k":"Fähre / Schiff","v":{"athen":"πλοίο","thessaloniki":"πλοίο","kreta":"καράβι","kypros":"καράβι","kykladen":"καράβι","ionisch":"καράβι"},"witz":"Auf den Inseln fragt jeder: „Wann kommt das καράβι?“ Antwort: „Bald.“ Mein Lieblingsfahrplan.","hin":"Beide Wörter versteht man überall: „πλοίο“ klingt offizieller, „καράβι“ alltäglicher."},{"id":"quad","em":"🏍️","kat":"unterwegs","k":"Quad (Geländefahrzeug)","v":{"athen":"γουρούνα","thessaloniki":"γουρούνα","kreta":"γουρούνα","kypros":"γουρούνα","kykladen":"γουρούνα","ionisch":"γουρούνα"},"witz":"Auf den Inseln mietet man eine „γουρούνα“ – ein Schweinchen mit Motor. Ich bleib beim Capybara-Tempo.","hin":"Umgangssprachlich überall gleich; wörtlich heißt „γουρούνα“ „Sau“."},{"id":"kiosk","em":"🏪","kat":"unterwegs","k":"Kiosk","v":{"athen":"περίπτερο","thessaloniki":"περίπτερο","kreta":"περίπτερο","kypros":"περίπτερο","kykladen":"περίπτερο","ionisch":"περίπτερο"},"witz":"Am περίπτερο gibt’s alles: Wasser, Zeitung, Kaugummi, Wegbeschreibung – nur keine Melonen.","hin":null}],"laute":[{"id":"standard","t":"Athen: der Standard","e":"So klingt Griechisch in Nachrichten und Schulen. Jedes Wort hat genau einen betonten Vokal (mit Akzent markiert). θ klingt wie englisch „th“ in „think“, δ wie „th“ in „this“.","b":[{"region":"athen","wort":"Αθήνα","laut":"a-THI-na"},{"region":"athen","wort":"δρόμος","laut":"DHRO-mos"},{"region":"athen","wort":"καλημέρα","laut":"ka-li-ME-ra"}]},{"id":"vokalschwund","t":"Nord: verschluckte i und u","e":"In Thessaloniki und im Norden fallen unbetonte i- und u-Laute oft weg. Die Wörter werden kürzer und klingen „härter“.","b":[{"region":"athen","wort":"βουνό","laut":"vu-NO"},{"region":"thessaloniki","wort":"βουνό","laut":"vNO"},{"region":"athen","wort":"σκυλί","laut":"ski-LI"},{"region":"thessaloniki","wort":"σκυλί","laut":"sk-LI"}]},{"id":"dunklesl","t":"Nord: das dunkle L","e":"Im Norden wird λ vor a, o, u tief hinten gesprochen, wie das englische „l“ in „ball“. Daran erkennen viele Griechen sofort jemanden aus Thessaloniki.","b":[{"region":"athen","wort":"καλά","laut":"ka-LA (helles l)"},{"region":"thessaloniki","wort":"καλά","laut":"ka-ŁA (dunkles l, wie „ball“)"},{"region":"thessaloniki","wort":"Θεσσαλονίκη","laut":"the-sa-ło-NI-ki"}]},{"id":"kretats","t":"Kreta: k wird zu ts","e":"Auf Kreta klingt κ vor e- und i-Lauten oft wie „ts“. Geschrieben wird es trotzdem normal mit κ.","b":[{"region":"athen","wort":"και","laut":"ke"},{"region":"kreta","wort":"και","laut":"tse"},{"region":"kreta","wort":"εκεί","laut":"e-TSI"},{"region":"kreta","wort":"κερί","laut":"tse-RI"}]},{"id":"kretasch","t":"Kreta: das weiche ch","e":"Vor e- und i-Lauten klingt χ auf Kreta fast wie „sch“. „Όχι“ (nein) wird so zu einem weichen „ó-schi“.","b":[{"region":"athen","wort":"όχι","laut":"O-chi (wie „ich“)"},{"region":"kreta","wort":"όχι","laut":"O-shi"},{"region":"kreta","wort":"έχει","laut":"E-shi"}]},{"id":"zypernch","t":"Zypern: tsch statt k","e":"Auf Zypern wird κ vor e- und i-Lauten oft zu „tsch“ wie in „Tschüss“. Manchmal schreibt man es sogar so: „τζαι“ statt „και“.","b":[{"region":"athen","wort":"και","laut":"ke"},{"region":"kypros","wort":"τζαι","laut":"tsche"},{"region":"kypros","wort":"τζιαμαί","laut":"tscha-ME"}]},{"id":"zypernlang","t":"Zypern: doppelte Konsonanten","e":"Im Standard klingen ss, ll, pp wie einfache Laute. Auf Zypern hört man sie wirklich doppelt, also länger. Das gibt dem Zyprischen seinen typischen Rhythmus.","b":[{"region":"athen","wort":"θάλασσα","laut":"THA-la-sa"},{"region":"kypros","wort":"θάλασσα","laut":"THA-las-sa"},{"region":"kypros","wort":"σήμμερα","laut":"SIM-me-ra"},{"region":"kypros","wort":"παππούς","laut":"pap-PUS"}]},{"id":"inselmelodie","t":"Inseln: die Sprachmelodie","e":"Auf den Kykladen und besonders auf den Ionischen Inseln (z. B. Korfu) klingt Griechisch fast gesungen. Die Stimme steigt und fällt stärker als in Athen. Die Wörter sind dieselben – die Musik ist anders.","b":[{"region":"athen","wort":"Καλημέρα!","laut":"ka-li-ME-ra (flach)"},{"region":"ionisch","wort":"Καλημέρα!","laut":"ka-li-MEEE-ra (singend, auf und ab)"},{"region":"kykladen","wort":"Τι κάνεις;","laut":"ti KA-nis? (Stimme geht am Ende hoch)"}]}]}};

  if(c.art==='wort'){
    var w=c.w;
    inner='<div class="wk-kopf"><div class="wk-bild">'+w.em+'</div><div><div class="wk-tt">'+esc(w.k)+'</div><div class="wk-kat">'+esc(KAT[w.kat][0])+'</div></div></div>'
      +'<div class="vergleich">'+c.formen.map(function(f){
        var r0=reg(f.r[0]);
        return '<div class="zeile" style="background:'+r0.farbe+'40"><div class="w"><div class="wort" lang="'+ZIEL+'">'+esc(f.f)+'</div><div class="wer">'
          +f.r.map(function(id){var r=reg(id);return '<span style="background:'+r.farbe+'">'+r.em+' '+esc(r.name)+'</span>';}).join('')
          +'</div></div><button class="ton" type="button" data-t="'+esc(f.f)+'" aria-label="'+esc(f.f)+' anhören">'+TON+'</button></div>';
      }).join('')+'</div>'
      +(w.witz?'<div class="witz">'+CAPY+'<div>'+esc(w.witz)+'</div></div>':'')
      +(w.hin?'<div class="hinweis">ℹ️ '+esc(w.hin)+'</div>':'');
  } else {
    var l=c.l;
    inner='<div class="wk-tt">'+esc(l.t)+'</div><div class="erkl">'+esc(l.e)+'</div>'
      +'<div class="vergleich">'+c.bsp.map(function(b){var r=reg(b.region);
        return '<div class="zeile" style="background:'+r.farbe+'40"><div class="w"><div class="wort" lang="'+ZIEL+'">'+esc(b.wort)+'</div><span class="laut">['+esc(b.laut)+']</span><div class="wer"><span style="background:'+r.farbe+'">'+r.em+' '+esc(r.name)+'</span></div></div>'
          +'<button class="ton" type="button" data-t="'+esc(b.wort)+'" aria-label="'+esc(b.wort)+' anhören">'+TON+'</button></div>';
      }).join('')+'</div>';
  }
  buehne.innerHTML='<section class="schritt">'+kopf
    +'<div class="leiste"><i style="width:'+Math.round((Z.i+1)/n*100)+'%"></i></div>'
    +'<article class="wk">'+inner+'</article>'
    +'<div class="nav"><button class="nav-k" type="button" id="zr" aria-label="Vorige Karte" '+(Z.i?'':'disabled')+'>‹</button>'
    +'<div class="zaehler">'+(Z.i+1)+' / '+n+'</div>'
    +'<button class="nav-k vor" type="button" id="vr" aria-label="Nächste Karte">›</button></div>'
    +'</section>';
  document.getElementById('aendern').onclick=function(){geh(1);};
  document.getElementById('zr').onclick=function(){if(Z.i){Z.i--;s4();}};
  document.getElementById('vr').onclick=function(){Z.i++;s4();};
  buehne.querySelectorAll('.ton').forEach(function(b){b.onclick=function(){sprich(b.getAttribute('data-t'));};});
}

/* Im Prototyp spricht die Browser-Stimme; in der App übernimmt Piper (audio.js). */
function sprich(t){try{var u=new SpeechSynthesisUtterance(t);u.lang=STIMME[ZIEL];speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}

/* Wischen auf der Karte */
var x0=null;
buehne.addEventListener('touchstart',function(e){if(Z.schritt===4)x0=e.touches[0].clientX;},{passive:true});
buehne.addEventListener('touchend',function(e){if(x0==null)return;var dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)<60)return;if(dx<0&&Z.i<Z.karten.length){Z.i++;s4();}else if(dx>0&&Z.i>0){Z.i--;s4();}});

function geh(s){Z.schritt=s;punkte();buehne.scrollTop=0;[null,s1,s2,s3,s4][s]();}
document.getElementById('zurueck').onclick=function(){
  if(Z.schritt===4) geh(Z.art==='laut'?2:3);
  else if(Z.schritt>1) geh(Z.schritt-1);
};
geh(1);
</script>
