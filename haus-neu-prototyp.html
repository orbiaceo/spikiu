<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spikiu Haus neu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: Prototyp v3 — so nah wie möglich am echten haus.html (gleiche Kacheln, gleiche Ruhe). Nur die Ordnung ist neu. */
:root{--bg:#eef7f1;--ink:#15163a;--acc:#ff6b5a;--muted:#5f7068;--ow:2.5px;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;line-height:1.5}
button{font-family:inherit;color:var(--ink)}
button:focus-visible{outline:3px solid #1f93b0;outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.nav{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:2.5px solid var(--ink);padding:calc(.5rem + env(safe-area-inset-top,0px)) .5rem 0}
.doors{display:flex;gap:.4rem;max-width:560px;margin:0 auto}
.door{flex:1;background:transparent;border:none;cursor:pointer;padding:.5rem .2rem .6rem;display:flex;flex-direction:column;align-items:center;gap:.25rem;position:relative;min-height:72px}
.door .ic{width:42px;height:42px;transition:transform .2s}
.door .lb{font:800 .82rem/1 'DM Sans',system-ui,sans-serif;color:var(--muted)}
.door.on .lb{color:var(--ink)}
.door.on .ic{transform:translateY(-1px) scale(1.04)}
.door.on:after{content:'';position:absolute;left:16%;right:16%;bottom:-2.5px;height:4px;border-radius:3px;background:var(--acc)}
.subbar{text-align:center;font-size:.8rem;line-height:1.3;color:var(--muted);padding:.4rem 1.1rem .6rem;font-weight:600;margin:.15rem 0 0}
.stage{flex:1;padding:1.1rem 1.15rem 2.2rem;display:flex;flex-direction:column;min-height:calc(100vh - 140px)}
.k-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1rem}
.k-greet{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.3rem;padding:.2rem 0 .4rem}
.k-greet h2{font:800 1.3rem/1.15 'DM Sans',sans-serif;margin:0}
.k-greet .kr{color:var(--muted);font-weight:600;font-size:.88rem;line-height:1.3;max-width:28ch;margin:0}
.k-grid{display:grid;grid-template-columns:1fr 1fr;gap:.85rem;width:100%;max-width:340px;margin:0 auto}
.k-top{grid-column:1 / -1;max-width:55%;justify-self:center;width:100%}
.tile{height:118px;border:var(--ow) solid var(--ink);border-radius:20px;box-shadow:4px 5px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:.6rem;gap:.12rem;background:#fff}
.tile:active{transform:translate(2px,2px);box-shadow:2px 3px 0 var(--ink)}
.tile .em{font-size:1.85rem;line-height:1}
.tile .tt{font:800 .92rem/1.05 'DM Sans',sans-serif}
.tile .ss{font-size:.72rem;color:rgba(21,22,58,.7);line-height:1.15;font-weight:600}
.tile .pill{font:800 .56rem 'DM Sans',sans-serif;border:2px solid var(--ink);border-radius:999px;padding:.08rem .4rem;margin-top:.1rem}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:.6rem .95rem;font-size:.88rem;font-weight:600;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>

</head>
<body>
<div class="app">
  <div class="nav">
    <div class="doors" id="doors"></div>
    <p class="subbar" id="sub"></p>
  </div>
  <main class="stage" id="stage"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
function icoBook(){return '<svg viewBox="0 0 48 48" style="width:100%;height:100%"><g stroke="#20271f" stroke-width="2.6" stroke-linejoin="round"><path d="M24 14 C20 11 13 11 9 13 L9 36 C13 34 20 34 24 37 C28 34 35 34 39 36 L39 13 C35 11 28 11 24 14 Z" fill="#e9cf93"/><path d="M24 14 L24 37" fill="none"/></g></svg>';}
function icoCard(){return '<svg viewBox="0 0 48 48" style="width:100%;height:100%"><g stroke="#20271f" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"><rect x="9" y="14" width="30" height="21" rx="4" fill="#cdddb3"/><line x1="15" y1="23" x2="33" y2="23"/><line x1="15" y1="29" x2="27" y2="29"/></g></svg>';}
function icoCompass(){return '<svg viewBox="0 0 48 48" style="width:100%;height:100%"><circle cx="24" cy="24" r="15" fill="#fbf8f0" stroke="#20271f" stroke-width="2.6"/><path d="M24 12 L27 24 L21 24 Z" fill="#1f93b0" stroke="#20271f" stroke-width="1.6" stroke-linejoin="round"/><path d="M24 36 L27 24 L21 24 Z" fill="#cfe3d8" stroke="#20271f" stroke-width="1.6" stroke-linejoin="round"/><circle cx="24" cy="24" r="2.4" fill="#20271f"/></svg>';}

/* Ordnung v3 (Leo, 11.10. 01:27: „klar und ruhig, so nah am Original wie möglich").
   Abenteuer = sprechen (unverändert) · Bibliothek = lesen & schreiben + Regal · Übung = Wörter & Spiel.
   Führung: EIN Satz unter dem Gruß (wie bisher „Letztes Mal …"). Oído fino / El golpe
   kommen als Nachklang am Ende des Geführten Gesprächs — mit genau den Wörtern der Szene. */
var TUEREN=[
 {id:'abenteuer',lb:'Abenteuer',ic:icoCompass,sub:'Hören und sprechen — mit Spikiu, Schritt für Schritt.',
  greet:{t:'¡Hola, Leo! 👋',kr:'Fang mit dem Geführten Gespräch an — dort triffst du deine ersten Wörter.'},
  items:[
   {em:'🎭',tt:'Geführtes<br>Gespräch',ss:'Szenen üben',pill:'gratis',pillBg:'#9bd14a',bg:'#ffd24a'},
   {em:'💬',tt:'Freies<br>Gespräch',ss:'Frei reden',pill:'Premium',pillBg:'#ffd24a',bg:'#c7e89a'}
  ]},
 {id:'bibliothek',lb:'Bibliothek',ic:icoBook,sub:'Lesen und schreiben. Dein Regal wächst hier.',
  items:[
   {em:'🌱',tt:'Dein Regal',ss:'Dein Buch, deine Lektionen, dein Garten',bg:'#c7e89a',top:true},
   {em:'📖',tt:'Lernroman',ss:'Immersiv lesen',bg:'#d3eef6'},
   {em:'📜',tt:'Wendungen & Sprichwörter',ss:'Sprache & Kultur',bg:'#bfe6d5'},
   {em:'🔎',tt:'Lese&shy;werkstatt',ss:'Leseverstehen',pill:'Premium',pillBg:'#ffd24a',bg:'#f7bcd8'},
   {em:'✍️',tt:'Schreib&shy;werkstatt',ss:'Schreiben',pill:'Premium',pillBg:'#ffd24a',bg:'#cdbdf2'}
  ]},
 {id:'uebung',lb:'Übung',ic:icoCard,sub:'Ein paar Wörter, ganz in Ruhe.',
  items:[
   {em:'🃏',tt:'Wortschatz',ss:'Dein Deck',bg:'#ffd0b0'},
   {em:'🪅',tt:'Spiele',ss:'Kurz und leicht',bg:'#ffe08a'}
  ]}
];
var HINWEIS={
 'Geführtes<br>Gespräch':'Geführtes Gespräch — am Ende klingt die Szene nach: Oído fino oder El golpe, mit genau ihren Wörtern.',
 'Dein Regal':'Dein Regal — dein Buch, deine Lektionen, dein Garten, deine Akrosticha. Alles, was du gesammelt hast.',
 'Spiele':'Spiele — das Spielzimmer wie bisher, mit dem Spiel des Tages. Die Spiele nehmen deine Wörter.'
};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
var toastT;function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},m.length>60?3400:1700);}
function tile(it){var b=el('button','tile'+(it.top?' k-top':''));b.type='button';b.style.background=it.bg;
 b.innerHTML='<span class="em">'+it.em+'</span><span class="tt">'+it.tt+'</span>'+(it.ss?'<span class="ss">'+it.ss+'</span>':'')+(it.pill?'<span class="pill" style="background:'+it.pillBg+'">'+it.pill+'</span>':'');
 b.onclick=function(){toast(HINWEIS[it.tt]||('Im echten Spikiu öffnet sich hier: '+it.tt.replace(/<br>|&shy;/g,' ').replace(/\s+/g,' ')));};return b;}
function zeige(id){
 var T=TUEREN.filter(function(x){return x.id===id;})[0];
 document.querySelectorAll('.door').forEach(function(d){d.classList.toggle('on',d.dataset.id===id);});
 document.getElementById('sub').textContent=T.sub;
 var st=document.getElementById('stage');st.innerHTML='';
 var w=el('div','k-wrap');
 if(T.greet){var g=el('div','k-greet');g.appendChild(el('h2',null,T.greet.t));g.appendChild(el('p','kr',T.greet.kr));w.appendChild(g);}
 var grid=el('div','k-grid');T.items.forEach(function(it){grid.appendChild(tile(it));});
 w.appendChild(grid);st.appendChild(w);scrollTo(0,0);
}
var dw=document.getElementById('doors');
TUEREN.forEach(function(T){var b=el('button','door');b.type='button';b.dataset.id=T.id;b.innerHTML='<span class="ic">'+T.ic()+'</span><span class="lb"></span>';b.querySelector('.lb').textContent=T.lb;b.onclick=function(){zeige(T.id);};dw.appendChild(b);});
zeige('abenteuer');
</script>

</body>
</html>
