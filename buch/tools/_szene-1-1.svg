<svg viewBox="0 0 680 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Szene: Nachts im Wohnzimmer. Eine kleine Fledermaus kreist um die Lampe. Nico steht begeistert auf dem Sofa und zählt die Vokale, Oma Pilar steht mit dem Besen auf dem Stuhl. Lucía schaut ungerührt mit Tee aus der Tür.">
<defs>
 <filter id="hand" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency=".022" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3.2"/></filter>
 <style>
