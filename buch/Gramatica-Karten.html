l mapa, el sofá: ¡el día es un desastre!", "de": "Das Wasser, die Landkarte, das Sofa: Der Tag ist eine Katastrophe!", "icons": ["1F4A7", "1F6CB", "1F5FA"], "bubbles": ["¡Dani! ¡El agua!<br>¡El sofá!", "Tranquila.<br>Tengo el mapa."], "gloss": "<span class=\"es\">tranquila</span> ruhig, keine Panik", "say": [{"t": "El agua, el mapa, el sofá: ¡el día es un desastre!", "p": 700}]}, {"k": "dark", "html": "Jedes Nomen ist <span class=\"c1\">männlich (el)</span> oder <span class=\"c2\">weiblich (la)</span>. Die Endung ist ein Namensschild: <span class=\"es\">-o</span> heißt fast immer <span class=\"es\">el</span>, <span class=\"es\">-a</span> fast immer <span class=\"es\">la</span>. Ein paar Rebellen tragen das falsche Schild."}, {"k": "block", "cls": "t1", "title": "", "html": "<div class=\"cols n1\"><div class=\"col t1\"><div class=\"col-h\"><img class=\"\" src=\"icons/1F468.svg\" alt=\"\"><div><strong>Männlich</strong><small>el</small></div></div><div class=\"use\"><div class=\"t\">-o, -aje, -or, viele Konsonanten</div><div class=\"x\"><span class=\"es\">el libro, el viaje, el color, el móvil</span></div></div></div></div>", "say": [{"t": "el libro.", "p": 900}, {"t": "el viaje.", "p": 900}, {"t": "el color.", "p": 900}, {"t": "el móvil.", "p": 900}]}, {"k": "block", "cls": "t2", "title": "", "html": "<div class=\"cols n1\"><div class=\"col t2\"><div class=\"col-h\"><img class=\"\" src=\"icons/1F469.svg\" alt=\"\"><div><strong>Weiblich</strong><small>la</small></div></div><div class=\"use\"><div class=\"t\">-a, -ción, -sión, -dad, -tad</div><div class=\"x\"><span class=\"es\">la casa, la canción, la ciudad, la libertad</span></div></div></div></div>", "say": [{"t": "la casa.", "p": 900}, {"t": "la canción.", "p": 900}, {"t": "la ciudad.", "p": 900}, {"t": "la libertad.", "p": 900}]}, {"k": "block", "cls": "", "title": "Die Rebellen", "html": "<div class=\"tbwrap\"><table class=\"tb stapel\"><tr><th>Rebell</th><th>Was ist los?</th></tr><tr class=\"\"><td data-label=\"Rebell\" class=\"esc\">el día, el mapa, el problema</td><td data-label=\"Was ist los?\" class=\"\">-a, aber männlich – wie viele auf <b>-ma</b>: <span class=\"es\">el idioma, el tema</span></td></tr><tr class=\"\"><td data-label=\"Rebell\" class=\"esc\">la mano, la foto, la moto</td><td data-label=\"Was ist los?\" class=\"\">-o, aber weiblich (<span class=\"es\">foto</span> = <span class=\"es\">la fotografía</span>)</td></tr><tr class=\"\"><td data-label=\"Rebell\" class=\"esc\">el agua</td><td data-label=\"Was ist los?\" class=\"\">weiblich! Vor betontem a- steht aber <span class=\"es\">el</span>: <span class=\"es\">el agua fría</span></td></tr></table></div><p>Bei Menschen zählt das echte Geschlecht: <span class=\"es\">el camarero – la camarera</span>. Bei <span class=\"es\">-e</span> und <span class=\"es\">-ista</span> wechselt nur der Artikel: <span class=\"es\">el/la estudiante, el/la turista</span>.</p>", "say": [{"t": "el día.", "p": 900}, {"t": "el mapa.", "p": 900}, {"t": "el problema.", "p": 900}, {"t": "el idioma.", "p": 900}, {"t": "el tema.", "p": 900}, {"t": "la mano.", "p": 900}, {"t": "la foto.", "p": 900}, {"t": "la moto.", "p": 900}, {"t": "foto.", "p": 900}, {"t": "la fotografía.", "p": 900}, {"t": "el agua.", "p": 900}, {"t": "el.", "p": 900}, {"t": "el agua fría.", "p": 900}]}, {"k": "block", "cls": "kojo", "title": "", "html": "<div class=\"box ojo\"><span class=\"tag\">Ojo · Achtung</span>Deutsch hilft nicht: <em>das</em> Haus – <span class=\"es\">la casa</span>, <em>der</em> Tisch – <span class=\"es\">la mesa</span>. Lern jedes Wort mit Artikel.</div>", "say": []}], "ex": [{"k": "sort", "title": "Nico räumt auf. Wohin gehört jedes Wort: el oder la?", "words": ["viaje", "verdad", "día", "mano", "cerveza", "mapa", "foto", "problema"], "baskets": [{"l": "el", "a": ["viaje", "día", "mapa", "problema"]}, {"l": "la", "a": ["verdad", "mano", "foto", "cerveza"]}], "why": "Die Rebellen: <span class=\"es\">el día, el mapa, el problema</span> sind männli s": "", "title": "", "html": "<div class=\"tbwrap\"><table class=\"conj\"><tr><th></th><th>querer<small>wollen; lieben</small></th><th>poder<small>können</small></th><th>pedir<small>bestellen, bitten</small></th></tr><tr><td class=\"p\">yo</td><td class=\"f\">qu<span class='c1'>ie</span>r<b>o</b></td><td class=\"f\">p<span class='c1'>ue</span>d<b>o</b></td><td class=\"f\">p<span class='c1'>i</span>d<b>o</b></td></tr><tr><td class=\"p\">tú</td><td class=\"f\">qu<span class='c1'>ie</span>r<b>es</b></td><td class=\"f\">p<span class='c1'>ue</span>d<b>es</b></td><td class=\"f\">p<span class='c1'>i</span>d<b>es</b></td></tr><tr><td class=\"p\">él, ella, usted</td><td class=\"f\">qu<span class='c1'>ie</span>r<b>e</b></td><td class=\"f\">p<span class='c1'>ue</span>d<b>e</b></td><td class=\"f\">p<span class='c1'>i</span>d<b>e</b></td></tr><tr><td class=\"p\">nosotros, -as</td><td class=\"f\">quer<b>emos</b></td><td class=\"f\">pod<b>emos</b></td><td class=\"f\">ped<b>imos</b></td></tr><tr><td class=\"p\">vosotros, -as</td><td class=\"f\">quer<b>éis</b></td><td class=\"f\">pod<b>éis</b></td><td class=\"f\">ped<b>ís</b></td></tr><tr><td class=\"p\">ellos, ellas, ustedes</td><td class=\"f\">qu<span class='c1'>ie</span>r<b>en</b></td><td class=\"f\">p<span class='c1'>ue</span>d<b>en</b></td><td class=\"f\">p<span class='c1'>i</span>d<b>en</b></td></tr></table></div>", "say": [{"t": "quiero.", "p": 900}, {"t": "quieres.", "p": 900}, {"t": "quiere.", "p": 900}, {"t": "queremos.", "p": 900}, {"t": "queréis.", "p": 900}, {"t": "quieren.", "p": 900}, {"t": "puedo.", "p": 900}, {"t": "puedes.", "p": 900}, {"t": "puede.", "p": 900}, {"t": "podemos.", "p": 900}, {"t": "podéis.", "p": 900}, {"t": "pueden.", "p": 900}, {"t": "pido.", "p": 900}, {"t": "pides.", "p": 900}, {"t": "pide.", "p": 900}, {"t": "pedimos.", "p": 900}, {"t": "pedís.", "p": 900}, {"t": "piden.", "p": 900}]}, {"k": "block", "cls": "", "title": "", "html": "<div class=\"trick\"><img class=\"\" src=\"icons/1F462.svg\" alt=\"\"><p>Umrande die veränderten Formen: Sie bilden einen <em>Stiefel</em>. <span class=\"es\">yo, tú, él, ellos</span> stecken drin, <span class=\"es\">nosotros</span> und <span class=\"es\">vosotros</span> stehen draußen.</p></div>", "say": []}, {"k": "block", "cls": "", "title": "", "html": "<table class=\"signal\"><tr><td class=\"t1\">e → ie</td><td><span class=\"es\">querer, pensar, empezar, cerrar, entender, preferir</span></td></tr><tr><td class=\"t2\">o → ue</td><td><span class=\"es\">poder, dormir, volver, costar, encontrar · jugar → juego</span></td></tr><tr><td class=\"t0\">e → i</td><td><span class=\"es\">pedir, repetir, servir, seguir</span></td></tr></table>", "say": []}, {"k": "block", "cls": "", "title": "Sätze, die du jeden Tag brauchst", "html": "<div class=\"examples\"><span class=\"es\">¿Puedes repetir, por favor?</span><span class=\"de\">Kannst du das bitte wiederholen?</span><span class=\"es\">No entiendo.</span><span class=\"de\">Ich verstehe nicht.</span><span class=\"es\">¿Cuánto cuesta?</span><span class=\"de\">Wie viel kostet das?</span><span class=\"es\">Quiero un café con leche, por favor.</span><span class=\"de\">Ich hätte gern einen Milchkaffee.</span><span class=\"es\">La película empieza a las nueve. ¿Y Dani?</span><span class=\"de\">Der Film fängt um neun an. Und Dani?</span></div>", "say": [{"t": "¿Puedes repetir, por favor?", "p": 700}, {"t": "No entiendo.", "p": 700}, {"t": "¿Cuánto cuesta?", "p": 700}, {"t": "Quiero un café con leche, por favor.", "p": 700}, {"t": "La película empieza a las nueve.", "p": 700}, {"t": "¿Y Dani?", "p": 700}]}, {"k": "block", "cls": "", "title": "", "html": "<h2>Die Nacht vor dem großen Termin</h2><div class=\"story\"><div class=\"es-t\">Son las dos de la mañana. <span class=\"c1\">Quiero</span> dormir, pero no <span class=\"c1\">puedo</span>. Todo el barrio <span class=\"c1\">duerme</span>. Yo no. <span class=\"c1\">Pienso</span> en el trabajo, en Rafa, en la factura de la luz. <span class=\"c1\">Cierro</span> los ojos y <span class=\"c1\">cuento</span> ovejas. A las tres <span class=\"c1\">empiezo</span> a contar dinosaurios, como Nico. A las cuatro <span class=\"c1\">vuelvo</span> a mirar el móvil. A las siete <span class=\"c1\">suena</span> el despertador. ¿Y ahora? Ahora sí <span class=\"c1\">puedo</span> dormir.</div><div class=\"de\">Es ist zwei Uhr morgens. Ich will schlafen, aber ich kann nicht. Das ganze Viertel schläft. Ich nicht. Ich denke an die Arbeit, an Rafa, an die Stromrechnung. Ich schließe die Augen und zähle Schafe. Um drei fange ich an, Dinosaurier zu zählen, wie Nico. Um vier schaue ich wieder aufs Handy. Um sieben klingelt der Wecker. Und jetzt? Jetzt kann ich schlafen.</div></div><p class=\"story-note\">Alle markierten Formen stehen bei <span class=\"es\">yo</span> oder <span class=\"es\">él</span> – also im Stiefel. Darum dehnt sich überall der Vokal.</p>", "say": [{"t": "Son las dos de la mañana.", "p": 700}, {"t": "Quiero dormir, pero no puedo.", "p": 700}, {"t": "Todo el barrio duerme.", "p": 700}, {"t": "Yo no.", "p": 700}, {"t": "Pienso en el trabajo, en Rafa, en la factura de la luz.", "p": 700}, {"t": "Cierro los ojos y cuento ovejas.", "p": 700}, {"t": "A las tres empiezo a contar dinosaurios, como Nico.", "p": 700}, {"t": "A las cuatro vuelvo a mirar el móvil.", "p": 700}, {"t": "A las siete suena el despertador.", "p": 700}, {"t": "¿Y ahora?", "p": 700}, {"t": "Ahora sí puedo dormir.", "p": 700}]}, {"k": "block", "cls": "kojo", "title": "", "html": "<div class=\"box ojo\"><span class=\"tag\">Ojo · Achtung</span>Man sieht es dem Verb nicht an. Gute Wörterbücher schreiben es dazu: <span class=\"es\">pensar (ie)</span>, <span class=\"es\">dormir (ue)</span>, <span class=\"es\">pedir (i)</span> – lern es gleich mit. Und der Infinitiv bleibt immer gleich: <span class=\"es\">repetir</span>, nie <span class=\"es\">repitir</span>.</div>", "say": []}, {"k": "block", "cls": "", "title": "", "html": "<div class=\"box novela\"><span c n café.", "a": "¿Qué necesitas?"}, {"q": "Llamo a mi jefe. Por desgracia.", "a": "¿A quién llamas?"}], "why": ""}, {"k": "free", "title": "Wen liebst du, was willst du? Zwei Sätze mit quiero a …, zwei mit quiero …", "html": "", "sol": "Zum Beispiel: Quiero a mi hermana. Quiero mucho a mi gato. Quiero un trabajo nuevo. Quiero una casa con jardín."}]}, {"id": "9.1", "topic": "lo, la, le", "chap": "9 Objektpronomen", "baum": "🌿 Stamm", "cards": [{"k": "hook", "es": "¿Mi móvil? Lo tiene Nico. Y le doy un dinosaurio a cambio.", "de": "Mein Handy? Das hat Nico. Und ich gebe ihm dafür einen Dinosaurier.", "icons": ["1F4F1", "1F466", "1F996"], "bubbles": ["¿Mi móvil?<br>¿Quién lo tiene?", "Yo no lo tengo.<br>Lo tiene el T-Rex."], "gloss": "", "say": [{"t": "¿Mi móvil?", "p": 700}, {"t": "Lo tiene Nico.", "p": 700}, {"t": "Y le doy un dinosaurio a cambio.", "p": 700}]}, {"k": "dark", "html": "Pronomen sind Stellvertreter, damit du nichts zweimal sagen musst. <span class=\"c1\">lo, la</span> stehen für das <em>Paket</em>: wen oder was? <span class=\"c2\">le</span> steht für den <em>Empfänger</em>: wem?"}, {"k": "block", "cls": "t1", "title": "", "html": "<div class=\"cols n1\"><div class=\"col t1\"><div class=\"col-h\"><img class=\"\" src=\"icons/1F4E6.svg\" alt=\"\"><div><strong>Das Paket</strong><small>lo · la · los · las</small></div></div><div class=\"use\"><div class=\"t\">Wen? Was?</div><div class=\"x\"><span class=\"es\">¿El móvil? Lo tiene Nico.</span> <span class=\"de\">Das Handy? Das hat Nico.</span><br><span class=\"es\">¿La paella? La hace mi madre.</span> <span class=\"de\">Die Paella? Die macht meine Mutter.</span></div></div><div class=\"use\"><div class=\"t\">Männlich oder weiblich – wie das Wort</div><div class=\"x\"><span class=\"es\">¿Los billetes? Los tengo yo.</span><br><span class=\"es\">¿Las gafas? No las encuentro.</span> <span class=\"de\">Die Brille? Ich finde sie nicht.</span></div></div><div class=\"use\"><div class=\"t\">Auch für Personen</div><div class=\"x\"><span class=\"es\">¿Dani? Lo veo mañana.</span> <span class=\"de\">Dani? Den sehe ich morgen.</span><br><span class=\"es\">Señora, la llamo luego.</span> <span class=\"de\">Ich rufe Sie später an.</span></div></div></div></div>", "say": [{"t": "¿El móvil?", "p": 700}, {"t": "Lo tiene Nico.", "p": 700}, {"t": "¿La paella?", "p": 700}, {"t": "La hace mi madre.", "p": 700}, {"t": "¿Los billetes?", "p": 700}, {"t": "Los tengo yo.", "p": 700}, {"t": "¿Las gafas?", "p": 700}, {"t": "No las encuentro.", "p": 700}, {"t": "¿Dani?", "p": 700}, {"t": "Lo veo mañana.", "p": 700}, {"t": "Señora, la llamo luego.", "p": 700}]}, {"k": "block", "cls": "t2", "title": "", "html": "<div class=\"cols n1\"><div class=\"col t2\"><div class=\"col-h\"><img class=\"\" src=\"icons/1F932.svg\" alt=\"\"><div><strong>Der Empfänger</strong><small>le · les</small></div></div><div class=\"use\"><div class=\"t\">Wem?</div><div class=\"x\"><span class=\"es\">Le doy un dinosaurio.</span> <span class=\"de\">Ich gebe ihm einen Dinosaurier.</span><br><span class=\"es\">Les escribo un mensaje.</span> <span class=\"de\">Ich schreibe ihnen eine Nachricht.</span></div></div><div class=\"use\"><div class=\"t\">Ein Wort für alle</div><div class=\"x\"><span class=\"es\">le</span> = ihm, ihr, Ihnen<br><span class=\"es\">les</span> = ihnen, Ihnen (mehrere)</div></div><div class=\"use\"><div class=\"t\">Typische Verben</div><div class=\"x\"><span class=\"es\">dar, decir, escribir, mandar, regalar, preguntar</span> – man gibt, sagt, schickt <em>jemandem</em> etwas.</div></div></div></div>", "say": [{"t": "Le doy un dinosaurio.", "p": 700}, {"t": "Les escribo un mensaje.", "p": 700}, {"t": "le.", "p": 900}, {"t": "les.", "p": 900}, {"t": "dar.", "p": 900}, {"t": "decir.", "p": 900}, {"t": "escribir.", "p": 900}, {"t": "mandar.", "p": 900}, {"t": "regalar.", "p": 900}, {"t": "preguntar.", "p": 900}]}, {"k": "block", "cls": "", "title": "Alle auf einen Blick", "html": "<div class=\"tbwrap\"><table class=\"tb stapel\"><tr><th></th><th>ich</th><th>du</th><th>er, sie, Sie</th><th>wir</th><th>ihr</th><th>sie, Sie</th></tr><tr class=\"\"><td data-label=\"\" class=\"\">wen? was?</td><td data-label=\"ich\" class=\"esc\">me</td><td data-label=\"du\" class=\"esc\">te</td><td data-label=\"er, sie, Sie\" class=\"esc\">lo / la</td><td data-label=\"wir\" class=\"esc\">nos</td><td data-label=\"ihr\" class=\"esc\">os</td><td data-label=\"sie, Sie\" class=\"esc\">los / las</td></tr><tr class=\"\"><td data-label=\"\" class=\"\">wem?</td><td data-label=\"ich\" class=\"esc\">me</td><td data-label=\"du\" class=\"esc\">te</td><td data-label=\"er, sie, Sie\" class=\"esc\">le</td><td data-label=\"wir\" class=\"esc\">nos</td><td data-label=\"ihr\" class=\"esc\">os</td><td data-label=\"sie, Sie\" class=\"esc\">les</td></tr></table></div><p>Nur bei <em>er, sie, Sie</em> musst du entscheiden. <span class=\"es\">me, te, nos, os</span> passen immer: <span class=\"es\">Te veo.</span> <span class=\"de\">Ich sehe dich.</span> <span class=\"es\">Te doy un beso.</span> <span class=\"de\">Ich gebe dir einen Kuss.</span> Das Pronomen steht <em>vor</em> dem Verb: <span class=\"es\">Lo tiene Nico. No la encuentro.</span> Mehr zur Stellung in <g>9.3</g>.</p>", "say": []}, {"k": "block", "cls": "", "title": "Der Empfänger kommt doppelt", "html": "<div class=\"examples\"><span class=\"es\">A mi madre le compro flores.</span><span class=\"de\">Meiner Mutter kaufe ich Blumen.</span><span class=\"es\">Le digo la verdad a Dani.</span><span class=\"de\">Ich sage Dani die Wahrheit.</span><span class=\"es\">¿Le pregunto al camarero?</span><span class=\"de\">Soll ich den Kellner fragen?</span></div><p>Klingt doppelt gemoppelt, ist aber ganz normal: Steht der Empfänger mit <span class=\"es\">a</span> im Satz, kommt <span class=\"es\">le</span> trotzdem dazu.</p>", "say": [{"t": "A mi madre le compro flores.", "p": 700}, {"t": "Le digo la verdad a Dani.", "p": 700}, {"t": "¿Le pregunto al camarero?", "p": 700}]}, {"k": "block", "cls": "kojo", "title": "", "html": "<div class=\"box ojo\"><span class=\"tag\">Ojo · Achtung</span>Deutsch und Spanisch zählen nicht immer gleich. <span class=\"es\">ayudar</span> (helfen) und <span class=\"es\">llamar</span> (anrufen) wollen ein <span class=\"c1\">Paket</span>: <span class=\"es\"><span class=\"c1\">La</span> ayudo.</span> Ich helfe <em>ihr</em>. Dafür hat <span class=\"es\">preguntar</span> einen <span class=\"c2\">Empfänger</span>: <span class=\"es\"><span class=\"c2\">Le</span> pregunto.</span> Ich frage <em>ihn</em>.</div>", "say": []}, {"k": "block", "cls": "", "title": "", "html": "<div class=\"trick\"><img class=\"\" src=\"icons/1F4A1.svg\" alt=\"\"><p><span class=\"es\">lo</span> kann auch einen ganzen Gedanken vertreten: <span class=\"es\">No lo sé.</span> <span class=\"de\">Ich weiß es nicht.</span> <span class=\"es\">Ya lo veo.</span> <span class=\"de\">Seh ich schon.</span> <span class=\"es\">¡Lo siento!</span> <span class=\"de\">Tut mir leid!</span></p></div>", "say": []}, {"k": "block", "cls": "kreg", "title": "", "html": "<div class=\"box region\"><span class=\"tag\">Así se dice en … · So klingt es woanders</span>In Madrid und weiten Teilen Spaniens hörst du bei Männern oft <span class=\"es\">le</span> statt <span class=\"es\">lo</span>: <span class=\"es\">A Dani le veo mañana.</span> Dieser Leísmo gilt dort als korrekt – aber nur für männliche Personen, nie für Dinge oder Frauen. Mit <span class=\"es\">lo</span> und <span class=\"es\">la</span> liegst du überall richtig.</div>", "say": []}], "ex": [{"k": "mark", "title": "Besuch bei Pilar. Hör zu und schreib P (Paket: lo, la, los, las) oder E (Empfänger: le, les).", "toks": [{"s": "Es el cumpleaños de mi madre. ¿El regalo? "}, {"w": "Lo", "a": "P"}, {"s": " tengo en la maleta: es un libro. Ya tiene cien, pero "}, {"w": "le", "a": "E"}, {"s": " encantan los libros. ¿Las flores? "}, {"w": "Las", "a": "P"}, {"s": " compro en la estación. ¿Y a mi padre? "}, {"w": "Le", "a": "E"}, {"s": " llevo un vino. ¿Y Dani? "}, {"w": "Lo", "a": "P"}, {"s": " espero en el andén. Llega tarde, claro. "}, {"w": "Le", "a": "E"}, {"s": " mando un mensaje: «¿Dónde estás?». Suena el móvil. Es mi madre. No "}, {"w": "lo", "a": "P"}, {"s": " cojo."}], "labs": ["P", "E"], "why": "<span class=\"es\">le encantan</span>: Die Mutter ist der Empfänger, wie bei <span class=\"es\">gustar</span> (<g>5.5</g>). Das letzte <span class=\"es\">lo</span> ist das Handy.", "say": [{"t": "Es el cumpleaños de mi madre.", "p": 700}, {"t": "¿El regalo?", "p": 700}, {"t": "Lo tengo en la maleta: es un libro.", "p": 700}, {"t": "Ya tiene cien, pero le encantan los libros.", "p": 700}, {"t": "¿Las flores?", "p": 700}, {"t": "Las compro en la estación.", "p": 700}, {"t": "¿Y a mi padre?", "p": 700}, {"t": "Le llevo un vino.", "p": 700}, {"t": "¿Y Dani?", "p": 700}, {"t": "Lo espero en el andén.", "p": 700}, {"t": "Llega tarde, claro.", "p": 700}, {"t": "Le mando un mensaje: ¿Dónde estás?.", "p": 700}, {"t": "Suena el móvil.", "p": 700}, {"t": "Es mi madre.", "p": 700}, {"t": "No lo cojo.", "p": 700}]}, {"k": "choice", "title": "lo, la, los oder las? Unterstreiche.", "parts": [{"s": "¿El billete? "}, {"o": ["Lo", "La", "Los"], "r": 0}, {"s": " tengo en el móvil."}], "why": ""}, {"k": "choice", "title": "lo, la, los oder las? Unterstreiche.", "parts": [{"s": "¿Las llaves? Nico "}, {"o": ["los", "las", "la"], "r": 1}, {"s": " esconde en el congelador."}], "why": ""}, {"k": "choice", "title": "lo, la, los oder las? Unterstreiche.", "parts": [{"s": "¿La tortilla de mi madre? "}, {"o": ["La", "Lo"], "r": 0}, {"s": " como fría, del frigorífico."}], "why": ""}, {"k": "choice", "title": "lo, la, los oder las? Unterstreiche.", "parts": [{"s": "¿Los platos? "}, {"o": ["Las", "Los"], "r": 1}, {"s": " lavo mañana. O pasado mañana."}], "why": ""}, {"k": "choice", "title": "Paket oder Empfänger? Vorsicht, hier führt dich das Deutsche in die Irre.", "parts": [{"s": "¿Pilar? "}, {"o": ["La", "Le"], "r": 0}, {"s": " ayudo con el ordenador."}], "why": ""}, {"k": "choice", "title": "Paket oder Empfänger? Vorsicht, hier führt dich das Deutsche in die Irre.", "parts": [{"s": "¿Dani? "}, {"o": ["Lo", "Le"], "r": 0}, {"s": " llamo esta noche."}], "why": ""}, {"k": "choice", "title": "Paket oder Empfänger? Vorsicht, hier führt dich das Deutsche in die Irre.", "parts": [{"s": "¿Rafa? "}, {"o": ["Lo", "Le"], "r": 1}, {"s": " pregunto mañana."}], "why": ""}, {"k": "choice", "title": "Paket oder Empfänger? Vorsicht, hier führt dich das Deutsche in die Irre.", "parts": [{"s": "¿Marta? "}, {"o": ["La", "Le"], "r": 1}, {"s": " escribo un correo."}], "why": ""}, {"k": "choice", "title": "Paket oder Empfänger? Vorsicht, hier führt dich das Deutsche in die Irre.", "parts": [{"s": "¿Mis padres? "}, {"o": ["Los", "Les"], "r": 1}, {"s": " regalo un viaje a Roma."}], "why": "a: <span class=\"es\">ayudar</span> will ein Paket, obwohl wir „ihr helfen“ sagen. b: In Spanien hörst du auch <span class=\"es\">le llamo</span> (Leísmo). c: Die Frage ist das Paket, Rafa der Empfänger: <span class=\"es\">preguntar algo a alguien</span>."}, {"k": "transform", "title": "Weniger ist mehr. Ersetz die markierten Wörter durch ein Pronomen.", "ex": {"q": "Compro <b>el pan</b>.", "a": "Lo compro."}, "items": [{"q": "Dani pierde <b>las llaves</b> cada semana.", "a": "Dani las pierde cada semana."}, {"q": "Nico come <b>los macarrones</b> con las manos.", "a": "Nico los come con las manos."}, {"q": "Escribo un mensaje <b>a Dani</b>.", "a": "Le escribo un mensaje."}, {"q": "Mi madre llama <b>a mi hermana</b> cada hora.", "a": "Mi madre la llama cada hora."}], "why": ""}, {"k": "dialog", "title": "Pilar ruft an. Natürlich mitten in einer Besprechung. Setz die Pronomen ein.", "lines": [{"who": "Pilar", "parts": [{"s": "Hija, ¿tienes la receta de la tarta de queso?"}]}, {"who": "Lucía", "parts": [{"s": "Sí, mamá, "}, {"a": "la", "h": ""}, {"s": " tengo en el ordenador."}]}, {"who": "Pilar", "parts": [{"s" "dialog", "title": "Nico will alles wissen. Ergänze.", "lines": [{"who": "Nico", "parts": [{"s": "Abuela, cuando tú "}, {"a": "eras", "h": "ser"}, {"s": " pequeña, ¿"}, {"a": "había", "h": "haber"}, {"s": " dinosaurios?"}]}, {"who": "Pilar", "parts": [{"s": "¡No, cariño! Pero "}, {"a": "teníamos", "h": "tener"}, {"s": " una tele en blanco y negro."}]}, {"who": "Nico", "parts": [{"s": "¿Y qué "}, {"a": "veíais", "h": "ver"}, {"s": "?"}]}, {"who": "Pilar", "parts": [{"s": "Dibujos. Y los sábados mi padre nos "}, {"a": "llevaba", "h": "llevar"}, {"s": " al parque."}]}, {"who": "Nico", "parts": [{"s": "¿Al parque de los dinosaurios?"}]}, {"who": "Pilar", "parts": [{"s": "No. Allí solo "}, {"a": "había", "h": "haber"}, {"s": " palomas."}]}], "why": "", "say": [{"t": "Abuela, cuando tú eras pequeña, ¿había dinosaurios?", "p": 700}, {"t": "¡No, cariño!", "p": 700}, {"t": "Pero teníamos una tele en blanco y negro.", "p": 700}, {"t": "¿Y qué veíais?", "p": 700}, {"t": "Dibujos.", "p": 700}, {"t": "Y los sábados mi padre nos llevaba al parque.", "p": 700}, {"t": "¿Al parque de los dinosaurios?", "p": 700}, {"t": "No.", "p": 700}, {"t": "Allí solo había palomas.", "p": 700}]}, {"k": "translate", "title": "Wie sagst du das auf Spanisch?", "de": "Früher habe ich in einer WG gewohnt.", "es": "Antes vivía en un piso compartido."}, {"k": "translate", "title": "Wie sagst du das auf Spanisch?", "de": "Es gab nur ein Bad für sechs Personen.", "es": "Solo había un baño para seis personas."}]}, {"id": "11.5", "topic": "Indefinido oder Imperfecto?", "chap": "11 Vergangenheit I", "baum": "🌿 Stamm", "cards": [{"k": "hook", "es": "Me duchaba tan tranquila cuando sonó el móvil.", "de": "Ich stand gerade ganz entspannt unter der Dusche, als das Handy klingelte.", "icons": ["1F6BF", "1F4A7", "1F4F1"], "bubbles": ["Me duchaba.<br>Hasta que llamaste tú.", "¡Hola, cariño!<br>¿Qué hacías?"], "gloss": "<span class=\"es\">cariño</span> Schatz", "say": [{"t": "Me duchaba tan tranquila cuando sonó el móvil.", "p": 700}]}, {"k": "dark", "html": "Erzählen ist Theater. Das <span class=\"c1\">Imperfecto</span> baut die Bühne: wie es war und was gerade lief. Das <span class=\"c2\">Indefinido</span> ist die Handlung: was passierte und die Geschichte weiterbringt."}, {"k": "block", "cls": "t1", "title": "", "html": "<div class=\"cols n1\"><div class=\"col t1\"><div class=\"col-h\"><img class=\"\" src=\"icons/1F3AD.svg\" alt=\"\"><div><strong>Die Bühne</strong><small>Imperfecto</small></div></div><div class=\"use\"><div class=\"t\">Wie es war</div><div class=\"x\">Zeit, Wetter, Ort, Aussehen, Alter, Gefühle<br><span class=\"es\">Eran las siete y llovía.</span><br><span class=\"es\">Estaba nerviosa. Tenía veinte años.</span></div></div><div class=\"use\"><div class=\"t\">Was gerade lief</div><div class=\"x\"><span class=\"es\">Me duchaba…</span> <span class=\"de\">Ich duschte gerade …</span><br><span class=\"es\">Los niños dormían.</span> <span class=\"de\">Die Kinder schliefen.</span></div></div><div class=\"use\"><div class=\"t\">Was immer so war</div><div class=\"x\"><span class=\"es\">De pequeña, pasaba los veranos en el pueblo.</span><br><span class=\"de\">Als Kind war ich jeden Sommer im Dorf.</span></div></div></div></div>", "say": [{"t": "Eran las siete y llovía.", "p": 700}, {"t": "Estaba nerviosa.", "p": 700}, {"t": "Tenía veinte años.", "p": 700}, {"t": "Me duchaba.", "p": 700}, {"t": "Los niños dormían.", "p": 700}, {"t": "De pequeña, pasaba los veranos en el pueblo.", "p": 700}]}, {"k": "block", "cls": "t2", "title": "", "html": "<div class=\"cols n1\"><div class=\"col t2\"><div class=\"col-h\"><img class=\"\" src=\"icons/1F6AA.svg\" alt=\"\"><div><strong>Die Handlung</strong><small>Indefinido</small></div></div><div class=\"use\"><div class=\"t\">Was passierte</div><div class=\"x\"><span class=\"es\">…cuando sonó el móvil.</span> <span class=\"de\">… als das Handy klingelte.</span><br><span class=\"es\">Ayer perdí las llaves.</span> <span class=\"de\">Gestern habe ich die Schlüssel verloren.</span></div></div><div class=\"use\"><div class=\"t\">Eins nach dem anderen</div><div class=\"x\"><span class=\"es\">Abrí la puerta, vi el desastre y llamé a mi madre.</span><br><span class=\"de\">Ich öffnete die Tür, sah das Chaos und rief meine Mutter an.</span></div></div><div class=\"use\"><div class=\"t\">Was ein klares Ende hat</div><div class=\"x\"><span class=\"es\">Viví tres años en Sevilla.</span><br><span class=\"es\">La reunión duró cuatro horas.</span> <span class=\"de\">Leider.</span></div></div></div></div>", "say": [{"t": "cuando sonó el móvil.", "p": 700}, {"t": "Ayer perdí las llaves.", "p": 700}, {"t": "Abrí la puerta, vi el desastre y llamé a mi madre.", "p": 700}, {"t": "Viví tres años en Sevilla.", "p": 700}, {"t": "La reunión duró cuatro horas.", "p": 700}]}, {"k": "block", "cls": "", "title": "Kleine Wegweiser", "html": "<table class=\"signal\"><tr><td class=\"t1\">Imperfecto</td><td><span class=\"es\">siempre, todos los días, antes, de pequeño, normalmente, mientras</span></td></tr><tr><td class=\"t2\">Indefinido</td><td><span class=\"es\">ayer, anoche, el lunes, en 2019, una vez, de repente, entonces</span></td></tr></table>", "say": []}, {"k": "block", "cls": "", "title": "Die Frage, die fast immer hilft", "html": "<div class=\"question n2\"><div class=\"t1\"><div class=\"q\">Wie war es?</div><small>Beschreibung, Hintergrund, Gewohnheit</small><div class=tag>→ IMPERFECTO</div></div><div class=\"t2\"><div class=\"q\">Und dann?</div><small>Ereignis, nächster Schritt</small><div class=tag>→ INDEFINIDO</div></div></div>", "say": []}, {"k": "block", "cls": "", "title": "", "html": "<h2>Beides zusammen: so klingt eine Geschichte</h2><div class=\"story\"><div class=\"es-t\"><span class=\"c1\">Era</span> lunes y <span class=\"c1\">llovía</span>. Yo <span class=\"c1\">estaba</span> nerviosa: <span class=\"c1\">era</span> mi primer día en la oficina. En el metro, la gente <span class=\"c1\">leía</span> o <span class=\"c1\">dormía</span>. <span class=\"c2\">Llegué</span> a las nueve en punto, <span class=\"c2\">abrí</span> la puerta… y <span class=\"c2\">vi</span> a mi exnovio. <span class=\"c1\">Era</span> mi nuevo jefe.</div><div class=\"de\">Es war Montag und es regnete. Ich war nervös: Es war mein erster Tag im Büro. In der U-Bahn lasen oder schliefen die Leute. Ich kam pünktlich um neun an, öffnete die Tür … und sah meinen Ex. Er war mein neuer Chef.</div></div><p class=\"story-note\">Die <span class=\"c1\">Bühne</span> steht, bis jemand die Tür öffnet. Dann übernimmt die <span class=\"c2\">Handlung</span>. Und der letzte Satz? Er ist die Pointe, aber trotzdem Bühne: Er beschreibt, wer der Mann <em>war</em>.</p>", "say": [{"t": "Era lunes y llovía.", "p": 700}, {"t": "Yo estaba nerviosa: era mi primer día en la oficina.", "p": 700}, {"t": "En el metro, la gente leía o dormía.", "p": 700}, {"t": "Llegué a las nueve en punto, abrí la puerta.", "p": 700}, {"t": "y vi a mi exnovio.", "p": 700}, {"t": "Era mi nuevo jefe.", "p": 700}]}, {"k": "block", "cls": "kojo", "title": "", "html": "<div class=\"box ojo\"><span class=\"tag\">Ojo · Achtung</span>Die Wegweiser helfen, entscheiden tut die Bedeutung. <span class=\"es\">Ayer <span class=\"c1\">llovía</span> cuando <span class=\"c2\">salí</span> de casa.</span> – <em>Ayer</em> steht da, und trotzdem ist der Regen Bühne. Und lange Dauer heißt nicht automatisch Imperfecto: <span class=\"es\">Viví tres años en Sevilla</span> ist abgeschlossen, also Handlung.</div>", "say": []}, {"k": "block", "cls": "kspk", "title": "", "html": "<div class=\"spk\"><svg viewBox=\"0 0 80 80\" class=\"\"><ellipse cx=\"40\" cy=\"50\" rx=\"28\" ry=\"20\" fill=\"#c9956a\"/><ellipse cx=\"40\" cy=\"28\" rx=\"18\" ry=\"15\" fill=\"#c9956a\"/><ellipse cx=\"40\" cy=\"36\" rx=\"10\" ry=\"7\" fill=\"#b8845a\"/><ellipse cx=\"40\" cy=\"33\" rx=\"4\" ry=\"2.5\" fill=\"#8b5e3c\"/><circle cx=\"38\" cy=\"33\" r=\"1\" fill=\"#6b4226\"/><circle cx=\"42\" cy=\"33\" r=\"1\" fill=\"#6b4226\"/><circle cx=\"33\" cy=\"24\" r=\"3.5\" fill=\"#3d2b1f\"/><circle cx=\"47\" cy=\"24\" r=\"3.5\" fill=\"#3d2b1f\"/><circle cx=\"34\" cy=\"23\" r=\"1.2\" fill=\"white\"/><circle cx=\"48\" cy=\"23\" r=\"1.2\" fill=\"white\"/><ellipse cx=\"26\" cy=\"17\" rx=\"6\" ry=\"5\" fill=\"#b8845a\"/><ellipse cx=\"54\" cy=\"17\" rx=\"6\" ry=\"5\" fill=\"#b8845a\"/><ellipse cx=\"22\" cy=\"66\" rx=\"7\" ry=\"5\" fill=\"#b8845a\"/><ellipse cx=\"34\" cy=\"68\" rx=\"7\" ry=\"5\" fill=\"#b8845a\"/><ellipse cx=\"46\" cy=\"68\" rx=\"7\" ry=\"5\" fill=\"#b8845a\"/><ellipse cx=\"58\" cy=\"66\" rx=\"7\" ry=\"5\" fill=\"#b8845a\"/><path d=\"M36 38 Q40 41 44 38\" stroke=\"#8b5e3c\" stroke-width=\"1.5\" stroke-linecap=\"round\" fill=\"none\"/></svg><div><span class=\"tag\">Spikius Kniff · Vier Verben wechseln die Bedeutung</span>Im Indefinido erzählen diese Verben den Moment, in dem etwas <em>anfing</em> oder <em>geschah</em>: <span class=\"es\">conocía</span> kannte – <span class=\"es\">conocí</span> lernte kennen · <span class=\"es\">sabía</span> wusste – <span class=\"es\">supe</span> erfuhr · <span class=\"es\">tenía</span> hatte – <span class=\"es\">tuve un hijo</span> bekam ein Kind · <span class=\"es\">no quería</span> wollte nicht – <span class=\"es\">no quise</span> weigerte mich.</div></div>", "say": []}, {"k": "block", "cls": "", "title": "", "html": "<div class=\"box novela\"><span class=\"tag\">En la novela · „El año de Lukas“</span><blockquote>«Esa mañana <span class=\"c2\">llegó</span> una carta. Una carta de verdad, en un sobre, con sello y con aquella letra grande y azul que Lukas <span class=\"c1\">conocía</span> tan bien.»</blockquote>Der Brief kommt an – Handlung. Die Schrift kennt Lukas schon lange – Bühne.</div>", "say": []}], "ex": [{"k": "mark", "title": "Die Hochzeit. Hör zu und schreib B (Bühne) oder H (Handlung) in die Kästchen.", "toks": [{"w": "Era", "a": "B"}, {"s": " el día de la boda de mi hermana. "}, {"w": "Hacía", "a": "B"}, {"s": " un sol precioso y todos "}, {"w": "estábamos", "a": "B"}, {"s": " muy elegantes. Mientras los novios "}, {"w": "bailaban", "a": "B"}, {"s": ", mi sobrino Nico, de cuatro años, "}, {"w": "se subió", "a": "H"}, {"s": " a la mesa, "}, {"w": "cogió", "a": "H"}, {"s": " la tarta con las dos manos… y "}, {"w": "se la comió", "a": "H"}, {"s": ". Nadie "}, {"w": "dijo", "a": "H"}, {"s": " nada. La tarta "}, {"w": "estaba", "a": "B"}, {"s": " buenísima."}], "labs": ["B", "H"], "why": "Nicos drei Handlungen folgen aufeinander: rauf, nehmen, essen. Während das Brautpaar tanzt, läuft das Fest einfach weiter – Bühne.", "say": [{"t": "Era el día de la boda de mi hermana.", "p": 700}, {"t": "Hacía un sol precioso y todos estábamos muy elegantes.", "p": 700}, {"t": "Mientras los novios bailaban, mi sobrino Nico, de cuatro años, se subió a la mesa, cogió la tarta con las dos manos.", "p": 700}, {"t": "y se la comió.", "p": 700}, {"t": "Nadie dijo nada.", "p": 700}, {"t": "La tarta estaba buenísima.", "p": 700}]}, {"k": "choice", "title": "Was passt? Unterstreiche.", "parts": [{"s": "Cuando "}, {"o": ["era", "fui"], "r": 0}, {"s": " estudiante, "}, {"o": ["vivía", "viví"], "r": 0}, {"s": " en un piso con cuatro personas y un gato."}], "why": ""}, {"k": "choice", "title": "Was passt? Unterstreiche.", "parts": [{"s": "Ayer "}, {"o": ["perdía", "perdí"], "r": 1}, {"s": " el autobús y "}, {"o": ["llegaba", "llegué"], "r": 1}, {"s": " tarde a la reunión."}], "why": ""}, {"k": "choice", "title": "Was passt? Unterstreiche.", "parts": [{"o": ["Hacía", "Hizo"], "r": 0}, {"s": " un frío horrible, así que "}, {"o": ["me ponía", "me puse"], "r": 1}, {"s": " dos jerséis."}], "why": ""}, {"k": "choice", "title": "Was passt? Unterstreiche.", "parts": [{"s": "Mientras el jefe "}, {"o": ["hablaba", "habló"], "r": 0}, {"s": ", yo "}, {"o": ["miraba", "miré"], "r": 0}, {"s": " el móvil. De repente, me "}, {"o": ["preguntaba", "preguntó"], "r": 1}, {"s": " algo."}], "why": ""}, {"k": "choice", "title": "Was passt? Unterstreiche.", "parts": [{"o": ["Conocía", "Conocí"], "r": 1}, {"s": " a Lucía en una fiesta. "}, {"o": ["Llevaba", "Llevó"], "r": 0}, {"s": " un vestido rojo."}], "why": ""}, {"k": "choice", "title": "Was passt? Unterstreiche.", "parts": [{"s": "De pequeño, siempre "}, {"o": ["quería", "quise"], "r": 0}, {"s": " ser astronauta. Hoy soy dentista."}], "why": ""}, {"k": "choice", "title": "Was passt? Unterstreiche.", "parts": [{"o": ["Vivía", "Viví"], "r": 1}, {"s": " tres años en Sevilla. Luego "}, {"o": ["me mudaba", "me mudé"], "r": 1}, {"s": " a Madrid."}], "why": "e: <span class=\"es\">conocí</span> heißt hier „ich habe kennengelernt“. g: drei Jahre, aber abgeschlossen – also Indefinido."}, {"k": "cloze", "title": "Die erste Verabredung. Setz die Verben ein.", "parts": [{"s": "Mi primera cita con Dani "}, {"a": "fue", "h": "ser"}, {"s": " un desastre. "}, {"a": "Era", "h": "ser"}, {"s": " un sábado de agosto y "}, {"a": "hacía", "h": "hacer"}, {"s": " muchísimo calor. Yo "}, {"a": "llevaba", "h": "llevar"}, {"s": " mi camisa favorita, la blanca. Dani "}, {"a": "llegó", "h": "llegar"}, {"s": " veinte minutos tarde. "}, {"a": "Pedimos", "h": "pedir, nosotros"}, {"s": " dos cafés con hielo. Mientras Dani me "}, {"a": "contaba", "h": "contar"}, {"s": " su viaje a Japón, un camarero "}, {"a": "tropezó", "h": "tropezar"}, {"s": " y me "}, {"a": "tiró", "h": "tirar"}, {"s": " un café entero encima. Mi camisa ya no "}, {"a": "era", "h": "ser"}, {"s": " blanca. Dani "}, {"a": "empezó", "h": "empezar"}, {"s": " a reírse. Yo también. Hoy llevamos cinco años juntos."}], "why": "Warum <span class=\"es\">fue un desastre</span> und nicht <span class=\"es\">era</span>? Lucía bewertet die ganze, abgeschlossene Verabredung von heute aus – das ist ein Ereignis mit Ende.", "say": []}, {"k": "impulse", "title": "Und dann …? Die Bühne steht. Schreib die Handlung.", "start": "Era domingo por la tarde. Yo leía un libro en el sofá cuando …", "items": [{"i": "1F6AA", "s": "… llamaron a la puerta."}, {"i": "1F426", "s": "… entró un pájaro por la ventana."}, {"i": "1F4A7", "s": "… empezó a caer agua del techo."}, {"i": "1F413", "s": "… un gallo empezó a cantar en el balcón de enfrente."}]}, {"k": "translate", "title": "Wie sagst du das auf Spanisch?", "de": "Als ich klein war, habe ich jeden Sommer bei meiner Oma im Dorf verbracht.", "es": "Cuando era pequeño/pequeña, pasaba todos los veranos en el pueblo de mi abuela."}, {"k": "translate", "title": "Wie sagst du das auf Spanisch?", "de": "Ich war gerade am Kochen, als meine Schwiegermutter klingelte.", "es": "Estaba cocinando cuando mi suegra llamó al timbre. (auch: Cocinaba cuando…)"}, {"k": "translate", "title": "Wie sagst du das auf Spanisch?", "de": "Das Wetter war schön, also sind wir an den Strand gegangen.", "es": "Hacía buen tiempo, así que fuimos a la playa."}, {"k": "translate", "title": "Wie sagst du das auf Spanisch?", "de": "Ich wusste es nicht. Ich habe es erst gestern erfahren.", "es": "No lo sabía. Lo supe ayer."}, {"k": "translate", "title": "Wie sagst du das auf Spanisch?", "de": "Wir haben drei Jahre in Valencia gewohnt.", "es": "Vivimos tres años en Valencia."}, {"k": "free", "title": "Ein Tag, der anders lief als geplant. Erzähl in fünf Sätzen.", "html": "Erst die Bühne (Wann? Wo? Wie war das Wetter, wie ging es dir?), dann die Handlung (Was passierte? Und dann?).", "sol": "Keine feste Lösung. Prüf selbst: Stehen Zeit, Ort und Stimmung im Imperfecto? Stehen die Ereignisse im Indefinido?"}]}, {"id": "11.6", "topic": "Perfekt oder Indefinido?", "chap": "11 Vergangenheit I", "baum": "🌿 Stamm", "cards": [{"k": "hook", "es": "¿Has estado alguna vez en México? —Sí, fui en 2019.", "de": "Warst du schon mal in Mexiko? – Ja, 2019.", "icons": ["1F6CB", "1F3CB", "1F37F"], "bubbles": ["¿Has ido al gimnasio<br>esta semana?", "¡Claro! Fui el lunes…<br>a pagar la cuota."], "gloss": "<span class=\"es\">la cuota</span> der Mitgliedsbeitrag", "say": [{"t": "¿Has estado alguna vez en México?", "p": 700}, {"t": "—Sí, fui en 2019.", "p": 700}]}, {"k": "dark", "html": "Ist die Zeitschachtel noch <span class=\"c1\">offen</span> (heute, diese Woche, im Leben)? Dann Perfekt: <span class=\"es\">he ido</span>. Ist sie <span class=\"c2\">zu</span> (gestern, 2019)? Dann Indefinido: <span class=\"es\">fui</span>."}, {"k": "block", "cls": "t1", "title": "", "html": "<div class=\"cols n1\"><div class=\"col t1\"><div class=\"col-h\"><img class=\"\" src=\"icons/1F513.svg\" alt=\"\"><div><strong>Die Schachtel ist offen</strong><small>Perfekt</small></div></div><div class=\"use\"><div class=\"t\">Heute, diese Woche, dieses Jahr</div><div class=\"x\"><span class=\"es\">Esta mañana he desayunado churros.</span><br><span class=\"es\">Este año he cambiado de trabajo dos veces.</span></div></div><div class=\"use\"><div class=\"t\">Im Leben, bis jetzt</div><div class=\"x\"><span class=\"es\">¿Has estado alguna vez en México?</span><br><span class=\"es\">Nunca he montado en camello.</span></div></div></div></div>", "say": [{"t": "Esta mañana he desayunado churros.", "p": 700}, {"t": "Este año he cambiado de trabajo dos veces.", "p": 700}, {"t": "¿Has estado alguna vez en México?", "p": 700}, {"t": "Nunca he montado en camello.", "p": 700}]}, {"k": "block", "cls": "t2", "title": "", "html": "<div class=\"cols n1\"><div class=\"col t2\"><div class=\"col-h\"><img class=\"\" src=\"icons/1F512.svg\" alt=\"\"><div><strong>Die Schachtel ist zu</strong><small>Indefinido</small></div></div><div class=\"use\"><div class=\"t\">Gestern, letzte Woche, letztes Jahr</div><div class=\"x\"><span class=\"es\">Ayer desayuné churros. Otra vez.</span><br><span class=\"es\">El año pasado cambié de trabajo.</span></div></div><div class=\"use\"><div class=\"t\">Mit Datum oder „vor …“</div><div class=\"x\"><span class=\"es\">Sí, fui en 2019. Con mi madre.</span><br><span class=\"es\">Pilar llamó hace tres días.</span></div></div></div></div>", "say": [{"t": "Ayer desayuné churros.", "p": 700}, {"t": "Otra vez.", "p": 700}, {"t": "El año pasado cambié de trabajo.", "p": 700}, {"t": "Sí, fui en 2019.", "p": 700}, {"t": "Con mi madre.", "p": 700}, {"t": "Pilar llamó hace tres días.", "p": 700}]}, {"k": "block", "cls": "kojo", "title": "", "html": "<div class=\"box ojo\"><span class=\"tag\">Ojo · Achtung</span>Deutsch: „Gestern <em>habe</em> ich Paella gegessen.“ Spanisch: <span class=\"es\">ayer</span> schließt die Schachtel – <span class=\"es\">Ayer comí paella</span>, nie <span class=\"es\">ayer he comido</span>.</div>", "say": []}, {"k": "block", "cls": "kreg", "title": "", "html": "<div class=\"box region\"><span class=\"tag\">Así se dice en … · So klingt es woanders</span>In Lateinamerika (und auf den Kanaren) geht die Schachtel schneller zu: Was vorbei ist, steht meist im Indefinido – auch heute. Madrid: <span class=\"es\">¿Ya has comido? Hoy he comido tacos.</span> Mexiko: <span class=\"es\">¿Ya comiste? Hoy comí tacos.</span> Beides ist richtig, nur nicht in derselben Stadt.</div>", "say": []}], "ex": [{"k": "sort", "title": "Offen oder zu? Sortiere die Zeitangaben.", "words": ["hoy", "ayer", "en 2019", "esta semana", "nunca", "anoche", "hace tres días", "esta mañana"], "baskets": [{"l": "offen → Perfekt", "a": ["hoy", "esta semana", "nunca", "esta mañana"]}, {"l": "zu → Indefinido", "a": ["ayer", "en 2019", "anoche", "hace tres días"]}], "why": ""}, {"k": "choice", "title": "Lucías Woche – so sagt man es in Madrid. Unterstreiche.", "parts": [{"s": "Esta semana "}, {"o": ["he trabajado", "trabajé"], "r": 0}, {"s": " sesenta horas."}], "why": ""}, {"k": "choice", "title": "Lucías Woche – so sagt man es in Madrid. Unterstreiche.", "parts": [{"s": "El lunes Rafa me "}, {"o": ["ha llamado", "llamó"], "r": 1}, {"s": " a las once de la noche."}], "why": ""}, {"k": "choice", "title": "Lucías Woche – so sagt man es in Madrid. Unterstreiche.", "parts": [{"s": "Ayer "}, {"o": ["he visto", "vi"], "r": 1}, {"s": " a mi madre en el gimnasio. ¿Mi madre? ¿En el gimnasio   card.insertAdjacentHTML('beforeend','<div class="legend">'+labs.map(function(l,i){return '<span class="l'+(i%3)+'">'+(i+1)+'× = '+l+'</span>';}).join('')+'</div><div class="chips">'+e.words.map(function(w,i){return '<button class="chip" data-i="'+i+'" data-v="-1">'+w+'<span class="lab"></span></button>';}).join('')+'</div><button class="check">Prüfen</button>');
  card.querySelectorAll('.chip').forEach(function(b){ b.onclick=function(){ var v=(+b.dataset.v)+1; if(v>=labs.length) v=-1; b.dataset.v=v; b.className='chip'+(v>=0?' v'+(v%3):''); b.querySelector('.lab').textContent=v>=0?String(v+1):''; }; });
  card.querySelector('.check').onclick=function(){ var fehl=0, leer=0;
    card.querySelectorAll('.chip').forEach(function(b){ b.classList.remove('ok','no'); var v=+b.dataset.v, w=e.words[+b.dataset.i]; if(v<0){leer++;return;} if(e.baskets[v].a.indexOf(w)>-1) b.classList.add('ok'); else {b.classList.add('no'); fehl++;} });
    fbOut(card).innerHTML= leer ? '<div class="fb info">Es fehlen noch '+leer+'.</div>' : (fehl?'<div class="fb no">Rot umrandet gehört in einen anderen Korb.</div>':'<div class="fb ok">Alles richtig.</div>'+(e.why?'<div class="fb info">'+e.why+'</div>':''));
  };
}
function match(card,e){
  var opts='<option value="">– wählen –</option>'+e.right.map(function(r,i){return '<option value="'+i+'">'+r.replace(/<[^>]+>/g,'')+'</option>';}).join('');
  card.insertAdjacentHTML('beforeend','<div>'+e.left.map(function(l,i){return '<div class="mrow"><div class="l">'+l+'</div><select data-i="'+i+'" aria-label="Zuordnen">'+opts+'</select></div>';}).join('')+'</div><button class="check">Prüfen</button>');
  card.querySelector('.check').onclick=function(){ var fehl=0;
    card.querySelectorAll('select').forEach(function(s){ s.classList.remove('ok','no'); if(+s.value===e.ans[+s.dataset.i] && s.value!=='') s.classList.add('ok'); else {s.classList.add('no'); fehl++;} });
    fbOut(card).innerHTML=fehl?'<div class="fb no">Rot: noch nicht richtig zugeordnet.</div>':'<div class="fb ok">Alles richtig.</div>'+(e.why?'<div class="fb info">'+e.why+'</div>':'');
  };
}
function transform(card,e){
  card.insertAdjacentHTML('beforeend',(e.ex?'<div class="task">Beispiel: <span class="es">'+e.ex.q+'</span> → <span class="es">'+e.ex.a+'</span></div>':'')+'<div class="tf">'+e.items.map(function(it){return '<div><div class="q">'+it.q+'</div><input data-a="'+esc(it.a)+'" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Deine Antwort"></div>';}).join('')+'</div><button class="check">Prüfen</button>');
  nummeriere(card); card.querySelector('.check').onclick=function(){pruefeInputs(card,e);};
}
function zeigeLsg(card){ card.querySelector('[data-show]').onclick=function(){ card.querySelector('[data-sol]').hidden=false; this.hidden=true; }; }
function translate(card,e){ card.insertAdjacentHTML('beforeend','<div class="big" style="font-weight:400">'+e.de+'</div><textarea aria-label="Deine Übersetzung" placeholder="Auf Spanisch …"></textarea><button class="check light" data-show>Lösung zeigen</button><div data-sol hidden><div class="solution">'+e.es+'</div></div>'); zeigeLsg(card); }
function impulse(card,e){ card.insertAdjacentHTML('beforeend',(e.start?'<div class="sent">'+e.start+'</div>':'')+'<div class="imp">'+e.items.map(function(it){return '<img alt="" src="icons/'+it.i+'.svg">';}).join('')+'</div><textarea aria-label="Deine Sätze"></textarea><button class="check light" data-show>Vorschläge zeigen</button><div data-sol hidden class="fbs">'+e.items.map(function(it){return '<div class="solution">'+it.s+'</div>';}).join('')+'</div>'); zeigeLsg(card); }
function free(card,e){ card.insertAdjacentHTML('beforeend',(e.html?'<div class="task">'+e.html+'</div>':'')+'<textarea aria-label="Dein Text" style="min-height:140px"></textarea><button class="check light" data-show>Worauf achten?</button><div data-sol hidden><div class="fb info">'+(e.sol||'Keine feste Lösung.')+'</div></div><div class="premium">Mit Premium liest Spikiu deinen Text und antwortet dir darauf.</div>'); zeigeLsg(card); }
function tongue(card,e){ card.insertAdjacentHTML('beforeend','<div class="tongue-x">'+e.es+'</div><div class="task">'+e.de+'</div>'+play(e.say,'Vorsprechen')); }
function hear(card,e){
  card.insertAdjacentHTML('beforeend',play(e.say,'Hören')+'<div class="pairs">'+e.pairs.map(function(p,i){return '<div class="pr" data-i="'+i+'"><span class="n">'+'abcdefghij'[i]+'</span>'+p.o.map(function(o,j){return '<button class="opt" data-j="'+j+'">'+o+'</button>';}).join('')+(p.g?'<small>'+p.g+'</small>':'')+'</div>';}).join('')+'</div>');
  card.querySelectorAll('.pr').forEach(function(row){ var p=e.pairs[+row.dataset.i]; row.querySelectorAll('.opt').forEach(function(b){ b.onclick=function(){ row.querySelectorAll('.opt').forEach(function(x){x.disabled=true;}); row.querySelectorAll('.opt')[p.r].classList.add('right'); if(+b.dataset.j!==p.r) b.classList.add('wrong'); }; }); });
}

/* ── Hören: Spikiu-Stimme (audio.js), Baustein für Baustein ── */
var lauf=0, aktiv=null;
function stopAudio(){ lauf++; try{ window.spikiuStopp && window.spikiuStopp(); }catch(e){} if(aktiv){aktiv.classList.remove('on');aktiv=null;} }
function warte(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function spiele(b){
  stopAudio(); aktiv=b; b.classList.add('on'); var meins=++lauf, list=SAYS[+b.dataset.say]||[];
  if(!window.spikiuSprich){ stopAudio(); return; }
  for(var i=0;i<list.length;i++){ if(meins!==lauf) return; try{ await window.spikiuSprich(list[i].t,'es'); }catch(e){} if(meins!==lauf) return; if(i<list.length-1) await warte(list[i].p||700); }
  if(meins===lauf) stopAudio();
}

/* ── Klicks ── */
document.addEventListener('click',function(ev){
  var p=ev.target.closest('.play'); if(p){ if(aktiv===p) stopAudio(); else spiele(p); return; }
  var a=ev.target.closest('[data-act]'); if(!a) return;
  var i=secIdx(cur.id);
  if(a.dataset.act==='ueben'){ uebungen(cur); baueDots(); var u=reel.querySelector('[data-part="u"]'); if(u) u.scrollIntoView({behavior:'smooth'}); }
  else if(a.dataset.act==='weiter'){ if(DATA.secs[i+1]) ladeAbschnitt(i+1,false); }
  else if(a.dataset.act==='oben'){ reel.children[0].scrollIntoView({behavior:'smooth'}); }
  else if(a.dataset.act==='menu'){ oeffneMenu(); }
});

/* ── Punkte, Kopf, Merken ── */
var io=null;
function baueDots(){
  dotsEl.innerHTML=''; var n=reel.children.length;
  Array.prototype.forEach.call(reel.children,function(s){ var d=document.createElement('i'); if(s.dataset.part==='u'||s.dataset.part==='e') d.className='u'; dotsEl.appendChild(d); });
  dotsEl.hidden = n>34;
  if(io) io.disconnect();
  io=new IntersectionObserver(function(es){ es.forEach(function(en){ if(!en.isIntersecting||en.intersectionRatio<.6) return;
    var idx=Array.prototype.indexOf.call(reel.children,en.target); aktIdx=idx;
    Array.prototype.forEach.call(dotsEl.children,function(d,j){d.classList.toggle('on',j===idx);});
    var part=en.target.dataset.part, m=document.getElementById('mode'), u=(part==='u'||part==='e');
    m.textContent=u?'Üben':'Lesen'; m.classList.toggle('ueben',u);
    stopAudio(); merke();
  }); },{root:reel,threshold:[.6]});
  Array.prototype.forEach.call(reel.children,function(s){io.observe(s);});
}
var merkT=null;
function merke(){ clearTimeout(merkT); merkT=setTimeout(function(){ try{ window.spikiuSitzung && window.spikiuSitzung.speichere(RAUM,{sec:cur.id, idx:aktIdx, ueben:imUeben, titel:cur.id+' '+cur.topic}); }catch(e){} },350); }

/* ── Menü ── */
var sheet=document.getElementById('sheet');
function oeffneMenu(){
  document.getElementById('rows').innerHTML=DATA.nav.map(function(ch){ return '<h3><span>'+ch.ch+'</span>'+esc(ch.t)+'</h3>'+ch.s.map(function(s){ var hier=cur&&cur.id===s.id; return '<div class="row"><span class="n">'+s.id+'</span><span class="tt">'+esc(s.t)+(hier?'<span class="cur">Du bist hier</span>':'')+'</span><button data-go="'+s.id+'" data-m="l">Lesen</button><button data-go="'+s.id+'" data-m="u">Üben</button></div>'; }).join(''); }).join('');
  sheet.hidden=false; var h=sheet.querySelector('.cur'); if(h) h.closest('.row').scrollIntoView({block:'center'});
}
document.getElementById('menuBtn').onclick=oeffneMenu;
document.getElementById('closeSheet').onclick=function(){ sheet.hidden=true; };
sheet.addEventListener('click',function(e){ if(e.target===sheet){ sheet.hidden=true; return; } var g=e.target.closest('[data-go]'); if(!g) return; sheet.hidden=true; ladeAbschnitt(secIdx(g.dataset.go), g.dataset.m==='u'); });
document.getElementById('zurBib').addEventListener('click',function(){ try{sessionStorage.setItem('spk_haus_tuer','bibliothek');}catch(e){} });

/* ── Start: #s-11-5 oder Wiederkommen ── */
(function(){
  var h=(location.hash||'').match(/^#s-(\d+)-(\d+)$/), start=0;
  if(h) start=secIdx(h[1]+'.'+h[2]);
  ladeAbschnitt(start,false);
  var S=window.spikiuSitzung; if(!S||h) return;
  var alt=S.lade(RAUM);
  if(alt && alt.sec && (alt.sec!==DATA.secs[0].id || alt.idx>1)){
    S.frageWiederkommen({raum:RAUM, ts:alt.ts, wo:alt.titel||'',
      beimWeiter:function(){ ladeAbschnitt(secIdx(alt.sec), !!alt.ueben); setTimeout(function(){ var t=reel.children[Math.min(alt.idx||0, reel.children.length-1)]; if(t) t.scrollIntoView(); },60); },
      beimNeu:function(){ S.raeume(RAUM); }});
  }
})();
</script>
