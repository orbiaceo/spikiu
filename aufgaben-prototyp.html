<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Spikiu · Drei Aufgaben</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&family=Lora:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{--ink:#15163a;--acc:#1f93b0;--mid:#5f7068;--minz:#eef7f1;--line:#eef1ee;--tief:#1b4f72;--ow:2.5px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--minz);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden}

.pult{background:#fff;border-bottom:var(--ow) solid var(--ink);padding:.45rem .7rem;flex-shrink:0}
.pult h1{font:800 .7rem "DM Sans",sans-serif;letter-spacing:.03em;text-transform:uppercase;opacity:.5;margin-bottom:.3rem}
.reihe{display:flex;gap:.26rem;align-items:center;flex-wrap:wrap}
.tog{font:800 .68rem "DM Sans",sans-serif;padding:.26rem .5rem;border-radius:11px;
  border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.zaehler{margin-left:auto;font:800 .66rem "DM Sans",sans-serif;color:var(--mid);text-align:right;line-height:1.3}
.zaehler b{color:var(--ink)}

.buehne{flex:1;position:relative;min-height:0}
.karte{position:absolute;inset:.7rem .85rem 1.2rem;background:#fff;
  border:var(--ow) solid var(--ink);border-radius:22px;box-shadow:5px 6px 0 var(--ink);
  display:flex;flex-direction:column;overflow:hidden}
.kopf{flex:0 0 auto;display:flex;align-items:center;gap:.5rem;padding:.65rem .9rem .5rem;
  border-bottom:2px solid var(--line)}
.rolle{font:800 .64rem "DM Sans",sans-serif;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mid);flex:1;text-align:left}
.kbtn{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);
  background:#fff;color:var(--mid);font-size:.78rem;cursor:pointer;display:flex;
  align-items:center;justify-content:center;padding:0}

.leib{flex:1 1 auto;min-height:0;overflow-y:auto;padding:.85rem 1.05rem .5rem;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;text-align:center}
.bild{width:min(52vw,12rem);border-radius:16px;border:var(--ow) solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);display:block;margin:0 auto}
.rollen{font:700 1.02rem/1.45 "DM Sans",sans-serif;max-width:20rem}
.rollen b{color:var(--acc)}
.ziel{font-family:"Lora",serif;font-weight:600;font-size:clamp(1.4rem,5.6vw,2rem);
  line-height:1.25;max-width:22rem}
.audio{width:44px;height:44px;border-radius:50%;border:0;background:#dff0ef;color:var(--acc);
  display:flex;align-items:center;justify-content:center;font-size:.95rem;cursor:pointer}
.uez{background:none;border:0;font:700 .76rem "DM Sans",sans-serif;color:var(--acc);
  text-decoration:underline;cursor:pointer}
.trans{font:600 .92rem/1.35 "DM Sans",sans-serif;color:var(--mid);font-style:italic;max-width:20rem}

/* ── Die drei Aufgaben ────────────────────────────────────────────── */
.aufgaben{width:100%;max-width:21rem;display:flex;flex-direction:column;gap:.35rem;
  margin-top:.3rem}
.auf{display:flex;align-items:center;gap:.55rem;text-align:left;
  font:700 .88rem/1.3 "DM Sans",sans-serif;color:var(--mid);
  padding:.4rem .55rem;border-radius:12px;transition:background .2s}
.auf .kreis{flex:0 0 auto;width:17px;height:17px;border-radius:50%;
  border:2.5px solid var(--ink);background:#fff;opacity:.4;
  display:flex;align-items:center;justify-content:center;font-size:.62rem;color:#fff}
.auf.jetzt{background:#eaf4f7;color:var(--ink)}
.auf.jetzt .kreis{opacity:1;border-color:var(--acc)}
.auf.fertig{color:var(--mid);opacity:.6}
.auf.fertig .kreis{background:var(--tief);border-color:var(--tief);opacity:1}
.auf.fertig .txt{text-decoration:line-through}

.fuss{flex:0 0 auto;padding:.6rem 1rem .85rem;border-top:2px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:.55rem}
.feld{width:100%;max-width:21rem;background:#fff;border:2.5px solid var(--ink);
  border-radius:16px;padding:.7rem .9rem;font:600 1rem/1.4 "DM Sans",sans-serif;
  color:var(--ink);resize:none;outline:none;min-height:3.6rem;text-align:center}
.feld::placeholder{color:#b8c4bd;letter-spacing:.18em;font-size:1.2rem}
.feld:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(31,147,176,.14)}
.send{background:var(--acc);color:#fff;border:var(--ow) solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);border-radius:100px;padding:.55rem 2.2rem;
  font:800 .96rem "DM Sans",sans-serif;cursor:pointer}
.los{background:var(--acc);color:#fff;border:var(--ow) solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);border-radius:100px;padding:.65rem 2.4rem;
  font:800 1rem "DM Sans",sans-serif;cursor:pointer}
.info{position:absolute;left:.85rem;right:.85rem;bottom:.18rem;
  font:600 .64rem "DM Sans",sans-serif;color:var(--mid);text-align:center;opacity:.85}
</style>
</head>
<body>

<div class="pult">
  <h1>Szene · drei Aufgaben</h1>
  <div class="reihe">
    <button class="tog" id="tNeu">Von vorn</button>
    <button class="tog" id="tPrompt">Prompt zeigen</button>
    <span class="zaehler" id="zaehler"></span>
  </div>
</div>

<div class="buehne" id="buehne"></div>

<script src="lernpfad-daten.js"></script>
<script src="bilder-db.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   DREI AUFGABEN — nach dem Vorbild von Googles Übungsmodus, aber mit
   Spikius eigenem Material.

   Die drei Aufgaben SIND die drei Lernerzeilen des Stations-Dialogs.
   Sie stehen fertig in lernpfad-daten.js — null Token, für jeden gleich.

   Der Anker: Spikiu bekommt in JEDEM Zug nur eine Anweisung —
   „offen ist noch Aufgabe N, führe dorthin". Deshalb kann das Gespräch
   nicht mehr entgleisen, egal was der Lerner einwirft.

   HARTE DECKE: sechs Spikiu-Züge. Danach schliesst die Figur ab, egal
   wie viel offen ist. Das begrenzt die Kosten je Szene fest.

   Anti-Gamification: keine Punkte, keine Note — drei Kreise, die sich
   füllen. „Fortschritt wird gefühlt, nie gezählt."
   ══════════════════════════════════════════════════════════════════════ */

var D = window.SpikiuLernpfad, B = window.SpikiuBilder;
var STUFE='a1', THEMA='cafe', MU='de';
var ZUG_DECKEL = 6;

/* Die Aufgaben in der MUTTERSPRACHE — ein Anfänger muss sie verstehen,
   ohne sie schon sagen zu können. Gehört später in lernpfad-daten.js. */
var AUFGABEN = {
  cafe: [ {de:'Bestelle etwas zu trinken'}, {de:'Sag, wie du es möchtest'}, {de:'Bitte um die Rechnung'} ],
  taxi: [ {de:'Nenne dein Ziel'},           {de:'Sag, dass du Gepäck hast'}, {de:'Frag, was es kostet'} ],
  hotel:[ {de:'Sag, dass du reserviert hast'},{de:'Nenne deinen Namen'},     {de:'Frag nach dem Frühstück'} ]
};

var phase='buehne', zug=0, offen=0, gesagt=null, aufrufe=0, zeigePrompt=false, letzterPrompt='';

function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n;}
function S(){ return D.station(STUFE,THEMA); }
function TH(){ return D.thema(THEMA); }
function R(){ return D.rolle(THEMA); }
function AUF(){ return AUFGABEN[THEMA] || AUFGABEN.cafe; }

function sprich(t){ try{ speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(t); u.lang='es-ES'; u.rate=.92; speechSynthesis.speak(u);
}catch(e){} }

/* Der Prompt, den Spikiu je Zug bekaeme. Der Anker ist die offene Aufgabe. */
function bauePrompt(){
  var r=R(), a=AUF();
  return 'Du bist ' + r.spikiu.de + ' ' + r.ort.de + '. Der Lerner ist ' + r.lerner.de + '.\n'
    + 'Stufe: A1. Antworte auf Spanisch, höchstens drei Sätze.\n'
    + 'OFFEN IST NOCH: „' + a[offen].de + '"\n'
    + 'Führe das Gespräch dorthin. Erfinde keine dritte Figur.\n'
    + 'Zug ' + (zug+1) + ' von ' + ZUG_DECKEL + '.';
}

function kosten(){
  document.getElementById('zaehler').innerHTML =
    'Züge <b>'+zug+'/'+ZUG_DECKEL+'</b> · Aufgaben <b>'+offen+'/3</b><br>Aufrufe <b>'+aufrufe+'</b>';
}

function malAufgaben(){
  var box=el('div','aufgaben');
  AUF().forEach(function(a,i){
    var z=el('div','auf'+(i<offen?' fertig':i===offen?' jetzt':''));
    var k=el('div','kreis', i<offen?'✓':'');
    z.appendChild(k);
    z.appendChild(el('span','txt', a.de));
    box.appendChild(z);
  });
  return box;
}

function mal(){
  var b=document.getElementById('buehne'); b.innerHTML='';
  kosten();
  if(phase==='buehne') malBuehne(b);
  else if(phase==='ende') malEnde(b);
  else malSzene(b);
  if(zeigePrompt && letzterPrompt){
    var p=el('div');
    p.style.cssText='position:absolute;left:.85rem;right:.85rem;bottom:.3rem;'
      +'background:#fffbe8;border:2px dashed #c67a1e;border-radius:12px;padding:.45rem .6rem;'
      +'font:600 .64rem/1.45 ui-monospace,monospace;color:#7a4a08;white-space:pre-wrap';
    p.textContent=letzterPrompt;
    b.appendChild(p);
  }
}

function malBuehne(b){
  var t=TH(), r=R();
  var k=el('div','karte');
  var kopf=el('div','kopf'); kopf.appendChild(el('div','rolle', t.na.de)); k.appendChild(kopf);
  var l=el('div','leib');
  var im=B && B.img(THEMA, MU, 'bild'); if(im) l.appendChild(im);
  var ro=el('div','rollen');
  ro.innerHTML='Ich bin <b>'+r.spikiu.de+'</b>, du bist <b>'+r.lerner.de+'</b>.';
  l.appendChild(ro);
  /* Die Aufgaben stehen schon HIER — der Lerner weiss, was ihn erwartet. */
  l.appendChild(malAufgaben());
  k.appendChild(l);
  var f=el('div','fuss');
  var los=el('button','los','Los!'); los.type='button';
  los.onclick=function(){ phase='szene'; zug=0; offen=0; gesagt=null; aufrufe=1;
    letzterPrompt=bauePrompt(); mal(); };
  f.appendChild(los); k.appendChild(f);
  b.appendChild(k);
  b.appendChild(el('div','info','Bild, Rollen, drei Aufgaben — alles aus der Datenbank. Null Token.'));
}

function malSzene(b){
  var st=S(), zeilen=st.dialog.zeilen, r=R();
  var sp=zeilen[Math.min(offen*2, zeilen.length-2)];
  var k=el('div','karte');

  var kopf=el('div','kopf');
  kopf.appendChild(el('div','rolle', r.spikiu.de));
  var st1=el('button','kbtn','✎'); st1.type='button'; kopf.appendChild(st1);
  var x=el('button','kbtn','✕'); x.type='button';
  x.onclick=function(){ phase='ende'; mal(); };
  kopf.appendChild(x);
  k.appendChild(kopf);

  var l=el('div','leib');
  l.appendChild(el('div','ziel', sp.z));
  var a=el('button','audio','🔊'); a.type='button'; a.onclick=function(){ sprich(sp.z); };
  l.appendChild(a);
  var u=el('button','uez','Übersetzung'); u.type='button';
  u.onclick=function(){ u.replaceWith(el('div','trans', sp.na.de)); };
  l.appendChild(u);
  l.appendChild(malAufgaben());
  k.appendChild(l);

  var f=el('div','fuss');
  var ta=document.createElement('textarea');
  ta.className='feld'; ta.rows=2; ta.placeholder='···';
  f.appendChild(ta);
  var s=el('button','send','Senden'); s.type='button';
  s.onclick=function(){
    var v=ta.value.trim(); if(v.length<2) return;
    zug++; aufrufe++;
    /* Im Prototyp: jede Antwort erfüllt die offene Aufgabe. In echt prüft
       das der Mini-Prompt — Spikiu meldet [AUFGABE:erledigt] oder nicht. */
    offen++;
    if(offen>=3 || zug>=ZUG_DECKEL){ phase='ende'; }
    letzterPrompt = phase==='ende' ? 'Szene zu Ende — kein weiterer Aufruf.' : bauePrompt();
    mal();
  };
  f.appendChild(s);
  k.appendChild(f);
  b.appendChild(k);

  b.appendChild(el('div','info', zug>=ZUG_DECKEL-1
    ? 'Letzter Zug — danach schliesst die Figur ab, egal was offen ist.'
    : 'Spikiu bekommt nur EINE Anweisung: führe zur offenen Aufgabe.'));
}

function malEnde(b){
  var k=el('div','karte');
  var l=el('div','leib');
  l.appendChild(el('div','ziel', offen>=3 ? '¡Muy bien!' : 'Hasta luego.'));
  l.appendChild(malAufgaben());
  l.appendChild(el('div','rollen', offen>=3
    ? 'Alle drei Aufgaben erledigt.'
    : 'Die Szene ist zu Ende — ' + offen + ' von 3 geschafft.'));
  k.appendChild(l);
  var f=el('div','fuss');
  var n=el('button','los','Noch einmal'); n.type='button';
  n.onclick=function(){ phase='buehne'; zug=0; offen=0; aufrufe=0; letzterPrompt=''; mal(); };
  f.appendChild(n); k.appendChild(f);
  b.appendChild(k);
  b.appendChild(el('div','info','Höchstens '+ZUG_DECKEL+' Züge je Szene — die Kosten sind fest gedeckelt.'));
}

document.getElementById('tNeu').onclick=function(){
  phase='buehne'; zug=0; offen=0; aufrufe=0; letzterPrompt=''; mal(); };
document.getElementById('tPrompt').onclick=function(){
  zeigePrompt=!zeigePrompt; this.setAttribute('aria-pressed',zeigePrompt?'true':'false'); mal(); };
mal();
</script>
</body>
</html>
