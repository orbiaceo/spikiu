<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spikiu — Sauberer Rhythmus + Korrektur-Karte (Prototyp)</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,700;1,400;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root{
  --white:#fff; --off:#faf9f7; --ink:#1a1816; --mid:#6b6560;
  --faint:#e8e4df; --warm:#d4cdc6; --accent:#2d6a4f; --accent2:#e8f2ed;
  --accent3:#1a4a38; --gold:#a07830; --capy:#c9956a;
  --trans-bg:#f1eee8; --trans-ink:#857f78; --trans-border:#e3ded5;
  --said-bg:#f6efe2; --said-ink:#8a6d2e; --said-border:#e6d8bb;
}
body{ background:#efece6; color:var(--ink); font-family:'DM Sans',sans-serif;
  -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; flex-direction:column;
  align-items:center; padding:46px 0 0; }
.proto-banner{ position:fixed; top:0; left:0; right:0; z-index:9999; background:#1a4a38; color:#fff;
  padding:.5rem 1rem; text-align:center; font-size:.72rem; line-height:1.4; border-bottom:2px solid #2d6a4f; }
.proto-banner strong{ color:#a8d5be; } .proto-banner em{ color:#c9956a; font-style:normal; font-weight:600; }

.phone{ width:100%; max-width:400px; height:calc(100vh - 70px); max-height:840px; margin:14px auto;
  background:var(--off); border-radius:30px; box-shadow:0 24px 60px rgba(0,0,0,.22),0 0 0 1px rgba(0,0,0,.05);
  display:flex; flex-direction:column; overflow:hidden; }

.bar{ display:flex; align-items:center; gap:.6rem; padding:.85rem 1rem .7rem;
  border-bottom:1px solid var(--faint); background:var(--white); }
.bar-capy{ width:34px; height:34px; flex-shrink:0; animation:float 4s ease-in-out infinite; }
@keyframes float{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
.bar-name{ font-family:'Lora',serif; font-weight:700; font-size:1.02rem; }
.bar-name em{ color:var(--accent); font-style:italic; }
.bar-sub{ font-size:.62rem; color:var(--mid); margin-left:auto; text-align:right; line-height:1.3; }

.chat{ flex:1; overflow-y:auto; padding:1.1rem .9rem 1.4rem; display:flex; flex-direction:column;
  gap:.7rem; scroll-behavior:smooth; }
.chat::-webkit-scrollbar{ width:0; }

.turn{ display:flex; flex-direction:column; gap:.28rem; max-width:90%; }
.turn.spikiu{ align-self:flex-start; }
.turn.user{ align-self:flex-end; align-items:flex-end; }

/* Zielsprache = Sprechblase, UPRIGHT (nicht kursiv), die Hauptsache */
.bubble{ position:relative; background:var(--white); border:1px solid var(--faint);
  border-radius:16px 16px 16px 4px; padding:.6rem .85rem; padding-right:2.3rem;
  font-family:'Lora',serif; font-style:normal; font-size:.95rem; line-height:1.45; color:var(--ink); }
.turn.user .bubble{ background:var(--accent); color:#fff; border:none; font-family:'DM Sans',sans-serif;
  font-size:.9rem; border-radius:16px 16px 4px 16px; padding-right:.85rem; }

.speak-btn{ position:absolute; top:.5rem; right:.5rem; width:25px; height:25px; border:none; cursor:pointer;
  background:var(--accent2); color:var(--accent); border-radius:50%; display:flex; align-items:center;
  justify-content:center; transition:.16s; }
.speak-btn:hover{ background:var(--accent); color:#fff; }
.speak-btn.playing{ animation:pulse 1s ease infinite; }
@keyframes pulse{ 0%,100%{box-shadow:0 0 0 0 rgba(45,106,79,.35)} 50%{box-shadow:0 0 0 6px rgba(45,106,79,0)} }
.speak-btn svg{ width:12px; height:12px; }

/* Übersetzung = gedämpftes Kästchen, KURSIV, kein Audio */
.trans{ align-self:flex-start; background:var(--trans-bg); border:1px solid var(--trans-border);
  border-radius:8px; padding:.3rem .6rem; font-size:.74rem; line-height:1.35; color:var(--trans-ink);
  font-style:italic; max-width:96%; }

/* Korrektur-Karte am Szenenende: zwei Spalten, KEINE Erklärung */
.kk{ align-self:stretch; background:var(--white); border:1px solid var(--faint); border-radius:16px;
  padding:.85rem .8rem; box-shadow:0 6px 18px rgba(0,0,0,.05); }
.kk-eyebrow{ font-size:.6rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
  color:var(--gold); margin-bottom:.6rem; text-align:center; }
.kk-row{ display:grid; grid-template-columns:1fr 1fr; gap:.45rem; margin-bottom:.45rem; }
.kk-row:last-child{ margin-bottom:0; }
.kk-head > div{ font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
  text-align:center; padding-bottom:.1rem; }
.kk-head .h-said{ color:var(--said-ink); } .kk-head .h-better{ color:var(--accent); }
.kk-cell{ border-radius:10px; padding:.5rem .6rem; font-family:'Lora',serif; font-size:.86rem; line-height:1.3; }
.kk-said{ background:var(--said-bg); border:1px solid var(--said-border); color:var(--said-ink); }
.kk-better{ background:var(--accent2); border:1px solid var(--accent); color:var(--accent3); font-weight:600;
  position:relative; padding-right:1.9rem; }
.kk-better .speak-btn{ background:#fff; }

.divider{ align-self:center; width:38%; height:1px; background:var(--faint); margin:.15rem 0; }

.composer{ border-top:1px solid var(--faint); background:var(--white); padding:.7rem .8rem; display:flex; gap:.4rem; }
.composer input{ flex:1; border:1.5px solid var(--faint); border-radius:100px; padding:.6rem .9rem;
  font-family:inherit; font-size:.85rem; outline:none; }
.composer input:focus{ border-color:var(--accent); }
.send{ width:42px; flex-shrink:0; border:none; background:var(--accent); color:#fff; border-radius:50%;
  cursor:pointer; display:flex; align-items:center; justify-content:center; }
.send svg{ width:17px; height:17px; }

.endbtn{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:50; background:#1a4a38;
  color:#fff; border:none; cursor:pointer; padding:.5rem 1rem; border-radius:100px; font-family:inherit;
  font-size:.74rem; font-weight:600; box-shadow:0 6px 18px rgba(0,0,0,.25); }

@media(max-width:430px){ body{padding-top:54px} .phone{max-width:100%; height:calc(100vh - 64px); border-radius:0; margin:0; box-shadow:none} }
</style>
</head>
<body>

<div class="proto-banner">
  <strong>🐾 PROTOTYP II — sauberer Rhythmus.</strong>
  EIN Gedanke pro Blase · Ziel = aufrecht · Übersetzung = kursiv/gedämpft · 🔊 nur Ziel ·
  Szenenende = <em>Korrektur-Karte</em> (zwei Spalten, keine Erklärung).
</div>

<div class="phone">
  <div class="bar">
    <svg class="bar-capy" viewBox="0 0 80 80" fill="none">
      <ellipse cx="40" cy="50" rx="28" ry="20" fill="#c9956a"/><ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/>
      <ellipse cx="40" cy="36" rx="10" ry="7" fill="#b8845a"/><ellipse cx="40" cy="33" rx="4" ry="2.5" fill="#8b5e3c"/>
      <circle cx="38" cy="33" r="1" fill="#6b4226"/><circle cx="42" cy="33" r="1" fill="#6b4226"/>
      <circle cx="33" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="47" cy="24" r="3.5" fill="#3d2b1f"/>
      <circle cx="34" cy="23" r="1.2" fill="white"/><circle cx="48" cy="23" r="1.2" fill="white"/>
      <ellipse cx="26" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="54" cy="17" rx="6" ry="5" fill="#b8845a"/>
      <ellipse cx="22" cy="66" rx="7" ry="5" fill="#b8845a"/><ellipse cx="34" cy="68" rx="7" ry="5" fill="#b8845a"/>
      <ellipse cx="46" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="58" cy="66" rx="7" ry="5" fill="#b8845a"/>
      <path d="M36 38 Q40 41 44 38" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </svg>
    <div class="bar-name">Spi<em>k</em>iu</div>
    <div class="bar-sub">Deutsch → Español<br>Anfänger</div>
  </div>
  <div class="chat" id="chat"></div>
  <div class="composer">
    <input placeholder="Schreib auf Spanisch…">
    <button class="send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
  </div>
</div>

<button class="endbtn" id="endbtn" onclick="showEnd()">▶ Szenenende + Korrektur-Karte zeigen</button>

<script>
var SPK='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4.03v8.06A4.5 4.5 0 0016.5 12z"/></svg>';
var chat=document.getElementById('chat');

function speak(text, btn){
  try{ window.speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(text); u.lang='es-ES'; u.rate=.95;
    var v=(window.speechSynthesis.getVoices()||[]).find(function(x){return x.lang&&x.lang.indexOf('es')===0;}); if(v)u.voice=v;
    if(btn){btn.classList.add('playing'); u.onend=function(){btn.classList.remove('playing');};}
    window.speechSynthesis.speak(u);
  }catch(e){}
}
// EINE Blase = EIN Gedanke. ziel = aufrecht + 🔊 ; trans = kursiv/gedämpft, kein Audio
function spikiu(ziel, trans){
  var t=document.createElement('div'); t.className='turn spikiu';
  var b=document.createElement('div'); b.className='bubble'; b.appendChild(document.createTextNode(ziel));
  var btn=document.createElement('button'); btn.className='speak-btn'; btn.innerHTML=SPK;
  btn.onclick=function(){ speak(ziel, btn); }; b.appendChild(btn); t.appendChild(b);
  if(trans){ var tr=document.createElement('div'); tr.className='trans'; tr.textContent=trans; t.appendChild(tr); }
  chat.appendChild(t); chat.scrollTop=chat.scrollHeight;
}
function user(text){ var t=document.createElement('div'); t.className='turn user';
  var b=document.createElement('div'); b.className='bubble'; b.textContent=text; t.appendChild(b);
  chat.appendChild(t); chat.scrollTop=chat.scrollHeight; }
function divider(){ var d=document.createElement('div'); d.className='divider'; chat.appendChild(d); }

function render(){
  chat.innerHTML='';
  // ZWEI getrennte Einstiegs-Blasen statt einer Wand mit ---
  spikiu('Vamos a practicar en un café. Yo soy el camarero, tú eres el cliente.',
         'Üben wir im Café. Ich bin der Kellner, du bist der Gast.');
  spikiu('Buenos días, ¿qué le pongo?', 'Guten Tag, was darf ich Ihnen bringen?');
  user('Un café, por favor.');
  spikiu('Muy bien. ¿Café solo, con leche, o cortado?', 'Sehr gut. Kaffee schwarz, mit Milch, oder Cortado?');
  user('Un cortado.');
  spikiu('Aquí tiene. Son dos euros con cincuenta.', 'Hier bitte. Das macht zwei Euro fünfzig.');
}
render();

// Szenenende: KURZER Gruß + Karte (zwei Spalten, KEINE Erklärung). Erklärung käme später in der Lektion (P3).
function showEnd(){
  document.getElementById('endbtn').style.display='none';
  divider();
  spikiu('¡Lo hiciste muy bien! 🐾', 'Das hast du toll gemacht!');
  var kk=document.createElement('div'); kk.className='kk';
  kk.innerHTML =
    '<div class="kk-eyebrow">Für nächstes Mal</div>'+
    '<div class="kk-row kk-head"><div class="h-said">Du hast gesagt</div><div class="h-better">Besser</div></div>';
  var pairs=[
    ['Pagar, por favor.','La cuenta, por favor.'],
    ['Quiero un café con leche grande.','Un café con leche, por favor.']
  ];
  pairs.forEach(function(p){
    var row=document.createElement('div'); row.className='kk-row';
    var said=document.createElement('div'); said.className='kk-cell kk-said'; said.textContent=p[0];
    var bet=document.createElement('div'); bet.className='kk-cell kk-better'; bet.appendChild(document.createTextNode(p[1]));
    var btn=document.createElement('button'); btn.className='speak-btn'; btn.innerHTML=SPK;
    btn.onclick=(function(txt){ return function(){ speak(txt, btn); }; })(p[1]); bet.appendChild(btn);
    row.appendChild(said); row.appendChild(bet); kk.appendChild(row);
  });
  chat.appendChild(kk); chat.scrollTop=chat.scrollHeight;
}
if(window.speechSynthesis){ window.speechSynthesis.onvoiceschanged=function(){}; }
</script>
</body>
</html>
