<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Giros Spielplatz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=DM+Mono:wght@500&family=Lora:wght@500;600&display=swap">
<style>
/* Layout: eine Handy-Säule. Hub = Kartenraster der 7 Spiele, jedes Spiel = eine Bühne im Spikiu-Kartenstil (dicke Tinte, versetzter Schatten). */
:root{
  --bg:#eef7f1; --card:#ffffff; --ink:#15163a; --mid:#5f7068; --faint:#dfe6e0;
  --accent:#1f93b0; --accent-soft:#e3f3f8; --ok:#a8cf5c; --ok-ink:#2f6b3a;
  --warn:#c67a1e; --warn-bg:#fbf0e0; --sun:#ffd24a; --sky:#d3eef6;
  --f-ui:'DM Sans',system-ui,sans-serif; --f-word:'Lora',Georgia,serif; --f-label:'DM Mono',ui-monospace,monospace;
  --ow:2.5px; --sh:4px 5px 0 var(--ink);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12132a; --card:#1c1e3c; --ink:#e9ecf5; --mid:#a5b0c2; --faint:#2f3257;
  --accent:#4fb8d4; --accent-soft:#1d3346; --ok:#7fae3f; --ok-ink:#b9e08a;
  --warn:#e6a04a; --warn-bg:#3a2c1b; --sun:#e9bd3a; --sky:#1d3346; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12132a; --card:#1c1e3c; --ink:#e9ecf5; --mid:#a5b0c2; --faint:#2f3257;
  --accent:#4fb8d4; --accent-soft:#1d3346; --ok:#7fae3f; --ok-ink:#b9e08a;
  --warn:#e6a04a; --warn-bg:#3a2c1b; --sun:#e9bd3a; --sky:#1d3346; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased}
body{padding-inline:16px;padding-block:0 32px}
.wrap{max-width:560px;margin:0 auto}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:14px;padding-block:14px;border-bottom:3px solid var(--ink);margin-bottom:20px}
.back{width:46px;height:46px;flex:none;border-radius:50%;border:var(--ow) solid var(--ink);background:var(--card);color:var(--ink);box-shadow:2px 3px 0 var(--ink);font:800 1.2rem var(--f-ui);cursor:pointer}
.back[hidden]{display:none}
h1{font:800 1.45rem/1.1 var(--f-ui);margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font:500 .72rem var(--f-label);letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin:0}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* Hub */
.intro{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.intro svg{width:62px;height:62px;flex:none}
.intro p{margin:0;font-size:.95rem;line-height:1.45;color:var(--mid)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:380px){.grid{grid-template-columns:1fr}}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);color:var(--ink);border:var(--ow) solid var(--ink);border-radius:18px;box-shadow:var(--sh);padding:14px;cursor:pointer;transition:transform .12s,box-shadow .12s;min-width:0}
.tile:active{transform:translate(3px,4px);box-shadow:1px 1px 0 var(--ink)}
.tile .ic{width:44px;height:44px}
.tile b{font-size:1.02rem}
.tile span{font-size:.82rem;line-height:1.35;color:var(--mid)}
.tag{align-self:flex-start;font:500 .66rem var(--f-label);letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:100px;border:1.5px solid var(--ink)}
.tag.fast{background:var(--sun);color:#15163a;border-color:#15163a}
.tag.calm{background:var(--accent-soft);color:var(--ink)}
.note{margin-top:22px;font-size:.8rem;color:var(--mid);line-height:1.5;border-top:1.5px dashed var(--faint);padding-top:12px}

/* Bühne */
.stage{position:relative;background:var(--card);border:var(--ow) solid var(--ink);border-radius:26px;box-shadow:var(--sh);padding:22px 16px;min-height:470px;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.task{font:500 1.35rem/1.3 var(--f-word);margin:0;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.chip{background:var(--card);color:var(--ink);border:var(--ow) solid var(--ink);border-radius:16px;box-shadow:3px 4px 0 var(--ink);padding:.45rem .95rem;font:500 1.3rem var(--f-word);cursor:pointer;transition:transform .1s,box-shadow .1s,background .2s}
.chip:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.chip.ok{background:var(--ok);color:#15163a}
.chip.no{background:var(--warn-bg);border-color:var(--warn);animation:wob .4s}
.chip.done{pointer-events:none;opacity:.55}
.fb{min-height:1.5em;font-weight:700;font-size:1.1rem;color:var(--ok-ink)}
.fb.soft{color:var(--warn)}
.explain{background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:.95rem;line-height:1.5;text-align:left;width:100%}
.explain em{font-family:var(--f-word);font-style:normal;font-weight:600}
.phrase{font:600 clamp(1.5rem,6.5vw,2rem)/1.25 var(--f-word);text-wrap:balance}
.next{margin-top:auto;align-self:flex-end;background:var(--accent);color:#fff;border:var(--ow) solid var(--ink);border-radius:100px;box-shadow:3px 4px 0 var(--ink);padding:.6rem 1.3rem;font-weight:800;font-size:1.05rem;cursor:pointer}
.big{background:var(--sun);color:#15163a;border:var(--ow) solid #15163a;border-radius:100px;box-shadow:3px 4px 0 var(--ink);padding:.7rem 2rem;font-weight:800;font-size:1.3rem;cursor:pointer}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out both}

/* Piñata & Globos: Physik-Feld */
.field{position:relative;width:100%;flex:1;min-height:380px;border-radius:16px;background:linear-gradient(var(--sky),var(--card) 85%);overflow:hidden;touch-action:manipulation}
.floor{position:absolute;left:0;right:0;bottom:0;height:34px;background:repeating-linear-gradient(90deg,var(--faint) 0 14px,transparent 14px 28px);border-top:2.5px solid var(--ink)}
.flyer{position:absolute;left:0;top:0;will-change:transform;white-space:nowrap;transition:none!important}
.flyer.no{animation:none}
.balloon .b.no{background:var(--warn-bg)!important;border-color:var(--warn)}
.rope{position:absolute;left:50%;top:0;width:2px;height:40px;background:var(--ink)}
.pinata{position:absolute;left:50%;top:36px;width:120px;margin-left:-60px;transform-origin:50% -30px;animation:swing 2.4s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.go{position:absolute;left:50%;bottom:58px;transform:translateX(-50%)}
.conf{position:absolute;width:9px;height:14px;border-radius:2px;pointer-events:none}
.capy-catch{position:absolute;bottom:22px;width:64px;transition:left .5s ease}
.balloon{display:flex;flex-direction:column;align-items:center;cursor:pointer;background:none;border:none;padding:0;color:var(--ink)}
.balloon .b{padding:.55rem .9rem .8rem;border-radius:50% 50% 46% 46%/55% 55% 45% 45%;border:var(--ow) solid #15163a;font:600 1.15rem var(--f-word);color:#15163a;min-width:78px}
.balloon .s{width:2px;height:34px;background:var(--mid)}
.answer{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:44px;width:100%;padding:8px;border:2px dashed var(--faint);border-radius:14px}
.answer .w{font:600 1.15rem var(--f-word)}

/* Tendedero */
.line{position:relative;width:100%;min-height:110px;padding-top:26px}
.line::before{content:"";position:absolute;left:-4px;right:-4px;top:18px;height:22px;border-top:3px solid var(--ink);border-radius:50%/100% 100% 0 0;transform:scaleY(-1)}
.line .hung{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;position:relative}
.cloth{position:relative;background:var(--card);color:var(--ink);border:var(--ow) solid var(--ink);border-radius:6px 6px 14px 14px;padding:.6rem .85rem .5rem;font:600 1.2rem var(--f-word);transform-origin:50% 0}
.cloth::before{content:"";position:absolute;left:50%;top:-12px;width:8px;height:18px;margin-left:-4px;background:var(--capy,#a97c50);border:2px solid var(--ink);border-radius:3px}
.hung .cloth{animation:hang .6s ease-out}
@keyframes hang{0%{transform:rotate(12deg)}50%{transform:rotate(-6deg)}100%{transform:rotate(0)}}
.basket{width:100%;background:var(--warn-bg);border:var(--ow) solid var(--ink);border-radius:10px 10px 30px 30px;padding:16px 10px;background-image:repeating-linear-gradient(45deg,transparent 0 10px,rgba(169,124,80,.18) 10px 12px)}

/* Frankenstein */
.seamrow{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;row-gap:10px}
.seamrow .w{font:600 1.45rem var(--f-word);padding:0 2px}
.gap{width:26px;height:40px;border:none;background:none;cursor:pointer;position:relative;color:var(--mid)}
.gap::after{content:"✂";font-size:.9rem;opacity:.5}
.gap.hit::after{content:"";}
.gap.hit{width:14px;border-left:3px dashed var(--warn);height:44px;margin:0 6px}
.gap.no{animation:wob .4s}
.halves{display:grid;gap:10px;width:100%}
.half{border:2px solid var(--ink);border-radius:12px;padding:10px 12px;text-align:left;font:600 1.1rem var(--f-word)}
.half small{display:block;font:500 .85rem var(--f-ui);color:var(--mid);margin-top:2px}

/* Gemelos */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.pcard{background:var(--card);color:var(--ink);border:var(--ow) solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);padding:.6rem .6rem;font:600 1rem/1.25 var(--f-word);cursor:pointer;min-height:64px}
.pcard.sel{background:var(--sun);color:#15163a}
.pcard.ok{background:var(--ok);color:#15163a;pointer-events:none}
.pcard.no{background:var(--warn-bg);border-color:var(--warn);animation:wob .4s}
.colhead{font:500 .7rem var(--f-label);letter-spacing:.2em;color:var(--mid)}
.opts{display:flex;flex-direction:column;gap:10px;width:100%}
.opt{background:var(--card);color:var(--ink);border:var(--ow) solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);padding:.7rem 1rem;font:500 1.05rem var(--f-ui);text-align:left;cursor:pointer}
.opt.ok{background:var(--ok);color:#15163a}
.opt.no{background:var(--warn-bg);border-color:var(--warn)}
.opt:disabled{cursor:default}
.scene{width:100%;max-width:300px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head><body>
<div class="wrap">
  <header class="bar">
    <button class="back" id="back" hidden aria-label="Zurück zur Übersicht">‹</button>
    <div>
      <p class="eyebrow" id="eyebrow">Giros &amp; Proverbios</p>
      <h1 id="title">Spielplatz</h1>
    </div>
  </header>
  <main id="app"></main>
</div>

<script>
/* ═══ Ein Datensatz, alle Spiele ═══ */
var GIROS = [
  {w:["Tomaten","auf","den","Augen","haben"], cut:3, sentido:"no ver algo que es evidente", es:"no ver más allá de sus narices", intr:"Hund", intrDe:"auf den Hund kommen", bild:"tomaten"},
  {w:["Da","liegt","der","Hund","begraben"], cut:4, sentido:"ahí está el verdadero problema", es:"ahí está el quid", intr:"Katze", intrDe:"die Katze im Sack kaufen", bild:null},
  {w:["Die","Katze","im","Sack","kaufen"], cut:2, sentido:"comprar algo sin haberlo visto", es:"comprar a ciegas", intr:"Daumen", intrDe:"jemandem die Daumen drücken", bild:"katze"},
  {w:["Jemandem","die","Daumen","drücken"], cut:3, sentido:"desearle suerte a alguien", es:"cruzar los dedos por alguien", intr:"Bahnhof", intrDe:"nur Bahnhof verstehen", bild:null},
  {w:["Ich","verstehe","nur","Bahnhof"], cut:3, sentido:"no entiendo nada", es:"me suena a chino", intr:"Wurst", intrDe:"das ist mir Wurst", bild:"bahnhof"},
  {w:["Das","ist","mir","Wurst"], cut:3, sentido:"me da igual", es:"me da lo mismo", intr:"Tomaten", intrDe:"Tomaten auf den Augen haben", bild:"wurst"}
];
var FRANK = [
  {w:["Da","liegt","der","Hund","im","Sack"], seam:4, a:1, b:2},
  {w:["Ich","verstehe","nur","Wurst"], seam:3, a:4, b:5},
  {w:["Jemandem","die","Daumen","auf","den","Augen","haben"], seam:3, a:3, b:0},
  {w:["Die","Katze","begraben"], seam:2, a:2, b:1}
];
function satz(g){ return g.w.join(" "); }
function mezcla(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function el(tag,cls,txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

/* ═══ Spikiu (kanonisch aus chat.html) ═══ */
function capyInner(extra){
  return '<ellipse cx="40" cy="50" rx="28" ry="20" fill="#c9956a"/><ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/>'
  +'<ellipse cx="40" cy="36" rx="10" ry="7" fill="#b8845a"/><ellipse cx="40" cy="33" rx="4" ry="2.5" fill="#8b5e3c"/>'
  +'<circle cx="38" cy="33" r="1" fill="#6b4226"/><circle cx="42" cy="33" r="1" fill="#6b4226"/>'
  +'<circle cx="33" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="47" cy="24" r="3.5" fill="#3d2b1f"/>'
  +'<circle cx="34" cy="23" r="1.2" fill="white"/><circle cx="48" cy="23" r="1.2" fill="white"/>'
  +'<ellipse cx="26" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="54" cy="17" rx="6" ry="5" fill="#b8845a"/>'
  +'<ellipse cx="22" cy="66" rx="7" ry="5" fill="#b8845a"/><ellipse cx="34" cy="68" rx="7" ry="5" fill="#b8845a"/>'
  +'<ellipse cx="46" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="58" cy="66" rx="7" ry="5" fill="#b8845a"/>'
  +(extra&&extra.mouth ? extra.mouth : '<path d="M36 38 Q40 41 44 38" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" fill="none"/>');
}
function capySvg(){ return '<svg viewBox="0 0 80 80" fill="none" aria-hidden="true">'+capyInner()+'</svg>'; }

/* Wörtlich-Szenen: Spikiu nimmt das Bild beim Wort */
function szene(k){
  var ink=css('--ink'), c='';
  var cap='<g transform="translate(20,30) scale(1.35)">';
  if(k==='tomaten'){
    c=cap+capyInner()+'<circle cx="33" cy="24" r="7" fill="#e0412f" stroke="'+ink+'" stroke-width="1.2"/><circle cx="47" cy="24" r="7" fill="#e0412f" stroke="'+ink+'" stroke-width="1.2"/>'
      +'<path d="M30 17l3 3 3-3M44 17l3 3 3-3" stroke="#3f8a3a" stroke-width="2" fill="none" stroke-linecap="round"/></g>'
      +'<text x="170" y="60" font-size="26" fill="'+ink+'" font-family="DM Sans" font-weight="800">?</text>';
  } else if(k==='bahnhof'){
    c=cap+capyInner({mouth:'<path d="M36 39 L44 39" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round"/>'})+'</g>'
      +'<rect x="150" y="50" width="6" height="80" fill="'+ink+'"/><rect x="118" y="26" width="76" height="30" rx="4" fill="#1f5fa8" stroke="'+ink+'" stroke-width="2"/>'
      +'<text x="156" y="46" text-anchor="middle" font-size="13" fill="#fff" font-family="DM Sans" font-weight="800">BAHNHOF</text>'
      +'<text x="38" y="30" font-size="22" fill="'+ink+'" font-family="DM Sans" font-weight="800">? ?</text>';
  } else if(k==='wurst'){
    c=cap+capyInner({mouth:'<path d="M36 39 L44 39" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round"/>'})+'</g>'
      +'<ellipse cx="160" cy="118" rx="36" ry="8" fill="#fff" stroke="'+ink+'" stroke-width="2"/>'
      +'<path d="M132 110 Q160 92 188 110 Q190 116 184 116 Q160 102 136 116 Q130 116 132 110Z" fill="#b5523b" stroke="'+ink+'" stroke-width="2"/>'
      +'<text x="150" y="60" font-size="16" fill="'+ink+'" font-family="DM Sans" font-weight="700">meh.</text>';
  } else if(k==='katze'){
    c=cap+capyInner()+'</g>'
      +'<path d="M130 130 Q124 80 148 70 L176 70 Q200 80 194 130Z" fill="#c9a56b" stroke="'+ink+'" stroke-width="2"/>'
      +'<path d="M146 72 L160 78 L174 72" stroke="'+ink+'" stroke-width="3" fill="none"/>'
      +'<path d="M150 70 L154 56 L160 68 L166 56 L170 70Z" fill="#555" stroke="'+ink+'" stroke-width="1.5"/>'
      +'<circle cx="156" cy="66" r="2" fill="#f5d33a"/><circle cx="165" cy="66" r="2" fill="#f5d33a"/>'
      +'<circle cx="150" cy="100" r="7" fill="#f5d33a" stroke="'+ink+'" stroke-width="1.5"/><text x="150" y="104" text-anchor="middle" font-size="9" fill="#15163a" font-weight="800">€</text>';
  }
  return '<svg class="scene" viewBox="0 0 220 150" role="img" aria-label="Spikiu nimmt die Redewendung wörtlich">'+c+'</svg>';
}

/* Piñata-Stern (mexikanisch, sieben Zacken) */
function pinataSvg(){
  var cols=["#e0412f","#ffd24a","#1f93b0","#a8cf5c","#e87fb6","#f08a2c","#8a5cc4"], s='';
  for(var i=0;i<7;i++){ var a=i*2*Math.PI/7-Math.PI/2, x=60+Math.cos(a)*58, y=62+Math.sin(a)*58,
    l=60+Math.cos(a-.28)*26, lt=62+Math.sin(a-.28)*26, r=60+Math.cos(a+.28)*26, rt=62+Math.sin(a+.28)*26;
    s+='<path d="M'+l+' '+lt+' L'+x+' '+y+' L'+r+' '+rt+'Z" fill="'+cols[i]+'" stroke="#15163a" stroke-width="2"/>';
    s+='<path d="M'+x+' '+y+' l-4 10 M'+x+' '+y+' l4 10" stroke="'+cols[(i+2)%7]+'" stroke-width="2.5"/>'; }
  s+='<circle cx="60" cy="62" r="30" fill="#ffd24a" stroke="#15163a" stroke-width="2.5"/>'
   +'<path d="M34 54 H86 M31 64 H89 M34 74 H86" stroke="#e0412f" stroke-width="3"/>'
   +'<circle cx="52" cy="58" r="3" fill="#15163a"/><circle cx="68" cy="58" r="3" fill="#15163a"/>'
   +'<path d="M53 68 Q60 73 67 68" stroke="#15163a" stroke-width="2" fill="none"/>';
  return '<svg viewBox="0 0 120 130" aria-hidden="true">'+s+'</svg>';
}

/* ═══ Spiele-Register ═══ */
var SPIELE = [
  {id:"pinata", t:"La piñata", d:"Revienta la piñata y toca al intruso antes de que caiga.", tag:"fast", run:pinata},
  {id:"globos", t:"Globos", d:"Los globos suben. Revienta las palabras en orden.", tag:"fast", run:globos},
  {id:"tendedero", t:"El tendedero", d:"Cuelga las palabras en el orden correcto.", tag:"calm", run:tendedero},
  {id:"literal", t:"Al pie de la letra", d:"Spikiu lo toma literal. ¿Qué significa de verdad?", tag:"calm", run:literal},
  {id:"frankenstein", t:"Frankenstein", d:"Dos giros cosidos. Toca la costura.", tag:"calm", run:frankenstein},
  {id:"mitad", t:"La otra mitad", d:"El comienzo está. Elige el final auténtico.", tag:"calm", run:mitad},
  {id:"gemelos", t:"Gemelos DE ↔ ES", d:"Une cada giro alemán con su gemelo en español.", tag:"calm", run:gemelos}
];
var ICONS = {
  pinata:'<svg viewBox="0 0 44 44"><path d="M22 2v8" stroke="currentColor" stroke-width="2"/><circle cx="22" cy="24" r="10" fill="#ffd24a" stroke="currentColor" stroke-width="2"/><path d="M22 14l-3-4h6zM32 24l4-3v6zM12 24l-4-3v6zM22 34l-3 4h6z" fill="#e0412f" stroke="currentColor" stroke-width="1.5"/></svg>',
  globos:'<svg viewBox="0 0 44 44"><ellipse cx="16" cy="15" rx="9" ry="11" fill="#e87fb6" stroke="currentColor" stroke-width="2"/><ellipse cx="29" cy="19" rx="9" ry="11" fill="#1f93b0" stroke="currentColor" stroke-width="2"/><path d="M16 26q2 8 0 16M29 30q-2 6 0 12" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>',
  tendedero:'<svg viewBox="0 0 44 44"><path d="M2 10q20 10 40 0" stroke="currentColor" stroke-width="2" fill="none"/><path d="M8 14h10v14l-5 3-5-3z" fill="#ffd24a" stroke="currentColor" stroke-width="2"/><path d="M24 15h12v12H24z" fill="#a8cf5c" stroke="currentColor" stroke-width="2"/></svg>',
  literal:'<svg viewBox="0 0 44 44"><circle cx="22" cy="24" r="14" fill="#c9956a" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="21" r="5" fill="#e0412f" stroke="currentColor" stroke-width="1.5"/><circle cx="28" cy="21" r="5" fill="#e0412f" stroke="currentColor" stroke-width="1.5"/></svg>',
  frankenstein:'<svg viewBox="0 0 44 44"><rect x="4" y="12" width="17" height="20" rx="3" fill="#1f93b0" stroke="currentColor" stroke-width="2"/><rect x="23" y="12" width="17" height="20" rx="3" fill="#a8cf5c" stroke="currentColor" stroke-width="2"/><path d="M22 8v28M19 14h6M19 20h6M19 26h6M19 32h6" stroke="#c67a1e" stroke-width="2"/></svg>',
  mitad:'<svg viewBox="0 0 44 44"><rect x="3" y="14" width="22" height="16" rx="4" fill="#ffd24a" stroke="currentColor" stroke-width="2"/><rect x="27" y="14" width="14" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"/></svg>',
  gemelos:'<svg viewBox="0 0 44 44"><rect x="3" y="8" width="16" height="12" rx="3" fill="#1f93b0" stroke="currentColor" stroke-width="2"/><rect x="25" y="24" width="16" height="12" rx="3" fill="#e0412f" stroke="currentColor" stroke-width="2"/><path d="M19 14q10 0 12 10" stroke="currentColor" stroke-width="2" fill="none"/></svg>'
};

var app=document.getElementById('app'), stopFn=null;
function limpiar(){ if(stopFn){stopFn();stopFn=null;} app.innerHTML=''; }
function hub(){
  limpiar();
  document.getElementById('back').hidden=true;
  document.getElementById('title').textContent='Spielplatz';
  var intro=el('div','intro'); intro.innerHTML=capySvg();
  var p=el('p',null,'Siete juegos pequeños con los mismos seis giros alemanes. Sin puntos, sin rachas: juegas lo que te apetece y paras cuando quieras.');
  intro.appendChild(p); app.appendChild(intro);
  var g=el('div','grid');
  SPIELE.forEach(function(s){
    var b=el('button','tile'); b.innerHTML='<span class="ic" style="color:var(--ink)">'+ICONS[s.id]+'</span>';
    b.appendChild(el('b',null,s.t)); b.appendChild(el('span',null,s.d));
    b.appendChild(el('i','tag '+s.tag, s.tag==='fast'?'con ritmo':'tranquilo'));
    b.addEventListener('click',function(){ location.hash=s.id; });
    g.appendChild(b);
  });
  app.appendChild(g);
  var n=el('p','note','Prototipo. Datos de ejemplo: seis giros alemanes para hispanohablantes. Todos los juegos leen del mismo registro (frase, sentido, intruso y su giro, gemelo en español).');
  app.appendChild(n);
}
function abrir(id){
  var s=SPIELE.filter(function(x){return x.id===id;})[0]; if(!s){hub();return;}
  limpiar();
  document.getElementById('back').hidden=false;
  document.getElementById('title').textContent=s.t;
  s.run(0);
  scrollTo(0,0);
}
document.getElementById('back').addEventListener('click',function(){ location.hash=''; });
window.addEventListener('hashchange',router);
function router(){ var h=(window.location.hash||'').slice(1); if(h) abrir(h); else hub(); }

function buehne(taskTxt){
  var st=el('section','stage');
  st.appendChild(el('p','eyebrow','Ejercicio'));
  if(taskTxt) st.appendChild(el('p','task',taskTxt));
  app.appendChild(st); return st;
}
function weiter(st,fn,i,max){
  var b=el('button','next','seguir ›'); b.addEventListener('click',function(){ limpiar(); fn((i+1)%max); }); st.appendChild(b); return b;
}
function erklaerung(g,extra){
  var d=el('div','explain pop');
  d.innerHTML='<em>'+satz(g)+'</em> = '+g.sentido+'.'+(extra||'');
  return d;
}

/* ─── 1. Piñata ─── */
function pinata(i){
  var g=GIROS[i], st=buehne('¡Dale! Toca al intruso en el aire.');
  var f=el('div','field'); st.appendChild(f);
  f.appendChild(el('div','floor'));
  var rope=el('div','rope'); f.appendChild(rope);
  var pin=el('div','pinata'); pin.innerHTML=pinataSvg(); f.appendChild(pin);
  var capy=el('div','capy-catch'); capy.innerHTML=capySvg(); capy.style.left='calc(50% - 32px)'; f.appendChild(capy);
  var fb=el('div','fb'); st.appendChild(fb);
  var go=el('button','big go','¡Dale!'); f.appendChild(go);
  var parts=[], raf=0, fertig=false, last=0;
  function loop(ts){
    var dt=last?Math.min(40,ts-last)/16:1; last=ts;
    var W=f.clientWidth, H=f.clientHeight-34;
    parts.forEach(function(p){
      if(p.dead) return;
      p.vy=Math.min(p.vy+0.09*dt, p.conf?2.4:1.15); p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=Math.pow(.995,dt); p.r+=p.vr*dt;
      var w=p.e.offsetWidth, h=p.e.offsetHeight;
      if(p.x<0){p.x=0;p.vx=Math.abs(p.vx);} if(p.x+w>W){p.x=W-w;p.vx=-Math.abs(p.vx);}
      if(p.y+h>=H){ p.y=H-h; p.vy=0; p.vx=0; p.vr=0; p.r*=.5;
        if(p.conf){ p.dead=true; p.e.style.opacity='.35'; }
        else if(!p.landed){ p.landed=true; if(p.intr && !fertig) gefangen(p); } }
      p.e.style.transform='translate('+p.x+'px,'+p.y+'px) rotate('+p.r+'deg)';
    });
    if(!fertig || parts.some(function(p){return !p.dead && !p.landed && p.vy>0;})) raf=requestAnimationFrame(loop);
  }
  stopFn=function(){ cancelAnimationFrame(raf); };
  go.addEventListener('click',function(){
    go.remove(); pin.remove(); rope.remove();
    var W=f.clientWidth, cx=W/2, cy=100, cols=["#e0412f","#ffd24a","#1f93b0","#a8cf5c","#e87fb6","#f08a2c"];
    for(var k=0;k<26;k++){ var c=el('div','conf'); c.style.background=cols[k%6]; f.appendChild(c);
      parts.push({e:c,conf:true,x:cx,y:cy,vx:(Math.random()-.5)*7,vy:-2-Math.random()*3,r:0,vr:(Math.random()-.5)*14}); }
    mezcla(g.w.concat([g.intr])).forEach(function(w){
      var b=el('button','chip flyer',w); f.appendChild(b);
      var p={e:b,x:cx-b.offsetWidth/2,y:cy,vx:(Math.random()-.5)*5,vy:-2.6-Math.random()*1.6,r:(Math.random()-.5)*20,vr:(Math.random()-.5)*1.2,intr:w===g.intr};
      parts.push(p);
      b.addEventListener('click',function(){
        if(fertig) return;
        if(p.intr){ b.classList.add('ok'); fb.className='fb'; fb.textContent='¡Correcto! '+w+' no encaja.'; ende(p); }
        else { b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); fb.className='fb soft'; fb.textContent='Esta sí pertenece. Busca otra.'; }
      });
    });
    last=0; raf=requestAnimationFrame(loop);
  });
  function gefangen(p){
    capy.style.left=Math.max(0,p.x-10)+'px';
    fb.className='fb soft'; fb.textContent='Spikiu lo atrapó: el intruso era '+g.intr+'.';
    p.e.classList.add('ok'); ende(p);
  }
  function ende(p){
    fertig=true; p.dead=true;
    setTimeout(function(){
      parts.forEach(function(q){ if(!q.conf && q!==p){ q.e.style.transition='opacity .4s'; q.e.style.opacity='0'; } });
      var ph=el('div','phrase pop',satz(g)); st.insertBefore(ph,fb.nextSibling);
      st.insertBefore(erklaerung(g,'<br><em>'+g.intr+'</em> viene de otro giro: <em>'+g.intrDe+'</em>.'),ph.nextSibling);
      weiter(st,pinata,i,GIROS.length);
    },900);
  }
}

/* ─── gemeinsamer Ordnungs-Motor (Globos, Tendedero) ─── */
function ordnung(g,ans,fb,onOk,onDone){
  var n=0;
  return function(word,node){
    if(word===g.w[n]){ ans.appendChild(el('span','w pop',word)); onOk(node); n++;
      if(n===g.w.length){ fb.className='fb'; fb.textContent='¡Así se dice!'; onDone(); } else { fb.textContent=''; }
      return true; }
    fb.className='fb soft'; fb.textContent= n===0 ? 'Empieza por la primera palabra.' : 'Casi. ¿Qué viene después de «'+g.w[n-1]+'»?';
    return false;
  };
}

/* ─── 2. Globos ─── */
function globos(i){
  var g=GIROS[i], st=buehne('Revienta los globos en el orden de la frase.');
  var ans=el('div','answer'); st.appendChild(ans);
  var f=el('div','field'); st.appendChild(f);
  var fb=el('div','fb'); st.appendChild(fb);
  var cols=["#ffd24a","#a8cf5c","#e87fb6","#8fd0e3","#f3a65a","#c4a8ec"], bs=[], raf=0, t0=0, done=false;
  var tap=ordnung(g,ans,fb,function(b){ b.dead=true; b.e.style.transition='transform .2s,opacity .2s'; b.e.style.opacity='0'; },function(){ done=true; st.appendChild(erklaerung(g)); weiter(st,globos,i,GIROS.length); });
  mezcla(g.w).forEach(function(w,k){
    var b=el('button','balloon flyer'); b.innerHTML='<span class="b" style="background:'+cols[k%6]+'"></span><span class="s"></span>';
    b.firstChild.textContent=w; f.appendChild(b);
    var o={e:b,w:w,x:0,y:0,sp:.45+Math.random()*.35,ph:Math.random()*6,k:k};
    bs.push(o);
    b.addEventListener('click',function(){ if(o.dead||done) return; if(!tap(w,o)){ var bb=b.firstChild; bb.classList.add('no'); setTimeout(function(){bb.classList.remove('no');},450); } });
  });
  function place(o,first){ var W=f.clientWidth, H=f.clientHeight; o.bx=16+Math.random()*Math.max(10,W-o.e.offsetWidth-32); o.y=first? H*0.35+o.k*55 : H+10; }
  bs.forEach(function(o){place(o,true);});
  function loop(ts){ if(!t0) t0=ts; var t=(ts-t0)/1000;
    bs.forEach(function(o){ if(o.dead) return; o.y-=o.sp; if(o.y< -o.e.offsetHeight) place(o,false);
      o.x=o.bx+Math.sin(t*1.3+o.ph)*14; o.e.style.transform='translate('+o.x+'px,'+o.y+'px)'; });
    raf=requestAnimationFrame(loop); }
  raf=requestAnimationFrame(loop);
  stopFn=function(){ cancelAnimationFrame(raf); };
}

/* ─── 3. Tendedero ─── */
function tendedero(i){
  var g=GIROS[i], st=buehne('Cuelga la ropa en el orden de la frase.');
  var line=el('div','line'), hung=el('div','hung'); line.appendChild(hung); st.appendChild(line);
  var fb=el('div','fb'); st.appendChild(fb);
  var basket=el('div','basket'), ch=el('div','chips'); basket.appendChild(ch); st.appendChild(basket);
  var sink=el('div'); sink.hidden=true;
  var tap=ordnung(g,sink,fb,function(b){ b.remove(); hung.appendChild(el('span','cloth',b.textContent)); },function(){ basket.remove(); st.appendChild(erklaerung(g)); weiter(st,tendedero,i,GIROS.length); });
  mezcla(g.w).forEach(function(w){ var b=el('button','chip',w); ch.appendChild(b);
    b.addEventListener('click',function(){ if(!tap(w,b)){ b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); } }); });
}

/* ─── 4. Al pie de la letra ─── */
function literal(i){
  var pool=GIROS.filter(function(x){return x.bild;}), g=pool[i%pool.length];
  var st=buehne(null);
  st.insertAdjacentHTML('beforeend',szene(g.bild));
  st.appendChild(el('div','phrase',satz(g)));
  st.appendChild(el('p','task','Spikiu lo entendió al pie de la letra. ¿Qué significa de verdad?'));
  var o=el('div','opts'); st.appendChild(o); var fb=el('div','fb'); st.appendChild(fb);
  var otros=mezcla(GIROS.filter(function(x){return x!==g;})).slice(0,2);
  mezcla([g].concat(otros)).forEach(function(x){
    var b=el('button','opt',x.sentido); o.appendChild(b);
    b.addEventListener('click',function(){
      if(x===g){ b.classList.add('ok'); fb.className='fb'; fb.textContent='¡Eso es! En español: '+g.es+'.';
        o.querySelectorAll('button').forEach(function(z){z.disabled=true;}); weiter(st,literal,i,pool.length); }
      else { b.classList.add('no'); b.disabled=true; fb.className='fb soft'; fb.textContent='Ese sentido es de «'+satz(x)+'».'; }
    });
  });
}

/* ─── 5. Frankenstein ─── */
function frankenstein(i){
  var fr=FRANK[i], st=buehne('Aquí se cosieron dos giros. Toca la costura.');
  var row=el('div','seamrow'); st.appendChild(row);
  var fb=el('div','fb'); st.appendChild(fb); var solved=false;
  fr.w.forEach(function(w,k){
    if(k>0){ var gp=el('button','gap'); gp.setAttribute('aria-label','Costura antes de '+w);
      (function(pos,gp){ gp.addEventListener('click',function(){
        if(solved) return;
        if(pos===fr.seam){ solved=true; gp.classList.add('hit'); fb.className='fb'; fb.textContent='¡Ahí está la costura!';
          var hv=el('div','halves pop'); [fr.a,fr.b].forEach(function(ix){ var x=GIROS[ix], h=el('div','half',satz(x)); h.appendChild(el('small',null,x.sentido)); hv.appendChild(h); });
          st.appendChild(hv); weiter(st,frankenstein,i,FRANK.length);
          row.querySelectorAll('.gap:not(.hit)').forEach(function(z){z.style.visibility='hidden';});
        } else { gp.classList.remove('no'); void gp.offsetWidth; gp.classList.add('no'); fb.className='fb soft'; fb.textContent='Aquí todavía es el mismo giro.'; }
      }); })(k,gp);
      row.appendChild(gp); }
    row.appendChild(el('span','w',w));
  });
}

/* ─── 6. La otra mitad ─── */
function mitad(i){
  var g=GIROS[i], st=buehne('¿Cómo termina el giro?');
  var anfang=g.w.slice(0,g.cut).join(' '), ende=function(x){return x.w.slice(x.cut).join(' ');};
  st.appendChild(el('div','phrase',anfang+' …'));
  var o=el('div','opts'); st.appendChild(o); var fb=el('div','fb'); st.appendChild(fb);
  var otros=mezcla(GIROS.filter(function(x){return x!==g;})).slice(0,2);
  mezcla([g].concat(otros)).forEach(function(x){
    var b=el('button','opt','… '+ende(x)); b.style.fontFamily='var(--f-word)'; b.style.fontSize='1.2rem'; o.appendChild(b);
    b.addEventListener('click',function(){
      if(x===g){ b.classList.add('ok'); o.querySelectorAll('button').forEach(function(z){z.disabled=true;});
        fb.className='fb'; fb.textContent='¡Correcto!'; st.appendChild(erklaerung(g)); weiter(st,mitad,i,GIROS.length); }
      else { b.classList.add('no'); b.disabled=true; fb.className='fb soft'; fb.textContent='Ese final es de «'+satz(x)+'».'; }
    });
  });
}

/* ─── 7. Gemelos ─── */
function gemelos(i){
  var set=[0,1,2,3,4,5].map(function(k){return GIROS[(k+i*2)%6];}).slice(0,4);
  var st=buehne('Une cada giro con su gemelo.');
  var pr=el('div','pairs'), L=el('div','col'), R=el('div','col');
  L.appendChild(el('div','colhead','DEUTSCH')); R.appendChild(el('div','colhead','ESPAÑOL'));
  pr.appendChild(L); pr.appendChild(R); st.appendChild(pr);
  var fb=el('div','fb'); st.appendChild(fb);
  var selL=null, selR=null, left=set.length;
  function check(){
    if(!selL||!selR) return;
    var a=selL, b=selR; selL=selR=null;
    if(a.g===b.g){ a.e.className='pcard ok'; b.e.className='pcard ok'; fb.className='fb'; fb.textContent=satz(a.g)+' = '+a.g.es;
      if(--left===0){ fb.textContent='¡Todos los gemelos juntos!'; weiter(st,gemelos,i,3); } }
    else { [a,b].forEach(function(x){ x.e.className='pcard no'; setTimeout(function(){ x.e.className='pcard'; },450); });
      fb.className='fb soft'; fb.textContent='No son gemelos. Prueba otra pareja.'; }
  }
  function card(col,txt,g,side){
    var e=el('button','pcard',txt); col.appendChild(e); var o={e:e,g:g};
    e.addEventListener('click',function(){
      if(side==='L'){ if(selL) selL.e.className='pcard'; selL=o; } else { if(selR) selR.e.className='pcard'; selR=o; }
      e.className='pcard sel'; check();
    });
  }
  set.forEach(function(g){ card(L,satz(g),g,'L'); });
  mezcla(set).forEach(function(g){ card(R,g.es,g,'R'); });
}

router();
