<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spikiu · Proverbios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#ffffff; --bg:#faf9f7; --bg2:#f3f1ee; --ink:#1c1917; --mid:#78716c;
    --faint:#e7e5e4; --warm:#d6cfc8; --accent:#2d6a4f; --accent2:#e8f5ee; --accent3:#1f5239;
    --capy:#a97c50; --gold:#a07830;
    --trans-bg:#f1eee8; --trans-ink:#8a847d; --trans-border:#e2ddd4;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'DM Sans',system-ui,sans-serif;
    display:flex; flex-direction:column; min-height:100dvh;
    padding-bottom:calc(var(--spk-navh,74px) + env(safe-area-inset-bottom)); -webkit-font-smoothing:antialiased; }
  .app{ flex:1; display:flex; flex-direction:column; min-height:0; max-width:680px; width:100%; margin:0 auto; }

  /* Horizontales Tinder-Deck: eine Karte pro Screen, andere abseits. */
  .deck{ flex:1; position:relative; overflow:hidden; min-height:0; }
  .card{ position:absolute; inset:0; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:1rem; padding:1.6rem 1.4rem 1.4rem; overflow-y:auto;
    transform:translateX(110%); opacity:0; pointer-events:none;
    transition:transform .38s cubic-bezier(.4,0,.2,1), opacity .38s ease; will-change:transform,opacity; }
  .card.deck-current{ transform:translateX(0) rotate(0); opacity:1; pointer-events:auto; z-index:2; }
  .card.deck-next{ transform:translateX(110%) rotate(1.4deg); opacity:0; z-index:1; }
  .card.deck-past{ transform:translateX(-110%) rotate(-1.4deg); opacity:0; z-index:1; }

  /* Proverbio-Karte */
  .prov-capy-row{ display:flex; align-items:flex-end; gap:0.15rem; }
  .prov-capy{ width:72px; height:72px; transform-origin:center bottom; animation:provBreathe 4.2s ease-in-out infinite; }
  .prov-capy svg{ width:100%; height:100%; display:block; overflow:visible; }
  .prov-prop{ font-size:1.5rem; transform:translateY(-6px) rotate(-8deg); }
  @keyframes provBreathe{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.045);} }
  .prov-eyebrow{ font-size:0.7rem; font-weight:700; letter-spacing:0.13em; text-transform:uppercase; color:var(--gold); }
  .prov-text{ font-family:'Lora',serif; font-size:clamp(1.45rem,5vw,2rem); line-height:1.4; color:var(--ink); max-width:20rem; }
  .prov-speak{ width:44px; height:44px; border:none; border-radius:50%; cursor:pointer; background:var(--accent2); color:var(--accent);
    display:flex; align-items:center; justify-content:center; transition:0.16s; -webkit-tap-highlight-color:transparent; }
  .prov-speak:hover{ background:var(--accent); color:var(--white); }
  .prov-speak svg{ width:20px; height:20px; }
  .prov-speak.playing{ animation:provPulse 1s ease infinite; }
  .prov-speak.loading svg{ display:none; }
  .prov-speak.loading::after{ content:''; width:16px; height:16px; border:2.5px solid var(--warm); border-top-color:var(--accent); border-radius:50%; animation:provSpin 0.7s linear infinite; }
  @keyframes provPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.12);} }
  @keyframes provSpin{ to{ transform:rotate(360deg);} }
  .prov-trans{ font-style:italic; font-size:0.95rem; color:var(--mid); max-width:19rem; }
  .prov-src{ font-size:0.74rem; color:#9a948c; letter-spacing:0.02em; }

  /* Übungs-Karte */
  .ueb-eyebrow{ font-size:0.7rem; font-weight:700; letter-spacing:0.13em; text-transform:uppercase; color:var(--accent); }

  .card-hint{ position:absolute; left:0; right:0; bottom:0.8rem; font-size:0.78rem; color:var(--warm); font-weight:500;
    animation:provNudge 1.8s ease-in-out infinite; }
  @keyframes provNudge{ 0%,100%{ transform:translateX(0); opacity:0.7;} 50%{ transform:translateX(-5px); opacity:1;} }

  /* Deck-Navigation (Daumen primär; Knöpfe als Hilfe) */
  .deck-nav{ flex:0 0 auto; display:flex; justify-content:space-between; gap:0.8rem; padding:0.7rem 1.25rem 1rem; }
  .deck-btn{ background:none; border:1.5px solid var(--faint); color:var(--mid); border-radius:100px; padding:0.55rem 1.1rem;
    font-family:'DM Sans',sans-serif; font-size:0.88rem; font-weight:600; cursor:pointer; transition:0.16s; -webkit-tap-highlight-color:transparent; }
  .deck-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .deck-btn:disabled{ opacity:0.4; cursor:default; }
  .deck-btn.fwd{ border-color:var(--accent); color:var(--accent); }
  .deck-btn.fwd:hover{ background:var(--accent); color:var(--white); }
  @media (prefers-reduced-motion: reduce){ .prov-capy{ animation:none; } .card-hint{ animation:none; } }
</style>
</head>
<body>

<div class="app">
  <div class="deck" id="deck"></div>
  <div class="deck-nav">
    <button class="deck-btn" type="button" id="btnBack">‹ <span id="btnBackLbl">zurück</span></button>
    <button class="deck-btn fwd" type="button" id="btnFwd"><span id="btnFwdLbl">weiter</span> ›</button>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════
//  SPIKIU · RAUM „PROVERBIOS" (Teil 51) — Tinder-Deck OHNE KI.
//  Feste DB (sprichwort.js) → Proverbio → Übung (uebung.js) → Proverbio → …
//  Daumen LINKS = weiter, RECHTS = zurück (echter Verlauf). Anti-Gamification.
//  Reuse: sprichwort.js (DB), uebung.js (Übungs-Motor), audio.js (🔊), capy-vivo.js (lebendig), nav.js.
// ════════════════════════════════════════════════════════════════════

// ── Profil defensiv (Codes de/es/en/el — 1:1 wie chat.html) ──
var stored = {};
try { stored = (JSON.parse(localStorage.getItem('spikiu_user')||'{}').profile) || {}; } catch(e){}
function langCode(v){
  if(!v) return null; v=(''+v).toLowerCase();
  if(/^(de|es|en|el)$/.test(v)) return v;
  if(v.indexOf('deutsch')>-1||v.indexOf('german')>-1) return 'de';
  if(v.indexOf('span')>-1||v.indexOf('español')>-1) return 'es';
  if(v.indexOf('engl')>-1) return 'en';
  if(v.indexOf('griech')>-1||v.indexOf('greek')>-1) return 'el';
  return null;
}
var zielC = stored.zielsprache || langCode(stored.targetLang) || 'es';
var mutterC = stored.muttersprache || langCode(stored.nativeLang) || 'de';
var PROFILE = { zielsprache: zielC, muttersprache: mutterC, koennen: stored.koennen || 'anfang' };
function uiLang(){ return (['de','es','en'].indexOf(PROFILE.muttersprache) > -1) ? PROFILE.muttersprache : 'de'; }

var UI = {
  de:{ eyebrow:'Sprichwörter', uebung:'Übung', back:'zurück', fwd:'weiter', hintFwd:'← weiter wischen' },
  es:{ eyebrow:'Proverbios',   uebung:'Ejercicio', back:'atrás', fwd:'seguir', hintFwd:'← desliza para seguir' },
  en:{ eyebrow:'Proverbs',     uebung:'Exercise', back:'back', fwd:'next', hintFwd:'← swipe to continue' }
};
function ui(){ return UI[uiLang()] || UI.de; }

var SPK_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4.03v8.06A4.5 4.5 0 0016.5 12z"/></svg>';
var CAPY_SVG = '<svg viewBox="0 0 80 80" fill="none">'
  + '<ellipse cx="40" cy="50" rx="28" ry="20" fill="#c9956a"/><ellipse cx="40" cy="28" rx="18" ry="15" fill="#c9956a"/>'
  + '<ellipse cx="40" cy="36" rx="10" ry="7" fill="#b8845a"/><ellipse cx="40" cy="33" rx="4" ry="2.5" fill="#8b5e3c"/>'
  + '<circle cx="38" cy="33" r="1" fill="#6b4226"/><circle cx="42" cy="33" r="1" fill="#6b4226"/>'
  + '<g class="spk-capy-eyes"><circle cx="33" cy="24" r="3.5" fill="#3d2b1f"/><circle cx="47" cy="24" r="3.5" fill="#3d2b1f"/>'
  + '<circle cx="34" cy="23" r="1.2" fill="white"/><circle cx="48" cy="23" r="1.2" fill="white"/></g>'
  + '<ellipse cx="26" cy="17" rx="6" ry="5" fill="#b8845a"/><ellipse cx="54" cy="17" rx="6" ry="5" fill="#b8845a"/>'
  + '<ellipse cx="22" cy="66" rx="7" ry="5" fill="#b8845a"/><ellipse cx="34" cy="68" rx="7" ry="5" fill="#b8845a"/>'
  + '<ellipse cx="46" cy="68" rx="7" ry="5" fill="#b8845a"/><ellipse cx="58" cy="66" rx="7" ry="5" fill="#b8845a"/>'
  + '<path class="spk-capy-mouth" d="M36 38 Q40 41 44 38" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>';
function escPlain(t){ return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Audio (🔊) ──
var voiceReady = false;
function warmVoice(){ if (!window.spkWarm) return; try { var p = window.spkWarm(PROFILE.zielsprache); if (p && p.then) p.then(function(){ voiceReady = true; }, function(){}); } catch(e){} }
function speakText(text){
  if (window.spkSpeak){ try { return window.spkSpeak(text, PROFILE.zielsprache); } catch(e){} }
  try { var s = window.speechSynthesis;
    if (s && typeof SpeechSynthesisUtterance !== 'undefined'){
      var bcp = { de:'de-DE', es:'es-ES', en:'en-US', el:'el-GR' }[PROFILE.zielsprache] || 'en-US';
      var u = new SpeechSynthesisUtterance(String(text)); u.lang = bcp; s.cancel(); s.speak(u);
    } } catch(e){}
}
function playFrom(btn, text){
  var loading = !voiceReady; if (btn){ btn.classList.add(loading ? 'loading' : 'playing'); }
  var fin = function(){ voiceReady = true; if (btn){ btn.classList.remove('loading'); btn.classList.remove('playing'); } };
  var p = speakText(text); if (p && p.then){ p.then(fin, fin); } else { setTimeout(fin, 1400); }
}

// ── Feste DB aus sprichwort.js (Zielsprache + Übersetzung in der Muttersprache) ──
var LIST = [];   // [{ text, translation, src }]
function buildList(){
  var out = [];
  if (typeof window.spikiuSprichwort === 'function' && window.spikiuSprichwort.daten){
    var raw = window.spikiuSprichwort.daten[PROFILE.zielsprache] || window.spikiuSprichwort.daten.es || [];
    for (var i=0;i<raw.length;i++){
      var p = raw[i];
      var tr = (p.t && (p.t[PROFILE.muttersprache] || p.t.de || p.t.en || p.t.es)) || '';
      out.push({ text: p.text, translation: tr, src: p.src });
    }
  }
  return out;
}

// ── Deck mit echtem Verlauf: Schritte (Karten) + Zeiger ──
// gerader Index = Proverbio, ungerader = Übung zum vorigen Proverbio.
var deck = document.getElementById('deck');
var stepEls = [];
var pointer = 0;

function deckLayout(){
  for (var i=0;i<stepEls.length;i++){
    var c = stepEls[i]; if (!c) continue;
    c.classList.remove('deck-current','deck-past','deck-next');
    c.classList.add(i < pointer ? 'deck-past' : (i === pointer ? 'deck-current' : 'deck-next'));
  }
  var b = document.getElementById('btnBack'); if (b) b.disabled = pointer <= 0;
}

function makeProverbCard(provI){
  var prov = LIST[provI] || { text:'', translation:'', src:'' };
  var card = document.createElement('div'); card.className = 'card prov';
  card.innerHTML =
      '<div class="prov-capy-row"><div class="prov-capy" aria-hidden="true">' + CAPY_SVG + '</div><span class="prov-prop" aria-hidden="true">📜</span></div>'
    + '<div class="prov-eyebrow">' + escPlain(ui().eyebrow) + '</div>'
    + '<div class="prov-text">' + escPlain(prov.text) + '</div>'
    + '<button class="prov-speak" type="button" aria-label="Vorlesen">' + SPK_ICON + '</button>'
    + '<div class="prov-trans">' + escPlain(prov.translation) + '</div>'
    + '<div class="prov-src">' + (prov.src ? '— ' + escPlain(prov.src) : '') + '</div>'
    + '<div class="card-hint">' + escPlain(ui().hintFwd) + '</div>';
  var sb = card.querySelector('.prov-speak');
  if (sb) sb.onclick = function(){ playFrom(sb, prov.text); };
  var svg = card.querySelector('.prov-capy svg');
  if (svg && typeof window.spkCapyAlive === 'function') window.spkCapyAlive(svg);
  return card;
}

function makeUebungCard(provI){
  var prov = LIST[provI] || { text:'', translation:'', src:'' };
  // mean = richtige Übersetzung + 2 fremde Übersetzungen (Distraktoren) — datengetrieben.
  var others = [];
  for (var k=0;k<LIST.length;k++){ if (k !== provI && LIST[k].translation) others.push(LIST[k].translation); }
  window.spikiuUebung.shuffle(others);
  var mean = [prov.translation, others[0] || '', others[1] || ''].filter(Boolean);
  var item = { text: prov.text, tr: prov.translation, mean: mean, lang: PROFILE.zielsprache, nativeLang: uiLang() };
  var types = window.spikiuUebung.types;
  var type = types[Math.floor(Math.random() * types.length)];

  var card = document.createElement('div'); card.className = 'card ueb-card';
  var eb = document.createElement('div'); eb.className = 'ueb-eyebrow'; eb.textContent = ui().uebung;
  card.appendChild(eb);
  card.appendChild(window.spikiuUebung(item, type));
  var hint = document.createElement('div'); hint.className = 'card-hint'; hint.textContent = ui().hintFwd;
  card.appendChild(hint);
  return card;
}

function ensureStep(i){
  if (i < 0) return null;
  if (stepEls[i]) return stepEls[i];
  if (!LIST.length) return null;
  var provI = Math.floor(i / 2) % LIST.length;
  var card = (i % 2 === 0) ? makeProverbCard(provI) : makeUebungCard(provI);
  stepEls[i] = card; deck.appendChild(card); deckLayout();
  return card;
}
function forward(){ pointer++; ensureStep(pointer); deckLayout(); }
function back(){ if (pointer > 0){ pointer--; deckLayout(); } }

// ── Daumen: links = weiter, rechts = zurück (+ Knöpfe als Hilfe) ──
function bindSwipe(){
  var x0 = null, y0 = null;
  deck.addEventListener('touchstart', function(e){ var t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; }, { passive:true });
  deck.addEventListener('touchend', function(e){
    if (x0 == null) return;
    var t = e.changedTouches[0]; var dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if (Math.abs(dx) < 45 || Math.abs(dy) > Math.abs(dx)) return;   // nur klar horizontale Wische
    if (dx < 0) forward(); else back();                            // links = weiter, rechts = zurück
  }, { passive:true });
}

document.getElementById('btnBack').onclick = back;
document.getElementById('btnFwd').onclick = forward;
document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight') forward();
  else if (e.key === 'ArrowLeft') back();
});

// ── Start (nach defer-Scripts + Audio-Modul) ──
window.addEventListener('load', function(){
  document.getElementById('btnBackLbl').textContent = ui().back;
  document.getElementById('btnFwdLbl').textContent = ui().fwd;
  LIST = buildList();
  bindSwipe();
  warmVoice();
  pointer = 0; ensureStep(0); deckLayout();
});
</script>
<!-- Audio (ES-Modul am Root) → window.spkSpeak/spkWarm. Fallback steckt in audio.js. -->
<script type="module">
  import { speak, warm } from '/audio.js';
  window.spkSpeak = speak;
  window.spkWarm  = warm;
</script>
<script src="sprichwort.js" defer></script>
<script src="uebung.js" defer></script>
<script src="capy-vivo.js" defer></script>
<script src="nav.js" defer></script>
</body>
</html>
