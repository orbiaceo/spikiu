<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spikiu · Abo</title>
<link rel="stylesheet" href="/fonts/spikiu-fonts.css">
<style>
:root{--minz:#eef7f1;--ink:#15163a;--muted:#5f7068;--sky:#d3eef6;--mint:#cdeee2;--mustard:#ffd24a;--cyan:#1f93b0;--pink:#ff4f9a;--terra:#ff6b5a;--sage:#9bd14a;--ow:2.5px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--minz);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;line-height:1.5;padding-bottom:3rem}
.badge{position:fixed;top:.5rem;right:.7rem;z-index:50;font:700 .56rem/1 'DM Mono',monospace;background:rgba(255,255,255,.92);border:2px solid var(--ink);padding:.3rem .55rem;border-radius:999px;box-shadow:2px 2px 0 var(--ink)}
.top{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.1rem calc(1rem - 2px);border-bottom:var(--ow) solid var(--ink);background:rgba(255,255,255,.85);position:sticky;top:0;z-index:5}
.back{width:36px;height:36px;border-radius:999px;border:2.5px solid var(--ink);background:#fff;font-size:1.2rem;box-shadow:2px 2px 0 var(--ink);cursor:pointer}
.brand{font-family:'DM Sans';font-weight:800;font-size:1.05rem}
.wrap{max-width:620px;margin:0 auto;padding:1.4rem 1.1rem}
.card{background:#fff;border:var(--ow) solid var(--ink);border-radius:24px;box-shadow:5px 6px 0 var(--ink);padding:1.6rem 1.4rem;margin-bottom:1.5rem}
.tag{display:inline-block;font:800 .62rem/1 'DM Sans';letter-spacing:.13em;text-transform:uppercase;color:var(--ink);background:var(--mustard);border:2px solid var(--ink);border-radius:999px;padding:.24rem .6rem;box-shadow:2px 2px 0 var(--ink);margin-bottom:1rem}
.tag.free{background:var(--sky)}
.prem-card .tag{background:#c7e89a}
.free-card h2 em{color:var(--cyan)}
.prem-card h2 em{color:#4e7a2e}
h2{font-family:'DM Sans';font-weight:800;font-size:clamp(1.5rem,5vw,2rem);line-height:1.12;letter-spacing:-.01em;margin-bottom:1.3rem}
h2 em{font-style:normal}
.item{display:flex;gap:.9rem;align-items:flex-start;padding:.85rem 0;border-bottom:1.5px solid #e6efe8}
.item:last-of-type{border-bottom:none}
.item .ic{flex:0 0 30px;width:30px;height:30px;border-radius:9px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:1rem;margin-top:.1rem}
.free-card .item .ic{background:var(--sky)}
.prem-card .item .ic{background:#c7e89a}
.item h4{font-family:'DM Sans';font-weight:700;font-size:.98rem;margin-bottom:.15rem}
.item p{font-size:.85rem;color:var(--muted);line-height:1.55}
.price-row{display:flex;align-items:center;justify-content:space-between;margin-top:1.6rem;flex-wrap:wrap;gap:1rem}
.price{font-family:'Archivo Black',sans-serif;font-size:2.4rem;line-height:1;color:var(--ink)}
.price span{font-family:'DM Sans';font-weight:500;font-size:.82rem;color:var(--muted);margin-left:.4rem}
.btn{display:inline-block;color:#fff;padding:.85rem 2rem;border-radius:100px;font:700 1rem 'DM Sans';text-decoration:none;border:var(--ow) solid var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.free-card .btn{background:var(--cyan)}
.prem-card .btn{background:#ffd24a;color:var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--ink);border:2px solid var(--ink);border-radius:14px;overflow:hidden;margin-top:1rem}
.cmp .col{background:#d3eef6;padding:1rem 1.1rem}
.cmp .col.you{background:#c7e89a}
.cmp .lbl{font:700 .64rem/1 'DM Sans';letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);margin-bottom:.5rem;display:block}
.cmp .col.you .lbl{color:#4e7a2e}
.cmp .tx{font-size:.85rem;color:var(--muted);line-height:1.6}
.cmp .col.you .tx{color:var(--ink)}
.note{font-size:.8rem;color:var(--muted);font-weight:600;margin-top:.9rem}
.foot{border-top:var(--ow) solid var(--ink);background:#fff;padding:1.3rem 1.1rem calc(1.3rem + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.6rem;margin-top:.5rem}
.foot .fb{font:800 1rem 'DM Sans',sans-serif}
.foot .fl{display:flex;gap:1rem}
.foot .fl a{font-size:.8rem;font-weight:600;color:var(--muted);text-decoration:none}
</style></head>
<body>
<div class="top"><button class="back" id="back" onclick="window.history.length>1?window.history.back():window.location.href='mein.html'" aria-label="Zurück">‹</button><span class="brand">Spikiu</span><span style="width:36px"></span></div>
<div class="wrap">

  <div class="card free-card" id="free">
    <span class="tag free">Free</span>
    <h2 data-t="freeH"></h2>
    <div class="item"><span class="ic">🎭</span><div><h4 data-t="f1h"></h4><p data-t="f1p"></p></div></div>
    <div class="item"><span class="ic">🧭</span><div><h4 data-t="f2h"></h4><p data-t="f2p"></p></div></div>
    <div class="item"><span class="ic">📖</span><div><h4 data-t="f3h"></h4><p data-t="f3p"></p></div></div>
    <div class="item"><span class="ic">🃏</span><div><h4 data-t="f4h"></h4><p data-t="f4p"></p></div></div>
    <div class="item"><span class="ic">📜</span><div><h4 data-t="f5h"></h4><p data-t="f5p"></p></div></div>
    <div class="item"><span class="ic">🪅</span><div><h4 data-t="f6h"></h4><p data-t="f6p"></p></div></div>
    <div class="item"><span class="ic">🌱</span><div><h4 data-t="f7h"></h4><p data-t="f7p"></p></div></div>
    <div class="note" data-t="freeNote"></div>
    <div class="price-row"><div class="price">€0 <span data-t="freePrice"></span></div><a class="btn" href="haus.html" data-t="freeBtn"></a></div>
  </div>

  <div class="card prem-card" id="premium">
    <span class="tag">Premium</span>
    <h2 data-t="premH"></h2>
    <div class="item"><span class="ic">💬</span><div><h4 data-t="p1h"></h4><p data-t="p1p"></p></div></div>
    <div class="item"><span class="ic">📖</span><div><h4 data-t="p2h"></h4><p data-t="p2p"></p></div></div>
    <div class="item"><span class="ic">✍️</span><div><h4 data-t="p3h"></h4><p data-t="p3p"></p></div></div>
    <div class="item"><span class="ic">📓</span><div><h4 data-t="p4h"></h4><p data-t="p4p"></p></div></div>
    <div class="cmp"><div class="col"><span class="lbl">Free</span><div class="tx" data-t="cmpFree"></div></div><div class="col you"><span class="lbl">Premium</span><div class="tx" data-t="cmpPrem"></div></div></div>
    <div class="note" data-t="note"></div>
    <div class="price-row"><div class="price">€5,90 <span data-t="premPrice"></span></div><a class="btn" id="premBtn" href="#" data-t="premBtn"></a></div>
  </div>

</div>
<footer class="foot"><span class="fb">Spikiu</span><div class="fl"><a href="#" data-t="imp"></a><a href="#" data-t="dsg"></a></div></footer>
<script>
/* ── Sprache = Muttersprache des Lerners (Leo, 08.10.2026) ──
   Reihenfolge: Profil (spikiu_user) → Sprachschalter der Landing (spikiu_lang)
   → Browser → Englisch. Nur de/es/en; alles andere fällt auf Englisch
   (Lingua franca). */
(function(){
  var TX={
    de:{ title:'Spikiu · Abo', back:'Zurück',
      freeH:'Alles zum <em>Reinkommen</em> —<br>kostenlos.',
      f1h:'Geführtes Gespräch', f1p:'Übe Alltagsszenen im Dialog, Schritt für Schritt.',
      f2h:'Dein Lernweg', f2p:'Dein persönlicher Plan aus dem Einstieg.',
      f3h:'Lernroman', f3p:'Eine Geschichte, die mit deiner Etappe wächst. Tipp ein Wort an, nimm es mit.',
      f4h:'Wortschatz', f4p:'Deine gesammelten Wörter, im ruhigen Deck.',
      f5h:'Wendungen &amp; Sprichwörter', f5p:'Wie man wirklich spricht — mit Kultur dahinter.',
      f6h:'Spiele', f6p:'Neun Spiele im Spielzimmer: Feines Ohr, Der Schlag, Wortkette, Akrostichon, Spikius Garten, Memory, Piñata, Luftballons, Auf dem Markt. Das Spiel des Tages ist immer frei, ebenso das Spiel am Ende jeder geführten Szene; 14 Tage lang sind alle frei.',
      f7h:'Dein Buch', f7p:'Was du betrittst, schreibt sich Seite für Seite in dein eigenes Buch.',
      freeNote:'Dazu eine einmalige Kostprobe von Premium: frei sprechen, lesen, schreiben.',
      freePrice:'keine Karte nötig', freeBtn:'Loslegen',
      premH:'Spikiu <em>antwortet</em> dir.<br>Frei.',
      p1h:'Freies Gespräch', p1p:'Rede mit Spikiu, wann und worüber du willst.',
      p2h:'Lesewerkstatt', p2p:'Texte auf deiner Etappe, mit Fragen und Rückmeldung.',
      p3h:'Schreibwerkstatt', p3p:'Du schreibst, Spikiu liest mit und zeigt dir, wie es klingt.',
      p4h:'Deine Lektionen', p4p:'Aus deinen Gesprächen wird eine Lektion, zum Behalten.',
      cmpFree:'Du übst auf Wegen, die Spikiu für dich vorbereitet hat.', cmpPrem:'Spikiu reagiert auf alles, was du sagst und schreibst.',
      note:'Enthält alles aus Free.', premPrice:'/ Monat · jederzeit kündbar', premBtn:'Premium holen',
      imp:'Impressum', dsg:'Datenschutz' },
    es:{ title:'Spikiu · Suscripción', back:'Atrás',
      freeH:'Todo para <em>entrar</em> —<br>gratis.',
      f1h:'Conversación guiada', f1p:'Practica escenas cotidianas en diálogo, paso a paso.',
      f2h:'Tu ruta', f2p:'Tu plan personal, hecho a partir de tu primer encuentro.',
      f3h:'Novela para aprender', f3p:'Una historia que crece con tu etapa. Toca una palabra y llévatela.',
      f4h:'Vocabulario', f4p:'Las palabras que vas reuniendo, en un mazo tranquilo.',
      f5h:'Giros &amp; Proverbios', f5p:'Cómo se habla de verdad, con la cultura detrás.',
      f6h:'Juegos', f6p:'Nueve juegos en la sala de juegos: Oído fino, El golpe, Encadenado, Acróstico, El huerto de Spikiu, Memoria, Piñata, Globos, Al mercado. El juego del día siempre es gratis, igual que el juego al final de cada escena guiada; durante 14 días, todos.',
      f7h:'Tu libro', f7p:'Lo que vas viviendo se escribe, página a página, en un libro solo tuyo.',
      freeNote:'Además, un adelanto único de Premium: hablar, leer y escribir libremente.',
      freePrice:'sin tarjeta', freeBtn:'Empezar',
      premH:'Spikiu te <em>responde</em>.<br>Libremente.',
      p1h:'Conversación libre', p1p:'Habla con Spikiu cuando quieras y de lo que quieras.',
      p2h:'Taller de lectura', p2p:'Textos a tu medida, con preguntas y comentarios.',
      p3h:'Taller de escritura', p3p:'Tú escribes; Spikiu lee contigo y te muestra cómo suena.',
      p4h:'Tus lecciones', p4p:'De tus conversaciones sale una lección para guardar.',
      cmpFree:'Practicas en caminos que Spikiu ha preparado para ti.', cmpPrem:'Spikiu reacciona a todo lo que dices y escribes.',
      note:'Incluye todo lo de Free.', premPrice:'/ mes · cancela cuando quieras', premBtn:'Quiero Premium',
      imp:'Aviso legal', dsg:'Privacidad' },
    en:{ title:'Spikiu · Plans', back:'Back',
      freeH:'Everything to <em>get in</em> —<br>for free.',
      f1h:'Guided conversation', f1p:'Practise everyday scenes in dialogue, step by step.',
      f2h:'Your path', f2p:'Your personal plan, built from your first session.',
      f3h:'Learning Novel', f3p:'A story that grows with your stage. Tap a word, take it with you.',
      f4h:'Vocabulary', f4p:'The words you collect, in a calm deck.',
      f5h:'Phrases &amp; Proverbs', f5p:'How people really talk, with the culture behind it.',
      f6h:'Games', f6p:'Nine games in the games room: Sharp Ear, The Beat, Word Chain, Acrostic, Spikiu’s Garden, Memory, Piñata, Balloons, At the Market. The game of the day is always free, as is the game at the end of every guided scene; for 14 days, all of them are.',
      f7h:'Your book', f7p:'What you step into is written, page by page, into a book of your own.',
      freeNote:'Plus a one-time taste of Premium: speak, read and write freely.',
      freePrice:'no card needed', freeBtn:'Get started',
      premH:'Spikiu <em>answers</em> you.<br>Freely.',
      p1h:'Free conversation', p1p:'Talk with Spikiu whenever and about whatever you like.',
      p2h:'Reading Workshop', p2p:'Texts at your stage, with questions and feedback.',
      p3h:'Writing Workshop', p3p:'You write; Spikiu reads along and shows you how it sounds.',
      p4h:'Your lessons', p4p:'Your conversations become a lesson to keep.',
      cmpFree:'You practise on paths Spikiu has prepared for you.', cmpPrem:'Spikiu responds to everything you say and write.',
      note:'Includes everything in Free.', premPrice:'/ month · cancel anytime', premBtn:'Get Premium',
      imp:'Imprint', dsg:'Privacy' }
  };
  function kurz(v){
    v=String(v||'').toLowerCase();
    if(v.indexOf('es')===0||v.indexOf('span')>-1) return 'es';
    if(v.indexOf('de')===0||v.indexOf('deut')>-1||v.indexOf('germ')>-1) return 'de';
    if(v.indexOf('en')===0||v.indexOf('engl')>-1) return 'en';
    return '';
  }
  function sprache(){
    try{
      var u=JSON.parse(localStorage.getItem('spikiu_user')||'{}')||{};
      var p=u.profile||{};
      var m=kurz(p.muttersprache)||kurz(u.nativeLang)||kurz(p.nativeLang);
      if(m) return m;
      var s=kurz(localStorage.getItem('spikiu_lang'));
      if(s) return s;
    }catch(e){}
    return kurz(navigator.language)||'en';
  }
  var L=sprache(), T=TX[L];
  document.documentElement.lang=L;
  document.title=T.title;
  document.getElementById('back').setAttribute('aria-label',T.back);
  var els=document.querySelectorAll('[data-t]');
  for(var i=0;i<els.length;i++){ var k=els[i].getAttribute('data-t'); if(T[k]!=null) els[i].innerHTML=T[k]; }
  var subj={de:'Spikiu Premium',es:'Spikiu Premium',en:'Spikiu Premium'}[L];
  document.getElementById('premBtn').href='mailto:spikiuapp@gmail.com?subject='+encodeURIComponent(subj);
})();
</script>
</body></html>
